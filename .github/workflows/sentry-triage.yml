name: Sentry Auto-Triage

on:
  schedule:
    # Run every 6 hours
    - cron: '15 0,6,12,18 * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5


      - name: Checkout core data
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'

      - name: Triage Sentry issues
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: broadway-scorecard
          # BRO-5593: real errors are filed as Linear cards (the board), not
          # GitHub issues. Same secret check-corpus-drift.yml uses.
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        run: node scripts/triage-sentry.js

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: 'Sentry Auto-Triage Failed'
          discord_webhook: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
          resend_api_key: ${{ secrets.RESEND_API_KEY }}
          owner_email: ${{ secrets.OWNER_EMAIL }}
