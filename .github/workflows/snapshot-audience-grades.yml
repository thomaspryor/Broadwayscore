name: Snapshot Audience Grades

# Captures audience-grade snapshots at fixed points before/after Tony Awards.
# These snapshots preserve "what audience scores looked like AT VOTING TIME"
# so future Tony Predictions backtests aren't biased by post-Tony halo ratings
# accumulating on winners.

on:
  schedule:
    # Weekly during Tony awards season (April 1 → June 30)
    # Cron runs every Tuesday at 14:00 UTC (10am ET) — covers nominee window
    - cron: '0 14 * 4-6 2'
  workflow_dispatch:
    inputs:
      season:
        description: 'Tony season (e.g. 2025-26). Default: current season.'
        required: false
        type: string
      tag:
        description: 'Snapshot tag (e.g. pre-noms, post-precursors, day-of). Default: ISO date.'
        required: false
        type: string
      include_eligible:
        description: 'Include all season-eligible shows (not just Tony nominees). Useful pre-nominations.'
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  actions: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Checkout core data
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'

      - name: Take audience-grade snapshot
        env:
          INPUT_SEASON: ${{ inputs.season }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          ARGS=""
          if [ -n "${INPUT_SEASON}" ]; then ARGS="$ARGS --season=${INPUT_SEASON}"; fi
          if [ -n "${INPUT_TAG}" ]; then ARGS="$ARGS --tag=${INPUT_TAG}"; fi
          if [ "${{ inputs.include_eligible }}" != "false" ]; then ARGS="$ARGS --include-eligible"; fi
          echo "Running: node scripts/snapshot-audience-grades.js $ARGS"
          node scripts/snapshot-audience-grades.js $ARGS

      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/audience-snapshots/
          if git diff --cached --quiet; then
            echo "No new snapshot to commit"
            exit 0
          fi
          git commit -m "snapshot: audience grades $(date -u +%Y-%m-%d)"
          bash scripts/lib/push-with-retry.sh

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: 'Snapshot Audience Grades Failed'
          severity: 'warning'
