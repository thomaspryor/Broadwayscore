name: Audit Touring Contamination (LLM)

on:
  schedule:
    # Weekly dry-run, Sunday 09:07 UTC (off-round minute per workflow guidance).
    # Scheduled runs always dry-run — apply is manual-only via workflow_dispatch.
    - cron: '7 9 * * 0'
  workflow_dispatch:
    inputs:
      market:
        description: 'Market to audit'
        required: false
        type: choice
        default: 'broadway'
        options: ['broadway', 'west-end']
      mode:
        description: 'Run mode'
        required: false
        type: choice
        default: 'dry-run'
        options: ['dry-run', 'apply']
      provider:
        description: 'LLM provider'
        required: false
        type: choice
        default: 'claude'
        options: ['claude', 'openai', 'gemini']
      limit:
        description: 'Max LLM calls (0 = unlimited)'
        required: false
        default: '0'
      concurrency:
        description: 'Parallel LLM calls'
        required: false
        default: '5'
      show_filter:
        description: 'Single show ID or partial match (optional)'
        required: false
        default: ''
      allow_tbd_regressions:
        description: 'Required in apply mode if any shows would fall below hasEnoughReviews() threshold'
        required: false
        type: boolean
        default: false

# Detects reviews filed under a show ID that are actually about a different
# production — tour/regional/out-of-market/pre-transfer tryout. Supports
# --market=broadway (default) and --market=west-end.
#
# Distinct from verify-existing-reviews.yml: that workflow skips reviews already
# stamped verifiedBy:llm:* (so Gemini-classified-clean reviews are never re-checked).
# This workflow re-verifies the heuristic-suspect set regardless of prior stamps.
#
# Apply mode writes wrongProduction:true to high-confidence verdicts and chains
# a rebuild to refresh reviews.json + scoring filters. The score-impact preflight
# aborts apply if any shows would fall below hasEnoughReviews() threshold unless
# allow_tbd_regressions is set.

concurrency:
  group: audit-touring-contamination-${{ github.event.inputs.market || 'broadway' }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Checkout core data
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}

      - name: Checkout review-texts (private repo)
        uses: ./.github/actions/checkout-review-texts
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Configure git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Determine effective inputs
        id: inputs
        run: |
          # Scheduled runs always dry-run. Manual runs use workflow inputs.
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "market=broadway" >> $GITHUB_OUTPUT
            echo "mode=dry-run" >> $GITHUB_OUTPUT
            echo "provider=claude" >> $GITHUB_OUTPUT
            echo "limit=0" >> $GITHUB_OUTPUT
            echo "concurrency=5" >> $GITHUB_OUTPUT
            echo "show_filter=" >> $GITHUB_OUTPUT
            echo "allow_tbd_regressions=false" >> $GITHUB_OUTPUT
          else
            echo "market=${{ inputs.market || 'broadway' }}" >> $GITHUB_OUTPUT
            echo "mode=${{ inputs.mode || 'dry-run' }}" >> $GITHUB_OUTPUT
            echo "provider=${{ inputs.provider || 'claude' }}" >> $GITHUB_OUTPUT
            echo "limit=${{ inputs.limit || '0' }}" >> $GITHUB_OUTPUT
            echo "concurrency=${{ inputs.concurrency || '5' }}" >> $GITHUB_OUTPUT
            echo "show_filter=${{ inputs.show_filter || '' }}" >> $GITHUB_OUTPUT
            echo "allow_tbd_regressions=${{ inputs.allow_tbd_regressions || 'false' }}" >> $GITHUB_OUTPUT
          fi

      - name: Run touring contamination audit
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MARKET: ${{ steps.inputs.outputs.market }}
          MODE: ${{ steps.inputs.outputs.mode }}
          PROVIDER: ${{ steps.inputs.outputs.provider }}
          LIMIT: ${{ steps.inputs.outputs.limit }}
          CONCURRENCY: ${{ steps.inputs.outputs.concurrency }}
          SHOW_FILTER: ${{ steps.inputs.outputs.show_filter }}
          ALLOW_TBD_REGRESSIONS: ${{ steps.inputs.outputs.allow_tbd_regressions }}
        run: |
          ARGS="--market=$MARKET --provider=$PROVIDER --concurrency=$CONCURRENCY"
          if [ "$MODE" = "apply" ]; then
            ARGS="$ARGS --apply"
          fi
          if [ "$ALLOW_TBD_REGRESSIONS" = "true" ]; then
            ARGS="$ARGS --allow-tbd-regressions"
          fi
          if [ "$LIMIT" != "0" ]; then
            ARGS="$ARGS --limit=$LIMIT"
          fi
          if [ -n "$SHOW_FILTER" ]; then
            ARGS="$ARGS --show=$SHOW_FILTER"
          fi
          echo "Running: node scripts/audit-touring-contamination.js $ARGS"
          node scripts/audit-touring-contamination.js $ARGS

      - name: Upload audit report
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: touring-contamination-report-${{ steps.inputs.outputs.market }}
          path: data/audit/touring-contamination-report.${{ steps.inputs.outputs.market }}.json
          retention-days: 30

      - name: Push review-texts to private repo
        if: ${{ steps.inputs.outputs.mode == 'apply' && always() }}
        uses: ./.github/actions/push-review-texts
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
          message: "data: Touring contamination audit (${{ steps.inputs.outputs.market }}) — flag wrongProduction"

      - name: Trigger rebuild
        if: ${{ steps.inputs.outputs.mode == 'apply' && success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Triggering rebuild to refresh reviews.json with new wrongProduction flags..."
          gh workflow run "Rebuild Reviews Data" -f reason="Touring contamination audit (${{ steps.inputs.outputs.market }}) applied flags"

      - name: Summary
        if: always()
        env:
          MARKET: ${{ steps.inputs.outputs.market }}
          MODE: ${{ steps.inputs.outputs.mode }}
          PROVIDER: ${{ steps.inputs.outputs.provider }}
          LIMIT: ${{ steps.inputs.outputs.limit }}
          SHOW_FILTER: ${{ steps.inputs.outputs.show_filter }}
        run: |
          {
            echo "## Touring Contamination Audit"
            echo ""
            echo "- **Market:** $MARKET"
            echo "- **Mode:** $MODE"
            echo "- **Provider:** $PROVIDER"
            echo "- **Limit:** $LIMIT"
            if [ -n "$SHOW_FILTER" ]; then
              echo "- **Show filter:** $SHOW_FILTER"
            fi
            REPORT_PATH="data/audit/touring-contamination-report.$MARKET.json"
            if [ -f "$REPORT_PATH" ]; then
              echo ""
              echo "### Stats"
              echo '```json'
              node -e "const r = require('./$REPORT_PATH'); console.log(JSON.stringify(r._meta, null, 2));"
              echo '```'
            fi
          } >> $GITHUB_STEP_SUMMARY

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: 'Audit Touring Contamination Failed (${{ steps.inputs.outputs.market }})'
          severity: 'warning'
          discord_webhook: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
