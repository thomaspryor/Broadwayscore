# Scrape Playbill Verdict and NYC Theatre roundups
name: Scrape New Aggregators

on:
  schedule:
    # Mon-Sat 14:00 UTC (10am ET) — category-page discovery only (Steps 1-3
    # of PV: fetch the Verdict category page, match articles, fetch matched
    # articles). The per-show Google fallback (Step 4, ~135 SERP calls /
    # ~35min) is SKIPPED via --skip-google-fallback on these runs. Daily
    # catches new mid-week OB roundup articles (The Maids, Heated Rivalry)
    # inside 24h, cheaply (~1-5 SB credits/run).
    - cron: '0 14 * * 1-6'
    # Sunday 14:00 UTC — weekly DEEP run WITH the full per-show Google
    # fallback, for the long tail of shows not on the category page. This
    # restores the original (pre-2026-05-27) weekly fallback cadence.
    - cron: '0 14 * * 0'
  workflow_dispatch:
    inputs:
      aggregator:
        description: 'Which aggregator to scrape'
        required: true
        type: choice
        options:
          - all
          - playbill-verdict
          - nyc-theatre
          - lbo-roundups
          - bww-landing
      shows:
        description: 'Comma-separated show IDs to target (empty = all shows)'
        required: false
        type: string

permissions:
  contents: write
  actions: write

# Serialize runs of this workflow. GitHub occasionally double-fires a
# heavily-delayed cron (observed 2026-05-29: '0 14 * * 1-6' produced two
# runs 1 min apart). Two concurrent runs each scrape + commit + rebuild,
# racing on the same private-repo pushes. Queue the duplicate behind the
# first instead of cancelling — cancel-in-progress would kill a run
# mid-commit and leave partial state (same reasoning as vercel-demo.yml).
concurrency:
  group: scrape-new-aggregators
  cancel-in-progress: false

jobs:
  scrape-playbill-verdict:
    if: ${{ github.event_name == 'schedule' || inputs.aggregator == 'all' || inputs.aggregator == 'playbill-verdict' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}



      - name: Checkout core data
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
      - name: Checkout review-texts (private repo)
        uses: ./.github/actions/checkout-review-texts
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
      - name: Checkout aggregator-archive (private repo)
        uses: ./.github/actions/checkout-aggregator-archive
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Scrape Playbill Verdict
        env:
          SCRAPINGBEE_API_KEY: ${{ secrets.SCRAPINGBEE_API_KEY }}
          SCRAPINGDOG_API_KEY: ${{ secrets.SCRAPINGDOG_API_KEY }}
          SCRAPER_USE_SCRAPINGDOG: '1'
          BRIGHTDATA_TOKEN: ${{ secrets.BRIGHTDATA_TOKEN }}
          BRIGHTDATA_ZONE: ${{ secrets.BRIGHTDATA_ZONE }}
        run: |
          echo "Scraping Playbill Verdict review links..."
          SHOWS_FLAG=""
          # Default: skip the expensive per-show Google fallback (Step 4).
          SKIP_FLAG="--skip-google-fallback"
          if [ -n "${{ inputs.shows }}" ]; then
            SHOWS_FLAG="--shows=${{ inputs.shows }}"
            SKIP_FLAG=""   # targeted runs go straight to Google by design
            echo "Targeted mode: ${{ inputs.shows }}"
          fi
          # Sunday weekly deep cron OR any manual dispatch → run the full
          # Google fallback. Mon-Sat daily cron keeps SKIP_FLAG set.
          if [ "${{ github.event.schedule }}" = "0 14 * * 0" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SKIP_FLAG=""
            echo "Deep run: per-show Google fallback ENABLED"
          else
            echo "Daily run: per-show Google fallback skipped (category-page discovery only)"
          fi
          node scripts/scrape-playbill-verdict.js $SHOWS_FLAG $SKIP_FLAG

      - name: Push review-texts to private repo (PV)
        if: always()
        uses: ./.github/actions/push-review-texts
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
          message: "data: Playbill Verdict scrape"
      - name: Push aggregator-archive to private repo (PV)
        if: always()
        uses: ./.github/actions/push-aggregator-archive
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
          message: "data: Playbill Verdict aggregator archive"

      # Commit the unmatched-articles audit log to the public repo. The
      # downstream rebuild job re-checks out main and would lose this file
      # otherwise. data/audit/ is the established public-repo audit location
      # (see audit-aggregator-coverage.yml for the same pattern).
      - name: Commit Playbill Verdict unmatched-articles audit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/audit/playbill-verdict-unmatched.json 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "data: Playbill Verdict unmatched articles audit [skip ci]"
            bash scripts/lib/push-with-retry.sh
          else
            echo "No unmatched-articles changes to commit"
          fi

  scrape-nyc-theatre:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [scrape-playbill-verdict]
    if: ${{ always() && (github.event_name == 'schedule' || inputs.aggregator == 'all' || inputs.aggregator == 'nyc-theatre') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}



      - name: Checkout core data
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
      - name: Checkout review-texts (private repo)
        uses: ./.github/actions/checkout-review-texts
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
      - name: Checkout aggregator-archive (private repo)
        uses: ./.github/actions/checkout-aggregator-archive
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Scrape NYC Theatre roundups
        env:
          SCRAPINGBEE_API_KEY: ${{ secrets.SCRAPINGBEE_API_KEY }}
          SCRAPINGDOG_API_KEY: ${{ secrets.SCRAPINGDOG_API_KEY }}
          SCRAPER_USE_SCRAPINGDOG: '1'
        run: |
          echo "Scraping NYC Theatre review roundups..."
          SHOWS_FLAG=""
          if [ -n "${{ inputs.shows }}" ]; then
            SHOWS_FLAG="--shows=${{ inputs.shows }}"
            echo "Targeted mode: ${{ inputs.shows }}"
          fi
          node scripts/scrape-nyc-theatre-roundups.js $SHOWS_FLAG

      - name: Push review-texts to private repo (NYC)
        if: always()
        uses: ./.github/actions/push-review-texts
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
          message: "data: NYC Theatre roundup scrape"
      - name: Push aggregator-archive to private repo (NYC)
        if: always()
        uses: ./.github/actions/push-aggregator-archive
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
          message: "data: NYC Theatre aggregator archive"

  scrape-lbo-roundups:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [scrape-nyc-theatre]
    if: ${{ always() && (github.event_name == 'schedule' || inputs.aggregator == 'all' || inputs.aggregator == 'lbo-roundups') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout core data
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
      - name: Checkout review-texts (private repo)
        uses: ./.github/actions/checkout-review-texts
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
      - name: Checkout aggregator-archive (private repo)
        uses: ./.github/actions/checkout-aggregator-archive
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Scrape LBO roundups
        env:
          BRIGHTDATA_TOKEN: ${{ secrets.BRIGHTDATA_TOKEN }}
          BRIGHTDATA_ZONE: ${{ secrets.BRIGHTDATA_ZONE }}
          SCRAPINGBEE_API_KEY: ${{ secrets.SCRAPINGBEE_API_KEY }}
          SCRAPINGDOG_API_KEY: ${{ secrets.SCRAPINGDOG_API_KEY }}
          SCRAPER_USE_SCRAPINGDOG: '1'
        run: |
          echo "Scraping London Box Office review roundups..."
          SHOWS_FLAG=""
          if [ -n "${{ inputs.shows }}" ]; then
            SHOWS_FLAG="--shows=${{ inputs.shows }}"
            echo "Targeted mode: ${{ inputs.shows }}"
          fi
          node scripts/scrape-london-box-office-roundups.js $SHOWS_FLAG

      - name: Push review-texts to private repo (LBO)
        if: always()
        uses: ./.github/actions/push-review-texts
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
          message: "data: LBO roundup scrape"
      - name: Push aggregator-archive to private repo (LBO)
        if: always()
        uses: ./.github/actions/push-aggregator-archive
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
          message: "data: LBO roundup aggregator archive"

  # BWW /reviews/ landing-page discovery: scrape the visible REVIEW ROUNDUPS
  # section, match URLs to shows.json, dispatch matched shows through the
  # existing per-show BWW roundup pipeline. Catches roundups the per-show
  # Google search misses (e.g., Heated Rivalry 2026-05-26).
  scrape-bww-landing:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [scrape-lbo-roundups]
    if: ${{ always() && (github.event_name == 'schedule' || inputs.aggregator == 'all' || inputs.aggregator == 'bww-landing') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout core data
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
      - name: Checkout review-texts (private repo)
        uses: ./.github/actions/checkout-review-texts
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
      - name: Checkout aggregator-archive (private repo)
        uses: ./.github/actions/checkout-aggregator-archive
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: BWW landing-page roundup discovery
        env:
          BRIGHTDATA_TOKEN: ${{ secrets.BRIGHTDATA_TOKEN }}
          BRIGHTDATA_ZONE: ${{ secrets.BRIGHTDATA_ZONE }}
          SCRAPINGBEE_API_KEY: ${{ secrets.SCRAPINGBEE_API_KEY }}
          SCRAPINGDOG_API_KEY: ${{ secrets.SCRAPINGDOG_API_KEY }}
          SCRAPER_USE_SCRAPINGDOG: '1'
        run: node scripts/scrape-bww-reviews.js --landing-discover

      - name: Push review-texts to private repo (BWW landing)
        if: always()
        uses: ./.github/actions/push-review-texts
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
          message: "data: BWW landing-page roundup scrape"
      - name: Push aggregator-archive to private repo (BWW landing)
        if: always()
        uses: ./.github/actions/push-aggregator-archive
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
          message: "data: BWW landing-page roundup archive"

      - name: Commit BWW unmatched-roundups audit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/audit/bww-roundup-unmatched.json 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "data: BWW landing-page unmatched roundups audit [skip ci]"
            bash scripts/lib/push-with-retry.sh
          else
            echo "No BWW unmatched-roundups changes to commit"
          fi

  # Rebuild reviews.json after aggregator data is committed
  rebuild:
    needs: [scrape-playbill-verdict, scrape-nyc-theatre, scrape-lbo-roundups, scrape-bww-landing]
    if: always() && (needs.scrape-playbill-verdict.result == 'success' || needs.scrape-nyc-theatre.result == 'success' || needs.scrape-lbo-roundups.result == 'success' || needs.scrape-bww-landing.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}



      - name: Checkout core data
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
      - name: Checkout review-texts (private repo)
        uses: ./.github/actions/checkout-review-texts
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Rebuild reviews.json
        run: node scripts/rebuild-all-reviews.js


      - name: Push review-texts to private repo
        if: always()
        uses: ./.github/actions/push-review-texts
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
          message: "data: Scrape New Aggregators — Commit and push rebuilt reviews.json"
      - name: Commit and push rebuilt reviews.json
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/audit/
          git diff --staged --quiet || git commit -m "data: Auto-rebuild reviews.json after aggregator scrape"

          bash scripts/lib/push-with-retry.sh


      - name: Push core data to private repo
        if: always()
        uses: ./.github/actions/push-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
          message: 'data: Update from scrape-new-aggregators'
      - name: Auto-trigger text collection if needed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NEEDS_COLLECTION=$(node -e '
            const fs = require("fs"), path = require("path");
            const base = "data/review-texts";
            let n = 0;
            const dirs = fs.readdirSync(base).filter(d => {
              try { return fs.statSync(path.join(base, d)).isDirectory(); } catch { return false; }
            });
            dirs.forEach(d => {
              fs.readdirSync(path.join(base, d)).filter(f => f.endsWith(".json") && f !== "failed-fetches.json").forEach(f => {
                try {
                  const r = JSON.parse(fs.readFileSync(path.join(base, d, f), "utf8"));
                  if (r.wrongProduction || r.wrongShow || r.wrongAttribution) return;
                  if (r.url && (!r.fullText || r.fullText.length < 50)) n++;
                } catch {}
              });
            });
            console.log(n);
          ')

          echo "Reviews needing text collection: $NEEDS_COLLECTION"

          # For targeted show runs, always trigger collection (even for 1 review)
          # For broad runs, use higher threshold to avoid noise
          if [ -n "${{ inputs.shows }}" ]; then
            THRESHOLD=1
          else
            THRESHOLD=20
          fi
          if [ "$NEEDS_COLLECTION" -lt "$THRESHOLD" ]; then
            echo "Below threshold ($THRESHOLD). Skipping."
            exit 0
          fi

          RUNNING=$(gh run list --workflow=collect-review-texts.yml --status=in_progress --json databaseId --jq 'length' 2>/dev/null || echo "0")
          QUEUED=$(gh run list --workflow=collect-review-texts.yml --status=queued --json databaseId --jq 'length' 2>/dev/null || echo "0")
          WAITING=$(gh run list --workflow=collect-review-texts.yml --status=waiting --json databaseId --jq 'length' 2>/dev/null || echo "0")
          ACTIVE=$((RUNNING + QUEUED + WAITING))
          if [ "$ACTIVE" -gt 0 ]; then
            echo "Text collection already active ($RUNNING running, $QUEUED queued). Skipping."
            exit 0
          fi

          SHOWS="${{ inputs.shows }}"
          if [ -n "$SHOWS" ]; then
            echo "Triggering targeted text collection for shows: $SHOWS ($NEEDS_COLLECTION reviews)..."
            gh workflow run collect-review-texts.yml \
              -f show_filter="$SHOWS" \
              -f max_reviews=300 \
              -f browserbase_enabled=true \
              -f retry_failed=true \
              -f archive_first=true
          else
            echo "Triggering text collection for $NEEDS_COLLECTION reviews..."
            gh workflow run collect-review-texts.yml \
              -f max_reviews=300 \
              -f browserbase_enabled=true \
              -f retry_failed=true \
              -f archive_first=true
          fi

          echo "Text collection auto-triggered."

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: 'Playbill/NYC Theatre Scraper Failed'
          discord_webhook: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
          resend_api_key: ${{ secrets.RESEND_API_KEY }}
          owner_email: ${{ secrets.OWNER_EMAIL }}
