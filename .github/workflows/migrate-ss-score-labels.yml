name: Migrate SS Score Labels

# One-time migration: relabel Show Score star ratings from 'explicit-rating'
# to 'show-score-stars'. Safe to run multiple times (idempotent).
# Delete this workflow after migration is confirmed complete.

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/checkout-review-texts
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run migration
        run: node scripts/migrate-ss-score-labels.js

      - uses: ./.github/actions/push-review-texts
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
          message: 'fix: Relabel SS star ratings from explicit-rating to show-score-stars'

      - name: Trigger rebuild
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run "Rebuild Reviews Data" -f reason="Post SS score label migration"
          echo "Rebuild triggered"
