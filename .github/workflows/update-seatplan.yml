name: Update SeatPlan Data

on:
  schedule:
    # Weekly on Sundays at 3 PM UTC (10 AM EST), after Theatr at 2 PM
    - cron: '0 15 * * 0'
  workflow_dispatch:
    inputs:
      show:
        description: 'Single show ID to update (e.g., hamilton-west-end-2021)'
        required: false
        type: string
      shows:
        description: 'Comma-separated show IDs (e.g., show1,show2). Overrides show.'
        required: false
        type: string
      dry_run:
        description: 'Dry run (no writes)'
        required: false
        type: boolean
        default: false

concurrency:
  # Per-run concurrency prevents the orchestrator's back-to-back dispatches from
  # dropping each other at GitHub's 1-pending-queue limit. Shared groups silently
  # discard the middle runs — same class of bug as the Cats 2026-04-07 poller
  # postmortem (scheduled opening-night orchestrator fires 2 BW runs in parallel
  # and each audience scraper dispatch must survive independently).
  group: seatplan-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape-seatplan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Checkout core data
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Run SeatPlan scraper
        env:
          BRIGHTDATA_TOKEN: ${{ secrets.BRIGHTDATA_TOKEN }}
          BRIGHTDATA_ZONE: ${{ secrets.BRIGHTDATA_ZONE }}
        run: |
          DRY_RUN_FLAG=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
          fi

          if [ -n "${{ inputs.shows }}" ]; then
            IFS=',' read -ra SHOW_IDS <<< "${{ inputs.shows }}"
            for sid in "${SHOW_IDS[@]}"; do
              echo "Running SeatPlan for: $sid"
              node scripts/scrape-seatplan-audience.js --show="$sid" $DRY_RUN_FLAG || true
            done
            exit 0
          fi

          ARGS=""
          if [ -n "${{ inputs.show }}" ]; then
            ARGS="$ARGS --show=${{ inputs.show }}"
          fi
          ARGS="$ARGS $DRY_RUN_FLAG"

          # shellcheck disable=SC2086
          node scripts/scrape-seatplan-audience.js $ARGS

      # NOTE: snapshot-overwrite step removed 2026-07-19. /tmp/core-data-snapshot/ is
      # the checkout-time baseline push-core-data diffs against (2beb6617c58);
      # overwriting it with the scraper's output made audience-buzz.json read as
      # "untouched" and silently skipped from the private-repo push. audience-buzz.json
      # is gitignored here, so the push-with-retry git-checkout this defended
      # against never touches it.

      - name: Push core data to private repo
        if: always() && inputs.dry_run != true
        uses: ./.github/actions/push-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
          message: 'data: Update from update-seatplan'

      - name: Dispatch deploy
        if: always() && inputs.dry_run != true
        uses: ./.github/actions/dispatch-deploy

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: 'Update SeatPlan Data Failed'
          discord_webhook: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
          resend_api_key: ${{ secrets.RESEND_API_KEY }}
          owner_email: ${{ secrets.OWNER_EMAIL }}
