name: Fetch Guardian Reviews via API

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max reviews to process (0 = all)'
        required: false
        default: '0'
        type: string
      shows:
        description: 'Comma-separated show IDs to process (empty = all)'
        required: false
        default: ''
        type: string
      dry_run:
        description: 'Dry run (do not save changes)'
        required: false
        default: false
        type: boolean
      backfill_ratings:
        description: 'Re-query API for star ratings on reviews that already have text'
        required: false
        default: false
        type: boolean

# Run weekly to catch any new Guardian reviews
  schedule:
    - cron: '0 8 * * 3' # Wednesdays at 8 AM UTC

jobs:
  fetch-guardian:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}



      - name: Checkout core data
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
      - name: Checkout review-texts (private repo)
        uses: ./.github/actions/checkout-review-texts
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Fetch Guardian reviews
        env:
          GUARDIAN_API_KEY: ${{ secrets.GUARDIAN_API_KEY }}
        run: |
          ARGS=""

          if [ "${{ github.event.inputs.limit }}" != "0" ] && [ -n "${{ github.event.inputs.limit }}" ]; then
            ARGS="$ARGS --limit=${{ github.event.inputs.limit }}"
          fi

          if [ -n "${{ github.event.inputs.shows }}" ]; then
            ARGS="$ARGS --shows=${{ github.event.inputs.shows }}"
          fi

          if [ "${{ github.event.inputs.dry_run }}" == "true" ]; then
            ARGS="$ARGS --dry-run"
          fi

          if [ "${{ github.event.inputs.backfill_ratings }}" == "true" ]; then
            ARGS="$ARGS --backfill-ratings"
          fi

          node scripts/fetch-guardian-reviews.js $ARGS

      - name: Rebuild reviews.json
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: node scripts/rebuild-all-reviews.js


      - name: Push review-texts to private repo
        if: always()
        uses: ./.github/actions/push-review-texts
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
          message: "data: Fetch Guardian Reviews via API — Commit changes"
      - name: Commit changes
        if: always() && github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"

          # Core data files pushed to private repo by push-core-data action

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: Fetch Guardian reviews via API

            Co-Authored-By: Claude Opus 4.5 <noreply@anthropic.com>"

            bash scripts/lib/push-with-retry.sh
          fi


      - name: Push core data to private repo
        if: always()
        uses: ./.github/actions/push-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
          message: 'data: Update from fetch-guardian-reviews'

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: 'Guardian Reviews Failed'
          discord_webhook: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
          resend_api_key: ${{ secrets.RESEND_API_KEY }}
          owner_email: ${{ secrets.OWNER_EMAIL }}