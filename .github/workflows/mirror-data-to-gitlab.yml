# hygiene-push-ok: force-pushes to external GitLab remote (different host, push-with-retry.sh is GitHub-origin-only)
name: Mirror Core Data to GitLab

on:
  workflow_run:
    workflows:
      - "Rebuild Reviews Data"
      - "Weekly Broadway Grosses"
      - "Update Show Status"
      - "Opening Night Broadcast"
    types: [completed]
    branches: [main]
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours
  workflow_dispatch:

concurrency:
  group: gitlab-mirror-data
  cancel-in-progress: true

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Mirror clone from GitHub
        run: |
          git clone --mirror "https://x-access-token:${GH_PAT}@github.com/thomaspryor/broadway-scorecard-data.git" repo.git
        env:
          GH_PAT: ${{ secrets.REVIEW_TEXTS_TOKEN }}

      - name: Ensure GitLab repo exists
        run: |
          # Create repo if it doesn't exist (idempotent — 400 if already exists)
          curl -s -o /dev/null -w "%{http_code}" \
            -H "PRIVATE-TOKEN: ${GITLAB_TOKEN}" \
            "https://gitlab.com/api/v4/groups/${GITLAB_NAMESPACE}/projects" \
            -d "name=broadway-scorecard-data&visibility=private" || true
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_MIRROR_TOKEN }}
          GITLAB_NAMESPACE: ${{ vars.GITLAB_NAMESPACE }}

      - name: Unprotect main branch (allow force push)
        run: |
          PROJECT=$(echo "${GITLAB_NAMESPACE}/broadway-scorecard-data" | sed 's/\//%2F/g')
          curl -s -X DELETE -H "PRIVATE-TOKEN: ${GITLAB_TOKEN}" \
            "https://gitlab.com/api/v4/projects/${PROJECT}/protected_branches/main" || true
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_MIRROR_TOKEN }}
          GITLAB_NAMESPACE: ${{ vars.GITLAB_NAMESPACE }}

      - name: Push to GitLab
        run: |
          cd repo.git
          git push --force "https://oauth2:${GITLAB_TOKEN}@gitlab.com/${GITLAB_NAMESPACE}/broadway-scorecard-data.git" \
            'refs/heads/*:refs/heads/*' 'refs/tags/*:refs/tags/*' 2>&1
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_MIRROR_TOKEN }}
          GITLAB_NAMESPACE: ${{ vars.GITLAB_NAMESPACE }}

      - name: Checkout for notify action
        if: failure()
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            .github/actions/notify-failure
            scripts/lib/discord-notify.js

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: 'Core Data Mirror Failed'
          discord_webhook: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
          resend_api_key: ${{ secrets.RESEND_API_KEY }}
          owner_email: ${{ secrets.OWNER_EMAIL }}

      - name: Verify mirror is in sync
        run: |
          GITHUB_SHA=$(cd repo.git && git rev-parse refs/heads/main)
          GITLAB_SHA=$(git ls-remote "https://oauth2:${GITLAB_TOKEN}@gitlab.com/${GITLAB_NAMESPACE}/broadway-scorecard-data.git" main | cut -f1)
          if [ "$GITHUB_SHA" != "$GITLAB_SHA" ]; then
            echo "::error::Mirror out of sync! GitHub=$GITHUB_SHA GitLab=$GITLAB_SHA"
            exit 1
          fi
          echo "Mirror verified: $GITHUB_SHA"
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_MIRROR_TOKEN }}
          GITLAB_NAMESPACE: ${{ vars.GITLAB_NAMESPACE }}
