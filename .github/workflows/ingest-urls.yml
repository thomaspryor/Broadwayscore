name: Ingest Review URLs

on:
  workflow_dispatch:
    inputs:
      show_id:
        description: 'Show ID (e.g., dog-day-afternoon-2026)'
        required: true
        type: string
      urls:
        description: 'Review URLs, one per line. Optional: append outlet ID after space.'
        required: true
        type: string
      no_fetch:
        description: 'Skip text fetching (create stub files for later collection)'
        required: false
        type: boolean
        default: false
      no_rebuild:
        description: 'Skip triggering scoring/rebuild/deploy'
        required: false
        type: boolean
        default: false
      dry_run:
        # Smoke-test lane (task #737): this workflow shipped and sat
        # dispatched ZERO times (checkout/core-data/review-texts/npm/scraper
        # path entirely unproven — same class as #657/#688). dry_run=true
        # passes --dry-run to ingest-urls.js, which runs the full
        # resolve/(optionally fetch)/write path and returns before writing
        # any review-text file, so nothing lands in data/review-texts and
        # there is nothing for the commit step to push. Combine with
        # no_fetch=true for a smoke run that doesn't touch the scraper stack.
        description: 'Resolve + (optionally fetch) only — skip writing review files and the commit/push (CI smoke test)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  # dry_run gets its OWN lane per show (add-requested-show.yml precedent,
  # task #722) so an operator smoke test can never queue behind — and
  # silently cancel — a real in-flight ingestion for the same show.
  group: ingest-urls-${{ inputs.show_id }}${{ inputs.dry_run == true && '-dry-run' || '' }}
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Checkout core data
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}

      - name: Checkout review texts
        uses: ./.github/actions/checkout-review-texts
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Write URL file
        run: |
          # Write URLs to file — GitHub Actions preserves newlines in string inputs
          # when dispatched via API/CLI. The UI textarea may collapse them to spaces,
          # so we also split on spaces as a fallback for single-line input.
          INPUT_URLS="${{ inputs.urls }}"
          echo "$INPUT_URLS" | tr ' ' '\n' | sed 's/^[[:space:]]*//' | grep -v '^\s*$' > /tmp/ingest-urls.txt
          echo "URLs to ingest:"
          cat /tmp/ingest-urls.txt
          echo "---"
          LINES=$(grep -cv '^\s*$\|^\s*#' /tmp/ingest-urls.txt || echo "0")
          echo "Non-empty, non-comment lines: $LINES"

      - name: Run ingestion
        env:
          BRIGHTDATA_TOKEN: ${{ secrets.BRIGHTDATA_TOKEN }}
          BRIGHTDATA_ZONE: ${{ secrets.BRIGHTDATA_ZONE }}
          SCRAPINGBEE_API_KEY: ${{ secrets.SCRAPINGBEE_API_KEY }}
          SCRAPINGDOG_API_KEY: ${{ secrets.SCRAPINGDOG_API_KEY }}
          SCRAPER_USE_SCRAPINGDOG: '1'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FLAGS=""
          if [ "${{ inputs.no_fetch }}" = "true" ]; then
            FLAGS="$FLAGS --no-fetch"
          fi
          if [ "${{ inputs.no_rebuild }}" = "true" ]; then
            FLAGS="$FLAGS --no-rebuild"
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            FLAGS="$FLAGS --dry-run"
          fi

          node scripts/ingest-urls.js \
            --show="${{ inputs.show_id }}" \
            --urls=/tmp/ingest-urls.txt \
            --verbose \
            $FLAGS

      - name: Commit new review files
        # Skipped on dry_run: --dry-run never writes a review-text file, so
        # there is nothing to commit — and skipping keeps the smoke test
        # provably incapable of pushing even if a future edit changed that.
        if: always() && inputs.dry_run != true
        run: |
          cd data/review-texts
          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "data: Ingest URLs for ${{ inputs.show_id }}"
            bash ../../scripts/lib/push-with-retry.sh 5 main
          fi

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: 'URL Ingestion Failed'
          severity: 'warning'
          discord_webhook: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
