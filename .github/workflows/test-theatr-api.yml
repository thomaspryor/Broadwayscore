name: Test Theatr API
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Test Theatr API
        env:
          THEATR_REFRESH_TOKEN: ${{ secrets.THEATR_REFRESH_TOKEN }}
        run: |
          node -e "
          const https = require('https');
          const body = JSON.stringify({ refreshToken: process.env.THEATR_REFRESH_TOKEN });
          const req = https.request({
            hostname: 'appapi.theatr-app.com', path: '/v1/auth/access-tokens', method: 'POST',
            headers: { 'content-type': 'application/json', 'user-agent': 'Theatr/184 CFNetwork/3860.400.51 Darwin/25.3.0', 'content-length': Buffer.byteLength(body) }
          }, res => {
            let d = '';
            res.on('data', c => d += c);
            res.on('end', () => {
              const data = JSON.parse(d);
              if (!data.success) { console.log('AUTH_FAILED:', data.message); return; }
              console.log('AUTH_OK');
              const showBody = JSON.stringify({ filters: [{field:'genreCategory',op:'==',value:'Theatre'}], orderBy: [{field:'totalWatchedUsers',direction:'desc'}], pageSize: 2 });
              const showReq = https.request({
                hostname: 'appapi.theatr-app.com', path: '/shows/query', method: 'POST',
                headers: { 'content-type': 'application/json', 'user-agent': 'Theatr/184 CFNetwork/3860.400.51 Darwin/25.3.0', authorization: 'Bearer ' + data.content.accessToken, 'content-length': Buffer.byteLength(showBody) }
              }, res2 => {
                let d2 = '';
                res2.on('data', c => d2 += c);
                res2.on('end', () => {
                  const shows = JSON.parse(d2);
                  if (shows.success) {
                    shows.content.records.forEach(r => {
                      console.log('SHOW:', r.name);
                      console.log('KEYS:', Object.keys(r).sort().join(', '));
                      Object.entries(r).forEach(([k,v]) => {
                        if (typeof v === 'string' && (v.startsWith('http') || /image|poster|photo|art|cover|thumb|hero|banner|media|picture/i.test(k))) {
                          console.log('  ' + k + ':', v.slice(0,200));
                        }
                      });
                    });
                  } else { console.log('QUERY_FAILED:', JSON.stringify(shows).slice(0,200)); }
                });
              });
              showReq.write(showBody); showReq.end();
            });
          });
          req.write(body); req.end();
          "
