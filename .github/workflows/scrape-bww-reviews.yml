name: Scrape BWW Reviews

on:
  schedule:
    - cron: '0 13 * * 0'  # Weekly Sundays 1 PM UTC (after existing scrapers)
  workflow_dispatch:
    inputs:
      type:
        description: 'Page type to scrape'
        required: true
        type: choice
        options:
          - all
          - reviews
          - roundup
        default: all
      shows:
        description: 'Comma-separated show IDs (empty = all shows)'
        required: false
        type: string
      limit:
        description: 'Max shows to process'
        required: false
        type: string
        default: '200'
      force:
        description: 'Override cache freshness check'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}



      - name: Checkout core data
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
      - name: Checkout review-texts (private repo)
        uses: ./.github/actions/checkout-review-texts
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
      - name: Checkout aggregator-archive (private repo)
        uses: ./.github/actions/checkout-aggregator-archive
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Configure git for checkpointing
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Scrape BWW reviews
        env:
          SCRAPINGBEE_API_KEY: ${{ secrets.SCRAPINGBEE_API_KEY }}
        run: |
          FLAGS="--type=${{ inputs.type || 'all' }}"
          if [ -n "${{ inputs.shows }}" ]; then
            FLAGS="$FLAGS --shows=${{ inputs.shows }}"
          fi
          if [ -n "${{ inputs.limit }}" ]; then
            FLAGS="$FLAGS --limit=${{ inputs.limit }}"
          fi
          if [ "${{ inputs.force }}" = "true" ]; then
            FLAGS="$FLAGS --force"
          fi
          echo "Running: node scripts/scrape-bww-reviews.js $FLAGS"
          node scripts/scrape-bww-reviews.js $FLAGS


      - name: Push review-texts to private repo
        if: always()
        uses: ./.github/actions/push-review-texts
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
          message: "data: Scrape BWW Reviews — Final commit and push"
      - name: Push aggregator-archive to private repo
        if: always()
        uses: ./.github/actions/push-aggregator-archive
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
          message: "data: BWW reviews scrape (aggregator archive)"

  rebuild:
    needs: [scrape]
    if: always() && needs.scrape.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}



      - name: Checkout core data
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
      - name: Checkout review-texts (private repo)
        uses: ./.github/actions/checkout-review-texts
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Rebuild reviews.json
        env:
          ALLOW_DRIFT: 'true'
        run: node scripts/rebuild-all-reviews.js


      - name: Push review-texts to private repo
        if: always()
        uses: ./.github/actions/push-review-texts
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
          message: "data: Scrape BWW Reviews — Commit and push rebuilt reviews.json"
      - name: Commit and push rebuilt reviews.json
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/audit/
          git diff --staged --quiet || git commit -m "data: Auto-rebuild reviews.json after BWW scrape"

          MAX_RETRIES=5
          RETRY_COUNT=0
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            echo "Push attempt $((RETRY_COUNT + 1)) of $MAX_RETRIES"
            git checkout -- . 2>/dev/null || true
            git clean -fd 2>/dev/null || true
            if git pull --rebase -X theirs origin main; then
              if git push origin main; then
                echo "Successfully pushed changes"
                exit 0
              fi
            else
              echo "Rebase failed, aborting and retrying..."
              git rebase --abort 2>/dev/null || true
            fi
            RETRY_COUNT=$((RETRY_COUNT + 1))
            if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
              WAIT_TIME=$((10 + RANDOM % 20))
              echo "Waiting $WAIT_TIME seconds before retry..."
              sleep $WAIT_TIME
              git fetch origin main
            fi
          done
          echo "Failed to push after $MAX_RETRIES attempts"
          exit 1


      - name: Push core data to private repo
        if: always()
        uses: ./.github/actions/push-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
          message: 'data: Update from scrape-bww-reviews'
      - name: Auto-trigger text collection if needed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NEEDS_COLLECTION=$(node -e '
            const fs = require("fs"), path = require("path");
            const base = "data/review-texts";
            let n = 0;
            const dirs = fs.readdirSync(base).filter(d => {
              try { return fs.statSync(path.join(base, d)).isDirectory(); } catch { return false; }
            });
            dirs.forEach(d => {
              fs.readdirSync(path.join(base, d)).filter(f => f.endsWith(".json") && f !== "failed-fetches.json").forEach(f => {
                try {
                  const r = JSON.parse(fs.readFileSync(path.join(base, d, f), "utf8"));
                  if (r.wrongProduction || r.wrongShow || r.wrongAttribution) return;
                  if (r.url && (!r.fullText || r.fullText.length < 50)) n++;
                } catch {}
              });
            });
            console.log(n);
          ')

          echo "Reviews needing text collection: $NEEDS_COLLECTION"

          THRESHOLD=20
          if [ "$NEEDS_COLLECTION" -lt "$THRESHOLD" ]; then
            echo "Below threshold ($THRESHOLD). Skipping."
            exit 0
          fi

          RUNNING=$(gh run list --workflow="Collect Review Texts" --status=in_progress --json databaseId --jq 'length' 2>/dev/null || echo "0")
          if [ "$RUNNING" -gt 0 ]; then
            echo "Text collection already running. Skipping."
            exit 0
          fi

          SHOWS="${{ inputs.shows }}"
          if [ -n "$SHOWS" ]; then
            echo "Triggering targeted text collection for shows: $SHOWS ($NEEDS_COLLECTION reviews)..."
            gh workflow run "Collect Review Texts" \
              -f show_filter="$SHOWS" \
              -f max_reviews=300 \
              -f browserbase_enabled=true \
              -f retry_failed=true \
              -f archive_first=true
          else
            echo "Triggering text collection for $NEEDS_COLLECTION reviews..."
            gh workflow run "Collect Review Texts" \
              -f max_reviews=300 \
              -f browserbase_enabled=true \
              -f retry_failed=true \
              -f archive_first=true
          fi

          echo "Text collection auto-triggered."

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: 'BWW Reviews Scraper Failed'
          discord_webhook: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
          resend_api_key: ${{ secrets.RESEND_API_KEY }}
          owner_email: ${{ secrets.OWNER_EMAIL }}
