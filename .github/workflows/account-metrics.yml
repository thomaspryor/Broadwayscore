name: Account Metrics

# Accounts went live 2026-10-04 (BRO-4525). This keeps the owner's
# /admin/accounts page current and pages them when sign-in or saving breaks
# (BRO-4615).
#
#   metrics (every 3 h): scripts/account-metrics.js reads Supabase with the
#     service role (counts only; no emails or ids leave the job) and PostHog
#     HogQL, then pushes analytics/account-dashboard.json to the PRIVATE
#     core-data repo, where /api/admin/account-stats reads it. Account numbers
#     never enter this public repo. The 24-hour health numbers go through
#     owner-alert-router.js (once per incident; resolved when they clear).
#   signin-check (daily): scripts/check-signin-redirects.mjs clicks "Continue
#     with Google" / "Continue with Apple" on the live site and checks each
#     still reaches the provider's sign-in page. Signs nobody in.
#
# Dry run of the sign-in alert: dispatch with simulate=signin-stalled. It
# prints the alert that would fire and sends nothing.
on:
  schedule:
    - cron: '17 */3 * * *'   # metrics
    - cron: '41 7 * * *'     # signin-check (also runs the metrics job)
    # BRO-7463 predict-weekly: Friday 12:45 ET. Two crons cover EST and EDT; the script only
    # sends on Friday from 12:00 ET and once per ET day, so a late or doubled run is safe.
    - cron: '45 16 * * 5'
    - cron: '45 17 * * 5'
  workflow_dispatch:
    inputs:
      redispatched:
        # BRO-5152: set by scripts/cron-redispatch.js when GitHub dropped the scheduled run.
        # Runs the 3-hourly metrics job only, never the 07:41 signin-check job.
        description: 'Internal: re-dispatch of a dropped scheduled run (behaves like the cron)'
        required: false
        default: 'false'
        type: string
      simulate:
        description: 'Dry-run an alert instead of a real run (sends nothing)'
        required: false
        default: 'none'
        type: choice
        options: ['none', 'signin-stalled']
      signin_check:
        description: 'Also run the Google/Apple sign-in start check'
        required: false
        default: false
        type: boolean
      predict_weekly:
        description: 'Send the Predict the Score count email to the owner now'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    # Same group for both jobs' ledger commits is not needed: push-with-retry
    # rebases, and alert-ledger.json is an apiFallbackMerge file.
    concurrency:
      group: account-metrics
      cancel-in-progress: false
    # ~6 HogQL statements; a PostHog 504 takes ~5 min and each is retried once.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
      - uses: ./.github/actions/setup-node

      - name: Dry run (simulate)
        if: inputs.simulate == 'signin-stalled'
        run: |
          # routealert-linear-key-ok: --simulate turns SEND_ALERTS off (account-metrics.js), so this step never calls routeAlert
          node scripts/account-metrics.js --simulate=signin-stalled --out=account-metrics

      - name: Checkout core data (private repo for the dashboard payload)
        if: inputs.simulate != 'signin-stalled'
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}

      - name: Build numbers + route alerts
        if: inputs.simulate != 'signin-stalled'
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        run: node scripts/account-metrics.js --out=account-metrics

      # Private repo only. Same retry/rebase policy as analyze-traffic-sources.yml
      # (only analytics/ is ours, so the rebase is conflict-free).
      # hygiene-push-ok: pushes to the external private-repo checkout in /tmp —
      # push-with-retry.sh targets the main workspace checkout and can't be reused here.
      - name: Save dashboard data (private repo)
        if: always() && inputs.simulate != 'signin-stalled'
        run: |
          # BRO-6029: git_net caps each fetch/pull/push so a hung transfer fails that attempt instead of waiting for the job timeout.
          . "${GITHUB_WORKSPACE}/scripts/lib/git-net-timeout.sh" 2>/dev/null || git_net() { shift; git "$@"; }
          if [ ! -f account-metrics/account-dashboard.json ]; then
            echo "No dashboard this run (see the previous step) — private repo left as is."
            exit 0
          fi
          if [ ! -d /tmp/core-data-checkout/.git ]; then
            echo "::error::dashboard built but the core-data clone is missing — cannot save it"
            exit 1
          fi
          mkdir -p /tmp/core-data-checkout/analytics
          cp account-metrics/account-dashboard.json /tmp/core-data-checkout/analytics/
          cd /tmp/core-data-checkout
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add analytics/account-dashboard.json
          if git diff --staged --quiet; then
            echo "Dashboard unchanged."
            exit 0
          fi
          git commit -m "analytics: account dashboard ($(date -u +%Y-%m-%dT%H:%MZ))"
          for i in 1 2 3 4 5; do
            if git_net 180 push origin HEAD:main; then exit 0; fi
            if [ "$i" = "5" ]; then echo "::error::push failed after 5 attempts"; exit 1; fi
            sleep $((i * 3 + RANDOM % 5))
            if ! git_net 300 -c "merge.ours.driver=bash '$GITHUB_WORKSPACE/scripts/lib/merge-keep-run.sh' B %O %A %B %P" pull --rebase -X theirs origin main; then
              git rebase --abort 2>/dev/null || true
              git reset --hard "@{u}" 2>/dev/null || true
              echo "::error::rebase onto the new private main failed; dashboard not saved this run"
              exit 1
            fi
          done

      # routeAlert's ledger must persist or every run starts cold and the
      # once-per-incident rule never holds. One commit for all three files
      # (see audit-imageless-scored-shows.yml for why it must not be split).
      - name: Commit alert ledger
        if: always() && inputs.simulate != 'signin-stalled'
        env:
          PUSH_DEADLINE_SEC: '600'
          GIT_NET_TIMEOUT_SEC: '30'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/audit/alert-ledger.json data/audit/alert-digest-queue.json data/audit/alert-router-attempts.jsonl 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No ledger changes"
          else
            git commit -m "data: account-metrics alert ledger [skip ci]

          Co-Authored-By: github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
            bash scripts/lib/push-with-retry.sh
          fi

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: 'Account Metrics Failed'
          severity: 'warning'

  signin-check:
    # Never during a dry run: this job routes real alerts.
    # BRO-5152: a re-dispatch (inputs.redispatched) replaces a 3-hourly metrics
    # tick; it never runs the signin check.
    if: (github.event.schedule == '41 7 * * *' || (inputs.signin_check == true && inputs.redispatched != 'true')) && inputs.simulate != 'signin-stalled'
    runs-on: ubuntu-latest
    concurrency:
      group: account-signin-check
      cancel-in-progress: false
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/setup-playwright
        with:
          browsers: chromium

      - name: Check Google + Apple sign-in starts
        id: check
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        run: node scripts/check-signin-redirects.mjs --json=signin-check.json --route-alerts

      - name: Commit alert ledger
        if: always()
        env:
          PUSH_DEADLINE_SEC: '600'
          GIT_NET_TIMEOUT_SEC: '30'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/audit/alert-ledger.json data/audit/alert-digest-queue.json data/audit/alert-router-attempts.jsonl 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No ledger changes"
          else
            git commit -m "data: sign-in check alert ledger [skip ci]

          Co-Authored-By: github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
            bash scripts/lib/push-with-retry.sh
          fi

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: signin-check-${{ github.run_id }}
          path: signin-check.json
          retention-days: 14
          if-no-files-found: warn

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: 'Sign-in Check Failed'
          severity: 'warning'

  # BRO-7463: owner's Friday Predict the Score count email. Counts only; Resend transactional to
  # OWNER_EMAIL, never a broadcast. A dispatch also ticks the metrics job above (harmless).
  predict-weekly:
    if: (github.event.schedule == '45 16 * * 5' || github.event.schedule == '45 17 * * 5' || inputs.predict_weekly == true) && inputs.redispatched != 'true' && inputs.simulate != 'signin-stalled'
    runs-on: ubuntu-latest
    concurrency:
      group: predict-weekly
      cancel-in-progress: false
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
      - uses: ./.github/actions/setup-node
      - name: Checkout core data (owner address list)
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
          sparse: 'true'
      - name: Send Predict the Score count email
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
          SCHEDULED: ${{ github.event_name == 'schedule' }}
        run: |
          # A manual dispatch always sends; the schedule only sends on Friday from noon ET.
          if [ "$SCHEDULED" = "true" ]; then GATE="--friday-after-et-hour=12"; else GATE=""; fi
          node scripts/predict-the-score-weekly.js $GATE
      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: 'Predict the Score Weekly Email Failed'
          severity: 'warning'
