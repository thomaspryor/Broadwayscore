# Corpus-statistics drift monitor — runs the three audits that assert on live
# corpus properties (review text-quality %, local-vs-aggregator count ratios,
# content-quality regex false-positive counts). These drift continuously as the
# rebuild bots commit reviews.json / review-texts every ~30 min, so they are
# MONITORING, not code-correctness gates. They used to live in test.yml's
# blocking data-validation job and reddened main for non-code reasons every few
# hours. Moved here (non-blocking) 2026-06-21: writes data/audit/corpus-drift.json,
# surfaced in the daily digest by scripts/health-check.js. The catastrophe FLOOR
# (a genuine quality collapse) stays blocking in test.yml via
# `audit-text-quality.js --gate`. Never triggers rebuild or scraping.
# NOT read-only as of 2026-08-13: the first step self-heals data/cast-changes.json
# (audit-cast-changes.js --write, no scrape — it derives purely from shows.json +
# the existing file) and commits it [skip ci], because this DAILY monitor kept
# re-flagging staleness that update-cast-changes.yml's Wed/Sat scrape had not
# caught up to. That makes the cast-changes drift number mean "what could not be
# auto-healed", which is the number worth alerting on. A lost update against a
# concurrent writer is self-correcting: the next run re-derives the same state.
name: Check Corpus Drift

on:
  schedule:
    # Daily at 6:20 AM UTC — after the 4 AM rebuild + 5 AM scoring crons, so the
    # audits see the freshly-rebuilt corpus. Offset from check-review-count-drift
    # (6:00) to avoid a checkout-core-data stampede.
    - cron: '20 6 * * *'
  workflow_run:
    # Re-check right after each rebuild — drift is caused by the rebuild, not by
    # code pushes, so this is the cadence that matters.
    workflows: ['Rebuild Reviews Data']
    types: [completed]
  workflow_dispatch:
    inputs:
      strict:
        description: 'Fail the job if any audit reports drift (default: monitor only)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: check-corpus-drift
  cancel-in-progress: false

jobs:
  drift:
    name: Run corpus-statistics audits (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout core data
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}

      - name: Checkout review-texts (private repo)
        uses: ./.github/actions/checkout-review-texts
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}

      - uses: ./.github/actions/setup-node
        with:
          configure-git: 'true'

      - name: Auto-heal cast-changes.json before the drift check
        # audit-cast-changes.js --write repairs stale closure dates / collapsed
        # departures / dedupes WITHOUT needing a fresh scrape — it only reads
        # shows.json (checked out above) + the existing cast-changes.json.
        # update-cast-changes.yml's full scrape cron runs Wed/Sat only, but
        # shows.json's closingDate changes daily, so this DAILY monitor kept
        # flagging the same auto-healable staleness the twice-weekly write
        # hadn't caught up to yet (task #805/#434). Running --write here closes
        # that gap for free (no scrape cost, no new secrets).
        # Non-blocking: a heal failure must not fail a monitoring job.
        continue-on-error: true
        run: |
          node scripts/audit-cast-changes.js --write
          if git status --porcelain data/cast-changes.json | grep -q .; then
            git add data/cast-changes.json
            git commit -m "chore: Auto-heal cast-changes.json (corpus-drift self-heal) [skip ci]"
            bash scripts/lib/push-with-retry.sh
          fi

      - name: Deepen history for churn-merge-coverage audit
        # audit-churn-merge-coverage.js (run by check-corpus-drift.js) measures
        # per-file commit churn over the last 3 days. The checkout above is shallow
        # (depth 1), so fetch a 10-day window (margin over the 3-day audit window)
        # instead of full history (130k+ commits). Best-effort: if the fetch fails,
        # the audit reports degraded:true and exits 0 — it never fails this job.
        run: |
          git fetch --shallow-since="10 days ago" origin main \
            || git fetch --deepen=4000 origin main \
            || echo "::warning::history deepen failed — churn-merge-coverage will run degraded"

      - name: Run corpus-drift monitor
        run: |
          ARGS=""
          if [ "${{ inputs.strict }}" = "true" ]; then
            ARGS="$ARGS --strict"
          fi
          node scripts/check-corpus-drift.js $ARGS

      - name: Audit review-URL byline clusters (non-blocking)
        if: always()
        env:
          REVIEW_TEXTS_DIR: data/review-texts
        run: |
          # Byline-explosion detector: one review URL scraped into 5+ files under
          # different critic names. criticName-keyed dedup misses these; they
          # usually leave the real review unscored (invalid tier + circular dup),
          # which buried WhatsOnStage reviews for the concurrent 2026 Midsummers.
          # Non-blocking warning until the existing backlog is cleaned.
          OUT=$(node scripts/audit-review-url-clusters.js || true)
          echo "$OUT"
          if echo "$OUT" | grep -q "byline-explosion cluster"; then
            N=$(echo "$OUT" | head -1 | grep -oE '[0-9]+' | head -1)
            echo "::warning::review-url-cluster audit found $N byline-explosion cluster(s) — reviews likely buried/unscored. Run: node scripts/audit-review-url-clusters.js"
          fi

      - name: Audit star-rating accuracy (HARD blocking-signal, SUSPECT warning)
        if: always()
        run: |
          # Catches displayed scores that contradict the critic's published star:
          # HARD = star-governed scoreSource whose assignedScore != the star's
          # conversion (definite conversion bug); SUSPECT = LLM-scored review
          # >22pts from its captured star (miscaptured star OR a genuine
          # star/prose gap the anchored rollout will clamp). Was written
          # 2026-06 but wired into no workflow — 32 out-of-band Broadway scores
          # accumulated unseen (found 2026-07-11 during NYC rollout simulation).
          # Non-blocking (::warning) until the NYC anchoring rollout clears the
          # known backlog; flip to --gate after that lands.
          set +e
          OUT=$(node scripts/audit-star-accuracy.js 2>&1)
          RC=$?
          set -e
          echo "$OUT"
          # A crashed audit or a changed summary format must WARN, not silently
          # report zero (Codex review 2026-07-11): the summary line is the
          # contract — its absence means the audit itself is broken.
          SUMMARY=$(echo "$OUT" | grep -E 'HARD conversion bugs: [0-9]+' || true)
          if [ "$RC" -ne 0 ] || [ -z "$SUMMARY" ]; then
            echo "::warning::star-accuracy audit is BROKEN (exit=$RC, summary line missing) — no star-vs-score signal this run. Fix scripts/audit-star-accuracy.js or its data checkout."
          else
            HARD=$(echo "$SUMMARY" | grep -oE 'HARD conversion bugs: [0-9]+' | grep -oE '[0-9]+')
            SUS=$(echo "$OUT" | grep -oE 'SUSPECT captures: [0-9]+' | grep -oE '[0-9]+' || echo 0)
            if [ "${HARD:-0}" -gt 0 ]; then
              echo "::warning::star-accuracy audit: $HARD HARD conversion bug(s) — displayed score contradicts the critic's published star. Run: node scripts/audit-star-accuracy.js"
            fi
            if [ "${SUS:-0}" -gt 74 ]; then
              echo "::warning::star-accuracy audit: SUSPECT count ($SUS) grew past baseline 74 — check for a new extraction/scoring regression."
            fi
          fi

      - name: Check for changes
        id: changes
        if: always()
        run: |
          # Fires on a new or modified verdict for EITHER monitor file (porcelain
          # prints "?? path" for untracked, "M path" for modified, nothing if clean).
          if git status --porcelain data/audit/corpus-drift.json data/audit/churn-merge-coverage.json | grep -q .; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push audit
        if: always() && steps.changes.outputs.has_changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/audit/corpus-drift.json
          [ -f data/audit/churn-merge-coverage.json ] && git add data/audit/churn-merge-coverage.json
          SUMMARY=$(node -e "const d=require('./data/audit/corpus-drift.json'); console.log(d.summary.driftCount + ' drift, ' + d.summary.crashCount + ' crashed')")
          git commit -m "audit: corpus-drift monitor ($SUMMARY) [skip ci]

          Co-Authored-By: github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
          bash scripts/lib/push-with-retry.sh

      - name: Summary
        if: always()
        run: |
          if [ -f data/audit/corpus-drift.json ]; then
            echo "## Corpus Drift" >> $GITHUB_STEP_SUMMARY
            node -e "
              const d = require('./data/audit/corpus-drift.json');
              console.log('**Audits run:** ' + d.summary.auditsRun);
              console.log('**Drift:** ' + d.summary.driftCount + ' | **Crashed:** ' + d.summary.crashCount);
              console.log('');
              console.log('| Audit | Status | Exit |');
              console.log('|-------|--------|------|');
              for (const a of d.audits) {
                const s = a.crashed ? 'CRASHED' : a.ok ? 'ok' : 'drift';
                console.log('| ' + a.name + ' | ' + s + ' | ' + a.exitCode + ' |');
              }
            " >> $GITHUB_STEP_SUMMARY
          fi

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: 'Corpus Drift Monitor Failed (audit could not run)'
          severity: 'warning'
          resend_api_key: ${{ secrets.RESEND_API_KEY }}
          owner_email: ${{ secrets.OWNER_EMAIL }}
