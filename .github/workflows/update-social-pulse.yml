name: Update Social Pulse

on:
  schedule:
    # Monday 06:00 UTC (1 AM EST) — deliberately Monday, NOT Sunday. The
    # Sunday cron storm (rebuild at 04:00, audience scrapers 12:00–16:00)
    # could race this workflow. Monday is empty.
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      show:
        description: 'Single show ID to update (e.g., maybe-happy-ending-2024). Leave blank for all running shows.'
        required: false
        type: string
      dry_run:
        description: 'Dry run (no file writes, no commits)'
        required: false
        type: boolean
        default: false

concurrency:
  group: social-pulse-weekly
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-social-pulse:
    name: Fetch + score social mentions for running shows
    runs-on: ubuntu-latest
    # Free-source stack (schema v3, 2026-07): Reddit + Bluesky + X counts +
    # Wikipedia are all direct JSON APIs — a show takes seconds, not the
    # ~2 min the Apify sync-runs took. ~120 shows × (fetch + GPT-4o-mini
    # classify) + ranks + commit fits comfortably in 90.
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # fetch-depth: 0 (task #1813 — same class as task #1810's
          # update-show-status.yml fix): observed runs go as long as
          # 76 min (and multiple recent failures at ~41-44 min, each
          # failing specifically at the "Stage and commit pulse data"
          # push step) before this job's push-with-retry.sh call — deep
          # into the window where a shallow (fetch-depth 1, the default)
          # local history makes git's push-pack build against a
          # since-drifted origin/main pathologically slow (silent 90s+
          # local-compute hang, no network activity, until
          # GIT_NET_TIMEOUT_SEC kills it — see #1810's GIT_TRACE_CURL
          # trace). fetch-depth: 0 removes the shallow ambiguity; the job
          # still has 10+ min of headroom under its 90-min timeout even
          # on its longest observed run — but that margin is thinner than
          # the other two workflows fixed alongside this one. A full
          # checkout of this repo's ~2GB packed object DB normally takes
          # ~15-20s, but gitleaks.yml and guard-no-orphan-commit.yml both
          # document real incidents (2026-07-26, 2026-08) where it spiked
          # to several minutes or never finished. If checkout time grows
          # here, watch for this job trading a push-hang failure for a
          # timeout failure instead.
          fetch-depth: 0

      - name: Checkout core data
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}

      - name: Setup Node.js
        uses: ./.github/actions/setup-node

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Verify Bluesky secrets present
        # The public Bluesky AppView 403s from GitHub datacenter IPs, so the
        # authenticated fallback is REQUIRED here, not optional — without it
        # every show silently loses its Bluesky counter and the fetch script
        # aborts via the counter-coverage guard (exit 6) anyway. Fail fast
        # with a clear message instead. Create an app password at
        # bsky.app → Settings → App Passwords and add both secrets.
        env:
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
        run: |
          if [ -z "$BSKY_HANDLE" ] || [ -z "$BSKY_APP_PASSWORD" ]; then
            echo "::error::BSKY_HANDLE and BSKY_APP_PASSWORD secrets are required (Bluesky public endpoint 403s from Actions runners)."
            exit 1
          fi

      - name: Fetch social pulse for running shows
        id: fetch
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Bluesky auth — see the verify step above.
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          # Reddit fetcher needs ScrapingBee for 403 fallback (GitHub
          # datacenter IPs are blocked by reddit.com). Without this,
          # Reddit silently returns 0 mentions for every show.
          SCRAPINGBEE_API_KEY: ${{ secrets.SCRAPINGBEE_API_KEY }}
          SCRAPINGDOG_API_KEY: ${{ secrets.SCRAPINGDOG_API_KEY }}
          SCRAPER_USE_SCRAPINGDOG: '1'
          BRIGHTDATA_TOKEN: ${{ secrets.BRIGHTDATA_TOKEN }}
          # Zone must be passed explicitly — reddit-api.js's env default only
          # covers local runs; first prod run (29875151498) died on the stale
          # deleted zone because this was missing.
          BRIGHTDATA_ZONE: ${{ secrets.BRIGHTDATA_ZONE }}
          # Reddit official OAuth (preferred path — reddit-api.js uses it when
          # set and only falls back to the proxy chain without it). Mint at
          # reddit.com/prefs/apps (script app).
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          # Free X API for uncapped tweet volume counts (no Apify cost)
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          INPUT_SHOW: ${{ inputs.show }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          # Build argv as an array to avoid shellcheck SC2086 word-split
          ARGS=()
          if [ -n "$INPUT_SHOW" ]; then
            ARGS+=("--show-id=$INPUT_SHOW")
          else
            ARGS+=("--all-running")
          fi
          if [ "$INPUT_DRY_RUN" = "true" ]; then
            ARGS+=("--dry-run")
          fi

          echo "Running: node scripts/fetch-social-pulse.js ${ARGS[*]}"
          node scripts/fetch-social-pulse.js "${ARGS[@]}"

      - name: Compute cross-show ranks
        if: inputs.dry_run != 'true'
        run: |
          set -euo pipefail
          node scripts/compute-social-pulse-ranks.js

      - name: Stage and commit pulse data
        if: inputs.dry_run != 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stage only the files this workflow is responsible for:
          #   - data/social-pulse/*.json (canonical per-show files + _meta.json)
          #   - public/data/shows/*.social.json (sibling public files)
          # We do NOT touch the main public/data/shows/{id}.json files — those
          # are owned by rebuild-all-reviews.js (see CLAUDE.md "Public Show
          # JSON Safety"). This workflow is race-free by design.
          git add data/social-pulse/ public/data/shows/*.social.json 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No pulse data changes to commit."
            exit 0
          fi

          CHANGED=$(git diff --cached --name-only | wc -l | tr -d ' ')
          # Do NOT use [skip ci] — the new public/data/shows/*.social.json
          # files need to trigger a Vercel rebuild so the static pages pick
          # them up at build time (Next.js static export reads fs at build,
          # not at runtime). Without a deploy, the card would never render
          # real data.
          git commit -m "chore(social-pulse): weekly update ($CHANGED files)"

          bash scripts/lib/push-with-retry.sh 5 main

      - name: Weekly smoke test — verify known-high-volume shows have data
        if: inputs.dry_run != 'true' && inputs.show == ''
        run: |
          set -euo pipefail
          # Canary: if these high-buzz shows all got 0 mentions, something
          # broke even if the overall health check passed. Mix of Broadway
          # AND West End so a market-specific scraper failure can't go
          # undetected. Each one is a long-runner / Tony contender expected
          # to have double-digit mentions every week.
          # First-run baseline volumes (2026-04-11): MHE=118, Hamilton=109,
          # Hamilton WE=84, Hadestown WE=115, Cabaret KKC=124. The previous
          # canary "wicked-west-end-2006" was missing from the running list
          # — replaced with these confirmed live entries.
          CANARIES=(
            # Broadway
            "maybe-happy-ending-2024"
            "hamilton-2015"
            # West End
            "hamilton-west-end-2021"
            "hadestown-west-end-2024"
            "cabaret-at-the-kit-kat-club-west-end-2021"
          )
          FAILED=0
          for id in "${CANARIES[@]}"; do
            FILE="data/social-pulse/$id.json"
            if [ ! -f "$FILE" ]; then
              echo "::warning::Canary file missing: $FILE (show may not be in running list)"
              continue
            fi
            VOL=$(node -e "try { console.log(JSON.parse(require('fs').readFileSync('$FILE','utf-8')).volume || 0) } catch(e) { console.log(0) }")
            echo "Canary $id: volume=$VOL"
            if [ "$VOL" = "0" ]; then
              FAILED=$((FAILED + 1))
            fi
          done
          # Threshold: majority of canaries must fail before we ring the
          # alarm. With 5 canaries, ≥3 failures = scrapers likely broken
          # (1 missing file is normal, 2 might be transient, 3+ is real).
          if [ "$FAILED" -ge 3 ]; then
            echo "::error::$FAILED of ${#CANARIES[@]} canary shows returned 0 mentions — scrapers likely broken"
            exit 1
          fi
          echo "Smoke test passed: $((${#CANARIES[@]} - FAILED))/${#CANARIES[@]} canaries have data"

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: 'Social Pulse Weekly Failed'
          severity: 'warning'
          discord_webhook: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
