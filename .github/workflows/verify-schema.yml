name: Verify Supabase Schema

# Fails loud when a committed migration has not been applied to the prod
# database. Migrations are applied deliberately (apply-migration.yml, manual
# dispatch) — this is the fast feedback that the deliberate step was skipped.
# Before this existed, an unapplied migration surfaced only when the nightly
# UGC roundtrip 400'd on the missing column and paged the owner as a CRITICAL
# auth failure (2026-08-09, watchlist.curtain_time, run 31344422375).
#
# Checks are auto-derived from supabase/migrations/*.sql — no hand-maintained
# list to forget (scripts/lib/supabase-schema-expectations.js). The weekly cron
# additionally catches drift introduced outside git (dashboard edits, restores).

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'scripts/verify-supabase-schema.js'
      - 'scripts/lib/supabase-schema-expectations.js'
      - '.github/workflows/verify-schema.yml'
  schedule:
    - cron: '37 9 * * *' # daily 09:37 UTC (was weekly; BRO-6666: the schedule run files the fix card)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-schema
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Verify migrations applied to prod
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        # 2>&1: the missing-object and apply lines go to stderr. The log feeds the card step below.
        run: |
          set -o pipefail
          node scripts/verify-supabase-schema.js 2>&1 | tee verify-schema.log

      # BRO-6666: the notify step below is digest-only, so a 2-day-old unapplied
      # migration went unnoticed. Scheduled and manual runs file one START-NOW
      # card naming the migrations and the apply command (reused while open).
      # Never on a push run: a push fails in the normal gap between merging a
      # migration and applying it, and a worker must not race the human apply.
      # Advisory (continue-on-error): it cannot mask or change the run result.
      # A failure with no migration lines (API outage, bad token) files a generic card.
      - name: File fix card for unapplied migrations
        if: failure() && github.event_name != 'push' && vars.SCHEMA_DRIFT_CARD_DISABLED != 'true' # kill switch: repo variable
        continue-on-error: true
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/file-schema-drift-card.js verify-schema.log

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: 'Supabase schema drift — committed migration not applied to prod'
          severity: 'warning'
