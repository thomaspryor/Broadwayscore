# hygiene-push-ok: force-pushes --all + --tags to rewrite git history (purge utility, not a normal data push)
name: "Purge copyrighted/sensitive paths from git history"

# Deep clean: removes copyrighted review data and sensitive files from ALL commits.
# Paths purged:
#   - data/archives/              (archived HTML pages)
#   - data/review-texts/          (copyrighted review full texts — moved to private repo)
#   - data/master-review-list.json
#   - data/review-texts-quarantine/
#   - data/calibration/calibration-examples.json
#   - data/collected-reviews/
#   - data/mezzanine-screenshots/
#   - data/bug-reviews.json
#   - .mcp.json                   (sensitive config)
#   - data/shows.json             (competitive data — moved to private repo)
#   - data/reviews.json           (competitive data — moved to private repo)
#   - data/grosses.json           (competitive data — moved to private repo)
#   - data/grosses-history.json   (competitive data — moved to private repo)
#   - data/commercial.json        (competitive data — moved to private repo)
#   - data/audience-buzz.json     (competitive data — moved to private repo)
#   - data/critic-consensus.json  (competitive data — moved to private repo)
#   - data/critic-registry.json   (competitive data — moved to private repo)
#   - data/outlet-registry.json   (competitive data — moved to private repo)
#
# Strategy: Runs weekly Saturday 1 AM EST. Once clean, auto-exits in seconds. If other
# workflows are active, it waits up to 30 minutes for them to finish naturally.
# If they don't finish, it skips and tries again next Saturday.
#
# WARNING: After success, all local clones must run:
#   git fetch origin && git reset --hard origin/main

on:
  schedule:
    - cron: '0 6 * * 6'  # Saturday 1 AM EST (6 AM UTC)
  workflow_dispatch:

concurrency:
  group: purge-archives
  cancel-in-progress: true

jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      actions: write
    steps:
      - name: Check if purge is still needed
        id: check
        run: |
          git clone --bare --filter=blob:none https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git /tmp/check-repo
          cd /tmp/check-repo
          ALL_FILES=$(git log --all --pretty=format: --name-only 2>/dev/null || true)
          COUNT=$(echo "$ALL_FILES" | grep -cE '^(data/archives/|data/review-texts/|data/master-review-list\.json|data/review-texts-quarantine/|data/calibration/calibration-examples\.json|data/collected-reviews/|data/mezzanine-screenshots/|data/bug-reviews\.json|\.mcp\.json|data/shows\.json|data/reviews\.json|data/grosses\.json|data/grosses-history\.json|data/commercial\.json|data/audience-buzz\.json|data/critic-consensus\.json|data/critic-registry\.json|data/outlet-registry\.json)' || true)
          echo "purge_count=$COUNT" >> "$GITHUB_OUTPUT"
          if [ "$COUNT" = "0" ]; then
            echo "Nothing to purge — all target paths already clean!"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Found $COUNT refs to purge-target paths in history"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
          rm -rf /tmp/check-repo

      - name: Wait for other workflows to finish naturally
        if: steps.check.outputs.skip == 'false'
        id: wait
        run: |
          CURRENT_RUN_ID=${{ github.run_id }}
          echo "Waiting for other workflows to finish naturally (up to 30 min)..."
          for i in $(seq 1 36); do
            RUNNING=$(gh run list --status=in_progress --json databaseId --jq "[.[] | select(.databaseId != $CURRENT_RUN_ID)] | length")
            if [ "$RUNNING" -eq 0 ]; then
              echo "All clear — no other workflows running"
              echo "ready=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "($i/36) $RUNNING workflows still running, waiting 50s..."
            sleep 50
          done
          echo "Other workflows still running after 30 minutes. Skipping this week."
          echo "ready=false" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

      - name: Full clone
        if: steps.check.outputs.skip == 'false' && steps.wait.outputs.ready == 'true'
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create local branches for all remote branches
        if: steps.check.outputs.skip == 'false' && steps.wait.outputs.ready == 'true'
        run: |
          # filter-repo only rewrites local branches, so we must create local
          # tracking branches for ALL remote branches before running it
          for branch in $(git branch -r | grep -v HEAD | sed 's|origin/||'); do
            if [ "$branch" != "main" ] && ! git branch --list "$branch" | grep -q .; then
              echo "Creating local branch: $branch"
              git checkout -b "$branch" "origin/$branch" 2>/dev/null || true
            fi
          done
          git checkout main

      - name: Capture original branch + tag SHAs (for post-rewrite force-with-lease)
        if: steps.check.outputs.skip == 'false' && steps.wait.outputs.ready == 'true'
        run: |
          # Recorded BEFORE filter-repo rewrites history, so the force-push step
          # can lease against "what origin actually had when we started" instead
          # of blindly forcing. Tab-separated (not per-file) so branch/tag names
          # with slashes don't need directory creation.
          : > /tmp/orig-branch-shas.txt
          for branch in $(git branch --format='%(refname:short)'); do
            sha=$(git rev-parse "$branch" 2>/dev/null) || continue
            printf '%s\t%s\n' "$branch" "$sha" >> /tmp/orig-branch-shas.txt
          done
          : > /tmp/orig-tag-shas.txt
          for tag in $(git tag); do
            sha=$(git rev-parse "$tag" 2>/dev/null) || continue
            printf '%s\t%s\n' "$tag" "$sha" >> /tmp/orig-tag-shas.txt
          done
          echo "Captured $(wc -l < /tmp/orig-branch-shas.txt) branch SHA(s) and $(wc -l < /tmp/orig-tag-shas.txt) tag SHA(s) before filter-repo rewrite"

          # Persist beyond the job's /tmp (gone the moment the runner is torn
          # down) so a partial-failure run leaves a durable old-SHA manifest to
          # recover from, instead of "re-run the destructive rewrite again".
          {
            echo "## Original branch/tag SHAs (pre-rewrite, for manual recovery if the push step fails partway)"
            echo '```'
            echo "-- branches --"
            cat /tmp/orig-branch-shas.txt
            echo "-- tags --"
            cat /tmp/orig-tag-shas.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install git-filter-repo
        if: steps.check.outputs.skip == 'false' && steps.wait.outputs.ready == 'true'
        run: pip3 install git-filter-repo

      - name: Remove copyrighted/sensitive paths from all history
        if: steps.check.outputs.skip == 'false' && steps.wait.outputs.ready == 'true'
        run: |
          echo "Commits before: $(git log --oneline | wc -l)"
          echo "Git dir size before: $(du -sh .git | cut -f1)"

          python3 -m git_filter_repo \
            --sensitive-data-removal \
            --path data/archives/ \
            --path data/review-texts/ \
            --path data/master-review-list.json \
            --path data/review-texts-quarantine/ \
            --path data/calibration/calibration-examples.json \
            --path data/collected-reviews/ \
            --path data/mezzanine-screenshots/ \
            --path data/bug-reviews.json \
            --path .mcp.json \
            --path data/shows.json \
            --path data/reviews.json \
            --path data/grosses.json \
            --path data/grosses-history.json \
            --path data/commercial.json \
            --path data/audience-buzz.json \
            --path data/critic-consensus.json \
            --path data/critic-registry.json \
            --path data/outlet-registry.json \
            --invert-paths --force

          echo "Commits after: $(git log --oneline | wc -l)"
          echo "Git dir size after: $(du -sh .git | cut -f1)"

      - name: Force push
        id: force_push
        if: steps.check.outputs.skip == 'false' && steps.wait.outputs.ready == 'true'
        run: |
          # filter-repo removes the remote, re-add it
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git

          # Final check: make sure no workflows started during filter-repo
          CURRENT_RUN_ID=${{ github.run_id }}
          RUNNING=$(gh run list --status=in_progress --json databaseId --jq "[.[] | select(.databaseId != $CURRENT_RUN_ID)] | length")
          if [ "$RUNNING" -gt 0 ]; then
            echo "WARNING: $RUNNING workflows started during filter-repo. Proceeding with per-ref"
            echo "force-with-lease anyway — any ref that moved on origin is rejected below"
            echo "instead of clobbered (see comment above the push loop)."
          fi

          # Push each ref (branch or tag) individually with --force-with-lease
          # against the SHA captured BEFORE filter-repo ran (previous step). If a
          # ref moved on origin during the (up to ~60min) rewrite window — a
          # legit commit or tag landed there — the lease check rejects THAT
          # ref's push instead of silently overwriting it. Same failure class as
          # the 2026-07-19 incident (card #208: a stale-base force-push
          # destroyed a concurrently-landed merge commit); this closes this
          # workflow's own window for it. Tags get the same treatment as
          # branches — this repo uses them as rollback checkpoints
          # (pre-purge-web-search etc.), so a blind force here is the same
          # clobber risk, just on a lower-churn ref.
          push_with_lease() {
            local reftype="$1" name="$2" orig_sha="$3"
            local refpath ref
            case "$reftype" in
              branch) refpath="heads" ;;
              tag) refpath="tags" ;;
              *) echo "  internal error: unknown reftype '$reftype'"; return 1 ;;
            esac
            ref="refs/$refpath/$name"
            echo "=== Pushing $reftype $name (lease: $orig_sha) ==="
            for attempt in 1 2 3 4 5; do
              OUT=$(git push --force-with-lease="$ref:$orig_sha" origin "$ref" 2>&1)
              RC=$?
              echo "$OUT"
              if [ "$RC" -eq 0 ]; then
                return 0
              fi
              if echo "$OUT" | grep -qiE "stale info|rejected"; then
                echo "  ABORT: $name moved on origin during the rewrite (lease rejected) — leaving it untouched, not retrying with a stale lease"
                return 1
              fi
              echo "  transient failure (attempt $attempt) — retrying in 10s"
              sleep 10
            done
            return 1
          }

          FAILED_REFS=""
          while IFS=$'\t' read -r branch orig_sha; do
            [ -z "$branch" ] && continue
            git rev-parse --verify "$branch" >/dev/null 2>&1 || continue
            push_with_lease branch "$branch" "$orig_sha" || FAILED_REFS="$FAILED_REFS branch:$branch"
          done < /tmp/orig-branch-shas.txt

          while IFS=$'\t' read -r tag orig_sha; do
            [ -z "$tag" ] && continue
            git rev-parse --verify "$tag" >/dev/null 2>&1 || continue
            push_with_lease tag "$tag" "$orig_sha" || FAILED_REFS="$FAILED_REFS tag:$tag"
          done < /tmp/orig-tag-shas.txt

          if [ -n "$FAILED_REFS" ]; then
            echo "::error::Force-with-lease failed or was aborted for:$FAILED_REFS — these refs were NOT rewritten on origin this run. If aborted (moved-ref), a legit commit/tag landed mid-rewrite; re-run the purge next Saturday. If transient (network), investigate before next run. Pre-rewrite SHAs are in this run's step summary."
            exit 1
          fi
          echo "SUCCESS — all refs pushed with lease verification"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

      - name: Summary
        if: always()
        run: |
          if [ "${{ steps.check.outputs.skip }}" = "true" ]; then
            echo "## Purge not needed" >> "$GITHUB_STEP_SUMMARY"
            echo "All target paths already removed from history." >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.wait.outputs.ready }}" = "false" ]; then
            echo "## Skipped — other workflows active" >> "$GITHUB_STEP_SUMMARY"
            echo "Will retry next Saturday." >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.force_push.outcome }}" = "failure" ]; then
            echo "## History purge PARTIALLY FAILED" >> "$GITHUB_STEP_SUMMARY"
            echo "Some refs were not rewritten on origin this run (see the Force push step log" >> "$GITHUB_STEP_SUMMARY"
            echo "above for which, and the pre-rewrite SHA manifest earlier in this summary)." >> "$GITHUB_STEP_SUMMARY"
            echo "**Do NOT run \`git reset --hard origin/main\` from a local clone** until this" >> "$GITHUB_STEP_SUMMARY"
            echo "is resolved — origin may be a mix of rewritten and un-rewritten refs." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## History purge complete" >> "$GITHUB_STEP_SUMMARY"
            echo "GitHub GC will reclaim space within ~24 hours." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**All local clones must run:**" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "git fetch origin && git reset --hard origin/main" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: 'Purge Archives History Failed'
          discord_webhook: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
