name: LLM Ensemble Score Reviews

# Separate concurrency groups per rescore_reason allow parallel scoring of disjoint file sets.
# Default group "scoring-reviews" serializes regular runs; "scoring-reviews-{reason}" for targeted rescores.
concurrency:
  group: scoring-reviews${{ inputs.rescore_reason && format('-{0}', inputs.rescore_reason) || '' }}
  cancel-in-progress: false

on:
  schedule:
    - cron: '30 4 * * *'  # Daily at 4:30 AM UTC — after rebuild (4 AM), before adjudicate (5:15 AM)
  # Manual trigger with options
  workflow_dispatch:
    inputs:
      show_id:
        description: 'Show slug to process (leave empty for all)'
        required: false
        default: ''
      limit:
        description: 'Max reviews to process (leave empty for no limit)'
        required: false
        default: ''
      run_calibration:
        description: 'Run calibration after scoring (weekly Sunday auto-run only)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'
      run_validation:
        description: 'Run aggregator validation after scoring'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      dry_run:
        description: 'Dry run (no file changes)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      needs_rescore:
        description: 'Only rescore reviews flagged with needsRescore=true'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      rescore_reason:
        description: 'Filter rescores to this reason prefix (e.g. "fullText added" or "re-ensemble"). Enables parallel runs.'
        required: false
        default: ''
        type: string
      outdated:
        description: 'Re-score reviews with promptVersion older than current PROMPT_VERSION'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      stale_scores:
        description: 'Score reviews with stale excerpt-based scores that now have fullText'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      retry_emergency:
        description: 'Retry stuck singleModelEmergency reviews once (auto-clears flag if 2+ models succeed)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      upgrade_ensemble:
        description: 'Upgrade old single-model scores to ensemble scoring (llmScore but no ensembleData)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      rescore:
        description: 'Re-score all reviews (even already scored ones)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      chain:
        description: 'Auto-trigger next batch if unscored reviews remain'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      remaining_batches:
        description: 'Max remaining batches for chaining (decrements each run)'
        required: false
        default: '0'
      shard:
        description: 'Shard index for parallel runs (0-based)'
        required: false
        default: ''
      total_shards:
        description: 'Total number of parallel shards'
        required: false
        default: ''
      fast_rebuild:
        description: 'After scoring, dispatch rebuild-fast.yml instead of rebuild-reviews.yml. Use for /ingest UI flows where reviews must reach the live page in <20 min.'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write
  actions: write

env:
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  # OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}  # Kimi disabled — 3-model ensemble is faster and equally accurate

jobs:
  ensemble-score:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0



      - name: Checkout core data
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
      - name: Checkout review-texts (private repo)
        uses: ./.github/actions/checkout-review-texts
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Refresh review-texts before scoring
        env:
          REVIEW_TEXTS_TOKEN: ${{ secrets.REVIEW_TEXTS_TOKEN }}
        run: |
          # Review-texts was checked out at job start, but fixes may have been pushed
          # while this run was queued. Pull latest to avoid scoring stale data.
          # (Becky Shaw incident: wrongShow:false was pushed but scoring used the old checkout)
          cd data/review-texts
          git remote set-url origin "https://x-access-token:${REVIEW_TEXTS_TOKEN}@github.com/thomaspryor/broadway-review-texts.git" 2>/dev/null || true
          if [ -n "${{ github.event.inputs.show_id }}" ]; then
            # Targeted refresh: only pull the specific show directory (faster)
            echo "Refreshing review-texts for show: ${{ github.event.inputs.show_id }}"
            git fetch origin main --depth=1
            git checkout origin/main -- "${{ github.event.inputs.show_id }}/" 2>/dev/null || echo "Show directory not found in remote — using existing checkout"
          else
            # Full refresh: pull all latest changes
            echo "Refreshing all review-texts..."
            git pull origin main --rebase --quiet 2>/dev/null || echo "Pull failed — using existing checkout"
          fi
          cd ../..
          echo "Review-texts refreshed"

      - name: Check if scoring needed (scheduled runs)
        if: github.event_name == 'schedule'
        id: check-needed
        run: |
          UNSCORED=$(node -e "
            const fs = require('fs'), path = require('path');
            const base = 'data/review-texts';
            const dirs = fs.readdirSync(base).filter(d => { try { return fs.statSync(path.join(base,d)).isDirectory(); } catch(e) { return false; } });
            let n = 0;
            dirs.forEach(d => {
              fs.readdirSync(path.join(base,d)).filter(f => f.endsWith('.json') && f !== 'failed-fetches.json').forEach(f => {
                try {
                  const r = JSON.parse(fs.readFileSync(path.join(base,d,f),'utf8'));
                  if (r.wrongProduction || r.wrongShow || r.wrongAttribution) return;
                  if (r.duplicateOf || r.rejectionReason || r.isRoundupArticle) return;
                  if (r.contentTier === 'invalid') return;
                  const hasText = r.fullText && r.fullText.length > 100;
                  const hasExcerpt = r.bwwExcerpt || r.dtliExcerpt || r.showScoreExcerpt || r.pvExcerpt || r.nycExcerpt || (r.excerpt && r.excerpt.length > 50);
                  if (!hasText && !hasExcerpt) return;
                  const needsScore = !r.assignedScore && !r.llmScore && !r.humanReviewScore;
                  if (needsScore) n++;
                } catch(e) {}
              });
            });
            console.log(n);
          ")
          echo "Unscored reviews: $UNSCORED"
          echo "unscored=$UNSCORED" >> $GITHUB_OUTPUT
          # Lowered from 5 to 1 on 2026-04-11. The 5-review threshold meant
          # 1-4 unscored reviews would sit indefinitely — combined with the
          # retry-pending-scores bug (which cleared the pending flag on
          # extraction failure without leaving a marker), this let 70 orphan
          # reviews accumulate across 57 shows with a median age of 57 days
          # before being caught by validate-data.js's new silent-gap guard.
          # Running the scorer daily on even a single unscored review is fine
          # — the script has its own rate limiting and per-run limit.
          if [ "$UNSCORED" -ge 1 ]; then
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "run_rescore=false" >> $GITHUB_OUTPUT
            echo "run_stale=false" >> $GITHUB_OUTPUT
          else
            # No unscored reviews — check for reviews flagged needsRescore (highest priority fallback)
            RESCORE=$(node -e "
              const fs = require('fs'), path = require('path');
              const base = 'data/review-texts';
              const dirs = fs.readdirSync(base).filter(d => { try { return fs.statSync(path.join(base,d)).isDirectory(); } catch(e) { return false; } });
              let n = 0;
              dirs.forEach(d => {
                fs.readdirSync(path.join(base,d)).filter(f => f.endsWith('.json') && f !== 'failed-fetches.json').forEach(f => {
                  try {
                    const r = JSON.parse(fs.readFileSync(path.join(base,d,f),'utf8'));
                    if (!r.needsRescore || r.rescoreCompletedAt) return;
                    if (r.duplicateOf || r.wrongShow || r.wrongProduction || r.wrongAttribution || r.contentTier === 'invalid') return;
                    if (r.isRoundupArticle || r.rejectionReason) return;
                    if (r.showNotMentioned && !r.bwwExcerpt && !r.dtliExcerpt && !r.showScoreExcerpt) return;
                    n++;
                  } catch(e) {}
                });
              });
              console.log(n);
            ")
            echo "Reviews flagged needsRescore: $RESCORE"
            if [ "$RESCORE" -gt 0 ]; then
              echo "Found $RESCORE reviews needing rescore."
              echo "skip=false" >> $GITHUB_OUTPUT
              echo "run_rescore=true" >> $GITHUB_OUTPUT
              echo "run_stale=false" >> $GITHUB_OUTPUT
            else
              # No rescore needed — check for stale excerpt-based scores (lowest priority)
              STALE=$(node -e "
                const fs = require('fs'), path = require('path');
                const base = 'data/review-texts';
                const dirs = fs.readdirSync(base).filter(d => { try { return fs.statSync(path.join(base,d)).isDirectory(); } catch(e) { return false; } });
                let n = 0;
                dirs.forEach(d => {
                  fs.readdirSync(path.join(base,d)).filter(f => f.endsWith('.json') && f !== 'failed-fetches.json').forEach(f => {
                    try {
                      const r = JSON.parse(fs.readFileSync(path.join(base,d,f),'utf8'));
                      if (!r.fullText || r.fullText.length < 1000) return;
                      if (!r.llmScore || !r.llmScore.score) return;
                      if (r.needsRescore || r.ensembleData || r.rescoreCompletedAt) return;
                      if (r.llmMetadata && r.llmMetadata.textSource && r.llmMetadata.textSource.type === 'fullText') return;
                      if (r.bwwExcerpt || r.dtliExcerpt || r.showScoreExcerpt) n++;
                    } catch(e) {}
                  });
                });
                console.log(n);
              ")
              echo "Stale excerpt-based scores: $STALE"
              if [ "$STALE" -gt 0 ]; then
                echo "Found stale scores to sweep."
                echo "skip=false" >> $GITHUB_OUTPUT
                echo "run_rescore=false" >> $GITHUB_OUTPUT
                echo "run_stale=true" >> $GITHUB_OUTPUT
                echo "run_emergency_retry=false" >> $GITHUB_OUTPUT
              else
                # Phase 4: stuck-emergency retry (lowest priority)
                # Reviews flagged singleModelEmergency=true that haven't been auto-retried yet.
                # Most common cause: Gemini was rate-limited at original scoring time. Retry once;
                # if 2+ models succeed now, the flag clears naturally inside ensemble.ts. If still
                # single-model, retryCount=1 sticks and the next cron skips it (see scripts/llm-scoring/index.ts retryEmergency filter).
                EMERGENCY=$(node -e "
                  const fs = require('fs'), path = require('path');
                  const base = 'data/review-texts';
                  const dirs = fs.readdirSync(base).filter(d => { try { return fs.statSync(path.join(base,d)).isDirectory(); } catch(e) { return false; } });
                  let n = 0;
                  dirs.forEach(d => {
                    fs.readdirSync(path.join(base,d)).filter(f => f.endsWith('.json') && f !== 'failed-fetches.json').forEach(f => {
                      try {
                        const r = JSON.parse(fs.readFileSync(path.join(base,d,f),'utf8'));
                        const ed = r.ensembleData;
                        if (!ed || !ed.singleModelEmergency) return;
                        if ((ed.singleModelEmergencyRetryCount || 0) >= 1) return;
                        if (r.wrongProduction || r.wrongShow || r.wrongAttribution) return;
                        if (r.duplicateOf || r.rejectionReason || r.isRoundupArticle) return;
                        if (r.contentTier === 'invalid') return;
                        if (r.showNotMentioned && !r.bwwExcerpt && !r.dtliExcerpt && !r.showScoreExcerpt) return;
                        const hasText = r.fullText && r.fullText.length > 100;
                        const hasExcerpt = r.bwwExcerpt || r.dtliExcerpt || r.showScoreExcerpt || r.pvExcerpt || r.nycExcerpt || (r.excerpt && r.excerpt.length > 50);
                        if (!hasText && !hasExcerpt) return;
                        n++;
                      } catch(e) {}
                    });
                  });
                  console.log(n);
                ")
                echo "Stuck-emergency reviews eligible for retry: $EMERGENCY"
                if [ "$EMERGENCY" -gt 50 ]; then
                  # Runaway guard: a model outage that flagged dozens of reviews per day means
                  # something is systemically broken (e.g. a model API key revoked). Don't burn
                  # the daily budget retrying — alert and require manual intervention.
                  echo "::warning::Stuck-emergency count ($EMERGENCY) exceeds runaway cap (50). Auto-retry disabled — investigate before manual rescore."
                  echo "skip=true" >> $GITHUB_OUTPUT
                  echo "run_rescore=false" >> $GITHUB_OUTPUT
                  echo "run_stale=false" >> $GITHUB_OUTPUT
                  echo "run_emergency_retry=false" >> $GITHUB_OUTPUT
                elif [ "$EMERGENCY" -gt 0 ]; then
                  echo "Found $EMERGENCY stuck-emergency reviews — dispatching one-shot retry."
                  echo "skip=false" >> $GITHUB_OUTPUT
                  echo "run_rescore=false" >> $GITHUB_OUTPUT
                  echo "run_stale=false" >> $GITHUB_OUTPUT
                  echo "run_emergency_retry=true" >> $GITHUB_OUTPUT
                else
                  echo "No unscored, no rescore, no stale, no stuck-emergency. Skipping."
                  echo "skip=true" >> $GITHUB_OUTPUT
                  echo "run_rescore=false" >> $GITHUB_OUTPUT
                  echo "run_stale=false" >> $GITHUB_OUTPUT
                  echo "run_emergency_retry=false" >> $GITHUB_OUTPUT
                fi
              fi
            fi
          fi

      - name: Build CLI arguments
        id: build-args
        if: github.event_name != 'schedule' || steps.check-needed.outputs.skip != 'true'
        run: |
          ARGS="--ensemble"

          # Show filter
          if [ -n "${{ github.event.inputs.show_id }}" ]; then
            ARGS="$ARGS --show=${{ github.event.inputs.show_id }}"
          else
            ARGS="$ARGS --all"
          fi

          # Limit — scheduled runs default to 400
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            ARGS="$ARGS --limit=${{ github.event.inputs.limit }}"
          elif [ "${{ github.event_name }}" == "schedule" ]; then
            ARGS="$ARGS --limit=400"
          fi

          # Calibration — weekly only (Sunday scheduled) or manual override
          # Saves ~7 min/run by not loading 17K+ human reviews for accuracy stats
          DOW=$(date -u +%u)  # 7 = Sunday
          if [ "${{ github.event.inputs.run_calibration }}" == "true" ]; then
            ARGS="$ARGS --calibrate"
          elif [ "${{ github.event_name }}" == "schedule" ] && [ "$DOW" == "7" ]; then
            ARGS="$ARGS --calibrate"
            echo "Sunday scheduled run — including calibration"
          fi

          # Validation
          if [ "${{ github.event.inputs.run_validation }}" == "true" ]; then
            ARGS="$ARGS --validate"
          fi

          # Dry run
          if [ "${{ github.event.inputs.dry_run }}" == "true" ]; then
            ARGS="$ARGS --dry-run"
          fi

          # Needs rescore (only reviews flagged for rescoring)
          # Also auto-triggered when scheduled run detects needsRescore backlog
          if [ "${{ github.event.inputs.needs_rescore }}" == "true" ] || [ "${{ steps.check-needed.outputs.run_rescore }}" == "true" ]; then
            ARGS="$ARGS --needs-rescore"
          fi

          # Rescore reason filter (enables parallel runs for different reason buckets)
          if [ -n "${{ github.event.inputs.rescore_reason }}" ]; then
            ARGS="$ARGS --rescore-reason=${{ github.event.inputs.rescore_reason }}"
          fi

          # Outdated (rescore reviews with old prompt versions)
          if [ "${{ github.event.inputs.outdated }}" == "true" ]; then
            ARGS="$ARGS --outdated"
          fi

          # Stale scores (fullText + old excerpt-based score)
          if [ "${{ github.event.inputs.stale_scores }}" == "true" ] || [ "${{ steps.check-needed.outputs.run_stale }}" == "true" ]; then
            ARGS="$ARGS --stale-scores"
          fi

          # Retry stuck singleModelEmergency reviews (auto-clears flag if 2+ models succeed on retry)
          if [ "${{ github.event.inputs.retry_emergency }}" == "true" ] || [ "${{ steps.check-needed.outputs.run_emergency_retry }}" == "true" ]; then
            ARGS="$ARGS --retry-emergency"
          fi

          # Upgrade single-model scores to ensemble
          if [ "${{ github.event.inputs.upgrade_ensemble }}" == "true" ]; then
            ARGS="$ARGS --upgrade-ensemble"
          fi

          # Rescore all (even already scored)
          if [ "${{ github.event.inputs.rescore }}" == "true" ]; then
            ARGS="$ARGS --rescore"
          fi

          # Sharding for parallel runs
          if [ -n "${{ github.event.inputs.shard }}" ] && [ -n "${{ github.event.inputs.total_shards }}" ]; then
            ARGS="$ARGS --shard=${{ github.event.inputs.shard }} --total-shards=${{ github.event.inputs.total_shards }}"
          fi

          # Always verbose in CI
          ARGS="$ARGS --verbose"

          echo "args=$ARGS" >> $GITHUB_OUTPUT

      - name: Configure git for checkpoints
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run ensemble scoring pipeline
        if: github.event_name != 'schedule' || steps.check-needed.outputs.skip != 'true'
        run: |
          npx ts-node --project scripts/tsconfig.json scripts/llm-scoring/index.ts ${{ steps.build-args.outputs.args }}

      - name: Check for changes
        id: check-changes
        if: always() && github.event.inputs.dry_run != 'true'
        run: |
          bash scripts/lib/git-add-existing.sh data/collection-state/ data/llm-scoring-runs.json data/llm-scoring-garbage-skips.json data/audit/
          if git diff --staged --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            git diff --staged --stat
          fi
          # Check if actual review files were scored via scoring-progress.json
          # (review-texts is a nested git repo, so git diff --staged can't detect changes there)
          SCORED=$(node -e "try { const p = JSON.parse(require('fs').readFileSync('data/collection-state/scoring-progress.json','utf8')); console.log(p.processed || 0); } catch { console.log(0); }")
          if [ "$SCORED" -gt 0 ]; then
            echo "has_scored_reviews=true" >> $GITHUB_OUTPUT
            echo "Scored $SCORED review files this run"
          else
            echo "has_scored_reviews=false" >> $GITHUB_OUTPUT
            echo "No review files scored this run"
          fi

      - name: Check for large files
        if: always() && steps.check-changes.outputs.has_changes == 'true'
        uses: ./.github/actions/check-file-sizes

      - name: Push review-texts to private repo
        if: always()
        uses: ./.github/actions/push-review-texts
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
          message: "data: LLM ensemble scoring"

      - name: Commit and push changes
        if: always() && steps.check-changes.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Build commit message
          SHOW_MSG=""
          if [ -n "${{ github.event.inputs.show_id }}" ]; then
            SHOW_MSG=" for ${{ github.event.inputs.show_id }}"
          fi

          git commit -m "feat: Ensemble LLM score reviews${SHOW_MSG}

          Models: Claude Sonnet + GPT-4o + Gemini 2.0 Flash (v5)
          Triggered by: @${{ github.actor }}

          Co-Authored-By: Claude <noreply@anthropic.com>"

          # Stash unstaged changes (review-texts files modified by scoring but pushed separately)
          git stash --include-untracked --quiet 2>/dev/null || true

          # Use shared push-with-retry script (handles rebase, conflict resolution,
          # and manual field restoration). Replaces 70-line inline loop.
          bash scripts/lib/push-with-retry.sh 5 "HEAD:${{ github.ref_name }}"

          # Restore stashed changes (review-texts files for downstream steps)
          git stash pop --quiet 2>/dev/null || true

      - name: Push core data to private repo
        if: always()
        uses: ./.github/actions/push-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
          message: 'data: Update from llm-ensemble-score'

      - name: Auto-trigger rebuild for non-chain runs
        if: ${{ github.event.inputs.chain != 'true' && github.event_name != 'schedule' && github.event.inputs.dry_run != 'true' && steps.check-changes.outputs.has_changes == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Two rebuild targets:
          #   - rebuild-reviews.yml (default): full ~15 min pipeline. Shared
          #     concurrency group → "skip if active" is correct (a queued
          #     rebuild would just cancel-in-progress=false serialize anyway).
          #   - rebuild-fast.yml (fast_rebuild=true): ~5 min, per-run concurrency.
          #     Multiple concurrent runs are SAFE and intended — the per-run
          #     group exists exactly so opening-night ingests don't queue
          #     behind unrelated rebuild-fast runs (memory/feedback_gha_concurrency_queue_limit.md).
          #     So we MUST NOT skip if another rebuild-fast is in flight —
          #     ship-check 2026-04-27 caught that the old code silently
          #     swallowed the dispatch when an unrelated fast rebuild was
          #     already running, leaving freshly scored reviews unrebuilt.
          #
          # Retry-on-rate-limit (Notion 362637c5-416f-81ce, 2026-05-16): the bare
          # `gh workflow run` returned HTTP 403 once during a data session and
          # `set -e` aborted the step, silently losing the rebuild dispatch.
          # The market pages /opera, /broadway, /off-broadway, /west-end stayed
          # frozen at their last-build snapshot until a manual rebuild fired the
          # next day. Shared helper handles 403/429/secondary-rate-limit with
          # exponential backoff; rebuild-fast.yml's 4-hourly cron is the safety
          # net if all retries still fail.
          # shellcheck source=scripts/lib/dispatch-with-retry.sh
          source scripts/lib/dispatch-with-retry.sh

          if [ "${{ github.event.inputs.fast_rebuild }}" = "true" ]; then
            REBUILD_WF="rebuild-fast.yml"
            REASON="Auto-triggered after LLM scoring (fast path — admin ingest)"
            echo "Triggering $REBUILD_WF to incorporate new scores (per-run concurrency, no skip-if-active check)..."
            dispatch_with_retry "$REBUILD_WF" -f reason="$REASON" || true
            exit 0
          fi

          REBUILD_WF="rebuild-reviews.yml"
          REASON="Auto-triggered after LLM scoring"

          # Shared concurrency group on rebuild-reviews.yml — skip if active to
          # prevent multiple scoring shards each queuing their own rebuild.
          RUNNING=$(gh run list --workflow="$REBUILD_WF" --status=in_progress --json databaseId --jq 'length' 2>/dev/null || echo "0")
          QUEUED=$(gh run list --workflow="$REBUILD_WF" --status=queued --json databaseId --jq 'length' 2>/dev/null || echo "0")
          WAITING=$(gh run list --workflow="$REBUILD_WF" --status=waiting --json databaseId --jq 'length' 2>/dev/null || echo "0")
          ACTIVE=$((RUNNING + QUEUED + WAITING))
          if [ "$ACTIVE" -gt 0 ]; then
            echo "$REBUILD_WF already active ($RUNNING running, $QUEUED queued, $WAITING waiting). Skipping."
            exit 0
          fi

          echo "Triggering $REBUILD_WF to incorporate new scores..."
          dispatch_with_retry "$REBUILD_WF" -f reason="$REASON" || true

      - name: Count remaining unscored reviews
        if: always() && (github.event.inputs.chain == 'true' || github.event_name == 'schedule') && github.event.inputs.dry_run != 'true' && steps.check-needed.outputs.skip != 'true'
        id: count-remaining
        run: |
          # Count review files without llmScore (excluding unscorable: roundups, garbage, no text)
          REMAINING=$(node -e "
            const fs = require('fs'), path = require('path');
            const base = 'data/review-texts';
            let garbageSuffix = new Set();
            try {
              const g = JSON.parse(fs.readFileSync('data/llm-scoring-garbage-skips.json','utf8'));
              if (Array.isArray(g)) g.forEach(e => {
                if (e.filePath) { const m = e.filePath.match(/data\\/review-texts\\/(.+)/); if (m) garbageSuffix.add(m[1]); }
              });
            } catch {}
            const dirs = fs.readdirSync(base).filter(d => { try { return fs.statSync(path.join(base,d)).isDirectory(); } catch(e) { return false; } });
            let n = 0;
            dirs.forEach(d => {
              fs.readdirSync(path.join(base,d)).filter(f => f.endsWith('.json') && f !== 'failed-fetches.json').forEach(f => {
                try {
                  const fp = path.join(base,d,f);
                  const r = JSON.parse(fs.readFileSync(fp,'utf8'));
                  if (r.llmScore || r.wrongShow || r.wrongProduction || r.wrongAttribution) return;
                  if (r.duplicateOf || r.rejectionReason || r.isRoundupArticle) return;
                  if (r.contentTier === 'invalid') return;
                  if (garbageSuffix.has(d + '/' + f)) return;
                  const hasText = r.fullText && r.fullText.length > 100;
                  const hasExcerpt = r.bwwExcerpt || r.dtliExcerpt || r.showScoreExcerpt || r.pvExcerpt || r.nycExcerpt || (r.excerpt && r.excerpt.length > 50);
                  if (!hasText && !hasExcerpt) return;
                  n++;
                } catch(e) {}
              });
            });
            console.log(n);
          ")
          echo "remaining=$REMAINING" >> $GITHUB_OUTPUT
          echo "Unscored reviews remaining: $REMAINING"

      - name: Log zero reviews scored
        if: >-
          always() && job.status != 'cancelled'
          && (github.event.inputs.chain == 'true' || github.event_name == 'schedule')
          && steps.check-changes.outputs.has_scored_reviews == 'false'
          && steps.check-needed.outputs.skip != 'true'
        run: |
          REMAINING="${{ steps.count-remaining.outputs.remaining }}"
          echo "::notice::Scoring run processed 0 reviews with ${REMAINING} remaining unscored (likely all have insufficient text)"

      - name: Chain next batch
        if: >-
          always() && job.status != 'cancelled'
          && (github.event.inputs.chain == 'true' || github.event_name == 'schedule')
          && steps.check-changes.outputs.has_scored_reviews == 'true'
          && (fromJSON(steps.count-remaining.outputs.remaining) > 10 || github.event.inputs.outdated == 'true' || github.event.inputs.needs_rescore == 'true' || github.event.inputs.stale_scores == 'true' || github.event.inputs.upgrade_ensemble == 'true')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BATCHES_LEFT="${{ github.event.inputs.remaining_batches }}"
          if [ -z "$BATCHES_LEFT" ] || [ "$BATCHES_LEFT" = "0" ]; then
            if [ "${{ github.event_name }}" == "schedule" ]; then
              BATCHES_LEFT=5
            else
              echo "No remaining batches. Stopping chain."
              exit 0
            fi
          fi
          if [ "$BATCHES_LEFT" -le 0 ] 2>/dev/null; then
            echo "No remaining batches. Stopping chain."
            exit 0
          fi
          NEXT_BATCHES=$((BATCHES_LEFT - 1))
          LIMIT="${{ github.event.inputs.limit }}"
          LIMIT="${LIMIT:-400}"
          SHARD="${{ github.event.inputs.shard }}"
          TOTAL_SHARDS="${{ github.event.inputs.total_shards }}"
          echo "Triggering next batch (${NEXT_BATCHES} remaining after this)..."
          echo "Reviews still unscored: ${{ steps.count-remaining.outputs.remaining }}"

          CHAIN_ARGS="-f limit=$LIMIT -f chain=true -f remaining_batches=$NEXT_BATCHES -f run_calibration=false -f run_validation=false"
          if [ -n "$SHARD" ] && [ -n "$TOTAL_SHARDS" ]; then
            CHAIN_ARGS="$CHAIN_ARGS -f shard=$SHARD -f total_shards=$TOTAL_SHARDS"
          fi
          # Pass through outdated flag so rescore chains continue rescoring
          if [ "${{ github.event.inputs.outdated }}" == "true" ]; then
            CHAIN_ARGS="$CHAIN_ARGS -f outdated=true"
          fi
          # Pass through needs_rescore flag so rescore chains continue
          # Also pass through when scheduled run detected needsRescore backlog
          if [ "${{ github.event.inputs.needs_rescore }}" == "true" ] || [ "${{ steps.check-needed.outputs.run_rescore }}" == "true" ]; then
            CHAIN_ARGS="$CHAIN_ARGS -f needs_rescore=true"
          fi
          # Pass through rescore_reason filter so parallel chains stay in their lane
          if [ -n "${{ github.event.inputs.rescore_reason }}" ]; then
            CHAIN_ARGS="$CHAIN_ARGS -f rescore_reason=${{ github.event.inputs.rescore_reason }}"
          fi
          # Pass through stale_scores flag so stale-score chains continue
          # Also pass through when scheduled run detected stale scores
          if [ "${{ github.event.inputs.stale_scores }}" == "true" ] || [ "${{ steps.check-needed.outputs.run_stale }}" == "true" ]; then
            CHAIN_ARGS="$CHAIN_ARGS -f stale_scores=true"
          fi
          # Pass through upgrade_ensemble flag so upgrade chains continue
          if [ "${{ github.event.inputs.upgrade_ensemble }}" == "true" ]; then
            CHAIN_ARGS="$CHAIN_ARGS -f upgrade_ensemble=true"
          fi
          # Pass through retry_emergency flag so emergency-retry chains continue
          # (capped at 50 reviews/run by Phase 4, so chaining is rare but kept for symmetry)
          if [ "${{ github.event.inputs.retry_emergency }}" == "true" ] || [ "${{ steps.check-needed.outputs.run_emergency_retry }}" == "true" ]; then
            CHAIN_ARGS="$CHAIN_ARGS -f retry_emergency=true"
          fi

          gh workflow run llm-ensemble-score.yml $CHAIN_ARGS
          echo "Next batch dispatched."

      - name: Trigger rebuild + consensus (chain complete)
        # Trigger rebuild when chain ends for ANY reason: remaining ≤ 10, batches exhausted,
        # or chain stopped because this batch scored 0 (earlier batches may have scored reviews
        # that are now stranded in source files without a rebuild).
        if: >-
          ${{ (github.event.inputs.chain == 'true' || github.event_name == 'schedule')
          && (fromJSON(steps.count-remaining.outputs.remaining) <= 10
              || github.event.inputs.remaining_batches == '0'
              || steps.check-changes.outputs.has_scored_reviews == 'false') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # NOTE: Rebuild dispatch removed 2026-04-01. LLM scores are written to review-text
          # files and pushed to private repo. The daily 4 AM rebuild cron picks them up.
          # For opening nights, the orchestrator/poller handles the fast-path rebuild.
          # Dispatching rebuild here created a Rebuild→Score→Rebuild cascade (1000+ runs/day).
          echo "Scoring chain complete. Scores committed to review-texts."
          echo "Daily rebuild cron (4 AM UTC) will incorporate new scores into reviews.json."

      - name: Trigger pull quote extraction (chain complete)
        if: >-
          ${{ (github.event.inputs.chain == 'true' || github.event_name == 'schedule')
          && (fromJSON(steps.count-remaining.outputs.remaining) <= 10
              || github.event.inputs.remaining_batches == '0') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUNNING=$(gh run list --workflow=extract-pull-quotes.yml --status=in_progress --json databaseId --jq 'length' 2>/dev/null || echo "0")
          QUEUED=$(gh run list --workflow=extract-pull-quotes.yml --status=queued --json databaseId --jq 'length' 2>/dev/null || echo "0")
          WAITING=$(gh run list --workflow=extract-pull-quotes.yml --status=waiting --json databaseId --jq 'length' 2>/dev/null || echo "0")
          if [ "$((RUNNING + QUEUED + WAITING))" -gt 0 ]; then
            echo "Pull quote extraction already active ($RUNNING running, $QUEUED queued, $WAITING waiting). Skipping."
            exit 0
          fi
          echo "Dispatching pull quote extraction post-scoring..."
          gh workflow run extract-pull-quotes.yml -f chain=true -f remaining_batches=3
          echo "Pull quote extraction dispatched."
        continue-on-error: true

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: 'LLM Ensemble Scoring Failed'
          discord_webhook: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
          resend_api_key: ${{ secrets.RESEND_API_KEY }}
          owner_email: ${{ secrets.OWNER_EMAIL }}
