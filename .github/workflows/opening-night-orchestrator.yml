name: Opening Night Orchestrator

# Sustained polling for opening nights. Dispatches the single-shot poller
# every N minutes for up to M iterations. Each poller run gets a fresh
# checkout — no stale git state issues.
#
# Five crons. GitHub Actions crons have CONSISTENT delays:
#   - 1 AM UTC crons: DROPPED entirely (never fires)
#   - 2:30 AM UTC: fires ~4 AM UTC (1.5h late)
#   - 7 AM: fires ~8:15 UTC (1.25h late)
#   - 10 AM: fires ~10:45 UTC (45m late)
#   - 20:00: fires ~20:30 UTC (30m late)
#
# Crons are shifted 2h EARLIER to compensate for consistent GitHub delay.
# With ~2h lag, actual fire times hit the intended windows:
#   - Broadway evening: 23:00 + 00:00 UTC → fires ~1-2 AM UTC = 9-10 PM ET ✓
#   - Broadway morning: 8:00 UTC → fires ~9 AM UTC = 4 AM ET ✓
#   - West End morning: 5:00 UTC → fires ~6:30 AM UTC = 7:30 AM BST ✓
#   - West End evening: 18:00 UTC → fires ~19 UTC = 8 PM BST ✓
#
# On nights with no opening, exits in <1 min (zero cost).

on:
  schedule:
    - cron: '0 23 * * *'   # Broadway evening (primary) — fires ~1 AM UTC = 9 PM ET
    - cron: '0 0 * * *'    # Broadway evening (backup) — fires ~2 AM UTC = 10 PM ET
    - cron: '0 5 * * *'    # West End morning — fires ~6:30 AM UTC = 7:30 AM BST
    - cron: '0 8 * * *'    # Broadway morning — fires ~9 AM UTC = 4 AM ET
    - cron: '0 18 * * *'   # West End evening — fires ~19 UTC = 8 PM BST
  workflow_dispatch:
    inputs:
      show_id:
        description: 'Show ID to poll (leave empty for auto-discovery)'
        required: false
        type: string
        default: ''
      market:
        description: 'Market filter (auto = detect from cron time)'
        required: false
        type: choice
        options:
          - auto
          - broadway
          - west-end
        default: auto
      max_iterations:
        description: 'Max poll iterations (default 16 = ~4 hours at 15 min — iterations 17-24 yielded near-zero new URLs and burned SERP)'
        required: false
        type: number
        default: 16
      poll_interval_minutes:
        description: 'Minutes between poll cycles (default 15 — rate-limit safe; use 10 only for short windows)'
        required: false
        type: number
        default: 15
      fast_path:
        description: 'Poller inlines rebuild+deploy after scoring (default true for opening nights)'
        required: false
        type: boolean
        default: true
      bww_roundup_url:
        description: 'Direct BWW Review Roundup URL (pass to poller to bypass SERP discovery)'
        required: false
        type: string
        default: ''

permissions:
  contents: read
  actions: write

# Per-run concurrency so BW and WE orchestrators can run in parallel
concurrency:
  group: opening-night-orch-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  orchestrate:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # GitHub max — allows ~6 hours of polling
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Checkout core data
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}

      - name: Determine market
        id: market
        run: |
          INPUT_MARKET="${{ inputs.market }}"
          if [ "$INPUT_MARKET" != "" ] && [ "$INPUT_MARKET" != "auto" ]; then
            echo "market=$INPUT_MARKET" >> $GITHUB_OUTPUT
            echo "Using manual market: $INPUT_MARKET"
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            # Hour ranges account for GitHub's consistent 1-2h cron delay.
            # Crons shifted 2h early → actual fire times shown in comments above.
            HOUR=$(date -u +%H)
            HOUR_INT=$((10#$HOUR))
            if [ "$HOUR_INT" -ge 22 ] || [ "$HOUR_INT" -le 4 ]; then
              echo "market=broadway" >> $GITHUB_OUTPUT
              echo "${HOUR} UTC (evening cron window) → broadway market"
            elif [ "$HOUR_INT" -ge 5 ] && [ "$HOUR_INT" -le 7 ]; then
              echo "market=west-end" >> $GITHUB_OUTPUT
              echo "${HOUR} UTC (WE morning cron window) → west-end market"
            elif [ "$HOUR_INT" -ge 8 ] && [ "$HOUR_INT" -le 13 ]; then
              echo "market=broadway" >> $GITHUB_OUTPUT
              echo "${HOUR} UTC (BW morning cron window) → broadway market"
            elif [ "$HOUR_INT" -ge 17 ] && [ "$HOUR_INT" -le 21 ]; then
              echo "market=west-end" >> $GITHUB_OUTPUT
              echo "${HOUR} UTC (WE evening cron window) → west-end market"
            else
              echo "market=broadway" >> $GITHUB_OUTPUT
              echo "Unknown cron hour $HOUR — defaulting to broadway"
            fi
          else
            echo "market=" >> $GITHUB_OUTPUT
            echo "Manual dispatch without market — polling all markets"
          fi

      - name: Find shows to poll
        id: find
        run: |
          INPUT_SHOW="${{ inputs.show_id }}"
          MARKET="${{ steps.market.outputs.market }}"

          if [ -n "$INPUT_SHOW" ]; then
            echo "Using manual show: $INPUT_SHOW"
            echo "shows=$INPUT_SHOW" >> $GITHUB_OUTPUT
            echo "has_shows=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Lookback window for shows the orchestrator queues. Tier-3 outlets
          # (Front Mezz Junkies, StageZine, Newsnotes, etc.) routinely publish
          # 7-14 days after opening, and BWW Review Roundups have been seen at
          # +14d (Heated Rivalry, opened 2026-05-12, BWW RR dropped 2026-05-26,
          # missed by the previous 14-day cutoff). Cadence within the window
          # is gated by pollMode in opening-night-poller.js:
          #   - days 0-2: 'aggressive' (every cron fire)
          #   - days 3-13: 'daily' (only morning-cron slot — once/day per show)
          #   - days 14-59: 'every-3d' (~once every 3 mornings)
          # The 30-shows/cycle SERP_BUDGET cap limits total cost.
          LOOKBACK=21
          echo "lookback=$LOOKBACK" >> $GITHUB_OUTPUT

          SHOWS=$(node -e "
            const shows = require('./data/shows.json').shows;
            const now = new Date();
            // Look 6 hours ahead so the 23:00 UTC cron (which may fire before
            // midnight) still discovers shows opening the next calendar day.
            const lookAhead = new Date(now.getTime() + 6 * 60 * 60 * 1000);
            const cutoff = new Date(now);
            // 21-day lookback for both markets — pollMode in the poller gates
            // SERP cadence per show (aggressive → daily → every-3d → weekly).
            // Bumped from 14 → 21 after Heated Rivalry BWW RR missed by 1 day.
            cutoff.setDate(cutoff.getDate() - 21);
            cutoff.setHours(0,0,0,0);
            const market = '$MARKET';
            // Trusted sources for WE press night dates — only fire orchestrator
            // when we're confident the date is a real press night, not a preview
            const TRUSTED_SOURCES = new Set(['theatremonkey', 'playbill', 'ibdb', 'manual']);
            const opened = shows.filter(s => {
              const cat = s.category || 'broadway';
              // OB/OWE shows frequently open "cold" with no formal press night, so
              // openingDate is often null — which would exclude them from discovery
              // entirely (Are You Now Or Have You Ever Been: 0 reviews despite 3+
              // published, 2026-06-15). For those cold-open markets, fall back to
              // previewsStartDate as the discovery anchor so reviews dropping during/
              // after previews are still found. Press-night markets (broadway/west-end)
              // keep requiring a real openingDate. Notion: WE discovery gap.
              const isColdOpenMarket = cat === 'off-broadway' || cat === 'off-west-end';
              const effectiveOpening = s.openingDate || (isColdOpenMarket ? s.previewsStartDate : null);
              if (!effectiveOpening) return false;
              // Include 'previews' shows whose (effective) opening date has passed or is
              // within 6 hours — the 23:00 UTC cron fires before midnight, so we need to
              // catch shows opening "tomorrow" in UTC terms.
              const validStatus = s.status === 'open' || s.status === 'upcoming' ||
                (s.status === 'previews' && new Date(effectiveOpening) <= lookAhead);
              if (!validStatus) return false;
              // Market filter
              if (market === 'broadway' && cat !== 'broadway' && cat !== 'off-broadway') return false;
              if (market === 'west-end' && cat !== 'west-end' && cat !== 'off-west-end') return false;
              // WE shows with an UNTRUSTED openingDateSource (e.g. todaytix) may carry
              // a preview date rather than a real press night. So we don't poll them
              // in the previews-anticipation window — but ONCE the show is genuinely
              // 'open', discovery MUST run: reviews are real regardless of how we
              // learned the date. Suppressing discovery here previously starved niche /
              // short-run WE shows (A Life in Four Seasons: 2 of 7+ reviews, 2026-06-15).
              // Safe to enable: broadcasts are never auto-sent — they only create an
              // owner-reviewed Resend draft — so the source-quality risk lives on the
              // broadcast (manual-approval) side, not discovery. Notion: WE discovery gap.
              if (cat === 'west-end' && !TRUSTED_SOURCES.has(s.openingDateSource)
                  && s.status !== 'open') {
                return false;
              }
              const d = new Date(effectiveOpening);
              d.setHours(0,0,0,0);
              return d >= cutoff && d <= lookAhead;
            });
            if (opened.length > 0) console.log(opened.map(s => s.id).join(','));
          ")

          if [ -z "$SHOWS" ]; then
            echo "No recently opened shows for market=${MARKET:-all}"
            echo "has_shows=false" >> $GITHUB_OUTPUT
          else
            echo "Shows to poll: $SHOWS (market=${MARKET:-all})"
            echo "shows=$SHOWS" >> $GITHUB_OUTPUT
            echo "has_shows=true" >> $GITHUB_OUTPUT
          fi

      - name: Early exit if no shows
        if: steps.find.outputs.has_shows != 'true'
        run: echo "No shows opening tonight. Exiting."

      - name: Check API budget
        id: budget
        if: steps.find.outputs.has_shows == 'true'
        env:
          SCRAPINGBEE_API_KEY: ${{ secrets.SCRAPINGBEE_API_KEY }}
          SCRAPINGDOG_API_KEY: ${{ secrets.SCRAPINGDOG_API_KEY }}
          SCRAPER_USE_SCRAPINGDOG: '1'
        run: |
          if [ -z "$SCRAPINGBEE_API_KEY" ]; then
            echo "skip_serp=false" >> $GITHUB_OUTPUT
            echo "No SCRAPINGBEE_API_KEY — SERP enabled by default"
            exit 0
          fi
          # Delegate to shared helper. Emits ::warning:: at 90% used, skip_serp=true below 1% remaining.
          OUT=$(node scripts/lib/check-sb-credits.js --warn-used-pct=90 --output=skip_serp --floor-remaining-pct=1 2>&1 || true)
          echo "$OUT" | grep -v '^{' || true
          SKIP_LINE=$(echo "$OUT" | grep '^skip_serp=' | tail -1)
          if [ -n "$SKIP_LINE" ]; then
            echo "$SKIP_LINE" >> $GITHUB_OUTPUT
          else
            echo "skip_serp=false" >> $GITHUB_OUTPUT
            echo "Could not read SB credit balance — SERP enabled by default"
          fi

      - name: Resource budget pre-flight
        if: steps.find.outputs.has_shows == 'true'
        continue-on-error: true
        env:
          SHOWS: ${{ steps.find.outputs.shows }}
          SCRAPINGBEE_API_KEY: ${{ secrets.SCRAPINGBEE_API_KEY }}
          SCRAPINGDOG_API_KEY: ${{ secrets.SCRAPINGDOG_API_KEY }}
          SCRAPER_USE_SCRAPINGDOG: '1'
          # GHA_BILLING_PAT (optional): PAT with read:user + billing scope.
          # GITHUB_TOKEN can't read /users/{owner}/settings/billing/actions —
          # without GHA_BILLING_PAT, the GHA-minutes pre-flight is cap-based only.
          GHA_BILLING_PAT: ${{ secrets.GHA_BILLING_PAT }}
          DISCORD_WEBHOOK_ALERTS: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
        run: |
          # Multi-show concurrency budgeting. Counts N shows in window and
          # calls checkBudget(N) against ScrapingBee/Browserbase/LLM/GHA caps.
          # Fires a Discord alert if blockers detected; never fails the job —
          # the orchestrator continues, but we want budget exhaustion visible.
          # See scripts/lib/opening-night-budget.js + memory/opening-night-budget-tuning.md.
          node scripts/opening-night-budget-preflight.js --shows="$SHOWS"

      - name: Refresh audience data (opening night)
        if: steps.find.outputs.has_shows == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Dispatch audience scrapers at the START of the orchestrator so data is
          # ready before the broadcast window (~11:30 PM ET). Runs once per session,
          # not per polling iteration. All dispatches are fire-and-forget: we don't
          # block polling on them, but we DO surface dispatch failures as warnings
          # (see memory/feedback_silent_workflow_failures.md — never swallow dispatch
          # errors with `|| true`).
          #
          # Each target audience-scraper workflow now uses per-run concurrency groups
          # so back-to-back dispatches (especially the Broadway.com per-show loop) no
          # longer lose middle dispatches to GitHub's 1-pending-queue limit.
          SHOWS="${{ steps.find.outputs.shows }}"
          MARKET="${{ steps.market.outputs.market }}"
          echo "Dispatching audience scrapers for: $SHOWS (market: ${MARKET:-all})"

          dispatch() {
            local label="$1"; shift
            if ! gh workflow run "$@"; then
              echo "::warning::Failed to dispatch $label (dispatch call returned non-zero)"
            fi
          }

          # Guardian reviews BOTH markets (Hassenger is the US critic). Its
          # starRating is only in the Content API, not the HTML — opening-night
          # SERP-discovery captures the URL but leaves originalScore=null. Run
          # this for Broadway too, or Broadway stars are lost (Schmig 2026-04-20).
          echo "  → Dispatching Guardian API for: $SHOWS"
          dispatch "fetch-guardian-reviews" fetch-guardian-reviews.yml -f shows="$SHOWS"

          if [ "$MARKET" = "west-end" ] || [ -z "$MARKET" ]; then
            # West End audience scrapers (also dispatched when market is empty = all markets)
            echo "  → Dispatching SeatPlan for: $SHOWS"
            dispatch "update-seatplan" update-seatplan.yml -f shows="$SHOWS"

            echo "  → Dispatching LBO for: $SHOWS"
            dispatch "update-lbo" update-lbo.yml -f shows="$SHOWS"
          fi

          if [ "$MARKET" != "west-end" ]; then
            # Broadway audience scrapers (also dispatched when market is empty = all markets)
            IFS=',' read -ra SHOW_ARRAY <<< "$SHOWS"
            for SHOW_ID in "${SHOW_ARRAY[@]}"; do
              echo "  → Dispatching Broadway.com scraper for $SHOW_ID"
              dispatch "update-broadway-com[$SHOW_ID]" update-broadway-com.yml -f show="$SHOW_ID"
            done

            echo "  → Dispatching Mezzanine for: $SHOWS"
            dispatch "update-mezzanine" update-mezzanine.yml -f shows="$SHOWS"

            echo "  → Dispatching Theatr for: $SHOWS"
            dispatch "update-theatr" update-theatr.yml -f shows="$SHOWS"
          fi

          # These work for both markets (Reddit uses r/TheWestEnd for WE, r/Broadway for BW)
          echo "  → Dispatching Reddit sentiment for: $SHOWS"
          dispatch "update-reddit-sentiment" update-reddit-sentiment.yml -f shows="$SHOWS"

          echo "  → Dispatching Show Score for: $SHOWS"
          dispatch "update-show-score" update-show-score.yml -f shows="$SHOWS"

          echo "Audience scrapers dispatched — they will run concurrently with review polling."

      - name: Polling loop
        if: steps.find.outputs.has_shows == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SKIP_SERP: ${{ steps.budget.outputs.skip_serp }}
        run: |
          # 2026-05-16: cut 16 → 10 to reduce duplicate aggregator+SERP fetches.
          # With SERP_DEFER_ITERATIONS=8, iterations 1-8 are aggregator-only (no SERP),
          # iterations 9-10 add SERP. Net: ~75% reduction in orchestrator SERP load and
          # ~37% reduction in aggregator page-fetch load vs 16 iterations. Aggregator
          # coverage during the first 80 min (the window when most reviews drop) is
          # unchanged. Early-exit on broadcast-complete still applies. Manual dispatches
          # can override with -f max_iterations=16.
          MAX_ITERATIONS=${{ inputs.max_iterations || 10 }}
          POLL_INTERVAL=${{ inputs.poll_interval_minutes || 10 }}
          SHOWS="${{ steps.find.outputs.shows }}"
          MARKET="${{ steps.market.outputs.market }}"

          # Check maintenance mode — pause orchestrator during manual corrections.
          # Variable formats:
          #   Legacy manual pause: plain string "true" (honored indefinitely)
          #   Express lease:       JSON {"value":"express","setAt":"<ISO>"} (auto-expires after 90 min)
          # Set manual:   gh variable set ORCHESTRATOR_PAUSED --body true
          # Clear manual: gh variable delete ORCHESTRATOR_PAUSED
          # Capture exit code instead of `|| echo ""` inside the subshell — gh prints the 404
          # error JSON to stdout when the variable doesn't exist, and the inner `|| echo` only
          # APPENDS to stdout, leaving PAUSED with the error body. That made the next case match
          # `*)` (Orchestrator PAUSED — value=<404 JSON>) and silently skip every iteration after
          # Express cleared the variable. Capturing exit code outside resets PAUSED="" on failure.
          PAUSED=$(gh api repos/${{ github.repository }}/actions/variables/ORCHESTRATOR_PAUSED --jq '.value' 2>/dev/null) || PAUSED=""
          if [ -n "$PAUSED" ]; then
            DECISION=$(PAUSED_VALUE="$PAUSED" node -e "
              const raw = process.env.PAUSED_VALUE || '';
              let parsed = null;
              try { parsed = JSON.parse(raw); } catch (e) { /* legacy string */ }
              if (parsed && typeof parsed === 'object' && parsed.value === 'express') {
                const setAt = new Date(parsed.setAt || 0).getTime();
                const ageMin = (Date.now() - setAt) / 60000;
                if (!isFinite(ageMin) || ageMin > 90) {
                  console.log('EXPIRED|' + Math.round(ageMin) + 'min');
                } else {
                  console.log('ACTIVE|express|' + Math.round(ageMin) + 'min');
                }
              } else {
                console.log('HONOR|' + raw);
              }
            " 2>/dev/null || echo "HONOR|$PAUSED")
            case "$DECISION" in
              EXPIRED*)
                AGE=$(echo "$DECISION" | cut -d'|' -f2)
                echo "::warning::ORCHESTRATOR_PAUSED=express lease expired ($AGE, >90min). Auto-clearing and proceeding."
                gh variable delete ORCHESTRATOR_PAUSED 2>/dev/null \
                  && echo "Stale lease cleared." \
                  || echo "::warning::Could not clear stale ORCHESTRATOR_PAUSED — continuing anyway"
                ;;
              ACTIVE*)
                AGE=$(echo "$DECISION" | cut -d'|' -f3)
                echo "::notice::Orchestrator PAUSED (express lease, $AGE old). Exiting."
                exit 0
                ;;
              *)
                echo "::notice::Orchestrator PAUSED (value=$PAUSED). Exiting. Clear with: gh variable delete ORCHESTRATOR_PAUSED"
                exit 0
                ;;
            esac
          fi

          # skip_serp=true ONLY when SB credits drop below 1% remaining (check-sb-credits.js
          # --floor-remaining-pct=1, set in the "Check API budget" step above); auto-clears when
          # credits renew. NOTE: this is a near-empty-tank backstop, NOT a 15% threshold — SB
          # credits have never dropped below ~30% in practice, so budget-driven SERP skips are
          # effectively never the cause of a missed opening-night SERP. The real SERP-skip driver
          # is SERP_DEFER_ITERATIONS below. See data/audit/we-serp-diagnosis-corrected.md.
          SKIP_SERP_FLAG=""
          if [ "$SKIP_SERP" = "true" ]; then
            SKIP_SERP_FLAG="-f skip_serp=true"
          fi

          echo "╔══════════════════════════════════════════════════╗"
          echo "║  Opening Night Orchestrator"
          echo "║  Shows: $SHOWS"
          echo "║  Market: ${MARKET:-all}"
          echo "║  Max iterations: $MAX_ITERATIONS"
          echo "║  Interval: ${POLL_INTERVAL}min"
          echo "║  Skip SERP: ${SKIP_SERP:-false}"
          echo "╚══════════════════════════════════════════════════╝"

          for ITERATION in $(seq 1 $MAX_ITERATIONS); do
            echo ""
            echo "══════════════════════════════════════════════════"
            echo "  ITERATION $ITERATION / $MAX_ITERATIONS — $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo "══════════════════════════════════════════════════"

            # Early exit: stop if all shows have already been broadcast
            SENT_JSON=$(gh api repos/${{ github.repository }}/contents/data/opening-night-sent.json --jq '.content' 2>/dev/null | base64 -d 2>/dev/null || echo '{}')
            ALL_DONE=true
            IFS=',' read -ra CHECK_SHOWS <<< "$SHOWS"
            for SID in "${CHECK_SHOWS[@]}"; do
              COMPLETED=$(echo "$SENT_JSON" | node -e "
                try {
                  const d = JSON.parse(require('fs').readFileSync('/dev/stdin','utf8'));
                  const e = d.shows && d.shows['$SID'];
                  console.log(e && e.completed ? 'true' : 'false');
                } catch { console.log('false'); }
              " 2>/dev/null || echo "false")
              if [ "$COMPLETED" != "true" ]; then
                ALL_DONE=false
                break
              fi
            done

            if [ "$ALL_DONE" = "true" ]; then
              echo "★ All shows already broadcast — stopping orchestrator early"
              break
            fi

            # Dispatch the poller with show_id and market
            echo "Dispatching opening-night-poller..."

            # SERP deferral: skip SERP for first 8 iterations (~80-160 min at 10-20 min
            # intervals). On opening night, Google hasn't indexed reviews yet — SERP
            # returns wrong URLs that contaminate the pipeline. Layers 1-3 (aggregators,
            # RSS, site-search) handle discovery until SERP catches up. Google indexing
            # of major outlets takes 2-4h post-publication so the extra deferral is free.
            # Budget override still takes precedence.
            SERP_DEFER_ITERATIONS=8
            ITER_SKIP_SERP="$SKIP_SERP_FLAG"
            if [ "$ITERATION" -le "$SERP_DEFER_ITERATIONS" ] && [ -z "$SKIP_SERP_FLAG" ]; then
              echo "  ℹ️ SERP deferred (iteration $ITERATION <= $SERP_DEFER_ITERATIONS) — Layers 1-3 only"
              ITER_SKIP_SERP="-f skip_serp=true"
            elif [ -n "$SKIP_SERP_FLAG" ]; then
              echo "  ℹ️ SERP skipped (budget override)"
            else
              echo "  ✅ SERP enabled (iteration $ITERATION > $SERP_DEFER_ITERATIONS)"
            fi

            POLLER_ARGS="$ITER_SKIP_SERP"
            if [ -n "$MARKET" ]; then
              POLLER_ARGS="$POLLER_ARGS -f market=$MARKET"
            fi

            # Fast path: inline rebuild+deploy (default true for orchestrator dispatches)
            FAST_PATH="${{ inputs.fast_path }}"
            if [ "$FAST_PATH" = "true" ] || [ -z "$FAST_PATH" ]; then
              POLLER_ARGS="$POLLER_ARGS -f fast_path=true"
            fi

            # BWW roundup URL passthrough (only on first iteration — subsequent ones discover via shows.json)
            BWW_URL="${{ inputs.bww_roundup_url }}"
            if [ -n "$BWW_URL" ] && [ "$ITERATION" -eq 1 ]; then
              POLLER_ARGS="$POLLER_ARGS -f bww_roundup_url=$BWW_URL"
            fi

            # Record the newest poller run ID BEFORE dispatch so we can detect the new one
            PRE_DISPATCH_ID=$(gh run list --workflow=opening-night-poller.yml --limit=1 --json databaseId -q '.[0].databaseId' 2>/dev/null || echo "")

            # Use comma-separated shows for single-show dispatch, or let poller auto-discover
            IFS=',' read -ra SHOW_ARRAY <<< "$SHOWS"
            if [ ${#SHOW_ARRAY[@]} -eq 1 ]; then
              gh workflow run opening-night-poller.yml -f show_id="${SHOW_ARRAY[0]}" $POLLER_ARGS || {
                echo "⚠️ Failed to dispatch poller, retrying in 30s..."
                sleep 30
                gh workflow run opening-night-poller.yml -f show_id="${SHOW_ARRAY[0]}" $POLLER_ARGS || true
              }
            else
              # Multiple shows — let poller auto-discover
              gh workflow run opening-night-poller.yml -f lookback_days=${{ steps.find.outputs.lookback }} $POLLER_ARGS || {
                echo "⚠️ Failed to dispatch poller, retrying in 30s..."
                sleep 30
                gh workflow run opening-night-poller.yml -f lookback_days=${{ steps.find.outputs.lookback }} $POLLER_ARGS || true
              }
            fi

            # Wait for the dispatched poller run to appear and complete
            echo "Pre-dispatch latest poller run: ${PRE_DISPATCH_ID:-none}"
            echo "Waiting for new poller run to appear..."

            RUN_ID=""
            for WAIT in $(seq 1 24); do
              sleep 5
              LATEST_ID=$(gh run list --workflow=opening-night-poller.yml --limit=1 --json databaseId -q '.[0].databaseId' 2>/dev/null || echo "")
              if [ -n "$LATEST_ID" ] && [ "$LATEST_ID" != "$PRE_DISPATCH_ID" ]; then
                RUN_ID="$LATEST_ID"
                echo "Found new poller run: $RUN_ID"
                break
              fi
            done

            if [ -n "$RUN_ID" ]; then
              echo "Waiting for poller run $RUN_ID to complete..."
              gh run watch "$RUN_ID" --exit-status 2>/dev/null || echo "⚠️ Poller run $RUN_ID finished (may have failed)"
            else
              echo "⚠️ Could not find new poller run after 2 min. Continuing."
            fi

            # Sleep between iterations (skip on last iteration)
            if [ "$ITERATION" -lt "$MAX_ITERATIONS" ]; then
              echo "Sleeping ${POLL_INTERVAL} minutes until next iteration..."
              sleep $((POLL_INTERVAL * 60))
            fi
          done

          echo ""
          echo "╔══════════════════════════════════════════════════╗"
          echo "║  Orchestrator complete: $MAX_ITERATIONS iterations"
          echo "╚══════════════════════════════════════════════════╝"

      - name: Setup Node for status notification
        if: always() && steps.find.outputs.has_shows == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Send opening night status to Discord
        if: always() && steps.find.outputs.has_shows == 'true'
        env:
          DISCORD_WEBHOOK_ALERTS: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
        run: node scripts/opening-night-status.js --notify --lookback=2
        continue-on-error: true

      - name: Run opening night checklist + SLA dispatch
        if: always() && steps.find.outputs.has_shows == 'true'
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_ALERTS: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
          STAGE_LATENCY_LOG: data/audit/stage-latency.jsonl
        run: |
          node scripts/opening-night-checklist.js --json > /tmp/checklist.json 2>&1 || true
          node scripts/opening-night-sla-dispatch.js /tmp/checklist.json

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: 'Opening Night Orchestrator Failed'
          severity: 'critical'
          email: 'true'
          resend_api_key: ${{ secrets.RESEND_API_KEY }}
          owner_email: ${{ secrets.OWNER_EMAIL }}
          discord_webhook: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
