name: Rotate GitLab Mirror Token

on:
  schedule:
    - cron: '0 12 1 * *'  # 1st of every month at noon UTC
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  rotate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Check token expiry
        id: check
        run: |
          # `|| status=$?`: the default shell is bash -e, so a bare $? check after a failed curl never ran
          status=0
          RESPONSE=$(curl -sf -H "PRIVATE-TOKEN: ${GITLAB_TOKEN}" \
            "https://gitlab.com/api/v4/personal_access_tokens/self") || status=$?

          if [ "$status" -ne 0 ]; then
            echo "::error::GitLab token is invalid or expired!"
            echo "expired=true" >> "$GITHUB_OUTPUT"
            echo "needs_rotation=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          EXPIRES=$(echo "$RESPONSE" | jq -r '.expires_at')
          TOKEN_NAME=$(echo "$RESPONSE" | jq -r '.name')
          echo "Token: $TOKEN_NAME, expires: $EXPIRES"

          EXPIRES_EPOCH=$(date -d "$EXPIRES" +%s)
          NOW_EPOCH=$(date +%s)
          DAYS_LEFT=$(( (EXPIRES_EPOCH - NOW_EPOCH) / 86400 ))
          echo "Days until expiry: $DAYS_LEFT"
          echo "days_left=$DAYS_LEFT" >> "$GITHUB_OUTPUT"
          echo "expired=false" >> "$GITHUB_OUTPUT"

          if [ "$DAYS_LEFT" -le 30 ]; then
            echo "Token expires in $DAYS_LEFT days — rotating now"
            echo "needs_rotation=true" >> "$GITHUB_OUTPUT"
          else
            echo "Token still valid for $DAYS_LEFT days — no rotation needed"
            echo "needs_rotation=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_MIRROR_TOKEN }}

      - name: Rotate token via GitLab API
        id: rotate
        if: steps.check.outputs.needs_rotation == 'true'
        run: |
          # Rotate the token — GitLab returns a new token and invalidates the old one
          status=0
          RESPONSE=$(curl -sf -X POST \
            -H "PRIVATE-TOKEN: ${GITLAB_TOKEN}" \
            "https://gitlab.com/api/v4/personal_access_tokens/self/rotate" \
            -d "expires_at=$(date -d '+1 year' +%Y-%m-%d)") || status=$?

          if [ "$status" -ne 0 ]; then
            echo "::error::Failed to rotate GitLab token"
            exit 1
          fi

          NEW_TOKEN=$(echo "$RESPONSE" | jq -r '.token')
          NEW_EXPIRES=$(echo "$RESPONSE" | jq -r '.expires_at')

          if [ -z "$NEW_TOKEN" ] || [ "$NEW_TOKEN" = "null" ]; then
            echo "::error::Rotation response did not contain a new token"
            exit 1
          fi

          echo "New token expires: $NEW_EXPIRES"
          echo "::add-mask::$NEW_TOKEN"
          echo "$NEW_TOKEN" > /tmp/new-gitlab-token.txt
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_MIRROR_TOKEN }}

      - name: Verify new token works before updating secret
        id: verify
        if: steps.rotate.outcome == 'success'
        run: |
          NEW_TOKEN=$(cat /tmp/new-gitlab-token.txt)
          status=0
          RESPONSE=$(curl -sf -H "PRIVATE-TOKEN: $NEW_TOKEN" \
            "https://gitlab.com/api/v4/personal_access_tokens/self") || status=$?

          if [ "$status" -ne 0 ]; then
            echo "::error::New token failed verification — rotation may have produced an invalid token"
            exit 1
          fi

          echo "New token verified — active and valid"
          echo "new_expires=$(echo "$RESPONSE" | jq -r '.expires_at')" >> "$GITHUB_OUTPUT"

      - name: Update GitHub secret
        id: update
        if: steps.verify.outcome == 'success'
        run: |
          gh secret set GITLAB_MIRROR_TOKEN < /tmp/new-gitlab-token.txt
          rm -f /tmp/new-gitlab-token.txt
          echo "GitHub secret updated with new GitLab token"
        env:
          GH_TOKEN: ${{ secrets.REVIEW_TEXTS_TOKEN }}
          GH_REPO: ${{ github.repository }}

      - name: Route alert on ANY failure
        if: failure()
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
        run: node scripts/route-workflow-alerts.js route gitlab-token-failed

      - name: Route alert if token already expired
        if: steps.check.outputs.expired == 'true'
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
        run: node scripts/route-workflow-alerts.js route gitlab-token-expired

      - name: Resolve alerts when token healthy
        if: steps.check.outputs.expired == 'false' && success()
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
        run: |
          node scripts/route-workflow-alerts.js resolve gitlab-token-expired
          node scripts/route-workflow-alerts.js resolve gitlab-token-failed

      # BRO-6397: the ledger remembers which card each condition filed so a
      # repeat is silent and a clear run resolves it.
      - name: Persist alert-router state
        if: always()
        continue-on-error: true
        env:
          PUSH_RECONCILE_MERGED_JSON: '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          bash scripts/lib/git-add-existing.sh data/audit/alert-ledger.json data/audit/alert-router-attempts.jsonl data/audit/alert-digest-queue.json
          if git diff --cached --quiet; then
            echo "No alert-router state changes to commit"
          else
            git commit -m "chore: persist rotate-gitlab-token alert-router state [skip ci]"
            bash scripts/lib/push-with-retry.sh 5 main
          fi

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: 'GitLab Token Rotation Failed'
          severity: 'low'
          email: 'true'
          discord_webhook: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
          resend_api_key: ${{ secrets.RESEND_API_KEY }}
          owner_email: ${{ secrets.OWNER_EMAIL }}

      - name: Summary
        if: always()
        run: |
          if [ "${{ steps.check.outputs.expired }}" = "true" ]; then
            echo "## Token Expired" >> "$GITHUB_STEP_SUMMARY"
            echo "GitLab token is expired. Owner alert routed with manual fix instructions." >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.check.outputs.needs_rotation }}" = "true" ] && [ "${{ steps.update.outcome }}" = "success" ]; then
            echo "## Token Rotated Successfully" >> "$GITHUB_STEP_SUMMARY"
            echo "New token expires: ${{ steps.verify.outputs.new_expires }}" >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.check.outputs.needs_rotation }}" = "true" ]; then
            echo "## Rotation Failed" >> "$GITHUB_STEP_SUMMARY"
            echo "Alert routed. Check logs for details." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## No Rotation Needed" >> "$GITHUB_STEP_SUMMARY"
            echo "Token still valid for ${{ steps.check.outputs.days_left }} days." >> "$GITHUB_STEP_SUMMARY"
          fi
