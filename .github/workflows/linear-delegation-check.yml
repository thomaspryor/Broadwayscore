name: Linear Delegation Check

# BRO-7573: moved off launchd (com.broadwayscore.linear-delegation-check) so it no longer stalls when
# the Mac sleeps. The script only talks to Linear. Its status-file write goes to the
# runner's ~/.cyrus and is discarded; the signal here is the exit code, surfaced
# through notify-failure (severity low: morning digest only, never pages).

on:
  schedule:
    - cron: '22,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: linear-delegation-check
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run check-linear-delegations.js
        id: job
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        run: node scripts/check-linear-delegations.js

      - name: Notify on failure
        if: steps.job.outcome == 'failure'
        uses: ./.github/actions/notify-failure
        with:
          title: 'Linear delegation check failed or found a stalled agent'
          description: 'check-linear-delegations.js exited non-zero on the GitHub cron (was launchd on the Mac, BRO-7573). Read this run log.'
          severity: 'low'
          email: 'false'
          resend_api_key: ${{ secrets.RESEND_API_KEY }}
