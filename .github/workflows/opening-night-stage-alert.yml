# hygiene-notify-ok: files a routeAlert worker card on failure (own notification mechanism, no additional discord/email needed)
name: Opening Night Stage Alert

# 6 of 8 recent Broadway openings had ZERO "scored" stage-latency entries on
# opening day (bucket D, data-flow race). This workflow runs the morning after
# an opening window and files a routeAlert worker card if that signature reappears.
#
# Timing: 13:00 UTC = 9 AM ET = covers both last-night ET openings (which
# stage-log at ~02-05 UTC the next morning) and early West End morning reviews.

on:
  schedule:
    - cron: '0 13 * * *'   # 9 AM ET — 48h window lookback
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10  # BRO-4266: the core-data checkout alone can take 3-5 min
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - name: Fetch private data repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: thomaspryor/broadway-scorecard-data
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
          path: .private-data

      - name: Wire shows.json and reviews.json into data/
        # BRO-6653: reviews.json lets the check see reviews that were scored even when their
        # 'scored' stage-latency row was lost to a cancelled poller run.
        run: |
          mkdir -p data
          cp -f .private-data/shows.json data/shows.json
          cp -f .private-data/reviews.json data/reviews.json

      - name: Check scored-stage coverage
        id: check
        run: node scripts/check-opening-night-scored.js

      - name: Route alert on failure
        if: failure() && steps.check.outcome == 'failure'
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
        run: node scripts/route-workflow-alerts.js route opening-night-stage

      - name: Resolve alert when clean
        if: steps.check.outcome == 'success'
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
        run: node scripts/route-workflow-alerts.js resolve opening-night-stage

      # BRO-6397: the ledger remembers which card each condition filed so a
      # repeat is silent and a clear run resolves it.
      - name: Persist alert-router state
        if: always()
        continue-on-error: true
        env:
          PUSH_RECONCILE_MERGED_JSON: '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          bash scripts/lib/git-add-existing.sh data/audit/alert-ledger.json data/audit/alert-router-attempts.jsonl data/audit/alert-digest-queue.json
          if git diff --cached --quiet; then
            echo "No alert-router state changes to commit"
          else
            git commit -m "chore: persist opening-night-stage-alert alert-router state [skip ci]"
            bash scripts/lib/push-with-retry.sh 5 main
          fi
