name: Secret Scan (gitleaks)

on:
  pull_request:
    branches: [main]
  # main takes ~860 bot commits/day (rebuild + data churn). A full-history scan on
  # every one of those would burn the Actions budget and never finish. Restrict the
  # push trigger to the paths where a hardcoded secret can actually land; the weekly
  # cron below is what covers everything else.
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'src/**'
      - '.github/**'
      - 'package.json'
      - 'next.config.js'
      - 'tsconfig.json'
      - '.gitleaks.toml'
  schedule:
    - cron: '0 7 * * 1'  # Mondays at 7 AM UTC (after weekly grosses runs)
  workflow_dispatch:

concurrency:
  group: gitleaks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    # Full-history scan over a ~2.1GB .git with 50k+ commits. Measured locally at
    # >7 min on a Mac Studio, so 15 min was too tight for a CI runner.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  # full history so allowlist commits resolve

      - name: Install gitleaks
        run: |
          VERSION=8.21.2
          curl -sL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan repository
        run: |
          gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --no-banner \
            --redact \
            --report-format sarif \
            --report-path gitleaks-report.sarif \
            --exit-code 1

      - name: Upload SARIF report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-sarif
          path: gitleaks-report.sarif
          if-no-files-found: ignore

      - name: Checkout for notify action
        if: failure()
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            .github/actions/notify-failure
            scripts/lib/discord-notify.js

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: 'Secret Scan Failed (gitleaks found a leak)'
          severity: 'warning'
          resend_api_key: ${{ secrets.RESEND_API_KEY }}
          owner_email: ${{ secrets.OWNER_EMAIL }}
