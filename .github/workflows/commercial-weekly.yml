name: Commercial Weekly Orchestrator

on:
  schedule:
    # Saturday 18:00 UTC / 1 PM ET — runs the day BEFORE the Sunday newsletter
    # so deep-research + apply + deploy all land before the newsletter is sent.
    # The Friday scraper (commercial-friday.yml, Fri 22:00 UTC) feeds findings
    # into pending overnight; this Saturday run sweeps + applies them.
    - cron: '0 18 * * 6'  # Saturday 6 PM UTC / 1 PM ET
  workflow_dispatch:
    inputs:
      skip_batch:
        description: 'Skip batch research step'
        required: false
        type: boolean
        default: false
      skip_deep_research:
        description: 'Skip deep research step'
        required: false
        type: boolean
        default: false
      skip_sweep:
        description: 'Skip sweep + Notion surfacing step'
        required: false
        type: boolean
        default: false
      dry_run:
        description: 'Dry run (no changes committed)'
        required: false
        type: boolean
        default: false
      max_shows:
        description: 'Max shows for deep research (~102 Broadway shows in scope, ~$0.09/show)'
        required: false
        type: number
        default: 80
      budget:
        description: 'Budget for deep research ($)'
        required: false
        type: number
        default: 5
      time_budget_min:
        description: 'Deep-research wall-clock budget in minutes (0 = unlimited)'
        required: false
        type: number
        default: 100

concurrency:
  group: commercial-data-write
  cancel-in-progress: false

jobs:
  batch-research:
    if: inputs.skip_batch != true
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout core data
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}

      - uses: ./.github/actions/setup-node
        with:
          configure-git: 'true'

      - name: Setup Playwright
        uses: ./.github/actions/setup-playwright

      - name: Run batch commercial research
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SCRAPINGBEE_API_KEY: ${{ secrets.SCRAPINGBEE_API_KEY }}
          SCRAPINGDOG_API_KEY: ${{ secrets.SCRAPINGDOG_API_KEY }}
          SCRAPER_USE_SCRAPINGDOG: '1'
          BRIGHTDATA_TOKEN: ${{ secrets.BRIGHTDATA_TOKEN }}
          BRIGHTDATA_ZONE: ${{ secrets.BRIGHTDATA_ZONE }}
        run: |
          ARGS="--max-per-run=30"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          node scripts/batch-commercial-research.js $ARGS
        continue-on-error: true

      - name: Commit batch research results
        if: always() && inputs.dry_run != true
        # Task #574: commits commercial-pending-review.json (union-merged
        # managed file) — see push-with-retry.sh's reconcile_merged_json().
        env:
          PUSH_RECONCILE_MERGED_JSON: '1'
          # BRO-123: MANAGED-file push disqualified from the Git Data API
          # fallback; default 240s deadline was self-aborting after ~2 real
          # fetch/rebase/push cycles under main's commit churn (task #458's
          # documented failure mode). This job has 60min timeout with ~20min
          # headroom past this step — smaller than the 1200s override
          # update-show-status.yml uses for the same root cause (that job has
          # a much bigger timeout budget).
          PUSH_DEADLINE_SEC: '600'
        run: |
          bash scripts/lib/git-add-existing.sh data/commercial-pending-review.json data/commercial-batch-progress.json
          if git diff --staged --quiet; then
            echo "No batch research results to commit"
          else
            git commit -m "data: Batch commercial research results (pending review)

          Co-Authored-By: github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
            bash scripts/lib/push-with-retry.sh
          fi

      - name: Commit scraper-spend ledger
        if: always()
        continue-on-error: true
        uses: ./.github/actions/commit-scraper-spend-ledger
        with:
          workflow-name: commercial-weekly

  sweep-pending:
    # Hygiene pass — runs BEFORE deep-research so the requeued shows are picked
    # up in the same orchestrator run. Archive ages out >180d low-conf entries
    # to commercial-pending-archive.json (which the Friday scraper checks
    # before re-surfacing previously rejected articles). Recouped-claim entries
    # are reported to /tmp/sweep-report.json for the Notion step.
    needs: batch-research
    if: always() && inputs.skip_sweep != true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout core data
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}

      - uses: ./.github/actions/setup-node
        with:
          configure-git: 'true'

      - name: Sweep pending-review
        run: |
          ARGS="--report-json=/tmp/sweep-report.json"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          node scripts/sweep-pending-commercial.js $ARGS

      - name: Notion sweep — surface recouped claims
        if: inputs.dry_run != true
        env:
          # notion-brain.js reads NOTION_API_KEY (not NOTION_TOKEN). The GH
          # secret is named NOTION_API_KEY. Originally fixed in 1c661a9501;
          # accidentally reverted by parallel session in 4b4c8f9790; re-applying.
          # Per memory/feedback_parallel_worktree_race.md — when in doubt,
          # re-pull + grep before editing.
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: |
          if [ -f /tmp/sweep-report.json ]; then
            node scripts/notify-pending-commercial-notion.js \
              --report-json=/tmp/sweep-report.json --cap=25
          fi
        continue-on-error: true

      - name: Commit sweep results
        if: always() && inputs.dry_run != true
        # Task #574: commits commercial-pending-review.json + commercial-
        # research-queue.json (union-merged managed files) — see push-with-
        # retry.sh's reconcile_merged_json().
        env:
          PUSH_RECONCILE_MERGED_JSON: '1'
          # BRO-123: same root cause as the batch-research push above — default
          # 240s deadline self-aborting after ~2 real cycles. This job has only
          # a 20min timeout (sweep itself is lightweight, ~3min), so 480s
          # (not the 600s used on longer jobs) to leave real buffer.
          PUSH_DEADLINE_SEC: '480'
        run: |
          bash scripts/lib/git-add-existing.sh data/commercial-pending-review.json data/commercial-pending-archive.json data/commercial-research-queue.json
          if git diff --staged --quiet; then
            echo "No sweep changes to commit"
          else
            git commit -m "data: Sweep pending-review (TTL + archive + Notion surface)

          Co-Authored-By: github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
            bash scripts/lib/push-with-retry.sh
          fi

  deep-research:
    needs: sweep-pending
    if: always() && inputs.skip_deep_research != true
    runs-on: ubuntu-latest
    # The ~50s/show estimate proved wrong empirically (~94s+/show: 2026-05-30,
    # 2026-06-06 runs both killed at the 120-min timeout). The script now takes
    # --time-budget-min=100 and exits cleanly, deferring unfinished targets to
    # the next Saturday run (per-show progress checkpoint means nothing is
    # lost). This timeout is a backstop, not the cap.
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout core data
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}

      - uses: ./.github/actions/setup-node
        with:
          configure-git: 'true'

      - name: Run deep research
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          ARGS="--all-tbd --queue"
          # Default 80 covers the typical Broadway scope (~102 shows, priority-
          # sorted: queued > 6-month > recoup-window 56-182d > shuffled tail).
          # At ~$0.09/show average, 80 shows ≈ $7 — well under the $50 cap.
          ARGS="$ARGS --max-shows=${{ inputs.max_shows || '80' }}"
          ARGS="$ARGS --budget=${{ inputs.budget || '50' }}"
          # Default in bash, not a GHA || expression — the expression coerces
          # a literal 0 (= unlimited) to falsy and would silently turn it into 100.
          TB="${{ inputs.time_budget_min }}"
          [ -z "$TB" ] && TB=100
          ARGS="$ARGS --time-budget-min=$TB"
          # BRO-123: o4-mini-deep-research (and the o3 variant) were shut down
          # by OpenAI on 2026-07-23 — every call 404s ("Model not found"),
          # verified live against /v1/models. No deep-research successor model
          # exists in this account as of 2026-08-26. --model=o4-mini is the
          # script's already-implemented non-deep fallback (web_search_preview
          # + reasoning.effort=high, synchronous) — see researchShowWithOpenAI
          # in deep-research-commercial.js.
          ARGS="$ARGS --model=o4-mini"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          echo "Running: node scripts/deep-research-commercial.js $ARGS"
          node scripts/deep-research-commercial.js $ARGS

      - name: Commit deep research results
        if: always() && inputs.dry_run != true
        # Task #574: commits commercial-pending-review.json + commercial-
        # research-queue.json (union-merged managed files) — see push-with-
        # retry.sh's reconcile_merged_json().
        env:
          PUSH_RECONCILE_MERGED_JSON: '1'
          # BRO-123: same root cause as the batch-research push above. This
          # job has a 120min timeout (mostly consumed by the research loop
          # itself, not this push step), so 600s is safe.
          PUSH_DEADLINE_SEC: '600'
        run: |
          # commercial.json is gitignored (core data); push-core-data syncs it to the private repo.
          bash scripts/lib/git-add-existing.sh data/commercial-pending-review.json data/deep-research-cost-log.json data/deep-research-progress.json data/commercial-research-spend.json data/commercial-research-queue.json
          if git diff --staged --quiet; then
            echo "No deep research results to commit"
          else
            git commit -m "data: Deep research commercial results (pending review)

          Co-Authored-By: github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
            bash scripts/lib/push-with-retry.sh
          fi

  auto-apply:
    needs: deep-research
    if: always() && inputs.dry_run != true
    runs-on: ubuntu-latest
    # The apply itself is seconds; the tail is "Commit applied data + audit" →
    # push-with-retry against the busy public main, which has clocked ~16.5 min
    # under contention. 15 was too tight — the job was cancelled mid-push every
    # week (last full success 2026-06-13; check-cron-health flagged it stale).
    # 30 gives headroom on top of the faster push backoff (scripts/lib/push-with-retry.sh).
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout core data
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}

      - uses: ./.github/actions/setup-node
        with:
          configure-git: 'true'

      - name: Auto-apply high-confidence results
        # NOT continue-on-error: ship-check CDX-P0-4 found a failed apply could
        # silently progress to commit + push + deploy with a half-mutated
        # workspace. A hard abort here makes every success()-gated step below
        # skip, INCLUDING the strict gate — which is why the "Commit gate"
        # step further down is `if: always()` and fails closed on
        # `job.status != 'success'`. That barrier, not this step's exit code,
        # is what stops the always()-gated commit/push/deploy from publishing
        # a half-mutated workspace. The next Saturday run picks up the same
        # pending, because the barrier also restores the files mutated here.
        #
        # BRO-2907: the comment that used to sit here claimed the abort was
        # safe because "the commit step below already guards with
        # `if git diff --staged --quiet`". That was wrong twice over — the
        # commit step is `if: always()`, and a staged-diff guard only skips
        # when there are NO changes, whereas a half-mutated workspace has
        # exactly the changes you must not commit.
        run: |
          if [ -f data/commercial-pending-review.json ]; then
            node scripts/apply-commercial-pending.js --all --min-confidence=high
          else
            echo "No pending file — nothing to apply"
          fi

      - name: Reconcile recoupment claim queue
        # Closes stale duplicates (pending claims already resolved+cited in
        # commercial.json by a prior pipeline run) and attempts SERP+LLM
        # verification of the rest against TRUSTED_RECOUPMENT_HOSTS. NOT
        # continue-on-error, same reasoning as auto-apply above.
        #
        # BRO-2907: the comment here used to claim "writes only happen after
        # the full pass succeeds, so a mid-run failure leaves no partial state
        # for the strict gate below to catch." Do not rely on that. This step
        # can fail after auto-apply above has already mutated commercial.json
        # and pending-review, and a failure here SKIPS the strict gate
        # entirely. The "Commit gate" barrier below is what actually holds.
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SCRAPINGBEE_API_KEY: ${{ secrets.SCRAPINGBEE_API_KEY }}
          SCRAPINGDOG_API_KEY: ${{ secrets.SCRAPINGDOG_API_KEY }}
          SCRAPER_USE_SCRAPINGDOG: '1'
          BRIGHTDATA_TOKEN: ${{ secrets.BRIGHTDATA_TOKEN }}
          BRIGHTDATA_ZONE: ${{ secrets.BRIGHTDATA_ZONE }}
        run: |
          if [ -f data/commercial-pending-review.json ]; then
            node scripts/reconcile-recoupment-claims.js --time-budget-min=25
          fi

      - name: Self-heal resurrected duplicate key pairs
        # A clobber-resurrection (task #268 class) reintroduces ID-keyed
        # entries whose slug sibling still exists. Deleting a CONTAINED pair
        # (ID entry holds nothing the slug entry lacks) is deterministic and
        # lossless, so heal it here instead of going red every Saturday until
        # a human runs the CLI. Conflicting pairs are NOT healed — the script
        # exits 1 and the strict gate below stays red with the named error.
        # Ordering matters: this runs before the strict gate AND before the
        # flagless audit + --write-history steps, so weekly metrics and the
        # drift series are computed on the deduped file.
        run: node scripts/dedupe-commercial-id-keys.js --apply

      - name: Commercial data strict gate (required)
        # S1-T5: hard gate — recouped:true entries with no citation, or
        # sources[].url pointing at an LLM tool (chatgpt.com etc.), must never
        # reach the private repo.
        #
        # This step only DECIDES. Failing it makes job.status 'failure', and
        # the "Commit gate" barrier below is what writes the push-core-data
        # refusal sentinel and restores the mutated files. Keeping exactly one
        # restore site is deliberate (BRO-2907): the previous version restored
        # here too, so any later divergence between the two copies would have
        # silently reopened the hole this card was filed for.
        run: node scripts/audit-commercial-data.js --strict

      - name: Run commercial audit
        # continue-on-error: true — audit is read-only/informational; a failure
        # shouldn't block the deploy. Audit findings surface in the daily digest.
        run: node scripts/audit-commercial-data.js
        continue-on-error: true

      - name: Update commercial model drift history
        # S2-T1/S2-T2: appends one entry/week to
        # data/audit/commercial-data-history.json (modelDesignationFlag
        # contradiction count, modelMethod tier breakdown, ai-estimated tier
        # entry/exit vs last week) so health-check.js's "Commercial model
        # drift" check has something to compare against. --write-history is
        # only passed here (this job is the sole weekly-cadence caller) —
        # the flagless "Run commercial audit" step above and
        # update-commercial.yml's manual-dispatch fallback intentionally do
        # NOT advance history. continue-on-error: true — same reasoning as
        # "Run commercial audit" above; informational, not ship-blocking.
        run: node scripts/audit-commercial-data.js --write-history
        continue-on-error: true

      - name: Commercial scope-contamination audit (informational)
        # OUT_OF_MARKET_SCOPE/SHOW_NOT_IN_DB are warn-only (not ship-blocking,
        # see script header) but were previously NEVER run on a schedule —
        # audit-commercial-contamination.js was only wired via `--gate` in
        # test.yml, which checks a different, narrower signal set (impossible
        # physics/contradictions only). A market-vs-category filter bug let
        # 28 Off-Broadway/West-End shows sit undetected in commercial.json
        # for a day (2026-07-14/15) with nothing surfacing it until a manual
        # sweep. This step doesn't gate the push — it just guarantees the
        # signal appears in this run's log every week instead of only when
        # someone happens to run the script by hand.
        run: node scripts/audit-commercial-contamination.js --strict
        continue-on-error: true

      - name: Refresh recoupment model
        id: refresh-model
        # continue-on-error: true — model refresh is derived data; failure
        # leaves the previous run's values in place. It writes through
        # commercial-write-guard -> json-write-guard -> atomicWriteJson
        # (temp file + rename), so commercial.json is never left half-written.
        #
        # BUT it is the one step below the strict gate that MUTATES
        # commercial.json (scripts/merge-model-recoupment.js:253,
        # saveCommercial), and continue-on-error means its failure does NOT
        # set job.status to failure. So the Commit gate below checks this
        # step's outcome explicitly as well as job.status — otherwise a failed
        # model refresh would publish commercial data the strict gate never
        # judged. Found by two independent reviewers on 2026-09-06.
        run: node scripts/merge-model-recoupment.js
        continue-on-error: true

      - name: Deletion guard for commercial.json
        if: always()
        # BRO-2907: this guard had never run. It was wrapped in
        # `if <diff of data/commercial.json> | grep -c '^-[^-]' > file; then`,
        # but data/commercial.json is ignored AND untracked in the public repo
        # (.gitignore:204), so the diff prints nothing, grep -c exits 1, and
        # the condition was false on every run since the guard was written —
        # the show-count check inside it never executed once. Absence of a
        # signal read as safety, exactly like the skipped-step class this card
        # was filed for. Now unconditional, matching the form that
        # commercial-friday.yml already uses correctly.
        run: |
          node -e "
            const fs = require('fs');
            if (!fs.existsSync('./data/commercial.json')) { console.log('no commercial.json — nothing to guard'); process.exit(0); }
            const comm = JSON.parse(fs.readFileSync('./data/commercial.json','utf8'));
            const count = Object.keys(comm.shows || {}).length;
            console.log('Current show count: ' + count);
            if (count < 120) {
              console.error('::error::Commercial show count dropped below 120 (' + count + '). Aborting.');
              process.exit(1);
            }
          "

      - name: Commit gate — refuse to publish after any earlier failure
        id: commit-gate
        if: always()
        # BRO-2907. Every mutation step in this job (auto-apply, the recoupment
        # reconciler, the dedupe self-heal) and the strict gate that judges
        # them are success()-gated, so ANY earlier failure skips the gate —
        # while "Commit applied data", "Push core data" and "Dispatch deploy"
        # below are if: always() and publish regardless. That published
        # half-mutated commercial data to the private repo AND recorded the
        # pending entries as consumed, so the next run could not retry them.
        #
        # This barrier is the single fail-closed point. It keys off
        # `job.status` rather than enumerating each earlier step's outcome
        # because the whole bug class is "someone adds a step and nobody
        # updates the guard" — job.status covers steps that do not exist yet,
        # including checkout/setup. Same mechanism as
        # llm-ensemble-score.yml's `always() && job.status != 'cancelled'`.
        #
        # A `continue-on-error: true` step that fails does NOT set job.status
        # to failure. Most of the steps below the strict gate are genuinely
        # informational and deliberately non-blocking — but "Refresh
        # recoupment model" is NOT: it mutates commercial.json after the gate
        # has already passed. So its outcome is checked explicitly below.
        # Any future continue-on-error step that WRITES must be added here
        # too; a read-only audit does not need to be.
        #
        # The publish steps below gate on `outcome == 'success'`, NOT on the
        # `outcome != 'failure'` used by update-show-status.yml's commit-gate.
        # Deliberate: `!= 'failure'` is TRUE when this step is skipped, which
        # is the same read-as-safe-while-nothing-ran shape this card was filed
        # for. `== 'success'` is the only form that requires the barrier to
        # have actually run and passed.
        env:
          JOB_STATUS: ${{ job.status }}
          MODEL_REFRESH_OUTCOME: ${{ steps.refresh-model.outcome }}
        run: |
          REASON=""
          if [ "$JOB_STATUS" != "success" ]; then
            REASON="an earlier step failed or was cancelled (job status: $JOB_STATUS)"
          elif [ "$MODEL_REFRESH_OUTCOME" = "failure" ]; then
            REASON="Refresh recoupment model failed after the strict gate; it mutates commercial.json, so its output was never judged"
          fi
          if [ -z "$REASON" ]; then
            echo "No earlier step failed — publish is clear to proceed."
            exit 0
          fi
          echo "::error::Refusing to commit, push or deploy commercial data: $REASON."
          # `|| true` ONLY on the sentinel write: under `bash -e` a failed
          # redirection (unwritable RUNNER_TEMP) would abort this step before
          # the restores below ever run. The step still exits 1 either way, so
          # the publish steps are blocked by outcome regardless of the sentinel.
          echo "commercial-weekly auto-apply refused to publish: $REASON" \
            > "${RUNNER_TEMP:-/tmp}/.skip-push-core-data" || \
            echo "::error::could not write the push-core-data refusal sentinel — relying on step outcome to block the publish"
          # Restore what the mutation steps above may have half-written, so the
          # next Saturday run retries the same pending set. These restores are
          # LOUD on failure: a silent `|| true` here would leave the workspace
          # mutated while this step still reported the refusal, which is the
          # same false-safe shape as the dead deletion guard above.
          if [ -f /tmp/core-data-snapshot/commercial.json ]; then
            if cp -f /tmp/core-data-snapshot/commercial.json data/commercial.json; then
              echo "restored data/commercial.json from the pre-run snapshot"
            else
              echo "::error::could not restore data/commercial.json from the snapshot"
            fi
          else
            echo "::error::/tmp/core-data-snapshot/commercial.json is missing — cannot restore commercial.json. checkout-core-data did not run or did not complete. The refusal sentinel is written, so the private-repo push is still blocked."
          fi
          for f in data/commercial-pending-review.json data/recoupment-calibration-anchors.json; do
            if git checkout -- "$f"; then
              echo "restored $f"
            else
              echo "::error::could not restore $f — entries it holds may be recorded as consumed"
            fi
          done
          exit 1

      - name: Commit applied data + audit
        id: commit-public
        if: always() && steps.commit-gate.outcome == 'success'
        # Task #574: commits commercial-pending-review.json (union-merged
        # managed file) — see push-with-retry.sh's reconcile_merged_json().
        env:
          PUSH_RECONCILE_MERGED_JSON: '1'
          # BRO-123: same root cause as the batch-research push above. Job
          # timeout was already raised 15min->30min for this exact push-
          # contention class (see the timeout-minutes comment on this job) —
          # 600s gives the retry loop itself the same headroom.
          PUSH_DEADLINE_SEC: '600'
        run: |
          bash scripts/lib/git-add-existing.sh data/commercial-pending-review.json data/audit/commercial-data-audit.json data/audit/commercial-data-history.json data/recoupment-calibration-anchors.json
          bash scripts/lib/stage-data-changes.sh
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "data: Auto-apply commercial research + audit

          Weekly orchestrator: applied high-confidence results, updated audit.

          Co-Authored-By: github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
            bash scripts/lib/push-with-retry.sh
          fi

      # BRO-2912. `commit-gate` runs BEFORE the commit, so its outcome is fixed
      # at 'success' by the time the commit runs, and `always()` means a FAILED
      # commit does not stop the two steps below. That is not hypothetical: in
      # run 33988453526 (schedule, 2026-09-05) "Commit applied data + audit"
      # failed on push contention while "Push core data to private repo" and
      # "Dispatch deploy" both succeeded. The public repo then lacks
      # commercial-pending-review.json marking those entries consumed, while
      # push-core-data ships the mutated commercial.json (a CORE_FILE) to the
      # private repo and on to production — so the next Saturday re-applies
      # entries that are already applied. commit-gate cannot catch this: it
      # already passed, so it never wrote the .skip-push-core-data sentinel
      # that push-core-data's own refusal check reads.
      #
      # Chaining a second step id onto the barrier id, rather than moving the
      # barrier or adding a second one, is the established shape here — see
      # discover-historical-shows.yml's "Mark data pushed" step. A second
      # barrier would mean a second restore site, which the comment on the
      # deletion guard above deliberately rejects.
      #
      # A commit that legitimately commits NOTHING is still success: data/
      # commercial.json is gitignored (.gitignore:204), so a run that only
      # changed commercial.json takes the "No changes to commit" path, exits 0,
      # and must still publish. That is the common case, not an edge case.
      #
      # Skipping "Dispatch deploy" on a contended push is deliberate and cheap:
      # vercel-deploy.yml's 6h backstop still ships the data. Do not "fix" this
      # back to an unconditional deploy.
      - name: Push core data to private repo
        if: always() && steps.commit-gate.outcome == 'success' && steps.commit-public.outcome == 'success'
        uses: ./.github/actions/push-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
          message: 'data: Commercial weekly orchestrator update'

      - name: Dispatch deploy
        if: always() && steps.commit-gate.outcome == 'success' && steps.commit-public.outcome == 'success'
        uses: ./.github/actions/dispatch-deploy

      - name: Summary
        if: always()
        run: |
          echo "## Commercial Weekly Orchestrator" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f data/audit/commercial-data-audit.json ]; then
            node -e "
              const a = require('./data/audit/commercial-data-audit.json');
              const s = a.summary;
              console.log('- **Total entries:** ' + s.totalEntries);
              console.log('- **Open show coverage:** ' + s.openShowCoverage.withCommercialData + '/' + s.openShowCoverage.totalOpenPreviewsShows + ' (' + s.openShowCoverage.coveragePct + '%)');
              console.log('- **Issues:** ' + s.issuesSummary.total + ' (high: ' + (s.issuesSummary.bySeverity.high || 0) + ')');
            " >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "Could not parse audit" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f data/commercial-research-spend.json ]; then
            node -e "
              const s = require('./data/commercial-research-spend.json');
              console.log('- **Weekly spend:** \$' + (s.totalSpend || 0).toFixed(2) + ' (' + (s.queries || 0) + ' queries)');
            " >> $GITHUB_STEP_SUMMARY 2>/dev/null || true
          fi

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: 'Commercial Weekly Orchestrator Failed'
          severity: 'warning'
          discord_webhook: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
