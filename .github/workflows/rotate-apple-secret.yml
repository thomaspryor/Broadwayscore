name: Rotate Apple OAuth Secret

# Apple client secrets expire every 6 months. This regenerates the JWT
# and updates Supabase automatically. Runs monthly to stay well ahead.

on:
  schedule:
    - cron: '0 12 1 * *'  # 1st of every month at noon UTC
  workflow_dispatch: {}

jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Apple client secret JWT
        id: jwt
        run: |
          node -e "
          const crypto = require('crypto');
          const privateKey = process.env.APPLE_PRIVATE_KEY;
          const now = Math.floor(Date.now() / 1000);
          const header = { alg: 'ES256', kid: '3TBDNTHCD2', typ: 'JWT' };
          const payload = {
            iss: '2837Q6TK6Y',
            iat: now,
            exp: now + (180 * 24 * 60 * 60),
            aud: 'https://appleid.apple.com',
            sub: 'com.broadwayscorecard.web'
          };
          function b64url(obj) { return Buffer.from(JSON.stringify(obj)).toString('base64url'); }
          const input = b64url(header) + '.' + b64url(payload);
          const sign = crypto.createSign('SHA256');
          sign.update(input);
          const sig = sign.sign(privateKey, 'base64url');
          console.log(input + '.' + sig);
          "
        env:
          APPLE_PRIVATE_KEY: ${{ secrets.APPLE_PRIVATE_KEY }}

      - name: Update Supabase Apple provider
        run: |
          # Use Supabase Management API to update the Apple provider secret
          curl -s -X PATCH \
            "https://api.supabase.com/v1/projects/${{ secrets.SUPABASE_PROJECT_REF }}/config/auth" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ACCESS_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"EXTERNAL_APPLE_SECRET\": \"$(node -e "
              const crypto = require('crypto');
              const privateKey = process.env.APPLE_PRIVATE_KEY;
              const now = Math.floor(Date.now() / 1000);
              const header = { alg: 'ES256', kid: '3TBDNTHCD2', typ: 'JWT' };
              const payload = {
                iss: '2837Q6TK6Y',
                iat: now,
                exp: now + (180 * 24 * 60 * 60),
                aud: 'https://appleid.apple.com',
                sub: 'com.broadwayscorecard.web'
              };
              function b64url(obj) { return Buffer.from(JSON.stringify(obj)).toString('base64url'); }
              const input = b64url(header) + '.' + b64url(payload);
              const sign = crypto.createSign('SHA256');
              sign.update(input);
              console.log(input + '.' + sign.sign(privateKey, 'base64url'));
            ")\"}"
        env:
          APPLE_PRIVATE_KEY: ${{ secrets.APPLE_PRIVATE_KEY }}

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
