name: "Migrate review-texts to private repo"

# One-time workflow to seed the private repo with current review-texts data.
# Safe to re-run (overwrites private repo main branch).

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout public repo
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Push review-texts to private repo
        run: |
          cd data/review-texts
          git init
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add -A
          echo "Files staged: $(git diff --cached --stat | tail -1)"
          git commit -m "Initial import of review-texts from public repo"
          git remote add origin https://x-access-token:${{ secrets.REVIEW_TEXTS_TOKEN }}@github.com/thomaspryor/broadway-review-texts.git
          git branch -M main
          git push -u origin main --force
          echo "Push complete!"

      - name: Verify
        run: |
          LOCAL_COUNT=$(find data/review-texts -name '*.json' -not -name 'failed-fetches.json' | wc -l | tr -d ' ')
          echo "Local files: $LOCAL_COUNT"
          echo "Migration complete. Verify at https://github.com/thomaspryor/broadway-review-texts"
