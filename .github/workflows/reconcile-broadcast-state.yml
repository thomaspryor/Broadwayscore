# Poll Resend for every draft in data/opening-night-sent.json and record the
# actual delivery state. Catches cancelled/deleted drafts that used to leave
# shows marked `completed: true` forever.
#
# Read-mostly: this workflow only mutates opening-night-sent.json fields
# (draftStatus, sentAt, recipientCount, lastReconciledAt). It never creates
# drafts or sends email.
name: Reconcile Resend Broadcast State

on:
  schedule:
    # Hourly from 11 UTC to 17 UTC — spans the 12:30 UTC draft-creation cron
    # + the 7-9 EDT / 11-13 UTC send window when Tom actually clicks Send.
    # One catch-up poll an hour later (18 UTC) closes the loop on late sends.
    - cron: '0 11-18 * * *'
  workflow_dispatch:
    inputs:
      show:
        description: 'Reconcile a single show key (e.g. cats-2026)'
        required: false
        default: ''
        type: string
      dry_run:
        description: 'No-write mode (log changes only)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: reconcile-broadcast-state
  cancel-in-progress: false

jobs:
  reconcile:
    name: Poll Resend + update opening-night-sent
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout core data
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}

      - uses: ./.github/actions/setup-node

      - name: Reconcile
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.show }}" ]; then
            ARGS="$ARGS --show=${{ inputs.show }}"
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          node scripts/reconcile-broadcast-state.js $ARGS

      # opening-night-sent.json is one of push-core-data's CORE_FILES and (as
      # of task #1759) untracked+ignored in the public repo — no public commit
      # step needed. push-core-data diffs data/opening-night-sent.json against
      # the /tmp/core-data-snapshot/ copy checkout-core-data wrote at job
      # start and safely no-ops when unchanged, so it's safe to call
      # unconditionally (gated only on dry_run, which reconcile-broadcast-
      # state.js itself already respects by skipping the writeFileSync).
      # Without this step the reconciled draftStatus/sentAt/recipientCount
      # never lands in the authoritative private data repo, so the next
      # checkout-core-data (e.g. opening-night-broadcast.yml) silently
      # reverts it to the pre-reconciliation state (task #1442, same bug
      # class as #1441's update-tony-awards.yml).
      - name: Push core data to private repo
        if: inputs.dry_run != true
        uses: ./.github/actions/push-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
          message: 'data: Reconcile Resend broadcast state'

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: 'Reconcile Broadcast State Failed'
          severity: 'warning'
          discord_webhook: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
          resend_api_key: ${{ secrets.RESEND_API_KEY }}
          owner_email: ${{ secrets.OWNER_EMAIL }}
