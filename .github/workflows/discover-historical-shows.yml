name: Discover Historical Shows

on:
  # Manual trigger only - don't run automatically
  workflow_dispatch:
    inputs:
      seasons:
        description: 'Seasons to discover (comma-separated, e.g., 2024-2025,2023-2024)'
        required: true
        type: string
      dry_run:
        description: 'Dry run (do not add to database)'
        required: false
        default: false
        type: boolean
      skip_runtimes:
        description: 'Skip Broadway.com runtime lookups (much faster)'
        required: false
        default: true
        type: boolean
      time_budget_min:
        description: 'Wall-clock budget in minutes for IBDB enrichment (0 = unlimited)'
        required: false
        default: '22'
        type: string

permissions:
  contents: write
  issues: write

# Allow parallel runs — each uses retry-push with rebase
concurrency:
  group: discover-historical-${{ github.event.inputs.seasons }}
  cancel-in-progress: false

jobs:
  discover-historical:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      historical_shows_count: ${{ steps.discover.outputs.historical_shows_count }}
      historical_shows: ${{ steps.discover.outputs.historical_shows }}
      historical_slugs: ${{ steps.discover.outputs.historical_slugs }}
      ibdb_incomplete_count: ${{ steps.discover.outputs.ibdb_incomplete_count }}
      # True only once the discovered shows have actually been pushed (both
      # repos). Downstream jobs gate on this + always() instead of job success,
      # so a 30-min-timeout cancellation AFTER the pushes no longer strands the
      # shows in shows.json with no issue and no gather-reviews dispatch
      # (manual-only workflow — nothing would ever re-discover them). Also
      # keeps downstream skipped on dry-run, where shows were never added.
      data_pushed: ${{ steps.mark-pushed.outputs.data_pushed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main


      - name: Checkout core data
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci || npm install

      - name: Setup Playwright
        if: ${{ inputs.skip_runtimes != 'true' }}
        uses: ./.github/actions/setup-playwright

      # Pre-discovery validation snapshot. Runs the same validator that gates
      # the commit below, but warn-only, and captures full output so the
      # post-discovery step can set-diff errors (task #649/#663) — a
      # pre-existing, unrelated error here must not discard today's discovery
      # commit. Skipped on dry_run since the commit gate never applies there.
      - name: Pre-validate existing data (baseline error snapshot)
        id: pre-validate
        if: inputs.dry_run != 'true'
        continue-on-error: true
        run: |
          set -o pipefail
          if node scripts/validate-data.js 2>&1 | tee /tmp/pre-validate-output.txt; then
            echo "status=ok" >> $GITHUB_OUTPUT
            echo "Pre-discovery validation: OK"
          else
            echo "status=broken" >> $GITHUB_OUTPUT
            echo "::warning::Data validation already failing BEFORE discovery — peripheral data file has an unrelated error. Discovery will still run; the commit is only blocked if discovery introduces a NEW validation error (task #649/#663 set-diff)."
          fi

      - name: Discover historical shows
        id: discover
        env:
          BRIGHTDATA_TOKEN: ${{ secrets.BRIGHTDATA_TOKEN }}
          BRIGHTDATA_ZONE: ${{ secrets.BRIGHTDATA_ZONE }}
          SCRAPINGBEE_API_KEY: ${{ secrets.SCRAPINGBEE_API_KEY }}
          SCRAPINGDOG_API_KEY: ${{ secrets.SCRAPINGDOG_API_KEY }}
          SCRAPER_USE_SCRAPINGDOG: '1'
        run: |
          # Exit the IBDB enrichment loop cleanly before the 30-min job
          # timeout; unenriched shows are still added, just without
          # IBDB-sourced dates. Default in bash, not a GHA || expression —
          # the expression coerces a literal 0 (= unlimited) to falsy.
          TB="${{ inputs.time_budget_min }}"
          [ -z "$TB" ] && TB=22

          ARGS="--seasons=${{ inputs.seasons }} --time-budget-min=$TB"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ "${{ inputs.skip_runtimes }}" = "true" ]; then
            ARGS="$ARGS --skip-runtimes"
          fi
          node scripts/discover-historical-shows.js $ARGS

      # Step 4: Validate data after discovery/enrichment. continue-on-error
      # keeps the job going so the set-diff step below can decide whether
      # this run should still commit — a pre-existing, unrelated error must
      # not discard good discovery work (task #649/#663). The "Commit gate"
      # step further down re-fails the job when the set-diff finds a
      # genuinely NEW error, restoring the original hard-fail semantics for
      # that case only.
      - name: Validate data
        id: validate
        if: inputs.dry_run != 'true'
        continue-on-error: true
        run: |
          set -o pipefail
          # GHA's default shell runs with `-e`, so a bare `echo $?` after a
          # failing pipeline never executes — pipefail makes the pipeline
          # itself the failing command and `-e` aborts the step right there,
          # silently skipping the exit-code capture (verified locally: repro
          # confirms the file is never written without the `|| EC=$?` guard).
          # `|| EC=$?` makes the assignment itself the (succeeding) statement
          # `-e` sees, so the step continues and $EC holds the real code.
          EC=0
          node scripts/validate-data.js 2>&1 | tee /tmp/post-validate-output.txt || EC=$?
          echo "$EC" > /tmp/post-validate-exitcode.txt

      # Set-diff: did discovery introduce a NEW validation error, or is the
      # only failure a pre-existing one it didn't cause? Only the former
      # should block the commit (task #649/#663). --post-exit-code guards
      # against a validate-data.js crash/format-change that exits non-zero
      # but prints nothing matching "❌ ERROR:" — without it that would read
      # as should_commit=true. Pure logic lives in
      # scripts/lib/validation-setdiff.js, tested in
      # tests/unit/discovery-validation-setdiff.test.mjs.
      - name: Compute validation error set-diff
        id: setdiff
        if: always() && inputs.dry_run != 'true'
        run: node scripts/check-validation-setdiff.js --pre=/tmp/pre-validate-output.txt --post=/tmp/post-validate-output.txt --post-exit-code="$(cat /tmp/post-validate-exitcode.txt 2>/dev/null || echo '')" >> "$GITHUB_OUTPUT"

      # Fails the job — WITHOUT continue-on-error — only when the set-diff
      # found a NEW error. Every downstream `if:` below keys off
      # steps.commit-gate.outcome instead of steps.validate.outcome, so a
      # pre-existing-only failure no longer discards discovery's writes
      # (task #649/#663).
      - name: Commit gate — block only on NEW validation errors
        id: commit-gate
        if: always() && inputs.dry_run != 'true'
        run: |
          # Discovery itself (not just validate-data.js) can fail before
          # "Validate data" ever runs — that step has no always(), so a failed
          # discover step leaves it 'skipped', not 'failure'. Without this
          # check, the missing post-validate file reads as "0 post errors",
          # the set-diff sees nothing new, and this gate would wrongly pass —
          # fail closed instead (adversarial-review finding, task #663).
          if [ "${{ steps.validate.outcome }}" = "skipped" ]; then
            echo "::error::Discovery failed before validation could run (steps.validate was skipped) — refusing to commit or push."
            exit 1
          fi
          if [ "${{ steps.setdiff.outputs.should_commit }}" != "true" ]; then
            echo "::error::Discovery introduced ${{ steps.setdiff.outputs.new_error_count }} new validation error(s): ${{ steps.setdiff.outputs.new_errors_preview }}"
            exit 1
          fi
          echo "No new validation errors — commit is clear to proceed (${{ steps.setdiff.outputs.pre_error_count }} pre-existing error(s) ignored)."

      - name: Check for changes
        id: git-check
        if: inputs.dry_run != 'true' && steps.commit-gate.outcome != 'failure'
        run: |
          git diff --exit-code data/shows.json || echo "changes=true" >> $GITHUB_OUTPUT
          if [ -f data/historical-shows-pending.json ]; then
            echo "has_pending=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: always() && steps.git-check.outputs.changes == 'true' && inputs.dry_run != 'true' && steps.commit-gate.outcome != 'failure'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # Reset any dirty tracked files from validate step (prevents rebase conflicts)
          git checkout -- data/audit/ 2>/dev/null || true

          # Core data files pushed to private repo by push-core-data action
          if [ -f data/historical-shows-pending.json ]; then
            git add data/historical-shows-pending.json
          fi

          # Create commit message
          if [ "${{ steps.discover.outputs.historical_shows_count }}" != "" ] && [ "${{ steps.discover.outputs.historical_shows_count }}" != "0" ]; then
            git commit -m "chore: Add ${{ steps.discover.outputs.historical_shows_count }} historical shows from seasons: ${{ inputs.seasons }}"
          else
            git commit -m "chore: Historical show discovery (no new shows)"
          fi

          bash scripts/lib/push-with-retry.sh

  # Create issue for historical shows

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: 'Discover Historical Shows Failed'
          discord_webhook: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
          resend_api_key: ${{ secrets.RESEND_API_KEY }}
          owner_email: ${{ secrets.OWNER_EMAIL }}

      # validate-data.js writes ${RUNNER_TEMP}/.skip-push-core-data itself
      # whenever it exits with ANY error — pre-existing or not — since it has
      # no notion of the set-diff decision made above. Without this step, a
      # pre-existing-only failure would leave the sentinel written by the
      # "Validate data" step, and push-core-data's OWN internal refusal-check
      # would still silently block the private-repo push even though
      # commit-gate (and the public-repo commit above) proceeded — the exact
      # discard-good-work bug this fix targets, just one step downstream.
      # Same ship-check finding as task #649.
      - name: Clear stale push-refusal sentinel (pre-existing errors only)
        if: always() && steps.commit-gate.outcome != 'failure'
        run: |
          SENTINEL="${RUNNER_TEMP:-/tmp}/.skip-push-core-data"
          if [ -f "$SENTINEL" ]; then
            echo "Clearing stale push-refusal sentinel — set-diff found no NEW validation errors (task #649/#663)."
            rm -f "$SENTINEL"
          fi

      - name: Push core data to private repo
        id: core-push
        # Gated on commit-gate (matches the shipped #649 pattern in
        # update-show-status.yml:572) — the sentinel-clear step above is only
        # a secondary guard for validate-data.js's OWN sentinel; without this
        # condition core-push would run unconditionally and depend entirely
        # on that sentinel existing, which isn't true if commit-gate failed
        # for a reason other than validate-data.js itself erroring (e.g. the
        # set-diff step crashing) — adversarial-review finding, task #663.
        if: always() && steps.commit-gate.outcome != 'failure'
        uses: ./.github/actions/push-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
          message: 'data: Update from discover-historical-shows'

      - name: Mark data pushed (gates downstream jobs)
        id: mark-pushed
        if: always() && steps.core-push.outcome == 'success' && steps.commit-gate.outcome != 'failure' && inputs.dry_run != 'true'
        run: echo "data_pushed=true" >> "$GITHUB_OUTPUT"
  create-issue:
    needs: discover-historical
    if: always() && needs.discover-historical.outputs.data_pushed == 'true' && needs.discover-historical.outputs.historical_shows_count != '' && needs.discover-historical.outputs.historical_shows_count != '0'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout to read pending shows
        uses: actions/checkout@v5
        with:
          ref: main


      - name: Checkout core data
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
      - name: Create issue for historical shows
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const count = '${{ needs.discover-historical.outputs.historical_shows_count }}';
            const ibdbIncompleteCount = parseInt('${{ needs.discover-historical.outputs.ibdb_incomplete_count }}' || '0', 10);

            // Read pending shows from file
            const pendingData = JSON.parse(fs.readFileSync('data/historical-shows-pending.json', 'utf8'));
            const shows = pendingData.shows;
            const seasons = pendingData.seasons;
            const showsList = shows.map(s => `- ${s.title} (${s.season}, ${s.venue})`).join('\n');
            const slugs = shows.map(s => s.slug);

            // Budget-exit visibility (#421 follow-up): when the IBDB
            // enrichment loop hits its time budget, the tail of shows is
            // still added but without IBDB-sourced dates/creative team.
            // Without this, that partial state was only visible in job logs.
            const ibdbNote = ibdbIncompleteCount > 0
              ? `\n> ⏱ **${ibdbIncompleteCount} of the above show(s) were added without IBDB-sourced dates/creative team** — the enrichment step hit its time budget. Re-run \`enrich-ibdb-dates.yml\` for the affected shows, or wait for its weekly cron.\n`
              : '';

            const issueBody = `## Historical Broadway Shows Discovered

            The historical discovery script found **${count} show(s)** from seasons: **${seasons.join(', ')}**
            ${ibdbNote}
            ${showsList}

            ### Action Required

            These shows have been added to \`shows.json\` as **closed shows** with basic metadata but need:

            - [ ] Complete metadata (runtime, cast, creative team, synopsis)
            - [ ] Image verification (many historical shows may not have images)
            - [ ] Review data collection (when ready to backfill)

            ### Shows to process:
            ${slugs.map(s => `- [ ] \`${s}\``).join('\n')}

            ### Note on Review Data

            Review gathering has been automatically triggered for all historical shows.
            Check the "Gather Reviews" workflow for progress.

            ---
            *This issue was auto-generated by the Historical Show Discovery workflow*
            `;

            const title = shows.length === 1
              ? `📚 Historical Show: ${shows[0].title}`
              : `📚 ${shows.length} Historical Shows from ${seasons.join(', ')}`;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: issueBody,
              labels: ['historical-show', 'needs-metadata', 'automated']
            });

  # Trigger review data gathering for historical shows
  trigger-review-gathering:
    needs: discover-historical
    if: always() && needs.discover-historical.outputs.data_pushed == 'true' && needs.discover-historical.outputs.historical_shows_count != '' && needs.discover-historical.outputs.historical_shows_count != '0'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger gather-reviews workflow
        uses: actions/github-script@v7
        with:
          script: |
            const slugs = '${{ needs.discover-historical.outputs.historical_slugs }}';

            // Check if the gather-reviews workflow exists and trigger it
            try {
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'gather-reviews.yml',
                ref: 'main',
                inputs: {
                  shows: slugs
                }
              });
              console.log(`Triggered gather-reviews workflow for historical shows: ${slugs}`);
            } catch (e) {
              console.log('gather-reviews workflow not found or failed to trigger:', e.message);
            }

      - name: Trigger cast backfill for historical shows
        uses: actions/github-script@v7
        with:
          script: |
            // Trigger IBDB cast scraping for each historical show
            const slugs = '${{ needs.discover-historical.outputs.historical_slugs }}'.split(',').filter(Boolean);
            for (const slug of slugs) {
              try {
                await github.rest.actions.createWorkflowDispatch({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id: 'backfill-cast.yml',
                  ref: 'main',
                  inputs: {
                    show_filter: slug
                  }
                });
                console.log(`Triggered cast backfill for: ${slug}`);
                // 10s spacing between dispatch calls
                await new Promise(r => setTimeout(r, 10000));
              } catch (e) {
                console.log(`Cast backfill trigger failed for ${slug}:`, e.message);
              }
            }

      - name: Trigger image fetching workflow
        uses: actions/github-script@v7
        with:
          script: |
            // Trigger image fetching + archival for historical shows
            try {
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'fetch-all-image-formats.yml',
                ref: 'main',
                inputs: {
                  only_missing: 'true'
                }
              });
              console.log('Triggered image fetching workflow for historical shows');
            } catch (e) {
              console.log('Image fetching workflow trigger failed:', e.message);
            }
