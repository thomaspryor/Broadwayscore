name: Test Model Consistency

on:
  workflow_dispatch:
    inputs:
      review_count:
        description: 'Number of reviews to test'
        required: false
        default: '5'

env:
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

jobs:
  test-consistency:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6


      - name: Checkout core data
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
      - uses: ./.github/actions/setup-node

      - name: Run consistency test
        run: |
          npx ts-node --project scripts/tsconfig.json scripts/llm-scoring/test-consistency.ts
      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: 'Test Model Consistency Failed'
          discord_webhook: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
