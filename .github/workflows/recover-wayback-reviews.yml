name: Recover Wayback Reviews

on:
  workflow_dispatch:
    inputs:
      max_urls:
        description: 'Max URLs to process (0 = all ~718)'
        required: false
        default: '0'
      tier_filter:
        description: 'Only process specific tier (1, 2, 3, or empty for all)'
        required: false
        default: ''
      domain_filter:
        description: 'Only process specific domains (comma-separated)'
        required: false
        default: ''
      dry_run:
        description: 'Discovery only - no file writes'
        required: false
        default: 'false'
      source_mode:
        description: 'Candidate source: failed-fetches (dead URLs), incomplete (truncated reviews), or reviews-json (reviews with URLs but no files)'
        required: false
        default: 'failed-fetches'

permissions:
  contents: write
  actions: write

concurrency:
  # concurrency-queue-ok: rare (weekly cron / manual); shares this group only with
  # its sibling review-texts audit. gather-reviews.yml left it in BRO-4859.
  group: review-texts-backfill-write
  cancel-in-progress: false

jobs:
  recover:
    name: Recover reviews from Wayback Machine
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      # BRO-4231: this job checks out a blobless partial clone (filter: blob:none
      # on the checkout below), so rebase/diff/show fetch missing blobs over the
      # network outside push-with-retry.sh's per-op timeout wrappers. Set git's
      # low-speed abort (1 KB/s for 45 s, the bound the helper applies to its own
      # fetch/push) for EVERY git transfer in this job: --global, and before the
      # checkout, so actions/checkout's own first lazy blob batch and the depth-1
      # private-repo clones (checkout-core-data / checkout-review-texts, no
      # timeout of their own; their retry loop catches the abort) are bounded
      # too. A stalled transfer fails fast instead of hanging to the job timeout.
      # lowSpeed cannot catch a pre-transfer stall. Runner $HOME is ephemeral.
      - name: Set git low-speed abort for this job
        run: |
          git config --global http.lowSpeedLimit 1000
          git config --global http.lowSpeedTime 45

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          # BRO-4231: filter: blob:none keeps the full commit graph fetch-depth: 0 is
          # here for (a resolvable merge-base for push-with-retry.sh; #209 parentless
          # root) but stops downloading every historical blob of this repo's data/*.json
          # rewrites: ~24 min -> ~30 s per checkout (llm-ensemble-score runs 36523767401
          # -> 36672742657). Full rationale: opening-night-poller.yml's Checkout step.
          filter: blob:none



      - name: Checkout core data
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
      - name: Checkout review-texts (private repo)
        uses: ./.github/actions/checkout-review-texts
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
      - uses: ./.github/actions/setup-node
        with:
          configure-git: 'true'

      - name: Run Wayback recovery
        env:
          MAX_URLS: ${{ inputs.max_urls }}
          TIER_FILTER: ${{ inputs.tier_filter }}
          DOMAIN_FILTER: ${{ inputs.domain_filter }}
          DRY_RUN: ${{ inputs.dry_run }}
          SOURCE_MODE: ${{ inputs.source_mode }}
        run: node scripts/recover-wayback-reviews.js


      - name: Push review-texts to private repo
        if: always()
        uses: ./.github/actions/push-review-texts
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
          message: "data: Recover Wayback Reviews — Final commit and push"
      - name: Final commit and push
        if: always()
        run: |
          # review-texts are gitignored (pushed via push-review-texts)
          git add data/audit/
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          RECOVERED=$(node -e "
            try {
              const r = require('./data/audit/wayback-recovery-report.json');
              console.log(r.recovered || 0);
            } catch { console.log(0); }
          ")

          git commit -m "feat: Recover $RECOVERED review texts from Wayback Machine

          Co-Authored-By: GitHub Action <action@github.com>"

          bash scripts/lib/push-with-retry.sh

      - name: Trigger rebuild
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RECOVERED=$(node -e "
            try {
              const r = require('./data/audit/wayback-recovery-report.json');
              console.log(r.recovered || 0);
            } catch { console.log(0); }
          ")

          if [ "$RECOVERED" -gt "0" ]; then
            echo "Triggering rebuild for $RECOVERED recovered reviews..."
            gh workflow run rebuild-reviews.yml \
              -f reason="Post Wayback recovery ($RECOVERED reviews)"
          else
            echo "No recoveries, skipping rebuild."
          fi

      - name: Upload recovery report
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: wayback-recovery-report
          path: data/audit/wayback-recovery-report.json
          retention-days: 30

      - name: Summary
        if: always()
        run: |
          node -e "
            try {
              const r = require('./data/audit/wayback-recovery-report.json');
              const lines = [
                '## Wayback Recovery Summary',
                '',
                '| Metric | Count |',
                '|--------|-------|',
                '| Candidates | ' + (r.totalCandidates || 0) + ' |',
                '| CDX snapshots found | ' + (r.cdxFound || 0) + ' |',
                '| Recovered (success) | ' + (r.recovered || 0) + ' |',
                '|   via archive.today | ' + (r.archiveTodayRecovered || 0) + ' |',
                '| Not in archive | ' + (r.notInArchive || 0) + ' |',
                '| Too short (<300 chars) | ' + (r.tooShort || 0) + ' |',
                '| Garbage content | ' + (r.garbage || 0) + ' |',
                '| Errors | ' + (r.errors || 0) + ' |',
                '',
                '### By Tier',
                '| Tier | Recovered |',
                '|------|-----------|',
                '| Tier 1 | ' + (r.recoveredByTier?.[1] || 0) + ' |',
                '| Tier 2 | ' + (r.recoveredByTier?.[2] || 0) + ' |',
                '| Tier 3 | ' + (r.recoveredByTier?.[3] || 0) + ' |',
              ];
              console.log(lines.join('\n'));
            } catch(e) {
              console.log('No report generated: ' + e.message);
            }
          " >> $GITHUB_STEP_SUMMARY
      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: 'Recover Wayback Reviews Failed'
          severity: 'warning'
          discord_webhook: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
