# Audit cross-production contamination — detect reviews filed under wrong production
# Runs weekly on Sundays at 6 AM UTC (1 AM EST)
name: Audit Cross-Production

on:
  schedule:
    - cron: '0 6 * * 0'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  # concurrency-queue-ok: rare (weekly cron / manual); shares this group only with
  # its sibling review-texts audit. gather-reviews.yml left it in BRO-4859.
  group: review-texts-backfill-write
  cancel-in-progress: false

jobs:
  audit:
    name: Audit cross-production contamination
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout core data
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}

      - name: Checkout review-texts (private repo)
        uses: ./.github/actions/checkout-review-texts
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'

      - name: Run cross-production audit
        run: node scripts/audit-cross-production.js

      - name: Check for issues
        run: |
          ISSUES=$(node -e "const a=require('./data/audit/cross-production-audit.json'); console.log(a.likelyWrongProduction)")
          echo "Found $ISSUES unflagged wrong-production reviews"
          if [ "$ISSUES" -gt 0 ]; then
            echo "::warning::$ISSUES unflagged wrong-production reviews detected — manual review needed"
          fi

      - name: Commit audit results
        continue-on-error: true # a failed push shows red but does not fail the job; was `|| echo` (BRO-4730)
        if: always()
        run: |
          cd data/audit
          if git diff --quiet cross-production-audit.json 2>/dev/null; then
            echo "No changes to audit file"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add cross-production-audit.json
            git commit -m "audit: Update cross-production audit results [skip ci]"
            bash scripts/lib/push-with-retry.sh
          fi

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: 'Audit Cross-Production Failed'
          severity: 'warning'
