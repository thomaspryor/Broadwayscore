name: Collection Coverage Report
on:
  schedule:
    - cron: '0 15 * * 1'  # Monday 3 PM UTC (10 AM EST), after posthog-monday.yml (08:00 UTC)
  workflow_dispatch: {}

# BRO-3071: added so its own cron can't race a manual workflow_dispatch into
# a lost push on data/audit/collection-coverage.json / collection-coverage-
# history.json (both now apiFallbackSafe — see scripts/lib/core-data-
# merge-registry.js — which requires this dedicated group).
concurrency:
  group: collection-coverage-report
  cancel-in-progress: false

permissions:
  contents: write
  actions: write
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
      - uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
      # BRO-5962: the dashboard scans data/review-texts; without this checkout it
      # exited 1 ("review-texts directory not found") on every run.
      - uses: ./.github/actions/checkout-review-texts
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Generate coverage report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/collection-coverage-dashboard.js --issue
      - name: Commit coverage data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          bash scripts/lib/git-add-existing.sh data/audit/collection-coverage.json data/audit/collection-coverage-history.json
          git diff --staged --quiet && exit 0
          git commit -m "data: Update collection coverage report [skip ci]"
          bash scripts/lib/push-with-retry.sh 5 main
      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: 'Collection Coverage Report Failed'
          discord_webhook: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
