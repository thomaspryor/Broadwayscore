name: Auto-Fix Feedback Bug

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to process'
        required: true
        type: number

concurrency:
  group: auto-fix-feedback-bug
  cancel-in-progress: false

jobs:
  auto-fix:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.issue.labels.*.name, 'bug-diagnosis')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Resolve issue number and body
        id: issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            NUM="${{ inputs.issue_number }}"
          else
            NUM="${{ github.event.issue.number }}"
          fi
          echo "number=$NUM" >> $GITHUB_OUTPUT
          BODY=$(gh api repos/${{ github.repository }}/issues/$NUM --jq '.body')
          EOF_MARKER="EOFBODY_$(date +%s)"
          echo "body<<$EOF_MARKER" >> $GITHUB_OUTPUT
          echo "$BODY" >> $GITHUB_OUTPUT
          echo "$EOF_MARKER" >> $GITHUB_OUTPUT

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}


      - name: Checkout core data
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run auto-fix
        id: fix
        env:
          ISSUE_BODY: ${{ steps.issue.outputs.body }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/auto-fix-feedback-bug.js

      - name: Commit and push
        if: always() && steps.fix.outputs.action == 'fixed'
        env:
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          # Core data files pushed to private repo by push-core-data action
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "fix(data): Auto-fix feedback bug #${ISSUE_NUMBER}

          Co-Authored-By: github-actions[bot] <github-actions[bot]@users.noreply.github.com>"

            bash scripts/lib/push-with-retry.sh
          fi


      - name: Push core data to private repo
        if: always()
        uses: ./.github/actions/push-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
          message: 'data: Update from auto-fix-feedback-bug'

      - name: Dispatch deploy
        if: always()
        uses: ./.github/actions/dispatch-deploy

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: 'Auto-Fix Feedback Bug Failed'
          discord_webhook: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
          resend_api_key: ${{ secrets.RESEND_API_KEY }}
          owner_email: ${{ secrets.OWNER_EMAIL }}

      - name: Update issue labels (no comment — avoids GitHub notification noise)
        if: always()
        uses: actions/github-script@v9
        env:
          FIX_ACTION: ${{ steps.fix.outputs.action }}
          FIX_ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const action = process.env.FIX_ACTION || 'error';
            const issueNumber = parseInt(process.env.FIX_ISSUE_NUMBER);

            // Only comment for actionable outcomes (fix applied or error).
            // Routine skips/manual-review get labels only — the approval email
            // is the human-facing notification channel, not GitHub comments.
            if (action === 'fixed') {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issueNumber,
                body: '## Fix Applied\n\nThe data fix has been applied and will be live shortly.'
              });
              await github.rest.issues.addLabels({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issueNumber, labels: ['auto-fixed']
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issueNumber,
                state: 'closed', state_reason: 'completed'
              });
            } else if (action === 'not-a-bug') {
              await github.rest.issues.addLabels({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issueNumber, labels: ['not-a-bug']
              });
            } else if (action === 'error') {
              // Only comment on actual errors so we notice failures
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issueNumber,
                body: '## Error\n\nAuto-fix encountered an error. A maintainer will review.'
              });
              await github.rest.issues.addLabels({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issueNumber, labels: ['needs-manual-review']
              });
            } else {
              // skipped, validation-failed — just label, no comment (no notification)
              await github.rest.issues.addLabels({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issueNumber, labels: ['needs-manual-review']
              });
            }

      - name: Generate remediation plan
        if: always() && steps.fix.outputs.action != 'fixed' && steps.fix.outputs.action != 'not-a-bug'
        id: plan
        env:
          ISSUE_BODY: ${{ steps.issue.outputs.body }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
          FIX_ACTION: ${{ steps.fix.outputs.action }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
          APPROVAL_HMAC_SECRET: ${{ secrets.APPROVAL_HMAC_SECRET }}
        run: node scripts/generate-remediation-plan.js

      - name: Commit pending fix plan
        if: always() && steps.plan.outputs.plan_created == 'true'
        env:
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          git add data/pending-fixes/
          if git diff --staged --quiet; then
            echo "No plan file to commit"
          else
            git commit -m "chore: Save remediation plan for #${ISSUE_NUMBER}

          Co-Authored-By: github-actions[bot] <github-actions[bot]@users.noreply.github.com>"

            bash scripts/lib/push-with-retry.sh
          fi

      - name: Send thank-you email to submitter
        if: always() && (steps.fix.outputs.action == 'fixed' || steps.fix.outputs.action == 'not-a-bug')
        env:
          ISSUE_BODY: ${{ steps.issue.outputs.body }}
          FIX_ACTION: ${{ steps.fix.outputs.action }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          node -e "
          const https = require('https');

          const body = process.env.ISSUE_BODY || '';
          const action = process.env.FIX_ACTION;
          const resendKey = process.env.RESEND_API_KEY;

          // Extract submitter info from DIAGNOSIS_JSON
          const match = body.match(/<!-- DIAGNOSIS_JSON\n([\s\S]*?)\nDIAGNOSIS_JSON -->/);
          if (!match) { console.log('No DIAGNOSIS_JSON found'); process.exit(0); }

          let diag;
          try { diag = JSON.parse(match[1]); } catch { console.log('Invalid JSON'); process.exit(0); }

          const email = diag.submitterEmail;
          if (!email || !resendKey) { console.log('No email or Resend key'); process.exit(0); }

          // Build email using the template
          const { buildFeedbackThankYouEmail } = require('./scripts/lib/email-templates.js');
          const type = action === 'fixed' ? 'fixed' : 'acknowledged';
          const { subject, html } = buildFeedbackThankYouEmail(type, diag.submitterName, diag.submitterShow);

          const data = JSON.stringify({
            from: 'Tom at Broadway Scorecard <updates@broadwayscorecard.com>',
            to: [email],
            subject,
            html,
          });

          const req = https.request('https://api.resend.com/emails', {
            method: 'POST',
            headers: {
              'Authorization': 'Bearer ' + resendKey,
              'Content-Type': 'application/json',
              'Content-Length': Buffer.byteLength(data),
            },
          }, (res) => {
            let body = '';
            res.on('data', c => body += c);
            res.on('end', () => {
              if (res.statusCode >= 200 && res.statusCode < 300) {
                console.log('Sent ' + type + ' thank-you to ' + email);
              } else {
                console.log('Email failed: ' + res.statusCode + ' ' + body.slice(0, 200));
              }
            });
          });
          req.on('error', e => console.log('Email error: ' + e.message));
          req.write(data);
          req.end();
          "
