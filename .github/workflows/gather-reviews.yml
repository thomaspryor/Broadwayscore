name: Gather Review Data

on:
  # Triggered by update-shows workflow when new shows are discovered
  workflow_dispatch:
    inputs:
      shows:
        description: 'Comma-separated list of show slugs to gather reviews for'
        required: true
        type: string
      parallel_jobs:
        description: 'Number of parallel jobs to split shows across (1=sequential, 2-10=parallel)'
        required: false
        default: '1'
        type: string
      max_tier:
        description: 'Max outlet tier for SERP discovery (2=T1+T2, 3=include T3 for opening nights)'
        required: false
        default: '2'
        type: string

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  # Step 1: Split shows into batches for parallel processing
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.split.outputs.matrix }}
      job_count: ${{ steps.split.outputs.job_count }}
    steps:
      - name: Split shows into parallel batches
        id: split
        run: |
          SHOWS="${{ inputs.shows }}"
          JOBS=${{ inputs.parallel_jobs }}

          # Validate parallel_jobs is 1-10
          if [ "$JOBS" -lt 1 ] 2>/dev/null || [ "$JOBS" -gt 10 ] 2>/dev/null; then
            JOBS=1
          fi

          # Split comma-separated shows into array
          IFS=',' read -ra SHOW_ARRAY <<< "$SHOWS"
          TOTAL=${#SHOW_ARRAY[@]}

          # Don't use more jobs than shows
          if [ "$JOBS" -gt "$TOTAL" ]; then
            JOBS=$TOTAL
          fi

          echo "Total shows: $TOTAL, parallel jobs: $JOBS"

          # Distribute shows across jobs round-robin
          declare -a BATCHES
          for i in $(seq 0 $((JOBS - 1))); do
            BATCHES[$i]=""
          done

          for i in "${!SHOW_ARRAY[@]}"; do
            BATCH_IDX=$((i % JOBS))
            SHOW=$(echo "${SHOW_ARRAY[$i]}" | xargs)  # trim whitespace
            if [ -n "${BATCHES[$BATCH_IDX]}" ]; then
              BATCHES[$BATCH_IDX]="${BATCHES[$BATCH_IDX]},$SHOW"
            else
              BATCHES[$BATCH_IDX]="$SHOW"
            fi
          done

          # Build JSON matrix
          MATRIX='{"include":['
          FIRST=true
          for i in $(seq 0 $((JOBS - 1))); do
            if [ -n "${BATCHES[$i]}" ]; then
              if [ "$FIRST" = true ]; then
                FIRST=false
              else
                MATRIX="$MATRIX,"
              fi
              # Stagger start: 30s between each job to avoid rate limiting aggregators
              DELAY=$((i * 30))
              MATRIX="$MATRIX{\"batch_id\":$i,\"shows\":\"${BATCHES[$i]}\",\"delay\":$DELAY}"
            fi
          done
          MATRIX="$MATRIX]}"

          echo "Matrix: $MATRIX"
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
          echo "job_count=$JOBS" >> $GITHUB_OUTPUT

  # Step 1b: Outlet-first SERP discovery (runs before aggregator gathering)
  outlet-serp:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}

      - uses: ./.github/actions/checkout-review-texts
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Outlet-first SERP discovery
        env:
          SCRAPINGBEE_API_KEY: ${{ secrets.SCRAPINGBEE_API_KEY }}
          BRIGHTDATA_TOKEN: ${{ secrets.BRIGHTDATA_TOKEN }}
        run: |
          MAX_TIER="${{ inputs.max_tier }}"
          MAX_TIER="${MAX_TIER:-2}"
          # Opening night (max_tier=3): full 200 searches for speed. Routine: 30 (weekly run handles the rest).
          MAX_SEARCHES=$([ "$MAX_TIER" = "3" ] && echo "200" || echo "30")
          echo "Running outlet-first SERP discovery for: ${{ inputs.shows }} (max tier: $MAX_TIER, max searches: $MAX_SEARCHES)"
          node scripts/collect-outlet-reviews.js \
            --shows "${{ inputs.shows }}" \
            --max-tier "$MAX_TIER" \
            --max-searches "$MAX_SEARCHES"

      - name: Push review texts
        if: always()
        uses: ./.github/actions/push-review-texts
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
          message: "data: Outlet-first SERP discovery for ${{ inputs.shows }}"

  # Step 2: Gather reviews in parallel batches
  gather-reviews:
    needs: [prepare, outlet-serp]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
      fail-fast: false  # Don't cancel other batches if one fails
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main



      - name: Checkout core data
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
      - name: Checkout review-texts (private repo)
        uses: ./.github/actions/checkout-review-texts
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
      - name: Checkout aggregator-archive (private repo)
        uses: ./.github/actions/checkout-aggregator-archive
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Setup Playwright
        uses: ./.github/actions/setup-playwright

      - name: Stagger start to avoid rate limiting
        if: matrix.delay > 0
        run: |
          echo "Waiting ${{ matrix.delay }}s before starting (batch ${{ matrix.batch_id }})"
          sleep ${{ matrix.delay }}

      - name: Display shows to process
        run: |
          echo "Batch ${{ matrix.batch_id }}: Gathering review data for shows: ${{ matrix.shows }}"

      - name: Gather reviews
        id: gather
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BRIGHTDATA_TOKEN: ${{ secrets.BRIGHTDATA_TOKEN }}
          SCRAPINGBEE_API_KEY: ${{ secrets.SCRAPINGBEE_API_KEY }}
          BROWSERBASE_API_KEY: ${{ secrets.BROWSERBASE_API_KEY }}
          BROWSERBASE_PROJECT_ID: ${{ secrets.BROWSERBASE_PROJECT_ID }}
          COOKIES_BUNDLE_1: ${{ secrets.COOKIES_BUNDLE_1 }}
          COOKIES_BUNDLE_2: ${{ secrets.COOKIES_BUNDLE_2 }}
          COOKIES_BUNDLE_3: ${{ secrets.COOKIES_BUNDLE_3 }}
          COOKIES_BUNDLE_4: ${{ secrets.COOKIES_BUNDLE_4 }}
          COOKIES_BUNDLE_5: ${{ secrets.COOKIES_BUNDLE_5 }}
          COOKIES_BUNDLE_6: ${{ secrets.COOKIES_BUNDLE_6 }}
          COOKIES_BUNDLE_7: ${{ secrets.COOKIES_BUNDLE_7 }}
          COOKIES_BUNDLE_8: ${{ secrets.COOKIES_BUNDLE_8 }}
          COOKIES_BUNDLE_9: ${{ secrets.COOKIES_BUNDLE_9 }}
          COOKIES_BUNDLE_10: ${{ secrets.COOKIES_BUNDLE_10 }}
          COOKIES_BUNDLE_11: ${{ secrets.COOKIES_BUNDLE_11 }}
        run: |
          SHOWS="${{ matrix.shows }}"

          echo "Processing shows: $SHOWS"
          echo "ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:+SET}"

          # Check if gather-reviews script exists
          if [ -f scripts/gather-reviews.js ]; then
            node scripts/gather-reviews.js --shows="$SHOWS"
          else
            echo "Note: scripts/gather-reviews.js not found"
            echo "Review data will need to be gathered manually"
            echo "shows_processed=0" >> $GITHUB_OUTPUT
            exit 0
          fi

      - name: Validate data before commit
        continue-on-error: true
        run: node scripts/validate-data.js

      - name: Check for changes
        id: git-check
        run: |
          # Check for changes in collection-state (aggregator-archive is now in private repo)
          git diff --exit-code data/collection-state/ 2>/dev/null || echo "changes=true" >> $GITHUB_OUTPUT
          if [ -n "$(git ls-files --others --exclude-standard data/collection-state/)" ]; then
            echo "changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Check for large files
        if: steps.git-check.outputs.changes == 'true'
        uses: ./.github/actions/check-file-sizes


      - name: Push review-texts to private repo
        if: always()
        uses: ./.github/actions/push-review-texts
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
          message: "data: Gather Review Data — Commit review data"
      - name: Push aggregator-archive to private repo
        if: always()
        uses: ./.github/actions/push-aggregator-archive
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
          message: "data: Gather Review Data — aggregator archive"
      - name: Commit collection-state
        if: always() && steps.git-check.outputs.changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add data/collection-state/

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "feat: Add review data for ${{ matrix.shows }}"

          # Stagger push by batch_id to avoid parallel matrix jobs colliding
          BATCH_PUSH_DELAY=$((${{ matrix.batch_id }} * 15))
          if [ $BATCH_PUSH_DELAY -gt 0 ]; then
            echo "Staggering push by ${BATCH_PUSH_DELAY}s (batch ${{ matrix.batch_id }})"
            sleep $BATCH_PUSH_DELAY
          fi

          bash scripts/lib/push-with-retry.sh 8 main

      - name: Notify on gather failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: 'Gather Reviews Failed (gather job)'
          severity: 'critical'
          discord_webhook: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}

  # Step 3: Scrape supplementary aggregators (Playbill Verdict + NYC Theatre)
  scrape-aggregators:
    needs: [prepare, gather-reviews]
    if: always() && needs.gather-reviews.result != 'cancelled'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout (latest, after gather pushes)
        uses: actions/checkout@v4
        with:
          ref: main



      - name: Checkout core data
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
      - name: Checkout review-texts (private repo)
        uses: ./.github/actions/checkout-review-texts
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
      - name: Checkout aggregator-archive (private repo)
        uses: ./.github/actions/checkout-aggregator-archive
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Scrape Playbill Verdict for target shows
        env:
          SCRAPINGBEE_API_KEY: ${{ secrets.SCRAPINGBEE_API_KEY }}
          BRIGHTDATA_TOKEN: ${{ secrets.BRIGHTDATA_TOKEN }}
        run: node scripts/scrape-playbill-verdict.js --shows=${{ inputs.shows }}

      - name: Scrape NYC Theatre roundups for target shows
        env:
          SCRAPINGBEE_API_KEY: ${{ secrets.SCRAPINGBEE_API_KEY }}
        run: node scripts/scrape-nyc-theatre-roundups.js --shows=${{ inputs.shows }}

      - name: Scrape BWW Review Roundups for target shows
        env:
          SCRAPINGBEE_API_KEY: ${{ secrets.SCRAPINGBEE_API_KEY }}
        run: node scripts/scrape-bww-reviews.js --type=roundup --shows=${{ inputs.shows }}

      - name: Scrape LBO roundups for West End target shows
        continue-on-error: true
        env:
          SCRAPINGBEE_API_KEY: ${{ secrets.SCRAPINGBEE_API_KEY }}
        run: |
          # Only run if any target shows are West End
          WE_SHOWS=$(node -e "
            const shows = require('./data/shows.json').shows;
            const targets = '${{ inputs.shows }}'.split(',');
            const we = targets.filter(id => {
              const s = shows.find(x => x.id === id);
              return s && s.category === 'west-end';
            });
            console.log(we.join(','));
          ")
          if [ -n "$WE_SHOWS" ]; then
            echo "Running LBO roundups for WE shows: $WE_SHOWS"
            node scripts/scrape-london-box-office-roundups.js --shows=$WE_SHOWS
          else
            echo "No WE shows in target list — skipping LBO"
          fi

      - name: Push review-texts to private repo
        if: always()
        uses: ./.github/actions/push-review-texts
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
          message: "data: Gather Review Data — Commit and push aggregator data"
      - name: Push aggregator-archive to private repo
        if: always()
        uses: ./.github/actions/push-aggregator-archive
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
          message: "data: Add aggregator data (PV + NYC Theatre + BWW + LBO Roundups) for ${{ inputs.shows }}"

  # Step 4: Rebuild reviews.json after all batches and aggregators complete
  rebuild:
    needs: [prepare, gather-reviews, scrape-aggregators]
    if: always() && needs.gather-reviews.result != 'cancelled'
    runs-on: ubuntu-latest
    concurrency:
      group: rebuild-reviews
      cancel-in-progress: false
    steps:
      - name: Checkout (latest, after all batches pushed)
        uses: actions/checkout@v4
        with:
          ref: main



      - name: Checkout core data
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
      - name: Checkout review-texts (private repo)
        uses: ./.github/actions/checkout-review-texts
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Rebuild reviews.json
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/rebuild-all-reviews.js

      - name: Push review-texts to private repo
        if: always()
        uses: ./.github/actions/push-review-texts
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
          message: "data: Gather Review Data — Commit rebuilt reviews.json"
      - name: Commit rebuilt reviews.json
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add data/audit/
          if git diff --staged --quiet; then
            echo "No changes to reviews.json"
          else
            git commit -m "data: Auto-rebuild reviews.json after gather (${{ inputs.shows }})"
            bash scripts/lib/push-with-retry.sh
          fi


      - name: Push core data to private repo
        if: always()
        uses: ./.github/actions/push-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
          message: 'data: Update from gather-reviews'
      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: 'Gather Reviews Failed'
          discord_webhook: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}

      - name: Trigger deploy (data changed)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Deploy dedup: skip only if a deploy was triggered AFTER this run started
          OUR_RUN_START=$(gh run view ${{ github.run_id }} --json createdAt -q '.createdAt' 2>/dev/null || echo "")
          RECENT=$(gh run list --workflow=vercel-deploy.yml --limit=1 --json createdAt -q '.[0].createdAt' 2>/dev/null || echo "")

          if [ -n "$RECENT" ] && [ -n "$OUR_RUN_START" ]; then
            RECENT_TS=$(date -d "$RECENT" +%s 2>/dev/null || date -j -f "%Y-%m-%dT%H:%M:%SZ" "$RECENT" +%s 2>/dev/null || echo "0")
            OUR_TS=$(date -d "$OUR_RUN_START" +%s 2>/dev/null || date -j -f "%Y-%m-%dT%H:%M:%SZ" "$OUR_RUN_START" +%s 2>/dev/null || echo "0")
            NOW_TS=$(date +%s)
            DIFF=$((NOW_TS - RECENT_TS))

            if [ "$RECENT_TS" -gt "$OUR_TS" ] && [ "$DIFF" -lt 900 ]; then
              echo "Skipping deploy — one was already triggered after this run started (${DIFF}s ago)"
              exit 0
            fi
          fi

          echo "Triggering deploy..."
          gh workflow run vercel-deploy.yml || echo "Deploy dispatch failed — will deploy on next schedule"
      - name: Auto-trigger text collection if needed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Count review stubs needing fullText
          NEEDS_COLLECTION=$(node -e '
            const fs = require("fs"), path = require("path");
            const base = "data/review-texts";
            let n = 0;
            const dirs = fs.readdirSync(base).filter(d => {
              try { return fs.statSync(path.join(base, d)).isDirectory(); } catch { return false; }
            });
            dirs.forEach(d => {
              fs.readdirSync(path.join(base, d)).filter(f => f.endsWith(".json") && f !== "failed-fetches.json").forEach(f => {
                try {
                  const r = JSON.parse(fs.readFileSync(path.join(base, d, f), "utf8"));
                  if (r.wrongProduction || r.wrongShow || r.wrongAttribution) return;
                  if (r.url && (!r.fullText || r.fullText.length < 50)) n++;
                } catch {}
              });
            });
            console.log(n);
          ')

          echo "Reviews needing text collection: $NEEDS_COLLECTION"

          # For targeted show runs, always trigger collection (even 1 review)
          # For broad runs, use higher threshold to avoid noise
          SHOW_INPUT="${{ inputs.shows }}"
          if [ -n "$SHOW_INPUT" ]; then
            THRESHOLD=1
          else
            THRESHOLD=20
          fi
          if [ "$NEEDS_COLLECTION" -lt "$THRESHOLD" ]; then
            echo "Below threshold ($THRESHOLD). Skipping auto-trigger."
            exit 0
          fi

          RUNNING=$(gh run list --workflow=collect-review-texts.yml --status=in_progress --json databaseId --jq 'length' 2>/dev/null || echo "0")
          QUEUED=$(gh run list --workflow=collect-review-texts.yml --status=queued --json databaseId --jq 'length' 2>/dev/null || echo "0")
          WAITING=$(gh run list --workflow=collect-review-texts.yml --status=waiting --json databaseId --jq 'length' 2>/dev/null || echo "0")
          ACTIVE=$((RUNNING + QUEUED + WAITING))
          if [ "$ACTIVE" -gt 0 ]; then
            echo "Text collection already active ($RUNNING running, $QUEUED queued). Skipping."
            exit 0
          fi

          # Target the specific gathered shows first for fast turnaround
          SHOWS="${{ inputs.shows }}"
          echo "Triggering targeted text collection for shows: $SHOWS"
          gh workflow run collect-review-texts.yml \
            -f show_filter="$SHOWS" \
            -f max_reviews=100 \
            -f browserbase_enabled=true \
            -f retry_failed=true \
            -f archive_first=true \
            -f chain=false

          echo "Text collection auto-triggered successfully."

      - name: Auto-trigger LLM scoring if needed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Count unscored reviews for the gathered shows
          SHOWS="${{ inputs.shows }}"
          UNSCORED=$(node -e '
            const fs = require("fs"), path = require("path");
            const base = "data/review-texts";
            const shows = process.argv[1] ? process.argv[1].split(",") : [];
            let n = 0;
            const dirs = shows.length > 0 ? shows : fs.readdirSync(base).filter(d => {
              try { return fs.statSync(path.join(base, d)).isDirectory(); } catch { return false; }
            });
            dirs.forEach(d => {
              const showDir = path.join(base, d);
              if (!fs.existsSync(showDir)) return;
              fs.readdirSync(showDir).filter(f => f.endsWith(".json") && f !== "failed-fetches.json").forEach(f => {
                try {
                  const r = JSON.parse(fs.readFileSync(path.join(showDir, f), "utf8"));
                  if (r.wrongProduction || r.wrongShow || r.wrongAttribution) return;
                  if (r.duplicateOf || r.rejectionReason || r.isRoundupArticle) return;
                  if (r.contentTier === "invalid") return;
                  const hasText = r.fullText && r.fullText.length > 100;
                  const hasExcerpt = r.bwwExcerpt || r.dtliExcerpt || r.showScoreExcerpt || r.pvExcerpt || r.nycExcerpt || (r.excerpt && r.excerpt.length > 50);
                  if (!hasText && !hasExcerpt) return;
                  const needsScore = !r.assignedScore && !r.llmScore && !r.humanReviewScore;
                  if (needsScore) n++;
                } catch {}
              });
            });
            console.log(n);
          ' "$SHOWS")

          echo "Unscored reviews for gathered shows: $UNSCORED"

          if [ "$UNSCORED" -lt 1 ]; then
            echo "No unscored reviews. Skipping scoring trigger."
            exit 0
          fi

          RUNNING=$(gh run list --workflow=llm-ensemble-score.yml --status=in_progress --json databaseId --jq 'length' 2>/dev/null || echo "0")
          QUEUED=$(gh run list --workflow=llm-ensemble-score.yml --status=queued --json databaseId --jq 'length' 2>/dev/null || echo "0")
          WAITING=$(gh run list --workflow=llm-ensemble-score.yml --status=waiting --json databaseId --jq 'length' 2>/dev/null || echo "0")
          ACTIVE=$((RUNNING + QUEUED + WAITING))
          if [ "$ACTIVE" -gt 0 ]; then
            echo "LLM scoring already active ($RUNNING running, $QUEUED queued). Skipping."
            exit 0
          fi

          LIMIT=$UNSCORED
          if [ "$LIMIT" -gt 400 ]; then LIMIT=400; fi

          echo "Triggering LLM scoring for $UNSCORED reviews (limit=$LIMIT)..."
          gh workflow run llm-ensemble-score.yml \
            -f limit=$LIMIT \
            -f run_calibration=false

          echo "LLM scoring auto-triggered successfully."

  # Step 4: Update related issues
  update-issues:
    needs: [gather-reviews]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Update issue (if exists)
        uses: actions/github-script@v7
        with:
          script: |
            // Find and comment on the related new-show issue
            const shows = '${{ inputs.shows }}'.split(',');

            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'new-show,needs-review-data',
              state: 'open',
            });

            for (const issue of issues.data) {
              // Check if this issue mentions any of our shows
              const matchesShow = shows.some(slug =>
                issue.body?.includes(slug)
              );

              if (matchesShow) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body: `🤖 **Review Data Gathering Attempted**\n\nWorkflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nShows processed: ${shows.join(', ')}`
                });
              }
            }
