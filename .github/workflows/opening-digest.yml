name: Opening Digest (radar)

on:
  schedule:
    # 06:15 UTC daily. Card #497 (owner merge decision — exactly one scheduled
    # email/day, not three): this no longer emails on its own. It writes
    # data/audit/opening-digest-snapshot.json instead; autonomous-email.js
    # folds it into the loop's single scheduled morning email. Runs BEFORE the
    # loop starts (03:30 ET / 07:30 UTC) so the snapshot is same-day fresh —
    # same reasoning as data-health-check.yml's 06:45 UTC move (card #364).
    - cron: '15 6 * * *'
  workflow_dispatch: {}

concurrency:
  group: opening-digest
  cancel-in-progress: false

jobs:
  write-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Checkout core data (shows.json, reviews.json, audience-buzz.json)
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}

      - name: Write opening digest snapshot
        run: node scripts/send-opening-digest.js

      - name: Commit updated snapshot
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/audit/opening-digest-snapshot.json
          if git diff --staged --quiet; then
            echo "No snapshot changes"
          else
            git commit -m "data: Update opening digest snapshot [skip ci]"
            bash scripts/lib/push-with-retry.sh
          fi

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: 'Opening Digest Snapshot Failed'
          description: 'Opening digest script crashed — its snapshot may not have written, so tomorrow''s morning email won''t carry the opening-night radar.'
          severity: 'warning'
          discord_webhook: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
