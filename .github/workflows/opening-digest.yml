name: Opening Digest Email

on:
  schedule:
    - cron: '0 11 * * *'  # 11 UTC = 7am ET / 12pm BST — fires before daily-digest at 12 UTC
  workflow_dispatch:
    inputs:
      send_to:
        description: 'Override recipient (default: owner)'
        required: false
        default: ''

concurrency:
  group: opening-digest
  cancel-in-progress: false

jobs:
  send-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Checkout core data (shows.json, reviews.json, audience-buzz.json)
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}

      - name: Send opening digest
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.send_to }}" ]; then
            ARGS="--send-to=${{ github.event.inputs.send_to }}"
          fi
          node scripts/send-opening-digest.js $ARGS

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: 'Opening Digest Email Failed'
          severity: 'warning'
          discord_webhook: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
