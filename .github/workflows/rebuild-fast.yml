# Fast rebuild — checkout → rebuild reviews.json → push → deploy
# No backfill, no classification, no flagging. 5 minutes instead of 30.
# Use for opening-night corrections and manual data fixes.
name: Rebuild Reviews (Fast)

concurrency:
  # BRO-5913: coalesce a burst of scoring-triggered rebuilds into one running + one
  # pending run. GH keeps a queue depth of 1, so a 3rd dispatch replaces the pending
  # one. That is correct here: rebuild-fast rebuilds the WHOLE reviews.json from the
  # tree it checks out, so the surviving pending run (which checks out after the
  # others finished) covers everything the replaced run would have. The older
  # per-run group (github.run_id, task #922) turned one batch of N scoring runs
  # into N rebuilds and N deploys (860 night, 2026-10-22).
  # force_write runs are manual overrides that must not be silently replaced, so
  # they keep a per-run group.
  # concurrency-queue-ok: idempotent whole-tree rebuild, latest pending run wins
  group: rebuild-fast${{ inputs.force_write == 'true' && format('-force-{0}', github.run_id) || '' }}
  cancel-in-progress: false

on:
  schedule:
    # Safety-net cron: refresh static market pages between rebuilds.
    # Vercel's static export only re-renders /opera, /off-broadway, /broadway,
    # /west-end when a deploy fires. Reviews can land via review-texts pushes
    # whose downstream rebuild dispatch silently 403s on GitHub API rate limits
    # (Notion 362637c5-416f-81ce, 2026-05-16 incident). Pairs with the dispatch
    # retry in llm-ensemble-score.yml. ~5 min when no diff; the change-gated
    # commit/deploy steps short-circuit when reviews.json is byte-identical.
    - cron: '45 */4 * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for fast rebuild'
        required: false
        default: 'Fast rebuild — manual correction'
        type: string
      force_write:
        description: 'Override regression guard (true/false)'
        required: false
        default: 'false'
        type: string

permissions:
  contents: write
  actions: write
  issues: write  # awaiting-score sweep fallback when GH_DISPATCH_TOKEN is unset

jobs:
  rebuild-fast:
    name: Fast rebuild reviews.json
    runs-on: ubuntu-latest
    # 20->25 (card #1891, 2026-08-26): "Commit and push changes" below is
    # raised from push-with-retry.sh's shared 240s default to a 600s deadline
    # + MAX_RETRIES=20 (see that step's comment). Successful runs took
    # 6.6-7.3min and failed ones 11.4-11.6min under the OLD 240s budget, so
    # the new ~600s worst case plus this job's other steps lands well inside
    # 25min with real margin.
    # 25->45 (BRO-2783): the push step may now redo the fast rebuild on fresh
    # main after a lost race. Worst-case budget (REBUILD_FAST_MAX_CYCLES=2):
    #   steps before the push            ~600s (observed 6.6-7.3 min whole run)
    #   cycle 1 push (PUSH_DEADLINE_SEC)  600s
    #   1 redo: jitter <=20s + fetch <=30s + rebuild/mobile regen ~180s
    #           + redo push deadline 300s = 530s
    #   always() steps after the push (core-data push, deploy trigger,
    #   failure notify, summary)          ~300s
    #   total ~2030s = ~34 min, leaving ~11 min under 45 min.
    # tests/unit/rebuild-fast-push-retry.test.mjs re-checks this arithmetic.
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout core data
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}

      - name: Checkout review-texts (private repo)
        uses: ./.github/actions/checkout-review-texts
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}

      - name: Opening-night lease sync (BRO-4786)
        uses: ./.github/actions/opening-night-lease-sync
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }} # BRO-6672: lets a failed sync read LANE_ONLY_MARKETS

      # Stale-checkout race guard (same class as rebuild-reviews.yml — see
      # scripts/lib/rebuild-staleness-guard.js + scripts/check-rebuild-staleness.js
      # for the full rationale). This workflow has a shorter checkout-to-rebuild
      # window (4 utility steps vs rebuild-reviews.yml's ~12) but is a 4-hourly
      # safety-net cron, so the exposure accumulates over many more runs/day.
      - name: Record review-texts checkout SHA
        id: review_texts_checkout
        run: echo "sha=$(git -C data/review-texts rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup-node

      # Opening-night contamination guard (Notion 386637c5-416f-81b9): during
      # opening-night windows the rapid fast-rebuilds (and the post-scoring
      # rebuild-fast dispatched by llm-ensemble-score) skipped flag-wrong-production-by-date,
      # which only ran in the daily full rebuild. Freshly SERP-discovered prior-production
      # reviews (e.g. Glengarry WE 2026 counting Broadway-2025 Culkin/Odenkirk reviews from
      # EW/NYDaily/Yahoo) therefore stayed wrongProduction:false and inflated the live count
      # for days until a full rebuild — which is itself a cancellation magnet. The flagger is
      # pure-local (no API/secrets), respects priorRuns + manual-clear, and its flags are
      # persisted by the "Push review-texts" step below.
      - name: Flag wrong-production by date
        # --apply is REQUIRED: the script is DRY_RUN by default
        # (flag-wrong-production-by-date.js:43). Without it this step printed
        # "Run with --apply to write flags" and wrote nothing, so the
        # opening-night contamination guard above was a no-op from the day it
        # shipped (found by ship-check on task #653). Enforced by
        # lint-workflow-guards.sh.
        run: node scripts/flag-wrong-production-by-date.js --apply

      # Auto-heal sweeps — run on the 4-hourly fast cadence too, not just the
      # daily rebuild-reviews.yml. These integrity gates fire in test.yml on
      # EVERY push; when their --fix sweep only ran daily, a stale flag lived up
      # to a day and reddened main on every interim push (cadence mismatch).
      # Both are deterministic + bounded (duplicateOf has a >25 surge guard;
      # gc only rewrites URL-shaped critic names) so auto-running is safe.
      - name: Sweep stale duplicateOf flags
        shell: bash # -eo pipefail: a failing node script must not be masked by tee (BRO-5046)
        run: node scripts/audit-duplicate-of-url-mismatch.js --fix 2>&1 | tee -a /tmp/locked-skip.log
        continue-on-error: true

      - name: Sweep URL-shaped critic names
        run: node scripts/gc-url-critic-names.js --fix
        continue-on-error: true

      - name: Sweep display-field artifacts (html-entity + json-ld)
        run: node scripts/gc-display-field-artifacts.js --fix
        continue-on-error: true

      - name: Get current review count
        id: before
        run: |
          if [ -f data/reviews.json ]; then
            COUNT=$(node -e "console.log(require('./data/reviews.json').reviews.length)")
            echo "count=$COUNT" >> $GITHUB_OUTPUT
          else
            # No reviews.json to count: leave the count empty (unmeasured) so the
            # commit message does not report a false "+N reviews" from 0.
            echo "count=" >> $GITHUB_OUTPUT
          fi

      - name: Rebuild reviews.json
        id: rebuild
        env:
          REVIEW_TEXTS_TOKEN: ${{ secrets.REVIEW_TEXTS_TOKEN }}
          INPUT_FORCE_WRITE: ${{ inputs.force_write || 'false' }}
        run: |
          # BRO-6029: git_net caps each fetch/pull/push so a hung transfer fails that attempt instead of waiting for the job timeout.
          . "${GITHUB_WORKSPACE}/scripts/lib/git-net-timeout.sh" 2>/dev/null || git_net() { shift; git "$@"; }
          FORCE_FLAG=""
          if [ "${INPUT_FORCE_WRITE}" = "true" ]; then
            FORCE_FLAG="--force-write"
            echo "⚠️  Force-write enabled — regression guard overridden"
          fi

          # Stale-checkout race guard, part 2 (see rebuild-reviews.yml for the
          # full rationale/comment). Explicit destination refspec so the ref
          # update can't silently land only in FETCH_HEAD.
          CHECKOUT_SHA="${{ steps.review_texts_checkout.outputs.sha }}"
          git_net 180 -C data/review-texts fetch origin +main:refs/remotes/origin/main --depth=1 --quiet
          CURRENT_SHA=$(git -C data/review-texts rev-parse refs/remotes/origin/main)
          echo "" > /tmp/stale-checkout-shows.txt
          if node -e "
            const { shouldRetryForStaleCheckout } = require('./scripts/lib/rebuild-staleness-guard.js');
            process.exit(shouldRetryForStaleCheckout(process.argv[1], process.argv[2]) ? 0 : 1);
          " "$CHECKOUT_SHA" "$CURRENT_SHA"; then
            echo "⚠️  review-texts advanced during this job ($CHECKOUT_SHA -> $CURRENT_SHA) — syncing drifted files before rebuild"
            git -C data/review-texts diff --name-only "$CHECKOUT_SHA" "$CURRENT_SHA" \
              | cut -d/ -f1 | sort -u > /tmp/stale-checkout-shows.txt
            git -C data/review-texts diff -z --name-only --diff-filter=d "$CHECKOUT_SHA" "$CURRENT_SHA" \
              > /tmp/stale-checkout-files.txt
            if [ -s /tmp/stale-checkout-files.txt ]; then
              xargs -0 git -C data/review-texts checkout "$CURRENT_SHA" -- < /tmp/stale-checkout-files.txt
            fi
          fi

          # First attempt
          if node scripts/rebuild-all-reviews.js $FORCE_FLAG; then
            echo "Rebuild succeeded on first attempt"
            exit 0
          fi

          echo ""
          echo "⚠️  Rebuild failed (likely stale checkout) — re-cloning review-texts and retrying..."
          echo ""

          rm -rf data/review-texts
          # BRO-5972: git_net caps the re-clone (a normal one takes ~46s) so a
          # hung transfer fails the step instead of eating the job timeout.
          git_net 300 clone --depth 1 "https://x-access-token:${REVIEW_TEXTS_TOKEN}@github.com/thomaspryor/broadway-review-texts.git" data/review-texts

          node scripts/rebuild-all-reviews.js $FORCE_FLAG

      # BRO-3127: this step (and everything through "Verify all eligible
      # reviews scored" below) is gated on `always() && steps.rebuild.outcome
      # == 'success' && steps.staleness.outputs.safe_to_publish == 'true'` —
      # the anchor pattern BRO-2906 established for the identical bug class
      # (test.yml's lint-workflows job, id: deps +
      # tests/unit/workflow-audit-steps-always.test.mjs). Before this fix, a
      # bare (no `if:`) step here meant a guard failure below skipped EVERY
      # subsequent step in this job, including "Regenerate mobile artifacts"
      # — which writes public/data/shows/{id}.json, the file the live site
      # reads — so ONE unrelated show's genuine drift blocked publishing for
      # every other show in the run (run 34318929964, 2026-09-09).
      #
      # safe_to_publish (ship-check/Codex adversarial finding, BRO-3127): a
      # first version of this fix gated purely on steps.rebuild.outcome, which
      # unblocked downstream publish on ANY failure of the guard step below —
      # including an unexpected crash (can't read reviews.json, an unhandled
      # exception), not just its normal "show X is genuinely missing"
      # detection. Those are different risk classes: a scoped missing-show
      # detection is safe to publish around (the flagged show gets reverted
      # below); a crash means we don't know WHAT'S wrong, so the old
      # block-everything behavior is the safe default. The guard step sets
      # safe_to_publish=true only when it exits 0 OR exits 1 with a populated
      # missing-shows file (the scoped case) — never on an unexplained crash.
      - name: Verify no scoreable review vanished during checkout drift
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        id: staleness
        if: always() && steps.rebuild.outcome == 'success'
        run: |
          set +e
          node scripts/check-rebuild-staleness.js --shows-file=/tmp/stale-checkout-shows.txt
          GUARD_EXIT=$?
          set -e
          if [ "$GUARD_EXIT" -eq 0 ]; then
            echo "safe_to_publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          MISSING_FILE="${RUNNER_TEMP:-/tmp}/staleness-missing-shows.txt"
          if [ -s "$MISSING_FILE" ]; then
            echo "::error::check-rebuild-staleness.js flagged specific show(s) as missing (see log above) — downstream steps still publish every OTHER show; the flagged show's own public data reverts to last-known-good below."
            echo "safe_to_publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::check-rebuild-staleness.js failed WITHOUT a scoped missing-shows list — an unexplained crash, not a normal single-show detection. Blocking downstream publish entirely (pre-BRO-3127 behavior) since the actual scope of the problem is unknown."
            echo "safe_to_publish=false" >> "$GITHUB_OUTPUT"
          fi
          exit 1

      # NOTE: snapshot-overwrite step removed 2026-07-19. /tmp/core-data-snapshot/ is
      # the checkout-time baseline push-core-data diffs against (2beb6617c58);
      # overwriting it with rebuilt files made them read as "untouched" and
      # silently skipped from the private-repo push.

      - name: Update critic registry
        if: always() && steps.rebuild.outcome == 'success' && steps.staleness.outputs.safe_to_publish == 'true'
        run: node scripts/audit-critic-outlets.js
        continue-on-error: true

      # BRO-4960: a Critics' Take must not outlive its reviews. The full prune
      # lives in generate-critic-consensus.js (weekly cron); this runs only its
      # no-LLM, no-API-key --prune-only path so a wrongShow/removal clears the
      # blurb on the next fast rebuild. Keeps the MAX_STALE_PRUNE cap.
      - name: Prune stale Critics' Take (no LLM)
        if: always() && steps.rebuild.outcome == 'success' && steps.staleness.outputs.safe_to_publish == 'true'
        # A scoped staleness failure still sets safe_to_publish, but reviews.json is
        # then incomplete for the flagged show: skip so its take is not pruned.
        run: |
          if [ -s "${RUNNER_TEMP:-/tmp}/staleness-missing-shows.txt" ]; then
            echo "staleness guard flagged shows; skipping prune"
            exit 0
          fi
          node scripts/generate-critic-consensus.js --prune-only
        continue-on-error: true

      # Regenerate BOTH mobile artifacts in lockstep via the shared wrapper. The
      # mobile INDEX (public/data/mobile-shows.json) is a committed, git-tracked
      # artifact the iOS app fetches; on SKIP_HEAVY_PREBUILD (code-only) deploys the
      # committed copy is served verbatim. It was only ever regenerated by prebuild
      # full-builds / hand commits, so it drifted from reviews.json whenever a rebuild
      # dropped a closed show's last scored review — accumulating closed-no-score
      # entries until validate-mobile-shows.js (tolerance 5) reddened main. The
      # wrapper guarantees detail+index never regenerate apart again; this step
      # stages both in the has_changes commit below.
      # See cloud-memory/feedback_mobile_index_committed_artifact.md.
      - name: Regenerate mobile artifacts (detail + index)
        if: always() && steps.rebuild.outcome == 'success' && steps.staleness.outputs.safe_to_publish == 'true'
        run: bash scripts/generate-mobile-artifacts.sh
        continue-on-error: true

      # BRO-6647: iOS quiz onboarding city list + per-city hit lists, derived from the
      # mobile index regenerated just above. Advisory (BRO-2123 / CLAUDE.md s19): a failing
      # generator or check never fails the rebuild, and a failing check reverts the files
      # so bad data is never staged. Staged in the commit step below.
      - name: Regenerate onboarding data (cities + hits)
        if: always() && steps.rebuild.outcome == 'success' && steps.staleness.outputs.safe_to_publish == 'true'
        run: |
          if ! { npx tsx scripts/generate-onboarding-data.ts && node scripts/test-onboarding-data.js; }; then
            echo "::warning::onboarding data generation/check failed; keeping the last committed files (BRO-6647)"
            git checkout -- public/data/onboarding-cities.json public/data/onboarding-hits.json 2>/dev/null || true
          fi
        continue-on-error: true

      # BRO-3127: generate-mobile-show-details.js above does a full regenerate
      # of EVERY show from the current (possibly incomplete) reviews.json —
      # it has no concept of "this specific show is known-bad." Now that the
      # steps in this window run even when the staleness guard fired, the
      # GUARD-FLAGGED show's own public/data/shows/{id}.json would otherwise
      # get rebuilt from the exact incomplete state the guard exists to catch
      # — regressing already-published data for that one show, not just
      # leaving it stale. check-rebuild-staleness.js writes the flagged show
      # ids to $RUNNER_TEMP/staleness-missing-shows.txt whenever missing.length
      # > 0; revert JUST those per-show files to last-committed HEAD so the
      # flagged show keeps its last-known-good public data (still "folded" —
      # not published wrong) while every other show's regenerated data below
      # stages normally. Aggregate files (mobile-shows.json, stats-canon.json,
      # stats-reviews.json) are intentionally NOT reverted here — they cover
      # the whole corpus, and reverting them would also discard legitimate
      # updates for every OTHER show in this run.
      - name: Revert public data for shows flagged by staleness guard
        if: always() && steps.rebuild.outcome == 'success' && steps.staleness.outputs.safe_to_publish == 'true'
        # Logic lives in scripts/lib/revert-staleness-flagged-shows.sh (BRO-2783)
        # so the post-lost-race redo in scripts/rebuild-fast-redo.sh reuses it.
        run: bash scripts/lib/revert-staleness-flagged-shows.sh

      # Coverage Verdict S3 (task #905): stamps the first time each show's
      # score goes public (public/data/shows/{id}.json's `cs` field, just
      # regenerated above) into data/audit/score-public-since.json — the
      # score-regression floor's clock. Append-only, fails open, cheap
      # (local file read, no network) — safe on every rebuild.
      - name: Score-public-since stamp
        if: always() && steps.rebuild.outcome == 'success' && steps.staleness.outputs.safe_to_publish == 'true'
        run: node scripts/audit-score-public-since.js
        continue-on-error: true

      - name: Get new review count
        id: after
        if: always() && steps.rebuild.outcome == 'success' && steps.staleness.outputs.safe_to_publish == 'true'
        run: |
          COUNT=$(node -e "console.log(require('./data/reviews.json').reviews.length)")
          echo "count=$COUNT" >> $GITHUB_OUTPUT

      - name: Opening-night drop + completeness check
        if: always() && steps.rebuild.outcome == 'success' && steps.staleness.outputs.safe_to_publish == 'true'
        # Runs the per-critic snapshot diff AND the per-show rebuild-regression
        # alert path for shows in the ±7d opening-night window. Replaces
        # analyze-rebuild-drops.js (full-rebuild only) for the fast path.
        # See scripts/check-opening-night-completeness.js + memory/feedback_admin_ingest_opening_night_2026-04-26.md (#A19/#A20).
        env:
          # discord-notify.js reads RESEND_API_KEY+OWNER_EMAIL for email delivery;
          # DISCORD_WEBHOOK_ALERTS was never read (Discord removed) — alerts were log-only.
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/check-opening-night-completeness.js
        continue-on-error: true

      - name: Verify all eligible reviews scored (orphan-unscored guard)
        if: always() && steps.rebuild.outcome == 'success' && steps.staleness.outputs.safe_to_publish == 'true'
        # Lost Boys 2026-04-26 #8 defense: walks data/review-texts/ for every
        # show in the ±7d opening-night window and asserts every includable
        # review with substantial text/excerpt has assignedScore. Writes
        # data/audit/orphan-unscored-{showId}.json marker files that
        # opening-night-broadcast.yml reads as an early-exit gate. Dispatches
        # llm-ensemble-score.yml (per-show) so the next rebuild has scores.
        # Discord warning, 60-min cooldown per show. continue-on-error so a
        # failure here never blocks the rebuild itself.
        env:
          # discord-notify.js reads RESEND_API_KEY+OWNER_EMAIL for email delivery;
          # DISCORD_WEBHOOK_ALERTS was never read (Discord removed) — alerts were log-only.
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVIEW_TEXTS_TOKEN: ${{ secrets.REVIEW_TEXTS_TOKEN }}
        run: node scripts/verify-all-scored.js
        continue-on-error: true

      # BRO-4141: close reader submissions labelled awaiting-score once their
      # review is in the freshly rebuilt reviews.json; relabel ones stuck past
      # 36h as needs-manual-review (surfaced in the morning digest, no email).
      # GH_DISPATCH_TOKEN = the owner PAT that opened the issues, so the owner
      # isn't emailed about the closes. Writes no repo files.
      - name: Sweep awaiting-score review submissions
        if: always() && steps.rebuild.outcome == 'success' && steps.staleness.outputs.safe_to_publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN || secrets.GITHUB_TOKEN }}
        run: node scripts/sweep-awaiting-score-submissions.js
        continue-on-error: true

      - name: Check for changes
        if: always()
        id: changes
        run: |
          PUBLIC_CHANGED=false
          # BRO-5033: no reviews.json term here on purpose. reviews.json is
          # gitignored core data, so `git diff` on it was always empty, and a
          # snapshot compare would always say "changed": rebuild-all-reviews.js
          # stamps _meta.lastUpdated on every run. public/data/shows/ (tracked,
          # generated from reviews.json) is the real content signal.
          if ! git diff --quiet public/data/shows/ 2>/dev/null; then
            PUBLIC_CHANGED=true
            echo "Changes detected in public show JSONs"
            git diff --stat public/data/shows/ | tail -5
          fi
          # BRO-3598: the daily exclusion totals feed the digest trend; persist
          # them even on a no-diff rebuild (the file only changes when a count does).
          EXCLUSION_TOTALS_CHANGED=false
          if [ -n "$(git status --porcelain data/audit/exclusion-daily-totals.json 2>/dev/null)" ]; then
            EXCLUSION_TOTALS_CHANGED=true
            echo "Changes detected in data/audit/exclusion-daily-totals.json"
          fi
          echo "exclusion_state_changed=$EXCLUSION_TOTALS_CHANGED" >> $GITHUB_OUTPUT
          if [ "$PUBLIC_CHANGED" = "true" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No changes to reviews.json or public show JSONs"
          fi

      - name: Push review-texts to private repo
        if: always()
        uses: ./.github/actions/push-review-texts
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
          message: "data: Rebuild Reviews (Fast) — push changes"

      # PUSH_DEADLINE_SEC='600' + MAX_RETRIES=20 (card #1891, 2026-08-26):
      # this step lost 4 consecutive push races overnight under CI contention
      # (runs 32930921311, 32931727848, 32932598421 — "overall deadline 240s
      # exceeded" after exhausting the shared default MAX_RETRIES=7). Sizing
      # follows task #1842's data-health-check.yml precedent, not a bare
      # deadline raise: push-with-retry.sh's backoff (WAIT=3+i*2+jitter, sums
      # to N^2+4N over N attempts) means MAX_RETRIES, not PUSH_DEADLINE_SEC,
      # is usually the binding constraint — #1842 proved a deadline-only
      # raise left 4 real fetch->rebase->retry cycles (~720s) still hitting
      # "All push attempts failed after 7 attempts" nowhere near the deadline.
      # 20 attempts sums to ~480s of backoff, landing under this step's 600s
      # budget with ~120s margin (job timeout-minutes raised 20->25 above to
      # cover it).
      #
      # PUSH_RECONCILE_MERGED_JSON='1': a separate, real correctness fix
      # riding along — zero effect on the deadline incident above. `git
      # rebase -X theirs` can resolve a conflicting hunk in favour of our
      # replayed commits WITHOUT reporting a conflict, silently dropping a
      # concurrent writer's edit to a MANAGED union-merge file this step
      # stages via `git add -u data/audit/` — e.g.
      # data/audit/scraper-spend-ledger.jsonl (merge-scraper-spend-ledger.js
      # is a registered MANAGED merger in core-data-merge-registry.js, and
      # that ledger has many concurrent writers). This is a real safety net
      # that can actually engage here, not a no-op — fails open like the
      # rest of push-with-retry.sh's reconciliation.
      - name: Commit and push changes
        if: always() && (steps.changes.outputs.has_changes == 'true' || steps.changes.outputs.exclusion_state_changed == 'true')
        env:
          PUSH_DEADLINE_SEC: '600'
          PUSH_RECONCILE_MERGED_JSON: '1'
          # BRO-334: 11 failures/24h traced via the durable push-retry-failures
          # ledger (origin/push-retry-failures) to the SAME signature on every
          # occurrence — "Pre/Post-resolution push FAILED in 90s" (exactly the
          # push-with-retry.sh default GIT_NET_TIMEOUT_SEC), zero bytes of git's
          # own --progress output (Enumerating/Writing objects never printed),
          # and rc=124 (clean SIGTERM, not a stuck process). That combination
          # means the hang is in TCP/TLS connection setup, before any transfer
          # starts — http.lowSpeedLimit/Time (also configured in push-with-
          # retry.sh) cannot catch a pre-transfer stall, only a stalled
          # transfer. Every observed failure exhausted PUSH_DEADLINE_SEC after
          # only ~4 attempts (90s pre + 90s post per cycle), nowhere near the
          # MAX_RETRIES=20 budget below — so the 90s-per-attempt default is the
          # actual constraint here, not attempt count. Fetch+rebase/merge in
          # every one of these failures completed in 0-1s once it ran, and this
          # step's own diffs are small (tens of files) with no evidence any
          # attempt ever got far enough to need more than a few seconds once
          # connected. Lowering the per-attempt cap to 30s roughly triples the
          # realized attempts inside the same 600s deadline without changing
          # behavior for a healthy connection. This is a per-caller override
          # (push-with-retry.sh already reads GIT_NET_TIMEOUT_SEC from env) —
          # it does not touch the shared 90s default other callers rely on.
          GIT_NET_TIMEOUT_SEC: '30'
          REVIEWS_BEFORE: ${{ steps.before.outputs.count }}
          REVIEWS_AFTER: ${{ steps.after.outputs.count }}
          REBUILD_REASON: ${{ inputs.reason || 'Scheduled safety-net refresh' }}
          REBUILD_FORCE_WRITE: ${{ inputs.force_write || 'false' }}
          # The redo regenerates public data, so it refuses unless the
          # staleness guard said this run was safe to publish.
          REBUILD_FAST_SAFE_TO_PUBLISH: ${{ steps.staleness.outputs.safe_to_publish }}
          # BRO-2783 (board option b): when push-with-retry.sh loses all 20
          # rebase races to a hot main it exits 1, which stranded a fully
          # scored rebuild on opening night 2026-09-04 (the Git Data API
          # fallback skips union-merge-managed files by design, and
          # API_FALLBACK_SAFE must NOT be widened). rebuild-fast-push-cycle.sh
          # instead resets to fresh origin/main, redoes the fast rebuild
          # (scripts/rebuild-fast-redo.sh) and pushes again: 2 cycles total
          # (one redo), jittered, hard-capped at 5 in rebuild-fast-push-cycle.js.
          # The redo replays this run's data/audit writes 3-way and publishes
          # only the paths the lost commit changed. Redo cycles push with a
          # 300s deadline (a fresh-HEAD push lands fast); see the job's
          # timeout-minutes comment for the worst-case budget (~34 of 45 min).
          REBUILD_FAST_MAX_CYCLES: '2'
          REBUILD_FAST_REDO_PUSH_DEADLINE_SEC: '300'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # Staged inline as well as in scripts/rebuild-fast-stage-commit.sh
          # (which the post-lost-race redo uses): the workflow lints
          # (alert-ledger-commit-check, ledger coverage) read staging from
          # this file. tests/unit/rebuild-fast-push-retry.test.mjs fails if
          # the two path lists drift apart.
          git add data/audit/*.json 2>/dev/null || true
          # Stage deletions of orphan-unscored marker files. verify-all-scored.js
          # deletes them when scores have filled in; without -u those deletions
          # never make it back to main and the broadcast gate stays permanently
          # blocked even after the LLM ensemble resolves the orphan(s).
          git add -u data/audit/ 2>/dev/null || true
          bash scripts/lib/git-add-existing.sh public/opening-night-status.json public/status.html
          git add public/data/shows/ 2>/dev/null || true
          # Mobile index — keep it committed in lockstep with the detail JSONs above
          # (regenerated from this run's reviews.json). Staged only inside this
          # has_changes==true commit, so no-op rebuilds don't churn it on the _ts
          # timestamp alone. See the "Regenerate mobile index" step above.
          git add public/data/mobile-shows.json 2>/dev/null || true
          # Show Stats artifacts — regenerated by the same wrapper; without this
          # stage they'd silently go stale relative to the detail files above.
          git add public/data/stats-canon.json public/data/stats-reviews.json 2>/dev/null || true
          # iOS quiz onboarding data (BRO-6647), regenerated after the mobile index.
          git add public/data/onboarding-cities.json public/data/onboarding-hits.json 2>/dev/null || true
          # Lock audit-trail snapshot (Lost Boys 2026-04-27 Gap #6).
          # Without this stage step, /admin/locks SSR ships an empty page —
          # locks.json regenerates locally each rebuild but never lands in
          # the public repo's tree on Vercel.
          git add public/data/admin/locks.json 2>/dev/null || true
          # Critic-coverage admin digest (S4 — drives /admin/critic-coverage page).
          git add public/data/admin/critic-coverage.json 2>/dev/null || true

          # Commit message + commit: scripts/rebuild-fast-stage-commit.sh
          # (re-stages the same paths, a no-op here). Exit 3 = nothing staged;
          # has_changes said otherwise, so a no-op is benign and the push is
          # skipped.
          bash scripts/lib/check-file-sizes.sh --advisory  # BRO-5335: post-stage large-file check (advisory until armed)
          set +e
          bash scripts/rebuild-fast-stage-commit.sh
          COMMIT_RC=$?
          set -e
          if [ "$COMMIT_RC" -eq 3 ]; then
            echo "Nothing staged after all; skipping push."
            exit 0
          elif [ "$COMMIT_RC" -ne 0 ]; then
            exit "$COMMIT_RC"
          fi

          # hygiene-stage-no-commit-ok: the commit is made by scripts/rebuild-fast-stage-commit.sh (COMMIT_RC above) before this push
          PUSH_CMD="bash scripts/lib/push-with-retry.sh 20 main" \
          REBUILD_FAST_REDO_CMD="bash scripts/rebuild-fast-redo.sh" \
            bash scripts/lib/rebuild-fast-push-cycle.sh

      - name: Push core data to private repo
        id: push-core-data
        if: always()
        uses: ./.github/actions/push-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
          message: 'data: Update from rebuild-fast'

      # A #21 (2026-04-26): Dispatch deploy directly after push-core-data so
      # post-push step failures don't strand fresh data. Workflow_run listener
      # gates on success-conclusion, which means a failed downstream step
      # silently suppresses the deploy. See rebuild-reviews.yml for the same
      # pattern; full rationale in memory/feedback_admin_ingest_opening_night_2026-04-26.md.
      - name: Trigger deploy (core data changed)
        if: always() && steps.push-core-data.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OUR_RUN_START=$(gh run view ${{ github.run_id }} --json createdAt -q '.createdAt' 2>/dev/null || echo "")
          RECENT=$(gh run list --workflow=vercel-deploy.yml --limit=1 --json createdAt -q '.[0].createdAt' 2>/dev/null || echo "")
          if [ -n "$RECENT" ] && [ -n "$OUR_RUN_START" ]; then
            RECENT_TS=$(date -d "$RECENT" +%s 2>/dev/null || date -j -f "%Y-%m-%dT%H:%M:%SZ" "$RECENT" +%s 2>/dev/null || echo "0")
            OUR_TS=$(date -d "$OUR_RUN_START" +%s 2>/dev/null || date -j -f "%Y-%m-%dT%H:%M:%SZ" "$OUR_RUN_START" +%s 2>/dev/null || echo "0")
            NOW_TS=$(date +%s)
            DIFF=$((NOW_TS - RECENT_TS))
            if [ "$RECENT_TS" -gt "$OUR_TS" ] && [ "$DIFF" -lt 900 ]; then
              echo "Skipping deploy — already triggered after this run started (${DIFF}s ago)"
              exit 0
            fi
          fi
          echo "Triggering deploy..."
          gh workflow run vercel-deploy.yml || echo "Deploy dispatch failed — workflow_run will catch successful conclusions"

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: 'Fast Rebuild Failed'
          description: 'Fast rebuild failed. Check run logs. To re-run: gh workflow run "Rebuild Reviews (Fast)" -f reason="Retry"'
          discord_webhook: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}

      - name: Summary
        if: always()
        env:
          INPUT_REASON: ${{ inputs.reason }}
        run: |
          echo "## Fast Rebuild Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Before:** ${{ steps.before.outputs.count }} reviews" >> $GITHUB_STEP_SUMMARY
          echo "**After:** ${{ steps.after.outputs.count }} reviews" >> $GITHUB_STEP_SUMMARY
          echo "**Changes:** ${{ steps.changes.outputs.has_changes }}" >> $GITHUB_STEP_SUMMARY
          echo "**Reason:** ${INPUT_REASON}" >> $GITHUB_STEP_SUMMARY
