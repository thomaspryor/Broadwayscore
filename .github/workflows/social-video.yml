name: Social Video
run-name: Social Video

# BRO-7414: automatic TikTok + YouTube Shorts. A "how did it do" video (one show's Critic Score) goes out for a qualifying
# show, at most one per network per New York day, through Buffer (scripts/social-autopost/video-run.js). The voice is
# OpenAI text-to-speech, the picture is the Playwright + ffmpeg render in scripts/video-proto, captions are
# channel-captions.js unchanged. Every run first reads earlier posts back from Buffer and records sent or failed.
# Kill switch: repository variable SOCIAL_VIDEO_DISABLED=true; cancel_queued deletes videos not yet sent.
# Without BUFFER_API_KEY a live run fails closed. The first live runs use live_limit=1.

on:
  schedule:
    - cron: '41 */3 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'List what is due and what would have posted over the last 3 weeks; render and post nothing'
        required: false
        type: boolean
        default: false
      live_limit:
        description: 'Most videos to make in this run (cadence still caps one per network per day)'
        required: false
        type: string
        default: '1'
      self_test:
        description: 'Make the due video, save a Buffer draft on each channel, delete the drafts'
        required: false
        type: boolean
        default: false
      cancel_queued:
        description: 'Delete every video this lane has scheduled that has not gone out yet'
        required: false
        type: boolean
        default: false

# One writer for data/social-video-ledger.json; a render takes minutes and the cron is every 3 hours.
concurrency:
  group: social-video
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SOCIAL_VIDEO_DISABLED: ${{ vars.SOCIAL_VIDEO_DISABLED }}
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout core data
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Read earlier videos back from Buffer
        # Records sent / failed and the post link on each ledger entry. Cheap; runs before anything is rendered.
        if: inputs.dry_run != true && inputs.self_test != true && inputs.cancel_queued != true && vars.SOCIAL_VIDEO_DISABLED != 'true'
        run: |
          [ -n "$BUFFER_API_KEY" ] || { echo "::error::BUFFER_API_KEY is not set; the video lane cannot verify or post"; exit 1; }
          node scripts/social-autopost/video-run.js --verify

      - name: Find due work
        id: check
        env:
          INPUT_CANCEL: ${{ inputs.cancel_queued }}
          INPUT_DRY: ${{ inputs.dry_run }}
          INPUT_SELF_TEST: ${{ inputs.self_test }}
        run: |
          if [ "$INPUT_CANCEL" = "true" ] || [ "$INPUT_SELF_TEST" = "true" ]; then printf 'due=1\n' >> "$GITHUB_OUTPUT"
          elif [ "$INPUT_DRY" = "true" ]; then printf 'due=0\n' >> "$GITHUB_OUTPUT"; node scripts/social-autopost/video-run.js; node scripts/social-autopost/video-run.js --report-days=21
          else node scripts/social-autopost/video-run.js --check; fi

      - name: Setup Playwright
        if: steps.check.outputs.due == '1' && inputs.cancel_queued != true
        uses: ./.github/actions/setup-playwright

      - name: Make and post the video
        if: steps.check.outputs.due == '1'
        env:
          INPUT_CANCEL: ${{ inputs.cancel_queued }}
          INPUT_SELF_TEST: ${{ inputs.self_test }}
          INPUT_LIMIT: ${{ inputs.live_limit }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          [ -n "$BUFFER_API_KEY" ] || { echo "::error::BUFFER_API_KEY is not set; refusing to run"; exit 1; }
          ffmpeg -version | head -1
          LIMIT="${INPUT_LIMIT:-1}"; [[ "$LIMIT" =~ ^[1-3]$ ]] || { echo "::error::live_limit must be 1, 2 or 3"; exit 1; }
          if [ "$INPUT_CANCEL" = "true" ]; then node scripts/social-autopost/video-run.js --cancel-queued
          elif [ "$INPUT_SELF_TEST" = "true" ]; then node scripts/social-autopost/video-run.js --self-test --out=/tmp/social-video
          else node scripts/social-autopost/video-run.js --live "--live-limit=$LIMIT" --out=/tmp/social-video; fi

      - name: Commit ledger
        # always(): the driver writes each post to the ledger as soon as Buffer accepts it, so a later failure in the same
        # run must still land the record (the next run would otherwise render the same show again).
        if: always() && inputs.dry_run != true && inputs.self_test != true
        env:
          PUSH_RECONCILE_MERGED_JSON: '1' # union-merges the LLM spend ledger on rebase (BRO-5043)
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/audit/gemini-usage-ledger.jsonl 2>/dev/null || true # LLM spend meter rows (BRO-5043)
          for f in data/social-video-ledger.json data/social-video-phrases.json; do [ -f "$f" ] && git add "$f" || true; done
          if git diff --cached --quiet; then
            echo "No changes to the social video ledger"
          else
            git commit -m "data: social video ledger [automated]"
            bash scripts/lib/push-with-retry.sh
          fi

      - name: Upload the video
        if: always() && steps.check.outputs.due == '1'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: social-video
          path: /tmp/social-video/*/*.mp4
          if-no-files-found: ignore
          retention-days: 7

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: 'Social Video Failed'
          severity: 'warning'
