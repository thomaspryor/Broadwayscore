name: Opening Night Completeness Check

# Per-critic + per-show drop detector for shows in the opening-night window.
# Runs every 15 min between rebuilds. Snapshots reviews.json critic identities
# per show and alerts on any disappearance, score-source loss, or count
# regression. Fast — no aggregator fetches; pure diff against last snapshot.
# (See scripts/check-opening-night-completeness.js for full design.)

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      show_id:
        description: 'Specific show ID to check (omit for all in-window shows)'
        required: false
        default: ''
      window_days:
        description: 'Days ± around openingDate to include (default: 7)'
        required: false
        default: '7'
      force:
        description: 'Bypass per-show 60-min cooldown'
        required: false
        type: boolean
        default: false

concurrency:
  group: opening-night-completeness-check
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  check:
    runs-on: ubuntu-latest
    # 25, not 8 (BRO-345 what-else, 2026-09-08, tuned over 3 review rounds):
    # observed run 34174218685 was cancelled by this timeout BEFORE the
    # same-session apiFallbackSafe fix even landed, and a "successful" run
    # (22:44-22:52) took 7m47s (~467s) — already dangerously close to 8min.
    # The "Commit state file" step below bounds its OWN worst case
    # (PUSH_DEADLINE_SEC=120 local retries + a single PUSH_API_MAX_RETRIES=1
    # fallback attempt) — but per second-opinion review round 3, confirmed
    # directly against push-with-retry.sh/push-via-git-api.sh's actual
    # per-attempt network-call chains (not their own summary comments, which
    # undercount): one local iteration can chain pre-push+2x-fetch+post-push
    # (up to 4x GIT_NET_TIMEOUT_SEC=90s = 360s) before the 120s deadline
    # check ever re-fires, and the single fallback attempt can likewise chain
    # up to 360s (ls-remote + 2x-fetch + push). Confirmed worst case for the
    # push step alone: ~720s. 25min (1500s) gives that ~720s + the ~467s
    # baseline (~1187s) a real margin (~313s / ~21%) instead of the
    # false-precision "~21%" claimed by two earlier, less-verified passes at
    # 15min/18min. NOT fully closed: the earlier "Checkout core data" step's
    # own git fetch/clone calls have no GIT_NET_TIMEOUT_SEC-style cap at all
    # (confirmed by the same review round) — that is a separate, pre-existing,
    # unbounded risk in .github/actions/checkout-core-data/action.yml
    # (critical-tier per infra-review-scope.js, needs its own blocking
    # pre-review, out of scope for this workflow-level fix) tracked as a
    # follow-up rather than fixed here. This timeout reduces, not eliminates,
    # cancellation exposure. Matches this file's soft-fail design intent
    # either way (push-with-retry.sh's failure is `|| echo`'d — the NEXT
    # 15-min cron tick re-snapshots) instead of cutting the job off mid-push
    # into a silent `cancelled` conclusion that skips both `if: failure()`
    # (Notify on failure) and notify-failure's own cancelled-conclusion
    # exclusion.
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Checkout core data
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}

      - uses: ./.github/actions/setup-node

      - name: Skip if rebuild in progress (race avoidance)
        id: rebuild_check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUNNING=$(gh run list --workflow=rebuild-reviews.yml --status=in_progress --json databaseId --jq 'length' 2>/dev/null || echo "0")
          QUEUED=$(gh run list --workflow=rebuild-reviews.yml --status=queued --json databaseId --jq 'length' 2>/dev/null || echo "0")
          RUNNING_FAST=$(gh run list --workflow=rebuild-fast.yml --status=in_progress --json databaseId --jq 'length' 2>/dev/null || echo "0")
          QUEUED_FAST=$(gh run list --workflow=rebuild-fast.yml --status=queued --json databaseId --jq 'length' 2>/dev/null || echo "0")
          if [ "$RUNNING" -gt 0 ] || [ "$QUEUED" -gt 0 ] || [ "$RUNNING_FAST" -gt 0 ] || [ "$QUEUED_FAST" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Rebuild in progress/queued — skipping completeness check; rebuild's own post-step will run it with fresh data."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run completeness check
        if: steps.rebuild_check.outputs.skip != 'true'
        env:
          # RESEND_API_KEY + OWNER_EMAIL are what discord-notify.js actually reads for
          # email delivery. The old DISCORD_WEBHOOK_ALERTS secret was never read by the
          # lib (Discord support removed) — alerts were log-only for months (2026-07-09).
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          SHOW_ARG=""
          if [ -n "${{ inputs.show_id }}" ]; then
            SHOW_ARG="--show=${{ inputs.show_id }}"
          fi
          WINDOW=$(echo "${{ inputs.window_days || '7' }}" | grep -oE '^[0-9]+$' || echo "7")
          FORCE_ARG=""
          if [ "${{ inputs.force || 'false' }}" = "true" ]; then
            FORCE_ARG="--force"
          fi
          node scripts/check-opening-night-completeness.js \
            $SHOW_ARG --window-days="$WINDOW" $FORCE_ARG

      - name: Verify scored reviews are actually LIVE on prod
        if: steps.rebuild_check.outputs.skip != 'true'
        continue-on-error: true   # a verify hiccup must not fail the drop-detector job
        env:
          DISCORD_WEBHOOK_ALERTS: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
        run: |
          # Reconciles local SCORED count vs the live prod `rv` count per in-window
          # show. Staleness-gated (only alerts when a show stays behind past a normal
          # deploy cycle) so it can't false-alarm on deploy lag. Reads only the public
          # prod JSON — no Vercel token, no GitHub API.
          SHOW_ARG=""
          if [ -n "${{ inputs.show_id }}" ]; then SHOW_ARG="--show=${{ inputs.show_id }}"; fi
          WINDOW=$(echo "${{ inputs.window_days || '7' }}" | grep -oE '^[0-9]+$' || echo "7")
          node scripts/verify-opening-night-live.js $SHOW_ARG --window-days="$WINDOW" --alert

      # NOTE: snapshot-copy step removed 2026-07-19. /tmp/core-data-snapshot is
      # push-core-data's checkout-time baseline and nothing may write to it
      # (lint-workflow-guards.sh snapshot-overwrite check). These audit files
      # aren't in push-core-data's CORE_FILES list anyway — the copy was dead
      # code since the 2026-07-12 push-core-data change.

      - name: Commit state file
        if: steps.rebuild_check.outputs.skip != 'true'
        env:
          # 120s, not the 240s default (BRO-345 what-else, 2026-09-08):
          # this session registered both staged files apiFallbackSafe, making
          # the Git Data API fallback reachable here for the first time. This
          # step is soft-fail-tolerant BY DESIGN (see the `|| echo` below —
          # the next 15min cron tick just re-snapshots), so it should fail
          # fast rather than spend its full push budget chasing a recovery
          # that isn't worth more than the job's own timeout margin.
          PUSH_DEADLINE_SEC: '120'
          # 1, not push-with-retry.sh's own auto-scaled default (2 for a
          # tight remaining budget, 6 otherwise): second-opinion review
          # caught that push-with-retry.sh's OWN documented cost model for
          # push-via-git-api.sh is "up to ~3 * GIT_NET_TIMEOUT_SEC per
          # attempt" (ls-remote + fetch + push, each individually capped at
          # GIT_NET_TIMEOUT_SEC=90s — see push-with-retry.sh's comment above
          # its push-via-git-api.sh invocation), not the ~90-100s per attempt
          # this session observed live on process-feedback.yml's fallback.
          # That pessimistic worst case (270s/attempt) at the default 2
          # attempts is ~540s — enough to blow even the widened 18min job
          # timeout below once added to the ~7m47s baseline + 120s local
          # retries. Proportionate for a file that self-heals on the very
          # next cron tick regardless of whether this attempt lands: try the
          # fallback once, not twice.
          PUSH_API_MAX_RETRIES: '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/audit/opening-night-completeness-state.json 2>/dev/null || true
          git add data/audit/opening-night-live-state.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "chore: opening-night completeness state [skip ci]"
            # 5 retries (matches push-with-retry.sh default + opening-night-checklist.yml).
            # 3 retries was too few during high-contention windows: observed 24965589737
            # where all 3 attempts at 19:54/19:58/19:59 lost to concurrent rebuild + scoring
            # pushers, dropping the snapshot file entirely.
            # If push still fails after 5: emit warning and continue. Next cron tick (≤15 min)
            # will re-snapshot — drop detection is degraded for that window but not broken.
            bash scripts/lib/push-with-retry.sh 5 main || echo "::warning::State push failed after 5 attempts — snapshot lost; next cron will re-snapshot. Drop detection skipped for this 15-min window."
          fi

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: 'Opening Night Completeness Check Failed'
          severity: 'warning'
          discord_webhook: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
