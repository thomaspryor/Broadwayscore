name: Execute Approved Fix

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to execute the approved fix for'
        required: true
        type: string

concurrency:
  group: auto-fix-feedback-bug
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}



      - name: Checkout core data
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
      - name: Checkout review-texts (private repo)
        uses: ./.github/actions/checkout-review-texts
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Execute approved fix
        id: exec
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
        run: node scripts/execute-approved-fix.js


      - name: Push review-texts to private repo
        if: always()
        uses: ./.github/actions/push-review-texts
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
          message: "data: Execute Approved Fix — Commit and push changes"
      - name: Commit and push changes
        if: always() && (steps.exec.outputs.result == 'fixed' || steps.exec.outputs.result == 'no-changes' || steps.exec.outputs.result == 'validation-failed')
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          git add data/pending-fixes/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "fix(data): Execute approved fix for #${ISSUE_NUMBER}

          Co-Authored-By: github-actions[bot] <github-actions[bot]@users.noreply.github.com>"

            bash scripts/lib/push-with-retry.sh
          fi


      - name: Push core data to private repo
        if: always()
        uses: ./.github/actions/push-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
          message: 'data: Update from execute-approved-fix'
      - name: Update GitHub issue
        if: always()
        uses: actions/github-script@v9
        env:
          FIX_RESULT: ${{ steps.exec.outputs.result }}
          FIX_ISSUE_NUMBER: ${{ inputs.issue_number }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const result = process.env.FIX_RESULT || 'error';
            const rawIssue = process.env.FIX_ISSUE_NUMBER || '';
            const issueNumber = parseInt(rawIssue);
            const isSystematic = rawIssue.includes('-systematic');

            if (result === 'fixed') {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issueNumber,
                body: isSystematic
                  ? '## Systematic Fix Applied\n\nThe approved systematic remediation plan has been executed across the dataset. Changes will be live after the next deploy.\n\n---\n*Executed via one-click approval*'
                  : '## Fix Applied\n\nThe approved remediation plan has been executed. Changes will be live after the next deploy.\n\n---\n*Executed via one-click approval*'
              });
              await github.rest.issues.addLabels({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issueNumber, labels: [isSystematic ? 'systematic-fix-applied' : 'auto-fixed']
              });
              if (!isSystematic) {
                await github.rest.issues.update({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: issueNumber,
                  state: 'closed', state_reason: 'completed'
                });
              }
            } else if (result === 'already-applied') {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issueNumber,
                body: '## Already Applied\n\nThis fix was already executed. No duplicate action taken.'
              });
            } else if (result === 'validation-failed') {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issueNumber,
                body: '## Validation Failed\n\nThe approved fix was applied but failed data validation. Changes were rolled back. Needs manual review.'
              });
              await github.rest.issues.addLabels({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issueNumber, labels: ['needs-manual-review']
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issueNumber,
                body: `## Execution Error\n\nFix execution returned: \`${result}\`. A maintainer will review.`
              });
              await github.rest.issues.addLabels({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issueNumber, labels: ['needs-manual-review']
              });
            }
      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: 'Execute Approved Fix Failed'
          severity: 'warning'
          discord_webhook: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
