name: Nightly UX Walkthrough

# Signed-in UX walkthrough: mints a throwaway @bsc-test.dev user, seeds
# realistic diary/watchlist/list data, captures a screenshot matrix of the
# signed-in surfaces on demo.broadwayscorecard.com, and runs them past a
# 3-model vision review panel (GPT-4o, Gemini, Claude). Findings 2-of-3
# models agree on get filed as Notion cards automatically. See card #219 —
# this catches flow/consistency/affordance/hierarchy issues that narrow e2e
# assertions miss (they only check that a POST succeeded, not how it looks).
#
# A plain daily schedule, NOT chained off UGC Auth Round-trip's completion.
# It looks like a clean "runs after the daily round-trip" hook, but UGC Auth
# Round-trip ALSO fires on every 'Deploy Demo Site' success (vercel-demo.yml
# redeploys the demo site every 8h) — so a workflow_run trigger off it fires
# ~4x/day, not nightly, quadrupling synthetic-user churn and 3-model LLM cost
# (caught live during this session's own wrap-up, 2026-07-20: a second run
# queued 8 minutes after the first from an unrelated demo redeploy). A plain
# schedule is the only trigger here that's actually once-daily regardless of
# how often its upstream workflows fire.

on:
  schedule:
    - cron: '35 13 * * *'  # daily 13:35 UTC — 18 min after UGC Auth Round-trip's OWN daily cron (13:17)
  workflow_dispatch:

concurrency:
  group: ux-walkthrough
  cancel-in-progress: false

jobs:
  walkthrough:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - uses: ./.github/actions/setup-node

      - uses: ./.github/actions/setup-playwright
        with:
          browsers: chromium

      - name: Run walkthrough
        id: walkthrough
        continue-on-error: true
        run: node scripts/ux-walkthrough.mjs --out ux-walkthrough-run
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}

      - name: Upload screenshot + review artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux-walkthrough-${{ github.run_id }}
          path: ux-walkthrough-run/
          retention-days: 14
          if-no-files-found: ignore

      - name: Check for high-priority findings
        id: findings
        if: steps.walkthrough.outcome == 'success'
        run: |
          node -e "
            const fs = require('fs');
            const path = 'ux-walkthrough-run/review.json';
            if (!fs.existsSync(path)) { console.log('no review.json (skip-review or panel failure)'); process.exit(0); }
            const { deduped, filed } = JSON.parse(fs.readFileSync(path, 'utf8'));
            const filedSet = new Set(filed);
            const highPriority = (deduped || []).filter(f => filedSet.has(\`UX audit: \${f.summary}\`.slice(0, 120)) && f.severity === 'high');
            console.log(\`filed=\${(filed||[]).length} highPriority=\${highPriority.length}\`);
            const summary = highPriority.map(f => \`- [\${f.agreementCount}/3] \${f.summary}\`).join('\n');
            fs.appendFileSync(process.env.GITHUB_OUTPUT, \`has_high=\${highPriority.length > 0}\n\`);
            if (summary) {
              fs.appendFileSync(process.env.GITHUB_OUTPUT, 'summary<<EOF\n' + summary + '\nEOF\n');
            }
          "

      - name: Digest — high-priority findings only
        # Was a direct sendAlert(email:true) — an immediate [CRITICAL] email
        # every night a high-priority finding turned up, even though the
        # finding is ALREADY a filed Notion card by this point (see the
        # findings step above) and needs no owner action the automation
        # itself can't take. Card #475 (2026-07-26): downgraded to
        # disposition='digest' via owner-alert-router — it queues a line for
        # the next BSC Daily instead of paging. cooldownHours=20 (just under
        # the 24h schedule) so each night's fresh findings still queue, rather
        # than the router's 7-day default silencing days 2-7 of a real week.
        if: steps.findings.outputs.has_high == 'true'
        uses: actions/github-script@v7
        env:
          FINDINGS_SUMMARY: ${{ steps.findings.outputs.summary }}
        with:
          script: |
            const { routeAlert } = require('./scripts/lib/owner-alert-router.js');
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await routeAlert({
              conditionKey: 'ux-walkthrough:high-priority',
              title: 'UX walkthrough: high-priority finding(s) filed',
              description: process.env.FINDINGS_SUMMARY || '',
              severity: 'info',
              disposition: 'digest',
              url: runUrl,
              cooldownHours: 20,
            }).catch(e => console.error('Digest queue failed:', e.message));

      - name: Fail job if walkthrough errored
        if: steps.walkthrough.outcome == 'failure'
        run: |
          echo "::error::UX walkthrough failed — synthetic user cleanup still runs in the script's finally block. Check the run log for which phase (auth/seed/capture/panel) failed."
          exit 1

      # routeAlert() above writes data/audit/alert-ledger.json (and, for
      # disposition='digest', data/audit/alert-digest-queue.json) — this step
      # was missing entirely (ship-check finding, 2026-07-28, same class as
      # card #394): without it the cooldown/queue state never persisted past
      # job end, so the 20h cooldown on 'ux-walkthrough:high-priority' was
      # silently a no-op and every high-priority night re-queued a fresh
      # digest line instead of deduping.
      - name: Commit alert state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in data/audit/alert-ledger.json data/audit/alert-digest-queue.json; do
            [ -e "$f" ] && git add "$f" || echo "skip (absent): $f"
          done
          if git diff --cached --quiet; then
            echo "No alert state changes to commit"
          else
            git commit -m "audit: UX walkthrough alert state [skip ci]"
            bash scripts/lib/push-with-retry.sh 5 main
          fi

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: 'Nightly UX Walkthrough Failed'
          description: 'Signed-in screenshot matrix or review panel failed — check auth minting, seeding, or Playwright capture in the run log.'
          severity: 'error'
          email: 'true'
          resend_api_key: ${{ secrets.RESEND_API_KEY }}
          owner_email: ${{ secrets.OWNER_EMAIL }}
