name: Update Tony Awards Data

on:
  # No cron — Tony Awards are an annual event (noms ~April, ceremony ~June).
  # Trigger manually when nominations are announced or ceremony concludes.
  workflow_dispatch:
    inputs:
      year:
        description: 'Specific year to scrape (leave empty for all years)'
        required: false
        type: string

jobs:
  update-awards:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6


      - name: Checkout core data
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Scrape Tony Awards data
        run: |
          if [ -n "${{ inputs.year }}" ]; then
            echo "Scraping year ${{ inputs.year }} only..."
            node scripts/scrape-tony-awards.js --year=${{ inputs.year }}
          else
            echo "Scraping all years..."
            node scripts/scrape-tony-awards.js
          fi

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet data/awards.json; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No changes to awards data"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            BEFORE=$(git show HEAD:data/awards.json 2>/dev/null | node -e "const d=require('fs').readFileSync('/dev/stdin','utf8');console.log(Object.keys(JSON.parse(d).shows||{}).length)" 2>/dev/null || echo "0")
            AFTER=$(node -e "const d=require('./data/awards.json');console.log(Object.keys(d.shows||{}).length)")
            echo "before=$BEFORE" >> $GITHUB_OUTPUT
            echo "after=$AFTER" >> $GITHUB_OUTPUT
            echo "Awards data changed: $BEFORE → $AFTER shows"
          fi

      - name: Commit and push
        if: always() && steps.changes.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/awards.json

          YEAR_NOTE=""
          if [ -n "${{ inputs.year }}" ]; then
            YEAR_NOTE=" (year ${{ inputs.year }})"
          fi

          git commit -m "chore: Update Tony Awards data${YEAR_NOTE}

          Shows with awards: ${{ steps.changes.outputs.before }} → ${{ steps.changes.outputs.after }}"

          bash scripts/lib/push-with-retry.sh

      - name: Create IBDB scraper reminder issue
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          YEAR="${{ inputs.year }}"
          if [ -z "$YEAR" ]; then
            YEAR="$(date +%Y)"
          fi
          gh issue create \
            --title "Run Tony nominations IBDB scraper for ${YEAR}" \
            --body "$(cat <<'ISSUE_EOF'
          ## Tony Awards data updated

          The Wikipedia Tony Awards scraper has committed new data to \`awards.json\`.
          The IBDB person-level nominations scraper needs to run locally to pick up new shows.

          ### Steps

          1. Pull latest: \`git pull\`
          2. Run the scraper for missing shows only:
             \`\`\`
             node scripts/scrape-tony-nominees.js --missing
             \`\`\`
          3. Verify: \`node scripts/verify-tony-data.js\`
          4. Commit and push the updated \`data/tony-nominations.json\`

          **Why local?** IBDB is behind Cloudflare and requires a headed Playwright browser.
          The \`--missing\` flag only processes shows where \`awards.json\` expects nominations
          but \`tony-nominations.json\` has 0 person-level entries.
          ISSUE_EOF
          )" \
            --label "data"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: 'Update Tony Awards Failed'
          discord_webhook: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
          resend_api_key: ${{ secrets.RESEND_API_KEY }}
          owner_email: ${{ secrets.OWNER_EMAIL }}

      - name: Summary
        run: |
          echo "## Tony Awards Update" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.changes.outputs.has_changes }}" == "true" ]; then
            echo "✅ Awards data updated" >> $GITHUB_STEP_SUMMARY
            echo "- Before: ${{ steps.changes.outputs.before }} shows" >> $GITHUB_STEP_SUMMARY
            echo "- After: ${{ steps.changes.outputs.after }} shows" >> $GITHUB_STEP_SUMMARY
          else
            echo "ℹ️ No changes to awards data" >> $GITHUB_STEP_SUMMARY
          fi
