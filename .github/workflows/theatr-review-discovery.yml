name: Theatr Comment Scraper

on:
  workflow_dispatch:
    inputs:
      max_shows:
        description: 'Max shows to scrape (0 = all)'
        default: '5'
      mode:
        description: 'discover or scrape'
        default: 'scrape'

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Theatr comment scraper
        env:
          THEATR_REFRESH_TOKEN: ${{ secrets.THEATR_REFRESH_TOKEN }}
        run: |
          if [ "${{ inputs.mode }}" = "discover" ]; then
            node scripts/scrape-theatr-reviews.js --discover --verbose
          else
            MAX_FLAG=""
            if [ "${{ inputs.max_shows }}" != "0" ]; then
              MAX_FLAG="--max-shows=${{ inputs.max_shows }}"
            fi
            node scripts/scrape-theatr-reviews.js $MAX_FLAG --verbose
          fi

      - name: Update refresh token secret
        if: always()
        env:
          GH_TOKEN: ${{ secrets.REVIEW_TEXTS_TOKEN }}
        run: |
          TOKEN_FILE="data/theatr-refresh-token.tmp"
          if [ -f "$TOKEN_FILE" ]; then
            gh secret set THEATR_REFRESH_TOKEN < "$TOKEN_FILE"
            rm "$TOKEN_FILE"
            echo "Refresh token rotated"
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: theatr-comments
          path: |
            data/audience-reviews/theatr/
          if-no-files-found: warn
