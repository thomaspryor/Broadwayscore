name: Theatr Review Discovery

on:
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Theatr review discovery
        env:
          THEATR_REFRESH_TOKEN: ${{ secrets.THEATR_REFRESH_TOKEN }}
        run: node scripts/scrape-theatr-reviews.js --discover --verbose

      - name: Update refresh token secret
        if: always()
        env:
          GH_TOKEN: ${{ secrets.REVIEW_TEXTS_TOKEN }}
        run: |
          TOKEN_FILE="data/theatr-refresh-token.tmp"
          if [ -f "$TOKEN_FILE" ]; then
            gh secret set THEATR_REFRESH_TOKEN < "$TOKEN_FILE"
            rm "$TOKEN_FILE"
            echo "Refresh token rotated"
          fi

      - name: Upload discovery results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: theatr-discovery
          path: data/audience-reviews/theatr/_discovery.json
          if-no-files-found: warn
