# hygiene-push-ok: uses custom inline retry loop (git push || pull --rebase retry)
name: Audit Aggregator Review Gap

on:
  schedule:
    # Hourly during opening-night window. Each run takes <5 min (one SERP per
    # show + one fetch per aggregator article) and tagged shows are usually
    # under 15. Detect aggregator-listed URLs missing from our review-texts and
    # auto-dispatch gather-reviews for the affected shows so the next poller
    # cron finds them.
    - cron: '37 * * * *'
  workflow_dispatch:
    inputs:
      window_days:
        description: 'How many days post-opening to audit (default 21)'
        required: false
        default: '21'
      dispatch_gather:
        description: 'Auto-dispatch gather-reviews for shows with gaps (default false — gather already ran; prefer --ingest-missing)'
        required: false
        default: 'false'
      ingest_missing:
        description: 'Directly ingest aggregator-listed URLs whose outlets are in the registry (default true)'
        required: false
        default: 'true'
      fail_on_gap:
        description: 'Exit non-zero when any in-window show has gaps (default false — advisory)'
        required: false
        default: 'false'
      include_closed:
        description: 'Also audit closed shows — back-catalogue backfill (default true)'
        required: false
        default: 'true'

concurrency:
  group: audit-aggregator-gap
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  audit:
    runs-on: ubuntu-latest
    # 40 (was 25): the audit honors a 25-min soft time budget, then the commit +
    # review-texts push (5-retry, racing concurrent CI) needs headroom. At 25 the
    # job was hard-cancelled MID-COMMIT so the checkpoint + ingests never landed
    # and the backfill stalled (2026-06-07). 40 leaves ~12 min for the commit.
    timeout-minutes: 40
    if: ${{ vars.AGGREGATOR_GAP_AUDIT_DISABLED != 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      # The audit's scraper fallback chain (Bright Data → ScrapingBee →
      # Playwright) reaches Playwright for complex sites (e.g. BroadwayWorld).
      # Without browsers installed, Playwright throws "Executable doesn't exist"
      # and the article fetch fails. Shared cached action per .github/workflows/CLAUDE.md.
      - name: Setup Playwright
        uses: ./.github/actions/setup-playwright

      - name: Checkout core data
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}

      # --ingest-missing writes new review-text files into data/review-texts/.
      # That directory MUST be a real checkout of the private review-texts repo,
      # otherwise the downstream `cd data/review-texts && git …` block falls
      # through to the MAIN repo's .git, re-points origin at broadway-review-texts,
      # and a failed `git pull --rebase` checks out the review-texts tree over the
      # workspace — wiping .github/actions/ and failing every post-step
      # (the recurring "Post Setup Playwright: Can't find action.yml", 2026-06-20).
      - name: Checkout review-texts (private repo)
        uses: ./.github/actions/checkout-review-texts
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}

      # Record the review-texts HEAD before the audit ingests anything, so the
      # rebuild trigger below fires only when --ingest-missing actually added files.
      - name: Record review-texts SHA (pre-ingest)
        id: rt_before
        run: echo "sha=$(git -C data/review-texts rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Run gap audit
        env:
          BRIGHTDATA_TOKEN: ${{ secrets.BRIGHTDATA_TOKEN }}
          BRIGHTDATA_ZONE: ${{ secrets.BRIGHTDATA_ZONE }}
          SCRAPINGBEE_API_KEY: ${{ secrets.SCRAPINGBEE_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Default window widened to 3y + include-closed so the cron grinds the
          # whole back-catalogue, not just the last 21d. Checkpointing + the soft
          # time budget keep each 25-min run from timing out (every run was being
          # cancelled at the cap before, so the sweep never finished — 2026-06-06).
          WINDOW="${{ github.event.inputs.window_days || '1095' }}"
          DISPATCH="${{ github.event.inputs.dispatch_gather || 'false' }}"
          INGEST="${{ github.event.inputs.ingest_missing || 'true' }}"
          FAIL="${{ github.event.inputs.fail_on_gap || 'false' }}"
          INCLUDE_CLOSED="${{ github.event.inputs.include_closed || 'true' }}"
          # Always checkpoint so consecutive hourly runs resume from where the last
          # one stopped rather than re-auditing the same first shows forever.
          # Budget 18 (not 25): a single deep show can overshoot the between-show
          # budget check by several minutes, and the commit/push to the busy main
          # repo (5-retry, racing concurrent CI) needs slack — at 25 some runs were
          # still pushing when the 40-min job cap hit (exit 143). 18 leaves the
          # commit ~17 min even after a slow-show overshoot (2026-06-07).
          ARGS="--window=$WINDOW --checkpoint --time-budget-min=18"
          if [ "$INCLUDE_CLOSED" = "true" ]; then
            ARGS="$ARGS --include-closed"
          fi
          if [ "$DISPATCH" = "true" ]; then
            ARGS="$ARGS --dispatch-gather"
          fi
          if [ "$INGEST" = "true" ]; then
            ARGS="$ARGS --ingest-missing"
          fi
          if [ "$FAIL" = "true" ]; then
            ARGS="$ARGS --fail-on-gap"
          fi
          node scripts/audit-show-review-gap.js $ARGS

      - name: Commit audit JSON (public repo)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Audit JSON lives in the public repo. Commit the checkpoint too — it's
          # what lets consecutive runs resume instead of re-auditing the same
          # first shows (the 25-min-timeout fix).
          git add data/audit/show-review-gap.json data/audit/unknown-aggregator-outlets.json data/audit/gap-audit-checkpoint.json || true
          if git diff --cached --quiet; then
            echo "No audit changes to commit"
          else
            git commit -m "audit: show-review-gap [skip ci]"
            bash scripts/lib/push-with-retry.sh 5 main
          fi

      # Push review-text files written by --ingest-missing back to the private
      # repo via the shared action (content-aware conflict resolution, symlink
      # guard, protected-field restore). Replaces the old hand-rolled push block
      # that corrupted the workspace when data/review-texts wasn't a real checkout.
      - name: Push ingested review-texts
        if: always()
        uses: ./.github/actions/push-review-texts
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
          message: "ingest: audit-aggregator-gap auto-ingested review-texts"

      - name: Trigger rebuild if review-texts changed
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          AFTER="$(git -C data/review-texts rev-parse HEAD)"
          if [ "$AFTER" != "${{ steps.rt_before.outputs.sha }}" ]; then
            echo "review-texts advanced ${{ steps.rt_before.outputs.sha }} -> $AFTER — triggering rebuild"
            gh workflow run "Rebuild Reviews Data" -f reason="audit-aggregator-gap ingested new reviews" || true
          else
            echo "No new review-texts ingested — skipping rebuild trigger"
          fi

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: 'Aggregator Review Gap Audit Failed'
          severity: 'warning'
