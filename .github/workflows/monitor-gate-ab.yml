name: Monitor Gate A/B

# Weekly guardrail monitor for the mobile-gate-timing email-capture A/B, PLUS
# (card #240) the overall email-gate funnel monitor — nothing previously
# watched the funnel itself, only the (never-launched) A/B's guardrails.
#
# Step 1 (mobile-gate-timing A/B): emails the owner proactively when the
# experiment goes live, when it reaches the pre-registered power floor (950
# impressions/arm — time to judge), at the 8-week checkpoint, and on guardrail
# breaches (bounce / dismissal skew). Silent while pre-flag (fallback-only
# traffic) — the flag was never created, so this stays silent indefinitely.
#
# Step 2 (overall funnel): tracks modal-only impressions/dismissal/captures
# (trigger != '' — excludes inline header/footer email_captured events) and
# alerts (actionable-only) if absolute captures/week collapses below ~1,
# regardless of conversion rate. Full context:
# ~/Documents/claude-outputs/email-gate-analysis-2026-07-20.md
#
# Weekly summaries are log-only (no Discord). Neither step judges a primary
# metric or touches gate/flag config — those stay owner decisions.

on:
  schedule:
    - cron: '0 13 * * 1'  # Mondays 13:00 UTC (9 AM ET)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Compute decisions but send nothing / save nothing'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: monitor-gate-ab
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Run mobile-gate-timing A/B monitor
        env:
          POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
          DISCORD_WEBHOOK_ALERTS: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
        run: node scripts/monitor-gate-ab.js ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Run overall email-gate funnel monitor (card #240)
        env:
          POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
        run: node scripts/monitor-email-gate-funnel.js ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Commit monitor state
        # always() so a failure in EITHER monitor step still commits whatever
        # state the OTHER step already earned this run (e.g. step 1's
        # liveAlertedAt stamp) — without it, a step-2 failure would skip this
        # entirely and step 1's already-sent alert would resend next week.
        if: ${{ always() && !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Per-file guard: `git add existing missing` exits 128 and stages
          # NEITHER file (verified) — under this step's default `bash -e`,
          # that would crash the whole step and lose the OTHER monitor's
          # earned state too. Matters on the funnel monitor's first-ever run,
          # before its state file exists in the repo tree.
          for f in data/audit/gate-ab-monitor-state.json data/audit/email-gate-funnel-monitor-state.json; do
            [ -f "$f" ] && git add "$f"
          done
          if git diff --cached --quiet; then
            echo "No state change to commit"
            exit 0
          fi
          git commit -m "data: gate A/B + email-gate funnel monitor state [skip ci]"
          bash scripts/lib/push-with-retry.sh

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: 'Monitor Gate A/B Failed'
          severity: 'warning'
