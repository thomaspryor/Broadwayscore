name: Monitor Gate A/B

# Weekly guardrail monitor for the mobile-gate-timing email-capture A/B.
# Emails the owner proactively when the experiment goes live, when it reaches
# the pre-registered power floor (950 impressions/arm — time to judge), at the
# 8-week checkpoint, and on guardrail breaches (bounce / dismissal skew).
# Weekly summary goes to Discord. Never judges the primary metric and never
# touches flag rollout — those are owner decisions.
#
# Silent while the experiment is pre-flag (fallback-only traffic), so it is
# safe to have running before the PostHog flag is created (~2026-07-26).

on:
  schedule:
    - cron: '0 13 * * 1'  # Mondays 13:00 UTC (9 AM ET)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Compute decisions but send nothing / save nothing'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: monitor-gate-ab
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Run monitor
        env:
          POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
          DISCORD_WEBHOOK_ALERTS: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
        run: node scripts/monitor-gate-ab.js ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Commit monitor state
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/audit/gate-ab-monitor-state.json
          if git diff --cached --quiet; then
            echo "No state change to commit"
            exit 0
          fi
          git commit -m "data: gate A/B monitor state [skip ci]"
          bash scripts/lib/push-with-retry.sh

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: 'Monitor Gate A/B Failed'
          severity: 'warning'
