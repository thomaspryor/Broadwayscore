name: Process Feedback Submissions

on:
  schedule:
    # Every 10 min — feedback is triaged + (auto-fixed | flagged) within minutes,
    # not the next day. Cheap: repo is public (free Actions minutes) and the
    # Anthropic calls only fire when there are NEW, un-deduped submissions.
    - cron: '*/10 * * * *'
  workflow_dispatch: # Manual trigger

concurrency:
  group: process-feedback
  cancel-in-progress: false

jobs:
  process-feedback:
    runs-on: ubuntu-latest
    # 30 min, not 15: the tracking-file push (push-with-retry, 7 attempts with
    # backoff) can alone eat ~15 min under main-branch contention. On 2026-07-07
    # (run 28876301784) that timed the job out as "cancelled" before issue
    # creation ran, silently swallowing a diagnosed bug report.
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}


      - name: Checkout core data
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch, categorize, and diagnose feedback
        id: process
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FORMSPREE_TOKEN: ${{ secrets.FORMSPREE_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          node scripts/process-feedback.js

      # Step order is deliberate: issue creation (cheap API calls) runs BEFORE the
      # tracking commit (push-with-retry can burn 15 min under contention). The old
      # order lost a diagnosed bug when the job timed out mid-push (2026-07-07,
      # run 28876301784): tracking had already marked the submission processed via
      # if: always(), but the success()-gated issue step never ran. Diagnoses are
      # also persisted in data/audit/pending-bug-diagnoses.json (drained here,
      # committed below) so even a cancellation during THIS step is recoverable
      # on the next run via has_pending_diagnoses.
      - name: Create Bug Diagnosis Issues
        if: success() && (steps.process.outputs.has_submissions == 'true' || steps.process.outputs.has_pending_diagnoses == 'true')
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const PENDING_PATH = 'data/audit/pending-bug-diagnoses.json';
            const RUN_REPORT_PATH = 'data/audit/feedback-run-report.json';

            // --- Owner run-report enrichment (2026-08-05, GH #543) ---------
            // process-feedback.js writes what it knows before dispatch; only
            // THIS step knows the issue numbers and whether each dispatch
            // actually landed. scripts/notify-feedback-outcomes.js emails the
            // merged result, so the owner sees "auto-dispatched" vs "dispatch
            // failed" vs "parked" rather than nothing at all — which is what
            // they got for #505 and #543.
            //
            // Every write is best-effort and individually guarded: enriching a
            // report must never be able to sink issue creation. A report that
            // fails to update degrades to a less specific email, not a lost
            // submission.
            // Matching + enrichment live in a unit-tested module: an entry that
            // fails to match would email the owner "no action taken" for work
            // that actually ran — a quieter replay of the bug this report exists
            // to end. See scripts/lib/feedback-run-report.js.
            const runReportLib = require(`${process.env.GITHUB_WORKSPACE}/scripts/lib/feedback-run-report.js`);

            let runReport = null;
            try {
              runReport = JSON.parse(fs.readFileSync(RUN_REPORT_PATH, 'utf8'));
            } catch { /* no report (e.g. resumed pending-only run) — email step handles absence */ }

            const recordIssue = (submission, issueNumber) =>
              runReportLib.recordIssue(runReport, submission, issueNumber);
            const recordDispatch = (submission, action, ok, error) =>
              runReportLib.recordDispatch(runReport, submission, action, ok, error);

            function saveRunReport() {
              if (!runReport) return;
              try {
                fs.writeFileSync(RUN_REPORT_PATH, JSON.stringify(runReport, null, 2) + '\n');
              } catch (err) {
                console.log(`Could not persist run report: ${err.message}`);
              }
            }

            // The request ledger is written by process-feedback.js BEFORE any
            // issue exists, so the issue number can only be backfilled here.
            // Without it the "now live" email cannot link to (or close) the
            // tracking issue.
            const LEDGER_PATH = 'data/audit/feedback-request-ledger.json';
            let requestLedger = null;
            try {
              requestLedger = JSON.parse(fs.readFileSync(LEDGER_PATH, 'utf8'));
            } catch { /* no tracked requests this run */ }

            function recordLedgerIssue(submission, issueNumber) {
              if (!requestLedger || !Array.isArray(requestLedger.entries)) return;
              const id = runReportLib.submissionId(submission);
              if (!id) return;
              for (const e of requestLedger.entries) {
                if (e && e.submissionId === id && !e.issueNumber) e.issueNumber = issueNumber;
              }
            }

            function saveLedger() {
              if (!requestLedger) return;
              try {
                fs.writeFileSync(LEDGER_PATH, JSON.stringify(requestLedger, null, 2) + '\n');
              } catch (err) {
                console.log(`Could not persist request ledger: ${err.message}`);
              }
            }

            let diagnoses = [];
            try {
              diagnoses = JSON.parse(fs.readFileSync(PENDING_PATH, 'utf8'));
            } catch {
              console.log('No pending diagnoses file found');
              return;
            }
            if (!Array.isArray(diagnoses)) diagnoses = [];

            // Partition entries. Malformed rows (no submission/item — e.g. a
            // hand-edited or corrupted pending file) are dropped with a log:
            // keeping them would crash the drain loop on submission.show and,
            // because the finally block writes leftovers back, turn one bad row
            // into a permanent failure loop. Entries with a submission but a
            // null diagnosis (LLM call failed) get a minimal needs-review issue
            // below instead of vanishing — a failed diagnosis must not silently
            // eat the user's report.
            const wellFormed = diagnoses.filter(d => d && d.submission && d.item);
            const malformed = diagnoses.length - wellFormed.length;
            if (malformed > 0) console.log(`Dropping ${malformed} malformed pending entr(ies) with no submission/item`);
            const diagnosed = wellFormed.filter(d => d.diagnosis);
            const undiagnosed = wellFormed.filter(d => !d.diagnosis);

            // Undiagnosed entries whose issue creation fails must survive to
            // the next run — since content requests always take this path, a
            // transient GitHub API error would otherwise permanently lose the
            // user's request (both exit paths below rewrite the pending file).
            const failedUndiagnosed = [];
            for (const entry of undiagnosed) {
              const { item, submission } = entry;
              try {
                // Content-addition requests (missing show/reviews) deliberately
                // skip diagnosis — they're data work, not code bugs.
                const isContentRequest = item.contentRequest === true;
                // contentActions is the planner's output (scripts/lib/content-request-routing.js):
                // an array of {kind, workflow?, inputs?, reason?}. Dispatchable
                // actions carry a `workflow` — unroutable ones don't and still
                // park below exactly as before task #722.
                // Reads the ENTRY, not `item`. This used to be an inline
                // `item.contentActions` read, which is always undefined — so
                // from the day routing shipped (2026-08-04) nothing was ever
                // dispatched and every content request parked exactly as it had
                // before the routing layer existed. GH #542 died that way; so
                // did #546, a verbatim resubmission, while the planner logged
                // "2 action(s) will be dispatched". The shape now lives in one
                // unit-tested function instead of being restated in YAML where
                // no test can reach it.
                const contentActions = runReportLib.readContentActions(entry);
                const dispatchable = contentActions.filter((a) => a && a.workflow);
                const willAutoDispatch = isContentRequest && dispatchable.length > 0;

                const issue = await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: willAutoDispatch
                    ? `Content request auto-dispatched: ${(item.summary || 'no summary').substring(0, 60)}`
                    : isContentRequest
                    ? `Content request needs review: ${(item.summary || 'no summary').substring(0, 60)}`
                    : `Bug report needs manual review (auto-diagnosis failed): ${(item.summary || 'no summary').substring(0, 60)}`,
                  body: [
                    willAutoDispatch
                      ? `Content-addition request from user feedback — routed to ${dispatchable.length} workflow dispatch(es) below (task #722). No manual action needed unless a dispatch fails.`
                      : isContentRequest
                      ? `Content-addition request from user feedback — needs data work (add show/reviews), not a code fix.`
                      : `Auto-diagnosis failed for this feedback submission — review manually.`,
                    '',
                    `**From:** ${submission.name || 'Anonymous'} | **Show:** ${submission.show || 'N/A'} | **Priority:** ${item.priority || 'unknown'}`,
                    '',
                    `**Original message:**`,
                    `> ${(submission.message || '(no message)').replace(/\n/g, '\n> ')}`,
                    ...(contentActions.length
                      ? ['', '**Routing:**', ...contentActions.map((a) =>
                          a.workflow
                            ? `- \`${a.kind}\` → \`${a.workflow}\` (${JSON.stringify(a.inputs || {})})`
                            : `- \`${a.kind}\` — unroutable: ${a.reason || 'no reason given'}`
                        )]
                      : []),
                  ].join('\n'),
                  labels: willAutoDispatch ? ['feedback-digest', 'auto-dispatched'] : ['feedback-digest', 'needs-review'],
                });
                console.log(
                  willAutoDispatch
                    ? `Created auto-dispatched issue #${issue.data.number}`
                    : `Created needs-review issue #${issue.data.number} for undiagnosed report`
                );
                recordIssue(submission, issue.data.number);
                recordLedgerIssue(submission, issue.data.number);

                // Dispatch each routable action. One failed dispatch must not
                // sink the others or the issue itself — the issue (with its
                // routing table) is the audit trail either way.
                for (const action of dispatchable) {
                  try {
                    await github.rest.actions.createWorkflowDispatch({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      workflow_id: action.workflow,
                      ref: 'main',
                      inputs: action.inputs || {},
                    });
                    console.log(`  Dispatched ${action.workflow} for #${issue.data.number} (${action.kind})`);
                    recordDispatch(submission, action, true, null);
                  } catch (err) {
                    console.log(`  Failed to dispatch ${action.workflow} for #${issue.data.number}: ${err.message}`);
                    recordDispatch(submission, action, false, err.message);
                    try {
                      await github.rest.issues.createComment({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        issue_number: issue.data.number,
                        body: `Dispatch of \`${action.workflow}\` failed: ${err.message}. Needs a manual \`gh workflow run\` or investigation.`,
                      });
                    } catch (_) { /* comment is best-effort; the console log above is the record of truth */ }
                  }
                  // 10s spacing between dispatches — same rationale as the
                  // bug-diagnosis auto-fix dispatch loop below.
                  await new Promise((r) => setTimeout(r, 10000));
                }
              } catch (err) {
                console.log(`Failed to create needs-review issue for undiagnosed report: ${err.message}`);
                failedUndiagnosed.push(entry);
              }
            }

            if (diagnosed.length === 0) {
              console.log('No bugs diagnosed');
              saveRunReport();
              saveLedger();
              fs.writeFileSync(PENDING_PATH, JSON.stringify(failedUndiagnosed, null, 2) + '\n');
              if (failedUndiagnosed.length > 0) {
                console.log(`${failedUndiagnosed.length} undiagnosed entr(ies) NOT issued — left for the next run`);
              }
              return;
            }

            console.log(`Diagnosed ${diagnosed.length} bug(s); checking against open issues for duplicates`);

            // Topic-level dedup: a repeat report of an already-open bug must NOT
            // create a new issue or re-ping the owner. See scripts/lib/feedback-dedup.js.
            const { findDuplicateOpenBug } = require(`${process.env.GITHUB_WORKSPACE}/scripts/lib/feedback-dedup.js`);

            function parseDiagnosisJson(issueBody) {
              const m = (issueBody || '').match(/<!-- DIAGNOSIS_JSON\n([\s\S]*?)\nDIAGNOSIS_JSON -->/);
              if (!m) return null;
              try { return JSON.parse(m[1]); } catch { return null; }
            }

            // Fetch all OPEN bug-diagnosis issues and extract their embedded diagnosis.
            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'bug-diagnosis',
              per_page: 100,
            });
            const openBugs = openIssues
              .map(iss => ({ number: iss.number, diagnosis: parseDiagnosisJson(iss.body) }))
              .filter(b => b.diagnosis);
            console.log(`Found ${openBugs.length} open bug-diagnosis issue(s) to dedup against`);

            // Load shows.json for resolving show IDs. Ranked matching via the
            // shared resolver — the old inline exact-match returned null for
            // "MISTERMAN" vs stored title "Misterman (Theatre Row)" (GH #393),
            // zeroing showId/showSlug in the diagnosis payload.
            const showsRaw = JSON.parse(fs.readFileSync('data/shows.json', 'utf8'));
            const allShows = showsRaw.shows || showsRaw;
            const { resolveShow: resolveShowRanked } = require(`${process.env.GITHUB_WORKSPACE}/scripts/lib/resolve-show.js`);
            function resolveShow(name) {
              return resolveShowRanked(name, allShows);
            }

            // Drain as we go: entries are removed from `remaining` once handled,
            // and whatever is left (mid-loop crash/cancel) is written back in
            // finally so the next run picks it up instead of losing it.
            const remaining = new Set(diagnosed);
            try {
              for (const entry of diagnosed) {
                const { item, submission, diagnosis } = entry;
                const resolvedShow = resolveShow(submission.show);
                const diagPayload = {
                  ...diagnosis,
                  showId: resolvedShow?.id || null,
                  showSlug: resolvedShow?.slug || null,
                  submitterName: submission.name || null,
                  submitterEmail: submission.email || null,
                  submitterShow: submission.show || null,
                  originalMessage: submission.message || null,
                };

                // Skip if this bug duplicates an already-open issue — comment on
                // the existing one (no new issue, no new auto-fix dispatch, no
                // new owner email).
                const dup = findDuplicateOpenBug(diagPayload, openBugs);
                if (dup) {
                  console.log(`Duplicate of open issue #${dup.number} (${dup.reason}) — commenting, not creating new`);
                  let commented = false;
                  try {
                    await github.rest.issues.createComment({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      issue_number: dup.number,
                      body: [
                        `Another user reported this${submission.name ? ` (${submission.name})` : ''} on ${new Date().toISOString().split('T')[0]}:`,
                        '',
                        `> ${(submission.message || '(no message)').replace(/\n/g, '\n> ')}`,
                        '',
                        `_Matched as a duplicate (${dup.reason}); folded in here instead of opening a new issue._`,
                      ].join('\n'),
                    });
                    commented = true;
                  } catch (err) {
                    console.log(`  Failed to comment on #${dup.number}: ${err.message}`);
                  }
                  // Only suppress the new issue if the dedup comment actually
                  // landed. The submission is already marked processed upstream,
                  // so a failed comment with `continue` would silently lose the
                  // report — fall through to normal issue creation instead.
                  if (commented) { remaining.delete(entry); continue; }
                  console.log('  Comment failed — creating a normal issue so the report is not lost');
                }

                const body = [
                  `## Bug Report: ${item.summary}`,
                  `**From:** ${submission.name || 'Anonymous'} | **Show:** ${submission.show || 'N/A'} | **Priority:** ${item.priority}`,
                  `**Original message:** ${submission.message}`,
                  '',
                  `## What's Happening`,
                  diagnosis.whatsHappening,
                  '',
                  `## What I Found`,
                  ...diagnosis.findings.map(f => `- ${f}`),
                  '',
                  `## Proposed Fix`,
                  diagnosis.proposedFix,
                  `**Confidence:** ${diagnosis.confidence} | **Type:** ${diagnosis.fixType}`,
                  `**Files:** ${diagnosis.relevantFiles.join(', ')}`,
                  '',
                  '---',
                  `*Auto-diagnosed by feedback pipeline*`,
                  '',
                  `<!-- DIAGNOSIS_JSON`,
                  JSON.stringify(diagPayload),
                  `DIAGNOSIS_JSON -->`,
                ].join('\n');

                const title = `Bug Diagnosis: ${item.summary.substring(0, 60)}`;
                const labels = ['bug-diagnosis'];
                if (item.priority) labels.push(`${item.priority.toLowerCase()}-priority`);

                const issue = await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title,
                  body,
                  labels
                });

                console.log(`Created issue #${issue.data.number}: ${title}`);
                recordIssue(submission, issue.data.number);
                recordLedgerIssue(submission, issue.data.number);
                remaining.delete(entry);

                // Make this new issue dedup-able for the rest of this run (two
                // near-identical reports in one batch should collapse too).
                openBugs.push({ number: issue.data.number, diagnosis: diagPayload });

                // Dispatch auto-fix workflow (GITHUB_TOKEN events don't trigger issues.opened)
                try {
                  await github.rest.actions.createWorkflowDispatch({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    workflow_id: 'auto-fix-feedback-bug.yml',
                    ref: 'main',
                    inputs: { issue_number: String(issue.data.number) }
                  });
                  console.log(`  Dispatched auto-fix for #${issue.data.number}`);
                  recordDispatch(submission, { workflow: 'auto-fix-feedback-bug.yml', kind: 'auto-fix', inputs: { issue_number: String(issue.data.number) } }, true, null);
                } catch (err) {
                  console.log(`  Failed to dispatch auto-fix: ${err.message}`);
                  recordDispatch(submission, { workflow: 'auto-fix-feedback-bug.yml', kind: 'auto-fix', inputs: { issue_number: String(issue.data.number) } }, false, err.message);
                }

                // 10s spacing between dispatches
                await new Promise(r => setTimeout(r, 10000));
              }
            } finally {
              saveRunReport();
              saveLedger();
              const leftover = [...remaining, ...failedUndiagnosed];
              fs.writeFileSync(PENDING_PATH, JSON.stringify(leftover, null, 2) + '\n');
              if (leftover.length > 0) {
                console.log(`${leftover.length} diagnosis(es) NOT issued — left in ${PENDING_PATH} for the next run`);
              }
            }

      # Only fires when there is a Formshield spam-flagged item needing a manual
      # "Not Spam" rescue. Routine feedback no longer creates a digest issue:
      # bugs become deduped bug-diagnosis issues, praise/features get submitter
      # thank-yous. This kills the daily "Feedback Digest" notification noise.
      - name: Create Needs-Review Issue (spam-flagged only)
        if: success() && steps.process.outputs.has_spam_flagged == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');

            let summary = '';
            try {
              summary = fs.readFileSync('.feedback-summary.md', 'utf8');
            } catch (error) {
              return; // No summary = no issue
            }

            if (!summary || summary.trim().length === 0) return;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Feedback Needs Review (spam-flagged) - ${new Date().toISOString().split('T')[0]}`,
              body: summary,
              labels: ['feedback-digest', 'needs-review']
            });

      # THE visibility guarantee (2026-08-05, GH #543). Runs on success AND on
      # failure/cancellation, deliberately: the owner's complaint was not "the
      # pipeline broke", it was "something happened and nobody told me". A run
      # that crashes mid-way must still say which submissions it saw and what
      # state it left them in.
      #
      # Placed BEFORE the tracking commit for the same reason issue creation is:
      # push-with-retry can burn ~15 min under main-branch contention and has
      # timed this job out before (run 28876301784). Notification must not sit
      # behind a git push.
      #
      # No-op when there is no run report (the common "no new feedback" case) —
      # exits 0 without sending, so this does not become its own noise source.
      - name: Email feedback outcomes to owner
        if: always()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
          PIPELINE_STATUS: ${{ job.status }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/notify-feedback-outcomes.js

      # "Auto-dispatched" is not "fixed". This checks every open request against
      # what broadwayscorecard.com actually serves and emails the owner when the
      # show/reviews/image are genuinely live — and separately when a request has
      # been stuck for days, which is how a silently-failed workflow surfaces
      # instead of the request just never happening.
      #
      # Runs every cycle, not only when there is new feedback: a request lands
      # one day and goes live hours later, so the check has to keep running long
      # after the submission that created it. Cheap — a handful of HTTPS GETs,
      # and it exits immediately when no requests are open.
      - name: Verify user requests are live on the site
        if: always()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/verify-feedback-requests-live.js

      - name: Commit tracking file
        if: always()
        run: |
          git add data/audit/processed-feedback.json
          git add data/audit/pending-bug-diagnoses.json 2>/dev/null || true
          git add data/audit/feedback-request-ledger.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No tracking changes"
          else
            git commit -m "chore: Update feedback tracking

          Co-Authored-By: github-actions[bot] <github-actions[bot]@users.noreply.github.com>"

            bash scripts/lib/push-with-retry.sh
          fi

      - name: Ensure owner is not watching repo (prevents GitHub notification emails)
        env:
          GH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
        run: |
          # "Not watching" — owner only gets @mentions, not every bot-created
          # issue/comment. All pipeline notifications go via Resend, not GitHub.
          # NOTE: unwatching requires DELETE on the subscription. The old code
          # used PUT {"subscribed":false}, which GitHub rejects (422) and which
          # left the owner subscribed — the root cause of the per-issue email
          # noise. DELETE removes the subscription (idempotent: 404 = already
          # unwatched). Needs the token's "notifications" (or repo) scope.
          code=$(curl -s -o /dev/null -w '%{http_code}' -X DELETE \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/subscription")
          echo "Unwatch DELETE returned HTTP $code (204=unwatched, 404=already not watching)"
          if [ "$code" != "204" ] && [ "$code" != "404" ]; then
            echo "::warning::Could not unwatch repo (HTTP $code) — GH_DISPATCH_TOKEN may lack 'notifications' scope; owner may keep getting issue emails."
          fi

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: 'Process Feedback Failed'
          discord_webhook: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
          resend_api_key: ${{ secrets.RESEND_API_KEY }}
          owner_email: ${{ secrets.OWNER_EMAIL }}
