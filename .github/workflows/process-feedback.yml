name: Process Feedback Submissions

on:
  schedule:
    # Every 10 min — feedback is triaged + (auto-fixed | flagged) within minutes,
    # not the next day. Cheap: repo is public (free Actions minutes) and the
    # Anthropic calls only fire when there are NEW, un-deduped submissions.
    - cron: '*/10 * * * *'
  workflow_dispatch: # Manual trigger

concurrency:
  group: process-feedback
  cancel-in-progress: false

jobs:
  process-feedback:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}


      - name: Checkout core data
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch, categorize, and diagnose feedback
        id: process
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FORMSPREE_TOKEN: ${{ secrets.FORMSPREE_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          node scripts/process-feedback.js

      - name: Commit tracking file
        if: always()
        run: |
          git add data/audit/processed-feedback.json
          if git diff --staged --quiet; then
            echo "No tracking changes"
          else
            git commit -m "chore: Update feedback tracking

          Co-Authored-By: github-actions[bot] <github-actions[bot]@users.noreply.github.com>"

            bash scripts/lib/push-with-retry.sh
          fi

      - name: Ensure owner is not watching repo (prevents GitHub notification emails)
        env:
          GH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
        run: |
          # "Not watching" — owner only gets @mentions, not every bot-created
          # issue/comment. All pipeline notifications go via Resend, not GitHub.
          # NOTE: unwatching requires DELETE on the subscription. The old code
          # used PUT {"subscribed":false}, which GitHub rejects (422) and which
          # left the owner subscribed — the root cause of the per-issue email
          # noise. DELETE removes the subscription (idempotent: 404 = already
          # unwatched). Needs the token's "notifications" (or repo) scope.
          code=$(curl -s -o /dev/null -w '%{http_code}' -X DELETE \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/subscription")
          echo "Unwatch DELETE returned HTTP $code (204=unwatched, 404=already not watching)"
          if [ "$code" != "204" ] && [ "$code" != "404" ]; then
            echo "::warning::Could not unwatch repo (HTTP $code) — GH_DISPATCH_TOKEN may lack 'notifications' scope; owner may keep getting issue emails."
          fi

      # Only fires when there is a Formshield spam-flagged item needing a manual
      # "Not Spam" rescue. Routine feedback no longer creates a digest issue:
      # bugs become deduped bug-diagnosis issues, praise/features get submitter
      # thank-yous. This kills the daily "Feedback Digest" notification noise.
      - name: Create Needs-Review Issue (spam-flagged only)
        if: success() && steps.process.outputs.has_spam_flagged == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');

            let summary = '';
            try {
              summary = fs.readFileSync('.feedback-summary.md', 'utf8');
            } catch (error) {
              return; // No summary = no issue
            }

            if (!summary || summary.trim().length === 0) return;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Feedback Needs Review (spam-flagged) - ${new Date().toISOString().split('T')[0]}`,
              body: summary,
              labels: ['feedback-digest', 'needs-review']
            });

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: 'Process Feedback Failed'
          discord_webhook: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
          resend_api_key: ${{ secrets.RESEND_API_KEY }}
          owner_email: ${{ secrets.OWNER_EMAIL }}

      - name: Create Bug Diagnosis Issues
        if: success() && steps.process.outputs.has_submissions == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');

            let diagnoses = [];
            try {
              diagnoses = JSON.parse(fs.readFileSync('.bug-diagnoses.json', 'utf8'));
            } catch {
              console.log('No bug diagnoses file found');
              return;
            }

            const diagnosed = diagnoses.filter(d => d.diagnosis);
            if (diagnosed.length === 0) {
              console.log('No bugs diagnosed');
              return;
            }

            console.log(`Diagnosed ${diagnosed.length} bug(s); checking against open issues for duplicates`);

            // Topic-level dedup: a repeat report of an already-open bug must NOT
            // create a new issue or re-ping the owner. See scripts/lib/feedback-dedup.js.
            const { findDuplicateOpenBug } = require(`${process.env.GITHUB_WORKSPACE}/scripts/lib/feedback-dedup.js`);

            function parseDiagnosisJson(issueBody) {
              const m = (issueBody || '').match(/<!-- DIAGNOSIS_JSON\n([\s\S]*?)\nDIAGNOSIS_JSON -->/);
              if (!m) return null;
              try { return JSON.parse(m[1]); } catch { return null; }
            }

            // Fetch all OPEN bug-diagnosis issues and extract their embedded diagnosis.
            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'bug-diagnosis',
              per_page: 100,
            });
            const openBugs = openIssues
              .map(iss => ({ number: iss.number, diagnosis: parseDiagnosisJson(iss.body) }))
              .filter(b => b.diagnosis);
            console.log(`Found ${openBugs.length} open bug-diagnosis issue(s) to dedup against`);

            // Load shows.json for resolving show IDs
            const showsRaw = JSON.parse(fs.readFileSync('data/shows.json', 'utf8'));
            const allShows = showsRaw.shows || showsRaw;
            function resolveShow(name) {
              if (!name || name === 'N/A') return null;
              const lower = name.toLowerCase().trim();
              return allShows.find(s =>
                s.title.toLowerCase() === lower ||
                s.slug === lower ||
                s.slug === lower.replace(/\s+/g, '-')
              ) || null;
            }

            for (const { item, submission, diagnosis } of diagnosed) {
              const resolvedShow = resolveShow(submission.show);
              const diagPayload = {
                ...diagnosis,
                showId: resolvedShow?.id || null,
                showSlug: resolvedShow?.slug || null,
                submitterName: submission.name || null,
                submitterEmail: submission.email || null,
                submitterShow: submission.show || null,
                originalMessage: submission.message || null,
              };

              // Skip if this bug duplicates an already-open issue — comment on
              // the existing one (no new issue, no new auto-fix dispatch, no
              // new owner email).
              const dup = findDuplicateOpenBug(diagPayload, openBugs);
              if (dup) {
                console.log(`Duplicate of open issue #${dup.number} (${dup.reason}) — commenting, not creating new`);
                let commented = false;
                try {
                  await github.rest.issues.createComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: dup.number,
                    body: [
                      `Another user reported this${submission.name ? ` (${submission.name})` : ''} on ${new Date().toISOString().split('T')[0]}:`,
                      '',
                      `> ${(submission.message || '(no message)').replace(/\n/g, '\n> ')}`,
                      '',
                      `_Matched as a duplicate (${dup.reason}); folded in here instead of opening a new issue._`,
                    ].join('\n'),
                  });
                  commented = true;
                } catch (err) {
                  console.log(`  Failed to comment on #${dup.number}: ${err.message}`);
                }
                // Only suppress the new issue if the dedup comment actually
                // landed. The submission is already marked processed upstream,
                // so a failed comment with `continue` would silently lose the
                // report — fall through to normal issue creation instead.
                if (commented) continue;
                console.log('  Comment failed — creating a normal issue so the report is not lost');
              }

              const body = [
                `## Bug Report: ${item.summary}`,
                `**From:** ${submission.name || 'Anonymous'} | **Show:** ${submission.show || 'N/A'} | **Priority:** ${item.priority}`,
                `**Original message:** ${submission.message}`,
                '',
                `## What's Happening`,
                diagnosis.whatsHappening,
                '',
                `## What I Found`,
                ...diagnosis.findings.map(f => `- ${f}`),
                '',
                `## Proposed Fix`,
                diagnosis.proposedFix,
                `**Confidence:** ${diagnosis.confidence} | **Type:** ${diagnosis.fixType}`,
                `**Files:** ${diagnosis.relevantFiles.join(', ')}`,
                '',
                '---',
                `*Auto-diagnosed by feedback pipeline*`,
                '',
                `<!-- DIAGNOSIS_JSON`,
                JSON.stringify(diagPayload),
                `DIAGNOSIS_JSON -->`,
              ].join('\n');

              const title = `Bug Diagnosis: ${item.summary.substring(0, 60)}`;
              const labels = ['bug-diagnosis'];
              if (item.priority) labels.push(`${item.priority.toLowerCase()}-priority`);

              const issue = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels
              });

              console.log(`Created issue #${issue.data.number}: ${title}`);

              // Make this new issue dedup-able for the rest of this run (two
              // near-identical reports in one batch should collapse too).
              openBugs.push({ number: issue.data.number, diagnosis: diagPayload });

              // Dispatch auto-fix workflow (GITHUB_TOKEN events don't trigger issues.opened)
              try {
                await github.rest.actions.createWorkflowDispatch({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id: 'auto-fix-feedback-bug.yml',
                  ref: 'main',
                  inputs: { issue_number: String(issue.data.number) }
                });
                console.log(`  Dispatched auto-fix for #${issue.data.number}`);
              } catch (err) {
                console.log(`  Failed to dispatch auto-fix: ${err.message}`);
              }

              // 10s spacing between dispatches
              await new Promise(r => setTimeout(r, 10000));
            }
