name: Process Feedback Submissions

on:
  schedule:
    # Run daily at 9 AM UTC (4 AM EST)
    - cron: '0 9 * * *'
  workflow_dispatch: # Manual trigger

concurrency:
  group: process-feedback
  cancel-in-progress: false

jobs:
  process-feedback:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}


      - name: Checkout core data
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch, categorize, and diagnose feedback
        id: process
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FORMSPREE_TOKEN: ${{ secrets.FORMSPREE_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          node scripts/process-feedback.js

      - name: Commit tracking file
        if: always()
        run: |
          git add data/audit/processed-feedback.json
          if git diff --staged --quiet; then
            echo "No tracking changes"
          else
            git commit -m "chore: Update feedback tracking

          Co-Authored-By: github-actions[bot] <github-actions[bot]@users.noreply.github.com>"

            bash scripts/lib/push-with-retry.sh
          fi

      - name: Ensure owner is not watching repo (prevents GitHub notification emails)
        env:
          GH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
        run: |
          # Set repo to "not watching" — owner only gets @mentions, not every issue/comment.
          # All pipeline notifications go via custom emails (Resend), not GitHub.
          curl -sf -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/subscription" \
            -d '{"subscribed":false}' > /dev/null 2>&1 || echo "Note: could not update subscription (may need notifications scope)"

      - name: Create GitHub Issue for Summary
        if: success() && steps.process.outputs.has_submissions == 'true'
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');

            let summary = '';
            try {
              summary = fs.readFileSync('.feedback-summary.md', 'utf8');
            } catch (error) {
              return; // No summary = no issue
            }

            if (!summary || summary.trim().length === 0) return;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Feedback Digest - ${new Date().toISOString().split('T')[0]}`,
              body: summary,
              labels: ['feedback-digest']
            });

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: 'Process Feedback Failed'
          discord_webhook: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
          resend_api_key: ${{ secrets.RESEND_API_KEY }}
          owner_email: ${{ secrets.OWNER_EMAIL }}

      - name: Create Bug Diagnosis Issues
        if: success() && steps.process.outputs.has_submissions == 'true'
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');

            let diagnoses = [];
            try {
              diagnoses = JSON.parse(fs.readFileSync('.bug-diagnoses.json', 'utf8'));
            } catch {
              console.log('No bug diagnoses file found');
              return;
            }

            const diagnosed = diagnoses.filter(d => d.diagnosis);
            if (diagnosed.length === 0) {
              console.log('No bugs diagnosed');
              return;
            }

            console.log(`Creating ${diagnosed.length} bug diagnosis issue(s)`);

            // Load shows.json for resolving show IDs
            const showsRaw = JSON.parse(fs.readFileSync('data/shows.json', 'utf8'));
            const allShows = showsRaw.shows || showsRaw;
            function resolveShow(name) {
              if (!name || name === 'N/A') return null;
              const lower = name.toLowerCase().trim();
              return allShows.find(s =>
                s.title.toLowerCase() === lower ||
                s.slug === lower ||
                s.slug === lower.replace(/\s+/g, '-')
              ) || null;
            }

            for (const { item, submission, diagnosis } of diagnosed) {
              const resolvedShow = resolveShow(submission.show);
              const diagPayload = {
                ...diagnosis,
                showId: resolvedShow?.id || null,
                showSlug: resolvedShow?.slug || null,
                submitterName: submission.name || null,
                submitterEmail: submission.email || null,
                submitterShow: submission.show || null,
                originalMessage: submission.message || null,
              };

              const body = [
                `## Bug Report: ${item.summary}`,
                `**From:** ${submission.name || 'Anonymous'} | **Show:** ${submission.show || 'N/A'} | **Priority:** ${item.priority}`,
                `**Original message:** ${submission.message}`,
                '',
                `## What's Happening`,
                diagnosis.whatsHappening,
                '',
                `## What I Found`,
                ...diagnosis.findings.map(f => `- ${f}`),
                '',
                `## Proposed Fix`,
                diagnosis.proposedFix,
                `**Confidence:** ${diagnosis.confidence} | **Type:** ${diagnosis.fixType}`,
                `**Files:** ${diagnosis.relevantFiles.join(', ')}`,
                '',
                '---',
                `*Auto-diagnosed by feedback pipeline*`,
                '',
                `<!-- DIAGNOSIS_JSON`,
                JSON.stringify(diagPayload),
                `DIAGNOSIS_JSON -->`,
              ].join('\n');

              const title = `Bug Diagnosis: ${item.summary.substring(0, 60)}`;
              const labels = ['bug-diagnosis'];
              if (item.priority) labels.push(`${item.priority.toLowerCase()}-priority`);

              const issue = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels
              });

              console.log(`Created issue #${issue.data.number}: ${title}`);

              // Dispatch auto-fix workflow (GITHUB_TOKEN events don't trigger issues.opened)
              try {
                await github.rest.actions.createWorkflowDispatch({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id: 'auto-fix-feedback-bug.yml',
                  ref: 'main',
                  inputs: { issue_number: String(issue.data.number) }
                });
                console.log(`  Dispatched auto-fix for #${issue.data.number}`);
              } catch (err) {
                console.log(`  Failed to dispatch auto-fix: ${err.message}`);
              }

              // 10s spacing between dispatches
              await new Promise(r => setTimeout(r, 10000));
            }
