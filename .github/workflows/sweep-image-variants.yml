name: Sweep Image Variants

# BRO-6808: daily backstop that creates any missing public/images/shows/<id>/sm/ list
# variant. fetch-all-image-formats and fetch-tour-schedules already make variants for
# their own art; this catches images landed by hand or by sessions. Missing-only: stale
# variants are not detectable from a fresh checkout (mtimes), the fetch workflows force them.

on:
  schedule:
    - cron: '25 9 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: fetch-images
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Generate missing variants
        run: node scripts/resize-show-images.js --variants --missing-only

      - name: Commit variants
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- "public/images/shows/*/sm"
          if git diff --cached --quiet; then
            echo "No missing variants"
            exit 0
          fi
          git commit -m "images: sweep missing sm/ list variants [skip ci]"
          bash scripts/lib/push-with-retry.sh

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: 'Sweep Image Variants Failed'
          severity: 'warning'
