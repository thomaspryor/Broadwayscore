name: Audit Imageless Scored Shows

# Card #1456 backstop: independent of check-show-freshness.yml (which was
# silently skipping its own image-fetch job for 5+ days due to an unrelated
# build-verify failure). Finds any show with reviews but no image on disk
# past the grace window, self-heals via scripts/audit-imageless-scored-shows.js
# (per-show cooldown + dispatch cap so this can't storm the fetch-images
# concurrency group), and alerts if self-heal itself isn't working.

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Report only, skip dispatch/alert/write'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    # 15->25 (task investigating card: "Benevolent"/IATI Theater discovery +
    # image gap, 2026-08-22): this job's "Commit audit ledger" step shares
    # the exact same push-with-retry.sh bug fixed on scrape-new-aggregators.
    # yml and fetch-all-image-formats.yml in the same incident — plain
    # push-with-retry.sh with no override, committing a data/audit/ path,
    # which the Git Data API fallback unconditionally refuses. This is the
    # self-heal mechanism (card #1456) meant to catch exactly the class of
    # gap that caused Benevolent to launch imageless — if ITS OWN commit
    # can't land, the safety net silently doesn't work either. 25min leaves
    # generous headroom over the 600s(10min) PUSH_DEADLINE_SEC override
    # below plus the audit script's own runtime.
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Checkout core data
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run audit
        env:
          GH_TOKEN: ${{ github.token }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            node scripts/audit-imageless-scored-shows.js --dry-run
          else
            node scripts/audit-imageless-scored-shows.js
          fi

      # Explicit commit, not push-core-data (adversarial review, 2026-08-14):
      # push-core-data's composite action only syncs its fixed CORE_FILES
      # list (shows.json, reviews.json, ...) — data/audit/*.json is never in
      # that list, so the ledger this workflow depends on for its own
      # cooldown/escalation state would silently never reach the repo, and
      # every run would start cold. Same pattern as discover-regional-serp-
      # reviews.yml's "Commit audit log" step.
      - name: Commit audit ledger
        if: always() && inputs.dry_run != true
        env:
          # Same fix as scrape-new-aggregators.yml / fetch-all-image-formats.
          # yml (PR #667): this step's push previously used push-with-retry.
          # sh's plain defaults (240s deadline, early bail to a Git Data API
          # fallback that unconditionally refuses any data/audit/ path) —
          # meaning a push loss here silently disabled this workflow's own
          # self-heal ledger/cooldown state with no signal to the owner.
          PUSH_DEADLINE_SEC: '600'
          PUSH_API_FALLBACK_DISABLE: '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/audit/imageless-scored-shows.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No ledger changes"
          else
            git commit -m "data: imageless-scored-shows audit [skip ci]

          Co-Authored-By: github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
            bash scripts/lib/push-with-retry.sh
          fi

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: 'Audit Imageless Scored Shows Failed'
          severity: 'warning'
