name: Opening Night Readiness Check

on:
  workflow_dispatch:
    inputs:
      show_id:
        description: 'Show ID to check (e.g., dog-day-afternoon-2026)'
        required: true
        type: string
      market:
        description: 'Market (auto-detected from show data if omitted)'
        required: false
        type: choice
        default: auto
        options:
          - auto
          - broadway
          - west-end

permissions:
  contents: read
  actions: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout core data
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}

      - name: Checkout review-texts (private repo)
        uses: ./.github/actions/checkout-review-texts
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run readiness check
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SCRAPINGBEE_API_KEY: ${{ secrets.SCRAPINGBEE_API_KEY }}
          BRIGHTDATA_TOKEN: ${{ secrets.BRIGHTDATA_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FORMSPREE_SUBSCRIBER_API_KEY: ${{ secrets.FORMSPREE_SUBSCRIBER_API_KEY }}
          FORMSPREE_SUBSCRIBER_FORM_ID: ${{ secrets.FORMSPREE_SUBSCRIBER_FORM_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MARKET_FLAG=""
          if [ -n "${{ inputs.market }}" ] && [ "${{ inputs.market }}" != "auto" ]; then
            MARKET_FLAG="--market=${{ inputs.market }}"
          fi
          node scripts/check-opening-night-readiness.js --show=${{ inputs.show_id }} $MARKET_FLAG
