name: Check Vercel Deployments

on:
  workflow_dispatch:

jobs:
  check-deployments:
    runs-on: ubuntu-latest
    steps:
      - name: Check recent Vercel deployments
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          echo "=== Checking recent Vercel deployments ==="
          RESPONSE=$(curl -s -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v6/deployments?app=broadwayscore&limit=10&teamId=team_zvgatcxkXdPbfhtHQMOnjpXo")
          
          echo ""
          echo "=== Raw response (first 5000 chars) ==="
          echo "$RESPONSE" | head -c 5000
          echo ""
          echo ""
          
          echo "=== Deployment summary ==="
          echo "$RESPONSE" | jq -r '.deployments[] | "ID: \(.uid) | State: \(.state // .readyState) | Created: \(.created | . / 1000 | todate) | URL: \(.url) | Source: \(.source // "unknown") | Target: \(.target // "unknown")"' 2>/dev/null || echo "Failed to parse JSON"
          
          echo ""
          echo "=== Checking for deploy hook deployments ==="
          echo "$RESPONSE" | jq -r '.deployments[] | select(.source == "hook" or .source == "deploy-hook") | "HOOK DEPLOY: \(.uid) | State: \(.state // .readyState) | Created: \(.created | . / 1000 | todate)"' 2>/dev/null || echo "No hook deployments found"
          
          echo ""
          echo "=== Most recent deployment details ==="
          echo "$RESPONSE" | jq '.deployments[0]' 2>/dev/null || echo "Failed to get details"
