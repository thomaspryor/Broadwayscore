name: Backfill Review Dates

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max reviews to process per run'
        required: false
        default: '100'
        type: string
      offset:
        description: 'Skip first N undated reviews (for batching)'
        required: false
        default: '0'
        type: string
      show:
        description: 'Only process a specific show ID'
        required: false
        default: ''
        type: string
      dry_run:
        description: 'Show what would be updated without writing files'
        required: false
        default: false
        type: boolean
      domains:
        description: 'Domain filter: high-yield (recommended), or comma-separated list'
        required: false
        default: 'high-yield'
        type: string
      free_only:
        description: 'Only use free sources (Archive.org + cookies), no paid scrapers'
        required: false
        default: false
        type: boolean

concurrency:
  group: backfill-review-dates
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Setup Playwright
        uses: ./.github/actions/setup-playwright

      - name: Checkout review texts
        uses: ./.github/actions/checkout-review-texts
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}

      - name: Checkout core data
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Run date backfill
        env:
          SCRAPINGBEE_API_KEY: ${{ secrets.SCRAPINGBEE_API_KEY }}
          SCRAPINGDOG_API_KEY: ${{ secrets.SCRAPINGDOG_API_KEY }}
          SCRAPER_USE_SCRAPINGDOG: '1'
          BRIGHTDATA_TOKEN: ${{ secrets.BRIGHTDATA_TOKEN }}
          BRIGHTDATA_ZONE: ${{ secrets.BRIGHTDATA_ZONE }}
          COOKIES_BUNDLE_1: ${{ secrets.COOKIES_BUNDLE_1 }}
          COOKIES_BUNDLE_2: ${{ secrets.COOKIES_BUNDLE_2 }}
          COOKIES_BUNDLE_3: ${{ secrets.COOKIES_BUNDLE_3 }}
          COOKIES_BUNDLE_4: ${{ secrets.COOKIES_BUNDLE_4 }}
          COOKIES_BUNDLE_5: ${{ secrets.COOKIES_BUNDLE_5 }}
          COOKIES_BUNDLE_6: ${{ secrets.COOKIES_BUNDLE_6 }}
          COOKIES_BUNDLE_7: ${{ secrets.COOKIES_BUNDLE_7 }}
          COOKIES_BUNDLE_8: ${{ secrets.COOKIES_BUNDLE_8 }}
          COOKIES_BUNDLE_9: ${{ secrets.COOKIES_BUNDLE_9 }}
          COOKIES_BUNDLE_10: ${{ secrets.COOKIES_BUNDLE_10 }}
        run: |
          ARGS="--limit=${{ inputs.limit }} --offset=${{ inputs.offset }}"
          if [ -n "${{ inputs.show }}" ]; then
            ARGS="$ARGS --show=${{ inputs.show }}"
          fi
          if [ -n "${{ inputs.domains }}" ]; then
            ARGS="$ARGS --domains=${{ inputs.domains }}"
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ "${{ inputs.free_only }}" = "true" ]; then
            ARGS="$ARGS --free-only"
          fi
          echo "Running: node scripts/backfill-review-dates.js $ARGS"
          node scripts/backfill-review-dates.js $ARGS

      - name: Push review texts
        if: ${{ inputs.dry_run != true && inputs.dry_run != 'true' }}
        uses: ./.github/actions/push-review-texts
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
          message: 'data: Backfill publishDate from HTML metadata'

      - name: Trigger rebuild
        if: ${{ inputs.dry_run != true && inputs.dry_run != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run "Rebuild Reviews Data" -f reason="Post date backfill"

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: 'Backfill Review Dates Failed'
          severity: 'low'
          discord_webhook: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
