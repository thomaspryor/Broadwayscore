name: Update Deploy Watermark

on:
  workflow_dispatch: {}

jobs:
  update-watermark:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: deploy-watermark-update
      cancel-in-progress: true  # only latest watermark matters
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Checkout core data
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Update watermark
        run: |
          node scripts/pre-deploy-check.js > /dev/null 2>&1 || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/audit/deploy-watermark.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No changes to watermark"
          else
            git commit -m "chore: Update deploy watermark [skip ci]"
            bash scripts/lib/push-with-retry.sh 3 main
          fi

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: 'Deploy Watermark Update Failed'
          discord_webhook: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
