name: Collect WE/OB Review Texts

# Dedicated daily collection for West End and Off-Broadway markets.
# The main collect-review-texts.yml processes 150/batch across all markets,
# starving WE/OB reviews behind the 18K+ Broadway backlog.
# This workflow uses MARKET_FILTER to collect only one market per run.
# Chains up to 2 additional runs to clear backlogs (450 reviews max/market/day).

on:
  schedule:
    # Daily at 8 AM UTC — WE on even days, OB on odd days
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      market:
        description: 'Market to collect (west-end or off-broadway)'
        required: true
        default: 'west-end'
        type: choice
        options:
          - west-end
          - off-broadway
      max_reviews:
        description: 'Max reviews per run (0 = unlimited)'
        required: false
        default: '150'
      remaining_chains:
        description: 'Remaining chain dispatches (0 = no chaining)'
        required: false
        default: '0'

concurrency:
  group: collect-we-ob-${{ inputs.market || 'scheduled' }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      actions: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}

      - uses: ./.github/actions/checkout-review-texts
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Setup Playwright
        uses: ./.github/actions/setup-playwright

      - name: Create directories
        run: |
          mkdir -p data/archives/reviews
          mkdir -p data/audit/validation
          mkdir -p data/collection-state

      - name: Clear progress state
        run: rm -f data/collection-state/progress.json

      - name: Determine market
        id: market
        run: |
          if [ "${{ github.event_name }}" == "schedule" ]; then
            DAY_OF_MONTH=$(date -u +%d)
            if [ $((DAY_OF_MONTH % 2)) -eq 0 ]; then
              echo "market=west-end" >> $GITHUB_OUTPUT
              echo "Scheduled: West End collection (even day)"
            else
              echo "market=off-broadway" >> $GITHUB_OUTPUT
              echo "Scheduled: Off-Broadway collection (odd day)"
            fi
          else
            echo "market=${{ inputs.market }}" >> $GITHUB_OUTPUT
            echo "Manual: ${{ inputs.market }} collection"
          fi

      - name: Configure git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Collect review texts (${{ steps.market.outputs.market }})
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FT_EMAIL: ${{ secrets.FT_EMAIL }}
          FT_PASSWORD: ${{ secrets.FT_PASSWORD }}
          COOKIES_BUNDLE_1: ${{ secrets.COOKIES_BUNDLE_1 }}
          COOKIES_BUNDLE_2: ${{ secrets.COOKIES_BUNDLE_2 }}
          COOKIES_BUNDLE_3: ${{ secrets.COOKIES_BUNDLE_3 }}
          COOKIES_BUNDLE_4: ${{ secrets.COOKIES_BUNDLE_4 }}
          COOKIES_BUNDLE_5: ${{ secrets.COOKIES_BUNDLE_5 }}
          COOKIES_BUNDLE_6: ${{ secrets.COOKIES_BUNDLE_6 }}
          COOKIES_BUNDLE_7: ${{ secrets.COOKIES_BUNDLE_7 }}
          COOKIES_BUNDLE_8: ${{ secrets.COOKIES_BUNDLE_8 }}
          COOKIES_BUNDLE_9: ${{ secrets.COOKIES_BUNDLE_9 }}
          COOKIES_BUNDLE_10: ${{ secrets.COOKIES_BUNDLE_10 }}
          COOKIES_BUNDLE_11: ${{ secrets.COOKIES_BUNDLE_11 }}
          SCRAPINGBEE_API_KEY: ${{ secrets.SCRAPINGBEE_API_KEY }}
          BRIGHTDATA_TOKEN: ${{ secrets.BRIGHTDATA_TOKEN }}
          BRIGHTDATA_ZONE: mcp_unlocker
          BROWSERBASE_API_KEY: ${{ secrets.BROWSERBASE_API_KEY }}
          BROWSERBASE_PROJECT_ID: ${{ secrets.BROWSERBASE_PROJECT_ID }}
          BROWSERBASE_ENABLED: 'true'
          BROWSERBASE_MAX_SESSIONS_PER_RUN: '10'
          BATCH_SIZE: '10'
          MAX_REVIEWS: ${{ inputs.max_reviews || '150' }}
          MARKET_FILTER: ${{ steps.market.outputs.market }}
          RETRY_FAILED: 'true'
          ARCHIVE_FIRST: 'true'
          REVIEW_TEXTS_TOKEN: ${{ secrets.REVIEW_TEXTS_TOKEN }}
        run: node scripts/collect-review-texts.js

      - name: Validate data
        if: always()
        run: node scripts/validate-data.js

      - name: Push review-texts
        if: always()
        uses: ./.github/actions/push-review-texts
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
          message: "data: Collect ${{ steps.market.outputs.market }} review texts"

      - name: Count remaining uncollected
        if: always()
        id: remaining
        run: |
          MARKET="${{ steps.market.outputs.market }}"
          REMAINING=$(node -e "
            const fs = require('fs'), path = require('path');
            const base = 'data/review-texts';
            const dirs = fs.readdirSync(base).filter(d => d.includes('$MARKET') && fs.statSync(path.join(base, d)).isDirectory());
            let n = 0;
            for (const d of dirs) {
              for (const f of fs.readdirSync(path.join(base, d)).filter(f => f.endsWith('.json') && f !== 'failed-fetches.json')) {
                try {
                  const r = JSON.parse(fs.readFileSync(path.join(base, d, f), 'utf8'));
                  if (r.assignedScore || r.duplicateOf || r.wrongShow || r.wrongProduction ||
                      r.wrongAttribution || r.contentTier === 'invalid' || r.isRoundupArticle ||
                      r.rejectionReason) continue;
                  const hasText = r.fullText || r.bwwExcerpt || r.dtliExcerpt || r.showScoreExcerpt ||
                                  r.nycTheatreExcerpt || r.lboRoundupExcerpt;
                  if (!hasText && r.url && r.url.startsWith('http')) n++;
                } catch {}
              }
            }
            console.log(n);
          ")
          echo "remaining=$REMAINING" >> $GITHUB_OUTPUT
          echo "$MARKET reviews still needing collection: $REMAINING"

      - name: Chain next collection batch
        if: always() && fromJSON(steps.remaining.outputs.remaining) > 5
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MARKET="${{ steps.market.outputs.market }}"
          # Scheduled runs get 2 chains (450 total). Manual runs chain if remaining_chains > 0.
          if [ "${{ github.event_name }}" == "schedule" ]; then
            CHAINS_LEFT=2
          else
            CHAINS_LEFT="${{ inputs.remaining_chains }}"
            CHAINS_LEFT="${CHAINS_LEFT:-0}"
          fi

          if [ "$CHAINS_LEFT" -le 0 ] 2>/dev/null; then
            echo "No remaining chains. Done."
            exit 0
          fi

          NEXT_CHAINS=$((CHAINS_LEFT - 1))
          echo "Dispatching chain ($NEXT_CHAINS chains remaining after this)..."

          gh workflow run collect-we-ob-reviews.yml \
            -f market="$MARKET" \
            -f max_reviews=150 \
            -f remaining_chains="$NEXT_CHAINS"

      - name: Trigger rebuild
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run rebuild-reviews.yml \
            -f reason="Post ${{ steps.market.outputs.market }} collection"

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: 'WE/OB Collection Failed (${{ steps.market.outputs.market }})'
          severity: 'low'
          discord_webhook: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
