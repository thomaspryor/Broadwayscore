name: Monthly Scoring Audit

on:
  schedule:
    - cron: '0 5 1 * *'  # 1st of month, 5 AM UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: write

# Serialize with every other reviews.json writer. This workflow rebuilds
# reviews.json and commits shared audit files; it had no concurrency group
# because it had been failing since 2026-03-01 and was effectively dead. Adding
# the review-texts checkout makes it a LIVE writer again, so it must join the
# same lane as rebuild-reviews.yml / rebuild-fast.yml or it can clobber a
# concurrent rebuild.
concurrency:
  group: rebuild-reviews
  cancel-in-progress: false

jobs:
  scoring-audit:
    runs-on: ubuntu-latest
    # 30, not 15: all 6 prior runs failed in 45-100s (missing review-texts
    # checkout), so the 15min budget was never actually exercised against a real
    # rebuild. The comparable rebuild-reviews.yml allots 30min and takes 6-12min
    # WITHOUT this workflow's cold-cache `npm ci` on a monthly cron.
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}


      - name: Checkout core data
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}

      # rebuild-all-reviews.js reads data/review-texts/ (the source of truth) to
      # regenerate reviews.json. This was the ONLY workflow invoking that script
      # without checking review-texts out, so the rebuild step failed on every
      # scheduled run since 2026-03-01 (5 consecutive failures) and
      # data/audit/scoring-audit.json is frozen at generatedAt 2026-02-01 /
      # totalReviews 2299, against ~19,248 reviews today.
      - name: Checkout review texts
        uses: ./.github/actions/checkout-review-texts
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Rebuild reviews.json
        run: node scripts/rebuild-all-reviews.js

      - name: Generate scoring audit
        id: audit
        run: |
          node scripts/generate-scoring-audit.js || true
          echo "flagged=$(cat data/audit/scoring-audit.json | jq '.flags.total')" >> $GITHUB_OUTPUT
          echo "flag_pct=$(cat data/audit/scoring-audit.json | jq '.flagPctOfTotal')" >> $GITHUB_OUTPUT
          echo "total=$(cat data/audit/scoring-audit.json | jq '.summary.totalReviews')" >> $GITHUB_OUTPUT
          echo "high_delta=$(cat data/audit/scoring-audit.json | jq '.scoringIssues.highDeltaCount')" >> $GITHUB_OUTPUT
          echo "exceeds=$(cat data/audit/scoring-audit.json | jq '.exceedsThreshold')" >> $GITHUB_OUTPUT

      - name: Commit audit data
        if: always()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          # rebuild-all-reviews.js also rewrites TRACKED public files
          # (public/data/admin/locks.json, public/data/admin/critic-coverage.json).
          # This workflow is an AUDIT — rebuild-reviews.yml owns publishing — so
          # discard them. Leaving them dirty breaks the push: push-with-retry.sh
          # runs `git rebase -X theirs` with no --autostash, and git refuses to
          # rebase with unstaged tracked changes. That failure mode only became
          # reachable once the review-texts checkout made the rebuild succeed.
          git checkout -- public/data 2>/dev/null || true
          git add data/audit/scoring-audit.json data/audit/scoring-audit.md data/audit/scoring-audit-history.json data/audit/needs-human-review.json data/audit/rebuild-score-drift.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "audit: Monthly scoring audit $(date +%Y-%m-%d)"
            bash scripts/lib/push-with-retry.sh
          fi

      - name: Create GitHub issue with audit digest
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('data/audit/scoring-audit.md', 'utf8');
            const flagged = parseInt('${{ steps.audit.outputs.flagged }}') || 0;
            const exceeds = '${{ steps.audit.outputs.exceeds }}' === 'true';

            const title = `Scoring Audit — ${new Date().toISOString().split('T')[0]}${exceeds ? ' ⚠️ THRESHOLD EXCEEDED' : ''}`;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: report,
              labels: ['scoring-audit', 'automated']
            });

      - name: Fail if threshold exceeded
        if: steps.audit.outputs.exceeds == 'true'
        run: |
          echo "❌ AUDIT THRESHOLD EXCEEDED: ${{ steps.audit.outputs.flag_pct }}% flagged (threshold: 10%)"
          exit 1

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: 'Monthly Scoring Audit Failed'
          discord_webhook: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
