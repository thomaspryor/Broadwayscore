name: Monthly Scoring Audit

on:
  schedule:
    - cron: '0 5 1 * *'  # 1st of month, 5 AM UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: write

# Serialize with every other reviews.json writer. This workflow rebuilds
# reviews.json and commits shared audit files; it had no concurrency group
# because it had been failing since 2026-03-01 and was effectively dead. Adding
# the review-texts checkout makes it a LIVE writer again, so it must join the
# same lane as rebuild-reviews.yml / rebuild-fast.yml or it can clobber a
# concurrent rebuild.
concurrency:
  group: rebuild-reviews
  cancel-in-progress: false

jobs:
  scoring-audit:
    runs-on: ubuntu-latest
    # 30, not 15: all 6 prior runs failed in 45-100s (missing review-texts
    # checkout), so the 15min budget was never actually exercised against a real
    # rebuild. The comparable rebuild-reviews.yml allots 30min and takes 6-12min
    # WITHOUT this workflow's cold-cache `npm ci` on a monthly cron.
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}


      - name: Checkout core data
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}

      # rebuild-all-reviews.js reads data/review-texts/ (the source of truth) to
      # regenerate reviews.json. This was the ONLY workflow invoking that script
      # without checking review-texts out, so the rebuild step failed on every
      # scheduled run since 2026-03-01 (5 consecutive failures) and
      # data/audit/scoring-audit.json is frozen at generatedAt 2026-02-01 /
      # totalReviews 2299, against ~19,248 reviews today.
      - name: Checkout review texts
        uses: ./.github/actions/checkout-review-texts
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Stale-checkout race guard, pre-rebuild (BRO-3162): sync review-texts
      # files pushed by other jobs since this job's checkout (never files
      # this job wrote), and record which shows drifted.
      - name: Sync review-texts drift before rebuild
        uses: ./.github/actions/sync-review-texts-drift

      - name: Rebuild reviews.json
        id: rebuild_reviews
        run: node scripts/rebuild-all-reviews.js

      # Stale-checkout race guard, post-rebuild (BRO-3162): advisory first
      # (CLAUDE.md rule 19), so it flags a dropped show without blocking.
      - name: Verify no scoreable review vanished during checkout drift
        if: ${{ !cancelled() && steps.rebuild_reviews.outcome == 'success' }}
        continue-on-error: true
        # lint-allow-swallow: report-only by design (rule 19); writes nothing tracked, failure = ::error annotation
        run: >-
          node scripts/check-rebuild-staleness-advisory.js
          --shows-file=/tmp/stale-checkout-shows.txt

      # Stale-checkout race guard, cleanup (BRO-3162): return the synced
      # upstream files to the checkout state so push-review-texts' pull
      # --rebase --autostash never replays them over newer upstream edits.
      - name: Restore review-texts drift sync
        if: always()
        continue-on-error: true
        uses: ./.github/actions/sync-review-texts-drift
        with:
          mode: restore

      - name: Generate scoring audit
        id: audit
        run: |
          node scripts/generate-scoring-audit.js || true
          echo "flagged=$(cat data/audit/scoring-audit.json | jq '.flags.total')" >> $GITHUB_OUTPUT
          echo "flag_pct=$(cat data/audit/scoring-audit.json | jq '.flagPctOfTotal')" >> $GITHUB_OUTPUT
          echo "total=$(cat data/audit/scoring-audit.json | jq '.summary.totalReviews')" >> $GITHUB_OUTPUT
          echo "high_delta=$(cat data/audit/scoring-audit.json | jq '.scoringIssues.highDeltaCount')" >> $GITHUB_OUTPUT
          echo "exceeds=$(cat data/audit/scoring-audit.json | jq '.exceedsThreshold')" >> $GITHUB_OUTPUT

      - name: Commit audit data
        if: always()
        env:
          # BRO-4405: this step also commits the rebuild's auto-registered
          # outlets, and data/outlet-registry.json is multi-writer; the flag
          # makes push-with-retry.sh run the keyed merge instead of ours-wins.
          PUSH_RECONCILE_MERGED_JSON: '1'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          # rebuild-all-reviews.js also rewrites TRACKED public files
          # (public/data/admin/locks.json, public/data/admin/critic-coverage.json).
          # This workflow is an AUDIT — rebuild-reviews.yml owns publishing — so
          # discard them. Leaving them dirty breaks the push: push-with-retry.sh
          # runs `git rebase -X theirs` with no --autostash, and git refuses to
          # rebase with unstaged tracked changes. That failure mode only became
          # reachable once the review-texts checkout made the rebuild succeed.
          git checkout -- public/data 2>/dev/null || true
          # BRO-5962: scoring-audit.md is gitignored (/data/audit/*.md), so a plain `git add`
          # of it exited 1 on every run since March. It is staged on its own with -f; the rest
          # go through git-add-existing.sh, which stages each path alone.
          git add -f data/audit/scoring-audit.md
          bash scripts/lib/git-add-existing.sh data/audit/scoring-audit.json data/audit/scoring-audit-history.json data/audit/needs-human-review.json data/audit/rebuild-score-drift.json
          # BRO-4405: the rebuild above auto-registers / stages outlets; without
          # this they were written to the runner disk and discarded.
          for f in data/outlet-registry.json data/audit/outlet-registry-staging.json; do
            if node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" 2>/dev/null; then
              git add -- "$f" 2>/dev/null || true
            else
              echo "::warning::$f missing or not valid JSON, leaving it uncommitted"
            fi
          done
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "audit: Monthly scoring audit $(date +%Y-%m-%d)"
            bash scripts/lib/push-with-retry.sh
          fi

      - name: Create GitHub issue with audit digest
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('data/audit/scoring-audit.md', 'utf8');
            const flagged = parseInt('${{ steps.audit.outputs.flagged }}') || 0;
            const exceeds = '${{ steps.audit.outputs.exceeds }}' === 'true';

            const title = `Scoring Audit — ${new Date().toISOString().split('T')[0]}${exceeds ? ' ⚠️ THRESHOLD EXCEEDED' : ''}`;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: report,
              labels: ['scoring-audit', 'automated']
            });

      - name: Fail if threshold exceeded
        if: steps.audit.outputs.exceeds == 'true'
        run: |
          # BRO-5962: the audit's output is the GitHub issue above plus the committed JSON.
          # A breach is a finding for the owner, not a broken job, so it warns instead of
          # failing (a monthly job red on every run is invisible to the owner).
          echo "::warning::AUDIT THRESHOLD EXCEEDED: ${{ steps.audit.outputs.flag_pct }}% flagged (threshold: 10%). See the scoring-audit issue."
          exit 0

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: 'Monthly Scoring Audit Failed'
          discord_webhook: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
