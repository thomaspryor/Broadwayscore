name: Archive Aggregator Pages

on:
  workflow_dispatch:
    inputs:
      show_ids:
        description: 'Comma-separated show IDs to archive (leave empty for all shows)'
        required: false
        default: ''
      bright_data_zone:
        description: 'Bright Data zone name (optional, defaults to web_unlocker2)'
        required: false
        default: 'web_unlocker2'

# BRO-934: per-workflow group: stops overlapping runs of the same job racing on the private-repo push. Not a shared class group (GH pending-queue depth is 1; see rebuild-fast.yml).
concurrency:
  group: archive-aggregator-pages
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  archive-pages:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5


      - name: Checkout core data
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
      - name: Checkout aggregator-archive (private repo)
        uses: ./.github/actions/checkout-aggregator-archive
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Archive aggregator pages
        env:
          SCRAPINGBEE_API_KEY: ${{ secrets.SCRAPINGBEE_API_KEY }}
          SCRAPINGDOG_API_KEY: ${{ secrets.SCRAPINGDOG_API_KEY }}
          SCRAPER_USE_SCRAPINGDOG: '1'
          BRIGHTDATA_TOKEN: ${{ secrets.BRIGHTDATA_TOKEN }}
          BRIGHTDATA_ZONE: ${{ github.event.inputs.bright_data_zone }}
          SHOW_IDS: ${{ github.event.inputs.show_ids }}
        run: |
          node << 'EOF'
          const fs = require('fs');

          const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

          // BRO-3606: one fetchPage() call replaces the inline axios ScrapingBee tier
          // and the Bright Data tier; scraper.js owns the fallback chain, caps and
          // spend telemetry.
          const { fetchArchivePage } = require('./scripts/lib/archive-aggregator.js');

          async function archivePage(showId, aggregator, url, config) {
            try {
              console.log(`Fetching ${aggregator} for ${showId}...`);
              console.log(`  URL: ${url}`);

              const { html, method } = await fetchArchivePage(url);
              console.log(`  ✓ fetched via ${method}`);

              const dir = `data/aggregator-archive/${aggregator}`;
              if (!fs.existsSync(dir)) {
                fs.mkdirSync(dir, { recursive: true });
              }

              const timestamp = new Date().toISOString();
              const metadata = `<!-- Archived: ${timestamp} -->\n<!-- Source: ${url} -->\n<!-- Show ID: ${showId} -->\n<!-- Method: ${method} -->\n\n`;
              const content = metadata + html;

              const filepath = `${dir}/${showId}.html`;
              fs.writeFileSync(filepath, content);
              console.log(`✓ Saved ${filepath} (via ${method})`);

              // Rate limiting: wait 2 seconds between requests
              await sleep(2000);
              return true;
            } catch (error) {
              console.error(`✗ Failed to archive ${aggregator}/${showId}: ${error.message}`);
              return false;
            }
          }

          function generateSlug(show) {
            // Try to use existing slug, or derive from ID/title
            if (show.slug) return show.slug;

            // Remove year suffix and convert to slug format
            return show.id
              .replace(/-(bway-)?202[0-9]$/, '')
              .replace(/_/g, '-');
          }

          async function main() {
            const config = {
              scrapingBeeKey: process.env.SCRAPINGBEE_API_KEY,
              brightDataKey: process.env.BRIGHTDATA_TOKEN,
              brightDataZone: process.env.BRIGHTDATA_ZONE || 'web_unlocker2',
            };

            // Check that at least one scraping service is configured
            const hasScrapingBee = config.scrapingBeeKey && config.scrapingBeeKey.trim() !== '';
            const hasBrightData = config.brightDataKey;

            if (!hasScrapingBee && !hasBrightData) {
              console.error('❌ No scraping service configured. Set either:');
              console.error('   - SCRAPINGBEE_API_KEY, or');
              console.error('   - BRIGHTDATA_TOKEN');
              process.exit(1);
            }

            console.log('🔧 Configured services:');
            if (hasScrapingBee) console.log('   ✓ ScrapingBee (primary)');
            if (hasBrightData) console.log(`   ✓ Bright Data (fallback, zone: ${config.brightDataZone})`);

            const showsData = JSON.parse(fs.readFileSync('data/shows.json', 'utf8'));
            const shows = showsData.shows;

            let showsToProcess = shows;
            if (process.env.SHOW_IDS) {
              const selectedIds = process.env.SHOW_IDS.split(',').map(s => s.trim()).filter(Boolean);
              if (selectedIds.length > 0) {
                showsToProcess = shows.filter(show => selectedIds.includes(show.id));
                console.log(`📋 Processing ${showsToProcess.length} selected shows`);
              }
            }

            console.log(`\n📚 Archiving pages for ${showsToProcess.length} shows...\n`);

            let stats = {
              dtli: { success: 0, fail: 0 },
              showScore: { success: 0, fail: 0 },
              bww: { success: 0, fail: 0 }
            };

            for (const show of showsToProcess) {
              console.log(`\n${'='.repeat(60)}`);
              console.log(`${show.title} (${show.id})`);
              console.log('='.repeat(60));

              const slug = generateSlug(show);

              // 1. DTLI: didtheylikeit.com/shows/{slug}/
              const dtliUrl = `https://didtheylikeit.com/shows/${slug}/`;
              const dtliSuccess = await archivePage(show.id, 'dtli', dtliUrl, config);
              if (dtliSuccess) stats.dtli.success++; else stats.dtli.fail++;

              // 2. Show-Score: show-score.com/broadway-shows/{slug}
              const showScoreUrl = `https://www.show-score.com/broadway-shows/${slug}`;
              const showScoreSuccess = await archivePage(show.id, 'show-score', showScoreUrl, config);
              if (showScoreSuccess) stats.showScore.success++; else stats.showScore.fail++;

              // 3. BroadwayWorld: Search for show reviews
              const bwwSearchQuery = encodeURIComponent(`${show.title} review roundup`);
              const bwwUrl = `https://www.broadwayworld.com/search/?q=${bwwSearchQuery}`;
              const bwwSuccess = await archivePage(show.id, 'bww-roundups', bwwUrl, config);
              if (bwwSuccess) stats.bww.success++; else stats.bww.fail++;
            }

            console.log(`\n${'='.repeat(60)}`);
            console.log('📊 SUMMARY');
            console.log('='.repeat(60));
            console.log(`DTLI:       ✓ ${stats.dtli.success}  ✗ ${stats.dtli.fail}`);
            console.log(`Show-Score: ✓ ${stats.showScore.success}  ✗ ${stats.showScore.fail}`);
            console.log(`BWW:        ✓ ${stats.bww.success}  ✗ ${stats.bww.fail}`);
            console.log(`TOTAL:      ✓ ${stats.dtli.success + stats.showScore.success + stats.bww.success}  ✗ ${stats.dtli.fail + stats.showScore.fail + stats.bww.fail}`);
          }

          main().catch(error => {
            console.error('💥 Fatal error:', error);
            process.exit(1);
          });
          EOF

      - name: Push aggregator-archive to private repo
        if: always()
        uses: ./.github/actions/push-aggregator-archive
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
          message: "data: Archive aggregator pages"
      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: 'Archive Aggregator Pages Failed'
          severity: 'warning'
          discord_webhook: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
