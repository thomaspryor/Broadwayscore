name: Commercial RSS Poll

# Hourly trade-press RSS poll for recoupment announcements. Shrinks detection
# latency from ~36h (Friday SERP → Saturday apply → Sunday newsletter) to ~1h.
# Apply step gates on the same auto-apply contract as the Friday pipeline:
# detectedBy in allowlist + confidence==='high' + sourceHost in
# TRUSTED_RECOUPMENT_HOSTS (scripts/lib/trusted-recoupment-domains.js).

on:
  schedule:
    - cron: '0 * * * *'  # every hour, on the hour
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (poll + classify, no writes)'
        required: false
        type: boolean
        default: false
      window_hours:
        description: 'Reject RSS items with pubDate older than this many hours'
        required: false
        type: number
        default: 24
      feed:
        description: 'Comma-separated feed outletId filter (e.g. variety,deadline)'
        required: false
        type: string
        default: ''

concurrency:
  group: commercial-data-write
  cancel-in-progress: false

jobs:
  poll-and-apply:
    runs-on: ubuntu-latest
    # Polling 2 feeds + up to 20 LLM calls + fetchPage per match. Budget headroom.
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout core data
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}

      - uses: ./.github/actions/setup-node
        with:
          configure-git: 'true'

      - name: Poll trade-press RSS
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Pre-mortem: scraper modules require BD + SB even on cache-only paths
          # (scripts/lib/scraper.js init asserts both present). Pass both.
          BRIGHTDATA_TOKEN: ${{ secrets.BRIGHTDATA_TOKEN }}
          BRIGHTDATA_ZONE: ${{ secrets.BRIGHTDATA_ZONE }}
          SCRAPINGBEE_API_KEY: ${{ secrets.SCRAPINGBEE_API_KEY }}
          SCRAPINGDOG_API_KEY: ${{ secrets.SCRAPINGDOG_API_KEY }}
          SCRAPER_USE_SCRAPINGDOG: '1'
        run: |
          ARGS="--window-hours=${{ inputs.window_hours || '24' }}"
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ -n "${{ inputs.feed }}" ]; then ARGS="$ARGS --feed=${{ inputs.feed }}"; fi
          set -o pipefail
          node scripts/poll-trade-press-rss.js $ARGS

      - name: Auto-apply high-confidence recoupment claims
        if: inputs.dry_run != true
        run: |
          if [ -f data/commercial-pending-review.json ]; then
            # Reuses the Friday pipeline's auto-apply gate: detectedBy must be
            # in this allowlist AND confidence==='high' AND sourceHost ∈
            # TRUSTED_RECOUPMENT_HOSTS. Other entries fall through to manual review.
            node scripts/apply-commercial-pending.js \
              --all --min-confidence=high \
              --auto-apply-claims-from=rss-poller,recoupment-announcement-scraper
          else
            echo "No pending file — nothing to apply"
          fi

      - name: Clear BD blacklist of GitHub runner IPs
        # Bright Data's unknown-IP detector auto-blacklists rotating GitHub
        # Actions runner ranges on the zone, silently degrading the scraping
        # fallback chain (2026-07-27: 158.23.190.0/24 on web_unlocker2).
        # Control-plane API only (3 calls, no page fetches) — hosted here
        # because this workflow is the hourly cron that already carries the
        # BD token. Runs even when the poll fails; must run BEFORE the commit
        # step so digest-queue writes for genuinely unknown IPs persist.
        # continue-on-error: a BD-API blip or /meta rate-limit must not red
        # this CRITICAL data cron or fire "Commercial RSS Poll Failed";
        # persistent BD auth breakage still surfaces via check-secrets-health.
        # hygiene-run-budget-ok: check-bd-blacklist.js makes a handful of
        # bounded control-plane API calls (2 reads + one delete per blacklist
        # entry + 1 verify), each with an AbortSignal timeout — no per-item
        # page-fetch loop to budget. (poll-trade-press-rss.js already wires
        # run-budget; this exemption is for the blacklist step's FP only.)
        if: always() && inputs.dry_run != true
        continue-on-error: true
        env:
          BRIGHTDATA_TOKEN: ${{ secrets.BRIGHTDATA_TOKEN }}
          BRIGHTDATA_ZONE: ${{ secrets.BRIGHTDATA_ZONE }}
          # Authenticated /meta: unauthenticated is 60 req/hr per source IP,
          # shared with every tenant on the runner's egress IP.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/check-bd-blacklist.js

      - name: Bright Data daily circuit-breaker check
        # Scraping cost v3 S2-T2 (card 3b1637c5). Asks BD's billing API how many
        # requests each zone billed today and writes/clears
        # data/audit/bd-circuit-breaker.json, which scripts/lib/brightdata-caps.js
        # consults inside the two BD chokepoints. Hosted here for the same reason
        # as the blacklist step above: this is the hourly cron that already
        # carries the BD token, and the plan forbids adding a new cron.
        # Must run BEFORE the commit step so the state file (and any digest-queue
        # alert) reaches main within the hour — a breaker that never lands on
        # main is a breaker no other workflow can see.
        # continue-on-error: a billing-API blip must not red this CRITICAL data
        # cron. The script already fails open on unknown billing, so a skipped
        # run means "no new decision", never "cap lifted".
        # hygiene-run-budget-ok: 2 bounded billing API reads (one per zone), each
        # with an AbortSignal timeout — no per-item fetch loop to budget.
        if: always() && inputs.dry_run != true
        continue-on-error: true
        env:
          BRIGHTDATA_TOKEN: ${{ secrets.BRIGHTDATA_TOKEN }}
          BRIGHTDATA_ZONE: ${{ secrets.BRIGHTDATA_ZONE }}
          BRIGHTDATA_SERP_ZONE: ${{ secrets.BRIGHTDATA_SERP_ZONE }}
        run: node scripts/check-bd-breaker.js

      - name: ScrapingDog daily circuit-breaker check
        # Card #1252 — same rationale as the Bright Data step above: hosted
        # here because this is the hourly cron that already carries scraping
        # secrets, and the plan (mirroring S2-T2) forbids adding a new cron.
        # Must run BEFORE the commit step so the state file (and any
        # digest-queue alert) reaches main within the hour.
        # continue-on-error: an /account API blip must not red this CRITICAL
        # data cron. The script fails open on unknown billing (leaves any
        # existing trip in place), so a skipped run means "no new decision".
        # hygiene-run-budget-ok: 1 bounded /account API read with an
        # AbortSignal timeout (provider-billing.js) — no per-item fetch loop.
        if: always() && inputs.dry_run != true
        continue-on-error: true
        env:
          SCRAPINGDOG_API_KEY: ${{ secrets.SCRAPINGDOG_API_KEY }}
        run: node scripts/check-sd-breaker.js

      - name: Commit data changes
        if: always() && inputs.dry_run != true
        # Task #574: commits commercial-pending-review.json (union-merged
        # managed file) — see push-with-retry.sh's reconcile_merged_json().
        env:
          PUSH_RECONCILE_MERGED_JSON: '1'
          # BRO-123: same root cause as commercial-friday.yml — MANAGED-file
          # push disqualified from the Git Data API fallback, default 240s
          # deadline self-aborting after ~2 real cycles under main's commit
          # churn. This job runs hourly with only a 15min timeout (poll+LLM
          # steps use ~4min), so 420s (not the 600s used elsewhere) to leave
          # real buffer against the job timeout.
          PUSH_DEADLINE_SEC: '420'
        run: |
          bash scripts/lib/git-add-existing.sh data/commercial-pending-review.json data/commercial-rss-state.json
          bash scripts/lib/stage-data-changes.sh
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "data: hourly poll — recoupment scan + BD breaker state

          Co-Authored-By: github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
            bash scripts/lib/push-with-retry.sh
          fi

      - name: Push core data to private repo
        if: always() && inputs.dry_run != true
        uses: ./.github/actions/push-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
          message: 'data: RSS poller commercial update'

      - name: Dispatch deploy
        if: always() && inputs.dry_run != true
        uses: ./.github/actions/dispatch-deploy

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: 'Commercial RSS Poll Failed'
          severity: 'warning'
