name: Opening Night Express Retry Check

# Same-night retry backstop for card #1889 (Opening Night Express fires too
# early for evening openings and never retries when it finds 0 real reviews).
#
# opening-night-express.yml's "Evaluate full-text coverage for same-night
# retry" step queues an entry in data/audit/express-retry-queue.json when its
# own run finds coverage too thin to trust. This workflow is the other half:
# hourly, it checks that queue for entries whose dueAt has passed and
# dispatches opening-night-express.yml again (is_retry=true) for each one —
# skipping the dispatch (but still marking attempted) if isShowCoverageComplete()
# says some other path (the hourly poller, audit-aggregator-gap, the local
# opening-night monitor) already closed the gap.
#
# A failed dispatch call leaves its entry un-attempted so the NEXT hourly tick
# retries the dispatch itself — never silently swallowed.

on:
  schedule:
    # :50 — distinct offset from the other hourly opening-night crons
    # (opening-night-checklist.yml :17, opening-night-completeness-check.yml
    # every 15 min) so they don't all contend for runner minutes at once.
    - cron: '50 * * * *'
  workflow_dispatch:
    inputs:
      redispatched:
        # redispatch-after-hours: 3  (BRO-3867: the paging band is now measured-wide; re-dispatch a dropped tick at the old 3h)
        # BRO-5152: set by scripts/cron-redispatch.js when GitHub dropped the scheduled run.
        # Nothing in this workflow branches on the trigger, so it runs exactly like the
        # cron.
        description: 'Internal: re-dispatch of a dropped scheduled run (behaves like the cron)'
        required: false
        default: 'false'
        type: string

concurrency:
  group: opening-night-express-retry-check
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  dispatch-due-retries:
    runs-on: ubuntu-latest
    # 8->10 (BRO-6620): the lease sync (2 min) and variable read (1 min) steps added before dispatch count toward the push-retry budget.
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main

      - name: Checkout core data
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}

      - uses: ./.github/actions/setup-node

      # BRO-6620: LANE_ONLY_MARKETS holds a press-night retry while the opening-night lane holds the show's lease.
      # Both fail toward publishing: no lease file or an unread variable keeps the dispatch on.
      - name: Opening-night lease sync (BRO-4786)
        continue-on-error: true
        timeout-minutes: 2
        uses: ./.github/actions/opening-night-lease-sync
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }} # BRO-6672: lets a failed sync read LANE_ONLY_MARKETS

      - name: Read lane-only variables (BRO-6620)
        continue-on-error: true
        timeout-minutes: 1
        uses: ./.github/actions/read-lane-only-vars
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}

      - name: Dispatch due retries
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.REVIEW_TEXTS_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/express-retry-queue.js dispatch-due

      - name: Check for changes
        id: changes
        run: |
          # BRO-3671: express-retry-queue.js calls routeAlert()/resolveCondition()
          # — without watching the alert ledger + dispatch-attempts log here too,
          # a run where ONLY the alert cooldown state changed (no queue change)
          # would skip the commit step entirely and lose that state.
          if git status --porcelain data/audit/express-retry-queue.json data/audit/alert-ledger.json data/audit/alert-digest-queue.json data/audit/alert-router-attempts.jsonl 2>/dev/null | grep -q .; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/audit/express-retry-queue.json
          # alert-ledger.json (routeAlert()'s cooldown), alert-digest-
          # queue.json (express-retry-queue.js:123 uses disposition:'digest'),
          # and alert-router-attempts.jsonl (logDispatchAttempt()'s rewritten-
          # every-attempt tracked file — unstaged, it makes a rebase refuse
          # pre-flight and forces push-with-retry.sh onto its clobber-prone
          # merge path).
          git add data/audit/alert-ledger.json 2>/dev/null || true
          git add data/audit/alert-digest-queue.json 2>/dev/null || true
          git add data/audit/alert-router-attempts.jsonl 2>/dev/null || true
          git commit -m "chore: Opening Night Express retry-check — dispatch due retries

          Co-Authored-By: github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
          bash scripts/lib/push-with-retry.sh

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: 'Opening Night Express Retry Check Failed'
          severity: 'warning'
