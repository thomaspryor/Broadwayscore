name: Audit BWW RR Attributions

# Weekly scan of archived BWW Review Roundup pages for authorName mismatches
# at single-author outlets. Feeds CRITIC_CANONICAL_MAP candidates so mis-
# attributions get caught proactively instead of at opening-night scramble.
#
# Background: Rocky Horror 2026-04-23 shipped with BWW-credited "David Finkle,
# Cote Notices" — actual byline is David Cote. This audit surfaces NEW such
# cases so we can add them to scripts/lib/critic-canonicalization.js before
# they affect an opening night.

on:
  schedule:
    # Weekly Saturday 08:00 UTC — after Friday's BWW RR scrape (scrape-bww-reviews.yml)
    - cron: '0 8 * * 6'
  workflow_dispatch:
    inputs:
      since:
        description: 'Only audit archives modified since this date (YYYY-MM-DD). Blank = all.'
        required: false
        default: ''
      show:
        description: 'Audit a single show archive only.'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: audit-bww-rr-attributions-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Checkout core data
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}

      - name: Run BWW RR mismatch audit
        id: audit
        env:
          SINCE: ${{ inputs.since }}
          SHOW: ${{ inputs.show }}
        run: |
          set +e
          FLAGS=""
          if [ -n "$SINCE" ]; then FLAGS="$FLAGS --since=$SINCE"; fi
          if [ -n "$SHOW" ]; then FLAGS="$FLAGS --show=$SHOW"; fi
          echo "Running: node scripts/audit-bww-rr-critic-mismatches.js $FLAGS"
          node scripts/audit-bww-rr-critic-mismatches.js $FLAGS --json > /tmp/audit.json
          RC=$?
          node scripts/audit-bww-rr-critic-mismatches.js $FLAGS | tee /tmp/audit.txt
          # Exit code 2 means "found new candidates" — surface as workflow warning
          # but don't fail the run (non-blocking advisory).
          if [ "$RC" -eq 2 ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          elif [ "$RC" -ne 0 ]; then
            echo "::error::audit script crashed with exit $RC"
            exit 1
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log new candidates
        if: steps.audit.outputs.found == 'true'
        run: |
          COUNT=$(jq '[.findings[] | select(.alreadyInCanonMap == false)] | length' /tmp/audit.json)
          SUMMARY=$(jq -r '.findings[] | select(.alreadyInCanonMap == false) | "• \(.showId) — \(.outletId): \"\(.observedCritic)\" (expected \"\(.expectedCritic)\")"' /tmp/audit.json | head -20)
          echo "BWW RR mis-attribution audit found $COUNT new candidate(s):"
          echo "$SUMMARY"
          echo "Action: review each, add confirmed mis-attributions to scripts/lib/critic-canonicalization.js CRITIC_CANONICAL_MAP."

      - name: Upload audit artifact
        uses: actions/upload-artifact@v5
        with:
          name: bww-rr-audit-${{ github.run_id }}
          path: /tmp/audit.json
          retention-days: 30

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: 'BWW RR Attribution Audit Failed'
          severity: 'warning'
          discord_webhook: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
