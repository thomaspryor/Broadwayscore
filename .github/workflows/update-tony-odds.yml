name: Update Tony Odds Data

on:
  # Tony Awards season: nominations announced ~early May, ceremony ~early June.
  # Cron runs hourly during April–June. All three scrapers self-gate their
  # day-over-day snapshot: only the first run each UTC day captures prevDay
  # values; subsequent runs carry them forward unchanged. Zero extra cost —
  # all three APIs are public REST with no auth or scraping.
  schedule:
    - cron: '0 * * 4-6 *'  # hourly, April–June
  workflow_dispatch:
    inputs:
      season:
        description: 'Tony ceremony year (e.g. 2026)'
        required: false
        type: string
        default: '2026'

# Queue concurrent runs so two scrapers don't race to push the same files.
concurrency:
  group: tony-odds-update
  cancel-in-progress: false

jobs:
  update-odds:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Checkout core data
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Scrape GoldDerby Tony odds
        id: goldderby
        run: |
          SEASON="${{ inputs.season || '2026' }}"
          node scripts/scrape-gold-derby-tonys.js --season=$SEASON 2>&1 \
            || echo "::warning::GoldDerby scrape exited non-zero — check output above"

      - name: Scrape Polymarket Tony odds
        id: polymarket
        run: |
          SEASON="${{ inputs.season || '2026' }}"
          node scripts/scrape-polymarket-tonys.js --season=$SEASON 2>&1 \
            || echo "::warning::Polymarket scrape exited non-zero — check output above"

      - name: Scrape Kalshi Tony odds
        id: kalshi
        run: |
          SEASON="${{ inputs.season || '2026' }}"
          node scripts/scrape-kalshi-tonys.js --season=$SEASON 2>&1 \
            || echo "::warning::Kalshi scrape exited non-zero — check output above"

      - name: Check for changes
        id: changes
        run: |
          GD_CHANGED=false
          PM_CHANGED=false
          KL_CHANGED=false

          if ! git diff --quiet data/tony-win-probabilities.json 2>/dev/null; then
            GD_CHANGED=true
          fi

          if [ -f data/tony-polymarket-odds.json ] && ! git diff --quiet data/tony-polymarket-odds.json 2>/dev/null; then
            PM_CHANGED=true
          elif [ -f data/tony-polymarket-odds.json ] && ! git ls-files --error-unmatch data/tony-polymarket-odds.json 2>/dev/null; then
            PM_CHANGED=true
          fi

          if [ -f data/tony-kalshi-odds.json ] && ! git diff --quiet data/tony-kalshi-odds.json 2>/dev/null; then
            KL_CHANGED=true
          elif [ -f data/tony-kalshi-odds.json ] && ! git ls-files --error-unmatch data/tony-kalshi-odds.json 2>/dev/null; then
            KL_CHANGED=true
          fi

          echo "gd_changed=$GD_CHANGED" >> $GITHUB_OUTPUT
          echo "pm_changed=$PM_CHANGED" >> $GITHUB_OUTPUT
          echo "kl_changed=$KL_CHANGED" >> $GITHUB_OUTPUT

          if [ "$GD_CHANGED" = "true" ] || [ "$PM_CHANGED" = "true" ] || [ "$KL_CHANGED" = "true" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Odds data changed: GD=$GD_CHANGED PM=$PM_CHANGED KL=$KL_CHANGED"
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No changes to odds data"
          fi

      - name: Commit and push
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          GD_CHANGED="${{ steps.changes.outputs.gd_changed }}"
          PM_CHANGED="${{ steps.changes.outputs.pm_changed }}"
          KL_CHANGED="${{ steps.changes.outputs.kl_changed }}"

          [ "$GD_CHANGED" = "true" ] && git add data/tony-win-probabilities.json
          [ "$PM_CHANGED" = "true" ] && git add data/tony-polymarket-odds.json
          [ "$KL_CHANGED" = "true" ] && git add data/tony-kalshi-odds.json

          CHANGED_LIST=""
          [ "$GD_CHANGED" = "true" ] && CHANGED_LIST="${CHANGED_LIST} GoldDerby"
          [ "$PM_CHANGED" = "true" ] && CHANGED_LIST="${CHANGED_LIST} Polymarket"
          [ "$KL_CHANGED" = "true" ] && CHANGED_LIST="${CHANGED_LIST} Kalshi"

          git commit -m "chore: Update Tony odds data —${CHANGED_LIST} [skip ci]"

          bash scripts/lib/push-with-retry.sh \
            || echo "::warning::Push failed after retries — odds update may be lost"

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: 'Update Tony Odds Failed'
          severity: 'warning'

      - name: Summary
        run: |
          echo "## Tony Odds Update" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.changes.outputs.has_changes }}" == "true" ]; then
            echo "✅ Odds data updated" >> $GITHUB_STEP_SUMMARY
            echo "- GoldDerby changed: ${{ steps.changes.outputs.gd_changed }}" >> $GITHUB_STEP_SUMMARY
            echo "- Polymarket changed: ${{ steps.changes.outputs.pm_changed }}" >> $GITHUB_STEP_SUMMARY
            echo "- Kalshi changed: ${{ steps.changes.outputs.kl_changed }}" >> $GITHUB_STEP_SUMMARY
          else
            echo "ℹ️ No changes to odds data" >> $GITHUB_STEP_SUMMARY
            echo "(All scrapers ran — no new data since last run)" >> $GITHUB_STEP_SUMMARY
          fi
