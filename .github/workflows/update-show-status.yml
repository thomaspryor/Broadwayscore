name: Update Shows

on:
  # Run daily at 8 AM UTC (3 AM EST) to catch new show openings quickly
  schedule:
    - cron: '0 8 * * *'
    # Weekly ShowScore status refresh — Wednesdays 6 AM UTC
    - cron: '0 6 * * 3'
  # Allow manual triggering
  workflow_dispatch:
    inputs:
      skip_discovery:
        description: 'Skip new show discovery'
        required: false
        default: 'false'
        type: boolean
      include_showscore:
        description: 'Include ShowScore status refresh (auto-enabled on weekly schedule)'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write
  issues: write
  actions: write

# Share the `shows-json-writer` concurrency group with enrich-off-broadway-dates
# so the two writers don't race on shows.json + data/playbill-urls.json. Without
# this, an overlapping daily run can lost-update either file via the read-mutate-
# write pattern. Caught in /ship-check 2026-04-30 (QA agent P0 finding).
concurrency:
  group: shows-json-writer
  cancel-in-progress: false

jobs:
  update-shows:
    runs-on: ubuntu-latest
    # Raised 25→45→75. Discovery now runs the full ~30 min (its own cap), so the
    # whole job legitimately takes ~44-55 min: even the last SUCCESS (2026-06-24)
    # clocked 44 min, right at the old 45-min wall. From 2026-06-25 it tipped over
    # every run → cancelled at the timeout before the (fast, ~40s) push could run,
    # so discovery results were computed but never committed (stale 5+ days). 75
    # gives headroom over the realistic worst case (discovery 30 + enrichment
    # ~10 + StubHub ~5 + push retries up to ~10 [task #458: "Commit and push
    # changes" step overrides PUSH_DEADLINE_SEC=600, ~3 real conflict-
    # resolution cycles against this workflow's high-churn writes to main]
    # + setup ~5 = ~60, ~15 min headroom to 75).
    timeout-minutes: 75
    outputs:
      new_shows_count: ${{ steps.discover.outputs.new_shows_count }}
      new_shows: ${{ steps.discover.outputs.new_shows }}
      new_slugs: ${{ steps.discover.outputs.new_slugs }}
      opened_count: ${{ steps.status-update.outputs.opened_count }}
      opened_slugs: ${{ steps.status-update.outputs.opened_slugs }}
      we_new_count: ${{ steps.discover.outputs.we_new_count }}
      # Pre-discovery validation status — distinguishes "data was already broken
      # before this run" from "discovery introduced a new error". Consumed by
      # alert-on-failure to write a contextual alert instead of pointing the
      # operator at the Broadway.org scraper for a lottery-rush.json bug.
      pre_validation_status: ${{ steps.pre-validate.outputs.status }}
      validate_outcome: ${{ steps.validate.outcome }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main


      - name: Checkout core data
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
      - name: Checkout aggregator-archive (private repo)
        uses: ./.github/actions/checkout-aggregator-archive
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci || npm install

      - name: Setup Playwright
        uses: ./.github/actions/setup-playwright

      # Step 1: Update existing show statuses
      # ShowScore refresh runs on weekly Wed schedule or manual include_showscore=true
      - name: Update show statuses
        id: status-update
        env:
          BRIGHTDATA_TOKEN: ${{ secrets.BRIGHTDATA_TOKEN }}
          BRIGHTDATA_ZONE: ${{ secrets.BRIGHTDATA_ZONE }}
          SCRAPINGBEE_API_KEY: ${{ secrets.SCRAPINGBEE_API_KEY }}
          SCRAPINGDOG_API_KEY: ${{ secrets.SCRAPINGDOG_API_KEY }}
          SCRAPER_USE_SCRAPINGDOG: '1'
        run: |
          SS_FLAG=""
          # Auto-enable ShowScore on Wednesday schedule (cron index 1)
          if [ "${{ github.event.schedule }}" = "0 6 * * 3" ]; then
            SS_FLAG="--include-showscore"
            echo "Weekly ShowScore refresh enabled (Wednesday schedule)"
          fi
          # Also enable via manual toggle
          if [ "${{ inputs.include_showscore }}" = "true" ]; then
            SS_FLAG="--include-showscore"
            echo "ShowScore refresh enabled (manual toggle)"
          fi
          node scripts/update-show-status.js $SS_FLAG

      # Self-heal shared ibdbUrls BEFORE validation. A revival stub that
      # inherited the original production's ibdbUrl hard-fails validate-data
      # ("Shared ibdbUrl ... null the stale url on the revival entry") and
      # blocked the discovery commit daily 2026-07-03→05 (Sound of Music,
      # A Few Good Men). This applies the validator's prescribed remedy
      # automatically: earliest production keeps the URL, later entries are
      # nulled; enrichment re-adds the revival's own URL later.
      - name: Self-heal shared ibdbUrls
        run: node scripts/fix-shared-ibdb-urls.js

      # Pre-discovery validation snapshot. Runs the same validator that gates
      # the commit below, but warn-only, and captures full output so the
      # post-discovery step can set-diff errors (task #649) — a pre-existing,
      # unrelated error here must not discard today's discovery commit.
      - name: Pre-validate existing data (baseline error snapshot)
        id: pre-validate
        continue-on-error: true
        run: |
          set -o pipefail
          if node scripts/validate-data.js 2>&1 | tee /tmp/pre-validate-output.txt; then
            echo "status=ok" >> $GITHUB_OUTPUT
            echo "Pre-discovery validation: OK"
          else
            echo "status=broken" >> $GITHUB_OUTPUT
            echo "::warning::Data validation already failing BEFORE discovery — peripheral data file has an unrelated error. Discovery will still run; the commit is only blocked if discovery introduces a NEW validation error (task #649 set-diff)."
          fi

      # Step 2a: Discover ShowScore URLs and generate candidates for new show discovery
      - name: Discover ShowScore URLs and candidates
        if: ${{ inputs.skip_discovery != 'true' }}
        run: node scripts/discover-show-score-urls-from-listings.js
        continue-on-error: true

      # Step 2b: Discover new Broadway + OB + WE shows (unless skipped)
      - name: Discover new shows
        id: discover
        if: ${{ inputs.skip_discovery != 'true' }}
        env:
          BRIGHTDATA_TOKEN: ${{ secrets.BRIGHTDATA_TOKEN }}
          BRIGHTDATA_ZONE: ${{ secrets.BRIGHTDATA_ZONE }}
          SCRAPINGBEE_API_KEY: ${{ secrets.SCRAPINGBEE_API_KEY }}
          SCRAPINGDOG_API_KEY: ${{ secrets.SCRAPINGDOG_API_KEY }}
          SCRAPER_USE_SCRAPINGDOG: '1'
        # Discovery is best-effort and has grown slow (per-candidate IBDB revival
        # SERP × the late-May OB-venue expansion pushed it to ~21 min). It must
        # NOT be able to cancel the critical pipeline (status updates,
        # opening-night readiness, push) by eating the whole job budget — that
        # cancellation is what made every run go stale and spammed cron-health.
        # Cap it and continue-on-error so the run still succeeds if it overruns.
        # 45 min: the 30-min cap was hit on 2026-07-14 (discovery killed mid-run,
        # masked by continue-on-error) — new-show enrichment after a big skip
        # list doesn't fit in 30.
        # --time-budget-min=35 (task #438, same class as #369/#415/#421): a
        # SIGKILL at the 45-min timeout loses ALL discovered results (the whole
        # node process dies mid-write) AND leaves the job running long enough
        # that, by the time "Commit and push changes" runs, enough commit churn
        # has landed on main that push-with-retry.sh's 7 retries can exhaust
        # (run 30080143665, 2026-07-24). A clean 35-min budget-exit commits
        # whatever was found and finishes the job ~10 min sooner, well inside
        # the 45-min step timeout (kept as a backstop).
        timeout-minutes: 45
        continue-on-error: true
        run: node scripts/discover-new-shows.js --include-off-broadway --include-west-end --consume-show-score-candidates --time-budget-min=35

      # Regional→Broadway transfer auto-linking: if a just-discovered (or any
      # existing) Broadway show title-matches a tracked regional tryout and
      # opened after it, set the reciprocal transferOf/transferredTo pair so
      # both pages cross-link with the tryout score (feature 2026-07-11).
      # Pure detection logic + tests: scripts/lib/transfer-detection.js.
      # Ambiguous matches are emailed, never applied. validate-data (below)
      # enforces reciprocity before anything pushes.
      - name: Detect regional→Broadway transfers
        continue-on-error: true
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
        run: node scripts/detect-regional-transfers.js --email

      # Step 3: Enrich new/incomplete shows with metadata from free APIs
      - name: Enrich shows with TodayTix runtimes
        if: ${{ inputs.skip_discovery != 'true' }}
        run: node scripts/enrich-todaytix-runtimes.js
        continue-on-error: true

      - name: Enrich shows with TodayTix ticket links
        if: ${{ inputs.skip_discovery != 'true' }}
        run: node scripts/enrich-todaytix-data.js
        continue-on-error: true

      - name: Refresh ticket prices from TodayTix
        run: node scripts/enrich-ticket-prices.js
        continue-on-error: true

      - name: Refresh StubHub prices (scraping — temporary until API access)
        env:
          BRIGHTDATA_TOKEN: ${{ secrets.BRIGHTDATA_TOKEN }}
          BRIGHTDATA_ZONE: ${{ secrets.BRIGHTDATA_ZONE }}
          SCRAPINGBEE_API_KEY: ${{ secrets.SCRAPINGBEE_API_KEY }}
          SCRAPINGDOG_API_KEY: ${{ secrets.SCRAPINGDOG_API_KEY }}
          SCRAPER_USE_SCRAPINGDOG: '1'
        run: node scripts/enrich-stubhub-prices.js
        continue-on-error: true
        timeout-minutes: 5

      - name: Enrich shows with Telecharge/Ticketmaster links
        if: ${{ inputs.skip_discovery != 'true' }}
        env:
          SCRAPINGBEE_API_KEY: ${{ secrets.SCRAPINGBEE_API_KEY }}
          SCRAPINGDOG_API_KEY: ${{ secrets.SCRAPINGDOG_API_KEY }}
          SCRAPER_USE_SCRAPINGDOG: '1'
        run: node scripts/enrich-ticket-platform-links.js
        continue-on-error: true

      - name: Enrich shows with Wikipedia synopses (Broadway/OB)
        if: ${{ inputs.skip_discovery != 'true' }}
        run: node scripts/enrich-wikipedia-synopsis.js --limit=20
        continue-on-error: true

      - name: Enrich shows with Wikipedia synopses (West End + Off-West End)
        if: ${{ inputs.skip_discovery != 'true' }}
        run: |
          node scripts/enrich-wikipedia-synopsis.js --category=west-end --limit=10
          node scripts/enrich-wikipedia-synopsis.js --category=off-west-end --limit=10
        continue-on-error: true

      - name: Enrich shows with Wikipedia runtimes
        if: ${{ inputs.skip_discovery != 'true' }}
        run: node scripts/enrich-wikipedia-runtimes.js --limit=20
        continue-on-error: true

      # Second self-heal pass: discovery + IBDB enrichment above can attach an
      # original production's ibdbUrl to a freshly discovered revival stub —
      # that's exactly what blocked the commit daily 2026-07-03→05 (the stale
      # URLs never landed in shows.json; each day's discovery re-created them
      # in the working tree and validation re-blocked). The pass before
      # pre-validate heals pre-existing data; this pass heals what discovery
      # just introduced. Idempotent and near-instant.
      - name: Self-heal shared ibdbUrls (post-discovery)
        if: ${{ inputs.skip_discovery != 'true' }}
        run: node scripts/fix-shared-ibdb-urls.js

      # Step 4: Validate data after discovery/enrichment. continue-on-error
      # keeps the job going so the set-diff step below can decide whether
      # this run should still commit — a pre-existing, unrelated error must
      # not discard good discovery/enrichment work (task #649). The
      # "Commit gate" step further down re-fails the job when the set-diff
      # finds a genuinely NEW error, restoring the original hard-fail
      # semantics for that case only.
      - name: Validate data
        id: validate
        continue-on-error: true
        run: |
          set -o pipefail
          node scripts/validate-data.js 2>&1 | tee /tmp/post-validate-output.txt
          echo $? > /tmp/post-validate-exitcode.txt

      # Set-diff: did discovery/enrichment introduce a NEW validation error,
      # or is the only failure a pre-existing one it didn't cause? Only the
      # former should block the commit (task #649). --post-exit-code guards
      # against a validate-data.js crash/format-change that exits non-zero
      # but prints nothing matching "❌ ERROR:" — without it that would read
      # as should_commit=true (ship-check finding). Pure logic lives in
      # scripts/lib/validation-setdiff.js, tested in
      # tests/unit/discovery-validation-setdiff.test.mjs.
      - name: Compute validation error set-diff
        id: setdiff
        if: always()
        run: node scripts/check-validation-setdiff.js --pre=/tmp/pre-validate-output.txt --post=/tmp/post-validate-output.txt --post-exit-code="$(cat /tmp/post-validate-exitcode.txt 2>/dev/null || echo '')" >> "$GITHUB_OUTPUT"

      # Fails the job — WITHOUT continue-on-error — only when the set-diff
      # found a NEW error. Every downstream `if:` below keys off
      # steps.commit-gate.outcome exactly like it previously keyed off
      # steps.validate.outcome, but the decision now comes from the set-diff
      # instead of validate-data.js's raw exit code (task #649).
      - name: Commit gate — block only on NEW validation errors
        id: commit-gate
        if: always()
        run: |
          if [ "${{ steps.setdiff.outputs.should_commit }}" != "true" ]; then
            echo "::error::Discovery/enrichment introduced ${{ steps.setdiff.outputs.new_error_count }} new validation error(s) — see data/audit/discovery-blocked/ (written by the next step) for the diff."
            exit 1
          fi
          echo "No new validation errors — commit is clear to proceed (${{ steps.setdiff.outputs.pre_error_count }} pre-existing error(s) ignored)."

      # Audit trail when validation blocks the commit. Two outputs:
      #   1. $GITHUB_STEP_SUMMARY — at-a-glance diagnosis on the run page
      #   2. data/audit/discovery-blocked/<runId>.json — persistent record that
      #      survives run retention (90d default) and is greppable from
      #      operator's local checkout. Pushed via push-core-data below
      #      (audit/ files are in the private core-data repo).
      # Defensive: variables piped through env to avoid YAML interpolation
      # in shell heredocs breaking on exotic characters in show slugs.
      # should_commit != 'true' now means the set-diff found a genuinely NEW
      # error — a pre-existing-only failure no longer reaches this step at
      # all (task #649), so the diagnosis here is always "discovery-
      # introduced". Includes the actual new-error text (not just counts) so
      # an operator finding this a week later can tell which file to fix
      # without re-running validate-data.js locally.
      - name: Audit discovery on validation failure
        id: audit
        if: always() && steps.setdiff.outputs.should_commit != 'true'
        env:
          PRE_VALIDATION: ${{ steps.pre-validate.outputs.status }}
          NEW_ERROR_COUNT: ${{ steps.setdiff.outputs.new_error_count }}
          NEW_ERRORS_PREVIEW: ${{ steps.setdiff.outputs.new_errors_preview }}
          NEW_SHOWS_COUNT: ${{ steps.discover.outputs.new_shows_count }}
          NEW_SLUGS: ${{ steps.discover.outputs.new_slugs }}
          OPENED_COUNT: ${{ steps.status-update.outputs.opened_count }}
          OPENED_SLUGS: ${{ steps.status-update.outputs.opened_slugs }}
          WE_NEW_COUNT: ${{ steps.discover.outputs.we_new_count }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          DIAGNOSIS_KIND="discovery-introduced"
          DIAGNOSIS_TEXT="Discovery/enrichment introduced ${NEW_ERROR_COUNT} NEW validation error(s) not present before this run (task #649 set-diff). See new_errors_preview below, or re-run \`node scripts/validate-data.js\` locally, for the file to fix."

          {
            echo "## Validation blocked commit"
            echo ""
            echo "**Pre-discovery validation:** \`${PRE_VALIDATION}\`"
            echo "**New errors introduced:** \`${NEW_ERROR_COUNT}\`"
            echo ""
            echo "${DIAGNOSIS_TEXT}"
            echo ""
            echo "### New validation errors (preview)"
            echo ""
            echo "\`${NEW_ERRORS_PREVIEW}\`"
            echo ""
            echo "### Discovery output (would have been committed)"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| new_shows_count | \`${NEW_SHOWS_COUNT}\` |"
            echo "| new_slugs | \`${NEW_SLUGS}\` |"
            echo "| opened_count | \`${OPENED_COUNT}\` |"
            echo "| opened_slugs | \`${OPENED_SLUGS}\` |"
            echo "| we_new_count | \`${WE_NEW_COUNT}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

          # Persistent JSON for grep-ability after run retention expires.
          mkdir -p data/audit/discovery-blocked
          AUDIT_FILE="data/audit/discovery-blocked/${RUN_ID}.json"
          DIAGNOSIS_KIND="${DIAGNOSIS_KIND}" AUDIT_FILE="${AUDIT_FILE}" node -e '
            const fs = require("fs");
            const out = {
              runId: process.env.RUN_ID,
              runUrl: "https://github.com/" + process.env.REPO + "/actions/runs/" + process.env.RUN_ID,
              completedAt: new Date().toISOString(),
              diagnosis: process.env.DIAGNOSIS_KIND,
              preValidationStatus: process.env.PRE_VALIDATION,
              newErrorCount: process.env.NEW_ERROR_COUNT || "",
              newErrorsPreview: process.env.NEW_ERRORS_PREVIEW || "",
              newShowsCount: process.env.NEW_SHOWS_COUNT || "",
              newSlugs: process.env.NEW_SLUGS || "",
              openedCount: process.env.OPENED_COUNT || "",
              openedSlugs: process.env.OPENED_SLUGS || "",
              weNewCount: process.env.WE_NEW_COUNT || ""
            };
            fs.writeFileSync(process.env.AUDIT_FILE, JSON.stringify(out, null, 2) + "\n");
            console.log("Wrote audit:", process.env.AUDIT_FILE);
          '
          echo "audit_file=${AUDIT_FILE}" >> "$GITHUB_OUTPUT"

      # Step 4: Check for any changes
      - name: Check for changes
        id: git-check
        run: |
          git diff --exit-code data/shows.json || echo "changes=true" >> $GITHUB_OUTPUT
          if [ -f data/new-shows-pending.json ]; then
            echo "has_pending=true" >> $GITHUB_OUTPUT
          fi

      # Record pipeline health timestamp (always, even if no show changes)
      - name: Record pipeline success
        if: always() && steps.commit-gate.outcome != 'failure'
        run: |
          mkdir -p data/audit/pipeline-health
          date -u > data/audit/pipeline-health/update-show-status.last-success

      # Step 5: Commit and push changes (skip if validation failed)
      # Keep the Off-Broadway venue allowlist (used by the TodayTix discovery
      # fallback) in sync with the OB shows now in shows.json. Idempotent —
      # a no-op when no new OB venue appeared. See scripts/build-ob-venues.js.
      - name: Regenerate Off-Broadway venue allowlist
        if: always() && steps.commit-gate.outcome != 'failure'
        run: node scripts/build-ob-venues.js
        continue-on-error: true

      - name: Commit and push changes
        if: always() && steps.commit-gate.outcome != 'failure'
        # PUSH_DEADLINE_SEC override (task #458): this step's push measured ~3
        # min per GENUINE (non-stalled) conflict-resolution cycle under this
        # workflow's high main-branch churn (run 30186060030) — the shared 240s
        # default only fit ~1.3 cycles before self-aborting, so "failed after 7
        # attempts" was misleading (only ~2 real cycles ran).
        #
        # 600s (round 1) verified live on run 30187244663: correctly fit ~4
        # real cycles (up from ~2) but STILL exhausted before a fetch cleanly
        # landed — the underlying per-cycle cost is genuinely ~190s under
        # sustained high churn (root cause: two consecutive 90s
        # GIT_NET_TIMEOUT_SEC fetch timeouts, not rebase/merge compute — see
        # task #464). That same live run's TOTAL job wall-clock was only
        # ~31.5 min against the 75-min timeout, so there was 40+ min of
        # measured (not guessed) unused headroom. Raised to 1200s (round 2,
        # ~6 real cycles) — keeps ~5 min of buffer under the job's own
        # documented worst-case non-push budget (discovery 30 + enrichment 10
        # + StubHub 5 + setup 5 = 50 min / 3000s, leaving 1500s for push;
        # 1200s preserves 300s of that as margin rather than spending all of
        # it). Scoped to THIS step only (not the shared script default — see
        # push-with-retry.sh's PUSH_DEADLINE_SEC comment for why) since the
        # other push-with-retry.sh calls below push much smaller,
        # rarely-conflicting files. If churn persists past this, the real
        # fix is task #464 (root-cause + shorten the per-cycle cost itself),
        # not another deadline bump.
        env:
          PUSH_DEADLINE_SEC: '1200'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          # Core data files pushed to private repo by push-core-data action
          if [ -f data/new-shows-pending.json ]; then
            git add data/new-shows-pending.json
          fi
          git add data/show-score-urls.json 2>/dev/null || true
          git add data/show-score-candidates.json 2>/dev/null || true
          git add data/off-broadway-venues.json 2>/dev/null || true
          git add data/audit/pipeline-health/ 2>/dev/null || true

          # Only commit if there are staged changes
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          # Create appropriate commit message
          if [ "${{ steps.discover.outputs.new_shows_count }}" != "" ] && [ "${{ steps.discover.outputs.new_shows_count }}" != "0" ]; then
            git commit -m "chore: Update shows - added ${{ steps.discover.outputs.new_shows_count }} new show(s)"
          else
            git commit -m "chore: Auto-update show statuses"
          fi
          bash scripts/lib/push-with-retry.sh

      - name: Queue new Broadway shows for commercial research
        if: steps.discover.outputs.new_shows_count != '' && steps.discover.outputs.new_shows_count != '0'
        # Task #574: commits commercial-research-queue.json (union-merged
        # managed file) — see push-with-retry.sh's reconcile_merged_json().
        env:
          PUSH_RECONCILE_MERGED_JSON: '1'
        run: |
          NEW_SLUGS="${{ steps.discover.outputs.new_slugs }}"
          if [ -z "$NEW_SLUGS" ]; then
            echo "No new slugs to queue"
            exit 0
          fi
          # Logic lives in scripts/lib/commercial-queue.js (colocated-tested,
          # see tests/unit/commercial-queue.test.mjs) — this step just wires
          # the discovered slugs through the CLI wrapper.
          node scripts/queue-commercial-research.js --new-slugs="$NEW_SLUGS"
          QUEUE_FILE="data/commercial-research-queue.json"
          git add "$QUEUE_FILE" 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "data: Queue new Broadway shows for commercial research"
            bash scripts/lib/push-with-retry.sh
          fi

      - name: Queue pre-opening shows for commercial research
        continue-on-error: true
        # Task #574: commits commercial-research-queue.json (union-merged
        # managed file) — see push-with-retry.sh's reconcile_merged_json().
        env:
          PUSH_RECONCILE_MERGED_JSON: '1'
        run: |
          node scripts/queue-commercial-research.js --pre-opening
          QUEUE_FILE="data/commercial-research-queue.json"
          git add "$QUEUE_FILE" 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "data: Queue pre-opening shows for commercial research"
            bash scripts/lib/push-with-retry.sh
          fi

      - name: Queue closing TBD shows for commercial research
        continue-on-error: true
        # Task #574: commits commercial-research-queue.json (union-merged
        # managed file) — see push-with-retry.sh's reconcile_merged_json().
        env:
          PUSH_RECONCILE_MERGED_JSON: '1'
        run: |
          node scripts/queue-commercial-research.js --closing
          QUEUE_FILE="data/commercial-research-queue.json"
          git add "$QUEUE_FILE" 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "data: Queue closing TBD shows for commercial research"
            bash scripts/lib/push-with-retry.sh
          fi

      # Push the audit JSON to the private core-data repo when validate
      # blocked the commit. push-core-data (below) only syncs top-level
      # JSONs (shows.json, reviews.json, etc.) and won't carry audit/
      # subdirectories. Using gh api for a targeted single-file commit
      # avoids racing with concurrent core-data writers and dodges the
      # "validate failed so nothing pushes" gate. Pattern from
      # memory/feedback_gh_api_emergency_commit.md.
      - name: Push discovery-blocked audit to private repo
        if: always() && steps.commit-gate.outcome == 'failure' && steps.audit.outputs.audit_file != ''
        env:
          GH_TOKEN: ${{ secrets.REVIEW_TEXTS_TOKEN }}
          RUN_ID: ${{ github.run_id }}
          AUDIT_FILE: ${{ steps.audit.outputs.audit_file }}
        run: |
          if [ ! -f "${AUDIT_FILE}" ]; then
            echo "::warning::Audit file not found: ${AUDIT_FILE}"
            exit 0
          fi
          REMOTE_PATH="audit/discovery-blocked/${RUN_ID}.json"
          CONTENT_B64=$(base64 < "${AUDIT_FILE}" | tr -d '\n')
          # Check if file already exists (re-run of same run_id), retrieve sha if so
          EXISTING_SHA=$(gh api "repos/thomaspryor/broadway-scorecard-data/contents/${REMOTE_PATH}" --jq '.sha // empty' 2>/dev/null || true)
          if [ -n "${EXISTING_SHA}" ]; then
            gh api "repos/thomaspryor/broadway-scorecard-data/contents/${REMOTE_PATH}" \
              --method PUT \
              -f "message=audit: discovery blocked by validate-data (run ${RUN_ID})" \
              -f "content=${CONTENT_B64}" \
              -f "sha=${EXISTING_SHA}" \
              --silent
          else
            gh api "repos/thomaspryor/broadway-scorecard-data/contents/${REMOTE_PATH}" \
              --method PUT \
              -f "message=audit: discovery blocked by validate-data (run ${RUN_ID})" \
              -f "content=${CONTENT_B64}" \
              --silent
          fi
          echo "Pushed audit: thomaspryor/broadway-scorecard-data:${REMOTE_PATH}"

      - name: Push aggregator-archive to private repo
        if: always()
        uses: ./.github/actions/push-aggregator-archive
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
          message: 'data: Show Score archives from update-show-status'

      # validate-data.js writes ${RUNNER_TEMP}/.skip-push-core-data itself
      # whenever it exits with ANY error — pre-existing or not — since it has
      # no notion of the set-diff decision made above. Without this step, a
      # pre-existing-only failure would leave the sentinel written by the
      # "Validate data" step, and push-core-data's OWN internal refusal-check
      # would still silently block the private-repo push even though
      # commit-gate (and the public-repo commit above) proceeded — the exact
      # discard-good-work bug this fix targets, just one step downstream.
      # Ship-check finding, task #649.
      - name: Clear stale push-refusal sentinel (pre-existing errors only)
        if: always() && steps.commit-gate.outcome != 'failure'
        run: |
          SENTINEL="${RUNNER_TEMP:-/tmp}/.skip-push-core-data"
          if [ -f "$SENTINEL" ]; then
            echo "Clearing stale push-refusal sentinel — set-diff found no NEW validation errors (task #649)."
            rm -f "$SENTINEL"
          fi

      - name: Push core data to private repo
        if: always() && steps.commit-gate.outcome != 'failure'
        uses: ./.github/actions/push-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
          message: 'data: Update from update-show-status'

      - name: Trigger deploy (core data changed)
        if: always() && steps.git-check.outputs.changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Deploy dedup: skip if a deploy was ALREADY triggered after our rebuild started
          OUR_RUN_START=$(gh run view ${{ github.run_id }} --json createdAt -q '.createdAt' 2>/dev/null || echo "")
          RECENT=$(gh run list --workflow=vercel-deploy.yml --limit=1 --json createdAt -q '.[0].createdAt' 2>/dev/null || echo "")

          if [ -n "$RECENT" ] && [ -n "$OUR_RUN_START" ]; then
            RECENT_TS=$(date -d "$RECENT" +%s 2>/dev/null || date -j -f "%Y-%m-%dT%H:%M:%SZ" "$RECENT" +%s 2>/dev/null || echo "0")
            OUR_TS=$(date -d "$OUR_RUN_START" +%s 2>/dev/null || date -j -f "%Y-%m-%dT%H:%M:%SZ" "$OUR_RUN_START" +%s 2>/dev/null || echo "0")
            NOW_TS=$(date +%s)
            DIFF=$((NOW_TS - RECENT_TS))

            if [ "$RECENT_TS" -gt "$OUR_TS" ] && [ "$DIFF" -lt 900 ]; then
              echo "Skipping deploy — already triggered after this run started (${DIFF}s ago)"
              exit 0
            fi
          fi

          echo "Triggering deploy..."
          gh workflow run vercel-deploy.yml || echo "Deploy dispatch failed — will deploy on next schedule"

  create-issue:
    needs: update-shows
    if: needs.update-shows.outputs.new_shows_count != '' && needs.update-shows.outputs.new_shows_count != '0'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout to read pending shows
        uses: actions/checkout@v5
        with:
          ref: main


      - name: Checkout core data
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
      - name: Create issue for new shows
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const count = '${{ needs.update-shows.outputs.new_shows_count }}';

            // Read pending shows from file instead of workflow output (safer for special characters)
            const pendingData = JSON.parse(fs.readFileSync('data/new-shows-pending.json', 'utf8'));
            const shows = pendingData.shows;
            const showsList = shows.map(s => `- ${s.title} (${s.venue})`).join('\n');
            const slugs = shows.map(s => s.slug);

            const issueBody = `## New Broadway Shows Discovered

            The automated discovery script found **${count} new show(s)** on Broadway:

            ${showsList}

            ### Action Required

            These shows have been added to \`shows.json\` with basic metadata but need:

            - [ ] Review data collection (critic reviews, scores)
            - [ ] Complete metadata (opening date, runtime, cast, creative team)
            - [ ] Image verification

            ### Shows to process:
            ${slugs.map(s => `- [ ] \`${s}\``).join('\n')}

            ### How to gather review data

            Run the data agent or manually add reviews to \`reviews.json\`:

            \`\`\`bash
            # Check the pending shows file
            cat data/new-shows-pending.json

            # Run data agent (if available)
            node scripts/gather-reviews.js --shows=${slugs.join(',')}
            \`\`\`

            ---
            *This issue was auto-generated by the Broadway Show Discovery workflow*
            `;

            const title = shows.length === 1
              ? `🎭 New Show: ${shows[0].title}`
              : `🎭 ${shows.length} New Shows Discovered`;

            // Issue creation disabled — pipeline auto-handles new shows
            // (gather-reviews, image fetch, IBDB enrichment all trigger automatically)
            console.log(`Discovered ${shows.length} new show(s): ${slugs.join(', ')}`);
            console.log('Skipping issue creation — pipeline handles these automatically');

  # Optional: Trigger review data gathering workflow
  # Note: Only triggers for shows that have opened (not previews)
  trigger-data-agent:
    needs: update-shows
    if: |
      (needs.update-shows.outputs.new_shows_count != '' && needs.update-shows.outputs.new_shows_count != '0') ||
      (needs.update-shows.outputs.opened_count != '' && needs.update-shows.outputs.opened_count != '0')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout to filter previews shows
        uses: actions/checkout@v5
        with:
          ref: main


      - name: Checkout core data
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
      - name: Combine discovered and opened shows
        id: filter
        run: |
          new_slugs="${{ needs.update-shows.outputs.new_slugs }}"
          opened_slugs="${{ needs.update-shows.outputs.opened_slugs }}"

          # Combine both sources, dedup
          # Include open + closed shows (they have reviews to gather)
          # Skip previews (no reviews published yet)
          all_slugs=""
          for slug in $(echo "$new_slugs,$opened_slugs" | tr ',' '\n' | sort -u); do
            [ -z "$slug" ] && continue
            status=$(node -e "const shows = require('./data/shows.json'); const show = shows.shows.find(s => s.id === '$slug' || s.slug === '$slug'); console.log(show?.status || 'unknown');")
            if [ "$status" = "open" ] || [ "$status" = "closed" ]; then
              [ -n "$all_slugs" ] && all_slugs="$all_slugs,$slug" || all_slugs="$slug"
            fi
          done

          echo "opened_shows=$all_slugs" >> $GITHUB_OUTPUT
          echo "Combined shows for data pipelines: $all_slugs"

          # Also output newly discovered preview shows (for Reddit — discussions start at previews)
          preview_slugs=""
          for slug in $(echo "$new_slugs" | tr ',' '\n' | sort -u); do
            [ -z "$slug" ] && continue
            status=$(node -e "const shows = require('./data/shows.json'); const show = shows.shows.find(s => s.id === '$slug' || s.slug === '$slug'); console.log(show?.status || 'unknown');")
            if [ "$status" = "previews" ]; then
              [ -n "$preview_slugs" ] && preview_slugs="$preview_slugs,$slug" || preview_slugs="$slug"
            fi
          done
          echo "preview_shows=$preview_slugs" >> $GITHUB_OUTPUT
          echo "New preview shows (for Reddit): $preview_slugs"

          # Filter to London-market shows only (for WE-only scrapers: SeatPlan, LBO, LTD)
          london_slugs=""
          for slug in $(echo "$all_slugs" | tr ',' '\n'); do
            [ -z "$slug" ] && continue
            category=$(node -e "const shows = require('./data/shows.json'); const show = shows.shows.find(s => s.id === '$slug' || s.slug === '$slug'); console.log(show?.category || 'broadway');")
            if [ "$category" = "west-end" ] || [ "$category" = "off-west-end" ]; then
              [ -n "$london_slugs" ] && london_slugs="$london_slugs,$slug" || london_slugs="$slug"
            fi
          done
          echo "london_shows=$london_slugs" >> $GITHUB_OUTPUT
          echo "London shows for WE-only scrapers: $london_slugs"

          # Also output ALL new shows (including previews) for cast backfill
          # Cast data is available on IBDB as soon as previews begin
          # Skip OB/WE shows — IBDB is Broadway-only
          all_cast_slugs=""
          for slug in $(echo "$new_slugs,$opened_slugs" | tr ',' '\n' | sort -u); do
            [ -z "$slug" ] && continue
            category=$(node -e "const shows = require('./data/shows.json'); const show = shows.shows.find(s => s.id === '$slug' || s.slug === '$slug'); console.log(show?.category || 'broadway');")
            if [ "$category" != "broadway" ] && [ "$category" != "" ]; then
              echo "Skipping cast backfill for non-Broadway show: $slug ($category)"
              continue
            fi
            [ -n "$all_cast_slugs" ] && all_cast_slugs="$all_cast_slugs,$slug" || all_cast_slugs="$slug"
          done
          echo "cast_shows=$all_cast_slugs" >> $GITHUB_OUTPUT
          echo "Shows for cast backfill (incl previews): $all_cast_slugs"

      - name: Trigger data agent workflow
        if: steps.filter.outputs.opened_shows != ''
        uses: actions/github-script@v7
        with:
          script: |
            // Check if the gather-reviews workflow exists
            try {
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'gather-reviews.yml',
                ref: 'main',
                inputs: {
                  shows: '${{ steps.filter.outputs.opened_shows }}',
                  max_tier: '3'
                }
              });
              console.log('Triggered gather-reviews workflow for opened shows (max_tier=3)');
            } catch (e) {
              // Workflow doesn't exist yet, that's okay
              console.log('gather-reviews workflow not found, skipping trigger');
            }

      - name: Trigger related shows generation for opened shows
        if: steps.filter.outputs.opened_shows != ''
        uses: actions/github-script@v7
        with:
          script: |
            // Generate recommendations for each newly opened show individually
            // (show_filter accepts a single show slug)
            const slugs = '${{ steps.filter.outputs.opened_shows }}'.split(',').filter(Boolean);
            for (const slug of slugs) {
              try {
                await github.rest.actions.createWorkflowDispatch({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id: 'generate-related-shows.yml',
                  ref: 'main',
                  inputs: {
                    show_filter: slug
                  }
                });
                console.log(`Triggered related shows generation for: ${slug}`);
                // Space dispatches to avoid rate limits
                if (slugs.length > 1) await new Promise(r => setTimeout(r, 10000));
              } catch (e) {
                console.log(`Related shows trigger failed for ${slug}:`, e.message);
