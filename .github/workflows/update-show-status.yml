        if: steps.filter.outputs.opened_shows != ''
        uses: actions/github-script@v7
        with:
          script: |
            // Generate recommendations for each newly opened show individually
            // (show_filter accepts a single show slug)
            const slugs = '${{ steps.filter.outputs.opened_shows }}'.split(',').filter(Boolean);
            for (const slug of slugs) {
