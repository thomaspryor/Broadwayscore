name: Update Shows

on:
  # Run daily at 8 AM UTC (3 AM EST) to catch new show openings quickly
  schedule:
    - cron: '0 8 * * *'
  # Allow manual triggering
  workflow_dispatch:
    inputs:
      skip_discovery:
        description: 'Skip new show discovery'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  update-shows:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      new_shows_count: ${{ steps.discover.outputs.new_shows_count }}
      new_shows: ${{ steps.discover.outputs.new_shows }}
      new_slugs: ${{ steps.discover.outputs.new_slugs }}
      opened_count: ${{ steps.status-update.outputs.opened_count }}
      opened_slugs: ${{ steps.status-update.outputs.opened_slugs }}
      we_new_count: ${{ steps.discover.outputs.we_new_count }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main


      - name: Checkout core data
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci || npm install

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      # Step 1: Update existing show statuses
      - name: Update show statuses
        id: status-update
        env:
          BRIGHTDATA_TOKEN: ${{ secrets.BRIGHTDATA_TOKEN }}
          SCRAPINGBEE_API_KEY: ${{ secrets.SCRAPINGBEE_API_KEY }}
        run: node scripts/update-show-status.js

      # Step 2a: Discover ShowScore URLs and generate candidates for new show discovery
      - name: Discover ShowScore URLs and candidates
        if: ${{ inputs.skip_discovery != 'true' }}
        run: node scripts/discover-show-score-urls-from-listings.js
        continue-on-error: true

      # Step 2b: Discover new Broadway + OB + WE shows (unless skipped)
      - name: Discover new shows
        id: discover
        if: ${{ inputs.skip_discovery != 'true' }}
        env:
          BRIGHTDATA_TOKEN: ${{ secrets.BRIGHTDATA_TOKEN }}
          SCRAPINGBEE_API_KEY: ${{ secrets.SCRAPINGBEE_API_KEY }}
        run: node scripts/discover-new-shows.js --include-off-broadway --include-west-end --consume-show-score-candidates

      # Step 3: Enrich new/incomplete shows with metadata from free APIs
      - name: Enrich shows with TodayTix runtimes
        if: ${{ inputs.skip_discovery != 'true' }}
        run: node scripts/enrich-todaytix-runtimes.js
        continue-on-error: true

      - name: Enrich shows with TodayTix ticket links
        if: ${{ inputs.skip_discovery != 'true' }}
        run: node scripts/enrich-todaytix-data.js
        continue-on-error: true

      - name: Enrich shows with Telecharge/Ticketmaster links
        if: ${{ inputs.skip_discovery != 'true' }}
        env:
          SCRAPINGBEE_API_KEY: ${{ secrets.SCRAPINGBEE_API_KEY }}
        run: node scripts/enrich-ticket-platform-links.js
        continue-on-error: true

      - name: Enrich shows with Wikipedia synopses
        if: ${{ inputs.skip_discovery != 'true' }}
        run: node scripts/enrich-wikipedia-synopsis.js --limit=20
        continue-on-error: true

      - name: Enrich shows with Wikipedia runtimes
        if: ${{ inputs.skip_discovery != 'true' }}
        run: node scripts/enrich-wikipedia-runtimes.js --limit=20
        continue-on-error: true

      # Step 4: Validate data before committing
      - name: Validate data
        id: validate
        run: node scripts/validate-data.js

      # Step 4: Check for any changes
      - name: Check for changes
        id: git-check
        run: |
          git diff --exit-code data/shows.json || echo "changes=true" >> $GITHUB_OUTPUT
          if [ -f data/new-shows-pending.json ]; then
            echo "has_pending=true" >> $GITHUB_OUTPUT
          fi

      # Step 5: Commit and push changes (skip if validation failed)
      - name: Commit and push changes
        if: always() && steps.git-check.outputs.changes == 'true' && steps.validate.outcome != 'failure'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          # Core data files pushed to private repo by push-core-data action
          if [ -f data/new-shows-pending.json ]; then
            git add data/new-shows-pending.json
          fi
          git add data/show-score-urls.json 2>/dev/null || true
          git add data/show-score-candidates.json 2>/dev/null || true

          # Create appropriate commit message
          if [ "${{ steps.discover.outputs.new_shows_count }}" != "" ] && [ "${{ steps.discover.outputs.new_shows_count }}" != "0" ]; then
            git commit -m "chore: Update shows - added ${{ steps.discover.outputs.new_shows_count }} new show(s)"
          else
            git commit -m "chore: Auto-update show statuses"
          fi
          # Retry push with rebase in case remote has new commits
          PUSH_OK=false
          for i in 1 2 3 4 5; do
            if git push origin main; then
              echo "Push succeeded on attempt $i"
              PUSH_OK=true
              break
            fi
            echo "Push failed (attempt $i), pulling and rebasing..."
            echo "--- Unstaged files before cleanup ---"
            git status --porcelain 2>/dev/null || true
            git checkout -- . 2>/dev/null || true
            git clean -fd 2>/dev/null || true
            if git pull --rebase -X theirs origin main; then
              echo "Rebase succeeded, retrying push..."
            else
              echo "Rebase failed, aborting..."
              git rebase --abort 2>/dev/null || true
            fi
            sleep $((10 + RANDOM % 20))
          done
          if [ "$PUSH_OK" != "true" ]; then
            echo "ERROR: All 5 push attempts failed"
            exit 1
          fi

  # Create issue for new shows that need review data

      - name: Push core data to private repo
        if: always() && steps.validate.outcome != 'failure'
        uses: ./.github/actions/push-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
          message: 'data: Update from update-show-status'

      - name: Trigger deploy (core data changed)
        if: always() && steps.git-check.outputs.changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Deploy dedup: skip if a deploy was ALREADY triggered after our rebuild started
          OUR_RUN_START=$(gh run view ${{ github.run_id }} --json createdAt -q '.createdAt' 2>/dev/null || echo "")
          RECENT=$(gh run list --workflow="Deploy to Vercel" --limit=1 --json createdAt -q '.[0].createdAt' 2>/dev/null || echo "")

          if [ -n "$RECENT" ] && [ -n "$OUR_RUN_START" ]; then
            RECENT_TS=$(date -d "$RECENT" +%s 2>/dev/null || date -j -f "%Y-%m-%dT%H:%M:%SZ" "$RECENT" +%s 2>/dev/null || echo "0")
            OUR_TS=$(date -d "$OUR_RUN_START" +%s 2>/dev/null || date -j -f "%Y-%m-%dT%H:%M:%SZ" "$OUR_RUN_START" +%s 2>/dev/null || echo "0")
            NOW_TS=$(date +%s)
            DIFF=$((NOW_TS - RECENT_TS))

            if [ "$RECENT_TS" -gt "$OUR_TS" ] && [ "$DIFF" -lt 900 ]; then
              echo "Skipping deploy — already triggered after this run started (${DIFF}s ago)"
              exit 0
            fi
          fi

          echo "Triggering deploy..."
          gh workflow run "Deploy to Vercel" || echo "Deploy dispatch failed — will deploy on next schedule"

  create-issue:
    needs: update-shows
    if: needs.update-shows.outputs.new_shows_count != '' && needs.update-shows.outputs.new_shows_count != '0'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout to read pending shows
        uses: actions/checkout@v4
        with:
          ref: main


      - name: Checkout core data
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
      - name: Create issue for new shows
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const count = '${{ needs.update-shows.outputs.new_shows_count }}';

            // Read pending shows from file instead of workflow output (safer for special characters)
            const pendingData = JSON.parse(fs.readFileSync('data/new-shows-pending.json', 'utf8'));
            const shows = pendingData.shows;
            const showsList = shows.map(s => `- ${s.title} (${s.venue})`).join('\n');
            const slugs = shows.map(s => s.slug);

            const issueBody = `## New Broadway Shows Discovered

            The automated discovery script found **${count} new show(s)** on Broadway:

            ${showsList}

            ### Action Required

            These shows have been added to \`shows.json\` with basic metadata but need:

            - [ ] Review data collection (critic reviews, scores)
            - [ ] Complete metadata (opening date, runtime, cast, creative team)
            - [ ] Image verification

            ### Shows to process:
            ${slugs.map(s => `- [ ] \`${s}\``).join('\n')}

            ### How to gather review data

            Run the data agent or manually add reviews to \`reviews.json\`:

            \`\`\`bash
            # Check the pending shows file
            cat data/new-shows-pending.json

            # Run data agent (if available)
            node scripts/gather-reviews.js --shows=${slugs.join(',')}
            \`\`\`

            ---
            *This issue was auto-generated by the Broadway Show Discovery workflow*
            `;

            const title = shows.length === 1
              ? `🎭 New Show: ${shows[0].title}`
              : `🎭 ${shows.length} New Shows Discovered`;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: issueBody,
              labels: ['new-show', 'needs-review-data', 'automated']
            });

  # Optional: Trigger review data gathering workflow
  # Note: Only triggers for shows that have opened (not previews)
  trigger-data-agent:
    needs: update-shows
    if: |
      (needs.update-shows.outputs.new_shows_count != '' && needs.update-shows.outputs.new_shows_count != '0') ||
      (needs.update-shows.outputs.opened_count != '' && needs.update-shows.outputs.opened_count != '0')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout to filter previews shows
        uses: actions/checkout@v4
        with:
          ref: main


      - name: Checkout core data
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
      - name: Combine discovered and opened shows
        id: filter
        run: |
          new_slugs="${{ needs.update-shows.outputs.new_slugs }}"
          opened_slugs="${{ needs.update-shows.outputs.opened_slugs }}"

          # Combine both sources, dedup
          # Include open + closed shows (they have reviews to gather)
          # Skip previews (no reviews published yet)
          all_slugs=""
          for slug in $(echo "$new_slugs,$opened_slugs" | tr ',' '\n' | sort -u); do
            [ -z "$slug" ] && continue
            status=$(node -e "const shows = require('./data/shows.json'); const show = shows.shows.find(s => s.id === '$slug' || s.slug === '$slug'); console.log(show?.status || 'unknown');")
            if [ "$status" = "open" ] || [ "$status" = "closed" ]; then
              [ -n "$all_slugs" ] && all_slugs="$all_slugs,$slug" || all_slugs="$slug"
            fi
          done

          echo "opened_shows=$all_slugs" >> $GITHUB_OUTPUT
          echo "Combined shows for data pipelines: $all_slugs"

          # Also output ALL new shows (including previews) for cast backfill
          # Cast data is available on IBDB as soon as previews begin
          # Skip OB/WE shows — IBDB is Broadway-only
          all_cast_slugs=""
          for slug in $(echo "$new_slugs,$opened_slugs" | tr ',' '\n' | sort -u); do
            [ -z "$slug" ] && continue
            category=$(node -e "const shows = require('./data/shows.json'); const show = shows.shows.find(s => s.id === '$slug' || s.slug === '$slug'); console.log(show?.category || 'broadway');")
            if [ "$category" != "broadway" ] && [ "$category" != "" ]; then
              echo "Skipping cast backfill for non-Broadway show: $slug ($category)"
              continue
            fi
            [ -n "$all_cast_slugs" ] && all_cast_slugs="$all_cast_slugs,$slug" || all_cast_slugs="$slug"
          done
          echo "cast_shows=$all_cast_slugs" >> $GITHUB_OUTPUT
          echo "Shows for cast backfill (incl previews): $all_cast_slugs"

      - name: Trigger data agent workflow
        if: steps.filter.outputs.opened_shows != ''
        uses: actions/github-script@v7
        with:
          script: |
            // Check if the gather-reviews workflow exists
            try {
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'gather-reviews.yml',
                ref: 'main',
                inputs: {
                  shows: '${{ steps.filter.outputs.opened_shows }}',
                  max_tier: '3'
                }
              });
              console.log('Triggered gather-reviews workflow for opened shows (max_tier=3)');
            } catch (e) {
              // Workflow doesn't exist yet, that's okay
              console.log('gather-reviews workflow not found, skipping trigger');
            }

      - name: Trigger Reddit sentiment workflow
        if: steps.filter.outputs.opened_shows != ''
        uses: actions/github-script@v7
        with:
          script: |
            // Trigger Reddit sentiment scraping for newly opened shows
            try {
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'update-reddit-sentiment.yml',
                ref: 'main',
                inputs: {
                  shows: '${{ steps.filter.outputs.opened_shows }}'
                }
              });
              console.log('Triggered Reddit sentiment workflow for opened shows: ${{ steps.filter.outputs.opened_shows }}');
            } catch (e) {
              console.log('Reddit sentiment workflow trigger failed:', e.message);
            }

      - name: Trigger Show Score workflow
        if: steps.filter.outputs.opened_shows != ''
        uses: actions/github-script@v7
        with:
          script: |
            // Trigger Show Score scraping for newly opened shows
            try {
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'update-show-score.yml',
                ref: 'main',
                inputs: {
                  shows: '${{ steps.filter.outputs.opened_shows }}'
                }
              });
              console.log('Triggered Show Score workflow for opened shows: ${{ steps.filter.outputs.opened_shows }}');
            } catch (e) {
              console.log('Show Score workflow trigger failed:', e.message);
            }

      - name: Trigger Mezzanine workflow
        if: steps.filter.outputs.opened_shows != ''
        uses: actions/github-script@v7
        with:
          script: |
            // Trigger Mezzanine scraping for newly opened shows
            try {
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'update-mezzanine.yml',
                ref: 'main',
                inputs: {
                  shows: '${{ steps.filter.outputs.opened_shows }}'
                }
              });
              console.log('Triggered Mezzanine workflow for opened shows: ${{ steps.filter.outputs.opened_shows }}');
            } catch (e) {
              console.log('Mezzanine workflow trigger failed:', e.message);
            }

      - name: Trigger image fetching workflow
        if: steps.filter.outputs.opened_shows != ''
        uses: actions/github-script@v7
        with:
          script: |
            // Trigger image fetching + archival for newly opened shows
            try {
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'fetch-all-image-formats.yml',
                ref: 'main',
                inputs: {
                  only_missing: 'true'
                }
              });
              console.log('Triggered image fetching workflow for newly opened shows');
            } catch (e) {
              console.log('Image fetching workflow trigger failed:', e.message);
            }

      - name: Trigger cast backfill for new shows
        if: steps.filter.outputs.cast_shows != ''
        uses: actions/github-script@v7
        with:
          script: |
            // Trigger IBDB cast scraping for each new show (including previews)
            const slugs = '${{ steps.filter.outputs.cast_shows }}'.split(',').filter(Boolean);
            for (const slug of slugs) {
              try {
                await github.rest.actions.createWorkflowDispatch({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id: 'backfill-cast.yml',
                  ref: 'main',
                  inputs: {
                    show_filter: slug
                  }
                });
                console.log(`Triggered cast backfill for: ${slug}`);
                // 10s spacing between dispatch calls
                await new Promise(r => setTimeout(r, 10000));
              } catch (e) {
                console.log(`Cast backfill trigger failed for ${slug}:`, e.message);
              }
            }

      - name: Trigger WE outlet-based SERP collection for new WE shows
        if: needs.update-shows.outputs.we_new_count != '' && needs.update-shows.outputs.we_new_count != '0'
        uses: actions/github-script@v7
        with:
          script: |
            // Trigger outlet-based SERP collection for new West End shows
            try {
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'collect-outlet-reviews.yml',
                ref: 'main',
                inputs: {
                  market: 'west-end',
                  max_tier: '2',
                  max_searches: '200'
                }
              });
              console.log('Triggered WE outlet-based SERP collection');
            } catch (e) {
              console.log('WE outlet SERP trigger failed:', e.message);
            }

      - name: Trigger social media post for opened shows
        if: steps.filter.outputs.opened_shows != ''
        uses: actions/github-script@v7
        with:
          script: |
            // Post to social media for each newly opened show
            const slugs = '${{ steps.filter.outputs.opened_shows }}'.split(',').filter(Boolean);
            for (const slug of slugs) {
              try {
                await github.rest.actions.createWorkflowDispatch({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id: 'social-post.yml',
                  ref: 'main',
                  inputs: {
                    event: 'opened',
                    show: slug
                  }
                });
                console.log(`Triggered social post for opened show: ${slug}`);
              } catch (e) {
                console.log(`Social post trigger failed for ${slug}:`, e.message);
              }
            }

      - name: Trigger review text collection for opened shows
        if: steps.filter.outputs.opened_shows != ''
        uses: actions/github-script@v7
        with:
          script: |
            // Trigger full text collection for each newly opened show
            const slugs = '${{ steps.filter.outputs.opened_shows }}'.split(',').filter(Boolean);
            for (const slug of slugs) {
              try {
                await github.rest.actions.createWorkflowDispatch({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id: 'collect-review-texts.yml',
                  ref: 'main',
                  inputs: {
                    show_filter: slug,
                    max_reviews: '0'
                  }
                });
                console.log(`Triggered review text collection for: ${slug}`);
                await new Promise(r => setTimeout(r, 10000));
              } catch (e) {
                console.log(`Review text collection trigger failed for ${slug}:`, e.message);
              }
            }

  # Safety net: catch open shows that slipped through without review collection
  catchup-zero-review-shows:
    needs: update-shows
    if: always() && needs.update-shows.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Checkout core data
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Find open shows with zero reviews
        id: find-gaps
        run: |
          GAPS=$(node -e "
            const shows = require('./data/shows.json').shows;
            const reviews = require('./data/reviews.json').reviews;
            const rc = {};
            for (const r of reviews) rc[r.showId] = (rc[r.showId] || 0) + 1;

            // Open shows with 0 reviews that opened 3+ days ago (give initial pipeline time)
            const cutoff = new Date(Date.now() - 3 * 86400000).toISOString().slice(0, 10);
            const gaps = shows.filter(s =>
              s.status === 'open' &&
              !rc[s.id] &&
              s.openingDate && s.openingDate <= cutoff
            );

            // Limit to 10 per day to avoid overloading
            const batch = gaps.slice(0, 10).map(s => s.id);
            console.log(batch.join(','));
          ")

          echo "gap_shows=$GAPS" >> $GITHUB_OUTPUT
          if [ -n "$GAPS" ]; then
            COUNT=$(echo "$GAPS" | tr ',' '\n' | wc -l | tr -d ' ')
            echo "Found $COUNT open shows with 0 reviews needing collection"
          else
            echo "No zero-review gap shows found"
          fi

      - name: Dispatch gather-reviews for gap shows
        if: steps.find-gaps.outputs.gap_shows != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Dispatching gather-reviews for: ${{ steps.find-gaps.outputs.gap_shows }}"
          gh workflow run gather-reviews.yml -f shows="${{ steps.find-gaps.outputs.gap_shows }}" || echo "Dispatch failed"

  # Alert on consecutive failures
  alert-on-failure:
    needs: update-shows
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main


      - name: Checkout core data
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
      - name: Notify on failure
        uses: ./.github/actions/notify-failure
        with:
          title: 'Update Shows Failed'
          discord_webhook: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}

      - name: Check consecutive failures
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Count recent consecutive failures
          FAILURES=$(gh run list --workflow="Update Shows" --limit=5 --json conclusion -q '[.[] | select(.conclusion == "failure")] | length')
          echo "Recent failures: $FAILURES out of last 5 runs"
          echo "failure_count=$FAILURES" >> $GITHUB_OUTPUT

      - name: Send alert on 3+ consecutive failures
        if: steps.check.outputs.failure_count >= 3
        env:
          DISCORD_WEBHOOK_ALERTS: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
        run: |
          node -e "
            const { sendAlert } = require('./scripts/lib/discord-notify.js');
            sendAlert({
              title: 'Show Discovery Pipeline — ${{ steps.check.outputs.failure_count }} consecutive failures',
              description: 'The Update Shows workflow has failed ${{ steps.check.outputs.failure_count }} of the last 5 runs. New shows may not be getting discovered. Check Broadway.org scraper and API credits.',
              severity: 'error',
              email: true,
              url: 'https://github.com/thomaspryor/Broadwayscore/actions/workflows/update-show-status.yml'
            }).catch(e => console.error('Alert failed:', e.message));
          "
