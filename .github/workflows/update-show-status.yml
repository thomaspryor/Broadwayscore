                  shows: '${{ steps.filter.outputs.opened_shows }}',
                  model: 'o4-mini',
                  budget: '20',
                  max_shows: '3'
                }
              });
              console.log('Triggered Deep Research for opened shows: ${{ steps.filter.outputs.opened_shows }}');
            } catch (e) {
              console.log('Deep Research trigger failed:', e.message);
            }

      - name: Trigger Opening Night Poller for opened shows
        if: needs.update-shows.outputs.opened_count != '' && needs.update-shows.outputs.opened_count != '0'
        uses: actions/github-script@v7
        with:
          script: |
            // Dispatch the opening night poller to discover reviews for newly opened shows
            try {
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'opening-night-poller.yml',
                ref: 'main',
                inputs: {}
              });
              console.log('Triggered Opening Night Poller for opened shows');
            } catch (e) {
              console.log('Opening Night Poller trigger failed:', e.message);
            }

      - name: Trigger Opening Night Broadcast (preview to owner)
        if: needs.update-shows.outputs.opened_count != '' && needs.update-shows.outputs.opened_count != '0'
        uses: actions/github-script@v7
        with:
          script: |
            // Dispatch the broadcast — defaults to preview-to-owner only.
            // Owner must manually re-dispatch with send_to_all=true to send to subscribers.
            try {
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'opening-night-broadcast.yml',
                ref: 'main',
                inputs: {}
              });
              console.log('Triggered Opening Night Broadcast (preview mode) for opened shows');
            } catch (e) {
              console.log('Opening Night Broadcast trigger failed:', e.message);
            }

      - name: Submit new show pages to Google Indexing API + IndexNow
        continue-on-error: true
        env:
          GOOGLE_INDEXING_KEY: ${{ secrets.GOOGLE_INDEXING_KEY }}
        run: |
          # Submit ALL new + opened shows (not just opened) — pages should be indexed as soon as discovered
          NEW_SLUGS="${{ needs.update-shows.outputs.new_slugs }}"
          OPENED_SLUGS="${{ needs.update-shows.outputs.opened_slugs }}"
          ALL_SLUGS=$(echo "$NEW_SLUGS,$OPENED_SLUGS" | tr ',' '\n' | sort -u | tr '\n' ',' | sed 's/,$//')
          ALL_SLUGS=$(echo "$ALL_SLUGS" | sed 's/^,//')

          if [ -z "$ALL_SLUGS" ] || [ "$ALL_SLUGS" = "" ]; then
            echo "No new show slugs to submit"
            exit 0
          fi

          echo "Submitting show pages to search engines: $ALL_SLUGS"

          # Convert show IDs to URL slugs
          SLUGS=$(node -e "
            const shows = require('./data/shows.json').shows;
            const ids = '$ALL_SLUGS'.split(',').filter(Boolean);
            const slugs = ids.map(id => {
              const s = shows.find(x => x.id === id);
              return s ? (s.slug || s.id) : id;
            });
            console.log(slugs.join(','));
          ")

          # Google Indexing API
          if [ -n "$GOOGLE_INDEXING_KEY" ]; then
            node scripts/submit-google-indexing.js --shows "$SLUGS" || true
          fi

          # IndexNow (Bing, Yandex, etc.)
          node scripts/submit-indexnow.js --shows "$SLUGS" || true

      # submit-google-indexing.js records usage in the shared daily quota
      # ledger (data/audit/indexing-api-usage.json, 200/day). This job never
      # commits, so without this step the run's usage is silently discarded
      # and other same-day callers (check-seo-health, opening-night-broadcast)
      # undercount the quota.
      - name: Record indexing quota usage
        continue-on-error: true
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          bash scripts/lib/git-add-existing.sh data/audit/indexing-api-usage.json
          if git diff --staged --quiet; then
            echo "No quota usage to record"
            exit 0
          fi
          git commit -m "chore: Record indexing API quota usage [skip ci]"
          bash scripts/lib/push-with-retry.sh || echo "::warning::Quota ledger push failed"

  # Safety net: catch open shows that slipped through without review collection
  catchup-zero-review-shows:
    needs: update-shows
    if: always() && needs.update-shows.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Checkout core data
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Find open shows with zero reviews
        id: find-gaps
        run: |
          GAPS=$(node -e "
            const shows = require('./data/shows.json').shows;
            const reviews = require('./data/reviews.json').reviews;
            const rc = {};
            for (const r of reviews) rc[r.showId] = (rc[r.showId] || 0) + 1;

            // Open shows with 0 reviews that opened 3+ days ago (give initial pipeline time)
            const cutoff = new Date(Date.now() - 3 * 86400000).toISOString().slice(0, 10);
            const gaps = shows.filter(s =>
              s.status === 'open' &&
              !rc[s.id] &&
              s.openingDate && s.openingDate <= cutoff
            );

            // Limit to 10 per day to avoid overloading
            const batch = gaps.slice(0, 10).map(s => s.id);
            console.log(batch.join(','));
          ")

          echo "gap_shows=$GAPS" >> $GITHUB_OUTPUT
          if [ -n "$GAPS" ]; then
            COUNT=$(echo "$GAPS" | tr ',' '\n' | wc -l | tr -d ' ')
            echo "Found $COUNT open shows with 0 reviews needing collection"
          else
            echo "No zero-review gap shows found"
          fi

      - name: Dispatch gather-reviews for gap shows
        if: steps.find-gaps.outputs.gap_shows != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Dispatching gather-reviews for: ${{ steps.find-gaps.outputs.gap_shows }}"
          gh workflow run gather-reviews.yml -f shows="${{ steps.find-gaps.outputs.gap_shows }}" || echo "Dispatch failed"

  # Auto-trigger opening night readiness check for shows opening tomorrow
  check-opening-night-readiness:
    needs: update-shows
    if: always() && needs.update-shows.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - name: Checkout core data
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
      - name: Check for shows opening tomorrow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TOMORROW=$(date -u -d "+1 day" +%Y-%m-%d 2>/dev/null || date -u -v+1d +%Y-%m-%d)
          echo "Checking for shows opening on $TOMORROW..."
          SHOWS=$(node -e "
            const shows = require('./data/shows.json').shows;
            const opening = shows.filter(s => s.openingDate === '$TOMORROW' && s.status !== 'closed');
            opening.forEach(s => console.log(s.id + '|' + (s.category || 'broadway')));
          " 2>/dev/null)

          if [ -z "$SHOWS" ]; then
            echo "No shows opening tomorrow. Skipping readiness check."
            exit 0
          fi

          echo "$SHOWS" | while IFS='|' read -r SHOW_ID MARKET; do
            echo "Triggering readiness check for: $SHOW_ID (market: $MARKET)"
            gh workflow run check-opening-night-readiness.yml -f show_id="$SHOW_ID" -f market="$MARKET" || echo "::warning::Failed to trigger readiness check for $SHOW_ID"
          done

  # Alert on consecutive failures
  alert-on-failure:
    needs: update-shows
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main


      - name: Checkout core data
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
      - name: Notify on failure
        uses: ./.github/actions/notify-failure
        with:
          title: 'Update Shows Failed'
          discord_webhook: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}

      # Streak counted over the last 10 scheduled runs (not 5, not workflow_dispatch).
      # Why filter to schedule: during 05-09 incident, 4 manual workflow_dispatch
      # retries interleaved with scheduled failures and would have buried the
      # failing run out of a 5-run window, suppressing the alert entirely. Why 10:
      # gives 2x headroom while still being recent enough that a streak signals
      # an ongoing condition, not historical noise.
      - name: Check consecutive failures
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FAILURES=$(gh run list --workflow=update-show-status.yml --event=schedule --limit=10 \
            --json conclusion -q '[.[] | select(.conclusion == "failure")] | length')
          echo "Recent failures: $FAILURES out of last 10 scheduled runs"
          echo "failure_count=$FAILURES" >> "$GITHUB_OUTPUT"

      # This job only runs `if: failure()`, so this step never sees a fully
      # green run — but a later failing run can still see failure_count drop
      # below 6 as older failures age out of the trailing-10 window. Resolving
      # here (rather than requiring a success run that never triggers this
      # job) means the NEXT time the streak climbs back to 6+, routeAlert
      # treats it as a fresh incident and pages immediately instead of
      # silently waiting out the 7-day cooldown.
      - name: Resolve repeat-failure condition if streak has dropped
        if: fromJSON(steps.check.outputs.failure_count) < 6
        run: |
          node -e '
            const { resolveCondition } = require("./scripts/lib/owner-alert-router.js");
            resolveCondition("update-show-status:repeat-failure");
          '

      # Resolve the actual failing step from THIS run. Previously this used
      # `gh run list --status=failure --limit=5 --jq '.[0]'` which coincidentally
      # returned the in-flight current run, but the design was misleading — and
      # `[0]` could surface a prior failure if a future caller changed the
      # surrounding context. github.run_id is deterministic and self-documenting.
      # Note: the jobs API for the current in-flight run still surfaces the
      # already-finished `update-shows` job (verified against real failed runs).
      - name: Resolve failing step + run URL
        id: step-info
        if: fromJSON(steps.check.outputs.failure_count) >= 6
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          RUN_URL="https://github.com/${REPO}/actions/runs/${RUN_ID}"
          FAILING_STEP=$(gh api "repos/${REPO}/actions/runs/${RUN_ID}/jobs" \
            --jq '[.jobs[] | select(.name=="update-shows") | .steps[]? | select(.conclusion=="failure")][0].name // "unknown"')
          echo "failing_step=${FAILING_STEP}" >> "$GITHUB_OUTPUT"
          echo "run_url=${RUN_URL}" >> "$GITHUB_OUTPUT"
          echo "Failing step in update-shows job: ${FAILING_STEP}"
          echo "Run URL: ${RUN_URL}"

      - name: Send alert on 6+ consecutive failures
        if: fromJSON(steps.check.outputs.failure_count) >= 6
        env:
          DISCORD_WEBHOOK_ALERTS: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
          FAILURE_COUNT: ${{ steps.check.outputs.failure_count }}
          FAILING_STEP: ${{ steps.step-info.outputs.failing_step }}
          RUN_URL: ${{ steps.step-info.outputs.run_url }}
          PRE_VALIDATION_STATUS: ${{ needs.update-shows.outputs.pre_validation_status }}
        run: |
          node -e '
            const { routeAlert } = require("./scripts/lib/owner-alert-router.js");
            const count = process.env.FAILURE_COUNT;
            const step = process.env.FAILING_STEP || "unknown";
            const runUrl = process.env.RUN_URL || undefined;
            const preValidation = process.env.PRE_VALIDATION_STATUS || "";

            // Match order matters: Pre-validate FIRST because /Validate data/i
            // would also match "Pre-validate existing data". Both rules use
            // anchored ^...$ to keep matching deterministic.
            //
            // Task #649: "Validate data" and "Compute validation error
            // set-diff" both run with continue-on-error, so they can no
            // longer be the failing step reported by the gh api query below
            // (their conclusion is always success). "Commit gate" is the
            // step that actually fails the job now, and only for a
            // genuinely NEW error — a pre-existing-only failure no longer
            // reaches this alert at all, since the commit still lands.
            let hint;
            if (/^Pre-validate /i.test(step)) {
              hint = "Pre-validation step itself errored — investigate validate-data.js for a thrown exception (not just a non-zero exit). continue-on-error should swallow a clean exit-1, so a real failure here means an uncaught throw or process crash.";
            } else if (/^Commit gate/i.test(step)) {
              hint = "Discovery/enrichment introduced a NEW validation error not present before this run (task #649 set-diff) — a pre-existing, unrelated error alone no longer blocks the commit. Check data/audit/discovery-blocked/ (new_errors_preview) or the run's step summary for the specific error.";
            } else if (/^Discover new shows$/i.test(step)) {
              hint = "discover-new-shows.js itself failed. Check Broadway.org availability and ScrapingBee/Bright Data credits.";
            } else if (/^Update show statuses$/i.test(step)) {
              hint = "update-show-status.js (status transitions) failed before discovery ran. Check ShowScore + aggregator availability.";
            } else {
              hint = "Inspect the failing step in the linked run.";
            }

            routeAlert({
              conditionKey: "update-show-status:repeat-failure",
              title: "Update Shows — " + count + " of last 10 scheduled runs failed",
              description: "Failing step: `" + step + "`. " + hint,
              severity: "error",
              disposition: "human",
              url: runUrl,
              fields: [
                { name: "Failing step", value: "`" + step + "`" },
                { name: "Most recent failed run", value: runUrl || "(unknown)" },
                { name: "Pre-discovery validation", value: preValidation || "(not set)" }
              ]
            }).catch(e => console.error("Alert failed:", e.message));
          '

      - name: Commit alert ledger
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # MUST commit here or the routeAlert/resolveCondition ledger state
          # never persists across daily cron runs — the alert would re-open
          # and re-email every run, reintroducing the exact storm this
          # migration fixes (#486, same class as #406's opening-night fix).
          git add data/audit/alert-ledger.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No ledger changes to commit"
          else
            git commit -m "audit: update-show-status alert ledger [skip ci]"
            bash scripts/lib/push-with-retry.sh 5 main
          fi
