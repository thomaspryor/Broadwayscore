name: Update Mezzanine Data

on:
  schedule:
    # Weekly on Sundays at 1 PM UTC (8 AM EST), after Show Score at 12 PM
    - cron: '0 13 * * 0'
  workflow_dispatch:
    inputs:
      show:
        description: 'Single show ID to update (e.g., hamilton-2015)'
        required: false
        type: string
      shows:
        description: 'Comma-separated show IDs or "missing" for shows without Mezzanine data'
        required: false
        type: string
      limit:
        description: 'Max number of shows to process'
        required: false
        type: number
        default: 0
      dry_run:
        description: 'Dry run (no writes)'
        required: false
        type: boolean
        default: false
  # Also trigger when new shows open
  repository_dispatch:
    types: [show-opened]

concurrency:
  # Per-run concurrency prevents the orchestrator's back-to-back dispatches from
  # dropping each other at GitHub's 1-pending-queue limit. See Cats 2026-04-07
  # poller postmortem — shared groups silently discard the middle runs.
  group: mezzanine-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape-mezzanine:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5


      - name: Checkout core data
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Run Mezzanine scraper
        env:
          MEZZANINE_APP_ID: ${{ secrets.MEZZANINE_APP_ID }}
          MEZZANINE_SESSION_TOKEN: ${{ secrets.MEZZANINE_SESSION_TOKEN }}
        run: |
          ARGS="--verbose"

          if [ -n "${{ inputs.show }}" ]; then
            ARGS="$ARGS --show=${{ inputs.show }}"
          fi

          if [ -n "${{ inputs.shows }}" ]; then
            ARGS="$ARGS --shows=${{ inputs.shows }}"
          fi

          if [ "${{ inputs.limit }}" != "0" ] && [ -n "${{ inputs.limit }}" ]; then
            ARGS="$ARGS --limit=${{ inputs.limit }}"
          fi

          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi

          node scripts/scrape-mezzanine-audience.js $ARGS

      - name: Send alert on failure (Discord + email)
        if: failure()
        uses: actions/github-script@v7
        env:
          DISCORD_WEBHOOK_ALERTS: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
        with:
          script: |
            const { sendAlert } = require('./scripts/lib/discord-notify.js');
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await sendAlert({
              title: 'Mezzanine Scraper Failed',
              description: 'The Mezzanine audience data update failed. **The session token may have expired.** To fix: set up mitmproxy on your Mac, proxy iPhone traffic through it, open the Mezzanine app, then update the `MEZZANINE_SESSION_TOKEN` GitHub Secret with the new token.',
              severity: 'error',
              email: true,
              fields: [
                { name: 'Action Required', value: 'Re-intercept Mezzanine iOS app via mitmproxy' },
                { name: 'Run', value: `[View logs](${runUrl})` }
              ],
              url: runUrl
            }).catch(e => console.error('Alert notification failed:', e.message));

      - name: Commit and push changes
        if: always() && inputs.dry_run != true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stage the public-repo coverage audit so health-check.js can read it
          # in tomorrow's digest. (audience-buzz.json lives in the private repo
          # and is pushed by the push-core-data action below.)
          if [ -f data/audit/mezzanine-coverage.json ]; then
            git add data/audit/mezzanine-coverage.json
          fi

          # Core data files pushed to private repo by push-core-data action
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "data: Update Mezzanine audience scores"

          bash scripts/lib/push-with-retry.sh

          echo "Failed to push after 5 attempts"
          exit 1


      - name: Push core data to private repo
        if: always()
        uses: ./.github/actions/push-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
          message: 'data: Update from update-mezzanine'

      - name: Dispatch deploy
        if: always()
        uses: ./.github/actions/dispatch-deploy

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: 'Update Mezzanine Data Failed'
          discord_webhook: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
          resend_api_key: ${{ secrets.RESEND_API_KEY }}
          owner_email: ${{ secrets.OWNER_EMAIL }}