name: Check Cookie Health
on:
  schedule:
    - cron: '0 14 * * 2'  # Tuesday 2 PM UTC (9 AM EST)
    - cron: '0 14 * * 5'  # Friday 2 PM UTC (9 AM EST)
  workflow_dispatch:
    inputs:
      live_check:
        description: 'Run Layer 3 live access test (costs ~175 ScrapingBee credits)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write
  actions: read

# Shares data-health-check.yml's group: this job now writes the alert ledger
# (routeAlert, BRO-6628) and the retry-push helper keeps one side of data/audit
# conflicts wholesale, so overlapping writers would drop cooldown state.
concurrency:
  group: data-health-check
  cancel-in-progress: false

jobs:
  check-cookies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      # routeAlert files Linear issues through scripts/lib/linear-client.js (BRO-6628).
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Check cookie health
        env:
          # Scheduled runs always do the live test (catches sessions that died
          # server-side while cookie expiry still looks healthy — the silent
          # Stage logout, 2026-05-29). Manual dispatch honors the input.
          LIVE_CHECK: ${{ github.event_name == 'workflow_dispatch' && inputs.live_check || 'true' }}
          SCRAPINGBEE_API_KEY: ${{ secrets.SCRAPINGBEE_API_KEY }}
          BRIGHTDATA_TOKEN: ${{ secrets.BRIGHTDATA_TOKEN }}
          DISCORD_WEBHOOK_ALERTS: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
          # Expired/expiring T1 auth cookies open a Linear card (BRO-6628).
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          # Critical outlet cookies
          COOKIES_BUNDLE_1: ${{ secrets.COOKIES_BUNDLE_1 }}
          COOKIES_BUNDLE_2: ${{ secrets.COOKIES_BUNDLE_2 }}
          COOKIES_BUNDLE_3: ${{ secrets.COOKIES_BUNDLE_3 }}
          COOKIES_BUNDLE_4: ${{ secrets.COOKIES_BUNDLE_4 }}
          COOKIES_BUNDLE_5: ${{ secrets.COOKIES_BUNDLE_5 }}
          COOKIES_BUNDLE_6: ${{ secrets.COOKIES_BUNDLE_6 }}
          COOKIES_BUNDLE_7: ${{ secrets.COOKIES_BUNDLE_7 }}
          COOKIES_BUNDLE_8: ${{ secrets.COOKIES_BUNDLE_8 }}
          COOKIES_BUNDLE_9: ${{ secrets.COOKIES_BUNDLE_9 }}
          COOKIES_BUNDLE_10: ${{ secrets.COOKIES_BUNDLE_10 }}
          COOKIES_BUNDLE_11: ${{ secrets.COOKIES_BUNDLE_11 }}
          WSJ_COOKIES: ${{ secrets.WSJ_COOKIES }}
          WSJ_COOKIES_META: ${{ secrets.WSJ_COOKIES_META }}
          # Other outlet cookies
        run: node scripts/check-cookie-health.js

      # The card's cooldown ledger must leave the runner or every run re-files the
      # same incident. if: always() so the red (cookie expired) run persists it too.
      - name: Commit alert state
        if: always()
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/audit/alert-ledger.json data/audit/alert-digest-queue.json data/audit/alert-router-attempts.jsonl 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No alert state changes"
          else
            git commit -m "data: cookie health alert state [skip ci]"
            bash scripts/lib/push-with-retry.sh
          fi

      - name: Commit scraper-spend ledger
        if: always()
        continue-on-error: true
        uses: ./.github/actions/commit-scraper-spend-ledger
        with:
          workflow-name: check-cookie-health

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: 'Cookie Health Check Failed'
          email: 'true'
          discord_webhook: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
          resend_api_key: ${{ secrets.RESEND_API_KEY }}
          owner_email: ${{ secrets.OWNER_EMAIL }}
