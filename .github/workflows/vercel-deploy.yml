name: Deploy to Vercel

on:
  push:
    branches: [main]
    paths:
      # Serverless functions
      - 'api/**'
      # Application code
      - 'src/**'
      - 'public/**'
      - 'content/**'
      # Config files
      - 'next.config.*'
      - 'vercel.json'
      - 'tailwind.config.*'
      - 'tsconfig.*'
      - 'package.json'
      - 'package-lock.json'
      # Build-relevant data files (imported at build time)
      # NOTE: Core data files (shows.json, reviews.json, etc.) are in private repo
      # and won't trigger deploys via path match. Terminal workflows dispatch deploys directly.
      - 'data/lottery-rush.json'
      - 'data/awards.json'
      - 'data/gold-lists-computed.json'
      # NOTE: data/audit/seo-* is NOT listed here, so SEO health check pushes won't trigger deploys
  workflow_dispatch: # Manual trigger

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: vercel-production-deploy
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4


      - name: Checkout core data
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
      - name: Verify Vercel build guard is active
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          SETTING=$(curl -s -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/prj_wmBnDUrCQCwabIAYPbnMiIP3wg15" \
            | node -e "const d=JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')); console.log(d.commandForIgnoringBuildStep || 'NOT SET')")
          echo "commandForIgnoringBuildStep: $SETTING"
          if [ "$SETTING" != "exit 0" ]; then
            echo "::warning::Build guard is NOT set to 'exit 0' — fixing now..."
            curl -s -X PATCH -H "Authorization: Bearer $VERCEL_TOKEN" -H "Content-Type: application/json" \
              "https://api.vercel.com/v9/projects/prj_wmBnDUrCQCwabIAYPbnMiIP3wg15" \
              -d '{"commandForIgnoringBuildStep":"exit 0"}'
            echo "::warning::Build guard restored to 'exit 0'. Git-triggered builds were unblocked — check Vercel billing."
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache Vercel CLI
        id: vercel-cli-cache
        uses: actions/cache@v4
        with:
          path: ~/.npm/_npx
          key: vercel-cli-${{ runner.os }}

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Pull Vercel Environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production --token=$VERCEL_TOKEN

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-cache-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            nextjs-cache-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            nextjs-cache-${{ runner.os }}-

      - name: Build
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --prod --token=$VERCEL_TOKEN

      - name: Deploy to Production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          URL=$(vercel deploy --prebuilt --prod --archive=tgz --token=$VERCEL_TOKEN)
          echo "Deployed to production: $URL"

      - name: Smoke test production
        run: |
          echo "Waiting 30s for deployment to propagate..."
          sleep 30
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://broadwayscorecard.com/)
          echo "Homepage returned HTTP $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "::error::Production smoke test failed — homepage returned HTTP $STATUS"
            exit 1
          fi
          # Check a show page too
          STATUS2=$(curl -s -o /dev/null -w "%{http_code}" https://broadwayscorecard.com/show/wicked)
          echo "Show page returned HTTP $STATUS2"
          if [ "$STATUS2" != "200" ]; then
            echo "::error::Production smoke test failed — show page returned HTTP $STATUS2"
            exit 1
          fi
          # Check Tony Awards hub
          STATUS3=$(curl -s -o /dev/null -w "%{http_code}" https://broadwayscorecard.com/tony-awards)
          echo "Tony Awards hub returned HTTP $STATUS3"
          if [ "$STATUS3" != "200" ]; then
            echo "::error::Production smoke test failed — Tony Awards hub returned HTTP $STATUS3"
            exit 1
          fi
          echo "Smoke test passed — production is live"

      - name: Notify search engines of updated sitemap
        if: success()
        continue-on-error: true
        env:
          GOOGLE_INDEXING_KEY: ${{ secrets.GOOGLE_INDEXING_KEY }}
        run: |
          # Bing ping (still functional)
          curl -s "https://www.bing.com/ping?sitemap=https://broadwayscorecard.com/sitemap.xml" || true
          # Google: re-submit sitemap via Search Console Sitemaps API
          if [ -n "$GOOGLE_INDEXING_KEY" ]; then
            node scripts/submit-google-indexing.js --submit-sitemap || true
          fi
