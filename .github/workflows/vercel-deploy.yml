name: Deploy to Vercel

on:
  push:
    branches: [main]
    paths:
      # Application code
      - 'src/**'
      - 'public/**'
      - 'content/**'
      # Config files
      - 'next.config.*'
      - 'vercel.json'
      - 'tailwind.config.*'
      - 'tsconfig.*'
      - 'package.json'
      - 'package-lock.json'
      # Build-relevant data files (imported at build time)
      - 'data/shows.json'
      - 'data/reviews.json'
      - 'data/grosses.json'
      - 'data/grosses-history.json'
      - 'data/commercial.json'
      - 'data/audience-buzz.json'
      - 'data/critic-consensus.json'
      - 'data/lottery-rush.json'
      - 'data/awards.json'
      - 'data/gold-lists-computed.json'
      - 'data/critic-registry.json'
  workflow_dispatch: # Manual trigger

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: vercel-production-deploy
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Pull Vercel Environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production --token=$VERCEL_TOKEN

      - name: Build
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --prod --token=$VERCEL_TOKEN

      - name: Deploy Prebuilt (preview)
        id: preview
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          URL=$(vercel deploy --prebuilt --archive=tgz --token=$VERCEL_TOKEN)
          echo "preview_url=$URL" >> "$GITHUB_OUTPUT"
          echo "Preview deployed to: $URL"

      - name: Promote to Production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          vercel promote ${{ steps.preview.outputs.preview_url }} --token=$VERCEL_TOKEN
          echo "Promoted to production"
