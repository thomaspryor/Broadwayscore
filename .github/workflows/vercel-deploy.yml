name: Deploy to Vercel

on:
  push:
    branches: [main]
    paths:
      # Application code
      - 'src/**'
      - 'public/**'
      - 'content/**'
      # Config files
      - 'next.config.*'
      - 'vercel.json'
      - 'tailwind.config.*'
      - 'tsconfig.*'
      - 'package.json'
      - 'package-lock.json'
      # Build-relevant data files (imported at build time)
      - 'data/shows.json'
      - 'data/reviews.json'
      - 'data/grosses.json'
      - 'data/grosses-history.json'
      - 'data/commercial.json'
      - 'data/audience-buzz.json'
      - 'data/critic-consensus.json'
      - 'data/lottery-rush.json'
      - 'data/awards.json'
      - 'data/gold-lists-computed.json'
      - 'data/critic-registry.json'
  workflow_dispatch: # Manual trigger

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via Vercel API
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          echo "Creating Vercel production deployment via API..."
          RESPONSE=$(curl -s -X POST \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"name":"broadwayscore","target":"production","gitSource":{"type":"github","ref":"main","org":"thomaspryor","repo":"Broadwayscore"}}' \
            "https://api.vercel.com/v13/deployments?teamId=team_zvgatcxkXdPbfhtHQMOnjpXo")

          DEP_ID=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('id','FAILED'))")
          DEP_URL=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('url','unknown'))")

          if [ "$DEP_ID" = "FAILED" ]; then
            echo "ERROR: Failed to create deployment"
            echo "$RESPONSE"
            exit 1
          fi

          echo "Deployment created: $DEP_ID"
          echo "URL: https://$DEP_URL"
          echo "Deploy will build and promote to production automatically."
