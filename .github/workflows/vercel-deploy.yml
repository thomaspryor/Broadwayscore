name: Deploy to Vercel

on:
  # 5-min cron coordinator (replaced per-push trigger on 2026-05-16). With 10+
  # parallel sessions pushing to main, the per-push trigger produced cascading
  # deploy cancellations — Vercel server-side dedup killed older builds
  # mid-prerender before any could complete, and even the "latest" deploy
  # could be cancelled mid-build by the next push. The cron batches pushes:
  # at most one deploy per 5-min window, and the should-deploy preflight job
  # below skips ticks with no site-relevant change vs the live deploy
  # (scripts/lib/should-deploy-gate.js). See
  # memory/feedback_workflow_cascade_prevention.md. The demo workflow solved
  # the same cascade with the same fix in 2026-04 (see vercel-demo.yml L17-19).
  schedule:
    - cron: '*/5 * * * *'
  # Deploy-before-rebuild race fix (Beaches 2026-04-22 postmortem #9):
  # When a rebuild finishes successfully, refresh production so the newly-rebuilt
  # reviews.json actually ships. Without this, the next cron tick may run
  # before main HEAD changes (private-repo push), and production serves stale
  # counts. Rebuild Reviews (Fast) is the path used for opening-night corrections.
  # Job-level guard (see should-deploy.if) skips failures. Part of P1 redesign
  # card 34b637c5-416f-8126-bb13-e12fb737bed2.
  workflow_run:
    workflows: ["Rebuild Reviews Data", "Rebuild Reviews (Fast)"]
    types: [completed]
  workflow_dispatch: # Manual trigger — "ship NOW" path (opening night, broken page)

permissions:
  contents: write
  actions: write   # needed for gh workflow run (watermark dispatch)

jobs:
  # Preflight: decide whether to actually deploy. Runs on every trigger
  # (~15s). All skip/proceed logic lives in scripts/lib/should-deploy-gate.js
  # (pure decide() + colocated test — see its header for the full rules):
  #   - Baseline = latest READY Vercel production deployment (via
  #     check-prod-deploy.js --json), NOT GitHub run conclusions — a run can
  #     report success while its Vercel deploy was CANCELED (2026-06-26), and
  #     skipped preflights also conclude "success" (stale-baseline bug in the
  #     old gh-run-list lookup).
  #   - Scheduled ticks skip only on positive proof: HEAD already live, or no
  #     site-path diff vs the live SHA while the live deploy is <6h old
  #     (content-aware gate, 2026-07-19 cost fix: ~93% of main commits are
  #     bookkeeping that rebuilt an identical site ~139x/day).
  #   - The 6h staleness backstop bounds staleness for private core-data
  #     changes (shows.json etc.) that never touch this repo's tree.
  #   - workflow_dispatch / workflow_run stay "ship NOW" lanes, deduped only
  #     when HEAD is already live. Any gate-input failure fails OPEN (deploy).
  # Kill switch: set repo variable DEPLOY_GATE_DISABLED=true to force every
  # trigger through (phone-operable; no code change).
  # Carries the Beaches #9 race guard (workflow_run conclusion check).
  should-deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    timeout-minutes: 3
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - name: Checkout (shallow — the gate fetches the live baseline commit itself)
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
      - name: Content-aware deploy gate
        id: check
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          GATE_EVENT_NAME: ${{ github.event_name }}
          GATE_DISABLED: ${{ vars.DEPLOY_GATE_DISABLED }}
        run: |
          # The gate script fails OPEN internally (API/fetch/diff errors →
          # proceed=true). If the script itself crashes, fail this step LOUDLY
          # rather than leaving `proceed` unset — an empty output makes the
          # deploy job's `if:` silently false on every trigger (green runs,
          # zero deploys, no alerts — the worst failure mode).
          node scripts/lib/should-deploy-gate.js
          grep -q '^proceed=' "$GITHUB_OUTPUT" || { echo "::error::[content-gate] gate exited without setting proceed"; exit 1; }

  deploy:
    needs: should-deploy
    if: needs.should-deploy.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    # 25-minute job timeout (raised from 15 on 2026-05-20, when the build took
    # ~10-12 min and the then-inline stage-latency push-retry loop consumed the
    # rest, making jobs show "cancelled" even after a successful Vercel deploy.
    # The should-deploy SHA check ignores "cancelled" runs, so the cron kept
    # re-deploying in a self-reinforcing loop — the "1hr+ to go live" pattern.)
    # Since then the build dropped to ~2-3 min (.next/cache persistence,
    # 2026-05-23) and the stage-latency push moved to the async watermark
    # workflow (2026-07-13), so 25 min is a generous ceiling that still
    # catches a hung run quickly.
    timeout-minutes: 25
    concurrency:
      # Per-run group: GH concurrency queue depth is 1, so a shared
      # "vercel-production-deploy" group cancelled 5+ queued deploys on Beaches
      # and Rocky Horror opening nights. Vercel itself queues deploys server-side
      # (latest wins), so letting multiple runs proceed in parallel is safe.
      # See memory/feedback_gha_concurrency_queue_limit.md. With the cron change
      # (2026-05-16, see on: schedule above), simultaneous deploys are now rare —
      # most cron ticks self-skip in the should-deploy preflight.
      group: vercel-production-deploy-${{ github.run_id }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v5


      - name: Checkout core data
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
      - name: Validate core data JSON
        run: |
          # Defense-in-depth: catch conflict markers or corrupt JSON before build.
          # Prevents cryptic Node crashes (e.g. compute-gold-lists.js require() failing).
          # Root cause fix is the pre-commit hook on the private data repo.
          INVALID=0
          for f in data/*.json; do
            if [ ! -f "$f" ]; then continue; fi
            if grep -qE '(<{7}|={7}|>{7})' "$f" 2>/dev/null; then
              echo "::error::$f contains merge conflict markers"
              INVALID=1
            elif ! node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" 2>/dev/null; then
              echo "::error::$f is not valid JSON"
              INVALID=1
            fi
          done
          if [ "$INVALID" -ne 0 ]; then
            echo "::error::Core data validation failed — check the private data repo for corrupt files"
            exit 1
          fi
          echo "All data/*.json files valid"

      - name: Verify Vercel build guard is active
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          SETTING=$(curl -s -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/prj_wmBnDUrCQCwabIAYPbnMiIP3wg15" \
            | node -e "const d=JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')); console.log(d.commandForIgnoringBuildStep || 'NOT SET')")
          echo "commandForIgnoringBuildStep: $SETTING"
          if [ "$SETTING" != "exit 0" ]; then
            echo "::warning::Build guard is NOT set to 'exit 0' — fixing now..."
            curl -s -X PATCH -H "Authorization: Bearer $VERCEL_TOKEN" -H "Content-Type: application/json" \
              "https://api.vercel.com/v9/projects/prj_wmBnDUrCQCwabIAYPbnMiIP3wg15" \
              -d '{"commandForIgnoringBuildStep":"exit 0"}'
            echo "::warning::Build guard restored to 'exit 0'. Git-triggered builds were unblocked — check Vercel billing."
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        # --prefer-offline uses the restored npm cache; --no-audit/--no-fund skip
        # post-install registry calls. Matches test.yml:508 pattern. Saves 3-8s.
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Pre-deploy data integrity check
        run: node scripts/pre-deploy-check.js

      - name: Pull Vercel Environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx vercel pull --yes --environment=production --token=$VERCEL_TOKEN

      - name: Guard — no demo-only flags in production
        run: |
          # Extract DEMO_FEATURES from source code (single source of truth)
          DEMO_FLAGS=$(node -e "
            const src = require('fs').readFileSync('src/config/feature-flags.ts','utf8');
            const m = src.match(/DEMO_FEATURES\s*=\s*new\s+Set\(\[([^\]]+)\]/);
            if (!m) { console.error('Could not parse DEMO_FEATURES from feature-flags.ts'); process.exit(1); }
            const flags = m[1].match(/'([^']+)'/g).map(s => s.replace(/'/g,''));
            console.log(flags.join(','));
          ")
          echo "Demo-only flags: $DEMO_FLAGS"

          # Read production NEXT_PUBLIC_FEATURES from pulled .vercel/.env.production.local
          PROD_FEATURES=$(grep '^NEXT_PUBLIC_FEATURES=' .vercel/.env.production.local 2>/dev/null | cut -d= -f2- | tr -d '"' | tr -d '\n' || echo "")
          echo "Production flags: $PROD_FEATURES"

          LEAKED=""
          IFS=',' read -ra DEMO_ARR <<< "$DEMO_FLAGS"
          IFS=',' read -ra PROD_ARR <<< "$PROD_FEATURES"
          for demo in "${DEMO_ARR[@]}"; do
            for prod in "${PROD_ARR[@]}"; do
              prod_clean=$(echo "$prod" | tr -d '[:space:]')
              if [ "$demo" = "$prod_clean" ]; then
                LEAKED="$LEAKED $demo"
              fi
            done
          done

          if [ -n "$LEAKED" ]; then
            echo "::error::Demo-only feature flags found in production NEXT_PUBLIC_FEATURES:$LEAKED"
            echo "::error::Remove them from Vercel production env vars before deploying."
            echo "::error::Demo flags should only be enabled on demo.broadwayscorecard.com (auto-enabled via DEMO_FEATURES set in feature-flags.ts)"
            exit 1
          fi
          echo "✓ No demo-only flags leaked to production"

      - name: Cache Next.js build + prebuild artifacts
        uses: actions/cache@v5
        with:
          # .next/cache: Next.js webpack/module incremental cache (kept across
          # deploys after 2026-05-23 workflow fix — see 3191971fd5).
          # data/cache/: prebuild hash gates (e.g. mobile-show-details/last-hash.json)
          # that skip regen when inputs unchanged.
          #
          # Key includes github.run_id so every deploy gets a UNIQUE primary key.
          # Without this, actions/cache@v5 sees a primary-key hit on restore and
          # SKIPS the save step at job end — meaning per-deploy cache updates
          # (like a freshly-written last-hash.json) are never persisted.
          # The restore-keys fallback (no run_id) finds the previous deploy's
          # cache. GHA auto-evicts old caches via LRU when the 10GB repo cap
          # is reached. See: github.com/actions/cache#cache-version
          path: |
            .next/cache
            data/cache
          key: nextjs-cache-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.run_id }}
          restore-keys: |
            nextjs-cache-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            nextjs-cache-${{ runner.os }}-

      - name: Check if data changed
        id: check-data
        run: |
          # NOTE: this path regex answers "fast vs FULL prebuild" (HOW to build),
          # not "deploy or not" — that's the should-deploy gate's SITE_PATHS in
          # scripts/lib/should-deploy-gate.js. The two lists differ on purpose:
          # this one is data-only; the gate's covers every build-shaping path.
          # For manual triggers or missing before-sha, assume data changed (full build)
          BEFORE="${{ github.event.before }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "data_changed=true" >> "$GITHUB_OUTPUT"
            echo "Full prebuild (manual trigger or no prior commit)"
            exit 0
          fi
          # Fetch the before commit so diff works (shallow clone only has HEAD)
          git fetch --depth=2 origin "$BEFORE" 2>/dev/null || true
          CHANGED=$(git diff --name-only "$BEFORE"..HEAD 2>/dev/null)
          if [ -z "$CHANGED" ] || echo "$CHANGED" | grep -qE '^(data/|public/data/|content/reviews/)'; then
            echo "data_changed=true" >> "$GITHUB_OUTPUT"
            echo "Data files changed (or diff unavailable) — full prebuild"
          else
            echo "data_changed=false" >> "$GITHUB_OUTPUT"
            echo "Code-only change — fast prebuild"
          fi

      - name: Clear build cache
        # Clears .vercel/output only — keeps .next/cache restored by the Cache Next.js build
        # step above so webpack/module compilation can be incremental.
        # .vercel/output is cleared to prevent EEXIST symlink errors (commit 6c20768ead).
        run: rm -rf .vercel/output

      - name: Build
        id: build
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SKIP_HEAVY_PREBUILD: ${{ steps.check-data.outputs.data_changed == 'false' && 'true' || '' }}
        run: |
          BUILD_START=$(date +%s)
          npx vercel build --prod --token=$VERCEL_TOKEN
          BUILD_SECS=$(( $(date +%s) - BUILD_START ))
          echo "build_seconds=$BUILD_SECS" >> "$GITHUB_OUTPUT"
          echo "Build completed in ${BUILD_SECS}s"

      - name: Deploy to Production
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          # --archive=split-tgz: Vercel's split-tarball format (Jan 2025 changelog)
          # uploads up to 30% faster than single --archive=tgz for prebuilt
          # deployments with many files (.vercel/output has ~15k files).
          # If this flag ever becomes unrecognized after a Vercel CLI downgrade,
          # fall back to --archive=tgz (the previous default).
          # Source: https://vercel.com/changelog/cli-archive-deployments-are-now-up-to-30-faster-with-split-tgz-archive
          URL=$(npx vercel deploy --prebuilt --prod --archive=split-tgz --token=$VERCEL_TOKEN)
          echo "Deployed to production: $URL"
          echo "deployed_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Check build duration
        if: always() && steps.build.outputs.build_seconds
        env:
          BUILD_SECS: ${{ steps.build.outputs.build_seconds }}
        run: |
          echo "Build took ${BUILD_SECS}s"
          # Warn if build step exceeds 5 minutes (300s) — typical is ~2 min
          if [ "$BUILD_SECS" -gt 300 ]; then
            echo "::warning::Build took ${BUILD_SECS}s (>5 min) — investigate for regressions"
          fi
          # Fail-loud if build step exceeds 10 minutes — something is very wrong
          if [ "$BUILD_SECS" -gt 600 ]; then
            echo "::error::Build took ${BUILD_SECS}s (>10 min) — likely regression in build pipeline"
          fi

      - name: Determine recently-opened show for dynamic smoke test
        id: recent_show
        run: |
          # Pick a show that opened within the last 14 days (or is still in previews).
          # These are the highest-risk pages — stale data, new reviews, edge cases.
          # Falls back to no dynamic URL if none found.
          RECENT_SLUG=$(node -e "
            try {
              const shows = require('./data/shows.json').shows;
              const now = new Date();
              const cutoff = new Date(now - 14 * 86400000).toISOString().slice(0,10);
              const candidates = shows.filter(s =>
                s.slug && s.openingDate && s.openingDate >= cutoff && s.openingDate <= now.toISOString().slice(0,10)
              ).sort((a, b) => b.openingDate.localeCompare(a.openingDate));
              if (candidates[0]) process.stdout.write(candidates[0].slug);
            } catch {}
          " 2>/dev/null || echo "")
          echo "slug=$RECENT_SLUG" >> $GITHUB_OUTPUT
          if [ -n "$RECENT_SLUG" ]; then
            echo "Dynamic smoke test will check recently-opened show: $RECENT_SLUG"
          else
            echo "No recently-opened show found — smoke test uses static URLs only"
          fi

      - name: Smoke test production
        run: |
          # Poll until pages return 200, up to 60s (typically <10s)
          check_url() {
            local URL="$1" NAME="$2"
            for attempt in $(seq 1 12); do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
              if [ "$STATUS" = "200" ]; then
                echo "${NAME} returned HTTP 200 (attempt ${attempt})"
                return 0
              fi
              echo "${NAME} returned HTTP ${STATUS} — retrying (attempt ${attempt}/12)"
              sleep 5
            done
            echo "::error::Production smoke test failed — ${NAME} never returned HTTP 200 after 60s"
            return 1
          }
          check_url "https://broadwayscorecard.com/" "Homepage" & PID1=$!
          check_url "https://broadwayscorecard.com/show/wicked" "Show page" & PID2=$!
          check_url "https://broadwayscorecard.com/tony-awards" "Tony Awards hub" & PID3=$!
          FAIL=0
          wait $PID1 || FAIL=1
          wait $PID2 || FAIL=1
          wait $PID3 || FAIL=1
          # Dynamic: check the most-recently-opened show's page — catches opening-night
          # deploys where the newly-live show page is broken (composite=null, missing data).
          RECENT_SLUG="${{ steps.recent_show.outputs.slug }}"
          if [ -n "$RECENT_SLUG" ]; then
            check_url "https://broadwayscorecard.com/show/$RECENT_SLUG" "Recent opening ($RECENT_SLUG)" & PID4=$!
            wait $PID4 || FAIL=1
          fi
          [ $FAIL -eq 0 ] && echo "Smoke test passed — production is live" || exit 1

      - name: Setup Playwright
        uses: ./.github/actions/setup-playwright

      - name: Content smoke test (Playwright)
        run: npx playwright test --project=chromium tests/e2e/smoke.spec.ts

      - name: Dispatch async watermark + stage-latency update
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The deployed-live stage-latency emit rides along with the watermark
          # workflow (2026-07-13). It used to be an inline commit+push step here,
          # but push-with-retry lost the race against busy main and burned its
          # full 3-min timeout on most deploys (~5 CI-hours/day) — often losing
          # the event anyway. The watermark run appends the event with the
          # deployed_at timestamp captured above and commits it in one push.
          gh workflow run update-deploy-watermark.yml \
            -f deployed_at='${{ steps.deploy.outputs.deployed_at }}' \
            -f deploy_sha='${{ github.sha }}' \
            -f deploy_run_id='${{ github.run_id }}' \
            || echo "::warning::Watermark dispatch failed (non-critical)"

      - name: Notify search engines of updated sitemap
        if: success()
        continue-on-error: true
        env:
          GOOGLE_INDEXING_KEY: ${{ secrets.GOOGLE_INDEXING_KEY }}
        run: |
          # Bing ping — sitemap is sharded (/sitemap/0.xml …); /sitemap.xml is a
          # 404. Bing ping is largely deprecated in favour of IndexNow
          # (submit-indexnow.js), but ping shard 0 rather than the dead index.
          curl -s "https://www.bing.com/ping?sitemap=https://broadwayscorecard.com/sitemap/0.xml" || true
          # Google: re-submit sitemap via Search Console Sitemaps API
          if [ -n "$GOOGLE_INDEXING_KEY" ]; then
            node scripts/submit-google-indexing.js --submit-sitemap || true
          fi

      - name: Check if newer deploy is already queued
        if: failure()
        id: check-newer
        uses: actions/github-script@v7
        with:
          script: |
            // If a newer deploy is already queued/running, skip the alert —
            // that run will either succeed (fix landed) or fail and alert then.
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'vercel-deploy.yml',
              per_page: 10
            });
            const newerRuns = data.workflow_runs.filter(r =>
              r.id > context.runId && r.status !== 'completed'
            );
            if (newerRuns.length > 0) {
              console.log(`Skipping alert — ${newerRuns.length} newer deploy(s) already queued/running`);
              core.setOutput('skip_alert', 'true');
              return;
            }

            // Confirm-before-page (card #608, 2026-07-28): the 5-min cron means an
            // isolated blip pages immediately, then self-heals 2-3 ticks later —
            // exactly what happened 2026-07-28 (run failed 12:53 UTC, next TWO runs
            // at 13:06/13:11 succeeded). Only page if the most recently COMPLETED
            // run before this one ALSO failed — i.e. this is at least the 2nd
            // consecutive real failure (~5-10min of broken deploys), not a
            // one-off. check-streak (below) still escalates further at streak 3.
            const completedRuns = data.workflow_runs
              .filter(r => r.id < context.runId && r.status === 'completed'
                && r.conclusion !== 'skipped' && r.conclusion !== 'cancelled')
              .sort((a, b) => b.id - a.id);
            const previous = completedRuns[0];
            if (!previous || previous.conclusion !== 'failure') {
              console.log(`Skipping alert — previous completed run ${previous ? previous.id : '(none)'} was '${previous ? previous.conclusion : 'n/a'}', not a confirmed repeat failure. Will page if the NEXT run also fails.`);
              core.setOutput('skip_alert', 'true');
            } else {
              console.log(`Previous completed run ${previous.id} also failed — confirmed repeat failure, sending alert`);
              core.setOutput('skip_alert', 'false');
            }

      - name: Notify on failure
        if: failure() && steps.check-newer.outputs.skip_alert != 'true'
        uses: ./.github/actions/notify-failure
        with:
          title: 'Deploy to Vercel Failed'
          severity: 'critical'
          email: 'true'
          resend_api_key: ${{ secrets.RESEND_API_KEY }}
          owner_email: ${{ secrets.OWNER_EMAIL }}
          discord_webhook: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}

      - name: Trigger investigation
        if: failure() && steps.check-newer.outputs.skip_alert != 'true'
        env:
          GH_TOKEN: ${{ secrets.REVIEW_TEXTS_TOKEN }}
        run: |
          gh workflow run investigate-alert.yml \
            -f alert_type=vercel_deploy_fail \
            -f alert_title="Deploy to Vercel Failed" \
            -f alert_context='{}' \
            -f run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  # Fires only when the deploy job fails AND this is the 3rd consecutive failure.
  # Sends a second "still broken" alert (~15 min into the outage) so parallel sessions
  # notice without polling. First-failure alert comes from the deploy job above.
  # Uses streak == 3 exactly (not >= 3) to fire once per outage, not every cron tick.
  check-streak:
    needs: [deploy]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Count consecutive failures and re-alert at streak 3
        env:
          GH_TOKEN: ${{ secrets.REVIEW_TEXTS_TOKEN }}
        run: |
          # Count leading consecutive failures in the last 20 completed deploy runs.
          # Exclude null conclusions (in-progress), skipped, and cancelled runs —
          # those are workflow_run triggers for failed rebuilds and don't represent
          # real deploy attempts.
          STREAK=$(gh run list \
            --workflow="vercel-deploy.yml" \
            --limit=20 \
            --json conclusion \
            --jq '[.[] | select(.conclusion != null and .conclusion != "skipped" and .conclusion != "cancelled")] |
                  reduce .[] as $r (
                    {"streak": 0, "done": false};
                    if .done then .
                    elif $r.conclusion == "failure" then {"streak": (.streak + 1), "done": false}
                    else {"streak": .streak, "done": true}
                    end
                  ) | .streak' 2>/dev/null || echo "0")

          echo "Consecutive failure streak: $STREAK"

          # Fire exactly at 3 — the first-failure alert covers streak 1.
          # Streak 3 = ~15 min of broken deploys on the 5-min cron.
          if [ "$STREAK" -eq 3 ]; then
            echo "Streak hit 3 — dispatching escalation alert"
            gh workflow run investigate-alert.yml \
              -f alert_type=vercel_deploy_fail \
              -f alert_title="Deploy still broken: 3rd consecutive failure (~15 min)" \
              -f alert_context="{\"streak\":$STREAK,\"note\":\"Deploys have been failing for ~15 min across all parallel sessions. Check Actions tab.\"}" \
              -f run_url="${{ github.server_url }}/${{ github.repository }}/actions/workflows/vercel-deploy.yml"
          else
            echo "Streak is $STREAK — no escalation needed"
          fi

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: 'Deploy Streak Check Failed'
          severity: 'warning'
