name: Deploy to Vercel

on:
  push:
    branches: [main]
    paths:
      # Serverless functions
      - 'api/**'
      # Application code
      - 'src/**'
      - 'public/**'
      - 'content/**'
      # Config files
      - 'next.config.*'
      - 'vercel.json'
      - 'tailwind.config.*'
      - 'tsconfig.*'
      - 'package.json'
      - 'package-lock.json'
      # Build-relevant data files (imported at build time)
      - 'data/shows.json'
      - 'data/reviews.json'
      - 'data/grosses.json'
      - 'data/grosses-history.json'
      - 'data/commercial.json'
      - 'data/audience-buzz.json'
      - 'data/critic-consensus.json'
      - 'data/lottery-rush.json'
      - 'data/awards.json'
      - 'data/gold-lists-computed.json'
      - 'data/critic-registry.json'
  workflow_dispatch: # Manual trigger

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: vercel-production-deploy
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Pull Vercel Environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production --token=$VERCEL_TOKEN

      - name: Build
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --prod --token=$VERCEL_TOKEN

      - name: Deploy to Production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          URL=$(vercel deploy --prebuilt --prod --archive=tgz --token=$VERCEL_TOKEN)
          echo "Deployed to production: $URL"

      - name: Smoke test production
        run: |
          echo "Waiting 30s for deployment to propagate..."
          sleep 30
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://broadwayscorecard.com/)
          echo "Homepage returned HTTP $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "::error::Production smoke test failed — homepage returned HTTP $STATUS"
            exit 1
          fi
          # Check a show page too
          STATUS2=$(curl -s -o /dev/null -w "%{http_code}" https://broadwayscorecard.com/show/hamilton-2015)
          echo "Show page returned HTTP $STATUS2"
          if [ "$STATUS2" != "200" ]; then
            echo "::error::Production smoke test failed — show page returned HTTP $STATUS2"
            exit 1
          fi
          echo "Smoke test passed — production is live"
