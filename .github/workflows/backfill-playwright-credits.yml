name: Backfill Playwright Credits

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max shows to process (0 = all)'
        required: false
        default: '0'
        type: string
      dry_run:
        description: 'Dry run (no changes)'
        required: false
        default: false
        type: boolean
      split_credits:
        description: 'Also split combined credits'
        required: false
        default: false
        type: boolean
      show:
        description: 'Optional: specific show slug'
        required: false
        type: string

permissions:
  contents: write

# BRO-5574: this job read-mutate-writes data/shows.json (saveShows + checkpoint pushes), so it joins the shared
# shows-json-writer group with the other shows.json writers (update-show-status, enrich-ibdb-dates, ...). It is
# workflow_dispatch-only, so the GH pending-queue depth of 1 (see rebuild-fast.yml) costs little. Supersedes the
# BRO-934 per-workflow group, which still serialized overlapping runs of this job (same group now covers that).
concurrency:
  group: shows-json-writer
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          # BRO-2388 (task #466 class): depth 300 keeps push-with-retry.sh's shallow boundary an ancestor
          # of main for this 60-min job's final ledger commit; depth-1 aborted when churn outran it.
          fetch-depth: 300


      - name: Checkout core data
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci || npm install

      - name: Setup Playwright
        uses: ./.github/actions/setup-playwright

      - name: Run playwright backfill
        id: backfill
        env:
          SCRAPINGBEE_API_KEY: ${{ secrets.SCRAPINGBEE_API_KEY }}
          SCRAPINGDOG_API_KEY: ${{ secrets.SCRAPINGDOG_API_KEY }}
          SCRAPER_USE_SCRAPINGDOG: '1'
          BRIGHTDATA_TOKEN: ${{ secrets.BRIGHTDATA_TOKEN }}
          BRIGHTDATA_ZONE: ${{ secrets.BRIGHTDATA_ZONE }}
          INPUT_SHOW: ${{ inputs.show }}
          INPUT_LIMIT: ${{ inputs.limit }}
        run: |
          FLAGS=""

          if [ "${{ inputs.dry_run }}" = "true" ]; then
            FLAGS="$FLAGS --dry-run"
          fi

          if [ "${{ inputs.split_credits }}" = "true" ]; then
            FLAGS="$FLAGS --split-credits"
          fi

          if [ -n "${INPUT_SHOW}" ]; then
            FLAGS="$FLAGS --show=${INPUT_SHOW}"
          fi

          LIMIT="${INPUT_LIMIT}"
          if [ -n "$LIMIT" ] && [ "$LIMIT" != "0" ]; then
            FLAGS="$FLAGS --limit=$LIMIT"
          fi

          echo "Running: node scripts/backfill-playwright-credits.js $FLAGS"
          node scripts/backfill-playwright-credits.js $FLAGS

      - name: Validate data
        if: always()
        # BRO-3194: stays blocking. validate-data.js writes the push-core-data
        # refusal sentinel; the red step is the only signal that the push below
        # was refused, so continue-on-error would silently discard the data.
        run: node scripts/validate-data.js

      - name: Push core data to private repo
        if: always()
        uses: ./.github/actions/push-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
          message: 'data: Update from backfill-playwright-credits'

      - name: Commit scraper-spend ledger
        if: always()
        continue-on-error: true
        uses: ./.github/actions/commit-scraper-spend-ledger
        with:
          workflow-name: backfill-playwright-credits

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: 'Backfill Playwright Credits Failed'
          severity: 'warning'
          discord_webhook: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
