name: Audit Live Show Art

# BRO-5744: weekly vision sweep of the thumbnail actually served for every
# open/previews/upcoming/announced show. ADVISORY (CLAUDE.md section 19): the
# audit step is continue-on-error, nothing is nulled, and the report is an
# artifact (tmp/live-art-audit.json, never committed) plus a step
# summary. Flagged rows fold into ONE rollup alert card (stable key); only the
# alert ledger is committed so the weekly cooldown holds.
# ~745 Gemini Flash calls, ~15 min, ~$0.2.

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      group: audit-live-show-art
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main

      - name: Checkout core data
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run live art audit (advisory)
        id: audit
        continue-on-error: true
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: node scripts/audit-live-show-art.js

      - name: Summarize
        if: always()
        run: |
          {
            echo "### Live show art audit (advisory)"
            if [ -f tmp/live-art-audit.json ]; then
              node -e 'const r=require("./tmp/live-art-audit.json");console.log(`Checked ${r.totalChecked}, flagged ${r.flaggedCount} ${JSON.stringify(r.byKind)}, errors ${r.errorCount}`);for(const f of r.flagged)console.log(`- ${f.kind} \`${f.id}\`: ${String(f.description).slice(0,120)}`)'
            else
              echo "No report written (see the audit step log)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: live-art-audit
          path: tmp/live-art-audit.json
          if-no-files-found: ignore
          retention-days: 30

      # The alert router's cooldown ledger must persist or every week re-files.
      # Ledger files only: the report itself stays an artifact.
      - name: Commit alert ledger
        if: always()
        env:
          PUSH_DEADLINE_SEC: '600'
          GIT_NET_TIMEOUT_SEC: '30'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/audit/alert-ledger.json data/audit/alert-digest-queue.json data/audit/alert-router-attempts.jsonl 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No ledger changes"
          else
            git commit -m "data: live-show-art audit alert ledger [skip ci]

          Co-Authored-By: github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
            bash scripts/lib/push-with-retry.sh
          fi

      - name: Notify on failure
        if: failure() || steps.audit.outcome == 'failure'
        uses: ./.github/actions/notify-failure
        with:
          title: 'Audit Live Show Art Failed'
          severity: 'warning'
