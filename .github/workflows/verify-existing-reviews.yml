name: Verify Existing Reviews (LLM)

on:
  workflow_dispatch:
    inputs:
      parallel_jobs:
        description: 'Number of parallel jobs (1-10)'
        required: false
        type: choice
        default: '5'
        options: ['1', '2', '3', '4', '5', '6', '7', '8', '10']
      max_per_job:
        description: 'Max reviews per job (0 = all)'
        required: false
        default: '2000'
      mode:
        description: 'What to check'
        required: false
        type: choice
        default: 'both'
        options: ['both', 'verify-only', 'recover-only']
      dry_run:
        description: 'Dry run — log what would change without modifying files'
        required: false
        type: boolean
        default: false
      max_rounds:
        description: 'Max self-chaining rounds (0 = no chaining)'
        required: false
        default: '10'
      current_round:
        description: 'Current round (auto-set by chaining)'
        required: false
        default: '1'

# Retroactive LLM content verification for all existing reviews.
# Two modes: (1) verify unverified reviews for wrong-production/wrong-show/film-TV
#             (2) re-evaluate existing wrongProduction/wrongShow flags for false positives

# Per-run group (not shared): matrix partitions reviews into disjoint
# parallel_jobs shards, and self-chains the next round with a NEW run_id.
# A shared group would only queue a second concurrent manual dispatch,
# never affect the chain or the matrix. See docs/workflow-concurrency-audit.md.
concurrency:
  group: verify-existing-reviews-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.partition.outputs.matrix }}
      total_verify: ${{ steps.count.outputs.verify }}
      total_recover: ${{ steps.count.outputs.recover }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5



      - name: Checkout core data
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
      - name: Checkout review-texts (private repo)
        uses: ./.github/actions/checkout-review-texts
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'

      - name: Count and partition
        id: count
        run: |
          node -e '
            const fs = require("fs"), path = require("path");
            const base = "data/review-texts";
            const showVerify = {}, showRecover = {};
            let totalVerify = 0, totalRecover = 0;
            const dirs = fs.readdirSync(base).filter(d => {
              try { return fs.statSync(path.join(base, d)).isDirectory(); } catch { return false; }
            });
            for (const d of dirs) {
              let vCount = 0, rCount = 0;
              const files = fs.readdirSync(path.join(base, d)).filter(f => f.endsWith(".json") && f !== "failed-fetches.json");
              for (const f of files) {
                try {
                  const r = JSON.parse(fs.readFileSync(path.join(base, d, f), "utf8"));
                  if ((r.wrongProduction || r.wrongShow) && !r.wrongAttribution) {
                    const text = r.fullText || r.wrongFullText || r.garbageFullText;
                    if (text && text.length >= 200 && !(r.verifiedBy && r.verifiedBy.startsWith("llm:"))) rCount++;
                  } else if (!r.wrongProduction && !r.wrongShow && !r.wrongAttribution) {
                    if (r.fullText && r.fullText.length >= 200 && !(r.verifiedBy && r.verifiedBy.startsWith("llm:"))) vCount++;
                  }
                } catch {}
              }
              if (vCount > 0) { showVerify[d] = vCount; totalVerify += vCount; }
              if (rCount > 0) { showRecover[d] = rCount; totalRecover += rCount; }
            }
            fs.writeFileSync("/tmp/show-verify.json", JSON.stringify(showVerify));
            fs.writeFileSync("/tmp/show-recover.json", JSON.stringify(showRecover));
            console.log("Verify:", totalVerify, "Recover:", totalRecover);
          '
          VERIFY=$(node -e "const c=JSON.parse(require('fs').readFileSync('/tmp/show-verify.json','utf8'));console.log(Object.values(c).reduce((a,b)=>a+b,0))")
          RECOVER=$(node -e "const c=JSON.parse(require('fs').readFileSync('/tmp/show-recover.json','utf8'));console.log(Object.values(c).reduce((a,b)=>a+b,0))")
          echo "verify=$VERIFY" >> $GITHUB_OUTPUT
          echo "recover=$RECOVER" >> $GITHUB_OUTPUT
          echo "Unverified reviews: $VERIFY, Flagged for re-eval: $RECOVER"

      - name: Build partition matrix
        id: partition
        env:
          JOBS: ${{ inputs.parallel_jobs }}
          MODE: ${{ inputs.mode }}
        run: |
          node -e '
            const fs = require("fs");
            const verify = JSON.parse(fs.readFileSync("/tmp/show-verify.json", "utf8"));
            const recover = JSON.parse(fs.readFileSync("/tmp/show-recover.json", "utf8"));
            const mode = process.env.MODE || "both";

            // Merge show counts based on mode
            const combined = {};
            if (mode !== "recover-only") {
              for (const [k, v] of Object.entries(verify)) combined[k] = (combined[k] || 0) + v;
            }
            if (mode !== "verify-only") {
              for (const [k, v] of Object.entries(recover)) combined[k] = (combined[k] || 0) + v;
            }

            const shows = Object.entries(combined).sort((a, b) => b[1] - a[1]);
            const jobs = Math.min(parseInt(process.env.JOBS), shows.length || 1);
            const partitions = Array.from({ length: jobs }, () => ({ shows: [], count: 0 }));

            shows.forEach(([show, count]) => {
              const lightest = partitions.reduce((min, p, i) => p.count < partitions[min].count ? i : min, 0);
              partitions[lightest].shows.push(show);
              partitions[lightest].count += count;
            });

            const matrix = partitions
              .filter(p => p.shows.length > 0)
              .map((p, i) => ({ partition: i + 1, shows: p.shows.join(","), review_count: p.count }));

            console.log(JSON.stringify(matrix));
            fs.writeFileSync("/tmp/matrix.json", JSON.stringify(matrix));
          '
          MATRIX=$(cat /tmp/matrix.json)
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT

      - name: Summary
        env:
          INPUT_CURRENT_ROUND: ${{ inputs.current_round }}
          INPUT_MAX_ROUNDS: ${{ inputs.max_rounds }}
        run: |
          echo "## Retroactive LLM Verification: Preparation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Unverified reviews:** ${{ steps.count.outputs.verify }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Flagged for re-evaluation:** ${{ steps.count.outputs.recover }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Mode:** ${{ inputs.mode }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Parallel jobs:** ${{ inputs.parallel_jobs }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Dry run:** ${{ inputs.dry_run }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Round:** ${INPUT_CURRENT_ROUND} / ${INPUT_MAX_ROUNDS}" >> $GITHUB_STEP_SUMMARY

  verify:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJson(inputs.parallel_jobs) }}
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.matrix) }}

    steps:
      # BRO-4231: this job checks out a blobless partial clone (filter: blob:none
      # on the checkout below), so rebase/diff/show fetch missing blobs over the
      # network outside push-with-retry.sh's per-op timeout wrappers. Set git's
      # low-speed abort (1 KB/s for 45 s, the bound the helper applies to its own
      # fetch/push) for EVERY git transfer in this job: --global, and before the
      # checkout, so actions/checkout's own first lazy blob batch and the depth-1
      # private-repo clones (checkout-core-data / checkout-review-texts, no
      # timeout of their own; their retry loop catches the abort) are bounded
      # too. A stalled transfer fails fast instead of hanging to the job timeout.
      # lowSpeed cannot catch a pre-transfer stall. Runner $HOME is ephemeral.
      - name: Set git low-speed abort for this job
        run: |
          git config --global http.lowSpeedLimit 1000
          git config --global http.lowSpeedTime 45

      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          # BRO-4231: filter: blob:none keeps the full commit graph fetch-depth: 0 is
          # here for (a resolvable merge-base for push-with-retry.sh; #209 parentless
          # root) but stops downloading every historical blob of this repo's data/*.json
          # rewrites: ~24 min -> ~30 s per checkout (llm-ensemble-score runs 36523767401
          # -> 36672742657). Full rationale: opening-night-poller.yml's Checkout step.
          filter: blob:none



      - name: Checkout core data
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
      - name: Checkout review-texts (private repo)
        uses: ./.github/actions/checkout-review-texts
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Configure git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Stagger start
        run: |
          DELAY=$(( (${{ matrix.partition }} - 1) * 10 ))
          echo "Staggering partition ${{ matrix.partition }} by ${DELAY}s"
          sleep $DELAY

      - name: Run verification (partition ${{ matrix.partition }})
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REVIEW_TEXTS_TOKEN: ${{ secrets.REVIEW_TEXTS_TOKEN }}
          SHOW_FILTER: ${{ matrix.shows }}
          COMMIT_EVERY: '25'
          INPUT_MAX_PER_JOB: ${{ inputs.max_per_job }}
        run: |
          ARGS=""
          if [ "${{ inputs.mode }}" = "verify-only" ]; then
            ARGS="$ARGS --verify-only"
          elif [ "${{ inputs.mode }}" = "recover-only" ]; then
            ARGS="$ARGS --recover-only"
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ "${INPUT_MAX_PER_JOB}" != "0" ]; then
            ARGS="$ARGS --limit=${INPUT_MAX_PER_JOB}"
          fi
          node scripts/verify-existing-reviews.js $ARGS


      - name: Push review-texts to private repo
        if: always()
        uses: ./.github/actions/push-review-texts
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
          message: "data: Verify Existing Reviews (LLM) — Commit and push (partition ${{ matrix.partition }})"
      - name: Commit and push (partition ${{ matrix.partition }})
        if: always()
        env:
          INPUT_CURRENT_ROUND: ${{ inputs.current_round }}
        run: |
          git add data/audit/ || true
          if git diff --staged --quiet; then
            echo "No changes to commit for partition ${{ matrix.partition }}"
          else
            git commit -m "feat: Retroactive LLM verify (round ${INPUT_CURRENT_ROUND}, partition ${{ matrix.partition }}/${{ inputs.parallel_jobs }})

          Co-Authored-By: GitHub Action <action@github.com>"
            bash scripts/lib/push-with-retry.sh
          fi

      - name: Upload report
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with:
          name: verify-report-partition-${{ matrix.partition }}
          path: data/audit/retroactive-verify-report.json
          retention-days: 30

  rebuild:
    if: ${{ inputs.dry_run != true && always() }}
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write

    steps:
      # BRO-4231: this job checks out a blobless partial clone (filter: blob:none
      # on the checkout below), so rebase/diff/show fetch missing blobs over the
      # network outside push-with-retry.sh's per-op timeout wrappers. Set git's
      # low-speed abort (1 KB/s for 45 s, the bound the helper applies to its own
      # fetch/push) for EVERY git transfer in this job: --global, and before the
      # checkout, so actions/checkout's own first lazy blob batch and the depth-1
      # private-repo clones (checkout-core-data / checkout-review-texts, no
      # timeout of their own; their retry loop catches the abort) are bounded
      # too. A stalled transfer fails fast instead of hanging to the job timeout.
      # lowSpeed cannot catch a pre-transfer stall. Runner $HOME is ephemeral.
      - name: Set git low-speed abort for this job
        run: |
          git config --global http.lowSpeedLimit 1000
          git config --global http.lowSpeedTime 45

      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          # BRO-4231: filter: blob:none keeps the full commit graph fetch-depth: 0 is
          # here for (a resolvable merge-base for push-with-retry.sh; #209 parentless
          # root) but stops downloading every historical blob of this repo's data/*.json
          # rewrites: ~24 min -> ~30 s per checkout (llm-ensemble-score runs 36523767401
          # -> 36672742657). Full rationale: opening-night-poller.yml's Checkout step.
          filter: blob:none



      - name: Checkout core data
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
      - name: Checkout review-texts (private repo)
        uses: ./.github/actions/checkout-review-texts
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Configure git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      # Stale-checkout race guard, pre-rebuild (BRO-3162): sync review-texts
      # files pushed by other jobs since this job's checkout (never files
      # this job wrote), and record which shows drifted.
      - name: Sync review-texts drift before rebuild
        uses: ./.github/actions/sync-review-texts-drift

      - name: Rebuild reviews.json
        id: rebuild_reviews
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/rebuild-all-reviews.js

      # Stale-checkout race guard, post-rebuild (BRO-3162): advisory first
      # (CLAUDE.md rule 19), so it flags a dropped show without blocking.
      - name: Verify no scoreable review vanished during checkout drift
        if: ${{ !cancelled() && steps.rebuild_reviews.outcome == 'success' }}
        continue-on-error: true
        # lint-allow-swallow: report-only by design (rule 19); writes nothing tracked, failure = ::error annotation
        run: >-
          node scripts/check-rebuild-staleness-advisory.js
          --shows-file=/tmp/stale-checkout-shows.txt

      # Stale-checkout race guard, cleanup (BRO-3162): return the synced
      # upstream files to the checkout state so push-review-texts' pull
      # --rebase --autostash never replays them over newer upstream edits.
      - name: Restore review-texts drift sync
        if: always()
        continue-on-error: true
        uses: ./.github/actions/sync-review-texts-drift
        with:
          mode: restore


      - name: Push review-texts to private repo
        if: always()
        uses: ./.github/actions/push-review-texts
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
          message: "data: Verify Existing Reviews (LLM) — Commit rebuilt reviews.json"
      - name: Commit rebuilt reviews.json
        continue-on-error: true # a failed push shows red but does not fail the job; was `|| echo` (BRO-4730)
        if: always()
        env:
          INPUT_CURRENT_ROUND: ${{ inputs.current_round }}
        run: |
          # BRO-6029: git_net caps each fetch/pull/push so a hung transfer fails that attempt instead of waiting for the job timeout.
          . "${GITHUB_WORKSPACE}/scripts/lib/git-net-timeout.sh" 2>/dev/null || git_net() { shift; git "$@"; }
          git add data/audit/
          if git diff --staged --quiet; then
            echo "No changes to reviews.json"
          else
            git commit -m "data: Auto-rebuild reviews.json (retroactive LLM verify round ${INPUT_CURRENT_ROUND})"
            git_net 300 -c "merge.ours.driver=bash '$GITHUB_WORKSPACE/scripts/lib/merge-keep-run.sh' B %O %A %B %P" pull --rebase origin main || {
              git rebase --abort 2>/dev/null || true
              git_net 300 -c "merge.ours.driver=bash '$GITHUB_WORKSPACE/scripts/lib/merge-keep-run.sh' A %O %A %B %P" pull --no-rebase -X ours origin main
            }
            bash scripts/lib/push-with-retry.sh
          fi


      - name: Push core data to private repo
        if: always()
        uses: ./.github/actions/push-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
          message: 'data: Update from verify-existing-reviews'
      - name: Count remaining and chain
        if: always()
        id: chain
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_CURRENT_ROUND: ${{ inputs.current_round }}
          INPUT_MAX_ROUNDS: ${{ inputs.max_rounds }}
          INPUT_MAX_PER_JOB: ${{ inputs.max_per_job }}
        run: |
          REMAINING=$(node -e '
            const fs = require("fs"), path = require("path");
            const base = "data/review-texts";
            let verify = 0, recover = 0;
            const dirs = fs.readdirSync(base).filter(d => {
              try { return fs.statSync(path.join(base, d)).isDirectory(); } catch { return false; }
            });
            for (const d of dirs) {
              const files = fs.readdirSync(path.join(base, d)).filter(f => f.endsWith(".json") && f !== "failed-fetches.json");
              for (const f of files) {
                try {
                  const r = JSON.parse(fs.readFileSync(path.join(base, d, f), "utf8"));
                  if ((r.wrongProduction || r.wrongShow) && !r.wrongAttribution) {
                    const text = r.fullText || r.wrongFullText || r.garbageFullText;
                    if (text && text.length >= 200 && !(r.verifiedBy && r.verifiedBy.startsWith("llm:"))) recover++;
                  } else if (!r.wrongProduction && !r.wrongShow && !r.wrongAttribution) {
                    if (r.fullText && r.fullText.length >= 200 && !(r.verifiedBy && r.verifiedBy.startsWith("llm:"))) verify++;
                  }
                } catch {}
              }
            }
            console.log(verify + recover);
          ')
          echo "remaining=$REMAINING" >> $GITHUB_OUTPUT
          CURRENT=${INPUT_CURRENT_ROUND}
          MAX=${INPUT_MAX_ROUNDS}
          echo "Remaining: $REMAINING reviews, round $CURRENT of $MAX"
          if [ "$REMAINING" -gt 50 ] && [ "$CURRENT" -lt "$MAX" ]; then
            NEXT=$((CURRENT + 1))
            echo "Chaining round $NEXT..."
            gh workflow run verify-existing-reviews.yml \
              -f parallel_jobs=${{ inputs.parallel_jobs }} \
              -f max_per_job=${INPUT_MAX_PER_JOB} \
              -f mode=${{ inputs.mode }} \
              -f dry_run=false \
              -f max_rounds=$MAX \
              -f current_round=$NEXT
            echo "chained=true" >> $GITHUB_OUTPUT
          else
            echo "No chaining needed (remaining=$REMAINING, round=$CURRENT/$MAX)"
            echo "chained=false" >> $GITHUB_OUTPUT
          fi

      - name: Summary
        env:
          INPUT_CURRENT_ROUND: ${{ inputs.current_round }}
        run: |
          echo "## Retroactive LLM Verify Round ${INPUT_CURRENT_ROUND}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Remaining:** ${{ steps.chain.outputs.remaining }} reviews" >> $GITHUB_STEP_SUMMARY
          echo "- **Chained next round:** ${{ steps.chain.outputs.chained }}" >> $GITHUB_STEP_SUMMARY
      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: 'Verify Existing Reviews Failed'
          severity: 'warning'
          discord_webhook: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
