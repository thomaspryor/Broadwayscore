name: Detect Revivals (IBDB)

on:
  schedule:
    # Weekly on Wednesdays at 11 AM UTC (6 AM EST). shows-json-writer is also
    # used by update-show-status.yml (daily 8am UTC, ~10min typical), enrich-
    # ibdb-dates.yml (Wed 7am UTC), and audit-closing-dates.yml (daily 2pm
    # UTC) — 11am sits in the gap between the morning cluster and the
    # afternoon audit rather than landing exactly on top of another writer
    # (ship-check adversarial review, #982: an earlier 8am slot collided
    # directly with update-show-status.yml's daily run).
    - cron: '0 11 * * 3'
  workflow_dispatch:
    inputs:
      apply:
        description: 'Write changes (unchecked = dry-run only)'
        required: true
        default: true
        type: boolean
      show:
        description: 'Optional: specific show slug/id to check'
        required: false
        type: string
      category:
        description: 'Category filter'
        required: false
        default: 'off-broadway'
        type: choice
        options:
          - off-broadway
          - broadway

permissions:
  contents: write

# Same writer group as enrich-ibdb-dates/update-show-status — this workflow
# read-mutate-writes shows.json (isRevival, ibdbRevivalChecked, tags).
concurrency:
  group: shows-json-writer
  cancel-in-progress: false

jobs:
  detect-revivals:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Checkout core data
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci || npm install

      - name: Setup Playwright
        uses: ./.github/actions/setup-playwright

      - name: Run IBDB revival detection
        env:
          SCRAPINGBEE_API_KEY: ${{ secrets.SCRAPINGBEE_API_KEY }}
          SCRAPINGDOG_API_KEY: ${{ secrets.SCRAPINGDOG_API_KEY }}
          SCRAPER_USE_SCRAPINGDOG: '1'
          BRIGHTDATA_TOKEN: ${{ secrets.BRIGHTDATA_TOKEN }}
          BRIGHTDATA_ZONE: ${{ secrets.BRIGHTDATA_ZONE }}
        run: |
          FLAGS="--apply"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.apply }}" = "false" ]; then
            FLAGS=""
          fi
          if [ -n "${{ inputs.show }}" ]; then
            FLAGS="$FLAGS --show=${{ inputs.show }}"
          fi
          CATEGORY="${{ inputs.category || 'off-broadway' }}"
          FLAGS="$FLAGS --category=$CATEGORY"

          echo "Running: node scripts/detect-revivals-ibdb.js $FLAGS"
          node scripts/detect-revivals-ibdb.js $FLAGS
          # --force not passed: a >5-change run exits 1 on purpose (safety gate,
          # see scripts/detect-revivals-ibdb.js) and should surface as a failed
          # run for manual review, not silently apply a large batch unattended.

      - name: Push core data to private repo
        # success() only, NOT always(): the script checkpoints (writes +
        # applies) every 10 shows DURING the loop, before the final >5-change
        # safety gate is evaluated — so a gate-triggered exit 1 still leaves
        # partially-applied changes in the local checkout. Pushing on
        # `always()` would publish that partial batch despite the run being
        # red (ship-check adversarial review, #982). A failed run now
        # publishes nothing; the next scheduled run re-checks the same shows
        # (ibdbRevivalChecked was checkpointed locally but never pushed) and a human can
        # `--show=` a subset or `--force` manually in the meantime.
        if: success()
        uses: ./.github/actions/push-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
          message: 'data: Update from detect-revivals-ibdb'

      # ibdb-dates.js's SERP fallback writes attribution rows to
      # data/audit/scraper-spend-ledger.jsonl (task #752/#784) — a root-repo
      # file, safe to commit on always() regardless of the safety-gate
      # exit-1 above. Never staged before this weekly cron (Sprint 3, card
      # 3b1637c5).
      - name: Commit scraper-spend ledger
        if: always()
        continue-on-error: true  # telemetry-only commit (Sprint 3, card 3b1637c5) — push contention under concurrent scheduled runs must never fail an otherwise-successful job
        env:
          PUSH_RECONCILE_MERGED_JSON: '1'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/audit/scraper-spend-ledger.jsonl 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No ledger changes to commit"
          else
            git commit -m "chore: Record scraper-spend ledger (detect-revivals-ibdb)"
            bash scripts/lib/push-with-retry.sh
          fi

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: 'IBDB Revival Detection Failed'
          discord_webhook: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
          resend_api_key: ${{ secrets.RESEND_API_KEY }}
          owner_email: ${{ secrets.OWNER_EMAIL }}
