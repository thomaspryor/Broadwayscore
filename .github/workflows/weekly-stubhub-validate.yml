name: Weekly StubHub URL Validator

on:
  schedule:
    # Every Monday at 9:30 AM ET (1:30 PM UTC) — 30 min after the affiliate report
    - cron: '30 13 * * 1'
  workflow_dispatch:
    inputs:
      apply:
        description: 'Apply fixes (replace broken URLs with search fallbacks)'
        type: boolean
        default: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Checkout core data
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Run StubHub URL validator
        id: validator
        run: |
          APPLY_FLAG=""
          if [ "${{ inputs.apply }}" = "true" ]; then
            APPLY_FLAG="--apply"
          fi
          node scripts/validate-stubhub-urls.js $APPLY_FLAG > /tmp/stubhub-report.txt 2>&1 || true
          cat /tmp/stubhub-report.txt
          # Extract summary counts for email subject line
          BROKEN=$(grep -oE 'broken: *[0-9]+' /tmp/stubhub-report.txt | tail -1 | grep -oE '[0-9]+' || echo "?")
          OK=$(grep -oE 'ok: *[0-9]+' /tmp/stubhub-report.txt | tail -1 | grep -oE '[0-9]+' || echo "?")
          echo "broken=$BROKEN" >> $GITHUB_OUTPUT
          echo "ok=$OK" >> $GITHUB_OUTPUT

      - name: Commit & push fixes (if --apply and broken found)
        if: inputs.apply == true && steps.validator.outputs.broken != '0' && steps.validator.outputs.broken != '?'
        uses: ./.github/actions/push-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
          message: 'data(stubhub): Auto-fix ${{ steps.validator.outputs.broken }} stale URL(s) via weekly validator'

      - name: Dispatch deploy (if fixes applied)
        if: inputs.apply == true && steps.validator.outputs.broken != '0' && steps.validator.outputs.broken != '?'
        uses: ./.github/actions/dispatch-deploy

      - name: Send email via Resend
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          BROKEN="${{ steps.validator.outputs.broken }}"
          OK="${{ steps.validator.outputs.ok }}"
          APPLIED_TAG=""
          if [ "${{ inputs.apply }}" = "true" ]; then
            APPLIED_TAG=" (auto-fixed)"
          fi
          if [ "$BROKEN" = "0" ]; then
            SUBJECT="StubHub URL Validator — All $OK URLs OK · $(date -u +'%b %d, %Y')"
          else
            SUBJECT="StubHub URL Validator — $BROKEN broken / $OK OK${APPLIED_TAG} · $(date -u +'%b %d, %Y')"
          fi
          jq -n \
            --arg from "Broadway Scorecard <notifications@broadwayscorecard.com>" \
            --arg to "thomas.pryor@gmail.com" \
            --arg subject "$SUBJECT" \
            --arg text "$(cat /tmp/stubhub-report.txt)" \
            '{from: $from, to: $to, subject: $subject, text: $text}' \
          | curl -s -X POST "https://api.resend.com/emails" \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d @- | jq '{id: .id, error: .error}'

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: 'Weekly StubHub URL Validator Failed'
          severity: 'warning'
          discord_webhook: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
