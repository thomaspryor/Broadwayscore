name: Land retry on cancel

# BRO-4246: land.yml's Land job waits in the single-pending `landing`
# concurrency group (shared with autonomous-merge.yml); a newer landing queuing
# behind it cancels it even though Checks passed.
# BRO-4653: re-running every cancelled Land job at once made the re-runs evict
# each other and spent the whole attempt budget in one landing burst. Now each
# firing is a SWEEP: while a Land job or Autonomous Merge run holds or waits
# for the slot it does nothing (no attempt spent); once the slot is free it
# re-runs at most ONE stranded cancelled Land job, oldest first. It fires when a Land or Autonomous
# Merge run completes (the moment the slot frees) and on a cron backstop.
# BRO-4677: under sustained traffic the slot is never free, so waiting for free
# starved evicted runs. Now a slot held by ONE running job with nobody pending
# also gets a re-run (it takes the empty pending seat, evicting nobody); the
# sweep waits only while a pending entrant exists (then the 30-min aging rule
# of BRO-4676 applies).
# Decision logic + tests: scripts/lib/land-retry-on-cancel{,.test} and
# scripts/lib/land-queue-backoff{,.test}.

on:
  workflow_run:
    workflows: ['Land', 'Autonomous Merge']
    types: [completed]
  schedule:
    # Backstop for a missed or dropped completion event (cron is throttled
    # under load; the completion trigger does the real work).
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  sweep:
    name: Re-run one stranded Land job
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      # One sweep at a time, so two sweeps never both see the slot free and
      # evict each other's re-run. A newer pending sweep replacing an older
      # one loses nothing: it makes the same decision.
      group: land-retry-sweep
      cancel-in-progress: false
    steps:
      # Sparse: run 37360514150 was cancelled at the 5-min timeout inside a
      # full checkout of the 2.5 GB repo (BRO-4754). The sweep needs only
      # scripts/ and the notify-failure action.
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            scripts
            .github/actions
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Sweep for a stranded Land run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # BRO-4651: fallback when GITHUB_TOKEN's quota is exhausted mid-burst.
          GH_FALLBACK_TOKEN: ${{ secrets.REVIEW_TEXTS_TOKEN }}
        run: node scripts/land-retry-cancelled.js --sweep

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: 'Land retry sweep failed'
          description: 'sweep after ${{ github.event_name }} could not check or re-run stranded Land jobs'
          severity: 'warning'
