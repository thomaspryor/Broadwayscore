name: Check Morning Digest Sent

# BRO-4373 / BRO-6764: two live signals, both from GitHub so they work while the Mac is dead.
# The morning digest is sent by morning-digest-action.yml (cron 07:50 ET with retries to ~08:50);
# this job runs later and checks (1) the digest reached the owner today (mac:morning-digest-missing:
# the Action itself failed) and (2) the Mac's checkout-sync heartbeat is fresh
# (mac:checkin-heartbeat-dead: Mac off or at the FileVault login screen; 2026-09-25..29 it was
# dark for 4.5 days unnoticed). Own alert keys so one re-arming cannot resolve the other.
# 16:30 UTC = 12:30 EDT / 11:30 EST, after the Action's last retry plus GHA cron lateness.
# An unreadable Resend API or an undelivered page exits 2: job red + critical
# notify-failure email (severity 'warning' would send nothing), and never a false page.
on:
  schedule:
    - cron: '30 16 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Report only, no routeAlert'
        required: false
        default: 'false'
        type: boolean
      date:
        description: 'ET day to check, YYYY-MM-DD (default: today)'
        required: false
        default: ''

concurrency:
  group: check-morning-digest-sent
  cancel-in-progress: false

permissions:
  contents: write
  statuses: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Check the morning digest was sent
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          DRY_RUN: ${{ inputs.dry_run }}
          CHECK_DATE: ${{ inputs.date }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARGS="--signal=digest"
          [ "$DRY_RUN" = "true" ] && ARGS="$ARGS --dry-run"
          # Validate before use: workflow_dispatch input reaches a shell.
          if [ -n "$CHECK_DATE" ]; then
            echo "$CHECK_DATE" | grep -qE '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' || { echo "bad date"; exit 2; }
            ARGS="$ARGS --date=$CHECK_DATE"
          fi
          node scripts/check-morning-digest-sent.js $ARGS

      - name: Check the Mac heartbeat
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          DRY_RUN: ${{ inputs.dry_run }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARGS="--signal=heartbeat"
          if [ "$DRY_RUN" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          node scripts/check-morning-digest-sent.js $ARGS

      # routeAlert()/resolveCondition() write the cooldown ledger on the
      # runner's disk; without this commit the 20h cooldown never persists.
      - name: Commit alert ledger
        if: always()
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          [ "$DRY_RUN" = "true" ] && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in data/audit/alert-ledger.json data/audit/alert-digest-queue.json data/audit/alert-router-attempts.jsonl; do
            [ -e "$f" ] && git add "$f" || echo "skip (absent): $f"
          done
          if git diff --staged --quiet; then
            echo "No ledger change to commit."
            exit 0
          fi
          git commit -m "audit: Update morning-digest liveness alert ledger [skip ci]"
          bash scripts/lib/push-with-retry.sh 5 main

      - name: Notify on failure
        if: failure() || cancelled()
        uses: ./.github/actions/notify-failure
        with:
          title: 'Check Morning Digest Sent Failed (cannot verify the digest)'
          severity: 'critical'
          email: 'true'
          # A blind checker for 2 daily runs is worth an email; one blip is not.
          min_consecutive_failures: '2'
          resend_api_key: ${{ secrets.RESEND_API_KEY }}
          owner_email: ${{ secrets.OWNER_EMAIL }}
