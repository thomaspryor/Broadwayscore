name: Cleanup Stale Multi-Show Flags

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no file changes)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

concurrency:
  group: cleanup-multishow-flags
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Checkout review-texts (private repo)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: thomaspryor/broadway-review-texts
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
          path: data/review-texts

      - name: Checkout core data
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: 'npm'

      # The script runs the scorer's own detector (TypeScript, via tsx).
      - name: Install dependencies
        run: npm ci

      - name: Run cleanup script
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" == "true" ]; then
            ARGS="--dry-run"
          fi
          node scripts/cleanup-stale-multishow-flags.js $ARGS

      - name: Push review-texts to private repo
        if: inputs.dry_run != 'true'
        uses: ./.github/actions/push-review-texts
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
          message: "data: Cleanup stale isMultiShowReview flags (threshold raised to 5)"

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: 'Cleanup Multishow Flags Failed'
          discord_webhook: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
