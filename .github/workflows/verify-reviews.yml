name: Verify Review Counts

on:
  workflow_dispatch:  # Manual trigger only

permissions:
  contents: read
  actions: read

jobs:
  verify-reviews:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5


      - name: Checkout core data
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Run review verification
        run: npm run reviews:verify > verification-results.txt 2>&1
        continue-on-error: true
        env:
          SCRAPINGBEE_API_KEY: ${{ secrets.SCRAPINGBEE_API_KEY }}

      - name: Display results
        run: cat verification-results.txt

      - name: Upload results
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: review-verification-results
          path: |
            verification-results.txt
            debug-html/
          retention-days: 30

      - name: Create summary
        run: |
          echo "## Review Verification Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          cat verification-results.txt >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download the full results and HTML files from the workflow artifacts." >> $GITHUB_STEP_SUMMARY
      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: 'Verify Reviews Failed'
          discord_webhook: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
