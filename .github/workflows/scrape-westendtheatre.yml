name: Scrape WestEndTheatre Roundups

on:
  schedule:
    # Weekly on Sundays at 5 PM UTC (12 PM EST), after LTD at 4 PM
    - cron: '0 17 * * 0'
  workflow_dispatch:
    inputs:
      show:
        description: 'Single show ID to scrape (e.g., hamilton-west-end-2021)'
        required: false
        type: string
      dry_run:
        description: 'Dry run (no writes)'
        required: false
        type: boolean
        default: false
      force:
        description: 'Re-scrape shows with existing archives'
        required: false
        type: boolean
        default: false

concurrency:
  group: westendtheatre-scrape
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  scrape-westendtheatre:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Checkout core data
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}

      - name: Checkout review-texts (private repo)
        uses: ./.github/actions/checkout-review-texts
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}

      # Without this, data/aggregator-archive/westendtheatre/ is empty in CI,
      # the script's existing-archive skip never fires, and every matched post
      # is re-scraped from scratch each week (the cause of the 30-min timeout
      # kills, e.g. run 27099733099 on 2026-06-07). Also restores the
      # _no-ratings-cache.json negative cache.
      - name: Checkout aggregator-archive (private repo)
        uses: ./.github/actions/checkout-aggregator-archive
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Playwright
        uses: ./.github/actions/setup-playwright

      - name: Run WestEndTheatre scraper
        env:
          SCRAPINGBEE_API_KEY: ${{ secrets.SCRAPINGBEE_API_KEY }}
          BRIGHTDATA_TOKEN: ${{ secrets.BRIGHTDATA_TOKEN }}
          BRIGHTDATA_ZONE: ${{ secrets.BRIGHTDATA_ZONE }}
        run: |
          ARGS=""

          if [ -n "${{ inputs.show }}" ]; then
            ARGS="$ARGS --show=${{ inputs.show }}"
          fi

          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi

          if [ "${{ inputs.force }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi

          # Exit cleanly before the 30-min job timeout; deferred posts are
          # picked up next run (archives + no-ratings cache persist progress).
          ARGS="$ARGS --time-budget-min=25"

          # shellcheck disable=SC2086
          node scripts/scrape-westendtheatre-roundups.js $ARGS

      - name: Commit data changes
        if: always() && inputs.dry_run != true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          bash scripts/lib/stage-data-changes.sh
          git diff --staged --quiet && echo "No data changes" && exit 0
          git commit -m "data: Update WestEndTheatre review data"
          bash scripts/lib/push-with-retry.sh 5 main

      - name: Push review-texts to private repo
        if: always() && inputs.dry_run != true
        uses: ./.github/actions/push-review-texts
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
          message: 'data: Update from scrape-westendtheatre'

      - name: Push aggregator-archive to private repo
        if: always() && inputs.dry_run != true
        uses: ./.github/actions/push-aggregator-archive
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
          message: 'data: WestEndTheatre aggregator archive'

      - name: Trigger rebuild
        if: always() && inputs.dry_run != true
        run: |
          gh workflow run rebuild-reviews.yml -f reason="Post WestEndTheatre scrape" || echo "Rebuild dispatch failed"
        env:
          GH_TOKEN: ${{ secrets.REVIEW_TEXTS_TOKEN }}

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: 'Scrape WestEndTheatre Roundups Failed'
          discord_webhook: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
          resend_api_key: ${{ secrets.RESEND_API_KEY }}
          owner_email: ${{ secrets.OWNER_EMAIL }}
