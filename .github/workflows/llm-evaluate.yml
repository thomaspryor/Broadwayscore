name: LLM Scoring Evaluation

on:
  workflow_dispatch:
    inputs:
      test_size:
        description: 'Number of reviews in test set'
        required: false
        default: '20'
      stratify:
        description: 'Stratify by outlet tier'
        required: false
        default: true
        type: boolean

env:
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

permissions:
  contents: write
  actions: read

jobs:
  evaluate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main


      - name: Checkout core data
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run evaluation
        env:
          INPUT_TEST_SIZE: ${{ github.event.inputs.test_size }}
        run: |
          ARGS="--test-size=${INPUT_TEST_SIZE} --save-results --verbose"
          if [ "${{ github.event.inputs.stratify }}" == "true" ]; then
            ARGS="$ARGS --by-outlet"
          fi
          npx ts-node --project scripts/tsconfig.json scripts/llm-scoring/evaluate.ts $ARGS

      - name: Upload results
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: evaluation-results
          path: data/llm-evaluation-results.json

      - name: Commit results
        if: always()
        env:
          INPUT_TEST_SIZE: ${{ github.event.inputs.test_size }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/llm-evaluation-results.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: LLM evaluation results (n=${INPUT_TEST_SIZE})

            Co-Authored-By: Claude <noreply@anthropic.com>"
            bash scripts/lib/push-with-retry.sh
          fi
      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: 'Llm Evaluate Failed'
          severity: 'warning'
          discord_webhook: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
