name: Commercial Stale Closures Classifier

# Daily 8 AM UTC scan of closed Broadway shows. Any show that has been closed
# 30+ days with no recoupment news in trade press gets auto-classified as
# 'Fizzle' (softer than Flop — modest loss, inferred from absent evidence).
# Writes DIRECTLY to commercial.json; doesn't route through pending-review.
#
# Carve-outs (in classify-stale-closure.js):
#   - tour-stop / international-transfer productionTypes (return engagements are labelled, BRO-6218)
#   - Nonprofit designation (unless enhancement)
#   - Enhancement deals → human-review escalation, never auto-Fizzle
#   - humanReviewedDesignation:true → never auto-classify
#   - Late recoupment signal in pending/archive (last 30d) → human-review
#
# Also enrolls an empty TBD stub for every Broadway show that is announced,
# upcoming, in previews or open with no commercial.json record (BRO-5776: stubs
# used to appear only on opening night, so the season report had no record for
# announced shows).
#
# Also appends the daily per-season payback row to season-payback-history.json
# (BRO-6335).
#
# Concurrency group commercial-data-write — queues with Friday, Saturday,
# (future) RSS poller.

on:
  schedule:
    - cron: '0 8 * * *'  # 8 AM UTC daily
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no commercial.json writes)'
        required: false
        type: boolean
        default: false
      show:
        description: 'Single show slug to classify (skips bulk scan)'
        required: false
        type: string
      grace_days:
        description: 'Days closed before classification (default 7)'
        required: false
        type: number
        default: 7
      max_shows:
        description: 'Max shows to classify per run (default 50)'
        required: false
        type: number
        default: 50

concurrency:
  group: commercial-data-write
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout core data
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}

      - uses: ./.github/actions/setup-node
        with:
          configure-git: 'true'

      - name: Classify stale closures
        env:
          INPUT_SHOW: ${{ inputs.show }}
        run: |
          ARGS="--grace-days=${{ inputs.grace_days || '7' }}"
          ARGS="$ARGS --max-shows=${{ inputs.max_shows || '50' }}"
          if [ -n "${INPUT_SHOW}" ]; then
            ARGS="$ARGS --show=${INPUT_SHOW}"
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          # BRO-3490: judgment-call escalations go to a report the Linear
          # step below files as cards.
          ARGS="$ARGS --report-json=/tmp/stale-closure-report.json"
          node scripts/classify-stale-closures.js $ARGS

      - name: Enroll announced Broadway stubs
        # BRO-5776. LLM-free and idempotent; continue-on-error so an enrollment
        # problem never blocks the Fizzle classifications or their push.
        continue-on-error: true
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="--dry-run"
          fi
          node scripts/enroll-announced-commercial-stubs.js $ARGS

      - name: Refresh recoupment model
        # Daily catch-all (BRO-4985): any writer that changed a weekly cost
        # since the last model run (Reddit gap-fill, RSS poll, deep research,
        # status updates) gets its break-even and recoupment % recomputed
        # within a day instead of waiting for Friday. Local math, no API spend.
        if: inputs.dry_run != true
        run: node scripts/merge-model-recoupment.js

      - name: Record season payback history
        # BRO-6335: one row per season per day (capital, money back low/mid/high)
        # so /biz/season/[season] can show how a season's payback has grown.
        # Reads the freshly refreshed commercial.json; same-day reruns replace
        # the day's row. continue-on-error: a failed append never blocks the
        # Fizzle classifications or their push.
        if: inputs.dry_run != true
        continue-on-error: true
        run: npx tsx scripts/append-season-payback-history.ts

      - name: Validate post-classification
        # No continue-on-error: ship-check CDX-P0-4. If validate-data rejects
        # the new Fizzle entries, abort before any push/deploy.
        if: inputs.dry_run != true
        run: node scripts/validate-data.js

      - name: Deletion guard for commercial.json
        if: always() && inputs.dry_run != true
        run: |
          node -e "
            const fs = require('fs');
            if (!fs.existsSync('./data/commercial.json')) process.exit(0);
            const c = JSON.parse(fs.readFileSync('./data/commercial.json','utf8'));
            const count = Object.keys(c.shows || {}).length;
            console.log('commercial show count: ' + count);
            if (count < 120) {
              console.error('::error::commercial show count dropped below 120 (' + count + ')');
              process.exit(1);
            }
          "

      - name: Push core data to private repo
        if: inputs.dry_run != true
        uses: ./.github/actions/push-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
          message: 'data: Stale-closure Fizzle classifications and announced-show commercial stubs'

      - name: Dispatch deploy
        if: inputs.dry_run != true
        uses: ./.github/actions/dispatch-deploy

      - name: Linear — surface stale-closure reviews
        # BRO-3490: one parked Linear issue per judgment-call escalation
        # (enhancement deal, late recoupment signal), deduped by exact title.
        # Never-researched shows are not filed: deep-research-commercial.js
        # ranks them right after its queue. Runs after the data push with its
        # own timeout so a slow Linear call can never cost the push.
        if: always() && inputs.dry_run != true
        timeout-minutes: 10
        continue-on-error: true
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        run: |
          if [ -f /tmp/stale-closure-report.json ]; then
            node scripts/notify-pending-commercial-linear.js \
              --report-json=/tmp/stale-closure-report.json --cap=25
          fi

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: 'Commercial Stale Closures Classifier Failed'
          severity: 'warning'
