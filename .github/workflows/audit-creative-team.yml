name: Audit Creative Team Data

on:
  workflow_dispatch:
    inputs:
      show:
        description: 'Optional: specific show slug to audit'
        required: false
        type: string
      status:
        description: 'Filter by show status'
        required: false
        type: choice
        options:
          - all
          - open
          - previews
          - closed
      limit:
        description: 'Max shows to process (0 = all)'
        required: false
        default: '0'
        type: string

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main


      - name: Checkout core data
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci || npm install

      - name: Setup Playwright
        uses: ./.github/actions/setup-playwright

      - name: Run creative team audit
        id: audit
        env:
          SCRAPINGBEE_API_KEY: ${{ secrets.SCRAPINGBEE_API_KEY }}
          SCRAPINGDOG_API_KEY: ${{ secrets.SCRAPINGDOG_API_KEY }}
          SCRAPER_USE_SCRAPINGDOG: '1'
          BRIGHTDATA_TOKEN: ${{ secrets.BRIGHTDATA_TOKEN }}
          BRIGHTDATA_ZONE: ${{ secrets.BRIGHTDATA_ZONE }}
        run: |
          FLAGS="--checkpoint"

          if [ -n "${{ inputs.show }}" ]; then
            FLAGS="$FLAGS --show=${{ inputs.show }}"
          fi

          if [ -n "${{ inputs.status }}" ] && [ "${{ inputs.status }}" != "all" ]; then
            FLAGS="$FLAGS --status=${{ inputs.status }}"
          fi

          if [ "${{ inputs.limit }}" != "0" ] && [ -n "${{ inputs.limit }}" ]; then
            FLAGS="$FLAGS --limit=${{ inputs.limit }}"
          fi

          echo "Running: node scripts/audit-creative-team.js $FLAGS"
          node scripts/audit-creative-team.js $FLAGS

      - name: Commit audit results
        if: always()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add data/audit/creative-team-audit.json || true

          if git diff --cached --quiet; then
            echo "No audit changes to commit"
            exit 0
          fi

          git commit -m "data: Creative team audit results"

          bash scripts/lib/push-with-retry.sh
      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: 'Audit Creative Team Failed'
          severity: 'warning'
          discord_webhook: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
