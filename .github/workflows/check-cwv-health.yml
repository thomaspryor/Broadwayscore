name: Check Core Web Vitals

on:
  schedule:
    - cron: '0 9 * * 0'  # Sunday 9 AM UTC (after SEO check at 8 AM)
  workflow_dispatch: {}

concurrency:
  group: cwv-health
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install Lighthouse
        run: npm install -g lighthouse

      - name: Run Lighthouse audits
        env:
          DISCORD_WEBHOOK_ALERTS: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
        run: |
          node -e '
          const { execSync } = require("child_process");
          const fs = require("fs");

          const SITE_URL = "https://broadwayscorecard.com";
          const RESULTS_FILE = "data/audit/cwv-results.json";
          fs.mkdirSync("data/audit", { recursive: true });

          function runLighthouse(formFactor) {
            const presetFlag = formFactor === "desktop" ? "--preset=desktop" : "";
            const results = [];

            for (let i = 1; i <= 3; i++) {
              console.log("  Pass " + i + "/3 (" + formFactor + ")...");
              const outFile = "/tmp/lh-" + formFactor + "-" + i + ".json";
              try {
                execSync(
                  "lighthouse " + SITE_URL + " --output=json --output-path=" + outFile +
                  " --chrome-flags=\"--headless --no-sandbox --disable-gpu\" " +
                  presetFlag + " --only-categories=performance --quiet",
                  { stdio: "pipe", timeout: 90000 }
                );
                const report = JSON.parse(fs.readFileSync(outFile, "utf8"));
                results.push({
                  lcp: report.audits["largest-contentful-paint"].numericValue || 0,
                  cls: report.audits["cumulative-layout-shift"].numericValue || 0,
                  tbt: report.audits["total-blocking-time"].numericValue || 0,
                  fcp: report.audits["first-contentful-paint"].numericValue || 0,
                  speedIndex: report.audits["speed-index"].numericValue || 0,
                });
              } catch (e) {
                console.log("  Warning: Lighthouse pass " + i + " failed: " + e.message.substring(0, 100));
              }
            }

            if (results.length === 0) return { lcp: 0, cls: 0, tbt: 0, fcp: 0, speedIndex: 0 };

            // Return median of each metric
            const median = (arr) => {
              const sorted = [...arr].sort((a, b) => a - b);
              return sorted[Math.floor(sorted.length / 2)];
            };
            return {
              lcp: median(results.map(r => r.lcp)),
              cls: median(results.map(r => r.cls)),
              tbt: median(results.map(r => r.tbt)),
              fcp: median(results.map(r => r.fcp)),
              speedIndex: median(results.map(r => r.speedIndex)),
            };
          }

          console.log("Running mobile audits...");
          const mobile = runLighthouse("mobile");

          console.log("Running desktop audits...");
          const desktop = runLighthouse("desktop");

          const now = new Date().toISOString();
          const results = { timestamp: now, url: SITE_URL, mobile, desktop };

          // Load history and append
          let history = { runs: [] };
          try { history = JSON.parse(fs.readFileSync(RESULTS_FILE, "utf8")); } catch {}
          history.runs.push(results);
          if (history.runs.length > 26) history.runs = history.runs.slice(-26);
          history.latest = results;
          fs.writeFileSync(RESULTS_FILE, JSON.stringify(history, null, 2));

          // Check thresholds
          const alerts = [];
          const m = results.mobile;
          const d = results.desktop;
          // CI runners are ~30-50% slower than real devices; thresholds account for this
          if (m.lcp > 5000) alerts.push("Mobile LCP: " + (m.lcp/1000).toFixed(1) + "s (threshold: 5s)");
          if (m.cls > 0.1) alerts.push("Mobile CLS: " + m.cls.toFixed(3) + " (threshold: 0.1)");
          if (m.tbt > 750) alerts.push("Mobile TBT: " + m.tbt.toFixed(0) + "ms (threshold: 750ms)");
          if (d.lcp > 2500) alerts.push("Desktop LCP: " + (d.lcp/1000).toFixed(1) + "s (threshold: 2.5s)");
          if (d.cls > 0.1) alerts.push("Desktop CLS: " + d.cls.toFixed(3) + " (threshold: 0.1)");
          if (d.tbt > 300) alerts.push("Desktop TBT: " + d.tbt.toFixed(0) + "ms (threshold: 300ms)");

          // Print summary
          console.log("=== Core Web Vitals Summary ===");
          console.log("Mobile:  LCP=" + (m.lcp/1000).toFixed(1) + "s  CLS=" + m.cls.toFixed(3) + "  TBT=" + m.tbt.toFixed(0) + "ms  FCP=" + (m.fcp/1000).toFixed(1) + "s  SI=" + (m.speedIndex/1000).toFixed(1) + "s");
          console.log("Desktop: LCP=" + (d.lcp/1000).toFixed(1) + "s  CLS=" + d.cls.toFixed(3) + "  TBT=" + d.tbt.toFixed(0) + "ms  FCP=" + (d.fcp/1000).toFixed(1) + "s  SI=" + (d.speedIndex/1000).toFixed(1) + "s");

          if (alerts.length > 0) {
            console.log("\n⚠️  THRESHOLD VIOLATIONS:");
            alerts.forEach(a => console.log("  - " + a));

            // Send Discord alert
            const webhook = process.env.DISCORD_WEBHOOK_ALERTS;
            if (webhook) {
              const payload = JSON.stringify({
                content: "⚠️ **Core Web Vitals Alert**\n" +
                  alerts.map(a => "• " + a).join("\n") +
                  "\n\nMobile: LCP=" + (m.lcp/1000).toFixed(1) + "s CLS=" + m.cls.toFixed(3) + " TBT=" + m.tbt.toFixed(0) + "ms" +
                  "\nDesktop: LCP=" + (d.lcp/1000).toFixed(1) + "s CLS=" + d.cls.toFixed(3) + " TBT=" + d.tbt.toFixed(0) + "ms",
              });
              try {
                fs.writeFileSync("/tmp/discord-payload.json", payload);
                execSync("curl -s -X POST -H \"Content-Type: application/json\" -d @/tmp/discord-payload.json \"" + webhook + "\"", { stdio: "pipe" });
                console.log("Discord alert sent");
              } catch (e) {
                console.log("Discord alert failed: " + e.message);
              }
            }
          } else {
            console.log("\n✅ All metrics within thresholds");
          }
          '

      - name: Commit audit data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --force data/audit/cwv-results.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No audit data changes to commit"
          else
            git commit -m "chore: Update Core Web Vitals audit data [skip ci]"
          fi

      - name: Push audit data
        if: always()
        run: |
          bash scripts/lib/push-with-retry.sh

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: 'Core Web Vitals Check Failed'
          discord_webhook: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
