# Scrape NYSR reviews via WordPress REST API
name: Scrape NYSR Reviews

on:
  schedule:
    - cron: '0 10 * * 0'  # Weekly on Sundays at 10 AM UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-nysr:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}


      - name: Checkout core data
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
      - name: Checkout review-texts from private repo
        uses: ./.github/actions/checkout-review-texts
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
      - name: Checkout aggregator-archive (private repo)
        uses: ./.github/actions/checkout-aggregator-archive
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}

      - uses: ./.github/actions/setup-node

      - name: Scrape NYSR reviews
        run: |
          echo "Scraping NYSR reviews via WordPress API..."
          node scripts/scrape-nysr-reviews.js

      - name: Push review-texts to private repo
        if: always()
        uses: ./.github/actions/push-review-texts
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
          message: 'data: NYSR review scrape'
      - name: Push aggregator-archive to private repo
        if: always()
        uses: ./.github/actions/push-aggregator-archive
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
          message: 'data: NYSR aggregator archive'

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: 'NYSR Scraper Failed'
          discord_webhook: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
          resend_api_key: ${{ secrets.RESEND_API_KEY }}
          owner_email: ${{ secrets.OWNER_EMAIL }}
