name: Show Refresh Kill Switch

# BRO-8056: the reader kill switch for per-show publishing. kill sets the
# kill row killed:true in public.show_refresh_state (written, read back
# and confirmed); the phase-2 reader then renders the build's own data. How
# fast a page reflects it depends on the reader's caching, which phase 2 sets
# and measures (no promise here). unkill reverses it. status prints the
# current state. Nothing reads the store until phase 2 lands (flag OFF), so
# today this changes nothing a visitor sees. After a kill or unkill the
# job revalidates every cached show page (scripts/show-refresh-revalidate.js).
#
# Run: Actions -> Show Refresh Kill Switch -> action + reason.
# No npm ci: the CLI uses only Node built-ins.

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'kill, unkill or status'
        required: true
        type: choice
        options: [status, kill, unkill]
      reason:
        description: 'Why (recorded on the kill row; defaults to the action and who ran it)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: show-refresh-kill
  cancel-in-progress: false

jobs:
  switch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Apply
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # --status also checks what the site reader (public anon key) sees.
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          ACTION: ${{ inputs.action }}
          REASON: ${{ inputs.reason }}
        run: |
          set -eo pipefail  # the tee must not hide a failed kill
          # An empty reason must never block an emergency kill.
          REASON="${REASON:-workflow $ACTION by $GITHUB_ACTOR}"
          if [ "$ACTION" = "status" ]; then
            node scripts/show-refresh-store.js --status | tee -a "$GITHUB_STEP_SUMMARY"
          else
            # The kill/unkill itself confirms the stored state; a failure here fails the job.
            node scripts/show-refresh-store.js "--$ACTION" "--reason=$REASON" | tee -a "$GITHUB_STEP_SUMMARY"
            # Status afterwards is informational: an unhealthy home.json must not
            # turn a successful kill red.
            node scripts/show-refresh-store.js --status | tee -a "$GITHUB_STEP_SUMMARY" \
              || echo "::warning::the kill row was set, but the store status check is unhealthy (see summary)"
          fi

      # BRO-8170 gap 2: the kill row only changes what the NEXT render reads.
      # Pages, reviews.json and OG images already cached from a slice keep
      # serving it until their 24 h ISR expiry, so drop them now. Separate step
      # so a failed kill never reaches it, and its own failure (wrong secret,
      # 5xx) turns the run red and notifies. Exit 3 = SHOW_REFRESH_REVALIDATE_SECRET
      # unset here: a warning while the reader is off.
      - name: Revalidate cached show pages
        if: inputs.action != 'status'
        env:
          SHOW_REFRESH_REVALIDATE_SECRET: ${{ secrets.SHOW_REFRESH_REVALIDATE_SECRET }}
        run: |
          set -o pipefail
          rc=0
          node scripts/show-refresh-revalidate.js | tee -a "$GITHUB_STEP_SUMMARY" || rc=$?
          if [ "$rc" = 3 ]; then
            echo "::warning::cached show pages were not revalidated: SHOW_REFRESH_REVALIDATE_SECRET is not set (fine while the reader flag is off)"
            exit 0
          fi
          exit "$rc"

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: 'Show Refresh Kill Switch Failed'
          severity: 'warning'
          discord_webhook: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
