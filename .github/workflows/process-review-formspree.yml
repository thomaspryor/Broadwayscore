name: Process Review Submissions (Formspree)

on:
  schedule:
    # Run daily at 6 AM UTC (1 AM EST) — after adjudication, before rebuild
    - cron: '0 6 * * *'
  workflow_dispatch: # Manual trigger

jobs:
  process-submissions:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}


      - name: Checkout core data
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Fetch Formspree submissions and create issues
        env:
          FORMSPREE_REVIEW_TOKEN: ${{ secrets.FORMSPREE_REVIEW_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/process-review-formspree.js

      - name: Commit tracking file
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/audit/processed-review-submissions.json
          if git diff --staged --quiet; then
            echo "No tracking changes to commit"
          else
            git commit -m "chore: update processed review submissions tracking"
            pushed=false
            for i in 1 2 3 4 5; do
              if git push origin main; then
                echo "Push succeeded on attempt $i"
                break
              fi
              echo "Push failed (attempt $i), pulling and rebasing..."
              echo "--- Unstaged files before cleanup ---"
              git status --porcelain 2>/dev/null || true
              git checkout -- . 2>/dev/null || true
              git clean -fd 2>/dev/null || true
              if git pull --rebase -X theirs origin main; then
                echo "Rebase succeeded, retrying push..."
              else
                echo "Rebase failed, aborting..."
                git rebase --abort 2>/dev/null || true
              fi
              sleep $((10 + RANDOM % 20))
            done
            if [ "$pushed" != "true" ]; then
              echo "::warning::All push attempts failed"
            fi
          fi
