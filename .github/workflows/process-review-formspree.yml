name: Process Review Submissions (Formspree)

on:
  schedule:
    # Run daily at 6 AM UTC (1 AM EST) — after adjudication, before rebuild
    - cron: '0 6 * * *'
  workflow_dispatch: # Manual trigger

jobs:
  process-submissions:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}


      - name: Checkout core data
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Fetch Formspree submissions and create issues
        env:
          FORMSPREE_REVIEW_TOKEN: ${{ secrets.FORMSPREE_REVIEW_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/process-review-formspree.js

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: 'Process Review Formspree Failed'
          discord_webhook: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
          resend_api_key: ${{ secrets.RESEND_API_KEY }}
          owner_email: ${{ secrets.OWNER_EMAIL }}

      - name: Commit tracking file
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/audit/processed-review-submissions.json
          if git diff --staged --quiet; then
            echo "No tracking changes to commit"
          else
            git commit -m "chore: update processed review submissions tracking"
            bash scripts/lib/push-with-retry.sh
          fi
