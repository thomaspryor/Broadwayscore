name: Deploy to Vercel (gitSource)

# Fallback deploy method when CLI uploads are rate-limited.
# Uses Vercel REST API with gitSource — Vercel clones from GitHub directly,
# no file uploads needed.
#
# Deploys as preview first (immune to auto-cancellation from checkpoint pushes),
# then promotes to production via Vercel API.

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Get latest commit SHA
        id: sha
        run: |
          SHA=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/commits/main" \
            | jq -r '.sha')
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Deploying commit: $SHA"

      - name: Get repo ID
        id: repo
        run: |
          REPO_ID=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}" \
            | jq -r '.id')
          echo "repo_id=$REPO_ID" >> "$GITHUB_OUTPUT"
          echo "Repo ID: $REPO_ID"

      - name: Deploy as preview (immune to auto-cancel)
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          RESPONSE=$(curl -s -X POST "https://api.vercel.com/v13/deployments" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{
              "name": "broadwayscore",
              "gitSource": {
                "type": "github",
                "repoId": ${{ steps.repo.outputs.repo_id }},
                "ref": "main",
                "sha": "${{ steps.sha.outputs.sha }}"
              }
            }')

          URL=$(echo "$RESPONSE" | jq -r '.url // empty')
          ID=$(echo "$RESPONSE" | jq -r '.id // empty')
          ERROR=$(echo "$RESPONSE" | jq -r '.error.message // empty')

          if [ -n "$ERROR" ]; then
            echo "::error::Vercel API error: $ERROR"
            echo "$RESPONSE" | jq .
            exit 1
          fi

          echo "deploy_url=$URL" >> "$GITHUB_OUTPUT"
          echo "deploy_id=$ID" >> "$GITHUB_OUTPUT"
          echo "Preview deployment created: https://$URL (ID: $ID)"

      - name: Wait for build to complete
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          DEPLOY_URL="${{ steps.deploy.outputs.deploy_url }}"
          echo "Waiting for build at https://$DEPLOY_URL ..."
          for i in $(seq 1 60); do
            STATE=$(curl -s "https://$DEPLOY_URL" | grep -oE '(BUILDING|READY|ERROR|CANCELED|QUEUED)' | head -1)
            echo "  Check $i: $STATE"
            if [ "$STATE" = "READY" ] || [ -z "$STATE" ]; then
              # No state marker means the page loaded with real content
              HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://$DEPLOY_URL/lists")
              if [ "$HTTP_CODE" = "200" ]; then
                CONTENT=$(curl -s "https://$DEPLOY_URL/lists" | grep -c "gold-badge" || true)
                if [ "$CONTENT" -gt 0 ]; then
                  echo "Build complete! Gold badges found."
                  exit 0
                fi
                # Check if it's serving real content (not building page)
                HAS_CONTENT=$(curl -s "https://$DEPLOY_URL/lists" | grep -c "Gold Lists" || true)
                if [ "$HAS_CONTENT" -gt 0 ]; then
                  echo "Build complete! Site is serving."
                  exit 0
                fi
              fi
            fi
            if [ "$STATE" = "ERROR" ] || [ "$STATE" = "CANCELED" ]; then
              echo "::error::Deployment $STATE"
              exit 1
            fi
            sleep 15
          done
          echo "::error::Timed out waiting for build (15 min)"
          exit 1

      - name: Promote to production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          DEPLOY_ID="${{ steps.deploy.outputs.deploy_id }}"
          echo "Promoting deployment $DEPLOY_ID to production..."

          # Use the Vercel API to promote
          RESPONSE=$(curl -s -X POST "https://api.vercel.com/v10/projects/broadwayscore/promote/$DEPLOY_ID" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json")

          STATUS=$(echo "$RESPONSE" | jq -r '.status // .jobStatus // empty')
          ERROR=$(echo "$RESPONSE" | jq -r '.error.message // empty')

          if [ -n "$ERROR" ]; then
            echo "Promote API returned error: $ERROR"
            echo "Trying alternative promote method..."
            # Alternative: use alias API
            RESPONSE2=$(curl -s -X POST "https://api.vercel.com/v2/deployments/$DEPLOY_ID/aliases" \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"alias": "broadwayscorecard.com"}')
            echo "Alias response: $RESPONSE2"
          else
            echo "Promote response: $RESPONSE"
            echo "Status: $STATUS"
          fi

          echo "Production deployment complete!"
