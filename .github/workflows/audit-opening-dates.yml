name: Audit Opening Dates

# Daily LLM press-cluster audit for openingDate + previewsStartDate drift.
# Suggestion-only — no auto-mutation of shows.json. Findings route to a
# Notion card; human verifies + updates the private repo.
#
# Why a separate workflow from audit-closing-dates: different field-types,
# different cost profile (~$2/run vs ~$0.50), and we want to stagger the
# cron so they don't both fire at the same minute. See
# scripts/audit-opening-dates.js for design rationale.

on:
  schedule:
    - cron: '0 15 * * *'  # Daily 15:00 UTC — 1h after closing-date audit (14:00 UTC)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no Notion card)'
        required: false
        default: 'false'

# Read-only on shows.json — no concurrency group needed, but match the
# closing-date audit pattern so both audits share a Notion card slot.
concurrency:
  group: opening-date-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout core data
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Playwright
        uses: ./.github/actions/setup-playwright

      - name: Run opening-date audit
        env:
          BRIGHTDATA_TOKEN: ${{ secrets.BRIGHTDATA_TOKEN }}
          BRIGHTDATA_ZONE: ${{ secrets.BRIGHTDATA_ZONE }}
          SCRAPINGBEE_API_KEY: ${{ secrets.SCRAPINGBEE_API_KEY }}
          SCRAPINGDOG_API_KEY: ${{ secrets.SCRAPINGDOG_API_KEY }}
          SCRAPER_USE_SCRAPINGDOG: '1'
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            node scripts/audit-opening-dates.js --dry-run
          else
            node scripts/audit-opening-dates.js
          fi

      - name: Create summary
        if: always()
        run: |
          if [ -f data/audit/opening-date-discrepancies.json ]; then
            echo "## Opening Date Audit" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            node -e "
              const r = require('./data/audit/opening-date-discrepancies.json');
              const s = r.summary;
              const lines = [
                '**Mode:** ' + r.mode,
                '**Audited:** ' + s.audited,
                '**Flagged:** ' + s.flagged,
                '**Matches:** ' + s.matches,
                '**Errors:** ' + s.errors,
              ];
              console.log(lines.join('\\n'));
              if (r.flagged.length) {
                console.log('\\n### Flagged for review');
                r.flagged.forEach(f => console.log('- ' + f.id + ': stored ' + f.fieldType + '=' + (f.stored||'null') + ' vs press ' + f.discovered.date));
              }
            " >> $GITHUB_STEP_SUMMARY
          fi

      # audit-opening-dates.js's press-cluster discovery calls
      # closing-date-discovery.js's discoverAnnouncedDate, which uses
      # url-discovery.js's serpQuery and writes attribution rows to
      # data/audit/scraper-spend-ledger.jsonl on the runner's local disk (task
      # #752/#784). This workflow has never committed anything to the root
      # repo before (Notion-card-only + read-only shows.json audit) — never
      # staged the ledger (Sprint 3, card 3b1637c5).
      - name: Commit scraper-spend ledger
        if: always()
        continue-on-error: true  # telemetry-only commit (Sprint 3, card 3b1637c5) — push contention under concurrent scheduled runs must never fail an otherwise-successful job
        env:
          PUSH_RECONCILE_MERGED_JSON: '1'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/audit/scraper-spend-ledger.jsonl 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No ledger changes to commit"
          else
            git commit -m "chore: Record scraper-spend ledger (audit-opening-dates)"
            bash scripts/lib/push-with-retry.sh
          fi

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: 'Audit Opening Dates Failed'
          severity: 'warning'
