name: Opening Night Poller

# Fast review discovery for opening nights. Runs 4 layers:
#   1. Aggregators (BWW RR, Show Score, DTLI) — fastest
#   2. RSS feeds (Variety, NYT, Guardian) — free
#   3. Direct site search (outlet search endpoints) — instant
#   4. SERP backup (Google) — catches the rest
#
# Creates review files for newly discovered reviews.
# After discovery: triggers collect → rebuild → score pipeline chain.
#
# NO CRON — only dispatched by update-show-status.yml when a show transitions to open,
# or manually via workflow_dispatch for targeted polling.

on:
  # No cron — dispatched by update-show-status.yml only when a show actually opens.
  # Manual dispatch available for targeted polling.
  workflow_dispatch:
    inputs:
      show_id:
        description: 'Show ID to poll (leave empty for auto-discovery)'
        required: false
        type: string
        default: ''
      lookback_days:
        description: 'Days back to check for openings (default 2)'
        required: false
        type: number
        default: 2
      skip_serp:
        description: 'Skip SERP layer (save API credits)'
        required: false
        type: boolean
        default: false
      force_serp:
        description: 'Force SERP to run regardless of poll-mode cadence gate (manual overrides outside aggressive/morning windows)'
        required: false
        type: boolean
        default: false
      market:
        description: 'Filter to market (empty = all markets)'
        required: false
        type: string
        default: ''
      bww_roundup_url:
        description: 'Direct BWW Review Roundup URL to bypass SERP discovery (use when SERP returns wrong result)'
        required: false
        type: string
        default: ''
      tb_review_url:
        description: 'Direct Talkin Broadway review URL (SERP returns forum posts — use https://www.talkinbroadway.com/page/world/{title}{year}.html)'
        required: false
        type: string
        default: ''
      fast_path:
        description: 'Inline rebuild+deploy after scoring (skips separate rebuild-reviews.yml dispatch)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  # Per-run concurrency: each poller dispatch gets its own lane. The orchestrator
  # serializes dispatches via `gh run watch`, so concurrent pollers only happen
  # across markets (BW vs WE) — which is fine, they work on different shows.
  # The old shared group `opening-night-poller` had GitHub's 1-pending queue limit
  # cancel 30% of runs when dispatches overlapped (Cats postmortem 2026-04-07).
  group: opening-night-poller-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Checkout core data
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}

      - name: Checkout review-texts (private repo)
        uses: ./.github/actions/checkout-review-texts
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}

      - name: Find shows to poll
        id: find
        run: |
          # WE reviews publish 12-48h after press night; use longer window
          DEFAULT_LOOKBACK=2
          if [ "${{ inputs.market }}" = "west-end" ]; then
            DEFAULT_LOOKBACK=4
          fi
          LOOKBACK=${{ inputs.lookback_days || '' }}
          LOOKBACK=${LOOKBACK:-$DEFAULT_LOOKBACK}
          INPUT_SHOW="${{ inputs.show_id }}"
          MARKET="${{ inputs.market }}"

          if [ -n "$INPUT_SHOW" ]; then
            echo "Using manual show: $INPUT_SHOW"
            echo "shows=$INPUT_SHOW" >> $GITHUB_OUTPUT
            echo "has_shows=true" >> $GITHUB_OUTPUT
          else
            SHOWS=$(node -e "
              const shows = require('./data/shows.json').shows;
              const now = new Date();
              const cutoff = new Date(now);
              cutoff.setDate(cutoff.getDate() - $LOOKBACK);
              cutoff.setHours(0,0,0,0);
              const market = '$MARKET';
              const opened = shows.filter(s => {
                if (!s.openingDate) return false;
                // Include 'previews' shows whose opening date has passed — update-show-status
                // runs at 8 AM UTC but opening night polling starts at 9 PM ET (1 AM UTC),
                // so shows are still 'previews' during the critical polling window.
                const validStatus = s.status === 'open' || s.status === 'upcoming' ||
                  (s.status === 'previews' && new Date(s.openingDate) <= now);
                if (!validStatus) return false;
                const cat = s.category || 'broadway';
                if (cat !== 'broadway' && cat !== 'west-end' && cat !== 'off-west-end' && cat !== 'off-broadway') return false;
                if (market === 'broadway' && cat !== 'broadway' && cat !== 'off-broadway') return false;
                if (market === 'west-end' && cat !== 'west-end' && cat !== 'off-west-end') return false;
                const d = new Date(s.openingDate);
                d.setHours(0,0,0,0);
                return d >= cutoff && d <= now;
              });
              if (opened.length > 0) console.log(opened.map(s => s.id).join(','));
            ")

            if [ -z "$SHOWS" ]; then
              echo "No recently opened shows"
              echo "has_shows=false" >> $GITHUB_OUTPUT
            else
              echo "Recently opened shows: $SHOWS"
              echo "shows=$SHOWS" >> $GITHUB_OUTPUT
              echo "has_shows=true" >> $GITHUB_OUTPUT
            fi
          fi

      # Early exit if no shows — skip Node setup entirely
      - name: Early exit check
        if: steps.find.outputs.has_shows != 'true'
        run: echo "No shows to poll. Exiting."

      - uses: actions/setup-node@v5
        if: steps.find.outputs.has_shows == 'true'
        with:
          node-version: 20

      - name: Install dependencies
        if: steps.find.outputs.has_shows == 'true'
        run: npm ci

      - name: Setup Playwright
        if: steps.find.outputs.has_shows == 'true'
        uses: ./.github/actions/setup-playwright

      - name: Run poller for each show
        if: steps.find.outputs.has_shows == 'true'
        id: poll
        env:
          SCRAPINGBEE_API_KEY: ${{ secrets.SCRAPINGBEE_API_KEY }}
          BRIGHTDATA_TOKEN: ${{ secrets.BRIGHTDATA_TOKEN }}
          BRIGHTDATA_ZONE: ${{ secrets.BRIGHTDATA_ZONE }}
          BROWSERBASE_API_KEY: ${{ secrets.BROWSERBASE_API_KEY }}
          BROWSERBASE_PROJECT_ID: ${{ secrets.BROWSERBASE_PROJECT_ID }}
        run: |
          IFS=',' read -ra SHOW_ARRAY <<< "${{ steps.find.outputs.shows }}"
          ANY_NEW=false
          ANY_READY=false
          SKIP_SERP_FLAG=""
          if [ "${{ inputs.skip_serp }}" = "true" ]; then
            SKIP_SERP_FLAG="--skip-serp"
          fi
          FORCE_SERP_FLAG=""
          if [ "${{ inputs.force_serp }}" = "true" ]; then
            FORCE_SERP_FLAG="--force-serp"
          fi

          for SHOW_ID in "${SHOW_ARRAY[@]}"; do
            echo "════════════════════════════════════════"
            echo "Polling: $SHOW_ID"
            echo "════════════════════════════════════════"
            BWW_ARG=""
            TB_ARG=""
            if [ -n "${{ inputs.bww_roundup_url }}" ]; then
              BWW_ARG="--bww-roundup-url=${{ inputs.bww_roundup_url }}"
            fi
            if [ -n "${{ inputs.tb_review_url }}" ]; then
              TB_ARG="--tb-review-url=${{ inputs.tb_review_url }}"
            fi
            timeout 600 node scripts/opening-night-poller.js --show="$SHOW_ID" $SKIP_SERP_FLAG $FORCE_SERP_FLAG $BWW_ARG $TB_ARG 2>&1 || true

            # Check if files were created (review-texts is a separate git checkout)
            CREATED=$(cd data/review-texts && git status --porcelain | wc -l | tr -d ' ')
            if [ "$CREATED" -gt 0 ]; then
              ANY_NEW=true
              echo "  → $CREATED new review files"
            fi
          done

          echo "any_new=$ANY_NEW" >> $GITHUB_OUTPUT

      - name: Commit new review files
        if: steps.find.outputs.has_shows == 'true' && steps.poll.outputs.any_new == 'true'
        run: |
          cd data/review-texts
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "data: Opening night poller — new reviews discovered [skip ci]"
          bash ../../scripts/lib/push-with-retry.sh 5 main

      - name: Collect full text inline
        if: steps.find.outputs.has_shows == 'true' && steps.poll.outputs.any_new == 'true'
        env:
          SHOW_FILTER: ${{ steps.find.outputs.shows }}
          MAX_REVIEWS: '100'
          BATCH_SIZE: '10'
          ARCHIVE_FIRST: 'true'
          RETRY_FAILED: 'true'
          SCRAPINGBEE_API_KEY: ${{ secrets.SCRAPINGBEE_API_KEY }}
          BRIGHTDATA_TOKEN: ${{ secrets.BRIGHTDATA_TOKEN }}
          BRIGHTDATA_ZONE: ${{ secrets.BRIGHTDATA_ZONE }}
          BROWSERBASE_API_KEY: ${{ secrets.BROWSERBASE_API_KEY }}
          BROWSERBASE_PROJECT_ID: ${{ secrets.BROWSERBASE_PROJECT_ID }}
          BROWSERBASE_ENABLED: 'true'
          BROWSERBASE_MAX_SESSIONS_PER_RUN: '10'
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NYT_EMAIL: ${{ secrets.NYT_EMAIL }}
          NYTIMES_PASSWORD: ${{ secrets.NYTIMES_PASSWORD }}
          VULTURE_EMAIL: ${{ secrets.VULTURE_EMAIL }}
          VULTURE_PASSWORD: ${{ secrets.VULTURE_PASSWORD }}
          COOKIES_BUNDLE_1: ${{ secrets.COOKIES_BUNDLE_1 }}
          COOKIES_BUNDLE_2: ${{ secrets.COOKIES_BUNDLE_2 }}
          COOKIES_BUNDLE_3: ${{ secrets.COOKIES_BUNDLE_3 }}
          COOKIES_BUNDLE_4: ${{ secrets.COOKIES_BUNDLE_4 }}
          COOKIES_BUNDLE_5: ${{ secrets.COOKIES_BUNDLE_5 }}
          COOKIES_BUNDLE_6: ${{ secrets.COOKIES_BUNDLE_6 }}
          COOKIES_BUNDLE_7: ${{ secrets.COOKIES_BUNDLE_7 }}
          COOKIES_BUNDLE_8: ${{ secrets.COOKIES_BUNDLE_8 }}
          COOKIES_BUNDLE_9: ${{ secrets.COOKIES_BUNDLE_9 }}
          COOKIES_BUNDLE_10: ${{ secrets.COOKIES_BUNDLE_10 }}
          COOKIES_BUNDLE_11: ${{ secrets.COOKIES_BUNDLE_11 }}
        run: node scripts/collect-review-texts.js --aggressive
        continue-on-error: true
        timeout-minutes: 10

      - name: Commit collected texts
        if: steps.find.outputs.has_shows == 'true' && steps.poll.outputs.any_new == 'true'
        run: |
          cd data/review-texts
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "data: Opening night poller — collected review texts"
          bash ../../scripts/lib/push-with-retry.sh 5 main
        continue-on-error: true

      - name: Score reviews inline
        if: steps.find.outputs.has_shows == 'true' && steps.poll.outputs.any_new == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          SHOWS="${{ steps.find.outputs.shows }}"
          IFS=',' read -ra SHOW_ARRAY <<< "$SHOWS"
          for SHOW_ID in "${SHOW_ARRAY[@]}"; do
            echo "Scoring: $SHOW_ID"
            npx ts-node scripts/llm-scoring/index.ts --show="$SHOW_ID" --ensemble 2>&1 || true
          done
        continue-on-error: true
        timeout-minutes: 10

      - name: Commit scores
        if: steps.find.outputs.has_shows == 'true' && steps.poll.outputs.any_new == 'true'
        run: |
          cd data/review-texts
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "data: Opening night poller — scored reviews"
          bash ../../scripts/lib/push-with-retry.sh 5 main
        continue-on-error: true

      # === FAST PATH: inline rebuild+deploy (skips separate rebuild-reviews.yml) ===
      - name: Cancel competing rebuilds (fast_path)
        if: inputs.fast_path && steps.find.outputs.has_shows == 'true' && steps.poll.outputs.any_new == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Fast path: cancelling any in-progress rebuilds..."
          for id in $(gh run list --workflow=rebuild-reviews.yml --limit=5 --json databaseId,status \
            -q '.[] | select(.status=="in_progress" or .status=="queued") | .databaseId'); do
            echo "  Cancelling rebuild run $id"
            gh run cancel "$id" 2>/dev/null || true
          done
          for id in $(gh run list --workflow=rebuild-fast.yml --limit=3 --json databaseId,status \
            -q '.[] | select(.status=="in_progress" or .status=="queued") | .databaseId'); do
            echo "  Cancelling fast rebuild run $id"
            gh run cancel "$id" 2>/dev/null || true
          done
        continue-on-error: true

      - name: Rebuild reviews.json (fast_path)
        id: fast_rebuild
        if: inputs.fast_path && steps.find.outputs.has_shows == 'true' && steps.poll.outputs.any_new == 'true'
        env:
          REVIEW_TEXTS_TOKEN: ${{ secrets.REVIEW_TEXTS_TOKEN }}
        run: |
          echo "Fast path: rebuilding reviews.json inline..."
          if node scripts/rebuild-all-reviews.js; then
            echo "Rebuild succeeded"
          else
            echo "⚠️  Rebuild failed — re-cloning review-texts and retrying..."
            rm -rf data/review-texts
            git clone --depth 1 "https://x-access-token:${REVIEW_TEXTS_TOKEN}@github.com/thomaspryor/broadway-review-texts.git" data/review-texts
            node scripts/rebuild-all-reviews.js
          fi
        timeout-minutes: 5

      - name: Snapshot core data for private repo push (fast_path)
        if: inputs.fast_path && steps.fast_rebuild.outcome == 'success'
        run: |
          for f in reviews.json shows.json critic-consensus.json critic-registry.json outlet-registry.json; do
            if [ -f "data/$f" ]; then
              cp -f "data/$f" /tmp/core-data-snapshot/
            fi
          done

      - name: Update critic registry (fast_path)
        if: inputs.fast_path && steps.fast_rebuild.outcome == 'success'
        run: node scripts/audit-critic-outlets.js
        continue-on-error: true

      - name: Regenerate mobile detail JSONs (fast_path)
        if: inputs.fast_path && steps.fast_rebuild.outcome == 'success'
        run: node scripts/generate-mobile-show-details.js
        continue-on-error: true

      - name: Commit and push rebuilt data (fast_path)
        if: inputs.fast_path && steps.fast_rebuild.outcome == 'success'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/audit/*.json 2>/dev/null || true
          git add public/opening-night-status.json public/status.html 2>/dev/null || true
          git add public/data/shows/ 2>/dev/null || true
          git checkout -- data/reviews.json data/audience-buzz.json 2>/dev/null || true
          git diff --cached --quiet && { echo "No public data changes to commit"; exit 0; }
          git commit -m "data: Opening night poller (fast path) — inline rebuild"
          bash scripts/lib/push-with-retry.sh

      - name: Push core data to private repo (fast_path)
        if: always() && inputs.fast_path && steps.fast_rebuild.outcome == 'success'
        uses: ./.github/actions/push-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
          message: 'data: Opening night poller (fast path) — inline rebuild'

      - name: Trigger deploy (fast_path)
        if: inputs.fast_path && steps.fast_rebuild.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.REVIEW_TEXTS_TOKEN }}
        run: |
          echo "Fast path: triggering deploy..."
          gh workflow run vercel-deploy.yml || echo "Deploy dispatch failed — will deploy on next schedule"

      # === LEGACY PATH: dispatch rebuild-reviews.yml (when fast_path is off) ===
      - name: Trigger rebuild + deploy (legacy)
        if: (!inputs.fast_path) && steps.find.outputs.has_shows == 'true' && steps.poll.outputs.any_new == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run rebuild-reviews.yml -f reason="Opening night poller (inline)"

      - name: Rebuild reviews.json locally (for readiness check)
        if: steps.find.outputs.has_shows == 'true' && steps.poll.outputs.any_new == 'true'
        run: node scripts/rebuild-all-reviews.js 2>&1 | tail -5
        continue-on-error: true
        timeout-minutes: 5

      - name: Check readiness and trigger broadcast
        if: steps.find.outputs.has_shows == 'true' && steps.poll.outputs.any_new == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHOWS="${{ steps.find.outputs.shows }}"
          IFS=',' read -ra SHOW_ARRAY <<< "$SHOWS"
          for SHOW_ID in "${SHOW_ARRAY[@]}"; do
            RESULT=$(node -e "
              try {
                const { checkReadiness } = require('./scripts/opening-night-poller');
                const shows = require('./data/shows.json').shows;
                const s = shows.find(x => x.id === '$SHOW_ID');
                const market = (s && s.category) || 'broadway';
                const r = checkReadiness('$SHOW_ID', market);
                console.log(JSON.stringify(r));
              } catch(e) { console.log(JSON.stringify({ready:false,total:0,reasons:['error: '+e.message]})); }
            ")
            TOTAL=$(echo "$RESULT" | node -e "process.stdout.write(String(JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).total))")
            IS_READY=$(echo "$RESULT" | node -e "process.stdout.write(String(JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).ready))")
            REASONS=$(echo "$RESULT" | node -e "process.stdout.write((JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).reasons||[]).join(', '))")

            echo "$SHOW_ID: $TOTAL scored reviews, ready=$IS_READY ${REASONS:+(gaps: $REASONS)}"

            if [ "$IS_READY" = "true" ]; then
              # Guard: only dispatch if broadcast wasn't already sent or dispatched recently
              ALREADY_SENT=$(node -e "
                try {
                  const sent = require('./data/opening-night-sent.json');
                  const entry = sent.shows && sent.shows['$SHOW_ID'];
                  console.log(entry && entry.completed ? 'true' : 'false');
                } catch(e) { console.log('false'); }
              " 2>/dev/null || echo "false")

              RECENT_DISPATCH=$(gh run list --workflow=opening-night-broadcast.yml --limit=5 \
                --json createdAt -q "[.[] | select(.createdAt > \"$(date -u -d '2 hours ago' +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || date -u -v-2H +%Y-%m-%dT%H:%M:%SZ)\")] | length" 2>/dev/null || echo "0")

              if [ "$ALREADY_SENT" = "true" ]; then
                echo "★ $SHOW_ID is BROADCAST READY but already sent — skipping dispatch"
              elif [ "$RECENT_DISPATCH" -gt 0 ]; then
                echo "★ $SHOW_ID is BROADCAST READY but broadcast dispatched recently — skipping duplicate"
              else
                echo "★ $SHOW_ID is BROADCAST READY — dispatching broadcast"
                gh workflow run opening-night-broadcast.yml -f lookback_days=2 || true
              fi
            fi
          done

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: 'Opening Night Poller Failed'
          severity: 'critical'
          discord_webhook: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
