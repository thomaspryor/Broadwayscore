name: Scrape Waltz Weekly Costs

on:
  schedule:
    - cron: '0 14 * * 1'  # Monday 2 PM UTC (weekly-grosses lands Tue/Wed, so this sees the prior week's)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no files written)'
        required: false
        type: boolean
        default: false

concurrency:
  group: commercial-data-write
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  scrape-costs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout core data
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}

      - uses: ./.github/actions/setup-node
        with:
          configure-git: 'true'

      - name: Run Waltz cost scraper
        run: |
          # --record-history stores his dated weekly costs as costHistory
          # anchors for the live musical model (BRO-5604, was shadow BRO-4989).
          ARGS="--record-history"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          node scripts/scrape-boring-waltz-costs.js $ARGS

      - name: Refresh recoupment model
        if: inputs.dry_run != true
        # A new weekly cost changes break-even and recoupment %. Without this
        # the model kept the old cost until Friday (BRO-4985: three shows
        # showed a break-even below their refreshed cost).
        run: node scripts/merge-model-recoupment.js

      - name: Commit changes
        if: inputs.dry_run != true
        # Task #574: bare stage-data-changes.sh stages all of data/, so a
        # managed union-merged file (commercial.json et al.) could be swept
        # in even though this step never names one — see push-with-retry.sh's
        # reconcile_merged_json().
        env:
          PUSH_RECONCILE_MERGED_JSON: '1'
        run: |
          # Named explicitly (BRO-5027) so the apiFallbackSafe writer-drift
          # check can see this workflow as its sole writer.
          bash scripts/lib/git-add-existing.sh data/audit/waltz-model-fit.json
          bash scripts/lib/stage-data-changes.sh
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "data: Update weekly running costs from Boring Waltz posts

          Co-Authored-By: github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
            bash scripts/lib/push-with-retry.sh
          fi

      - name: Push core data to private repo
        if: inputs.dry_run != true
        uses: ./.github/actions/push-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
          message: 'data: Waltz weekly cost scraper update'

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: 'Waltz Weekly Cost Scraper Failed'
          severity: 'warning'
          discord_webhook: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
