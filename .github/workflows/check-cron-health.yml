name: Check Cron Health

on:
  schedule:
    - cron: '0 12 * * *'  # Noon UTC daily — checks that morning crons actually fired
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check critical crons ran recently
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Critical cron workflows and their max allowed gap (hours)
          # Format: "workflow_filename|max_hours|friendly_name"
          CRITICAL_CRONS=(
            "opening-night-broadcast.yml|36|Opening Night Broadcast"
            "opening-night-orchestrator.yml|25|Opening Night Orchestrator"
            "update-show-status.yml|36|Update Show Status"
            "rebuild-reviews.yml|36|Rebuild Reviews"
            "collect-review-texts.yml|36|Collect Review Texts"
            "llm-ensemble-score.yml|48|LLM Ensemble Score"
            "test.yml|48|Test Suite"
            # Daily 7 UTC. The BSC Daily digest carrier — the ONLY surface for all
            # non-critical alerting (cron staleness, cookie health, repeat-failures,
            # OB candidates). A *cancelled* run sends no digest and pages nothing, so
            # alerting goes dark with nobody to flag it (2/14 runs cancelled ~14% incl.
            # 2026-06-14). notify-failure ignores conclusion=cancelled. 26h (NOT the
            # generic daily 36h) is deliberate: this check runs at 12 UTC, 5h after the
            # 7 UTC digest, so on a cancel day the last SUCCESS is ~29h old at noon →
            # caught SAME day. 36h would let the next day's success reset the clock
            # before the next noon check, making a single cancel invisible — the exact
            # gap this entry closes. See Notion 381637c5-416f-81af; audit exemption in
            # scripts/audit-cron-health-coverage.js (TIGHT_BY_DESIGN).
            "data-health-check.yml|26|Daily Data Health Check (digest carrier)"
            "commercial-weekly.yml|192|Commercial Weekly Orchestrator"
            "fetch-todaytix-showtimes.yml|36|Fetch TodayTix Showtimes"
            "audit-closing-dates.yml|36|Audit Closing Dates"
            "audit-opening-dates.yml|36|Audit Opening Dates"
            "recover-explicit-ratings.yml|200|Recover Explicit Ratings"
            # Weekly Sun 14 UTC. Catches dead-token failure streaks AND weekly
            # sweeps silently cancelled while pending in the shared `theatr`
            # concurrency group (cancelled runs never alert via notify-failure).
            "update-theatr.yml|200|Update Theatr"
            "collect-we-ob-reviews.yml|50|Collect WE/OB Reviews"
            "sweep-we-aggregators.yml|192|Sweep WE Aggregators"
            # Real cadence: Mon 7 UTC + Thu 8 UTC → Thu→Mon gap is 95h.
            # 110h leaves a 15h cushion for cron lag (commonly 30min-3h per
            # memory/feedback_github_cron_delays.md, plus retries).
            "enrich-west-end-dates.yml|110|Enrich West End Dates"
            "enrich-off-broadway-dates.yml|110|Enrich Off-Broadway Dates"
            "refresh-show-score-opening-night.yml|50|Refresh Show Score (opening-night)"
            "scrape-westendtheatre.yml|192|Scrape WestEndTheatre"
            # User-facing data refresh workflows. Stale data hits /lotteries,
            # /rush, /standing-room, /discount-tickets, /box-office — pages
            # Reddit users screenshot. Added 2026-04-14 after
            # update-lottery-rush silently failed 5 days in a row.
            "update-lottery-rush.yml|192|Update Lottery/Rush"
            "weekly-grosses.yml|192|Weekly Grosses"
            "weekly-video-reviews.yml|192|Weekly Video Reviews"
            "weekly-nyt-critics-picks.yml|72|NYT Critics Picks"
            "outlet-listing-poller.yml|25|Outlet Listing Poller"
            "update-cast-changes.yml|120|Update Cast Changes"
            "update-social-pulse.yml|192|Update Social Pulse"
            "update-show-score.yml|192|Update Show Score"
            "update-mezzanine.yml|192|Update Mezzanine"
            # Weekly Sunday cron — director-attribution audit. 200h gap = 1 missed week = alert
            "check-show-metadata-consensus.yml|200|Check Show Metadata Consensus"
            # Daily April-June cron — Tony Awards data refresh during ceremony
            # season. 36h gap during Apr-Jun = 1 missed day + grace, alert needed.
            # User-facing data feeds /awards-scorecard.
            "update-tony-awards.yml|36|Update Tony Awards"
            # Drift detector runs every 30 min; 2h gap = 4 missed runs = alert needed
            "check-opening-night-drift.yml|2|Check Opening Night Drift"
            # Opening night checklist fires hourly; 3h = 2 missed runs = needs paging
            "opening-night-checklist.yml|3|Opening Night Checklist"
            # Hourly trade-press RSS recoupment poll; 3h = 2 missed runs = alert.
            # Powers ≤1h detection latency for Variety/Deadline recoupment news.
            "commercial-rss-poll.yml|3|Commercial RSS Poll"
            # Weekly Monday cron — Tony + Olivier cutoff freshness check. 200h = 1 missed week.
            # Advisory v1 (warnings only), but staleness still pages so we re-verify dates before
            # season cutoffs bias the show-page rank pool.
            "check-cutoff-freshness.yml|200|Check Cutoff Freshness"
          )

          FAILURES=""
          WARNINGS=""
          NOW=$(date +%s)

          # Fetch state for every workflow in the repo (two pages cover ~200 workflows).
          # A workflow in `disabled_manually` keeps emitting cancelled scheduled runs that
          # *look* recent to a plain `gh run list` — the May 2026 orchestrator outage went
          # undetected for ~2.5 days because of this. Querying state directly catches it
          # within one check-cron-health cycle.
          WF_STATES=$(
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows?per_page=100&page=1" \
              --jq '.workflows[] | "\(.path | split("/") | last)|\(.state)"' 2>/dev/null;
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows?per_page=100&page=2" \
              --jq '.workflows[] | "\(.path | split("/") | last)|\(.state)"' 2>/dev/null
          )

          for entry in "${CRITICAL_CRONS[@]}"; do
            IFS='|' read -r workflow max_hours name <<< "$entry"

            # 1. State check — fast, catches disabled_manually immediately.
            STATE=$(echo "$WF_STATES" | grep -F "${workflow}|" | head -1 | cut -d'|' -f2)
            if [ -n "$STATE" ] && [ "$STATE" != "active" ]; then
              FAILURES="${FAILURES}❌ ${name}: workflow state is '${STATE}' (expected 'active'). Re-enable in the Actions tab or via: gh api -X PUT repos/$GITHUB_REPOSITORY/actions/workflows/${workflow}/enable\n"
              continue
            fi

            # 2. Recency check — require a recent *successful* run, not just any run.
            # Plain `gh run list --limit=1` returns cancelled runs as "recent," which is
            # how a disabled workflow's still-firing schedule events hide a real outage.
            LAST_RUN=$(gh run list --workflow="$workflow" --status=success --limit=1 --json createdAt,conclusion -q '.[0]' 2>/dev/null || echo '{}')
            LAST_DATE=$(echo "$LAST_RUN" | jq -r '.createdAt // empty' 2>/dev/null)

            if [ -z "$LAST_DATE" ]; then
              FAILURES="${FAILURES}❌ ${name}: No successful runs found at all!\n"
              continue
            fi

            # Latest run of ANY status. The LAST_RUN query above forces
            # --status=success, so its conclusion is ALWAYS "success" — keying the
            # "ran recently but the latest run failed" warning off it made that
            # branch unreachable for EVERY cron. That dead branch is how main
            # test.yml stayed red across 2026-06-13→06-15 with no warning: a recent
            # green push kept it un-stale, but the latest run being red never
            # surfaced. Fetch the most-recent run separately so the warning keys off
            # its real conclusion.
            LATEST_ANY=$(gh run list --workflow="$workflow" --limit=1 --json conclusion -q '.[0].conclusion // "missing"' 2>/dev/null || echo "missing")

            # Calculate hours since last successful run
            LAST_TS=$(date -d "$LAST_DATE" +%s 2>/dev/null || date -j -f "%Y-%m-%dT%H:%M:%SZ" "$LAST_DATE" +%s 2>/dev/null || echo "0")
            HOURS_AGO=$(( (NOW - LAST_TS) / 3600 ))

            if [ "$HOURS_AGO" -gt "$max_hours" ]; then
              # Surface the latest run's conclusion so the alert tells us whether
              # recent runs are failing vs cancelled vs simply absent.
              FAILURES="${FAILURES}❌ ${name}: Last SUCCESS ${HOURS_AGO}h ago (max ${max_hours}h). Latest run conclusion: ${LATEST_ANY}\n"
            elif [ "$LATEST_ANY" = "failure" ]; then
              WARNINGS="${WARNINGS}⚠️ ${name}: Latest run failed (last success ${HOURS_AGO}h ago)\n"
            fi
          done

          # State-diff: only escalate to email+critical for NEWLY-stale workflows.
          # Chronic stale entries (already stale yesterday) keep firing in the digest
          # but don't re-page the user. Prevents alert fatigue that masked WET going
          # silent for 47 days in April–May 2026.
          STATE_FILE="data/audit/cron-health-state.json"
          # Extract just the friendly names from the FAILURES list (one per line).
          CURRENT_STALE=$(printf '%s' "$FAILURES" | grep -oE '❌ [^:]+:' | sed 's/^❌ //;s/:$//' | sort -u)
          PREV_STALE=""
          if [ -f "$STATE_FILE" ]; then
            PREV_STALE=$(jq -r '.stale[]?' "$STATE_FILE" 2>/dev/null | sort -u)
          fi
          NEWLY_STALE=$(comm -23 <(printf '%s\n' "$CURRENT_STALE") <(printf '%s\n' "$PREV_STALE") | sed '/^$/d')
          RECOVERED=$(comm -13 <(printf '%s\n' "$CURRENT_STALE") <(printf '%s\n' "$PREV_STALE") | sed '/^$/d')
          NEWLY_COUNT=$(printf '%s' "$NEWLY_STALE" | grep -c . || true)
          CHRONIC_COUNT=$(printf '%s' "$CURRENT_STALE" | grep -c . || true)
          CHRONIC_COUNT=$(( CHRONIC_COUNT - NEWLY_COUNT ))

          # Persist current state for next run's diff.
          mkdir -p "$(dirname "$STATE_FILE")"
          NOW_ISO=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          if [ -n "$CURRENT_STALE" ]; then
            printf '%s\n' "$CURRENT_STALE" | jq -R . | jq -s --arg ts "$NOW_ISO" '{stale: ., updatedAt: $ts}' > "$STATE_FILE"
          else
            printf '{"stale":[],"updatedAt":"%s"}\n' "$NOW_ISO" > "$STATE_FILE"
          fi

          # Emit step outputs the notify-failure step reads to toggle severity/email.
          echo "newly_stale_count=${NEWLY_COUNT}" >> "$GITHUB_OUTPUT"
          echo "chronic_stale_count=${CHRONIC_COUNT}" >> "$GITHUB_OUTPUT"
          if [ "$NEWLY_COUNT" -gt 0 ]; then
            {
              echo "newly_stale<<EOF"
              printf '%s\n' "$NEWLY_STALE"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$RECOVERED" ]; then
            echo "✅ Recovered crons (no longer stale):"
            printf '%s\n' "$RECOVERED" | sed 's/^/  /'
          fi
          if [ "$NEWLY_COUNT" -gt 0 ]; then
            echo "🚨 NEWLY STALE (paging — newly-stale email + critical severity):"
            printf '%s\n' "$NEWLY_STALE" | sed 's/^/  /'
          fi
          if [ "$CHRONIC_COUNT" -gt 0 ]; then
            echo "⏳ Chronic stale ($CHRONIC_COUNT entries — Discord only, expected to keep firing until fixed):"
            comm -12 <(printf '%s\n' "$CURRENT_STALE") <(printf '%s\n' "$PREV_STALE") | sed 's/^/  /'
          fi

          if [ -n "$FAILURES" ]; then
            echo "::error::Critical cron workflows have stopped running!"
            echo ""
            echo "=== STALE CRONS ==="
            echo -e "$FAILURES"
            if [ -n "$WARNINGS" ]; then
              echo "=== WARNINGS ==="
              echo -e "$WARNINGS"
            fi
            echo ""
            echo "Fix: Go to Actions tab, find the stale workflow, click 'Enable workflow' or trigger manually."
            echo "Common causes: GitHub disables crons after 60 days inactivity, after persistent failures, or after workflow file changes."
            exit 1
          elif [ -n "$WARNINGS" ]; then
            echo "All crons running on schedule, but some have recent failures:"
            echo -e "$WARNINGS"
            # Emit the warnings to $GITHUB_OUTPUT so the next step can forward them to Discord.
            # WARNINGS is multi-line, so use the heredoc form.
            {
              echo "warnings<<EOF"
              echo -e "$WARNINGS"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "✅ All critical crons healthy"
          fi

      - name: Check deploy duration regression
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Get last 5 successful deploy runs and their durations.
          # Last-30-deploy avg is ~12min, max ~15min (745MB Vercel upload + 4.5GB
          # core-data cache restore + npm install + next build). Thresholds set
          # above the natural ceiling so the alert fires on a real regression,
          # not on a 5-deploy window that happens to land on the slow tail.
          DEPLOY_WARN_MINS=12
          DEPLOY_FAIL_MINS=15

          RUNS=$(gh run list --workflow=vercel-deploy.yml --status=success --limit=5 \
            --json createdAt,updatedAt,databaseId 2>/dev/null || echo '[]')
          COUNT=$(echo "$RUNS" | jq 'length')

          if [ "$COUNT" -eq 0 ]; then
            echo "No recent successful deploys found — skipping duration check"
            exit 0
          fi

          MAX_MINS=0
          TOTAL_MINS=0
          SLOW_RUNS=""

          for i in $(seq 0 $((COUNT - 1))); do
            CREATED=$(echo "$RUNS" | jq -r ".[$i].createdAt")
            UPDATED=$(echo "$RUNS" | jq -r ".[$i].updatedAt")
            RUN_ID=$(echo "$RUNS" | jq -r ".[$i].databaseId")

            START=$(date -d "$CREATED" +%s 2>/dev/null || date -j -f "%Y-%m-%dT%H:%M:%SZ" "$CREATED" +%s 2>/dev/null || echo "0")
            END=$(date -d "$UPDATED" +%s 2>/dev/null || date -j -f "%Y-%m-%dT%H:%M:%SZ" "$UPDATED" +%s 2>/dev/null || echo "0")
            DURATION_MINS=$(( (END - START) / 60 ))

            TOTAL_MINS=$((TOTAL_MINS + DURATION_MINS))
            if [ "$DURATION_MINS" -gt "$MAX_MINS" ]; then MAX_MINS=$DURATION_MINS; fi
            if [ "$DURATION_MINS" -gt "$DEPLOY_WARN_MINS" ]; then
              SLOW_RUNS="${SLOW_RUNS}  Run ${RUN_ID}: ${DURATION_MINS}min\n"
            fi
          done

          AVG_MINS=$((TOTAL_MINS / COUNT))
          echo "Deploy durations (last ${COUNT}): avg=${AVG_MINS}min, max=${MAX_MINS}min (warn>${DEPLOY_WARN_MINS}min, fail>${DEPLOY_FAIL_MINS}min)"

          if [ "$AVG_MINS" -gt "$DEPLOY_FAIL_MINS" ]; then
            echo "::error::Deploy duration regression! Average ${AVG_MINS}min exceeds ${DEPLOY_FAIL_MINS}min threshold."
            echo -e "Slow runs:\n${SLOW_RUNS}"
            echo "Investigate: something was added to the deploy pipeline that shouldn't be there."
            exit 1
          elif [ "$AVG_MINS" -gt "$DEPLOY_WARN_MINS" ]; then
            echo "::warning::Deploy durations trending high — average ${AVG_MINS}min (warn threshold: ${DEPLOY_WARN_MINS}min)"
            echo -e "Slow runs:\n${SLOW_RUNS}"
          else
            echo "✅ Deploy durations healthy"
          fi

      # Real-time Discord warning for the non-stale "last run failed" case.
      # Previously these only printed to the workflow log (nobody reads that).
      # Matches notify-failure's 2h cooldown pattern: if check-cron-health itself
      # already ran successfully within the last 2h (e.g., manual re-dispatch on
      # top of the noon UTC cron), suppress the second alert.
      - name: Cooldown check for warning alert
        id: warn_cooldown
        if: success() && steps.check.outputs.warnings != ''
        uses: actions/github-script@v7
        with:
          script: |
            const cooldownMinutes = 120;
            const cutoff = new Date(Date.now() - cooldownMinutes * 60 * 1000);
            try {
              const runs = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'check-cron-health.yml',
                status: 'success',
                per_page: 10,
                created: `>=${cutoff.toISOString().split('T')[0]}`,
              }).catch(() => ({ data: { workflow_runs: [] } }));
              const recentSuccess = (runs.data.workflow_runs || []).filter(r => {
                const created = new Date(r.created_at);
                return created >= cutoff && r.id !== context.runId;
              });
              if (recentSuccess.length > 0) {
                console.log(`[Cooldown] ${recentSuccess.length} prior success(es) in last ${cooldownMinutes}min — suppressing duplicate warning alert.`);
                core.setOutput('suppressed', 'true');
              } else {
                core.setOutput('suppressed', 'false');
              }
            } catch (e) {
              console.log(`[Cooldown] Check failed (${e.message}), sending alert anyway`);
              core.setOutput('suppressed', 'false');
            }

      - name: Send warning Discord alert
        if: success() && steps.check.outputs.warnings != '' && steps.warn_cooldown.outputs.suppressed != 'true'
        env:
          DISCORD_WEBHOOK_ALERTS: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
          WARNINGS: ${{ steps.check.outputs.warnings }}
        uses: actions/github-script@v7
        with:
          script: |
            const { sendAlert } = require('./scripts/lib/discord-notify.js');
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const warnings = (process.env.WARNINGS || '').trim();
            if (!warnings) {
              console.log('[WarnAlert] No warnings payload — skipping.');
              return;
            }
            await sendAlert({
              title: 'Cron Health Warnings (recent failures)',
              description: 'All crons are running on schedule, but some have recent failures. Investigate before they go stale.',
              severity: 'warning',
              fields: [
                { name: 'Affected Workflows', value: warnings.slice(0, 1024), inline: false },
                { name: 'Run', value: `[View logs](${runUrl})`, inline: false },
              ],
              url: runUrl,
            }).catch(e => console.error('Warning alert failed:', e.message));

      # State-diff dispatch: newly-stale crons page (critical+email); chronic stale
      # falls through to digest (warning, Discord-only — and the notify-failure
      # action is a no-op for warning per workflows/CLAUDE.md, intentionally).
      - name: Notify — newly-stale critical crons (paging)
        if: failure() && steps.check.outputs.newly_stale_count != '0' && steps.check.outputs.newly_stale_count != ''
        uses: ./.github/actions/notify-failure
        with:
          title: ${{ format('🚨 {0} NEWLY-stale critical cron(s) — see run log', steps.check.outputs.newly_stale_count) }}
          severity: 'critical'
          email: 'true'
          discord_webhook: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
          resend_api_key: ${{ secrets.RESEND_API_KEY }}
          owner_email: ${{ secrets.OWNER_EMAIL }}

      - name: Notify — chronic stale (digest only)
        if: failure() && (steps.check.outputs.newly_stale_count == '0' || steps.check.outputs.newly_stale_count == '')
        uses: ./.github/actions/notify-failure
        with:
          title: 'Cron Health Check Failed (chronic stale crons or deploy regression)'
          severity: 'warning'
          discord_webhook: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}

      # Persist state file so the next run's diff can identify newly-stale entries.
      # Always runs (even on `exit 1` above) so the state stays current even when
      # the check reports failures.
      - name: Persist cron-health state
        if: always()
        run: |
          if [ ! -f data/audit/cron-health-state.json ]; then
            echo "No state file written — skipping commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/audit/cron-health-state.json
          if git diff --staged --quiet; then
            echo "No state change to commit."
            exit 0
          fi
          git commit -m "audit: Update cron-health state [skip ci]"
          bash scripts/lib/push-with-retry.sh 5 main
