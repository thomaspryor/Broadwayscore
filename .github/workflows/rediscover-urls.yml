name: Rediscover Review URLs

on:
  workflow_dispatch:
    inputs:
      phase:
        description: 'Phase to run (1=protocol, 2=redirects, 3=SERP, empty=all)'
        required: false
        default: ''
      limit:
        description: 'Max reviews per phase'
        required: false
        default: ''
      dry_run:
        description: 'Dry run (no writes)'
        required: false
        type: boolean
        default: false
      show_filter:
        description: 'Show slug to filter (optional)'
        required: false
        default: ''
      reason_filter:
        description: 'Filter by incompleteReason: url_dead, no_url, wrong_content (comma-separated)'
        required: false
        default: ''
      create_stubs:
        description: 'Create stub review-text files from reviews.json before discovery (for outlets with no files)'
        required: false
        type: boolean
        default: false
      outlet_filter:
        description: 'Outlet filter for stub creation (comma-separated outletIds)'
        required: false
        default: ''
  schedule:
    - cron: '0 1 * * 0'  # Weekly Sunday 1 AM UTC

concurrency:
  group: rediscover-urls
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  rediscover:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: write
      actions: write

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # BRO-2388 (task #466 class): depth 1000 keeps push-with-retry.sh's shallow boundary an ancestor
          # of main for this 240-min job's final ledger commit; depth-1 aborted when churn outran it.
          fetch-depth: 1000



      - name: Checkout core data
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
      - name: Checkout review-texts (private repo)
        uses: ./.github/actions/checkout-review-texts
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install axios

      - name: Build CLI args
        id: args
        env:
          INPUT_PHASE: ${{ inputs.phase }}
          INPUT_LIMIT: ${{ inputs.limit }}
          INPUT_SHOW_FILTER: ${{ inputs.show_filter }}
          INPUT_REASON_FILTER: ${{ inputs.reason_filter }}
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ -n "${INPUT_PHASE}" ]; then
            ARGS="$ARGS --phase=${INPUT_PHASE}"
          fi
          if [ -n "${INPUT_LIMIT}" ]; then
            ARGS="$ARGS --limit=${INPUT_LIMIT}"
          fi
          if [ -n "${INPUT_SHOW_FILTER}" ]; then
            ARGS="$ARGS --show=${INPUT_SHOW_FILTER}"
          fi
          if [ -n "${INPUT_REASON_FILTER}" ]; then
            ARGS="$ARGS --reason=${INPUT_REASON_FILTER}"
          fi
          echo "args=$ARGS" >> $GITHUB_OUTPUT

      - name: Create stub review-text files
        if: inputs.create_stubs == true
        env:
          OUTLET_FILTER: ${{ inputs.outlet_filter }}
        run: |
          echo "Creating stub review-text files from reviews.json..."
          node scripts/create-stubs-from-reviews-json.js

      - name: Run URL protocol/redirect fixes (scheduled only)
        if: github.event_name == 'schedule'
        env:
          CI: true
          SCRAPINGBEE_API_KEY: ${{ secrets.SCRAPINGBEE_API_KEY }}
          BRIGHTDATA_TOKEN: ${{ secrets.BRIGHTDATA_TOKEN }}
          REVIEW_TEXTS_TOKEN: ${{ secrets.REVIEW_TEXTS_TOKEN }}
        run: |
          echo "=== Scheduled: Running Phases 1-2 (protocol upgrades + redirect detection) ==="
          echo "--- Phase 1: Protocol upgrades (limit 200) ---"
          node scripts/rediscover-review-urls.js --phase=1 --limit=200 || true

          echo ""
          echo "--- Phase 2: Redirect detection (limit 200) ---"
          node scripts/rediscover-review-urls.js --phase=2 --limit=200 || true
          # Phase 3 (SERP discovery) disabled Feb 25, 2026: 0/1965 SERP reviews
          # ever reached production. 80%+ waste rate, attribution bugs, West End
          # contamination. Still available via manual dispatch: --phase=3

      - name: Run URL rediscovery (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        env:
          SCRAPINGBEE_API_KEY: ${{ secrets.SCRAPINGBEE_API_KEY }}
          SCRAPINGDOG_API_KEY: ${{ secrets.SCRAPINGDOG_API_KEY }}
          SCRAPER_USE_SCRAPINGDOG: '1'
          BRIGHTDATA_TOKEN: ${{ secrets.BRIGHTDATA_TOKEN }}
          BRIGHTDATA_ZONE: ${{ secrets.BRIGHTDATA_ZONE }}
          REVIEW_TEXTS_TOKEN: ${{ secrets.REVIEW_TEXTS_TOKEN }}
          CI: true
        run: node scripts/rediscover-review-urls.js ${{ steps.args.outputs.args }}


      - name: Push review-texts to private repo
        if: always()
        uses: ./.github/actions/push-review-texts
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
          message: "data: Rediscover Review URLs — Final commit and push"
      - name: Trigger collection for newly-discovered URLs
        # !cancelled(), not always(): a cancelled or timed-out run must not
        # start the paid collection chain (BRO-5261 retro-review cousin of the
        # rebuild-reviews scoring dispatch).
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Triggering collection run for newly URL'd reviews..."
          gh workflow run collect-review-texts.yml \
            -f max_reviews=200 \
            -f batch_size=10 \
            -f chain=true \
            -f remaining_batches=3 || true

      - name: Commit scraper-spend ledger
        if: always()
        continue-on-error: true
        uses: ./.github/actions/commit-scraper-spend-ledger
        with:
          workflow-name: rediscover-urls

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: 'Rediscover Review URLs Failed'
          discord_webhook: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
