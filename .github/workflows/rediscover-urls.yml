name: Rediscover Review URLs

on:
  workflow_dispatch:
    inputs:
      phase:
        description: 'Phase to run (1=protocol, 2=redirects, 3=SERP, empty=all)'
        required: false
        default: ''
      limit:
        description: 'Max reviews per phase'
        required: false
        default: ''
      dry_run:
        description: 'Dry run (no writes)'
        required: false
        type: boolean
        default: false
      show_filter:
        description: 'Show slug to filter (optional)'
        required: false
        default: ''
      reason_filter:
        description: 'Filter by incompleteReason: url_dead, no_url, wrong_content (comma-separated)'
        required: false
        default: ''
      create_stubs:
        description: 'Create stub review-text files from reviews.json before discovery (for outlets with no files)'
        required: false
        type: boolean
        default: false
      outlet_filter:
        description: 'Outlet filter for stub creation (comma-separated outletIds)'
        required: false
        default: ''
  schedule:
    - cron: '0 1 * * 0'  # Weekly Sunday 1 AM UTC

jobs:
  rediscover:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}



      - name: Checkout core data
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
      - name: Checkout review-texts (private repo)
        uses: ./.github/actions/checkout-review-texts
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install axios

      - name: Build CLI args
        id: args
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ -n "${{ inputs.phase }}" ]; then
            ARGS="$ARGS --phase=${{ inputs.phase }}"
          fi
          if [ -n "${{ inputs.limit }}" ]; then
            ARGS="$ARGS --limit=${{ inputs.limit }}"
          fi
          if [ -n "${{ inputs.show_filter }}" ]; then
            ARGS="$ARGS --show=${{ inputs.show_filter }}"
          fi
          if [ -n "${{ inputs.reason_filter }}" ]; then
            ARGS="$ARGS --reason=${{ inputs.reason_filter }}"
          fi
          echo "args=$ARGS" >> $GITHUB_OUTPUT

      - name: Create stub review-text files
        if: inputs.create_stubs == true
        env:
          OUTLET_FILTER: ${{ inputs.outlet_filter }}
        run: |
          echo "Creating stub review-text files from reviews.json..."
          node scripts/create-stubs-from-reviews-json.js

      - name: Run reason-aware URL discovery (scheduled only)
        if: github.event_name == 'schedule'
        env:
          SCRAPINGBEE_API_KEY: ${{ secrets.SCRAPINGBEE_API_KEY }}
          BRIGHTDATA_TOKEN: ${{ secrets.BRIGHTDATA_TOKEN }}
          BRIGHTDATA_ZONE: ${{ secrets.BRIGHTDATA_ZONE }}
          REVIEW_TEXTS_TOKEN: ${{ secrets.REVIEW_TEXTS_TOKEN }}
          CI: true
        run: |
          echo "=== Scheduled: Running URL discovery for all reason categories ==="
          # url_dead: reviews whose URLs no longer work
          echo "--- Phase: url_dead (limit 100) ---"
          node scripts/rediscover-review-urls.js --reason=url_dead --phase=3 --limit=100 || true

          echo ""
          echo "--- Phase: no_url (limit 50) ---"
          node scripts/rediscover-review-urls.js --reason=no_url --phase=3 --limit=50 || true

          echo ""
          echo "--- Phase: wrong_content (limit 100) ---"
          node scripts/rediscover-review-urls.js --reason=wrong_content --phase=3 --limit=100 || true

          echo ""
          echo "--- Phase: default (no reason filter, all phases) ---"
          node scripts/rediscover-review-urls.js --limit=50 || true

      - name: Run URL rediscovery (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        env:
          SCRAPINGBEE_API_KEY: ${{ secrets.SCRAPINGBEE_API_KEY }}
          BRIGHTDATA_TOKEN: ${{ secrets.BRIGHTDATA_TOKEN }}
          BRIGHTDATA_ZONE: ${{ secrets.BRIGHTDATA_ZONE }}
          REVIEW_TEXTS_TOKEN: ${{ secrets.REVIEW_TEXTS_TOKEN }}
          CI: true
        run: node scripts/rediscover-review-urls.js ${{ steps.args.outputs.args }}


      - name: Push review-texts to private repo
        if: always()
        uses: ./.github/actions/push-review-texts
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
          message: "data: Rediscover Review URLs — Final commit and push"
      - name: Final commit and push
        if: always() && inputs.dry_run != 'true'
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          # review-texts now pushed via push-review-texts composite action
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: URL rediscovery complete"
          pushed=false
          for i in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main || {
              git checkout --ours data/
              git add data/
              git rebase --continue || {
                git rebase --abort
                git merge origin/main -X ours --no-edit
              }
            }
            git push origin HEAD:main && pushed=true && break
            echo "Push attempt $i failed, retrying..."
            sleep $((i * 3))
          done
          if [ "$pushed" != "true" ]; then
            echo "::warning::All push attempts failed"
          fi

      - name: Trigger collection for newly-discovered URLs
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Triggering collection run for newly URL'd reviews..."
          gh workflow run "Collect Review Texts" \
            -f max_reviews=200 \
            -f batch_size=10 \
            -f chain=true \
            -f remaining_batches=3 || true
