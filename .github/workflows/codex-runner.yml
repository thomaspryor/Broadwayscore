name: Codex card runner

# BRO-4745: the unattended Codex card worker (scripts/codex/daily-runner.js).
# Codex (owner's ChatGPT plan, login kept encrypted on a Linear card) fixes
# Todo cards; an independent Claude check (API key, capped per review and per
# run) must pass before the runner lands the fix via land/codex-bro-N.
# 5 runs x --limit 6 = up to 30 cards a day (BRO-5673: was 4; 57% landed after the
# 2026-10-18 fixes and most runs stopped on the time guard, not the card limit).
# --hard-stop-minutes 290 ends a run gracefully (cards hand back) inside the
# 355-min job timeout (the 21:13->01:13 gap is 4h, so a long run there queues the
# next firing via concurrency, it never overlaps); without it a card started near
# --max-minutes could run 120 more minutes. The runner's own branch lock
# (refs/heads/codex-runner-lock) keeps a hand-started cloud run from overlapping.
# BRO-5730: lane=gha runs 2 slots on slots 3-4 (--lane gha), alongside the cloud
# routine's slots 0-2 instead of waiting on its slot-0 lock. It falls back to slot 0
# when the Codex login could refresh during the run. gha is the default since hand
# dispatch 39355470569 (2026-10-20) ran 2 slots beside the cloud lane with no card
# claimed twice; legacy keeps the one slot-0 runner.
#
# Credential layout: checkout does NOT persist a token (Codex and the unit tests
# it writes run in this workspace). The runner pushes through a credential
# helper that reads CODEX_RUNNER_PUSH_TOKEN; scrubEnv drops every *TOKEN* var
# from the Codex, unit-test and reviewer shells, so they cannot push.

on:
  schedule:
    - cron: '13 1,6,11,16,21 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max cards this run'
        default: '6'
      ids:
        description: 'Only these cards (comma-separated BRO ids), optional'
        default: ''
      extra:
        description: 'Extra runner flags, e.g. --dry-run or --no-land'
        default: ''
      lane:
        description: 'legacy (one runner on slot 0) or gha (2 slots on 3-4, alongside the cloud lane)'
        default: 'gha'

concurrency:
  group: codex-runner
  cancel-in-progress: false

permissions:
  contents: read
  # write: the runner dispatches execute-approved-fix.yml / rebuild-fast.yml for a landed data-fix plan (BRO-6175)
  actions: write

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Checkout core data
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}

      # The runner links data/review-texts into each card's worktree, so Codex and the
      # reviewer can check review-text cards against real data.
      - name: Checkout review texts
        uses: ./.github/actions/checkout-review-texts
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}

      # Both clones keep REVIEW_TEXTS_TOKEN (the runner's push credential) in their remote
      # URL, and Codex can read any file. Strip it; the runner refuses to link a clone that
      # still carries one (scripts/lib/codex-runner.js hasCredentialRemote).
      - name: Remove the token from the data clones
        run: |
          git -C data/review-texts remote set-url origin https://github.com/thomaspryor/broadway-review-texts.git
          rm -rf /tmp/core-data-checkout
          if grep -rqs 'x-access-token' data/review-texts/.git/config; then echo "::error::token still in data/review-texts"; exit 1; fi

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          # claude-code 2.1.292 requires node >= 22
          node-version: '22'
          cache: 'npm'

      - name: Install
        run: |
          npm ci --no-audit --no-fund
          npm i -g --no-audit --no-fund @openai/codex@0.160.0 @anthropic-ai/claude-code@2.1.292
          # Ubuntu 24.04 blocks unprivileged user namespaces; Codex's Linux sandbox needs them.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Git identity and push credential
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config --global credential.https://github.com.helper \
            '!f() { test "$1" = get || exit 0; test -n "$CODEX_RUNNER_PUSH_TOKEN" || exit 0; echo username=x-access-token; echo "password=$CODEX_RUNNER_PUSH_TOKEN"; }; f'

      - name: Run Codex card runner
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Opens the stored Codex login: the cloud env's OpenAI key, which differs from
          # the OPENAI_API_KEY secret above (scripts/codex/auth-store.js keyMaterial).
          CODEX_AUTH_KEY: ${{ secrets.CODEX_AUTH_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CODEX_RUNNER_PUSH_TOKEN: ${{ secrets.REVIEW_TEXTS_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          LIMIT: ${{ inputs.limit || '6' }}
          IDS: ${{ inputs.ids }}
          EXTRA: ${{ inputs.extra }}
          LANE: ${{ inputs.lane || 'gha' }}
          # BRO-6236: pinned model (strongest first; the runner moves down the list if the ChatGPT
          # login refuses one) and the high vs xhigh effort A/B, arm chosen per card id so both arms
          # draw from the same cards. A/B ends 2026-10-29 (RECHECK-AFTER on BRO-6236); compare with
          # `node scripts/codex-ab-report.js`. Unset both to go back to the CLI default at high.
          CODEX_MODEL: gpt-6-astra,gpt-6.1-sol,gpt-6-sol,gpt-5.6-sol
          CODEX_EFFORT_AB: high,xhigh
          # BRO-6303: the trust ladder's rollback reaches the runner too (baseline access), not only the evaluator.
          # The cloud lane has no repo vars: the owner file's killSwitch (read from origin/main) covers every lane.
          CODEX_TRUST_LADDER_DISABLED: ${{ vars.CODEX_LADDER_DISABLED }}
        run: |
          # Until the owner adds the CODEX_AUTH_KEY secret the login cannot be opened here;
          # skip instead of failing five times a day. Adding the secret starts the runner.
          if [ -z "$CODEX_AUTH_KEY" ]; then
            echo "::warning::CODEX_AUTH_KEY secret is not set, so the Codex runner is skipping (see BRO-4745)"
            exit 0
          fi
          if [ "$LANE" = gha ]; then
            args=(--lane gha --slots 2 --limit "$LIMIT" --max-minutes 240 --hard-stop-minutes 290)
          else
            args=(--limit "$LIMIT" --max-minutes 210 --hard-stop-minutes 290)
          fi
          if [ -n "$IDS" ]; then args+=(--ids "$IDS"); fi
          # shellcheck disable=SC2206 -- word-split the free-form flags on purpose
          if [ -n "$EXTRA" ]; then args+=($EXTRA); fi
          node scripts/codex/daily-runner.js "${args[@]}"

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: 'Codex card runner failed'
          description: 'The runner job itself failed (setup, login or a crash). Cards it held are named on the codex-runner-lock branch and the next run adopts them.'
          severity: 'warning'
