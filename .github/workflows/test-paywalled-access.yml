name: Test Paywalled Site Access

on:
  workflow_dispatch:
    inputs:
      site:
        description: 'Site to test (nyt, vulture, wapo, wsj, or blank for all)'
        required: false
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  test-access:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5


      - name: Checkout core data
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Setup Playwright
        uses: ./.github/actions/setup-playwright

      - name: Run paywalled access test
        env:
          NYT_EMAIL: ${{ secrets.NYT_EMAIL }}
          NYTIMES_PASSWORD: ${{ secrets.NYTIMES_PASSWORD }}
          VULTURE_EMAIL: ${{ secrets.VULTURE_EMAIL }}
          VULTURE_PASSWORD: ${{ secrets.VULTURE_PASSWORD }}
          WAPO_EMAIL: ${{ secrets.WAPO_EMAIL }}
          WASHPOST_PASSWORD: ${{ secrets.WASHPOST_PASSWORD }}
          WSJ_EMAIL: ${{ secrets.WSJ_EMAIL }}
          WSJ_PASSWORD: ${{ secrets.WSJ_PASSWORD }}
          INPUT_SITE: ${{ github.event.inputs.site }}
        run: |
          if [ -n "${INPUT_SITE}" ]; then
            node scripts/test-paywalled-access.js --site=${INPUT_SITE}
          else
            node scripts/test-paywalled-access.js
          fi

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: error-screenshots
          path: /tmp/*-error-*.png
          retention-days: 7
      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: 'Test Paywalled Access Failed'
          discord_webhook: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
