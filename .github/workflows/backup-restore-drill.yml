name: Backup Restore Drill

# BRO-5963: monthly proof that the backups can actually be restored. Downloads the
# newest complete weekly git-bundle set (r2-cold-backup.yml) and the newest complete
# daily Supabase export (supabase-backup.yml), checks every sha256, decrypts, clones
# each bundle (bare, one at a time, runner disk is ~14GB) and checks main resolves and
# the object graph is connected, then recounts the Supabase export against its manifest.
# Logs print file names, ref names and row counts only, never row contents or secrets.
# Read-only against R2. The alarm is staleness in check-cron-health.yml (warning
# severity sends nothing by itself).

on:
  schedule:
    - cron: '23 9 2 * *'  # 2nd of each month, 09:23 UTC
  workflow_dispatch:

concurrency:
  group: backup-restore-drill
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  drill:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: backup
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      R2_ENDPOINT: https://${{ secrets.BACKUP_R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      R2_BUCKET: broadwayscorecard-cold-backup
      GPG_PASSPHRASE: ${{ secrets.BACKUP_GPG_PASSPHRASE }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          sparse-checkout: |
            scripts/backup-restore-drill.js
            scripts/lib/backup-drill.js
            scripts/lib/cli-help.js
            scripts/lib/discord-notify.js
            .github/actions/notify-failure

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Validate required secrets present
        run: |
          missing=0
          for v in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY GPG_PASSPHRASE; do
            if [ -z "${!v}" ]; then echo "::error::Missing required secret: $v"; missing=1; fi
          done
          if [ -z "${{ secrets.BACKUP_R2_ACCOUNT_ID }}" ]; then echo "::error::Missing required secret: BACKUP_R2_ACCOUNT_ID"; missing=1; fi
          [ "$missing" -eq 0 ]

      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h / | tail -1

      - name: Pick latest complete sets
        run: |
          D="$RUNNER_TEMP/drill"; mkdir -p "$D"
          aws s3 ls "s3://${R2_BUCKET}/weekly/" --recursive --endpoint-url "$R2_ENDPOINT" > "$D/weekly.list"
          aws s3 ls "s3://${R2_BUCKET}/daily/" --recursive --endpoint-url "$R2_ENDPOINT" > "$D/daily.list"
          WEEKLY=$(node scripts/backup-restore-drill.js pick weekly "$D/weekly.list")
          DAILY=$(node scripts/backup-restore-drill.js pick daily "$D/daily.list")
          echo "WEEKLY_PREFIX=$WEEKLY" >> "$GITHUB_ENV"
          echo "DAILY_PREFIX=$DAILY" >> "$GITHUB_ENV"
          echo "weekly set: $WEEKLY"
          echo "daily set:  $DAILY"

      - name: Restore weekly git bundles (download, sha256, decrypt, clone, check main)
        run: |
          W="$RUNNER_TEMP/drill/weekly"; mkdir -p "$W"; cd "$W"
          aws s3 cp "s3://${R2_BUCKET}/${WEEKLY_PREFIX}/MANIFEST.sha256" MANIFEST.sha256 --endpoint-url "$R2_ENDPOINT" --only-show-errors
          for name in broadwayscore-web broadway-review-texts broadway-scorecard-data broadwayscorecard-app; do
            f="${name}.bundle.gpg"
            echo "== $name"
            aws s3 cp "s3://${R2_BUCKET}/${WEEKLY_PREFIX}/${f}" "$f" --endpoint-url "$R2_ENDPOINT" --only-show-errors
            # The manifest lists all four files, so check this one line only.
            grep " ${f}\$" MANIFEST.sha256 > "${f}.sha" || { echo "::error::${f} missing from MANIFEST.sha256"; exit 1; }
            sha256sum -c "${f}.sha"
            gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" \
              --output "${name}.bundle" --decrypt "$f"
            rm -f "$f"
            # git bundle verify needs a repository; the bare clone below checks the pack itself
            git clone --bare --quiet "${name}.bundle" "${name}.git"
            rm -f "${name}.bundle"
            git -C "${name}.git" rev-parse --verify --quiet "refs/heads/main^{commit}" > /dev/null \
              || { echo "::error::${name}: refs/heads/main does not resolve to a commit"; exit 1; }
            echo "main -> $(git -C "${name}.git" rev-parse --short refs/heads/main), $(git -C "${name}.git" for-each-ref | wc -l) refs"
            git -C "${name}.git" fsck --connectivity-only --no-progress > fsck.log 2>&1 \
              || { tail -5 fsck.log; echo "::error::${name}: git fsck found a broken object graph"; exit 1; }
            rm -f fsck.log
            rm -rf "${name}.git"
            df -h / | tail -1
          done

      - name: Restore daily Supabase export (download, sha256, decrypt, recount)
        run: |
          S="$RUNNER_TEMP/drill/supabase"; mkdir -p "$S/data"; cd "$S"
          for f in supabase-data.tar.gz.gpg MANIFEST.sha256 BACKUP_MANIFEST.json; do
            aws s3 cp "s3://${R2_BUCKET}/${DAILY_PREFIX}/${f}" "$f" --endpoint-url "$R2_ENDPOINT" --only-show-errors
          done
          sha256sum -c MANIFEST.sha256
          gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" \
            --output supabase-data.tar.gz --decrypt supabase-data.tar.gz.gpg
          tar -C data -xzf supabase-data.tar.gz
          cd "$GITHUB_WORKSPACE"
          node scripts/backup-restore-drill.js supabase "$S/data" "$S/BACKUP_MANIFEST.json"

      - name: Remove decrypted data
        if: always()
        run: rm -rf "$RUNNER_TEMP/drill"

      - name: Notify on failure
        # BRO-3707: a job-timeout hit reports "cancelled", which a bare failure() skips.
        if: failure() || cancelled()
        uses: ./.github/actions/notify-failure
        with:
          title: 'Backup Restore Drill Failed'
          description: 'A backup set could not be restored end to end. Backups may be unusable; see the run log.'
          severity: 'warning'
          email: 'false'
          resend_api_key: ${{ secrets.RESEND_API_KEY }}
          owner_email: ${{ secrets.OWNER_EMAIL }}
