name: Recover Explicit Ratings

on:
  schedule:
    - cron: '0 20 * * 0'   # Sunday 8 PM UTC (after aggregator scrapers)
  workflow_dispatch:
    inputs:
      phases:
        description: 'Phases to run (comma-separated: 0,1,2,3)'
        required: false
        default: '0,1,2,3'
      limit:
        description: 'Max reviews per phase (0 = all)'
        required: false
        default: '50'
      outlet:
        description: 'Filter to specific outlet'
        required: false
        default: ''
      market:
        description: 'Filter by market (west-end, off-broadway)'
        required: false
        default: ''
      source:
        description: 'Filter by source (theatre-record)'
        required: false
        default: ''
      dry_run:
        description: 'Report only, no file writes'
        required: false
        default: 'false'

permissions:
  contents: write
  actions: write

concurrency:
  group: recover-explicit-ratings
  cancel-in-progress: false

jobs:
  recover:
    name: Recover missing star ratings
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Checkout core data
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}

      - name: Checkout review-texts
        uses: ./.github/actions/checkout-review-texts
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}

      - uses: ./.github/actions/setup-node
        with:
          configure-git: 'true'

      - name: Setup Playwright
        uses: ./.github/actions/setup-playwright

      - name: Run rating recovery
        env:
          GUARDIAN_API_KEY: ${{ secrets.GUARDIAN_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BRIGHTDATA_TOKEN: ${{ secrets.BRIGHTDATA_TOKEN }}
          BRIGHTDATA_ZONE: mcp_unlocker
          SCRAPINGBEE_API_KEY: ${{ secrets.SCRAPINGBEE_API_KEY }}
          COOKIES_BUNDLE_1: ${{ secrets.COOKIES_BUNDLE_1 }}
          COOKIES_BUNDLE_2: ${{ secrets.COOKIES_BUNDLE_2 }}
          COOKIES_BUNDLE_3: ${{ secrets.COOKIES_BUNDLE_3 }}
          COOKIES_BUNDLE_4: ${{ secrets.COOKIES_BUNDLE_4 }}
          COOKIES_BUNDLE_5: ${{ secrets.COOKIES_BUNDLE_5 }}
          COOKIES_BUNDLE_6: ${{ secrets.COOKIES_BUNDLE_6 }}
          COOKIES_BUNDLE_7: ${{ secrets.COOKIES_BUNDLE_7 }}
          COOKIES_BUNDLE_8: ${{ secrets.COOKIES_BUNDLE_8 }}
          COOKIES_BUNDLE_9: ${{ secrets.COOKIES_BUNDLE_9 }}
          COOKIES_BUNDLE_10: ${{ secrets.COOKIES_BUNDLE_10 }}
          COOKIES_BUNDLE_11: ${{ secrets.COOKIES_BUNDLE_11 }}
        run: |
          ARGS=""
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # Weekly cron: all phases, limit 50 (fits in 45-min timeout, ~$0.13/week)
            ARGS="--phase=0,1,2,3 --limit=50"
          else
            PHASES="${{ inputs.phases || '0,1,2,3' }}"
            LIMIT="${{ inputs.limit || '20' }}"
            ARGS="--phase=$PHASES --limit=$LIMIT"
            if [ -n "${{ inputs.outlet }}" ]; then
              ARGS="$ARGS --outlet=${{ inputs.outlet }}"
            fi
            if [ -n "${{ inputs.market }}" ]; then
              ARGS="$ARGS --market=${{ inputs.market }}"
            fi
            if [ -n "${{ inputs.source }}" ]; then
              ARGS="$ARGS --source=${{ inputs.source }}"
            fi
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              ARGS="$ARGS --dry-run"
            fi
          fi
          echo "Running: node scripts/recover-explicit-ratings.js $ARGS"
          node scripts/recover-explicit-ratings.js $ARGS

      - name: Push review-texts to private repo
        if: always() && inputs.dry_run != 'true'
        uses: ./.github/actions/push-review-texts
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
          message: "data: Recover explicit star ratings"

      - name: Commit audit data
        if: always() && inputs.dry_run != 'true'
        id: push
        run: |
          bash scripts/lib/stage-data-changes.sh data/audit/
          if git diff --staged --quiet; then
            echo "No changes to commit"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            RECOVERED=$(node -e "
              try {
                const r = require('./data/audit/recover-ratings-report.json');
                console.log((r.phase1Recovered || 0) + (r.phase2Recovered || 0) + (r.phase3Recovered || 0));
              } catch { console.log(0); }
            ")
            git commit -m "data: Recover $RECOVERED explicit star ratings

          Co-Authored-By: GitHub Action <action@github.com>"
            bash scripts/lib/push-with-retry.sh
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Trigger rebuild
        if: steps.push.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RECOVERED=$(node -e "
            try {
              const r = require('./data/audit/recover-ratings-report.json');
              console.log((r.phase1Recovered || 0) + (r.phase2Recovered || 0) + (r.phase3Recovered || 0));
            } catch { console.log(0); }
          ")
          if [ "$RECOVERED" -gt "0" ]; then
            RUNNING=$(gh run list --workflow=rebuild-reviews.yml --status=in_progress --json databaseId --jq 'length' 2>/dev/null || echo "0")
            if [ "$RUNNING" -gt "0" ]; then
              echo "Rebuild already running — skipping dispatch"
              exit 0
            fi
            echo "Triggering rebuild for $RECOVERED recovered ratings..."
            gh workflow run rebuild-reviews.yml \
              -f reason="Post rating recovery ($RECOVERED ratings)"
          else
            echo "No recoveries, skipping rebuild."
          fi

      - name: Upload recovery report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recover-ratings-report
          path: data/audit/recover-ratings-report.json
          retention-days: 30

      - name: Summary
        if: always()
        run: |
          node -e "
            try {
              const r = require('./data/audit/recover-ratings-report.json');
              const total = (r.phase1Recovered||0) + (r.phase2Recovered||0) + (r.phase3Recovered||0);
              const lines = [
                '## Rating Recovery Summary',
                '',
                '| Phase | Recovered |',
                '|-------|-----------|',
                '| Phase 0 (URL discovery) | ' + (r.phase0UrlsFound || 0) + ' URLs |',
                '| Phase 1 (local text) | ' + (r.phase1Recovered || 0) + ' |',
                '| Phase 2 (free APIs) | ' + (r.phase2Recovered || 0) + ' |',
                '| Phase 3 (URL scraping) | ' + (r.phase3Recovered || 0) + ' |',
                '| **Total** | **' + total + '** |',
                '',
                'Missing: ' + (r.totalMissing || 0) + ' | Errors: ' + (r.errors || 0),
              ];
              console.log(lines.join('\n'));
            } catch(e) {
              console.log('No report generated: ' + e.message);
            }
          " >> $GITHUB_STEP_SUMMARY

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: 'Recover Explicit Ratings Failed'
          severity: 'warning'
          discord_webhook: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
