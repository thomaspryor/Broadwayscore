name: Fetch TodayTix Showtimes

on:
  schedule:
    # Daily at 6 AM UTC (1 AM EST)
    - cron: '0 6 * * *'
    # redispatch-after-hours: 26  (BRO-5152: daily; cron-redispatch.js replaces a dropped tick after 26h, before the 36h page)
  workflow_dispatch:
    inputs:
      redispatched:
        # BRO-5152: set by scripts/cron-redispatch.js when GitHub dropped the scheduled run.
        # Nothing in this workflow branches on the trigger, so it runs exactly like the
        # cron.
        description: 'Internal: re-dispatch of a dropped scheduled run (behaves like the cron)'
        required: false
        default: 'false'
        type: string

# Public TodayTix API — no scraping secrets needed.
# Exempt from BD/SB lint rule (direct REST API, not web scraping).

concurrency:
  group: fetch-todaytix-showtimes
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    # The fetch itself is ~85s; the rest is push-with-retry against the busy
    # public main, which can take several minutes under contention. 15 was too
    # tight — the job kept getting cancelled mid-push (2026-06-25→28). 30 gives
    # headroom on top of the faster push backoff (see scripts/lib/push-with-retry.sh).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout core data
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'

      - name: Fetch TodayTix showtime IDs
        run: node scripts/fetch-todaytix-showtimes.js

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet data/todaytix-showtimes.json data/show-schedules.json; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/todaytix-showtimes.json data/show-schedules.json
          git commit -m "data: Update TodayTix showtimes + schedules [skip ci]"
          bash scripts/lib/push-with-retry.sh

      - name: Dispatch deploy
        if: steps.changes.outputs.has_changes == 'true'
        uses: ./.github/actions/dispatch-deploy

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: 'Fetch TodayTix Showtimes Failed'
          severity: 'warning'
          discord_webhook: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
