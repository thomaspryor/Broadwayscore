name: One-time ibdbUrl Backfill

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Sparse checkout (only data + scripts)
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git .
          git sparse-checkout set data scripts

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run ibdbUrl backfill
        run: node scripts/backfill-ibdb-urls.js

      - name: Commit and push
        if: always()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/shows.json
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "data: Backfill ibdbUrl from cast files into shows.json"
          PUSHED=false
          for i in $(seq 1 10); do
            if git push origin main; then
              echo "Push succeeded on attempt $i"
              PUSHED=true
              break
            fi
            echo "Push failed (attempt $i/10), pulling and rebasing..."
            git pull --rebase origin main
            BACKOFF=$(( (2 ** (i - 1)) * 2 + RANDOM % 5 ))
            if [ "$BACKOFF" -gt 30 ]; then BACKOFF=30; fi
            sleep $BACKOFF
          done
          if [ "$PUSHED" != "true" ]; then
            echo "::error::Failed to push after 10 attempts"
            exit 1
          fi
