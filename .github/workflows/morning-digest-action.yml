name: Morning Digest

# BRO-6764 (Mac-to-cloud Phase 2b): this workflow SENDS the owner's morning digest. Before the cutover
# (BRO-6230, Phase 2a) it only ran as a dry run and compared itself with the Mac's email.
#
# Modes
#   * schedule             always sends (from the handoff date, see below).
#   * workflow_dispatch    dry run by default (builds the digest, compares it with the Mac's, sends nothing);
#                          send=true really sends. Both go through the same Resend sent-today guard.
# One email a day: --resend-sent-guard asks Resend whether today's digest to the owner already exists and
# refuses (exit 3, treated here as "nothing to do") when it does; an unreadable Resend refuses with exit 2
# and the job goes red. Never a broadcast (CLAUDE.md rule 17): the send is one transactional message to
# OWNER_EMAIL through send-morning-digest.js --send-to-owner.
#
# Handoff date (config/morning-digest-handoff.json, committed because cloud sessions cannot set repo
# variables): scheduled runs before it do nothing, and from it the Mac's send-morning-digest.js no-ops
# for the owner's email (it syncs to main before each run), so exactly one machine sends each day.
# Rollback: push handoffDate far out (or revert the file) and land; the Mac sends again from its next run.
# The Mac's launchd job is booted out three days after config/mac-retired.json's retiredAt; that is
# housekeeping, not on the critical path.
#
# Cron times are UTC. 12:45 is 07:45 EST (15 min after the Mac's 07:30 slot, so a stale Mac's email is seen by the sent-today guard) (winter, from 2026-11-01). US DST resumes 2027-03-14: the
# winter times become 08:30 EDT until the block is changed to 11:30/12:15/13:00. GitHub drops and delays
# scheduled runs (cron-redispatch.yml), so there are three; the sent-today guard makes the later two
# no-ops when the first worked. The 14:30Z check-morning-digest-sent.yml pages if none of them delivered.
#
# Public repo, public logs: the digest's own output goes to a file on the runner, the preview HTML (it can
# hold signed dispatch links) is never uploaded, and the only public lines are counts and fixed headings.
# Dry runs: pass pubkey_b64 (a one-time RSA public key, base64 PEM, see scripts/lib/sealed-output.js) to
# get the line-level diff and the run output sealed between the run-script markers.
#
# Flags: --no-autofix (no dispatch fleet on a runner; the Mac runs auto-fix itself, see
# scripts/lib/digest-autofix-schedule.js, so the email's auto-fix rows are report-only), --skip-mac-local
# (Mac-only ledgers and tabs, named in one line in the email), --resend-sent-guard (the send-once guard
# a second machine can see).
on:
  schedule:
    - cron: '45 12 * * *'
    - cron: '15 13 * * *'
    - cron: '0 14 * * *'
  workflow_dispatch:
    inputs:
      send:
        description: "Really send the digest to the owner (default: dry run). Refused if today's digest already went out."
        required: false
        default: false
        type: boolean
      test:
        description: "One labelled TEST email to the owner. Ignores the sent-today guards and leaves tomorrow's real send untouched. Dispatch once."
        required: false
        default: false
        type: boolean
      pubkey_b64:
        description: 'Dry run only: one-time public key (base64 PEM) to seal the full diff + run output to'
        required: false
        default: ''

concurrency:
  # concurrency-queue-ok: every run is idempotent (the Resend sent-today guard), so dropping all but the newest pending run loses nothing and an in-progress send is never cancelled
  group: morning-digest-action
  cancel-in-progress: false

permissions:
  contents: read
  statuses: read
  actions: read  # login-sources reads workflow runs (gh run list)

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      go: ${{ steps.gate.outputs.go }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          sparse-checkout: config/morning-digest-handoff.json
      - id: gate
        run: |
          today=$(date -u +%F)
          handoff=$(jq -r .handoffDate config/morning-digest-handoff.json)
          echo "$handoff" | grep -qE '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' || { echo "bad handoffDate"; exit 1; }
          if [ "${{ github.event_name }}" = "schedule" ] && [[ "$today" < "$handoff" ]]; then
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "Scheduled run on $today is before the handoff date $handoff: not sending (the Mac job still sends)."
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

  digest:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IS_TEST: ${{ inputs.test && 'true' || 'false' }}
      SEND_MODE: ${{ (github.event_name == 'schedule' || inputs.send || inputs.test) && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main

      # No npm ci: the digest's require graph is node built-ins and repo files
      # only (pinned by tests/unit/morning-digest-action.test.mjs).
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Fetch today's Mac-sent digest from Resend
        if: env.SEND_MODE != 'true'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
        run: node scripts/morning-digest-compare.js --fetch-mac --out="$RUNNER_TEMP/mac"

      - name: Pin snapshots to when the Mac sent
        if: env.SEND_MODE != 'true'
        run: |
          # BRO-6029: git_net caps each fetch/pull/push so a hung transfer fails that attempt instead of waiting for the job timeout.
          . "${GITHUB_WORKSPACE}/scripts/lib/git-net-timeout.sh" 2>/dev/null || git_net() { shift; git "$@"; }
          # created_at normalised to ISO in node: Resend's format is not one GNU date parses reliably.
          read -r SENT SINCE < <(node -e "const m=require(process.argv[1]);const t=m.found&&Date.parse(m.created_at);if(t)process.stdout.write(new Date(t).toISOString()+' '+new Date(t-2*3600e3).toISOString())" "$RUNNER_TEMP/mac/mac-meta.json") || true
          if [ -z "$SENT" ]; then echo "No Mac digest today; snapshots stay at main."; exit 0; fi
          git_net 300 fetch --quiet --shallow-since="$SINCE" origin main
          SHA=$(git rev-list -1 --before="$SENT" origin/main)
          if [ -z "$SHA" ]; then echo "No main commit before $SENT in the fetched history; snapshots stay at main."; exit 0; fi
          git checkout "$SHA" -- 'data/audit/*-snapshot.json' data/freshness-report.json
          echo "Snapshots pinned to $SHA (main as of $SENT)."

      - name: Build the digest (dry run, or send), output kept off the public log
        # lint-allow-swallow: not swallowed; '|| status=$?' keeps the exit code and the step ends with exit "$status"
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          APPROVAL_HMAC_SECRET: ${{ secrets.APPROVAL_HMAC_SECRET }}
          GH_TOKEN: ${{ github.token }}
        run: |
          status=0
          GUARD="--resend-sent-guard"
          if [ "$IS_TEST" = "true" ]; then MODE="--send-to-owner --test-send"; GUARD=""
          elif [ "$SEND_MODE" = "true" ]; then MODE="--send-to-owner"; else MODE="--dry-run"; fi
          node scripts/send-morning-digest.js $MODE --no-autofix --skip-mac-local $GUARD \
            > "$RUNNER_TEMP/digest.log" 2>&1 || status=$?
          echo "digest ${MODE#--} exit: $status ($(wc -l < "$RUNNER_TEMP/digest.log") log lines, kept off the public log)"
          grep -E '^\[digest\] (Resend sent-today guard|DRY RUN|sent to|send failed|fatal)' "$RUNNER_TEMP/digest.log" \
            | sed -E 's/^\[digest\] sent to .* id ([^ )]+)\)$/[digest] sent (recipient and subject withheld, id \1)/; s/^\[digest\] (send failed|fatal).*/[digest] \1 (details withheld, they can hold the address)/' || true
          # Exit 3 = Resend already shows today's digest: a later cron after a good first run, or a manual
          # send=true after the Mac sent. Nothing to do, and not a failure (send-morning-digest.js ALREADY_SENT_EXIT).
          if [ "$status" = "3" ]; then echo "Today's digest was already sent; nothing to do."; exit 0; fi
          exit "$status"

      - name: Compare with the Mac digest
        if: always() && env.SEND_MODE != 'true'
        env:
          PUBKEY_B64: ${{ inputs.pubkey_b64 }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          node scripts/morning-digest-compare.js --diff --mac="$RUNNER_TEMP/mac/mac.html" \
            --action=data/audit/morning-digest-preview.html --log="$RUNNER_TEMP/digest.log" \
            ${PUBKEY_B64:+--pubkey-b64="$PUBKEY_B64"}

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: 'Morning Digest Failed'
          # A scheduled run that fails means a late or missing digest. The owner page for that is
          # check-morning-digest-sent.yml (mac:morning-digest-missing at 14:30Z), not this step: this
          # workflow is not on the page-worthy list, so critical files the failure without a second email.
          severity: ${{ github.event_name == 'schedule' && 'critical' || 'warning' }}
