name: Fix TodayTix Links

on:
  schedule:
    # Weekly on Mondays at 10 AM EST (3 PM UTC)
    - cron: '0 15 * * 1'
  workflow_dispatch: {}

concurrency:
  group: fix-todaytix-links
  cancel-in-progress: true

jobs:
  fix-links:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}


      - name: Checkout core data
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check and fix TodayTix links
        id: fix
        run: node scripts/fix-todaytix-links.js

      - name: Commit and push fixes
        if: always() && steps.fix.outputs.changes_made == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Core data files pushed to private repo by push-core-data action
          git commit -m "fix: Auto-fix ${{ steps.fix.outputs.summary }} TodayTix links" || exit 0
          # Retry push with rebase in case remote has new commits
          pushed=false
          for i in 1 2 3 4 5; do
            if git push origin main; then
              echo "Push succeeded on attempt $i"
              break
            fi
            echo "Push failed (attempt $i), pulling and rebasing..."
            echo "--- Unstaged files before cleanup ---"
            git status --porcelain 2>/dev/null || true
            git checkout -- . 2>/dev/null || true
            git clean -fd 2>/dev/null || true
            if git pull --rebase -X theirs origin main; then
              echo "Rebase succeeded, retrying push..."
            else
              echo "Rebase failed, aborting..."
              git rebase --abort 2>/dev/null || true
            fi
            sleep $((10 + RANDOM % 20))
          done
          if [ "$pushed" != "true" ]; then
            echo "::warning::All push attempts failed"
          fi


      - name: Push core data to private repo
        if: always()
        uses: ./.github/actions/push-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
          message: 'data: Update from fix-todaytix-links'