name: Fix TodayTix Links

on:
  schedule:
    # Weekly on Mondays at 10 AM EST (3 PM UTC)
    - cron: '0 15 * * 1'
  workflow_dispatch: {}

concurrency:
  group: fix-todaytix-links
  cancel-in-progress: true

jobs:
  fix-links:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check and fix TodayTix links
        id: fix
        run: node scripts/fix-todaytix-links.js

      - name: Commit and push fixes
        if: always() && steps.fix.outputs.changes_made == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/shows.json
          git commit -m "fix: Auto-fix ${{ steps.fix.outputs.summary }} TodayTix links" || exit 0
          git pull --rebase origin main
          git push origin main
