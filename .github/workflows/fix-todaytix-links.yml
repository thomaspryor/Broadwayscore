name: Fix TodayTix Links

on:
  schedule:
    # Weekly on Mondays at 10 AM EST (3 PM UTC)
    - cron: '0 15 * * 1'
  workflow_dispatch: {}

concurrency:
  group: fix-todaytix-links
  cancel-in-progress: true

jobs:
  fix-links:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}


      - name: Checkout core data
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Check and fix TodayTix links
        id: fix
        run: node scripts/fix-todaytix-links.js

      - name: Commit and push fixes
        if: always() && steps.fix.outputs.changes_made == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Core data files pushed to private repo by push-core-data action
          git commit -m "fix: Auto-fix ${{ steps.fix.outputs.summary }} TodayTix links" || exit 0
          bash scripts/lib/push-with-retry.sh


      - name: Push core data to private repo
        if: always()
        uses: ./.github/actions/push-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
          message: 'data: Update from fix-todaytix-links'

      - name: Dispatch deploy
        if: always()
        uses: ./.github/actions/dispatch-deploy

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: 'Fix TodayTix Links Failed'
          discord_webhook: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
          resend_api_key: ${{ secrets.RESEND_API_KEY }}
          owner_email: ${{ secrets.OWNER_EMAIL }}