name: Daily Digest (score drift)
on:
  schedule:
    # 06:30 UTC daily. Card #497 (owner merge decision — exactly one scheduled
    # email/day, not three): this no longer emails on its own. It writes
    # data/audit/daily-digest-snapshot.json instead; autonomous-email.js folds
    # it into the loop's single scheduled morning email. Runs BEFORE the loop
    # starts (03:30 ET / 07:30 UTC) so the snapshot is same-day fresh — same
    # reasoning as data-health-check.yml's 06:45 UTC move (card #364).
    - cron: '30 6 * * *'
  workflow_dispatch: {}

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  write-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Write daily digest snapshot
        run: node scripts/send-daily-digest.js

      - name: Commit updated snapshots
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/audit/daily-snapshot.json data/audit/daily-digest-snapshot.json
          if git diff --staged --quiet; then
            echo "No snapshot changes"
          else
            git commit -m "data: Update daily digest snapshot [skip ci]"
            bash scripts/lib/push-with-retry.sh
          fi

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: 'Daily Digest Snapshot Failed'
          description: 'Daily digest script crashed — its snapshot may not have written, so tomorrow''s morning email won''t carry score-drift data.'
          severity: 'warning'
          discord_webhook: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
