name: Daily Digest (score drift)
on:
  schedule:
    # Daily (02:00 UTC since BRO-4800). Card #497 (owner merge decision — exactly one scheduled
    # email/day, not three): this no longer emails on its own. It writes
    # data/audit/daily-digest-snapshot.json instead; autonomous-email.js folds
    # it into the loop's single scheduled morning email. Runs BEFORE the loop
    # starts (03:30 ET / 07:30 UTC) so the snapshot is same-day fresh — same
    # reasoning as data-health-check.yml's 06:45 UTC move (card #364).
    # BRO-4800: moved 06:30 -> 02:00 UTC with data-health-check.yml. GitHub's
    # schedule lag here is 5-8h, so 06:30 ran after the 11:30 UTC digest.
    - cron: '0 2 * * *'
  workflow_dispatch: {}

concurrency:
  group: daily-digest
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  write-digest:
    runs-on: ubuntu-latest
    # 15 (BRO-6542): the core-data checkout allows ~150s x3 attempts when GitHub hangs.
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Write daily digest snapshot
        run: node scripts/send-daily-digest.js

      # BRO-6542: new tour / pre-Broadway / UK regional shows for the morning email.
      # Runs AFTER the score-drift step and tolerates failure of its own checkout and
      # producer, so neither can block the snapshot above or its commit below.
      - name: Checkout core data (new-show-types producer)
        id: core-data
        continue-on-error: true
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
          sparse: 'true'

      - name: Write new-show-types snapshot
        if: steps.core-data.outcome == 'success'
        id: new-show-types
        # lint-allow-swallow: a failure here must not block the score-drift commit; the outcome is checked by the warn and notify steps below
        continue-on-error: true
        run: node scripts/produce-new-show-types-snapshot.js

      - name: Warn when new-show-types did not run
        if: always() && (steps.core-data.outcome == 'failure' || steps.new-show-types.outcome == 'failure')
        run: echo "::warning::new-show-types snapshot did not update (core-data=${{ steps.core-data.outcome }}, producer=${{ steps.new-show-types.outcome }}); the morning email skips that section until it succeeds."

      - name: Notify when new-show-types failed
        if: always() && (steps.core-data.outcome == 'failure' || steps.new-show-types.outcome == 'failure')
        uses: ./.github/actions/notify-failure
        with:
          title: 'New-show-types snapshot failed'
          description: 'The nightly new tour / pre-Broadway / UK regional shows snapshot did not update, so the morning email skips that section until it succeeds.'
          severity: 'warning'
          discord_webhook: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}

      - name: Commit updated snapshots
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/audit/daily-snapshot.json data/audit/daily-digest-snapshot.json
          # Absent until the producer has succeeded once; a missing path must not fail the commit.
          git add data/audit/new-show-types-snapshot.json 2>/dev/null || true
          git add data/audit/new-show-types-seen.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No snapshot changes"
          else
            git commit -m "data: Update daily digest snapshot [skip ci]"
            bash scripts/lib/push-with-retry.sh
          fi

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: 'Daily Digest Snapshot Failed'
          description: 'Daily digest job failed (score-drift script or snapshot commit), so tomorrow''s morning email may be missing score-drift data.'
          severity: 'warning'
          discord_webhook: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
