concurrency:
  # On main: PER-COMMIT group (append github.sha) so every commit runs in its own
  #   group and no push can ever supersede another's run. cancel-in-progress:false
  #   alone was NOT enough — GitHub keeps only ONE pending run per group and
  #   CANCELS the older pending one when a newer push queues behind the same
  #   in-progress run. During a data-bot/code-merge burst that silently cancelled
  #   queued code-push runs before any job started (2026-07-11: 7 consecutive main
  #   runs cancelled in <60s with jobs:[], incl. code merge 15546f848 — the
  #   consecutive-main-failure pager keys on COMPLETED runs, so a red code push
  #   could land with no completed run attributed to it). Per-sha grouping removes
  #   the shared queue entirely; runs never cancel, only wait on runner slots.
  # On PRs: keep the shared workflow-ref-event group + cancel-in-progress so
  #   superseded commits cancel — only the latest commit on a branch matters.
  # See memory/feedback_test_yml_cancel_in_progress.md (cancel-in-progress fix) and
  # the pending-supersession follow-up.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}${{ github.ref == 'refs/heads/main' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint-workflows:
    name: Lint Workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install actionlint
        run: |
          ACTIONLINT_VERSION=1.7.7
          curl -sL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" | tar xz
          sudo mv actionlint /usr/local/bin/
      - name: Lint workflow files
        run: |
          # Emergency escape hatch (opening-night hotfixes only): if the
          # commit message contains "[skip-actionlint]", this gate exits 0.
          # Symmetric with [skip-demo-flag-check] above. Use sparingly; the
          # most likely cause of needing it is a transient actionlint bump
          # that adds a new rule mid-incident. Follow up with a real fix.
          if git log -1 --format=%B | grep -Fq "[skip-actionlint]"; then
            echo "::warning::actionlint check skipped via [skip-actionlint] commit-message tag"
            exit 0
          fi
          actionlint -color -shellcheck="" \
            -ignore 'maximum number of inputs' \
            .github/workflows/*.yml
      - name: Setup Node (for orphan-test audit)
        uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Audit — no orphan unit tests
        # Notion 362637c5-416f-81f4 — every tests/unit/*.test.{mjs,ts,js} must be
        # wired into a workflow runner, or it silently doesn't run. Discovered
        # 59 orphans during Stuart King Fixes v2 (33% of the suite). Audit script
        # diffs the on-disk file list against the YAML references; exits 1 on
        # any new orphan. Known-broken tests live in an EXEMPT_KNOWN_BROKEN dict
        # in the script itself, each with a Notion card pointer.
        #
        # Emergency escape hatch (symmetric with [skip-actionlint] above): if the
        # latest commit message contains "[skip-orphan-audit]", the gate exits 0.
        # Use only for opening-night hotfixes where a forgotten registration is
        # less urgent than the actual fix. Follow up with a proper registration.
        run: |
          if git log -1 --format=%B | grep -Fq "[skip-orphan-audit]"; then
            echo "::warning::orphan-test audit skipped via [skip-orphan-audit] commit-message tag"
            exit 0
          fi
          node scripts/audit-orphan-tests.js
      - name: Audit — decayed exemptions
        # If an EXEMPT_KNOWN_BROKEN test starts passing, the exemption is stale
        # and should be removed (otherwise the gate hides a now-passing test
        # forever). Run each exempt test and fail if any pass.
        # Same [skip-orphan-audit] escape hatch as the gate above.
        run: |
          if git log -1 --format=%B | grep -Fq "[skip-orphan-audit]"; then
            echo "::warning::decayed-exemption check skipped via [skip-orphan-audit] commit-message tag"
            exit 0
          fi
          STALE=""
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            # 30s wrapper via Node — `timeout` isn't available on the ubuntu runner without coreutils alias.
            if node --test --test-timeout 30000 "tests/unit/$f" > /dev/null 2>&1; then
              STALE="$STALE $f"
            fi
          done < <(node scripts/audit-orphan-tests.js --list-exempt)
          if [ -n "$STALE" ]; then
            echo "::error::Decayed exemption(s) — these tests now pass and must be removed from EXEMPT_KNOWN_BROKEN in scripts/audit-orphan-tests.js:$STALE"
            exit 1
          fi
          echo "All exemptions still failing — no decay."

      - name: Audit — no push-to-main workflow cancels main commits
        # Prevents the recurring "no clean CI signal" class: a push-to-main workflow
        # with a ref-keyed concurrency group + cancel-in-progress:true kills the prior
        # run on every commit, so most main commits land unvalidated AND cancelled
        # runs emit phantom jsdom/shows.json failures. test.yml had this for months
        # and it was re-diagnosed almost daily. Guard fails if it (or any sibling)
        # regresses. Opt-out for idempotent jobs via a "# concurrency-cancel-ok:"
        # annotation. See memory/feedback_test_yml_cancel_in_progress.md.
        run: node scripts/audit-workflow-concurrency.js

      - name: Audit — workflow hygiene (notify-failure, playwright, push-with-retry)
        # Guards three workflow hygiene rules:
        # (a) Any scheduled/push/dispatch workflow must include notify-failure as last step
        # (b) No inline `npx playwright install` — use .github/actions/setup-playwright
        # (c) Any `git push` to origin must use scripts/lib/push-with-retry.sh (not bare git push)
        # Exempt a workflow with # hygiene-notify-ok/playwright-ok/push-ok: <reason>.
        # Root cause for each rule: (a) baseline rot via SKIP-VISUAL-CHECK in red CI,
        # (b) browser cache miss wastes 15s/run, (c) bare || echo swallows push failures.
        run: node scripts/audit-workflow-hygiene.js

      - name: Audit — CLAUDE.md integrity anchors + byte cap
        # Single source of truth: scripts/lib/claude-md-anchors.json. Every listed
        # phrase MUST appear in CLAUDE.md (a trim/edit that drops one is the bug
        # this catches — same list ~/.claude/hooks/session-start.sh checks advisorily),
        # and CLAUDE.md must stay under byteLimit (it loads into every session).
        run: |
          node -e '
            const fs = require("fs");
            const cfg = JSON.parse(fs.readFileSync("scripts/lib/claude-md-anchors.json", "utf8"));
            const md = fs.readFileSync("CLAUDE.md", "utf8");
            const missing = (cfg.anchors || []).filter(p => !md.includes(p));
            if (missing.length) {
              console.error("::error::CLAUDE.md missing required anchor phrase(s): " + missing.join(" | "));
              process.exit(1);
            }
            const bytes = Buffer.byteLength(md, "utf8");
            if (cfg.byteLimit && bytes > cfg.byteLimit) {
              console.error(`::error::CLAUDE.md is ${bytes}B, over the ${cfg.byteLimit}B cap. Trim it or move detail to memory/.`);
              process.exit(1);
            }
            console.log(`CLAUDE.md OK: ${cfg.anchors.length} anchors present, ${bytes}B <= ${cfg.byteLimit}B`);
          '

      - name: Audit — check-cron-health max_hours vs real cron cadence
        # Catches the 2026-05-24 class of bug where an entry's max_hours is
        # less than the worst gap between its workflow's cron fires, guaranteeing
        # false-positive staleness alerts. Script reads CRITICAL_CRONS entries
        # from check-cron-health.yml, simulates 60 days of cron fires for each
        # referenced workflow, and fails if max_hours < worst real gap.
        run: |
          if git log -1 --format=%B | grep -Fq "[skip-cron-audit]"; then
            echo "::warning::cron-health coverage audit skipped via [skip-cron-audit] commit-message tag"
            exit 0
          fi
          node scripts/audit-cron-health-coverage.js

      - name: Audit — tests vs derived data (no silent factual pins)
        # Tests that read data/awards.json, data/reviews.json, or data/shows.json
        # (derived enricher outputs) must ALSO read from data/precursors/ or
        # data/review-texts/ (the sources that generate them), OR carry a
        # `// TESTS-VS-DERIVED-DATA-EXEMPT: <reason>` comment near the top.
        #
        # Why: 2026-05-26 incident — three awards-person-winner-pairing.test.mjs
        # pins broke because they hard-coded facts ("Lithgow won for X") that
        # Track A's Wikipedia audit later corrected. The test was re-asserting
        # the bug it was meant to catch. This gate forces derive-from-source
        # (or an explicit, justified exemption).
        run: node scripts/audit-tests-vs-derived-data.js

      - name: Audit — no synthesized .click() in Playwright tests
        # `document.querySelector(...).click()` inside page.evaluate (or any
        # browser-side callback) bypasses Playwright's actionability checks.
        # On hydration-heavy pages, the synthesized DOM click fires before
        # React's onClick attaches and silently no-ops. Tests pass by luck
        # until an unrelated layout shift slows hydration just enough to
        # flip them red.
        #
        # Why: 2026-05-26 — filter-panel-sync.spec.ts West End went red after
        # an unrelated homepage commit (LOSO a88d9cd516) added a few lines to
        # FeaturedSpot prose, delaying hydration enough to lose the race.
        # The fix shipped here uses Playwright actionable clicks; this audit
        # prevents the next test from reintroducing the pattern.
        run: node scripts/audit-playwright-evaluate-click.js

      - name: Audit — Tony LOSO snapshot co-change
        # If TONY_RECIPES, TONY_RECIPES_TIER2, or categoryAwardsScore changes
        # in src/lib/data-tony-predictions.ts, data/tony-loso-stats.json MUST
        # also change in the same PR. The disclosure on /tony-awards/predictions
        # reads its accuracy figure live from tony-loso-stats.json — if a recipe
        # edit lands without re-running the audit, the live "X% of past winners"
        # number silently desyncs from what the model actually produces.
        #
        # The fix when this gate fires:
        #   npx tsx scripts/audit-tony-loso.ts && git add data/tony-loso-stats.json
        # The audit re-runs leave-one-season-out cross-validation against the
        # new recipe and rewrites the JSON with current numbers.
        #
        # Comment-only diffs to the Tony predictions module are ignored so
        # docblock edits don't force unrelated audit reruns.
        run: |
          # Base-ref selection:
          # - PR event: github.base_ref is set (e.g. "main"). Compare against origin/<base>.
          # - Push-to-main / schedule / dispatch: github.base_ref is empty. The
          #   checked-out HEAD IS origin/main (they point at the same commit),
          #   so diffing against origin/main shows nothing and the gate silently
          #   no-ops. Fall back to HEAD~1 to detect the change that just landed.
          if [ -n "${{ github.base_ref }}" ]; then
            BASE_REF="${{ github.base_ref }}"
            git fetch origin "$BASE_REF" --depth=2 2>/dev/null || true
            BASE="origin/$BASE_REF"
            if ! git rev-parse "$BASE" >/dev/null 2>&1; then BASE=HEAD~1; fi
          else
            # Push / schedule / dispatch — compare to parent commit.
            BASE=HEAD~1
            if ! git rev-parse "$BASE" >/dev/null 2>&1; then
              echo "No parent commit available — skipping LOSO snapshot gate"
              exit 0
            fi
          fi

          # Did the predictions module change at all in this diff?
          if ! git diff "$BASE" --name-only -- src/lib/data-tony-predictions.ts | grep -q .; then
            echo "data-tony-predictions.ts unchanged — skipping LOSO snapshot gate"
            exit 0
          fi

          # Did the change touch the recipe constants or awards-term function
          # (i.e. anything that would shift LOSO numbers), or is it comment-only?
          # Look for added/removed non-comment lines mentioning the watched names.
          if ! git diff "$BASE" -- src/lib/data-tony-predictions.ts \
                | grep -E '^[+-][^+-]' \
                | grep -vE '^[+-][[:space:]]*(//|\*)' \
                | grep -qE 'TONY_RECIPES|categoryAwardsScore'; then
            echo "Only comments / unrelated lines changed — skipping LOSO snapshot gate"
            exit 0
          fi

          # Did data/tony-loso-stats.json change alongside?
          if git diff "$BASE" --name-only -- data/tony-loso-stats.json | grep -q .; then
            echo "Recipe changed AND snapshot updated — OK"
            exit 0
          fi

          echo "::error::TONY_RECIPES, TONY_RECIPES_TIER2, or categoryAwardsScore changed in src/lib/data-tony-predictions.ts but data/tony-loso-stats.json was not updated in this PR."
          echo "::error::Run locally: npx tsx scripts/audit-tony-loso.ts && git add data/tony-loso-stats.json && git commit --amend --no-edit"
          echo "::error::This keeps the live disclosure number on /tony-awards/predictions consistent with the shipped model. Without this gate, recipe edits silently desync the public accuracy claim."
          exit 1

      - name: Check workflows don't bypass npm prebuild lifecycle
        run: |
          # Logic lives in scripts/lint-workflow-guards.sh — shared with the
          # local pre-push hook (scripts/hooks/pre-push) so violations block
          # at push time instead of reddening main.
          bash scripts/lint-workflow-guards.sh prebuild

      - name: Check checkout-core-data has matching push-core-data
        run: |
          # BLOCKING again as of 2026-07-12 (v2): keys on the three audited
          # core-data-writing scripts instead of the old checkout+write
          # heuristic (which was a dead no-op since birth — grep -c "0\n0"
          # bug). Audit + exemption rationale in scripts/lint-workflow-guards.sh.
          bash scripts/lint-workflow-guards.sh core-data-pairing

      - name: Check workflows don't git-add private core data files
        run: |
          # Logic lives in scripts/lint-workflow-guards.sh — shared with the
          # local pre-push hook.
          bash scripts/lint-workflow-guards.sh private-git-add

      - name: Check for tracked symlinks or gitlinks
        run: |
          # Symlinks (120000) and gitlinks (160000) to local paths dangle in CI.
          # This has caused cascading workflow failures 3 times (reviews.json,
          # .core-data-checkout, .claude/worktrees/fix-ci-noise).
          BAD=$(git ls-files --stage | grep -E "^(120000|160000)" || true)
          if [ -n "$BAD" ]; then
            echo "::error::Tracked symlinks or gitlinks found — these break CI:"
            echo "$BAD"
            echo "Fix: git rm --cached <path> and add to .gitignore"
            exit 1
          fi
          echo "No tracked symlinks or gitlinks"

      - name: Check .gitattributes merge drivers are registered
        run: |
          # Logic lives in scripts/lint-workflow-guards.sh — shared with the
          # local pre-push hook.
          bash scripts/lint-workflow-guards.sh merge-drivers

      - name: Check scraping workflows have multi-service fallback
        run: |
          # fetchPage()/BD+SB fallback enforcement. Logic lives in
          # scripts/lint-workflow-guards.sh (EXEMPT list included) — shared
          # with the local pre-push hook.
          bash scripts/lint-workflow-guards.sh scraping-fallback

      - name: Check Theatr token is not passed to unauthorized workflows
        run: |
          # Logic lives in scripts/lint-workflow-guards.sh — shared with the
          # local pre-push hook.
          bash scripts/lint-workflow-guards.sh theatr-token

      - name: Check demo feature flags not used in server components
        run: |
          # Logic lives in scripts/lint-workflow-guards.sh — shared with the
          # local pre-push hook. [skip-demo-flag-check] commit-message bypass
          # preserved inside the script.
          bash scripts/lint-workflow-guards.sh demo-flags

      - name: Check scripts route review-texts writes through safeWriteReview
        run: |
          # Joe Turner postmortem P0 #2 (2026-04-26). Logic lives in
          # scripts/lint-write-routing.sh — shared with the local pre-push hook
          # (scripts/hooks/pre-push) so violations block at push time instead of
          # reddening main for hours (2026-07-12: 24 consecutive failures).
          bash scripts/lint-write-routing.sh review-texts

      - name: Check scripts route reviews.json writes through rebuild-all-reviews
        run: |
          # data/reviews.json is a derived aggregate produced by
          # scripts/rebuild-all-reviews.js. New scripts MUST NOT write to it
          # directly — they should modify the source-of-truth files in
          # data/review-texts/<showId>/ and let the rebuild produce the
          # aggregate. Direct writes bypass the rebuild's audit trail
          # (rebuild-score-drift, rebuild-regression, opening-night-completeness).
          #
          # See Notion card 351637c5-416f-81f8-a8fd-c3e0570f1454 for the
          # broader plan to extend this to shows.json + audience-buzz.json
          # once those acquire canonical writer helpers.
          # Logic lives in scripts/lint-write-routing.sh — shared with the
          # local pre-push hook (scripts/hooks/pre-push).
          bash scripts/lint-write-routing.sh reviews-json

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Only run on schedule (daily) — not every push, to avoid noise
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: npm audit (critical only, expiring allowlist)
        # Allowlist wrapper (scripts/audit-dependencies.js): raw `npm audit`
        # has no exemption mechanism, so an unfixable critical (decompress
        # GHSA-mp2f-45pm-3cg9 — no patched release exists) turned CI
        # permanently red on 2026-07-11. The wrapper fails on any critical
        # NOT in its expiring allowlist and on expired entries.
        run: node scripts/audit-dependencies.js

  awards-data-freshness:
    name: Awards Data Freshness
    runs-on: ubuntu-latest
    # 3 min is ample now that the check is one O(1) API call + shallow checkout —
    # the 8-min bump (2026-05-17) only existed to outlast the full-history clone,
    # which this job no longer does. See the freshness-check step for the why.
    timeout-minutes: 3
    # Schedule + manual only — never block unrelated PRs.
    # Surfaces in daily digest via getWorkflowRunSummary; promotes from
    # "operator forgot annual update" silent rot to a loud weekly failure.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Shallow — the freshness check no longer reads git history (see below),
          # only the local ./.github/actions/notify-failure composite needs the tree.
          fetch-depth: 1
      - name: Check awards.json was updated within 14 months
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Annual awards cadence (Tony, Pulitzer, DD, OCC, DL, NYDCC, Olivier)
          # means data/awards.json should change at least once per ceremony year.
          # 14 months = 12-month annual cycle + 2 months grace for late ceremonies
          # (Tonys were September 2021 due to COVID).
          #
          # Last-touch date comes from the GitHub commits-by-path API (O(1)) rather
          # than `git log` over a full-history clone. The full clone (fetch-depth: 0)
          # of this 134k-commit, ~2min-churn repo blew first the 3-min then the
          # bumped 8-min job timeout (2026-06-30, Notion 38f637c5) — and on a
          # high-churn repo even a 14-month --shallow-since fetch pulls most of
          # history, so the API is the only stable fix. Same answer as git mtime.
          #
          # If this fires, run the annual update — see memory/awards-annual-update.md.
          MAX_DAYS=425  # ~14 months
          LAST_ISO=$(gh api "/repos/${{ github.repository }}/commits?path=data/awards.json&per_page=1" \
            --jq '.[0].commit.committer.date')
          if [ -z "$LAST_ISO" ] || [ "$LAST_ISO" = "null" ]; then
            echo "::error::Could not determine last-touch date for data/awards.json via the GitHub API"
            exit 1
          fi
          LAST_TS=$(date -u -d "$LAST_ISO" +%s 2>/dev/null \
            || date -u -j -f "%Y-%m-%dT%H:%M:%SZ" "$LAST_ISO" +%s)
          NOW=$(date +%s)
          AGE_DAYS=$(( (NOW - LAST_TS) / 86400 ))
          echo "data/awards.json last touched ${AGE_DAYS} days ago (${LAST_ISO})"
          if [ "$AGE_DAYS" -gt "$MAX_DAYS" ]; then
            echo "::error::data/awards.json is ${AGE_DAYS} days stale (max ${MAX_DAYS}). Run the annual awards update — see memory/awards-annual-update.md"
            exit 1
          fi
          echo "Awards data freshness OK (within ${MAX_DAYS}-day window)"
      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: 'Awards Data Stale (>14 months)'
          severity: 'warning'
          discord_webhook: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}

  design-tokens-lint:
    name: Design Token Drift Guard
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Lint design tokens
        # Forbids border-gray/slate/zinc-*, bg-gray-700/800/900/950, bg-slate/zinc-*,
        # text-slate/zinc-* in src/. Prior sessions spent hours cleaning up drift
        # (2026-04-12: 129 zinc refs, 2026-04-13: 44 gray/slate refs). Without a
        # gate, drift reappears in ~2 weeks. Exemption: `// design-lint-ok: <reason>`.
        # See memory/design-system.md for the canonical token list.
        run: node scripts/lint-design-tokens.js
      - name: Check brand-tokens.json ↔ tailwind.config.ts sync
        # public/brand-tokens.json feeds Claude Design, Figma, Canva, email
        # templates, and the brand kit — tailwind.config.ts feeds the running
        # site. They must agree pixel-for-pixel. This script verifies 16 tracked
        # color values match between the two files.
        run: node scripts/check-brand-tokens-sync.js

  typescript-check:
    name: TypeScript Check
    # Skip on Dependabot PRs — they don't have access to REVIEW_TEXTS_TOKEN, so
    # checkout-core-data fails; root tsc transitively imports data/*.json files
    # via resolveJsonModule and breaks without them. Same pattern as unit-tests.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        # Need node_modules for tsc to resolve imports.
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Checkout core data
        # src/lib/data-*.ts imports data/shows.json, data/reviews.json, etc. via
        # resolveJsonModule. Without checkout-core-data tsc fails with TS2307 on
        # the JSON imports. Same composite action used by unit-tests.
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
      - name: Generate gitignored manifests
        # data/cast-manifest.json and data/actor-slugs.json are gitignored
        # (built in prebuild) but src/lib/data-actors.ts, data-cast-obc.ts,
        # and data-tony-nominees.ts import them via resolveJsonModule.
        # Without these tsc fails with TS2307. Mirror prebuild.sh.
        run: |
          node scripts/build-actor-slugs-manifest.js
          node scripts/build-cast-manifest.js
      - name: tsc — root (src/, app/, tests/)
        # Catches type errors in app code. Root tsconfig excludes scripts/.
        # Currently green on main — this gate ensures it stays that way.
        run: npx tsc --noEmit
      - name: tsc — scripts/llm-scoring/
        # if: always() so this runs even if root tsc fails (root tsc covers
        # src/app/tests/; llm-scoring is scoped separately and must not be
        # masked by an unrelated root failure).
        if: always()
        # Catches type errors in the llm-scoring pipeline. Scoped via
        # scripts/llm-scoring/tsconfig.json because the parent
        # scripts/tsconfig.json has pre-existing rootDir errors in
        # unrelated scripts (audit-tony-all-seasons, scrape-grosses, etc).
        # Why this gate exists: 2026-05-16 — the systematic-tier fix
        # shipped a 12-error consumer mismatch (evaluate.ts:446-448)
        # that no CI check caught because root tsc skips scripts/. Adding
        # this gate would have failed the merge and prevented the bug.
        run: npx tsc --noEmit -p scripts/llm-scoring/tsconfig.json
      - name: next lint
        # if: always() so lint runs even if tsc above fails — they're independent
        # gates and either failure should surface in this job.
        # Why this gate exists: 2026-05-23 — next.config.js sets
        # eslint.ignoreDuringBuilds:true to skip lint inside vercel build (saves
        # ~20s on hot-path deploys). This step is the replacement CI gate so
        # lint regressions are still caught before merge. Default behavior
        # (no --max-warnings) matches the prior in-build behavior: errors fail,
        # existing warnings (e.g. <img> tag advisories) don't block merges.
        if: always()
        run: npx next lint
      - name: Audit NFT-excluded runtime reads
        # if: always() so this runs even if tsc/lint fail above — independent gate.
        # Why this gate exists: 2026-05-23 — commit e2154a1b23 added data/cast/**
        # to next.config.js outputFileTracingExcludes as a belt-and-suspenders
        # guard, but src/lib/data-actors.ts + data-cast-obc.ts still read those
        # files dynamically at runtime. In production the directory was missing
        # from the bundle, so every /cast/[slug] returned 404 silently (locally
        # everything worked because data/cast/ exists on disk). This audit
        # detects the same conflict statically before it ships.
        if: always()
        run: node scripts/audit-nft-excluded-runtime-reads.js

  unit-tests:
    name: Unit Tests
    # Skip on Dependabot PRs — they don't have access to REVIEW_TEXTS_TOKEN
    # (separate secret namespace) so checkout-core-data fails. Dependabot updates
    # touch lockfiles + workflow YAML, not test logic; lint-workflows + dependency-audit +
    # design-tokens-lint cover the relevant bumps.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Install dependencies
        # Needed by review-guards regression tests, which transitively import
        # gather-reviews.js → scraper.js → playwright. The other unit tests
        # don't need it but the install is fast (cached).
        run: npm ci --prefer-offline --no-audit
      - name: Checkout core data
        # review-guards regression tests exercise detectCrossShowUrlMismatch,
        # which reads data/shows.json to validate that Monte Cristo URLs are
        # rejected for Becky Shaw etc. Without the slug index the guard is a no-op.
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
      - name: Refresh gold lists from current reviews
        # compute-critic-score.test checks parity between the committed gold list
        # and the live computeCriticScore(). Reviews change daily via the private
        # data repo; the committed gold list lags. Regenerating here ensures the
        # test always sees a gold list consistent with the current reviews.json.
        run: node scripts/compute-gold-lists.js
