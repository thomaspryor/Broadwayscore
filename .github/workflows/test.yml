concurrency:
  # On main: PER-COMMIT group (append github.sha) so every commit runs in its own
  #   group and no push can ever supersede another's run. cancel-in-progress:false
  #   alone was NOT enough — GitHub keeps only ONE pending run per group and
  #   CANCELS the older pending one when a newer push queues behind the same
  #   in-progress run. During a data-bot/code-merge burst that silently cancelled
  #   queued code-push runs before any job started (2026-07-11: 7 consecutive main
  #   runs cancelled in <60s with jobs:[], incl. code merge 15546f848 — the
  #   consecutive-main-failure pager keys on COMPLETED runs, so a red code push
  #   could land with no completed run attributed to it). Per-sha grouping removes
  #   the shared queue entirely; runs never cancel, only wait on runner slots.
  # On PRs: keep the shared workflow-ref-event group + cancel-in-progress so
  #   superseded commits cancel — only the latest commit on a branch matters.
  # See memory/feedback_test_yml_cancel_in_progress.md (cancel-in-progress fix) and
  # the pending-supersession follow-up.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}${{ github.ref == 'refs/heads/main' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint-workflows:
    name: Lint Workflows
    runs-on: ubuntu-latest
    # 5 -> 10 (2026-08-14). This is RUNNER VARIANCE IN `actions/checkout`, not
    # audit growth — measured from the two runs on main that day:
    #
    #   run 31829014708 (green): job 1m31s total. Checkout 16s, actionlint
    #     install 1s, lint 0s, Setup Node 10s, npm ci 23s, and all ~45 audit
    #     steps after it 38s combined. Real work after checkout: 1m13s.
    #   run 31832656296 (killed): job hit this 5-minute cap at 5m03s having
    #     completed only Checkout (4m52s), actionlint install (1s) and the lint
    #     itself (0s). It was SIGTERMed inside `Setup Node`, and all ~45 audits
    #     after it reported `skipped`.
    #
    # Same commit range, same audits, 18x difference in one step. The Unit Tests
    # job's checkout in that same run took 4m14s, so it was the runner/network,
    # not this job. 5 minutes left only ~3.3x headroom over the real work, which
    # a single slow checkout consumes entirely; 10 covers the worst checkout
    # observed (4m52s) PLUS the full 1m13s of real work at ~1.6x, and is still
    # ~6.6x the good-path 1m31s. Do NOT read this as licence to raise the other
    # timeouts in this file — none of them was killed by this.
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install actionlint
        run: |
          ACTIONLINT_VERSION=1.7.7
          curl -sL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" | tar xz
          sudo mv actionlint /usr/local/bin/
      - name: Lint workflow files
        run: |
          # Emergency escape hatch (opening-night hotfixes only): if the
          # commit message contains "[skip-actionlint]", this gate exits 0.
          # Symmetric with [skip-demo-flag-check] above. Use sparingly; the
          # most likely cause of needing it is a transient actionlint bump
          # that adds a new rule mid-incident. Follow up with a real fix.
          if git log -1 --format=%B | grep -Fq "[skip-actionlint]"; then
            echo "::warning::actionlint check skipped via [skip-actionlint] commit-message tag"
            exit 0
          fi
          actionlint -color -shellcheck="" \
            -ignore 'maximum number of inputs' \
            .github/workflows/*.yml
      - name: Setup Node (for orphan-test audit)
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
      # This job previously ran with NO node_modules, so every audit here had to
      # be dependency-free. audit-help-flag-safety.js now tokenizes with acorn to
      # tell string CONTENT from a real call; with no deps it FAILS OPEN (source
      # returned unchanged), which resurfaces the USAGE-string false positive and
      # left Lint Workflows red on main after the first fix (task #684). Cached,
      # so this costs seconds after the first run.
      - name: Install dependencies (audits below use acorn)
        run: npm ci --no-audit --no-fund
      - name: Audit — no orphan unit tests
        # Notion 362637c5-416f-81f4 — every tests/unit/*.test.{mjs,ts,js} must be
        # wired into a workflow runner, or it silently doesn't run. Discovered
        # 59 orphans during Stuart King Fixes v2 (33% of the suite). Audit script
        # diffs the on-disk file list against the YAML references; exits 1 on
        # any new orphan. Known-broken tests live in an EXEMPT_KNOWN_BROKEN dict
        # in the script itself, each with a Notion card pointer.
        #
        # Emergency escape hatch (symmetric with [skip-actionlint] above): if the
        # latest commit message contains "[skip-orphan-audit]", the gate exits 0.
        # Use only for opening-night hotfixes where a forgotten registration is
        # less urgent than the actual fix. Follow up with a proper registration.
        run: |
          if git log -1 --format=%B | grep -Fq "[skip-orphan-audit]"; then
            echo "::warning::orphan-test audit skipped via [skip-orphan-audit] commit-message tag"
            exit 0
          fi
          node scripts/audit-orphan-tests.js
      - name: Audit — decayed exemptions
        # If an EXEMPT_KNOWN_BROKEN test starts passing, the exemption is stale
        # and should be removed (otherwise the gate hides a now-passing test
        # forever). Run each exempt test and fail if any pass.
        # Same [skip-orphan-audit] escape hatch as the gate above.
        #
        # This gate was a NO-OP from the day it shipped until 2026-08-01 (task
        # #684): lint-workflows had setup-node but no `npm ci`, so every exempt
        # test died on MODULE_NOT_FOUND, scored "still failing", and the gate
        # passed unconditionally. Adding `npm ci` above (acorn for the audits)
        # switched it on and it immediately caught a real decayed exemption.
        # Two consequences worth keeping in mind before editing this step:
        #   1. It judges tests in THIS job's environment — no core data, no
        #      secrets. A test whose verdict depends on ambient config will
        #      read as decayed here and fail elsewhere. That's a bug in the
        #      test, and the fix is to make the test control its own inputs
        #      (see opening-night-checks-bww-rr.test.mjs), not to re-exempt it.
        #   2. --list-exempt now emits repo-relative PATHS. Do not prepend
        #      tests/unit/ again: exempt tests also live in scripts/, and the
        #      old prefix made those resolve to a nonexistent file that always
        #      "failed", so their decay could never be detected.
        run: |
          if git log -1 --format=%B | grep -Fq "[skip-orphan-audit]"; then
            echo "::warning::decayed-exemption check skipped via [skip-orphan-audit] commit-message tag"
            exit 0
          fi
          STALE=""
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            # 30s wrapper via Node — `timeout` isn't available on the ubuntu runner without coreutils alias.
            if node --test --test-timeout 30000 "$f" > /dev/null 2>&1; then
              STALE="$STALE $f"
            fi
          done < <(node scripts/audit-orphan-tests.js --list-exempt)
          if [ -n "$STALE" ]; then
            echo "::error::Decayed exemption(s) — these tests now pass and must be removed from EXEMPT_KNOWN_BROKEN in scripts/audit-orphan-tests.js:$STALE"
            exit 1
          fi
          echo "All exemptions still failing — no decay."

      - name: Audit — no push-to-main workflow cancels main commits
        # Prevents the recurring "no clean CI signal" class: a push-to-main workflow
        # with a ref-keyed concurrency group + cancel-in-progress:true kills the prior
        # run on every commit, so most main commits land unvalidated AND cancelled
        # runs emit phantom jsdom/shows.json failures. test.yml had this for months
        # and it was re-diagnosed almost daily. Guard fails if it (or any sibling)
        # regresses. Opt-out for idempotent jobs via a "# concurrency-cancel-ok:"
        # annotation. See memory/feedback_test_yml_cancel_in_progress.md.
        run: node scripts/audit-workflow-concurrency.js

      - name: Audit — workflow hygiene (notify-failure, playwright, push-with-retry)
        # Guards three workflow hygiene rules:
        # (a) Any scheduled/push/dispatch workflow must include notify-failure as last step
        # (b) No inline `npx playwright install` — use .github/actions/setup-playwright
        # (c) Any `git push` to origin must use scripts/lib/push-with-retry.sh (not bare git push)
        # Exempt a workflow with # hygiene-notify-ok/playwright-ok/push-ok: <reason>.
        # Root cause for each rule: (a) baseline rot via SKIP-VISUAL-CHECK in red CI,
        # (b) browser cache miss wastes 15s/run, (c) bare || echo swallows push failures.
        # GH_TOKEN also arms rule (f) (task #737, never-run workflow coverage,
        # advisory-only) — the script itself skips that live GH API scan on
        # 'push' events to keep this job fast; it only runs for real on the
        # daily 'schedule' trigger or a manual dispatch.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/audit-workflow-hygiene.js

      - name: Audit — opening-night-broadcast node install runs before checklist_gate
        # #1407: checklist_gate used to run opening-night-checklist.js before
        # setup-node/npm ci, so node_modules didn't exist and any script
        # needing an npm package (cheerio) crashed with MODULE_NOT_FOUND —
        # the gate then failed closed on that crash, blocking every
        # broadcast. Keeps the fixed ordering from regressing.
        run: node scripts/assert-broadcast-step-order.js

      - name: Audit — run-budget coverage on BD/SB cron scripts (advisory)
        # Prevents the #369/#415/#421 bug class recurring: a scheduled job with
        # timeout-minutes <= 35 and BD/SB secrets invoking a script whose per-item
        # loop calls a network helper with no scripts/lib/run-budget.js check gets
        # SIGKILLed mid-run instead of exiting cleanly. Heuristic, non-blocking —
        # always exits 0 (see script header for why). Exempt a workflow with
        # # hygiene-run-budget-ok: <reason>.
        run: node scripts/audit-run-budget-coverage.js

      - name: Audit — push-core-data audit-persistence gap (advisory)
        # Task #1460 (cousin of #1442's rule (g) in audit-workflow-hygiene.js):
        # push-core-data's CORE_FILES list never includes data/audit/*.json, so
        # a workflow that writes an audit ledger (directly, or inside an
        # invoked node scripts/X.js) and relies only on push-core-data to
        # persist it silently never commits that file — every run starts cold,
        # defeating any cross-run state the ledger was meant to hold (real bug
        # fixed in audit-imageless-scored-shows.yml, task #1456). Heuristic,
        # non-blocking — always exits 0 (see script header for why). Exempt a
        # workflow with # hygiene-audit-persist-ok: <reason>.
        run: node scripts/audit-push-core-data-audit-gap.js

      - name: Audit — same-job CLEAR_BREADCRUMBS coverage (advisory)
        # BRO-250 / Notion 3b9637c5: catches a script that force:true-clears a
        # PROTECTED_FIELDS field in a job that also calls push-review-texts
        # LATER, with no scripts/lib/review-write-guard.js CLEAR_BREADCRUMBS
        # entry for it — the restore step reads committed HEAD (checked out
        # before the clearing script ran) and resurrects the field it just
        # cleared. Same bug class fixed reactively 3 times already (#97
        # staleScoredBeforeOpening, #1237 fullTextWrongAuthor, #1259
        # stuckRescoreCleared), each caught only by a human noticing symptoms
