          # writeFileSync(shows.json) pair — concurrent writers could
          # silently clobber each other's changes. All writers now go
          # through scripts/lib/shows-write-guard.js (file lock + re-read
          # merge-by-id). Logic lives in scripts/lint-write-routing.sh —
          # shared with the local pre-push hook.
          bash scripts/lint-write-routing.sh shows-json

      - name: Check scripts route commercial.json writes through commercial-write-guard
        run: |
          # Same class of bug as shows.json (card: generalize
          # shows-write-guard.js) — 13 genuine writers now go through
          # scripts/lib/commercial-write-guard.js (file lock + re-read
          # merge-by-slug). Logic lives in scripts/lint-write-routing.sh —
          # shared with the local pre-push hook.
          bash scripts/lint-write-routing.sh commercial-json

      - name: Check scripts route audience-buzz.json writes through audience-buzz-write-guard
        run: |
          # Same class of bug as shows.json — 15 genuine writers now go
          # through scripts/lib/audience-buzz-write-guard.js (file lock +
          # re-read merge-by-id). Logic lives in scripts/lint-write-routing.sh
          # — shared with the local pre-push hook.
          bash scripts/lint-write-routing.sh audience-buzz-json

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Only run on schedule (daily) — not every push, to avoid noise
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: npm audit (critical only, expiring allowlist)
        # Allowlist wrapper (scripts/audit-dependencies.js): raw `npm audit`
        # has no exemption mechanism, so an unfixable critical (decompress
        # GHSA-mp2f-45pm-3cg9 — no patched release exists) turned CI
        # permanently red on 2026-07-11. The wrapper fails on any critical
        # NOT in its expiring allowlist and on expired entries.
        run: node scripts/audit-dependencies.js

  awards-data-freshness:
    name: Awards Data Freshness
    runs-on: ubuntu-latest
    # 3 -> 10 (2026-08-15, BRO-162). The "3 min is ample" reasoning below was
    # about the freshness-check STEP (an O(1) API call), but it's `actions/
    # checkout` itself that has high runner/network variance — the same class
    # of bug just fixed for the lint-workflows job in 5f3c06f9b85 (checkout
    # 16s clean vs 4m52s killed, same runner pool). Direct evidence for THIS
    # job: runs 31713911025 (2026-08-13) and 31822872316 (2026-08-14) were
    # both killed with Checkout still `in_progress` at the 3-min mark (3m20s
    # and 2m59s respectively) — real work never even started. Because a job
    # hitting its own timeout gets conclusion "cancelled", and any cancelled
    # job makes the WHOLE test.yml run report "cancelled" regardless of other
    # jobs' outcomes, this was one of the sources behind BRO-162 (masked a
    # genuine Data Validation + Test Summary failure in 31713911025). 10
    # borrows lint-workflows' measured 4m52s-worst-checkout headroom rather
    # than a same-job measurement (no run has finished a slow checkout here to
    # time it) — the freshness-check step itself is still ~1s of real work.
    timeout-minutes: 10
    # Schedule + manual only — never block unrelated PRs.
    # Surfaces in daily digest via getWorkflowRunSummary; promotes from
    # "operator forgot annual update" silent rot to a loud weekly failure.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Shallow — the freshness check no longer reads git history (see below),
          # only the local ./.github/actions/notify-failure composite needs the tree.
          fetch-depth: 1
      - name: Check awards.json was updated within 14 months
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Annual awards cadence (Tony, Pulitzer, DD, OCC, DL, NYDCC, Olivier)
          # means data/awards.json should change at least once per ceremony year.
          # 14 months = 12-month annual cycle + 2 months grace for late ceremonies
          # (Tonys were September 2021 due to COVID).
          #
          # Last-touch date comes from the GitHub commits-by-path API (O(1)) rather
          # than `git log` over a full-history clone. The full clone (fetch-depth: 0)
          # of this 134k-commit, ~2min-churn repo blew first the 3-min then the
          # bumped 8-min job timeout (2026-06-30, Notion 38f637c5) — and on a
          # high-churn repo even a 14-month --shallow-since fetch pulls most of
          # history, so the API is the only stable fix. Same answer as git mtime.
          #
          # If this fires, run the annual update — see memory/awards-annual-update.md.
          MAX_DAYS=425  # ~14 months
          LAST_ISO=$(gh api "/repos/${{ github.repository }}/commits?path=data/awards.json&per_page=1" \
            --jq '.[0].commit.committer.date')
          if [ -z "$LAST_ISO" ] || [ "$LAST_ISO" = "null" ]; then
            echo "::error::Could not determine last-touch date for data/awards.json via the GitHub API"
            exit 1
          fi
          LAST_TS=$(date -u -d "$LAST_ISO" +%s 2>/dev/null \
            || date -u -j -f "%Y-%m-%dT%H:%M:%SZ" "$LAST_ISO" +%s)
          NOW=$(date +%s)
          AGE_DAYS=$(( (NOW - LAST_TS) / 86400 ))
          echo "data/awards.json last touched ${AGE_DAYS} days ago (${LAST_ISO})"
          if [ "$AGE_DAYS" -gt "$MAX_DAYS" ]; then
            echo "::error::data/awards.json is ${AGE_DAYS} days stale (max ${MAX_DAYS}). Run the annual awards update — see memory/awards-annual-update.md"
            exit 1
          fi
          echo "Awards data freshness OK (within ${MAX_DAYS}-day window)"
      - name: Notify on failure
        # BRO-162: `failure()` never fires on a timeout-cancelled job (its
        # conclusion is "cancelled", not "failure") — so if checkout ever
        # exceeds the budget above, this alert silently doesn't fire either.
        # Widening the timeout reduces frequency but doesn't close that gap.
        if: failure() || cancelled()
        uses: ./.github/actions/notify-failure
        with:
          title: 'Awards Data Stale (>14 months)'
          severity: 'warning'
          discord_webhook: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}

  design-tokens-lint:
    name: Design Token Drift Guard
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Lint design tokens
        # Forbids border-gray/slate/zinc-*, bg-gray-700/800/900/950, bg-slate/zinc-*,
        # text-slate/zinc-* in src/. Prior sessions spent hours cleaning up drift
        # (2026-04-12: 129 zinc refs, 2026-04-13: 44 gray/slate refs). Without a
        # gate, drift reappears in ~2 weeks. Exemption: `// design-lint-ok: <reason>`.
        # See memory/design-system.md for the canonical token list.
        run: node scripts/lint-design-tokens.js
      - name: Check brand-tokens.json ↔ tailwind.config.ts sync
        # public/brand-tokens.json feeds Claude Design, Figma, Canva, email
        # templates, and the brand kit — tailwind.config.ts feeds the running
        # site. They must agree pixel-for-pixel. This script verifies 16 tracked
        # color values match between the two files.
        run: node scripts/check-brand-tokens-sync.js

  typescript-check:
    name: TypeScript Check
    # Skip on Dependabot PRs — they don't have access to REVIEW_TEXTS_TOKEN, so
    # checkout-core-data fails; root tsc transitively imports data/*.json files
    # via resolveJsonModule and breaks without them. Same pattern as unit-tests.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    # 15, raised from 5 on 2026-08-04 (task #1002) because 5 was silently
    # cancelling main.
    #
    # THIS IS WHY THE TRUNK LOOKED CHRONICALLY UN-GREEN. A job that hits its
    # timeout reports `cancelled`, NOT `failure`. GitHub then marks the whole
    # RUN `cancelled` even when every other job succeeded — and the
    # consecutive-failure pager only looks at failures, so these runs are
    # invisible to it. That is the "~17% of main runs end cancelled" class.
    #
    # Measured, not guessed: run 30955416405 on merge SHA bdf8c62e41a had
    # Unit Tests, Data Validation, Lint Workflows, E2E Tests, Design Token
    # Drift Guard and Test Summary ALL succeed, and was still reported
    # `cancelled` — solely because this job was killed at 5m17s. The run
    # before it (30953715470) cancelled this same job too.
    #
    # 5 minutes never fit the work: checkout + npm ci + a private core-data
    # checkout + two generated manifests + TWO tsc passes + next lint + two
    # audits. unit-tests does strictly less and already gets 10.
    # Timeouts only bound the worst case — a job that finishes in 4 minutes
    # still finishes in 4 minutes — so headroom is free and a too-tight bound
    # costs exactly what it cost here.
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        # Need node_modules for tsc to resolve imports.
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Checkout core data
        # src/lib/data-*.ts imports data/shows.json, data/reviews.json, etc. via
        # resolveJsonModule. Without checkout-core-data tsc fails with TS2307 on
        # the JSON imports. Same composite action used by unit-tests.
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
      - name: Generate gitignored manifests
        # data/cast-manifest.json and data/actor-slugs.json are gitignored
        # (built in prebuild) but src/lib/data-actors.ts, data-cast-obc.ts,
        # and data-tony-nominees.ts import them via resolveJsonModule.
        # Without these tsc fails with TS2307. Mirror prebuild.sh.
        run: |
          node scripts/build-actor-slugs-manifest.js
          node scripts/build-cast-manifest.js
      - name: tsc — root (src/, app/, tests/)
        # Catches type errors in app code. Root tsconfig excludes scripts/.
        # Currently green on main — this gate ensures it stays that way.
        run: npx tsc --noEmit
      - name: tsc — scripts/llm-scoring/
        # if: always() so this runs even if root tsc fails (root tsc covers
        # src/app/tests/; llm-scoring is scoped separately and must not be
        # masked by an unrelated root failure).
        if: always()
        # Catches type errors in the llm-scoring pipeline. Scoped via
        # scripts/llm-scoring/tsconfig.json because the parent
        # scripts/tsconfig.json has pre-existing rootDir errors in
        # unrelated scripts (audit-tony-all-seasons, scrape-grosses, etc).
        # Why this gate exists: 2026-05-16 — the systematic-tier fix
        # shipped a 12-error consumer mismatch (evaluate.ts:446-448)
        # that no CI check caught because root tsc skips scripts/. Adding
        # this gate would have failed the merge and prevented the bug.
        run: npx tsc --noEmit -p scripts/llm-scoring/tsconfig.json
      - name: next lint
        # if: always() so lint runs even if tsc above fails — they're independent
        # gates and either failure should surface in this job.
        # Why this gate exists: 2026-05-23 — next.config.js sets
        # eslint.ignoreDuringBuilds:true to skip lint inside vercel build (saves
        # ~20s on hot-path deploys). This step is the replacement CI gate so
        # lint regressions are still caught before merge. Default behavior
        # (no --max-warnings) matches the prior in-build behavior: errors fail,
        # existing warnings (e.g. <img> tag advisories) don't block merges.
        if: always()
        run: npx next lint
      - name: Audit NFT-excluded runtime reads
        # if: always() so this runs even if tsc/lint fail above — independent gate.
        # Why this gate exists: 2026-05-23 — commit e2154a1b23 added data/cast/**
        # to next.config.js outputFileTracingExcludes as a belt-and-suspenders
        # guard, but src/lib/data-actors.ts + data-cast-obc.ts still read those
        # files dynamically at runtime. In production the directory was missing
        # from the bundle, so every /cast/[slug] returned 404 silently (locally
        # everything worked because data/cast/ exists on disk). This audit
        # detects the same conflict statically before it ships.
        if: always()
        run: node scripts/audit-nft-excluded-runtime-reads.js

  unit-tests:
    name: Unit Tests
    # Skip on Dependabot PRs — they don't have access to REVIEW_TEXTS_TOKEN
    # (separate secret namespace) so checkout-core-data fails. Dependabot updates
    # touch lockfiles + workflow YAML, not test logic; lint-workflows + dependency-audit +
    # design-tokens-lint cover the relevant bumps.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    # Was 5 — the last known-good run before card #616's follow-up already took
    # 4:45 (95% of budget) with ~350 test files across two `node --test`/`npx tsx
    # --test` invocations sharing this one job-level timeout. Adding 3 more tests
    # this session tipped it into a consistent (not flaky) cancellation at ~6:00.
    # Bumped to 10 for headroom as the suite keeps growing — see task #80 (CI
    # health: test.yml cancels under data-commit churn) for the related but
    # distinct concurrency-group flakiness this does NOT fix.
    #
    # 10 -> 15 (2026-08-14). MEASURED from run 31823977918's step timings:
    # setup+install+checkout+gold-lists 75s, "Run unit tests" batch 183s,
    # scripts/lib glob 34s locally across 279 files — call it ~350s of real work
    # before the remaining bash-integration and repeat steps, all of which were
    # skipped in that run and so are unmeasured. 15 gives that headroom.
    #
    # The bump is NOT the fix for that run's cancellation and must not be read
    # as one: the 644s came from ONE hung test file, not from suite growth (see
    # the --test-timeout note on the scripts/lib step). The per-test ceilings
    # added alongside this are what stop a wedge from consuming the budget; this
    # number only buys room for the suite to keep growing honestly. If this job
    # starts timing out again, find the hung test before raising it further —
    # `# duration_ms` on the failing file in the TAP output names it directly.
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Install dependencies
        # Needed by review-guards regression tests, which transitively import
        # gather-reviews.js → scraper.js → playwright. The other unit tests
        # don't need it but the install is fast (cached).
        run: npm ci --prefer-offline --no-audit
      - name: Checkout core data
        # review-guards regression tests exercise detectCrossShowUrlMismatch,
        # which reads data/shows.json to validate that Monte Cristo URLs are
        # rejected for Becky Shaw etc. Without the slug index the guard is a no-op.
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
      - name: Refresh gold lists from current reviews
        # compute-critic-score.test checks parity between the committed gold list
        # and the live computeCriticScore(). Reviews change daily via the private
        # data repo; the committed gold list lags. Regenerating here ensures the
        # test always sees a gold list consistent with the current reviews.json.
        run: node scripts/compute-gold-lists.js
      - name: Run unit tests (no-data-dependency)
        # BSC_STAGE_LATENCY_MUTE: review-file-writer's saveReview emits the
        # review-first-seen stage-latency event unconditionally. Unit fixtures
        # (guard-*, test-show-2026, fake URLs) were landing in the committed
        # prod data/audit/stage-latency.jsonl and the opening-night SLA counted
        # them as "stuck ≥60 min" (2026-07-24 false-page storm). Muting the
        # default-log write here keeps fixtures out of prod telemetry; tests
        # that need the emit set STAGE_LATENCY_LOG to their own temp file.
        #
        # The tsx invocation below runs BOTH .test.ts and .test.mjs files: any
        # test that imports TypeScript needs the tsx loader regardless of its
        # own extension. The tests/unit/stats-*.test.mjs files import
        # src/lib/stats/*.ts directly (real functions, no CommonJS mirror), so
        # they belong in the tsx line, NOT the plain `node --test` line above.
        env:
          BSC_STAGE_LATENCY_MUTE: '1'
        run: |
          # node --test with zero file args does NOT fail - it silently falls back
          # to its own default discovery glob (can exit 0 having run almost nothing,
          # or hang scanning the whole tree). A `test -s` size check alone would
          # pass on a whitespace-only manifest that then word-splits to zero
          # `node --test` args - the exact silent-discovery failure this guards
          # against. Read into an array and check its length instead (same
          # pattern already used below for scripts/lib/*.test.mjs), which also
          # avoids $(cat ...)'s unquoted word-splitting/glob-expansion on the
          # manifest entries themselves (task #763 ship-check finding).
          # --test-timeout: see the note on the scripts/lib step below. Without a
          # per-test ceiling one wedged file consumes the whole job budget and
          # the run concludes `cancelled`, which reports as a red X with no
          # failing test named — the failure is invisible.
          #
          # BOTH BATCHES ALWAYS RUN (2026-08-14 correctness fix). GitHub's
          # default shell for `run:` on Linux is `bash -e {0}`, so the first
          # non-zero command ABORTS the step. Run 31832656296 is the worked
          # example: the node batch exited 1 (one wedged file) and the entire
          # 539-test tsx batch below never executed — not failed, not reported,
          # just gone. The run looked "a bit red" while a whole batch had never
          # been run at all, which is strictly worse than a red batch because
          # nothing names the gap. So: capture each batch's exit code instead of
          # letting -e abort, print both pass/fail counts, and fail the step if
          # EITHER batch failed. A batch that did not run shows up as a missing
          # count, not as silence.
          set +e

          run_batch() {  # $1=label $2=logfile; remaining args = the command
            local label="$1" log="$2"; shift 2
            echo "::group::$label batch"
            "$@" 2>&1 | tee "$log"
            local rc=${PIPESTATUS[0]}
            echo "::endgroup::"
            # Reporter-agnostic on purpose: node --test's default reporter is
            # TAP on Node 20 (what CI pins, `# pass N`) but spec on Node 22+
            # (`ℹ pass N`), and a count line that silently reads UNKNOWN after
            # a Node bump would defeat the whole point of printing counts.
            # Match both, take $NF so the column shift doesn't matter, and
            # tail -n1 so it is the top-level summary and never a nested
            # subtest diagnostic.
            BATCH_PASS=$(grep -E '^(# pass |ℹ pass )' "$log" | tail -n1 | awk '{print $NF}')
            BATCH_FAIL=$(grep -E '^(# fail |ℹ fail )' "$log" | tail -n1 | awk '{print $NF}')
            : "${BATCH_PASS:=UNKNOWN}" "${BATCH_FAIL:=UNKNOWN}"
            return "$rc"
          }

          mapfile -t node_tests < tests/unit-test-manifest.txt
          [ ${#node_tests[@]} -eq 0 ] && { echo "::error::tests/unit-test-manifest.txt is empty or missing"; exit 1; }
          run_batch node /tmp/unit-node-batch.log \
            node --test --test-timeout 300000 "${node_tests[@]}"
          node_rc=$?; node_pass=$BATCH_PASS; node_fail=$BATCH_FAIL

          mapfile -t tsx_tests < tests/unit-test-manifest-tsx.txt
          [ ${#tsx_tests[@]} -eq 0 ] && { echo "::error::tests/unit-test-manifest-tsx.txt is empty or missing"; exit 1; }
          run_batch tsx /tmp/unit-tsx-batch.log \
            npx tsx --test --test-timeout 300000 "${tsx_tests[@]}"
          tsx_rc=$?; tsx_pass=$BATCH_PASS; tsx_fail=$BATCH_FAIL

          echo "── unit test batches ──────────────────────────────"
          echo "node batch: ${#node_tests[@]} files, pass=$node_pass fail=$node_fail exit=$node_rc"
          echo "tsx  batch: ${#tsx_tests[@]} files, pass=$tsx_pass fail=$tsx_fail exit=$tsx_rc"
          if [ "$node_rc" -ne 0 ] || [ "$tsx_rc" -ne 0 ]; then
            echo "::error::unit tests failed (node exit=$node_rc, tsx exit=$tsx_rc) — see the per-batch groups above"
            exit 1
          fi

      - name: Run slow network-dependent unit tests
        # opening-night-checks-skeleton.test.mjs hits bww-rr-discover live and
        # takes ~75s for 3 tests. Kept out of the main runner to avoid blowing
        # up the wall-clock budget there. continue-on-error: true so transient
        # network flakes don't block PRs — failures still show up red in the
        # test summary panel.
        continue-on-error: true
        run: |
          node --test --test-timeout 120000 tests/unit/opening-night-checks-skeleton.test.mjs scripts/enrich-fallback-ticket-links-live.test.mjs

      - name: Run scripts/lib tests (visual-qa transcript-scan etc.)
        # Tests colocated with the helpers they cover (scripts/lib/*.test.mjs)
        # per CLAUDE.md §15 test-extraction pattern. Covered helpers:
        #   - scripts/lib/transcript-scan.mjs (visual-qa gate helper)
        #
        # MEASURED 2026-08-14 (the "25/25 pass in <100ms" this comment used to
        # claim was true when one helper was covered; it is now 279 files /
        # ~3,700 tests): the glob runs in 34s wall locally. It is not slow.
        #
        # --test-timeout 300000 is the load-bearing part. `node --test` has NO
        # default per-test timeout, so a single wedged file blocks until the
        # JOB timeout fires and the runner SIGTERMs everything. Run 31823977918
        # is the worked example: scripts/lib/intake-breaker.test.mjs hung for
        # 635.9s (`signal: 'SIGTERM'`, `exitCode: ~`), this step burned 645s of
        # a 10-minute budget, and the whole run concluded `cancelled` — so the
        # `# fail 1` it did report was never surfaced and four other jobs' worth
        # of results were thrown away. With a per-test ceiling the same hang
        # fails as one named test and every other result survives.
        #
        # SIZING (corrected in run 31827505814 — the first attempt used 120s and
        # cancelled a legitimate test, so this number is measured, not guessed):
        # the slowest honest test is tests/unit/validate-data-push-refusal-
        # sentinel.test.mjs, which shells out to validate-data.js against the
        # full corpus — 52.5s locally, ~121s on a runner (CI is ~2.3x slower
        # than the dev machine). 300s is ~2.5x that CI figure, and still less
        # than a third of the 15-minute job budget, so a genuine hang (the 635s
        # one above included) is still caught and NAMED rather than eating the
        # job. Raise this only against a fresh measurement of the slowest
        # legitimate test — not to silence a hang.
        # if: always() so a red earlier test batch (e.g. tests/unit/*) can't skip
        # this step — otherwise a new scripts/lib/*.test.mjs gets ZERO CI coverage.
        if: always()
        run: |
          shopt -s nullglob
          tests=(scripts/lib/*.test.mjs)
          [ ${#tests[@]} -eq 0 ] && { echo "no scripts/lib tests"; exit 0; }
          node --test --test-timeout 300000 "${tests[@]}"

      - name: Repeat file-lock race test 20x (stale-break regression guard)
        # scripts/lib/file-lock.test.mjs's 'racing stale-lock breakers' test
        # spawns 6 real child processes; the mutual-exclusion violation it
        # catches (task #1024) reproduced at ~12% per run, so a single pass
        # above proves nothing about a regression. Repeat the file standalone
        # (not the whole scripts/lib/*.test.mjs glob) so a future change to
        # withFileLock's steal path can't hide behind one lucky run.
        #
        # --test-timeout 60000 (added 2026-08-14, completing the coverage the
        # 300000 ceilings above started — this step and the E2E job's unit-test
        # step were the two invocations still running with NO per-test ceiling
        # at all, i.e. still able to wedge until the job timeout and conclude
        # `cancelled` with nothing named).
        #
        # SIZING, measured on the dev machine 2026-08-14: the whole file runs in
        # 1.60/1.61/1.62s wall across three consecutive runs, and its slowest
        # single test — 'racing stale-lock breakers', the 6-child-process one
        # this step exists to repeat — is 788ms. At the ~2.3x CI-vs-dev factor
        # measured for this repo that is ~1.8s on a runner, so 60s is ~33x the
        # slowest legitimate test. It is deliberately NOT the 300000 used above:
        # the loop aborts on the first failing repeat, so the worst case here is
        # one 60s wedge (not 20), and keeping it tight means a hang is named in
        # a minute instead of eating a third of the 15-minute job budget.
        if: always()
        run: |
          for i in $(seq 1 20); do
            node --test --test-timeout 60000 scripts/lib/file-lock.test.mjs || { echo "::error::file-lock race test failed on repeat $i/20"; exit 1; }
          done

      - name: Run pre-push conflict-marker guard test (bash integration)
        # Asserts push-with-retry.sh ABORTS before pushing when a staged file carries
        # a git conflict marker (root-cause fix for the committed-marker corruption
        # that broke validate-review-texts; Notion 38e637c5). Bash-level so it
        # exercises the actual guard wiring, complementing the pure
        # scripts/lib/conflict-markers.test.mjs run by the glob above.
        if: always()  # independent suite — don't let an earlier red step skip it
        run: bash scripts/lib/push-with-retry.conflict-marker.test.sh

      - name: Run push-with-retry deadline-guard test (bash integration)
        # Asserts the overall-deadline hang guard bounds the retry loop so a stalled
        # git push can't leave a job stuck in_progress for 20-25+ min under churn
        # (task #183 / Notion 39d637c5 — the "Record pipeline success" hang).
        if: always()  # independent suite — don't let an earlier red step skip it
        run: bash scripts/lib/push-with-retry.deadline.test.sh

      - name: Run detect-stale-merge-head test (bash integration)
        # BRO-142 (recurrence of #916/#1279/#1445): pure classifier shared by
        # push-with-retry.sh, merge-worktree-to-main.sh, and the session-start.sh
        # hook. Covers none/fresh/stale classification, the env-var threshold
        # override, and linked-worktree MERGE_HEAD path resolution (the exact
        # gap that made the pre-existing session-start.sh stalled-merge check
        # invisible to worktree-launched sessions).
        if: always()  # independent suite — don't let an earlier red step skip it
        run: bash scripts/lib/detect-stale-merge-head.test.sh

      - name: Run push-with-retry mutex/deadline interaction test (bash integration)
        # Task #458 (2026-07-30 finding, card #669): push_mutex_acquire can block
        # for a real stretch waiting on another session's lock (its own timeout
        # defaults to 900s, deliberately longer than PUSH_DEADLINE_SEC's 240s
        # default) — that wait time was silently spent against the deadline
        # BEFORE the retry loop ran a single iteration, so a busy mutex alone
        # could abort the whole push with "0 attempts". Fix: SECONDS=0 right
        # after push_mutex_acquire returns, so the deadline governs actual
        # push/retry work, not queueing time. This test pre-holds the mutex with
        # a live process and asserts a real push attempt still runs afterward.
        if: always()  # independent suite — don't let an earlier red step skip it
        run: bash scripts/lib/push-with-retry.mutex-deadline.test.sh

      - name: Run push-with-retry fetch-timeout test (bash integration)
        # Task #464 root-cause fix: the mid-loop fetch could hit the full
        # GIT_NET_TIMEOUT_SEC=90 cap TWICE back-to-back (explicit-refspec fetch,
        # then the bare-form fallback retrying the identical operation under the
        # identical slow-network condition) — exact 180s gaps observed in 3 real
        # CI runs under high main-branch churn, 2026-07-25/26. Simulates a
        # genuinely hung remote (silent TCP listener, not a stalled-then-slow
        # transfer) and asserts the fallback is SKIPPED when the explicit form
        # hits the hard timeout (rc=124), so a doomed retry no longer doubles the
        # per-iteration cost.
        if: always()  # independent suite — don't let an earlier red step skip it
        run: bash scripts/lib/push-with-retry.fetch-timeout.test.sh

      - name: Run push-with-retry no-op-rebase test (bash integration)
        # Asserts the #394 root-cause fix: under actions/checkout's SHA-pinned fetch
        # refspec, a bare `git fetch origin main` leaves refs/remotes/origin/main
        # stale, so the rebase is a silent no-op and the alert-ledger never persists.
        # This reproduces the exact condition and asserts the explicit-destination
        # fetch lands the ledger commit on a busy main. Complements the pure
        # scripts/lib/push-rebase-progress.test.mjs (loud-abort decision) run above.
        if: always()  # independent suite — don't let an earlier red step skip it
        run: bash scripts/lib/push-with-retry.noop-rebase.test.sh

      - name: Run push-with-retry content-drop test (bash integration)
        # Asserts the task #619 P0 fix: a push could report success with a
        # genuine ref-update while silently discarding the run's own commit
        # content (reproduced live twice in one session on a CLAUDE.md edit).
        # Proves (1) resolve_conflicts()'s catch-all "accept remote" arm no
        # longer blindly discards real local content it doesn't recognize as
        # protected, fault-injected via a type-change conflict, and (2) the new
        # post-push content-survival check catches the incident's own
        # documented end-state, which the pre-existing added-files-only
        # survival check misses. Complements the pure
        # scripts/lib/push-content-survival.test.mjs run above.
        if: always()  # independent suite — don't let an earlier red step skip it
        run: bash scripts/lib/push-with-retry.content-drop.test.sh

      - name: Run merge-worktree-to-main content-drop test (bash integration)
        # Notion card 3b1637c5416f81b4a1e9d8be7786445f. The merge script's
        # per-file verify was `git cat-file -e origin/main:$f` — EXISTENCE
        # only. A concurrent session that reverted our lines while leaving the
        # path in place satisfied every check it made (our merge commit really
        # was an ancestor of origin's tip; the file really did exist), so it
        # printed "✓" and exited 0 with the pushed content already gone. Task
        # #684's T12 fix was lost that way twice inside 24h. Fault-injects the
        # revert from a second clone via a one-shot post-receive hook and
        # asserts three things the pre-fix script fails: the check actually
        # runs, a reverted push exits non-zero and names the revert, and the
        # PUSH_SKIP_CONTENT_SURVIVAL_CHECK kill switch still suppresses it.
        # Verified 3/9 failing against the pre-fix script, 9/9 after.
        if: always()  # independent suite — don't let an earlier red step skip it
        run: bash scripts/lib/merge-worktree-to-main.content-drop.test.sh

      - name: Run merge-worktree-to-main checkout-fail regression test (task #819)
        # Notion card 3b0637c5416f819fb6f8d4565acc7760: "merge-worktree-to-main.sh
        # exits 0 after 'could not checkout main' (stash-then-abort, silent
        # failure)". Investigation found the current die() path already exits
        # non-zero correctly (bash -x traced on both bash 3.2 and 5.3 — the EXIT
        # trap's push_mutex_release doesn't override an explicit `exit 1`); this
        # test locks that in as a permanent regression guard so a future edit to
        # die() (e.g. `exit`→`return`, a very plausible slip given restore_stash()
        # uses `return 0` right next to it) can't silently reintroduce the class.
        # Fault-injecting that exact swap and re-running this test confirms it
        # catches it (script proceeds past the abort and prints a bogus ✅).
        if: always()  # independent suite — don't let an earlier red step skip it
        run: bash scripts/lib/merge-worktree-to-main.checkout-fail.test.sh

      - name: Run merge-worktree-to-main conflict-resolution regression test (task #888)
        # Task #888 (2026-08-02): while landing #732, restore_stash()'s
        # stash-pop-conflict fallback silently `checkout HEAD -- .`-ed OVER a
        # genuine `git merge $BRANCH` conflict on a normal scripts/ path,
        # discarding the incoming branch's real fix while the script's own
        # "resolve manually" message implied nothing had been auto-resolved
        # yet. The fix distinguishes "real merge conflict in progress" from
        # "ordinary stash-pop conflict" via MERGE_HEAD presence — not a
        # static safe-path allowlist, which an adversarial review found would
        # be too narrow (this repo's local daemon churns far more paths than
        # cloud-memory/, data/audit/, public/data/admin/, e.g.
        # public/data/shows/ is merge-coverage=exempt and among the
        # highest-churn dirs) and would wedge the shared main worktree for
        # every session on routine churn. Two cases: (1) genuine merge
        # conflict — main and the worktree branch both commit different
        # content to the same normal path, plus a dirty edit to that path
        # gets stashed first — asserts the script exits non-zero and leaves
        # the real conflict/stash intact rather than resolving to main's
        # stale content; (2) ordinary churn with NO merge conflict — a
        # concurrent push moves a file's content between stash-push and
        # stash-pop with no branch-merge conflict involved — asserts the
        # script does NOT wedge and completes normally.
        if: always()  # independent suite — don't let an earlier red step skip it
        run: bash scripts/lib/merge-worktree-to-main.conflict-resolution.test.sh

      - name: Run merge-worktree-to-main retry-merge-error regression test (task #1511)
        # Task #1511 (Notion 3bc637c5416f8183aa89fecafdc5cbc6): the push-retry
        # loop's `git merge origin/$DEFAULT_BRANCH --no-edit` on retry
        # suppressed the merge command's own stderr/stdout before calling
        # die("could not merge remote changes on retry") — an operator hitting
        # a real conflict there got zero information on why, unlike the
        # syntax-floor and push-audits die() paths a few lines above it, which
        # both capture and print their command's output. Fault-injects a real
        # conflict onto the retry-merge path specifically (a git shim on PATH
        # sneaks a conflicting commit onto origin right as the script's first
        # push fires) and asserts the die() message includes git's own
        # conflict text, not the old bare message.
        if: always()  # independent suite — don't let an earlier red step skip it
        run: bash scripts/lib/merge-worktree-to-main.retry-merge-error.test.sh

      - name: Run scraper-cookie-wiring tests (direct exec, no --test wrapper)
        # This file globally monkey-patches `https.get` and `https.request`
        # to capture outbound calls without making real requests. When run
        # via `node --test`, the deferred `setImmediate` callbacks have
        # intermittently tripped a worker-IPC `Unable to deserialize cloned
        # data` error in CI on Node 20 — even when the file is the sole
        # invocation (Item 5 of the systematic CI plan, 2026-04-28).
        #
        # Running the file DIRECTLY (no --test wrapper) bypasses Node's
        # subprocess test runner entirely. The `node:test` module's
        # describe/test calls auto-register and auto-execute when the file
        # is loaded; assertion failures throw and set process.exitCode.
        # No V8 IPC serialization → no deserialize bug. 8/8 subtests still
        # run, just reported in-process via TAP to stdout.
        # Regression: 2026-04-30 — `node --test` started emitting the
        # deserialize error every run (previous isolation insufficient).
        if: always()  # independent suite — don't let an earlier red step skip it
        run: node tests/unit/scraper-cookie-wiring.test.mjs

      - name: Run review-guards regression tests
        # Tests opening-night fix #12-#14 + Times UK heuristic guard + rebuild auto-clear keyword check.
        # All tests require() the real functions from scripts/lib/review-guards.js per CLAUDE.md §15.
        # If this fails, a guard regression slipped through — fix the underlying logic, not the test.
        if: always()  # independent suite — don't let an earlier red step skip it
        run: node scripts/test-opening-night-fixes.js

      - name: Run email broadcast rendering tests
        # Tests buildBroadcastOpeningNightHtml output: zero-bucket filtering, color swatches,
        # Critics' Take rendering, multi-show coalescing. Catches Apr 2026 regression class
        # where label rows diverged between the two email template functions.
        if: always()  # independent suite — don't let an earlier red step skip it
        run: node scripts/test-email-broadcast.js

      - name: Run show deduplication tests
        # Tests scripts/lib/deduplication.js normalizeTitle + checkForDuplicate. Guards the
        # title-normalization rules that both discover-new-shows.js (creation guard) and
        # validate-data.js (catalog scan) depend on. The WE 2026 "The Truth" duplicate slipped
        # both layers because TodayTix's "…a comedy by Florian Zeller" tail wasn't stripped —
        # see memory/feedback_dedup_genre_suffix.md.
        if: always()  # independent suite — don't let an earlier red step skip it
        run: node scripts/test-deduplication.js

      - name: Check image aspect ratios for changed posters/thumbnails/heroes
        # Catches the evita-west-end-2025 class (commit a71c3defe4) where a
        # parallel session committed a wide 2.87:1 production still as
        # poster.webp — it then rendered as a vertical sliver inside the
        # show page's aspect-[2/3] object-cover container.
        # Only checks files changed in this push/PR — pre-existing legacy
        # violations (~1,179 historical thumbnails) are tracked separately
        # via the audit-images-llm.js wrong_aspect remediation pipeline.
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="origin/${{ github.base_ref }}...HEAD"
          else
            BEFORE="${{ github.event.before }}"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              RANGE="HEAD~1..HEAD"
            else
              RANGE="${BEFORE}..${{ github.sha }}"
            fi
          fi
          node scripts/check-image-aspect.js --changed "$RANGE"

  data-validation:
    name: Data Validation
    # See unit-tests above — Dependabot can't auth to private data repo.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    # Hard ceiling (task #183). Without this the job rode GitHub's 6h default, so a
    # stalled git push in "Record pipeline success" left 8 consecutive runs stuck
    # in_progress 20-25+ min (2026-07-14). push-with-retry.sh now self-bounds every
    # network op (~4 min budget), so the normal validation pass (~15 min) has ample
    # headroom; 30 min guarantees a conclusion even if a step wedges.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5


      - name: Checkout core data
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
      - name: Checkout aggregator-archive (private repo)
        uses: ./.github/actions/checkout-aggregator-archive
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
      - name: Verify core data freshness
        run: |
          # Canary: shows.json must exist and be valid after checkout-core-data
          node -e "const d=JSON.parse(require('fs').readFileSync('data/shows.json','utf8'));
                   const shows=d.shows||d; if(!shows.length) throw new Error('shows.json is empty');
                   console.log('shows.json: '+shows.length+' shows');"
          node -e "const d=JSON.parse(require('fs').readFileSync('data/reviews.json','utf8'));
                   const reviews=d.reviews||d; if(!reviews.length) throw new Error('reviews.json is empty');
                   console.log('reviews.json: '+reviews.length+' reviews');"

      - name: Guard — no copyrighted content in public repo
        run: |
          # Fail immediately if ANY review-text files are tracked in the public repo
          COUNT=$(git ls-tree -r HEAD --name-only -- 'data/review-texts/' 2>/dev/null | wc -l | tr -d ' ')
          if [ "$COUNT" -gt "0" ]; then
            echo "::error::CRITICAL: $COUNT review-text files found in public repo! These contain copyrighted content and MUST be removed."
            git ls-tree -r HEAD --name-only -- 'data/review-texts/' | head -20
            exit 1
          fi
          echo "✓ Zero review-text files in public repo"

          # Fail immediately if ANY aggregator-archive files are tracked in the public repo
          AA_COUNT=$(git ls-tree -r HEAD --name-only -- 'data/aggregator-archive/' 2>/dev/null | wc -l | tr -d ' ')
          if [ "$AA_COUNT" -gt "0" ]; then
            echo "::error::CRITICAL: $AA_COUNT aggregator-archive files found in public repo! These contain copyrighted content and MUST be removed."
            git ls-tree -r HEAD --name-only -- 'data/aggregator-archive/' | head -20
            exit 1
          fi
          echo "✓ Zero aggregator-archive files in public repo"

          # Fail immediately if ANY finances files are tracked in the public repo.
          # data/finances/ holds billing receipts + P&L ledgers (PII) — lives in the
          # private repo thomaspryor/broadway-scorecard-data under data/finances/,
          # accessed only via the GitHub API. It must NEVER be committed here.
          FIN_COUNT=$(git ls-tree -r HEAD --name-only -- 'data/finances/' 2>/dev/null | wc -l | tr -d ' ')
          if [ "$FIN_COUNT" -gt "0" ]; then
            echo "::error::CRITICAL: $FIN_COUNT finances files found in public repo! These contain billing PII and MUST be removed."
            git ls-tree -r HEAD --name-only -- 'data/finances/' | head -20
            exit 1
          fi
          echo "✓ Zero finances files in public repo"

      - name: Guard — public show JSONs not stripped of reviews
        run: |
          # Detect when a commit strips reviews from public show JSONs.
          # This catches the class of bug where a script regenerates public JSONs
          # from stale core-data, wiping reviews added by concurrent sessions.
          node -e "
            const fs = require('fs');
            const path = require('path');
            const dir = 'public/data/shows';
            const files = fs.readdirSync(dir).filter(f => f.endsWith('.json'));
            let totalReviews = 0;
            let showsWithReviews = 0;
            for (const f of files) {
              try {
                const d = JSON.parse(fs.readFileSync(path.join(dir, f), 'utf8'));
                const rv = d.rv || [];
                if (rv.length > 0) { showsWithReviews++; totalReviews += rv.length; }
              } catch {}
            }
            console.log('Public show JSONs: ' + files.length + ' files, ' + showsWithReviews + ' with reviews, ' + totalReviews + ' total reviews');
            // Absolute floor: if we have <500 shows with reviews, something is very wrong
            if (showsWithReviews < 500) {
              console.error('::error::REGRESSION: Only ' + showsWithReviews + ' shows have reviews in public JSONs (expected 500+). A script may have regenerated public JSONs from stale data.');
              process.exit(1);
            }
            // Absolute floor: total reviews should never drop below 15,000
            if (totalReviews < 15000) {
              console.error('::error::REGRESSION: Only ' + totalReviews + ' total reviews in public JSONs (expected 15,000+). A script may have regenerated public JSONs from stale data.');
              process.exit(1);
            }
            console.log('✓ Review counts above safety floor');
          "

      - name: Guard — aggregator archives present
        run: |
          TOTAL=0
          FAIL=0
          for dir in data/aggregator-archive/*/; do
            NAME=$(basename "$dir")
            COUNT=$(ls "$dir" 2>/dev/null | wc -l | tr -d ' ')
            echo "$NAME: $COUNT files"
            TOTAL=$((TOTAL + COUNT))
            if [ "$COUNT" -lt 5 ]; then
              echo "::warning::$NAME has only $COUNT files (expected 5+)"
              FAIL=$((FAIL + 1))
            fi
          done
          if [ "$TOTAL" -lt 2500 ]; then
            echo "::error::CRITICAL: Only $TOTAL aggregator archive files found (expected 2500+). Archives may have been accidentally deleted."
            exit 1
          fi
          if [ "$FAIL" -gt 2 ]; then
            echo "::error::$FAIL aggregator directories below minimum file count."
            exit 1
          fi
          echo "✓ $TOTAL aggregator archive files present"

      - name: Checkout review-texts (private repo)
        uses: ./.github/actions/checkout-review-texts
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Auto-close expired shows
        run: node scripts/auto-close-expired-shows.js

      # --- Independent data-check steps below all carry `if: always()` ---------
      # Each is a SEPARATE assertion (validation, contamination, integrity).
      # Without always(), the first failing check fail-fasts and masks every
      # check after it, so a red run reports one problem, you fix it, the next
      # surfaces, repeat — turning a few failures into days of serialized
      # whack-a-mole (2026-06-19→22: main red ~2 days, failures surfacing one at
      # a time). With always() every check runs and any failure still fails the
      # job, so one run reports ALL failing gates. Matches the pre-existing
      # pattern on the contamination/text-quality/provisional-venue steps.
      # Setup steps (checkout, npm ci, freshness canary) and the auto-close
      # MUTATION stay fail-fast above — downstream is meaningless if they break.
      - name: Run explainExclusion corpus parity (needs review-texts)
        # Coverage Verdict S0 (task #902) shipped review-guards.explain.test.mjs
        # with a three-layer design whose top layer sweeps the whole review-texts
        # corpus asserting explainExclusion()===null <=> isIncludableForRebuild().
        # That layer never ran in CI: the scripts/lib/*.test.mjs glob lives in the
        # unit-tests job, and unit-tests only runs checkout-core-data, which copies
        # /tmp/core-data-checkout/*.json into data/ and NEVER data/review-texts/.
        # The corpus comes from checkout-review-texts, used only by data-validation
        # / e2e-tests / visual-regression — so the parity test hit its
        # corpus-missing branch and t.skip()'d on every run while reporting green.
        # Re-running the same file HERE, after checkout-review-texts, is what makes
        # the parity claim real; REQUIRE_REVIEW_CORPUS=1 turns a missing corpus into
        # a hard failure so a silently-broken checkout can never restore the skip.
        # Layers 1-2 re-run cheaply (~ms); the corpus layer is the ~8s cost.
        if: always()
        env:
          REQUIRE_REVIEW_CORPUS: '1'
        run: node --test scripts/lib/review-guards.explain.test.mjs

      - name: Run autoclear-vs-ensemble corpus test (needs review-texts)
        # #1146/#1156: an auto-clear path (allowEarlyDate/allowCrossMarket
        # bypass, UK-URL/registry-region heuristic) must never silently
        # override a unanimous LLM-ensemble content rejection. Same
        # corpus-presence contract as the parity test above —
        # REQUIRE_REVIEW_CORPUS=1 turns a missing checkout into a hard
        # failure instead of a silent skip.
        if: always()
        env:
          REQUIRE_REVIEW_CORPUS: '1'
        run: node --test scripts/lib/autoclear-vs-ensemble.test.mjs

      - name: Autoclear-vs-ensemble audit (strict)
        # Standalone re-runnable audit alongside the corpus test above —
        # same defect class, gate reports the violating files directly
        # (scripts/audit-autoclear-vs-ensemble.js --fix restores them).
        if: always()
        run: node scripts/audit-autoclear-vs-ensemble.js --strict

      - name: Audit sibling-title misroute (strict)
        # Task #1608: classifyMarketRouting() (scripts/lib/market-routing.js)
        # prevents a same-title-sibling review (a regional/pre-Broadway run vs
        # its Broadway transfer, linked via transferOf/transferredTo) landing
        # under the wrong one of the pair — but only at WRITE time. Nothing
        # ever re-checked already-written review-texts files against it until
        # this audit. Found 2026-08-14:
        # two-strangers-carry-a-cake-across-new-york-at-art-regional-2025
        # carried 4 live reviews that were actually about its Broadway
        # transfer, dated from before firstSeenAt stamping existed.
        #
        # --strict fails on a hit NOT in the frozen baseline
        # (data/audit/sibling-title-misroute-baseline.json), not on a raw
        # count — a plain --max ceiling would (a) mask a genuinely new
        # misroute the same run one of the baseline's known FPs gets hand-
        # fixed (count stays flat), and (b) give zero headroom for
        # classifyMarketRouting's own documented heuristic disagreements to
        # flap CI on an unrelated push. See the script's own header comment
        # for the full rationale (mirrors audit-direct-provider-calls.js's
        # baseline-file pattern). Baseline currently holds 4 known,
        # deliberately-unfixed Tier-1 false positives (Notion 3bd637c5-416f-
        # 8168) — mamma-mia-west-end-2021, oh-mary-2024,
        # stranger-things-the-first-shadow-west-end-2023,
        # titanique-west-end-2024. Update via
        # `node scripts/audit-sibling-title-misroute.js --update-baseline`
        # only after hand-verifying a new hit is a genuine FP, never to make
        # a red build pass.
        if: always()
        run: node scripts/audit-sibling-title-misroute.js --strict

      - name: Run aggregator-domain TLD parity corpus scan (needs review-texts)
        # Same corpus-missing trap as explainExclusion above: the scripts/lib/*.test.mjs
        # glob runs in the unit-tests job, which never checks out data/review-texts, so
        # this file's live-corpus layer (Part 2) always t.skip()'d there — the only
        # thing CI ever actually verified was the static snapshot table (Part 1), not a
        # real fence against a NEW aggregator TLD drift (task #1194 ship-check finding).
        # Re-running it HERE with REQUIRE_REVIEW_CORPUS=1 makes the live scan real.
        if: always()
        env:
          REQUIRE_REVIEW_CORPUS: '1'
        run: node --test scripts/lib/aggregator-domain-tld-parity.test.mjs

      - name: Run wrongShow auto-clear ensemble corpus scan (needs review-texts)
        # Same corpus-missing trap as explainExclusion above, same fix: the
        # scripts/lib/*.test.mjs glob in the unit-tests job never has
        # data/review-texts, so this file's corpus test always t.skip()'d
        # there. Re-run it HERE (after checkout-review-texts) with
        # REQUIRE_REVIEW_CORPUS=1 so the task #1146 acceptance scan
        # (rejectionReason=wrong_show + wrongShowAutoCleared + wrongShow!==true
        # must be 0) is a real assertion, not a silent no-op. ship-check
        # finding, task #1146.
        if: always()
        env:
          REQUIRE_REVIEW_CORPUS: '1'
        run: node --test scripts/lib/wrongshow-autoclear-ensemble.test.mjs

      - name: Run data validation
        if: always()
        run: node scripts/validate-data.js

      - name: Audit duplicate shows
        if: always()
        # Whole-corpus duplicate-SHOW detector — the discovery-time guard only
        # fires at add-time and missed the Much Ado 2026 dup (Shakespeare's Globe
        # vs "Globe Theatre", opening dates 2 days apart). Non-blocking for now
        # (surfaces clusters + writes data/audit/duplicate-shows.json); promote to
        # `--gate` once the existing clusters are merged. Notion 38a637c5-416f-81a7.
        continue-on-error: true
        run: node scripts/audit-duplicate-shows.js

      - name: Audit cast-changes.json
        if: always()
        # Catches the bugs surfaced 2026-05-23 in the casting newsletter:
        # per-actor "Production closes" departures masquerading as voluntary
        # exits, closure events contradicted by later arrivals, ended absences
        # still rendered as upcoming, and stale [AUTO-FLAGGED] unverified
        # entries. The scraper has been hardened to emit `closure` events
        # directly; this gate keeps the data shape honest going forward.
        #
        # --gate (not --strict) as of 2026-06-29: --strict blocks on ANY issue,
        # but almost all kinds are routine churn that this script's own --write
        # (run on schedule) auto-heals — blocking on a handful reddened the trunk
        # for non-code reasons between --write passes. --gate blocks only on a
        # cross-show conflict (actor in two shows at once, never auto-fixed) or a
        # mass churn spike past the floor (scraper regression). Decision + tests:
        # scripts/lib/cast-changes-gate.{js,test.mjs}. Full --strict triage runs
        # daily in check-corpus-drift.yml (→ digest).
        run: node scripts/audit-cast-changes.js --gate

      - name: Audit review contamination
        if: always()
        run: node scripts/audit-review-contamination.js --gate
        # Catches cross-market contamination (WE/OB reviews in BW folders),
        # domain/outlet mismatches, unflagged roundup pages, and junk --unknown files.
        # Added 2026-04-11 after Oh Mary! BW audit found 18 issues in one folder,
        # systematic scan found 291 across all shows.
        #
        # --gate (not --strict) as of 2026-06-28: review-texts live in a SEPARATE
        # private repo that data bots mutate every ~2min, so --strict (block on ANY
        # strict-class hit) reddened the trunk for every UNRELATED code push whenever
        # a single pre-existing/parallel C/E/F file existed (china-doll FT/Guardian).
        # --gate blocks only on a genuine integrity catastrophe — a cross-market leak
        # (class A) or a mass spike past the floor — and surfaces single-file drift
        # without blocking. Same split as audit-text-quality --gate / check-corpus-drift.
        # The FULL --strict triage runs daily in check-corpus-drift.yml (the
        # review-contamination audit), surfaced non-blocking in the digest. Decision
        # logic + tests: scripts/lib/contamination-gate.{js,test.mjs}.

      - name: Audit flag-vs-CV contradictions
        if: always()
        continue-on-error: true
        run: node scripts/audit-cv-flag-contradiction.js --window=30
        # Standing check for the signal #651's pipeline-health audit found by
        # hand (Notion 3ad637c5): an exclusion flag (wrongProduction/wrongShow/
        # isRoundupArticle) sitting on a file whose own most recent full-text
        # contentVerification pass affirms it (isValid, high confidence, >300
        # words) — bait for a human look, not proof of a false positive.
        #
        # Informational only (no --gate) as of 2026-07-30 (#676): baseline is
        # ~29 hits on the 30-day window, well above --threshold=4's default, so
        # gating now would red the trunk immediately. The companion triage card
        # (#675) is draining the backlog; once the real count is under 4, drop
        # `continue-on-error: true` and add `--gate` to make this blocking, per
        # #676's acceptance criteria. Script + threshold: scripts/audit-cv-flag-
        # contradiction.js; detector: scripts/lib/flag-contradiction.js.

      - name: Audit self-contradictory clear breadcrumbs
        if: always()
        run: node scripts/audit-self-contradictory-clears.js --gate --baseline
        # A review file asserting an exclusion flag AND its own retraction
        # breadcrumb at the same time (wrongProduction + wrongProductionAutoCleared,
        # wrongShow + a contentVerificationPromoted stamp its own CV now refutes,
        # wrongAttribution + crossOutletVerified). Unlike the flag-vs-CV step above
        # this needs no adjudication between two verdicts — the record is invalid
        # on its face.
        #
        # BAND AROUND A COMMITTED BASELINE, not an absolute ceiling
        # (data/audit/self-contradictory-clears-baseline.json).
        #
        # This step used to be `--gate --max=780` against a live count of
        # ~772-776. The rebuild bots rewrite this corpus every ~30 min, so the
        # SAME code failed at 20:27 and 20:31 and passed at 20:33 and 20:37 — a
        # ceiling four records above the live count is a coin flip
        # (memory/feedback_test_yml_data_gates_flap_and_shortcircuit.md).
        #
        # The old comment here prescribed "DRAIN THEN RATCHET" (run --fix, then
        # lower --max). That was measured on 2026-08-14 and is UNSAFE, so it has
        # been removed rather than left as standing advice. --fix deletes the
        # clear breadcrumb but leaves the exclusion flag standing, and
        # content-quality.js classifies `wrongProduction && !wrongProduction
        # AutoCleared` as contentTier 'invalid' — so the "drain" EXCLUDES
        # reviews: 563 of 772 records flip valid -> invalid, 438 of them carrying
        # a live score signal (NYT, WSJ, The Stage, FT among them), and 0 become
        # newly included. That is the same failure mode as the deleted
        # audit-stale-flag-after-url-correction.js --fix remediation, in reverse.
        #
        # So the backlog is STRUCTURAL. The gate now asks "is this materially
        # worse than the number we last agreed to?" — every run prints the delta,
        # a real new contradiction writer still fails the build once it exceeds
        # the tolerance, and one bot write no longer reddens main. Re-record with
        # --record-baseline ONLY to capture a genuine improvement, never to make
        # a red build pass. Pairs: scripts/lib/flag-contradiction.js SELF_CLEAR_PAIRS.

      # ── RETIRED 2026-08-14: "Audit stale flag after URL correction" (#483) ──
      #
      # There is no step here any more, on purpose. Do not re-add one that runs
      # scripts/audit-stale-flag-after-url-correction.js: it is a MEASUREMENT
      # result, not a policy preference, and the replacement gate below covers
      # the class this one was meant to cover.
      #
      # WHAT IT WAS FOR. July 2026: ~112 corpus files where a wrongProduction /
      # wrongShow flag wrongly SURVIVED a URL correction, because
      # maybeUpgradeUrl wiped the body without firing the flag-clearing
      # invariant when the "upgraded" url normalized equal to the old one.
      # That producer-side defect is CLOSED at the source in 535f3287189
      # (scripts/lib/review-normalization.js maybeUpgradeUrl now calls
      # applyUrlChangeInvariant(..., {force: true})), with the mergeReviews
      # follow-ups #1478/#1486 and the url-downgrade guard (#1416) behind it.
      #
      # WHY THE DETECTOR CANNOT BE KEPT. Its rule was "`_urlChangedClear`
      # breadcrumb present AND no fullText ⇒ the flag is stale". Measured
      # against the live corpus on 2026-08-14, that rule is wrong in BOTH
      # directions:
      #   - PRECISION 0/120. Two independent hand adjudications (20/20 and 8/8
      #     sampled) plus a full eyeball of all matches found EVERY sampled
      #     flag CORRECT and none stale. The reason is structural: a URL
      #     "correction" routinely swaps a correct url for a DIFFERENT
      #     production's, after which the guards re-flag the record — so on
      #     these files wrongProductionDetectedAt POST-DATES
      #     _urlChangedClear.at. The flag is a fresh correct verdict about the
      #     new url, not a leftover from the old one.
      #   - RECALL 0/13. Of the genuinely stale flags in the corpus (the
      #     matches of the gate below, all hand-verified), ZERO carry an
      #     `_urlChangedClear` breadcrumb. The two populations do not intersect
      #     at all, so no narrowing of this signature can reach the real class.
      # Acting on the old reading is actively harmful: draining 121 files on
      # 2026-08-14 immediately reddened two other CI gates (59
      # [wrong-production-by-date] errors, 5 class-A cross-market leaks) and
      # was self-reverted. 17 of its matches carry aggregatorStars and score
      # WITHOUT fullText, so clearing their flags puts wrong-production reviews
      # straight into live Critic Scores.
      #
      # WHAT STAYS. scripts/lib/stale-flag-after-url-correction.js is UNCHANGED
      # and still required: rebuild-all-reviews.js, flag-wrong-production-by-
      # date.js and audit-cross-show-url-collisions.js call
      # isAwaitingUrlCorrectionRefetch / shouldWithholdStaleExclusionFlag to
      # skip re-flagging a record mid-URL-correction, and
      # scripts/audit-stale-flag-producers.js still uses the signature for
      # WRITER ATTRIBUTION (which code path produced a flag), which is what it
      # is actually good for. Its colocated test still runs in the
      # scripts/lib/*.test.mjs batch. The audit CLI is kept as a manual
      # investigative tool; it is simply not wired to CI.
      #
      # SUPPORTING CORPUS NUMBERS from the same measurement, kept so nobody has
      # to re-derive them: 87/115 matches listed `publishDate` in
      # `_urlChangedClear.cleared` (the old date was already deleted, so no
      # stale date was left to mislead a guard); 69/115 had `textFetchedAt`
      # LATER than `_urlChangedClear.at` (already refetched — nothing was
      # "awaiting" anything); 72/115 had a word count > 0; ~29/115 were flagged
      # by guards that never read publishDate at all (cross-market,
      # CV-promotion, URL-collision, dedup, OB supersede).
      #
      # NARROWINGS THAT WERE TRIED AND REVIEW-REJECTED on 2026-08-14 (verdicts
      # in .claude/review-verdicts.jsonl) — do not re-attempt these:
      #   - `textFetchedAt <= _urlChangedClear.at`: textFetchedAt is itself in
      #     URL_DERIVED_FIELDS (url-change-invariant.js), so it is cleared by
      #     the very write that creates the breadcrumb (411/609 breadcrumbs
      #     list it in `cleared`).
      #   - "require publishDate to have SURVIVED the clear": inverts on the
      #     Dateless-revival guard, whose basis IS the absence of a date, and
      #     matched 47/59 known-correct flags.
      # The replacement gate below is NOT one of these: it does not read the
      # breadcrumb at all, it requires a date the record itself no longer
      # carries PLUS an in-run-window current date, and it stays silent on any
      # flag whose basis mentions content, market, a collision or a missing
      # date — including the Dateless-revival guard.
      #
      # IF THE CLASS EVER RETURNS: the tell is a record whose
      # wrongProductionDetectedAt PRE-DATES its `_urlChangedClear.at` (flag
      # survived the clear) rather than post-dating it — 23 of 166 flagged
      # records had that ordering on 2026-08-14, and none of them survived hand
      # adjudication as stale. Reach for scripts/audit-stale-flag-producers.js
      # to name the writer, and fix the writer; the remedy for a RECORD is a
      # refetch, never a bulk flag-clear.

      - name: Audit contradicted flag basis (stale exclusion flags)
        if: always()
        run: node scripts/audit-contradicted-flag-basis.js --gate --max=16
        # BLOCKING replacement for the retired #483 step above. Fires only on
        # POSITIVE evidence that a flag's own stated basis is contradicted: the
        # flag rests ONLY on a date-guard claim, that claim cites a date the
        # record no longer carries, and the record's CURRENT publishDate sits
        # inside the show's own run window. Detector (with the full derivation):
        # scripts/lib/contradicted-flag-basis.js.
        #
        # PRECISION 13/13, hand-verified 2026-08-14 — every match is a real
        # review of the show it is filed under, suppressed from live Critic
        # Scores on a date it no longer has. Examples: the Vulture review of
        # the 2018 Carousel (vulture.com/2018/04/…, dated 2018-04-12, inside
        # the 2018-02-28..2018-09-16 run) flagged on a cited date of
        # 2019-04-24; the Deadline 2017 Miss Saigon revival review dated
        # 2017-03-23 flagged on a cited date of 1974-04-08; Jesse Green's NYT
        # review of Home 2024 flagged on 2024-12-19.
        #
        # --max=16 against a live count of 13 is deliberate headroom, the same
        # ratchet the sibling data gates use: the rebuild bots rewrite this
        # corpus every ~30 min, and a ceiling equal to the live count makes the
        # SAME code pass and fail minutes apart
        # (memory/feedback_test_yml_push_path_allowlist.md). RATCHET IT DOWN as
        # the 13 known records are hand-adjudicated — but never raise it to
        # make a red build pass, and never clear a flag in bulk to reach a
        # lower number. There is no --fix on the audit for exactly that reason.

      - name: Audit URL-swap regression (#1416)
        if: always()
        run: node scripts/audit-url-downgrade.js --gate
        # #1416: maybeUpgradeUrl() swapped a review's correct current-run url
        # for a URL belonging to a PRIOR production of the same revived show
        # (Equus 2026->2019 Stratford East, Romeo and Juliet 2026->2023
        # Almeida, Cats: The Jellicle Ball 2026->2024, NYSR, Mexodus — 8/8
        # corpus-verified true positives). Fixed going forward by
        # scripts/lib/url-downgrade-guard.js (wired into maybeUpgradeUrl),
        # which refuses a swap whose candidate url is dated outside the
        # show's current-run window. This gate is the historical-damage
        # sweep: it only fails on a LIVE match (a regressed url with NO
        # wrongProduction/wrongShow flag — a real live-scoring exposure,
        # e.g. a scoreable-via-aggregatorStars file with no fullText).
        # Files where the swap corrupted the url but wrongProduction is
        # already correctly true are reported, not gated — the #483 drain
        # (audit-stale-flag-after-url-correction.js --fix) must never clear
        # those; that misreading is the defect this card exists to stop.

      - name: Audit cast contamination
        if: always()
        run: node scripts/audit-cast-contamination.js --gate
        # Catches wrong-show cast scrapes (Met Opera singers as Kavalier-Clay
        # cast, TV-show titles as character roles, LASTNAME-FIRSTNAME name
        # swaps, source URLs that don't match the target show). Audit lives
        # in lockstep with the backfill-cast-web.js guards via shared
        # scripts/lib/cast-extraction-guards.js. Added 2026-05-23 after
        # a one-time backfill (2026-03-03) wrote 12 contaminated cast files
        # that stayed hidden behind the orphan-cast manifest skip until
        # surveyed during /cast/[slug] work.
        # `if: always()` so this gate runs independently of the review-
        # contamination step above — different concerns, shouldn't share
        # a fail-fast.
        #
        # --gate (not bare) as of 2026-06-30: data/cast/ is bot-mutated, so
        # blocking on ANY flagged file flapped the trunk on pre-existing files.
        # --gate blocks only on the wrong-show class (fail) via the pure
        # scripts/lib/cast-contamination-gate.{js,test.mjs}; soft heuristics
        # (SRC_URL_NO_TITLE / SHOW_NOT_IN_DB) and the full report run daily and
        # non-blocking in check-corpus-drift.yml → digest.

      - name: Audit commercial contamination
        if: always()
        run: node scripts/audit-commercial-contamination.js --gate
        # --gate (2026-06-30): blocks only on the impossible/contradictory FAIL
        # class (weekly>cap, recoupment contradiction, cap/weekly outlier) via the
        # pure scripts/lib/commercial-contamination-gate.{js,test.mjs}. Warns
        # (forthcoming-show keys, category mismatch) + the full --strict run land
        # daily and non-blocking in check-corpus-drift.yml → digest.
        # Same SERP->LLM wrong-source class as cast contamination, applied
        # to data/commercial.json (scripts/update-commercial-data.js feeds
        # Reddit/trade-press text to Claude Sonnet). Hard-fails on
        # impossible physics (weeklyRunningCost > capitalization), recouped
        # vs designation contradictions, and capitalization/weekly outliers
        # outside plausible Broadway ranges. Warns on shorthand keys not
        # resolvable to shows.json (forthcoming-show case) and on
        # musical/play modelCategory disagreement.
        # Added 2026-05-24 alongside audience-buzz + critic-consensus
        # audits per Notion 36a637c5-416f-81b7-a72b-f7e0dfbb24fc.

      - name: Audit non-review content (weather/sports/junk pages)
        if: always()
        run: node scripts/audit-non-reviews.js --gate
        # Hard-fails if any SCORED review is a definitive wrong-page newspaper
        # OCR (weather page, sports scoreboard) or junk scrape. Added after an
        # LA Times weather page shipped scored 88 and a Chicago Tribune sports
        # page scored 72 (both full-page OCR of the wrong article). Only the
        # `definitive` page-type classes gate (0 FPs across 34k scored reviews);
        # soft heuristics (obituary/preview) stay advisory in audit-review-quality.yml.
        # Shared classifier: scripts/lib/non-review-patterns.js (also gates the
        # newspapers.com extractor at save time).
        #
        # --gate (not --strict) as of 2026-06-29: the block/pass decision is now the
        # pure scripts/lib/non-review-gate.{js,test.mjs} (definitive wrong-page is
        # zero-tolerance, floor 0) so it is unit-tested independently of the corpus
        # scan, matching the other gated audits. The full --strict definitive check
        # also runs daily in check-corpus-drift.yml as a non-blocking backstop.

      - name: Audit audience-buzz contamination
        if: always()
        run: node scripts/audit-audience-buzz-contamination.js --gate
        # scripts/scrape-reddit-sentiment.js can land on wrong-show Reddit
        # threads for generic titles ('Six', 'It', 'Pride'). REDDIT_SCORE_DIVERGENCE
        # fires when reddit.score diverges >=40pts from the median of >=2 other
        # credible (reviewCount>=10) audience sources.
        #
        # --gate (2026-06-30): a single 40-pt divergence is NOT zero-FP — it is as
        # plausibly a genuine audience/critic split as a misroute, and it reddened
        # main on glengarry-glen-ross-west-end-2026 (run f8abff972). So the gate
        # blocks only on a SPIKE (scraper regression: many titles misrouted at
        # once) via the pure scripts/lib/audience-buzz-contamination-gate.{js,
        # test.mjs}. The single divergence + all warns (broadwayCom URL token,
        # platform divergence, volume inflation) run daily and non-blocking in
        # check-corpus-drift.yml → digest, where a human triages each one.

      - name: Audit critic-consensus contamination
        if: always()
        run: node scripts/audit-critic-consensus-contamination.js --gate
        # scripts/generate-critic-consensus.js summaries are generated
        # against OUR reviews.json, so wrong-source contamination is lower
        # risk; the stronger signal is staleness drift — consensus written
        # when N reviews existed but reviews.json now has N+10+ reviews
        # with a meaningfully different mean.
        #
        # --gate (2026-06-30): blocks only on the structural-orphan class
        # (SHOW_NOT_IN_DB) via the pure scripts/lib/critic-consensus-contamination-
        # gate.{js,test.mjs}. The reviewCount/meanScore staleness signals fire BY
        # DESIGN on opening nights and self-heal on the next update-critic-consensus
        # regen, so hard-blocking them would red the trunk at the worst moment —
        # they ride the full --strict run in check-corpus-drift.yml → digest.

      - name: Audit aggregator-archive integrity
        run: node scripts/audit-aggregator-archive-integrity.js --strict
        continue-on-error: true
        # Catches the Stuart King contamination class — cached aggregator HTML
        # whose <title> doesn't match the showId in the filename. The bug
        # silently mis-attributed reviews across ~14 LBO archives + 256 across
        # other sources before being caught by a critic email (2026-04-25).
        # Baseline: data/audit/aggregator-archive-integrity-baseline.json
        # (currently empty; CI sees ~283 historical bad archives in the private-repo
        # data set that need triaging before --strict can be enforced).
        # Currently NON-BLOCKING (continue-on-error) until baseline reflects the
        # private-repo state. Tracked in Notion 34e637c5-416f-812c follow-up.

      - name: Validate market expansion
        if: always()
        run: node scripts/validate-market-expansion.js
        # Catches slug, threshold, display, and copy issues for WE/OB markets

      - name: Validate archive productions
        run: node scripts/validate-archive-productions.js
        continue-on-error: true  # Don't fail build, just warn - archives need manual refetch

      - name: Test star rating extractors
        if: always()
        run: node tests/star-rating-extractors.test.js
        # Verifies all outlet-specific star extractors against saved HTML fixtures

      # Corpus-statistics audits MOVED to check-corpus-drift.yml (2026-06-21).
      # `validate-aggregator-truth.js` (count ratios) and `audit-text-quality.js`
      # (tight % bands) flap as the rebuild bots drift the corpus every ~30 min,
      # so they reddened main for non-code reasons. They now run non-blocking in
      # the drift workflow and surface in the daily digest via health-check.js
      # ("Quality: corpus drift"). What STAYS here is the catastrophe FLOOR
      # below — wide bands that only trip on a genuine quality collapse the
      # row-count floors (500 shows / 15k reviews) structurally can't catch.
      - name: Audit text quality — catastrophe floor (blocking)
        if: always()
        run: node scripts/audit-text-quality.js --gate
        # GATE band: <10% full OR >85% truncated OR >25% unknown. ~5x looser than
        # the MONITOR band in check-corpus-drift.yml, so normal drift never reds
        # the trunk — only a scraper flooding the corpus with truncated/unknown
        # bodies (e.g. a cookie-expiry) trips it. That's a real ship-blocker.

      - name: Audit critic-outlet affinities
        run: node scripts/audit-critic-outlets.js --report-only
        continue-on-error: true  # Informational only

      - name: Audit WE sweep verifier wiring
        if: always()
        # S3-T5 — asserts every extractor call in sweep-we-aggregators.js is
        # preceded by a verifyPage/verifyAggregatorUrl call in the same fn
        # body. Stops the Stage Cuckoo-trap from re-entering after a
        # well-meaning refactor accidentally removes a gate.
        run: node scripts/audit-verifier-wiring.js

      - name: Audit outlet-registry gaps
        run: node scripts/audit-outlet-registry.js --report-only
        continue-on-error: true  # Informational only — exit 0 even with missing outlets.
        # Surfaces unregistered outletIds + display-name + normalization mismatches.
        # Wired as warning so the 53+ pre-existing missing outlets don't block merges
        # while we work through the backlog. Promote to failure once count is <5.

      - name: Validate mobile-shows.json integrity
        if: always()
        run: node scripts/validate-mobile-shows.js
        # Catches stale build artifacts from worktree merges:
        # closed shows without scores should be filtered out by generate-mobile-data.js

      - name: Audit circular duplicateOf pairs
        if: always()
        run: node scripts/fix-circular-duplicate-pairs.js --gate
        # Fails when A.duplicateOf=B AND B.duplicateOf=A (a 2-cycle). The rebuild's
        # BUG-F recovery over-serves these — double-counting a critic in prod when
        # the pair's text differs, distorting composite scores (52 pairs, incl.
        # and-juliet/buena-vista/chess, 2026-07-11). Write-time prevention lives in
        # review-write-guard.js (wouldFormDuplicateCycle refuses to form the cycle);
        # this gate + fix-circular-duplicate-pairs.yml (daily --fix self-heal) catch
        # anything that bypassed it. --gate is a floor (blocks only on a spike) so
        # single-pair private-repo drift can't red an unrelated code push, matching
        # the stale-flag gate below. Run --fix locally to repair.

      - name: Audit same-URL byline double-counts
        if: always()
        run: node scripts/dedupe-same-url-bylines.js --gate
        # Fails when one article is scraped under multiple DIFFERENT real critic
        # bylines at the same URL with different fingerprints — the rebuild treats
        # these as a legit "multi-critic page" and double-counts the review in the
        # composite (e.g. all-the-way-2014 NYT Brantley + Isherwood on the same
        # article, 2026-07-12). Only cohesive (same-article) groups the rebuild's
        # own fingerprint/fuzzy dedup MISSES are flagged; genuinely-different
        # reviews at one URL are reported to data/audit, never collapsed. --gate
        # is a floor (spike-only) matching the duplicateOf gate family; write-time
        # prevention is review-write-guard's URL-collision detector, daily heal is
        # dedupe-same-url-bylines.yml. Run --fix locally to repair.

      - name: Audit stale duplicateOf flags
        if: always()
        run: node scripts/audit-duplicate-of-url-mismatch.js --gate
        # Fails when A.duplicateOf=B but their URLs differ. Catches the Sommers
        # case (2026-05-24) where a transient URL correction left a stale dupe
        # flag suppressing a legitimate T2 review. Self-heal at write time is
        # implemented in review-write-guard.js; this gate catches anything that
        # bypassed it (e.g., scripts writing JSON directly). Run with --fix
        # locally to clear stale flags. See memory/feedback_duplicate_of_url_mismatch.md.
        #
        # --gate (not report mode) as of 2026-06-29: EVERY mismatch is auto-healable
        # by clear-stale-duplicate-of.yml --fix, so a sub-floor count (the 4-BWW
        # sinatra case, run 28388064370) reddened the trunk for unrelated pushes
        # before the self-heal cleared it. --gate blocks only on a mass spike past
        # FIX_SURGE_THRESHOLD (producer regression — auto-clearing would flood
        # scoring). Decision + tests: scripts/lib/duplicate-of-gate.{js,test.mjs}.
        # Full report-mode triage runs daily in check-corpus-drift.yml (→ digest).

      - name: Audit orphan slim show files
        if: always()
        run: node scripts/audit-orphan-show-ids.js
        # Fails when public/data/shows/{id}.json exists for an id that isn't
        # in shows.json. Catches drift after show renames (Can I Be Frank,
        # 2026-05-24). Also reports show-score / audience-buzz key drift as
        # advisory (use --strict to also fail on those). Run with --fix locally
        # to delete orphan slim files. See memory/feedback_orphan_slim_show_files.md.

      - name: Validate provisional show venue+dates against Playbill
        # Cross-checks every provisional:true (or manual-user-request /
        # venue-page) entry in shows.json against its Playbill production page.
        # Catches the class of bug surfaced 2026-05-26 where OB venue-page
        # scrapers wrote stub entries with wrong years (Sunset Baby 2014
        # confused with the 2024 Signature revival; multiple Signature past-
        # productions captured with publication-year as opening-year).
        #
        # Behavior here is STRICT — flipped from advisory 2026-05-27 after the
        # 6 mismatches surfaced in data/audit/venue-date-mismatches.json were
        # remediated (sunset-baby, three-houses, grangeville, eurydice,
        # oratorio-for-living-things, shit-meet-fan). The job writes the audit
        # file via the script and exits non-zero when any provisional entry
        # mismatches its Playbill production page. Fix locally by editing
        # shows.json to match Playbill (the authoritative source per
        # CLAUDE.md §3) before pushing.
        #
        # Skips silently when SERP/scrape secrets are absent (Dependabot,
        # forks). The cron freshness job catches drift outside this window.
        # `always()` keeps this gate independent of upstream audit failures
        # (cast-changes, regex FP rate, etc.) since they cover different
        # concerns and shouldn't share a fail-fast.
        if: always() && env.HAS_SCRAPE_SECRETS == 'true'
        env:
          HAS_SCRAPE_SECRETS: ${{ (secrets.SCRAPINGBEE_API_KEY != '' && secrets.BRIGHTDATA_TOKEN != '') && 'true' || 'false' }}
          SCRAPINGBEE_API_KEY: ${{ secrets.SCRAPINGBEE_API_KEY }}
          BRIGHTDATA_TOKEN: ${{ secrets.BRIGHTDATA_TOKEN }}
          BRIGHTDATA_ZONE: ${{ secrets.BRIGHTDATA_ZONE }}
        run: node scripts/validate-show-venue.js --all-provisional --fail-on-mismatch

      # `audit-regex-patterns.js --full` MOVED to check-corpus-drift.yml
      # (2026-06-21). Its per-pattern FP counts drift as the corpus grows hourly
      # (a new "recipe for disaster" metaphor nudges a pattern over baseline),
      # so it flapped main red for non-code reasons. Now non-blocking in the
      # drift workflow + surfaced in the digest. Content-quality REGEX EDITS are
      # still gated: CLAUDE.md §12.8 requires `audit-regex-patterns.js --full`
      # to be run before pushing pattern-array changes (the real-FP guard for
      # the edit itself, which is the case that actually matters).

      - name: Audit — latent aggregator-URL population must not grow
        # Runs HERE, not in Lint Workflows, because it needs the review-texts
        # corpus and only this job checks it out.
        #
        # On 2026-08-04 main went red with nobody having pushed a bad file.
        # witness-for-the-prosecution-west-end-2022/artsdesk--unknown.json had
        # stored the stagedoor.com LISTING url under outletId 'artsdesk' for
        # months — the zero-tolerance aggregator_url_mismatch error checked by
        # the step below, which never saw it: the validator skips every review
        # carrying an exclusion flag, and that file was flagged wrongProduction.
        # Task #1017's sweep auto-cleared the flag, the file joined the
        # validated population, and a months-old defect became a trunk failure
        # with no human in the loop. A corpus scan found 10 MORE files in
        # exactly that state — 10 unexploded copies of the same incident.
        # This step ratchets that latent population: it may shrink, never grow.
        # Growth means a producer just wrote an aggregator listing URL under a
        # real outletId — fix the producer, not the ceiling.
        #
        # if: always() so a preceding data gate failing does not mask it (the
        # first-failure-masks-the-rest pattern this job has been bitten by).
        if: always()
        run: node scripts/audit-aggregator-url-latent.js

      - name: Validate review-text files
        if: always()
        run: |
          echo "Validating individual review-text files..."
          node scripts/validate-review-texts.js --gate
        # Validates review-text file structure:
        # - Required fields (showId, outletId or outlet) — ERROR
        # - Duplicate reviews (same outlet+critic in same show) — ERROR
        # - Unknown outlets (not in outlet-registry.json) — WARNING
        # - Garbage critic names (photo credit, staff, unknown) — WARNING
        #
        # --gate (not default exit-1-on-any-error) as of 2026-06-29: review-texts
        # live in a SEPARATE private repo bots mutate every ~2min, so the default
        # reddened the trunk for unrelated pushes whenever a single duplicate-churn
        # file existed before the dedup workflows cleared it. --gate blocks only on
        # catastrophic classes — corrupt JSON (the committed conflict-marker class,
        # commit 09e78a7a, now also blocked pre-push by conflict-markers.js in
        # push-with-retry.sh), aggregator contamination, broken duplicate refs,
        # missing required fields — and tolerates auto-healable duplicate churn up to
        # a floor. Decision + tests: scripts/lib/review-texts-gate.{js,test.mjs}.
        # Full validator runs daily in check-corpus-drift.yml (→ digest).

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: 'Test Suite Failed'
          discord_webhook: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}

      - name: Create issue on failure
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const title = '🚨 Daily Data Validation Failed';
            const body = `## Data Validation Failed

            The daily data validation check found issues that need attention.

            **Run:** [${context.runId}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})
            **Time:** ${new Date().toISOString()}

            Please check the workflow logs for details.

            ---
            *This issue was automatically created by the test workflow.*`;

            // Check if similar issue already exists
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'automated,bug'
            });

            const existingIssue = issues.data.find(i => i.title === title);
            if (!existingIssue) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['automated', 'bug', 'data']
              });
            }

      - name: Record pipeline success
        if: success()
        run: |
          mkdir -p data/audit/pipeline-health
          date -u > data/audit/pipeline-health/test.last-success
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/audit/pipeline-health/
          # Was a single `A || B && C || echo warning` chain. Two problems:
          #   1. Precedence — `(A || B) && C` ran push-with-retry.sh even when
          #      there was nothing staged to commit.
          #   2. A total push failure (push-with-retry.sh exits 1 after
          #      MAX_RETRIES) was swallowed into a ::warning:: and the step still
          #      reported success. Observed on green runs 31850823598 and
          #      31852747324: "All push attempts failed after 7 attempts", step
          #      green. That is exactly when it matters — the marker written here
          #      is what health-check.js's "Pipeline: test" staleness check reads
          #      for the daily digest, so a persistently failing push makes the
          #      digest report a stale test pipeline while CI is in fact green.
          # Still deliberately NON-FATAL (explicit `exit 0`): losing a single race
          # against a busy main must not redden a green run. The failure is made
          # observable instead — an ::error:: annotation plus a job-summary entry,
          # which surface on the run page rather than at line ~N of the log — and
          # the durable cross-run signal is the marker's own staleness, which
          # health-check.js already reports daily (hint added there names this
          # step as a cause so a stale marker isn't misread as "test never ran").
          if git diff --staged --quiet; then
            echo "No pipeline-health change to record"
            exit 0
          fi
          git commit -q -m "health: Record test success"
          if bash scripts/lib/push-with-retry.sh; then
            exit 0
          fi
          MSG="Health recording push failed — data/audit/pipeline-health/test.last-success was NOT updated. CI is green but the marker is now stale; if this repeats for >48h the daily health digest will report 'Pipeline: test' as stale. Check run ${GITHUB_RUN_ID} for the push-with-retry.sh output."
          echo "::error title=Health recording push failed::${MSG}"
          {
            echo "### :warning: Health recording push failed"
            echo ""
            echo "${MSG}"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      # Own step, NOT folded into "Record pipeline success" (if: success()) —
      # this job's data-validation `--gate` audits redden main routinely (see
      # comments above), and folding ledger telemetry into a success()-gated
      # step would silently drop it on every one of those routine failures.
      # This step is unconditional (if: always()) so SERP-spend rows from
      # this job's url-discovery.js calls are never lost to a validation
      # gate failure. BRO-163.
      - name: Commit scraper-spend ledger
        if: always()
        continue-on-error: true
        uses: ./.github/actions/commit-scraper-spend-ledger
        with:
          workflow-name: test-data-validation

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    # Skip on Dependabot PRs — see unit-tests above.
    if: github.actor != 'dependabot[bot]' && github.event.inputs.test_type != 'data-only' && github.event.inputs.test_type != 'visual-only'
    steps:
      - name: Checkout
        uses: actions/checkout@v5



      - name: Checkout core data
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
      - name: Checkout review-texts (private repo)
        uses: ./.github/actions/checkout-review-texts
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Playwright
        uses: ./.github/actions/setup-playwright

      - name: Run unit tests
        run: |
          # Run all unit tests with tsx (provides TypeScript import support)
          # Exclude ensemble.test.mjs (pre-existing ts-node compilation issue with scripts/tsconfig.json)
          #
          # File list lives in tests/e2e-unit-test-manifest.txt, sorted, one path
          # per line (task #791 — same merge-conflict-reduction pattern as
          # tests/unit-test-manifest*.txt from task #763). mapfile + array-length
          # guard instead of $(cat ...): `npx tsx --test` with zero file args does
          # NOT fail, it silently falls back to its own default discovery glob.
          #
          # --test-timeout 300000 (added 2026-08-14). This 1,424-test batch was
          # the last invocation in the file with NO per-test ceiling, and this
          # job carries no timeout-minutes either, so its default is GitHub's
          # 360-minute job cap: a single wedged test here hangs for up to six
          # hours and concludes `cancelled` with no failing test named. Value
          # matched to the unit-tests job's 300000 for the same measured reason
          # documented there — the slowest legitimate test in this repo is
          # ~52.5s on the dev machine / ~121s on a runner at the measured ~2.3x
          # factor, so 300s is ~2.5x the CI figure. Raise only against a fresh
          # measurement of the slowest honest test, never to silence a hang.
          mapfile -t e2e_unit_tests < tests/e2e-unit-test-manifest.txt
          [ ${#e2e_unit_tests[@]} -eq 0 ] && { echo "::error::tests/e2e-unit-test-manifest.txt is empty or missing"; exit 1; }
          npx tsx --test --test-timeout 300000 "${e2e_unit_tests[@]}"

      - name: Run E2E tests
        run: npx playwright test --project=chromium
        env:
          TEST_BASE_URL: https://broadwayscorecard.com

      - name: Upload test results
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: 'Test Suite Failed'
          discord_webhook: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}

      - name: Create issue on failure
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const title = '🚨 Daily E2E Tests Failed';
            const body = `## E2E Tests Failed

            The daily E2E test suite found issues on the production site.

            **Run:** [${context.runId}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})
            **Time:** ${new Date().toISOString()}
            **Site:** https://broadwayscorecard.com

            Please check the workflow logs and Playwright report for details.

            ---
            *This issue was automatically created by the test workflow.*`;

            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'automated,bug'
            });

            const existingIssue = issues.data.find(i => i.title === title);
            if (!existingIssue) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['automated', 'bug', 'e2e']
              });
            }


  visual-regression:
    name: Visual Regression
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' &&
       github.event.inputs.test_type != 'data-only' &&
       github.event.inputs.test_type != 'e2e-only')
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Checkout core data
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
      - name: Checkout review-texts (private repo)
        uses: ./.github/actions/checkout-review-texts
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Playwright
        uses: ./.github/actions/setup-playwright
        with:
          browsers: 'chromium webkit'

      - name: Run visual regression tests
        id: visual-test
        run: |
          # On main: always update baselines. The live site is the source of truth —
          # changes already passed visual QA before deploy (CLAUDE.md §5).
          # Baseline diffs are visible in the git commit for async review.
          UPDATE_FLAG=""
          if [ "${{ github.event.inputs.update_snapshots }}" == "true" ] || [ "${{ github.ref }}" == "refs/heads/main" ]; then
            UPDATE_FLAG="--update-snapshots"
            echo "Auto-updating baselines (running on main)"
          fi
          npx playwright test tests/e2e/visual-regression.spec.ts --project=chromium --project=mobile $UPDATE_FLAG
        env:
          TEST_BASE_URL: https://broadwayscorecard.com

      - name: Commit updated snapshots
        if: always() && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "tests/e2e/__screenshots__/"
          if git diff --staged --quiet; then
            echo "No snapshot changes to commit"
            exit 0
          fi
          git commit -m "chore: Update visual regression baselines [skip ci]"
          # Non-blocking: this push races main's commit churn (card #80) hard
          # enough that even a 20-retry/900s budget lost EVERY attempt in a
          # live test (task #353, run 30057838225, 2026-07-24 — 9 rejections
          # over 16min, remote tip advancing every ~100s). Widening the retry
          # budget just burns CI minutes on an unwinnable race; the snapshot
          # commit isn't time-sensitive, so a lost race must not redden this
          # job — the next scheduled/dispatched run recomputes the same diff.
          bash scripts/lib/push-with-retry.sh || echo "::warning::Snapshot push failed — next run will recommit"

      - name: Upload test results
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: visual-regression-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [unit-tests, data-validation, e2e-tests, visual-regression, design-tokens-lint]
    if: always()
    steps:
      - name: Check results
        run: |
          if [ "${{ needs.unit-tests.result }}" == "failure" ] || [ "${{ needs.data-validation.result }}" == "failure" ] || [ "${{ needs.e2e-tests.result }}" == "failure" ] || [ "${{ needs.visual-regression.result }}" == "failure" ] || [ "${{ needs.design-tokens-lint.result }}" == "failure" ]; then
            echo "Some tests failed"
            exit 1
          else
            echo "All tests passed"
          fi

      # --- Real-time alert: main is red across consecutive pushes ---------------
      # Why this exists (2026-06-13→06-15 incident): main test.yml failed on 11 of
      # 19 push runs over three days with no real-time alert. The two existing
      # surfacing paths both under-escalate push failures on main:
      #   1. health-check.js getWorkflowRunSummary() lists "Test Suite" in the daily
      #      digest's "Repeat Workflow Failures (24h)" body section, but that section
      #      never drives the subject line or an error status, so it reads as noise.
      #   2. check-cron-health.yml keys staleness off the last *successful* run
      #      (`--status=success`). test.yml has frequent green push runs interleaved
      #      with the red ones, so it never trips the 48h staleness gate, and its
      #      `LAST_CONCLUSION == "failure"` warning branch is dead (the query forces
      #      success). Direct pushes to main aren't gated by required checks
      #      (memory/feedback_branch_protection_direct_push.md), so red code lands.
      # Owner-alert-router migration (Notion 3a4637c5-416f-81eb, #279): the streak
      # transition (2nd consecutive failure) now dispatches an "auto" Notion Action
      # Queue card instead of emailing directly — notion-action-poll.js works it
      # hands-free. Escalates to a real HUMAN email only if main is STILL red 2
      # failures later (4th consecutive) — "already dispatched; here's the card"
      # instead of "go run Claude Code."
      - name: Detect consecutive main test failures
        id: streak
        if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'test.yml',
                branch: 'main',
                event: 'push',
                status: 'completed',
                per_page: 30,
              });
              // API returns newest-first. Drop this run (still in progress) and any
              // cancelled/skipped runs — only success/failure conclusions count as a
              // real test outcome in the consecutive streak.
              const prior = (data.workflow_runs || [])
                .filter(r => r.id !== context.runId)
                .filter(r => r.conclusion === 'success' || r.conclusion === 'failure');
              // This run failed (we're inside if: failure()) — count it, then walk
              // backward through prior completed runs while they keep failing.
              let streak = 1;
              for (const r of prior) {
                if (r.conclusion === 'failure') streak++;
                else break;
              }
              const prevFailedUrl = prior[0] && prior[0].conclusion === 'failure' ? prior[0].html_url : '';
              // >= thresholds, not exact-match: a windowing quirk (cancel-cascade
              // dropping a run out of the per_page:30 history, or two near-
              // simultaneous pushes each excluding the other's in-progress run)
              // can skip past an exact streak count entirely. Each condition's
              // own ledger entry (see routeAlert below) is what actually
              // prevents re-notifying every run — not hitting an exact number.
              const shouldDispatch = streak >= 2;
              const shouldEscalate = streak >= 4;
              console.log(`[streak] streak=${streak} shouldDispatch=${shouldDispatch} shouldEscalate=${shouldEscalate}`);
              core.setOutput('streak', String(streak));
              core.setOutput('should_dispatch', shouldDispatch ? 'true' : 'false');
              core.setOutput('should_escalate', shouldEscalate ? 'true' : 'false');
              core.setOutput('prev_failed_url', prevFailedUrl);
            } catch (e) {
              // Don't spam on transient API errors — the daily digest backstops.
              console.log(`[streak] run-history lookup failed (${e.message}); skipping alert.`);
              core.setOutput('should_dispatch', 'false');
              core.setOutput('should_escalate', 'false');
            }

      # Single checkout for the whole alert-router block below (dispatch/escalate
      # on failure, resolve on success, and the ledger commit) — always fetches
      # on a main push regardless of pass/fail so the ledger write always has a
      # repo to commit into.
      - name: Checkout (for alert lib)
        # !cancelled() (not a bare boolean) is REQUIRED here: GitHub Actions
        # implicitly ANDs any custom if: with success() unless the condition
        # itself calls a status function (success/failure/always/cancelled).
        # A bare `github.event_name == 'push' && ...` gets silently SKIPPED
        # the moment an earlier step in this job fails — exactly the main-is-
        # red scenario this whole block exists to alert on. Without this fix,
        # "Route alert" below crashes with MODULE_NOT_FOUND (no checkout ran)
        # and "Commit alert-router ledger changes" fails too (no .git dir).
        # Discovered 2026-07-23 when this exact path went red on merge.
        if: "!cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main'"
        uses: actions/checkout@v5

      - name: Route alert — main test.yml red on consecutive pushes
        if: failure() && steps.streak.outputs.should_dispatch == 'true'
        uses: actions/github-script@v7
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          PREV_FAILED_URL: ${{ steps.streak.outputs.prev_failed_url }}
          SHOULD_ESCALATE: ${{ steps.streak.outputs.should_escalate }}
          STREAK: ${{ steps.streak.outputs.streak }}
        with:
          script: |
            const { routeAlert } = require('./scripts/lib/owner-alert-router.js');
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const prevUrl = process.env.PREV_FAILED_URL || '';
            const streak = process.env.STREAK || '?';
            const fields = [
              { name: 'This failed run', value: `[View logs](${runUrl})` },
              { name: 'Previous failed run', value: prevUrl ? `[View logs](${prevUrl})` : 'n/a' },
              { name: 'Consecutive failures', value: streak },
            ];

            // Independent conditionKey/disposition per severity tier — each gets
            // its own ledger entry, so the router's normal cooldown/dedup does
            // the "notify once per open incident" work with no special-casing
            // here. No cooldownHours override: a real Notion/Resend outage
            // retries next run instead of a failed send silently marking the
            // incident "notified" (see routeAlert's notifyOk gate).
            await routeAlert({
              conditionKey: 'test-yml:main-streak',
              title: 'main test.yml red on 2+ consecutive pushes',
              description: 'The Test Suite has failed on at least two consecutive pushes to main. Direct pushes to main are not gated by required checks, so broken code is landing on the production branch. A fix-main card has been filed to the Action Queue.',
              severity: 'error',
              disposition: 'auto',
              cardAction: 'Fix',
              fields,
              url: runUrl,
            }).catch(e => console.error('Consecutive-failure card dispatch failed:', e.message));

            if (process.env.SHOULD_ESCALATE === 'true') {
              // Separate conditionKey, 24h cooldown: re-pages once a day while
              // main stays red 4+ in a row, instead of firing every push (spam)
              // or firing exactly once ever (the old cooldownHours:0 hack, which
              // also fully bypassed the ledger's own dedup). disposition:'human'
              // is not on the page-worthy allowlist, so the router downgrades
              // this to the morning digest anyway — task #843: model:'opus'
              // makes digest-autofix.js dispatch THIS row (a technical
              // investigation, not a decision) straight to opus on its first
              // attempt, since it's already the SECOND machine attempt at the
              // underlying failure (the 2nd-failure 'auto' card above already
              // tried once and didn't resolve it).
              await routeAlert({
                conditionKey: 'test-yml:main-streak-escalation',
                title: 'main test.yml STILL red — auto-dispatch did not resolve it',
                description: `main test.yml is STILL red after ${streak} consecutive pushes — the auto-dispatch card filed at the 2nd failure has not resolved it. Direct pushes to main are not gated by required checks, so broken code is landing on the production branch. Investigate and fix now.`,
                severity: 'error',
                disposition: 'human',
                model: 'opus',
                fields,
                url: runUrl,
                cooldownHours: 24,
              }).catch(e => console.error('Consecutive-failure escalation email failed:', e.message));
            }

      # Close both incidents the moment main goes green again — lets a FUTURE
      # streak notify immediately instead of waiting out the cooldown.
      - name: Resolve alert — main test.yml green again
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          node -e "require('./scripts/lib/owner-alert-router.js').resolveCondition('test-yml:main-streak')"
          node -e "require('./scripts/lib/owner-alert-router.js').resolveCondition('test-yml:main-streak-escalation')"

      # The ledger/digest-queue writes above only exist on the ephemeral runner's
      # disk until committed — without this, cooldown/resolve state resets every
      # run and the router's "notify once per open incident" guarantee is a no-op.
      - name: Commit alert-router ledger changes
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git add data/audit/alert-ledger.json data/audit/alert-digest-queue.json 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "data: alert-router ledger update [skip ci]"
            # Non-blocking: a lost race against main's commit churn must not fail
            # this job — the next push re-derives the same streak/cooldown state,
            # and a failure here would ironically trip the very "main red" alert
            # this step exists to send (task #353 ship-check finding).
            bash scripts/lib/push-with-retry.sh || echo "::warning::Alert-router ledger push failed — next run will recompute state"
          else
            echo "No ledger changes to commit."
          fi
