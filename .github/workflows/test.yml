      - 'scripts/lib/rss-discovery.js'
      - 'scripts/lib/omc-discovery.js'
      - 'scripts/lib/theatermania-discovery.js'
      - 'scripts/lib/show-score-discover.js'
      - 'scripts/lib/dtli-homepage-scan.js'
