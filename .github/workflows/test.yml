name: Test Suite

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      # Show Score import: the profile parser ships inside the edge function
      # dir but its unit test runs in the tests/unit batch — path-listed so a
      # solo parser edit still triggers CI (plan-review finding, 2026-07-13).
      - 'supabase/functions/**'
      # Schema-drift parser (verify-schema.yml / supabase-functions.yml gate):
      # its unit test is in tests/unit-test-manifest.txt (tests/** is globbed
      # above) but a solo edit to the lib needs this listing to trigger CI.
      - 'scripts/lib/supabase-schema-expectations.js'
      # Column-count brittleness guard (task #118) used by scrape-alltime.ts
      # and scrape-grosses.ts: its unit test is in tests/unit-test-manifest.txt
      # (tests/** is globbed above) but a solo edit to the lib needs this
      # listing to trigger CI.
      - 'scripts/lib/table-schema-assertion.js'
      - 'scripts/validate-data.js'
      - 'scripts/validate-aggregator-truth.js'
      - 'scripts/validate-market-expansion.js'
      - 'scripts/validate-mobile-shows.js'
      - 'scripts/audit-review-contamination.js'
