      # across every scraping script. Was NOT in this allow-list at all before
      # task #881 (Tier-1/Tier-2 freshness comparison fix) — colocated
      # *.test.mjs runs in the lib-test glob; path-listed so a solo edit
      # triggers CI.
      - 'scripts/lib/cookie-loader.js'
      - 'scripts/lib/cookie-loader.test.mjs'
      - 'scripts/wsj-otp-login.js'
      # Show-image verification prompt: was hardcoded Broadway, so correct West
      # End / Off-Broadway / regional key art was rejected [non_broadway] and 26
      # open/upcoming shows shipped imageless (2026-08-02). Colocated *.test.mjs
      # runs in the scripts/lib/*.test.mjs glob; path-listed so a solo edit
      # to the prompt or either consumer triggers CI.
      - 'scripts/lib/verify-image.js'
      - 'scripts/lib/verify-image-prompt.test.mjs'
      - 'scripts/lib/image-audit-action.js'
      - 'scripts/lib/image-audit-action.test.mjs'
      # Coverage is decided from FILES, not directory existence: the fetcher
      # mkdir's <id>/ before verification, so a failed fetch leaves an empty dir
      # that existence-based readers counted as art (2026-08-02).
      - 'scripts/lib/show-image-coverage.js'
      - 'scripts/lib/show-image-coverage.test.mjs'
      # Gate T acceptance test (card #1153) — spawns the real fleet-wide
      # ~/.claude/hooks/exit-status-gate.sh, not a repo helper, so a solo edit
      # here needs its own path entry (the hook has no colocated source file
      # in-repo to piggyback on). Runs in the scripts/lib/*.test.mjs glob.
      - 'scripts/lib/exit-status-gate-taskref.test.mjs'
      # SERP-census recall metric + its weekly cadence (Coverage Verdict S1,
      # tasks #872/#898). The whole point of the sprint is that a regression in
      # a discovery arm must stop being invisible; a change to the metric or the
      # harness that skipped CI would reopen exactly that hole. The colocated
      # census-recall.test.mjs runs in the scripts/lib/*.test.mjs glob and the
      # digest renderer's test is in tests/unit-test-manifest.txt — these are
      # path-listed so a solo edit to either triggers CI.
      - 'scripts/lib/census-recall.js'
      - 'scripts/lib/census-recall.test.mjs'
      - 'scripts/audit-serp-census-recall.js'
      - '.github/workflows/audit-census-recall.yml'
      - 'scripts/health-check.js'
      # Push-retry deadman row (BRO-231/#1221): colocated *.test.mjs runs in
