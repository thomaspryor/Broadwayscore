      # real-article fixture) so a solo edit triggers CI.
      - 'scripts/lib/bww-roundup-parser.js'
      - 'scripts/lib/bww-roundup-parser.test.mjs'
      - 'tests/fixtures/bww-roundups/**'
      # Ingest-skip classification (2026-08-09): the gap audit treated EVERY
      # non-landing ingest as a benign no-op, so a cross-show URL ownership veto
      # looked identical to "already up to date". I'm Every Woman's Guardian,
      # Times and Standard reviews sat unreachable under the-car-man-west-end-2026
      # for days while the hourly audit logged "no-op". Its test greps
      # review-file-writer.js for every skip reason it emits and fails if one is
      # unclassified, so the two cannot drift. Colocated *.test.mjs runs in the
      # scripts/lib/*.test.mjs glob; path-listed so a solo edit triggers CI.
      - 'scripts/lib/ingest-skip-classify.js'
      - 'scripts/lib/ingest-skip-classify.test.mjs'
      # Silent-exclusion detectors (#1147 tracker, card #1188): a review with
      # fullText + a real byline + no rejection flags but no contentTier stays
      # OUT of reviews.json forever (rebuild only re-derives contentTier when
      # fullText changes), and an outlet that migrates to a new host (e.g.
      # Substack) silently drops every review on the new domain via
      # domain-mismatch. Both wired into health-check.js's daily digest.
      # Colocated *.test.mjs runs in the scripts/lib/*.test.mjs glob;
      # path-listed so a solo edit triggers CI.
      - 'scripts/lib/silent-exclusion-detectors.js'
      - 'scripts/lib/silent-exclusion-detectors.test.mjs'
      # Shared host-suffix source of truth: which dot-label of a hostname is the
      # outlet identity. provisionalOutletIdFromHost (registration),
      # normalizeHostSlug (domain-move detection) and registrableHost (review-gap
      # audit) must agree, or an outlet registers under one slug while another
      # stage reasons about a different one and a real move is never recognized.
      # All three forked these lists and had already drifted.
      - 'scripts/lib/host-suffix-lists.js'
      - 'scripts/lib/host-suffix-lists.test.mjs'
      # reviews.json corpus non-determinism (task #653): extract-dtli-reviews.js
