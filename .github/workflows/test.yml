      - 'scripts/lib/push-retry-deadman.js'
      - 'scripts/lib/push-retry-deadman.test.mjs'
      - 'scripts/fetch-show-images-auto.js'
      - 'scripts/audit-images-llm.js'
      - 'scripts/process-feedback.js'
      # Diacritic folding across every show-title matcher (task #648). A matcher
      # that strips non-ASCII without folding first shreds "Les Misérables" into
      # ["les","mis","rables"] and matches nothing — confirmed live suppression.
      # tests/unit/sibling-matchers-diacritics.test.mjs is registered explicitly
      # in the tests/unit node --test invocation (that batch is NOT globbed);
      # these libs are path-listed so a solo edit triggers CI.
      - 'tests/unit/sibling-matchers-diacritics.test.mjs'
