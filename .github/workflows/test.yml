name: Test Suite

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/validate-data.js'
      - 'scripts/validate-aggregator-truth.js'
      - 'scripts/validate-market-expansion.js'
      - 'scripts/validate-mobile-shows.js'
      - 'scripts/audit-review-contamination.js'
      - 'scripts/audit-non-reviews.js'
      - 'scripts/lib/non-review-patterns.js'
      - 'scripts/audit-cast-contamination.js'
      - 'scripts/audit-commercial-contamination.js'
      - 'scripts/audit-audience-buzz-contamination.js'
      - 'scripts/audit-critic-consensus-contamination.js'
      - 'scripts/audit-regex-patterns.js'
      - 'scripts/audit-duplicate-of-url-mismatch.js'
      - 'scripts/audit-orphan-show-ids.js'
      - 'scripts/validate-show-venue.js'
      - 'scripts/lib/review-write-guard.js'
      - 'scripts/lib/show-matching.js'
      - 'scripts/lib/feedback-dedup.js'
      # Show dedup (title normalization + checkForDuplicate) feeds both the
      # discover-new-shows creation guard and validate-data's catalog scan.
      # Without these, an edit to the normalizer pushes with ZERO CI coverage
      # (WE 2026 "The Truth" dup class — feedback_dedup_genre_suffix.md).
      - 'scripts/lib/deduplication.js'
      - 'scripts/test-deduplication.js'
      # SERP/URL discovery + review guards — exercised by the no-data unit batch and
      # scripts/test-opening-night-fixes.js (run in the opening-night step). Without these,
      # changes to core discovery/scoring-guard logic push with ZERO CI coverage.
      - 'scripts/lib/url-discovery.js'
      - 'scripts/lib/review-guards.js'
      - 'scripts/test-opening-night-fixes.js'
      - 'scripts/audit-slug-match-routing.js'
      - 'scripts/apply-slug-misroute-whitelist.js'
      - 'scripts/lib/cast-extraction-guards.js'
      - 'scripts/backfill-cast-web.js'
      - 'data/cast/**'
      - 'scripts/lib/content-quality.js'
      # Synopsis quality detector (refusal/placeholder/stale/invalid). Shared by
      # the freshness gate, deploy-time self-heal, and Wikipedia re-enrichment.
      # Colocated scripts/lib/*.test.mjs step covers the test; without these path
      # entries a push to them triggers ZERO CI (1536 incident, 2026-06-21).
      - 'scripts/lib/synopsis-validation.js'
      - 'scripts/lib/synopsis-validation.test.mjs'
      # Wrong-show verification gate — blocks TodayTix ID-recycling + LLM
      # same-title hallucinations from being saved as synopses. Colocated test.
      - 'scripts/lib/synopsis-production-match.js'
      - 'scripts/lib/synopsis-production-match.test.mjs'
      # Comparative within-band scoring (anchored-v6 cluster fix). The colocated
      # scripts/lib/*.test.mjs step covers comparative-band.test.mjs; without
      # these path entries a push to them triggers ZERO CI (allow-list gate).
      - 'scripts/lib/comparative-band.js'
      - 'scripts/lib/comparative-band.test.mjs'
      # Run-budget helper (cron time budgets) — colocated scripts/lib/*.test.mjs
      # step covers it; the WET scraper's cache predicate is covered by
      # tests/unit/wet-title-extraction.test.mjs. The three budget-consuming
      # cron scripts are listed so solo edits to them still trigger CI
      # (workflow hygiene + lint + colocated batches), not ZERO coverage.
      - 'scripts/lib/run-budget.js'
      - 'scripts/lib/run-budget.test.mjs'
      # Reddit audience-buzz contamination filters (generic-title / roundup guard).
      # Colocated scripts/lib/*.test.mjs step covers reddit-post-filters.test.mjs;
      # without these entries a solo edit triggers ZERO CI (allow-list gate).
      - 'scripts/lib/reddit-post-filters.js'
      - 'scripts/lib/reddit-post-filters.test.mjs'
      - 'scripts/scrape-reddit-sentiment.js'
      - 'scripts/lib/reddit-api.js'
      - 'scripts/lib/audience-weighting.js'
      - 'scripts/neutralize-contaminated-reddit-buzz.js'
      - 'scripts/scrape-westendtheatre-roundups.js'
      - 'scripts/recover-explicit-ratings.js'
      - 'scripts/deep-research-commercial.js'
      - 'scripts/sweep-we-aggregators.js'
      - 'scripts/gather-reviews.js'
      - 'scripts/llm-scoring/comparative-rescore.ts'
      - 'scripts/llm-scoring/config.ts'
      - 'scripts/lib/classify-category.js'
      - 'scripts/lib/per-category-precursor.js'
      - 'scripts/lib/award-category-canonical.js'
      - 'scripts/lib/outlet-listing-helpers.js'
      - 'scripts/outlet-listing-poller.js'
      # visual-qa push-gate helper — colocated test runs in the scripts/lib step
      # but the workflow only fires when a push-path matches; without this entry
      # edits to the gate would get ZERO CI coverage (feedback_test_yml_push_path_allowlist).
      - 'scripts/lib/transcript-scan.js'
      - 'scripts/lib/transcript-scan.mjs'
      # Workflow hygiene guard — enforce notify-failure, setup-playwright, push-with-retry
      # on all 186 workflows. Without this path entry, edits to the guard get ZERO CI.
      - 'scripts/audit-workflow-hygiene.js'
      # Sitemap shard URL resolver (robots.txt parser) — colocated test runs in the
      # scripts/lib step, but the job only fires when a push-path matches; without
      # these entries edits get ZERO CI (feedback_test_yml_push_path_allowlist).
      - 'scripts/lib/sitemap-urls.js'
      - 'scripts/lib/sitemap-urls.test.mjs'
      # Email generators — so changes to outbound email (incl. UTM tagging via
      # scripts/lib/email-utm.js) run the colocated scripts/lib/*.test.mjs step.
      - 'scripts/lib/email-utm.js'
      - 'scripts/lib/email-templates.js'
      - 'scripts/newsletter/**'
      - 'scripts/send-opening-night-broadcast.js'
      - 'scripts/fantasy-weekly-email.js'
      - 'scripts/send-btc-results.js'
      - 'scripts/scrape-drama-desk.js'
      - 'scripts/scrape-outer-critics.js'
      - 'scripts/scrape-drama-league.js'
      - 'scripts/scrape-tony-awards.js'
      - 'data/awards.json'
      - 'data/precursors/**'
      - 'tests/fixtures/classify-category-baseline.json'
      - 'public/data/mobile-shows.json'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.*'
      - 'tsconfig.*'
      - 'tailwind.config.*'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
  schedule:
    # Run daily at 6 AM UTC (1 AM EST) to catch issues
    # TODO: Change to weekly (0 6 * * 1) once review inventory is stable
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Which tests to run'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - data-only
          - e2e-only
          - visual-only
      update_snapshots:
        description: 'Update visual regression baselines'
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  # On PRs: cancel superseded runs — only the latest commit on a branch matters.
  # On main: NEVER cancel. Every commit to the protected trunk is permanent and must
  #   complete validation; cancel-in-progress meant each push killed the prior run
  #   mid-setup, so ~75% of main commits landed unvalidated AND the cancelled runs
  #   emitted misleading jsdom/shows.json failures that sent sessions chasing phantom
  #   bugs. Matches the "queued, not cancelled" pattern already used by rebuild-reviews,
  #   enrich-reviews, and llm-ensemble-score. See memory/feedback_test_yml_cancel_in_progress.md.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint-workflows:
    name: Lint Workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install actionlint
        run: |
          ACTIONLINT_VERSION=1.7.7
          curl -sL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" | tar xz
          sudo mv actionlint /usr/local/bin/
      - name: Lint workflow files
        run: |
          # Emergency escape hatch (opening-night hotfixes only): if the
          # commit message contains "[skip-actionlint]", this gate exits 0.
          # Symmetric with [skip-demo-flag-check] above. Use sparingly; the
          # most likely cause of needing it is a transient actionlint bump
          # that adds a new rule mid-incident. Follow up with a real fix.
          if git log -1 --format=%B | grep -Fq "[skip-actionlint]"; then
            echo "::warning::actionlint check skipped via [skip-actionlint] commit-message tag"
            exit 0
          fi
          actionlint -color -shellcheck="" \
            -ignore 'maximum number of inputs' \
            .github/workflows/*.yml
      - name: Setup Node (for orphan-test audit)
        uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Audit — no orphan unit tests
        # Notion 362637c5-416f-81f4 — every tests/unit/*.test.{mjs,ts,js} must be
        # wired into a workflow runner, or it silently doesn't run. Discovered
        # 59 orphans during Stuart King Fixes v2 (33% of the suite). Audit script
        # diffs the on-disk file list against the YAML references; exits 1 on
        # any new orphan. Known-broken tests live in an EXEMPT_KNOWN_BROKEN dict
        # in the script itself, each with a Notion card pointer.
        #
        # Emergency escape hatch (symmetric with [skip-actionlint] above): if the
        # latest commit message contains "[skip-orphan-audit]", the gate exits 0.
        # Use only for opening-night hotfixes where a forgotten registration is
        # less urgent than the actual fix. Follow up with a proper registration.
        run: |
          if git log -1 --format=%B | grep -Fq "[skip-orphan-audit]"; then
            echo "::warning::orphan-test audit skipped via [skip-orphan-audit] commit-message tag"
            exit 0
          fi
          node scripts/audit-orphan-tests.js
      - name: Audit — decayed exemptions
        # If an EXEMPT_KNOWN_BROKEN test starts passing, the exemption is stale
        # and should be removed (otherwise the gate hides a now-passing test
        # forever). Run each exempt test and fail if any pass.
        # Same [skip-orphan-audit] escape hatch as the gate above.
        run: |
          if git log -1 --format=%B | grep -Fq "[skip-orphan-audit]"; then
            echo "::warning::decayed-exemption check skipped via [skip-orphan-audit] commit-message tag"
            exit 0
          fi
          STALE=""
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            # 30s wrapper via Node — `timeout` isn't available on the ubuntu runner without coreutils alias.
            if node --test --test-timeout 30000 "tests/unit/$f" > /dev/null 2>&1; then
              STALE="$STALE $f"
            fi
          done < <(node scripts/audit-orphan-tests.js --list-exempt)
          if [ -n "$STALE" ]; then
            echo "::error::Decayed exemption(s) — these tests now pass and must be removed from EXEMPT_KNOWN_BROKEN in scripts/audit-orphan-tests.js:$STALE"
            exit 1
          fi
          echo "All exemptions still failing — no decay."

      - name: Audit — no push-to-main workflow cancels main commits
        # Prevents the recurring "no clean CI signal" class: a push-to-main workflow
        # with a ref-keyed concurrency group + cancel-in-progress:true kills the prior
        # run on every commit, so most main commits land unvalidated AND cancelled
        # runs emit phantom jsdom/shows.json failures. test.yml had this for months
        # and it was re-diagnosed almost daily. Guard fails if it (or any sibling)
        # regresses. Opt-out for idempotent jobs via a "# concurrency-cancel-ok:"
        # annotation. See memory/feedback_test_yml_cancel_in_progress.md.
        run: node scripts/audit-workflow-concurrency.js

      - name: Audit — workflow hygiene (notify-failure, playwright, push-with-retry)
        # Guards three workflow hygiene rules:
        # (a) Any scheduled/push/dispatch workflow must include notify-failure as last step
        # (b) No inline `npx playwright install` — use .github/actions/setup-playwright
        # (c) Any `git push` to origin must use scripts/lib/push-with-retry.sh (not bare git push)
        # Exempt a workflow with # hygiene-notify-ok/playwright-ok/push-ok: <reason>.
        # Root cause for each rule: (a) baseline rot via SKIP-VISUAL-CHECK in red CI,
        # (b) browser cache miss wastes 15s/run, (c) bare || echo swallows push failures.
        run: node scripts/audit-workflow-hygiene.js

      - name: Audit — check-cron-health max_hours vs real cron cadence
        # Catches the 2026-05-24 class of bug where an entry's max_hours is
        # less than the worst gap between its workflow's cron fires, guaranteeing
        # false-positive staleness alerts. Script reads CRITICAL_CRONS entries
        # from check-cron-health.yml, simulates 60 days of cron fires for each
        # referenced workflow, and fails if max_hours < worst real gap.
        run: |
          if git log -1 --format=%B | grep -Fq "[skip-cron-audit]"; then
            echo "::warning::cron-health coverage audit skipped via [skip-cron-audit] commit-message tag"
            exit 0
          fi
          node scripts/audit-cron-health-coverage.js

      - name: Audit — tests vs derived data (no silent factual pins)
        # Tests that read data/awards.json, data/reviews.json, or data/shows.json
        # (derived enricher outputs) must ALSO read from data/precursors/ or
        # data/review-texts/ (the sources that generate them), OR carry a
        # `// TESTS-VS-DERIVED-DATA-EXEMPT: <reason>` comment near the top.
        #
        # Why: 2026-05-26 incident — three awards-person-winner-pairing.test.mjs
        # pins broke because they hard-coded facts ("Lithgow won for X") that
        # Track A's Wikipedia audit later corrected. The test was re-asserting
        # the bug it was meant to catch. This gate forces derive-from-source
        # (or an explicit, justified exemption).
        run: node scripts/audit-tests-vs-derived-data.js

      - name: Audit — no synthesized .click() in Playwright tests
        # `document.querySelector(...).click()` inside page.evaluate (or any
        # browser-side callback) bypasses Playwright's actionability checks.
        # On hydration-heavy pages, the synthesized DOM click fires before
        # React's onClick attaches and silently no-ops. Tests pass by luck
        # until an unrelated layout shift slows hydration just enough to
        # flip them red.
        #
        # Why: 2026-05-26 — filter-panel-sync.spec.ts West End went red after
        # an unrelated homepage commit (LOSO a88d9cd516) added a few lines to
        # FeaturedSpot prose, delaying hydration enough to lose the race.
        # The fix shipped here uses Playwright actionable clicks; this audit
        # prevents the next test from reintroducing the pattern.
        run: node scripts/audit-playwright-evaluate-click.js

      - name: Audit — Tony LOSO snapshot co-change
        # If TONY_RECIPES, TONY_RECIPES_TIER2, or categoryAwardsScore changes
        # in src/lib/data-tony-predictions.ts, data/tony-loso-stats.json MUST
        # also change in the same PR. The disclosure on /tony-awards/predictions
        # reads its accuracy figure live from tony-loso-stats.json — if a recipe
        # edit lands without re-running the audit, the live "X% of past winners"
        # number silently desyncs from what the model actually produces.
        #
        # The fix when this gate fires:
        #   npx tsx scripts/audit-tony-loso.ts && git add data/tony-loso-stats.json
        # The audit re-runs leave-one-season-out cross-validation against the
        # new recipe and rewrites the JSON with current numbers.
        #
        # Comment-only diffs to the Tony predictions module are ignored so
        # docblock edits don't force unrelated audit reruns.
        run: |
          # Base-ref selection:
          # - PR event: github.base_ref is set (e.g. "main"). Compare against origin/<base>.
          # - Push-to-main / schedule / dispatch: github.base_ref is empty. The
          #   checked-out HEAD IS origin/main (they point at the same commit),
          #   so diffing against origin/main shows nothing and the gate silently
          #   no-ops. Fall back to HEAD~1 to detect the change that just landed.
          if [ -n "${{ github.base_ref }}" ]; then
            BASE_REF="${{ github.base_ref }}"
            git fetch origin "$BASE_REF" --depth=2 2>/dev/null || true
            BASE="origin/$BASE_REF"
            if ! git rev-parse "$BASE" >/dev/null 2>&1; then BASE=HEAD~1; fi
          else
            # Push / schedule / dispatch — compare to parent commit.
            BASE=HEAD~1
            if ! git rev-parse "$BASE" >/dev/null 2>&1; then
              echo "No parent commit available — skipping LOSO snapshot gate"
              exit 0
            fi
          fi

          # Did the predictions module change at all in this diff?
          if ! git diff "$BASE" --name-only -- src/lib/data-tony-predictions.ts | grep -q .; then
            echo "data-tony-predictions.ts unchanged — skipping LOSO snapshot gate"
            exit 0
          fi

          # Did the change touch the recipe constants or awards-term function
          # (i.e. anything that would shift LOSO numbers), or is it comment-only?
          # Look for added/removed non-comment lines mentioning the watched names.
          if ! git diff "$BASE" -- src/lib/data-tony-predictions.ts \
                | grep -E '^[+-][^+-]' \
                | grep -vE '^[+-][[:space:]]*(//|\*)' \
                | grep -qE 'TONY_RECIPES|categoryAwardsScore'; then
            echo "Only comments / unrelated lines changed — skipping LOSO snapshot gate"
            exit 0
          fi

          # Did data/tony-loso-stats.json change alongside?
          if git diff "$BASE" --name-only -- data/tony-loso-stats.json | grep -q .; then
            echo "Recipe changed AND snapshot updated — OK"
            exit 0
          fi

          echo "::error::TONY_RECIPES, TONY_RECIPES_TIER2, or categoryAwardsScore changed in src/lib/data-tony-predictions.ts but data/tony-loso-stats.json was not updated in this PR."
          echo "::error::Run locally: npx tsx scripts/audit-tony-loso.ts && git add data/tony-loso-stats.json && git commit --amend --no-edit"
          echo "::error::This keeps the live disclosure number on /tony-awards/predictions consistent with the shipped model. Without this gate, recipe edits silently desync the public accuracy claim."
          exit 1

      - name: Check workflows don't bypass npm prebuild lifecycle
        run: |
          # `npx next build` (or bare `next build`) in a workflow step skips
          # the npm `prebuild` lifecycle hook (scripts/prebuild.sh), which is
          # the only thing that generates the gitignored
          # data/cast-manifest.json and data/actor-slugs.json files. Without
          # those, `next build` fails with
          #   Module not found: '../../data/cast-manifest.json'.
          # The 2026-05-26 Test UGC Features failure was caused by exactly
          # this in test-ugc.yml. All workflows must invoke `npm run build`,
          # which runs prebuild → build atomically.
          VIOLATIONS=""
          for f in .github/workflows/*.yml; do
            # Match `npx next build` and `npx --no-install next build`; tolerate
            # extra flags after. Avoid matching `npm run build` (which is fine).
            if grep -E '^[[:space:]]*(run:[[:space:]]*)?(npx([[:space:]]+--[a-z-]+)*[[:space:]]+next[[:space:]]+build|next[[:space:]]+build)([[:space:]]|$)' "$f" >/dev/null 2>&1; then
              VIOLATIONS="$VIOLATIONS $(basename "$f")"
            fi
          done
          if [ -n "$VIOLATIONS" ]; then
            echo "::error::Workflows invoke 'next build' directly (bypasses npm prebuild):$VIOLATIONS"
            echo "Fix: change 'npx next build' to 'npm run build'. The prebuild hook"
            echo "generates data/cast-manifest.json + data/actor-slugs.json (both gitignored)"
            echo "which next build imports at compile time."
            exit 1
          fi
          echo "All workflows use 'npm run build' (prebuild lifecycle preserved)"

      - name: Check checkout-core-data has matching push-core-data
        run: |
          # Workflows that checkout core data AND have write permissions
          # must also push-core-data, or changes get lost on next deploy.
          MISSING=""
          for f in .github/workflows/*.yml; do
            HAS_CHECKOUT=$(grep -c 'checkout-core-data' "$f" 2>/dev/null || echo 0)
            HAS_WRITE=$(grep -c 'contents: write' "$f" 2>/dev/null || echo 0)
            HAS_PUSH=$(grep -c 'push-core-data' "$f" 2>/dev/null || echo 0)
            if [ "$HAS_CHECKOUT" -gt 0 ] && [ "$HAS_WRITE" -gt 0 ] && [ "$HAS_PUSH" -eq 0 ]; then
              MISSING="$MISSING $(basename $f)"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "::error::Workflows using checkout-core-data with write permissions but missing push-core-data:$MISSING"
            echo "Add push-core-data action to sync changes back to the private repo."
            exit 1
          fi
          echo "All writable workflows with checkout-core-data have matching push-core-data"

      - name: Check workflows don't git-add private core data files
        run: |
          # Core data files live in the private broadway-scorecard-data repo
          # and are gitignored here. They sync via push-core-data after each
          # workflow. Any `git add data/<core-file>` in this repo is either a
          # silent no-op (diff on an ignored file is always clean) or a hard
          # failure (fatal: ignored by one of your .gitignore files).
          # 2026-04-14: update-lottery-rush.yml hit the hard failure; 5 other
          # workflows silently failed the same way for weeks.
          #
          # The authoritative core-data list is in push-core-data/action.yml
          # (the loop over files to copy to /tmp/core-data-checkout). Keep
          # these in sync. Force-adds (`git add -f`) are allowed — they are
          # explicit overrides, used legitimately for opening-night-sent.json.
          CORE_FILES="shows.json reviews.json grosses.json grosses-history.json commercial.json audience-buzz.json critic-consensus.json critic-registry.json outlet-registry.json diary-shows.json audience-reviews-lbo.json followers.json subscribers.json subscribers-westend.json"
          VIOLATIONS=""
          for f in .github/workflows/*.yml; do
            for core in $CORE_FILES; do
              # Match `git add` (no -f/--force) then data/<core>. Reject both
              # `git add data/shows.json` and `git add a b data/shows.json c`.
              if grep -E "^[[:space:]]*git add([[:space:]]+[^-][^[:space:]]*)*[[:space:]]+data/$core([[:space:]]|$)" "$f" >/dev/null 2>&1; then
                VIOLATIONS="$VIOLATIONS $(basename "$f"):$core"
              fi
            done
          done
          if [ -n "$VIOLATIONS" ]; then
            echo "::error::Workflows git-add private core data files:$VIOLATIONS"
            echo "These files are gitignored and synced via push-core-data."
            echo "Remove them from git-add lines. See .github/workflows/CLAUDE.md §Data Sync Architecture."
            exit 1
          fi
          echo "No workflows git-add private core data files"

      - name: Check for tracked symlinks or gitlinks
        run: |
          # Symlinks (120000) and gitlinks (160000) to local paths dangle in CI.
          # This has caused cascading workflow failures 3 times (reviews.json,
          # .core-data-checkout, .claude/worktrees/fix-ci-noise).
          BAD=$(git ls-files --stage | grep -E "^(120000|160000)" || true)
          if [ -n "$BAD" ]; then
            echo "::error::Tracked symlinks or gitlinks found — these break CI:"
            echo "$BAD"
            echo "Fix: git rm --cached <path> and add to .gitignore"
            exit 1
          fi
          echo "No tracked symlinks or gitlinks"

      - name: Check scraping workflows have multi-service fallback
        run: |
          # Any workflow that uses SCRAPINGBEE_API_KEY for actual scraping
          # must also have BRIGHTDATA_TOKEN so there's always a fallback.
          # Workflows exempt from this rule. Two categories:
          # (A) Health checks / credential validators — SB key checked for validity, not scraping
          # (B) Scripts require JS rendering — BD (raw HTML) can't replace SB here; correct
          #     fallback is SB → Playwright (already implemented in the scripts themselves)
          EXEMPT="
            check-secrets-health.yml
            opening-night-orchestrator.yml
            check-cookie-health.yml
            data-health-check.yml
            backfill-historical-metadata.yml
            check-show-freshness.yml
            scrape-alltime-grosses.yml
            weekly-grosses.yml
            reddit-engagement-digest.yml
            scrape-dtli-show-score.yml
            scraper-cost-report.yml
            btc-results-preview.yml
          "
          VIOLATIONS=""
          for f in .github/workflows/*.yml; do
            name=$(basename "$f")
            # Skip exempt workflows
            if echo "$EXEMPT" | grep -qw "$name"; then continue; fi
            if grep -q "SCRAPINGBEE_API_KEY" "$f" && ! grep -q "BRIGHTDATA_TOKEN" "$f"; then
              VIOLATIONS="$VIOLATIONS $name"
            fi
          done
          if [ -n "$VIOLATIONS" ]; then
            echo "::error::Scraping workflows must use scraper.js with BD+SB fallback, not a single service."
            echo "::error::Missing BRIGHTDATA_TOKEN in:$VIOLATIONS"
            echo "Fix: add BRIGHTDATA_TOKEN: \${{ secrets.BRIGHTDATA_TOKEN }} to the scraping step's env block."
            echo "If this workflow legitimately uses only SB (health check, etc), add it to the EXEMPT list in test.yml."
            exit 1
          fi
          echo "All scraping workflows have multi-service fallback"

      - name: Check Theatr token is not passed to unauthorized workflows
        run: |
          # THEATR_REFRESH_TOKEN burns on use (Theatr rotates refresh tokens).
          # Only two workflows may use it:
          #   - update-theatr.yml (the single authorized caller)
          #   - rotate-theatr-token.yml (one-click manual rotation)
          # Any other workflow that passes this secret will silently burn the
          # token chain — fetch-all-image-formats.yml did this for 2 weeks
          # before it was caught (April 2026).
          ALLOWED="update-theatr.yml rotate-theatr-token.yml"
          VIOLATIONS=""
          for f in .github/workflows/*.yml; do
            name=$(basename "$f")
            if echo "$ALLOWED" | grep -qw "$name"; then continue; fi
            # Match actual secret usage, not comments
            if grep -E '^\s+THEATR_REFRESH_TOKEN:\s+\$\{\{' "$f" >/dev/null 2>&1; then
              VIOLATIONS="$VIOLATIONS $name"
            fi
          done
          if [ -n "$VIOLATIONS" ]; then
            echo "::error::THEATR_REFRESH_TOKEN must only be used by update-theatr.yml and rotate-theatr-token.yml"
            echo "::error::Unauthorized usage in:$VIOLATIONS"
            echo "Theatr rotates refresh tokens on every use. Multiple callers race and burn the token chain."
            echo "Use data/theatr-image-cache.json (populated by update-theatr.yml) instead of calling the API directly."
            exit 1
          fi
          echo "Theatr token restricted to authorized workflows only"

      - name: Check demo feature flags not used in server components
        run: |
          # Demo feature flags require window (runtime) and MUST be checked
          # inside 'use client' components. In server components / SSR pages,
          # isDemo() returns false and the feature silently disappears.
          # See: fix 7770e1b567 (theater scorecard invisible on demo).
          #
          # Emergency escape hatch (opening-night hotfixes only): if the
          # commit message contains the literal "[skip-demo-flag-check]",
          # this gate exits 0. Use sparingly and follow up with a real fix.
          if git log -1 --format=%B | grep -Fq "[skip-demo-flag-check]"; then
            echo "::warning::demo-flag check skipped via [skip-demo-flag-check] commit-message tag"
            exit 0
          fi
          # Keep in sync with DEMO_FEATURES in src/config/feature-flags.ts.
          # awards/awardScoreV2 launched 2026-05-17 — removed from this list now
          # that their getters return true unconditionally (server-side usage is
          # safe). Re-add any flag here if you put it back in DEMO_FEATURES.
          DEMO_FLAGS="theaterScorecard|showPageRedesign|userAccounts|showtimes"
          VIOLATIONS=""
          for f in $(grep -rlE "featureFlags\.(${DEMO_FLAGS})" src/ 2>/dev/null || true); do
            # Check if file has 'use client' directive
            if ! head -3 "$f" | grep -q "'use client'"; then
              VIOLATIONS="$VIOLATIONS $f"
            fi
          done
          if [ -n "$VIOLATIONS" ]; then
            echo "::error::Demo feature flags used in server components (will always be false during SSR):"
            echo "::error::$VIOLATIONS"
            echo "Move the featureFlags check inside a 'use client' component."
            echo "Emergency bypass (opening-night hotfix only): include [skip-demo-flag-check] in the commit message."
            exit 1
          fi
          echo "All demo feature flag checks are in client components"

      - name: Check scripts route review-texts writes through safeWriteReview
        run: |
          # Joe Turner postmortem P0 #2 (2026-04-26): every write to data/review-texts/
          # MUST go through safeWriteReview unless the script is on the explicit
          # allowlist (.review-write-guard-exempt.txt), which is reserved for the
          # topology-mover scripts (move/delete/rename paths that the per-field
          # guard cannot protect). See memory/feedback_locked_files_enrichment_chain.md.
          #
          # Detection: scripts that have fs.writeFileSync with a review-texts-
          # derived first argument (filePath/fullPath/path.join(showDir/...))
          # but neither (a) import safeWriteReview from review-write-guard, nor
          # (b) appear on the allowlist.
          ALLOWLIST=".review-write-guard-exempt.txt"
          if [ ! -f "$ALLOWLIST" ]; then
            echo "::error::missing allowlist file: $ALLOWLIST"
            exit 1
          fi
          # Extract just the filenames from the allowlist (strip comments + reason)
          EXEMPT=$(grep -v '^[[:space:]]*#' "$ALLOWLIST" | grep -v '^[[:space:]]*$' | awk -F' --' '{print $1}' | tr -d ' ')

          VIOLATIONS=""
          for f in scripts/*.js; do
            name=$(basename "$f")
            # Guard itself is exempt
            if [ "$name" = "review-write-guard.js" ]; then continue; fi
            # Allowlist exemption (file granularity for now; tighten to call-site
            # later when the topology card lands)
            if echo "$EXEMPT" | grep -Fxq "$name"; then continue; fi
            # Match writeFileSync calls where the first argument resolves to a
            # review-texts path. Broadened 2026-04-26 (ship-check P1) to cover:
            #   - common variable names (filePath, fullPath, filepath, fp, fullpath, newPath, targetPath, outPath)
            #   - path.join(...) starting with show-related dir vars (showDir, dirPath, REVIEW_TEXTS_DIR, REVIEW_TEXTS_BASE, reviewsDir, rtDir)
            #   - path.join('data', 'review-texts', ...) string-prefix patterns
            # Additional heuristic: file must reference review-texts somewhere AND
            # NOT import safeWriteReview to count as a violator.
            if grep -qE "fs\.writeFileSync\((\bfilePath\b|\bfullPath\b|\bfilepath\b|\bfp\b|\bfullpath\b|\bnewPath\b|\btargetPath\b|\boutPath\b|path\.join\((showDir|dirPath|REVIEW_TEXTS_DIR|REVIEW_TEXTS_BASE|reviewsDir|rtDir|REVIEW_TEXTS_ROOT)|path\.join\(['\"]data['\"], ['\"]review-texts['\"])" "$f" \
              && grep -qE "(review-texts|REVIEW_TEXTS_DIR|REVIEW_TEXTS_BASE|rtDir|reviewsDir|REVIEW_TEXTS_ROOT)" "$f" \
              && ! grep -q "safeWriteReview" "$f"; then
              VIOLATIONS="$VIOLATIONS $name"
            fi
          done
          if [ -n "$VIOLATIONS" ]; then
            echo "::error::Scripts write directly to review-texts/ without safeWriteReview:"
            for v in $VIOLATIONS; do echo "  $v"; done
            echo "Either:"
            echo "  (a) Import { safeWriteReview } from './lib/review-write-guard' and route the write through it."
            echo "  (b) For topology operations (move/delete/rename), add the file to .review-write-guard-exempt.txt with a one-line reason."
            exit 1
          fi
          echo "All detected review-texts writes route through safeWriteReview"

      - name: Check scripts route reviews.json writes through rebuild-all-reviews
        run: |
          # data/reviews.json is a derived aggregate produced by
          # scripts/rebuild-all-reviews.js. New scripts MUST NOT write to it
          # directly — they should modify the source-of-truth files in
          # data/review-texts/<showId>/ and let the rebuild produce the
          # aggregate. Direct writes bypass the rebuild's audit trail
          # (rebuild-score-drift, rebuild-regression, opening-night-completeness).
          #
          # See Notion card 351637c5-416f-81f8-a8fd-c3e0570f1454 for the
          # broader plan to extend this to shows.json + audience-buzz.json
          # once those acquire canonical writer helpers.
          ALLOWLIST=".reviews-json-write-exempt.txt"
          if [ ! -f "$ALLOWLIST" ]; then
            echo "::error::missing allowlist file: $ALLOWLIST"
            exit 1
          fi
          EXEMPT=$(grep -v '^[[:space:]]*#' "$ALLOWLIST" | grep -v '^[[:space:]]*$' | awk -F' --' '{print $1}' | tr -d ' ')
          VIOLATIONS=""
          for f in scripts/*.js; do
            name=$(basename "$f")
            if echo "$EXEMPT" | grep -Fxq "$name"; then continue; fi
            # Two-condition check:
            # (1) File references data/reviews.json (literal or path.join
            #     multi-arg shape).
            # (2) File has fs.writeFileSync to a target that's a known
            #     reviews-path constant OR a literal data/reviews.json string.
            #     Includes targetPath as a common indirection (realpathSync).
            #     Excludes outPath (too generic — audit scripts use it for
            #     report files).
            if grep -qE "['\"][^'\"]*data/reviews\.json['\"]|path\.join\([^)]*['\"]data['\"][^)]*['\"]reviews\.json['\"]" "$f" \
              && grep -qE "fs\.writeFileSync\([^)]*(REVIEWS_PATH|reviewsTmpPath|reviewsJsonPath|reviewsPath|targetPath|['\"][^'\"]*data/reviews\.json['\"])" "$f"; then
              VIOLATIONS="$VIOLATIONS $name"
            fi
          done
          if [ -n "$VIOLATIONS" ]; then
            echo "::error::Scripts write data/reviews.json directly (bypasses rebuild audit trail):"
            for v in $VIOLATIONS; do echo "  $v"; done
            echo "Fix: modify the source files in data/review-texts/<showId>/ instead, then trigger 'Rebuild Reviews Data'."
            echo "If this script genuinely must write reviews.json (e.g., it IS the rebuild), add it to .reviews-json-write-exempt.txt with a one-line reason."
            exit 1
          fi
          echo "All detected reviews.json writes route through rebuild-all-reviews"

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Only run on schedule (daily) — not every push, to avoid noise
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: npm audit (critical only)
        run: npm audit --audit-level=critical

  awards-data-freshness:
    name: Awards Data Freshness
    runs-on: ubuntu-latest
    # 3-minute timeout was hitting on every workflow_dispatch — the full-
    # history clone (fetch-depth: 0) alone takes ~3 min on this repo, leaving
    # zero budget for the actual freshness check. Bumped to 8 min on 2026-05-17
    # (Notion 363637c5-416f-8137) so the check actually runs to completion.
    timeout-minutes: 8
    # Schedule + manual only — never block unrelated PRs.
    # Surfaces in daily digest via getWorkflowRunSummary; promotes from
    # "operator forgot annual update" silent rot to a loud weekly failure.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Need full history so `git log -- data/awards.json` finds the last
          # touch even if it's older than the default shallow-fetch depth.
          fetch-depth: 0
      - name: Check awards.json was updated within 14 months
        run: |
          # Annual awards cadence (Tony, Pulitzer, DD, OCC, DL, NYDCC, Olivier)
          # means data/awards.json should change at least once per ceremony year.
          # 14 months = 12-month annual cycle + 2 months grace for late ceremonies
          # (Tonys were September 2021 due to COVID).
          #
          # If this fires, run the annual update — see memory/awards-annual-update.md.
          MAX_DAYS=425  # ~14 months
          LAST_TS=$(git log -1 --format=%ct -- data/awards.json)
          if [ -z "$LAST_TS" ]; then
            echo "::error::No git history found for data/awards.json"
            exit 1
          fi
          NOW=$(date +%s)
          AGE_DAYS=$(( (NOW - LAST_TS) / 86400 ))
          LAST_DATE=$(date -u -d "@$LAST_TS" +%Y-%m-%d 2>/dev/null || date -u -r "$LAST_TS" +%Y-%m-%d)
          echo "data/awards.json last touched ${AGE_DAYS} days ago (${LAST_DATE})"
          if [ "$AGE_DAYS" -gt "$MAX_DAYS" ]; then
            echo "::error::data/awards.json is ${AGE_DAYS} days stale (max ${MAX_DAYS}). Run the annual awards update — see memory/awards-annual-update.md"
            exit 1
          fi
          echo "Awards data freshness OK (within ${MAX_DAYS}-day window)"
      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: 'Awards Data Stale (>14 months)'
          severity: 'warning'
          discord_webhook: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}

  design-tokens-lint:
    name: Design Token Drift Guard
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Lint design tokens
        # Forbids border-gray/slate/zinc-*, bg-gray-700/800/900/950, bg-slate/zinc-*,
        # text-slate/zinc-* in src/. Prior sessions spent hours cleaning up drift
        # (2026-04-12: 129 zinc refs, 2026-04-13: 44 gray/slate refs). Without a
        # gate, drift reappears in ~2 weeks. Exemption: `// design-lint-ok: <reason>`.
        # See memory/design-system.md for the canonical token list.
        run: node scripts/lint-design-tokens.js
      - name: Check brand-tokens.json ↔ tailwind.config.ts sync
        # public/brand-tokens.json feeds Claude Design, Figma, Canva, email
        # templates, and the brand kit — tailwind.config.ts feeds the running
        # site. They must agree pixel-for-pixel. This script verifies 16 tracked
        # color values match between the two files.
        run: node scripts/check-brand-tokens-sync.js

  typescript-check:
    name: TypeScript Check
    # Skip on Dependabot PRs — they don't have access to REVIEW_TEXTS_TOKEN, so
    # checkout-core-data fails; root tsc transitively imports data/*.json files
    # via resolveJsonModule and breaks without them. Same pattern as unit-tests.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        # Need node_modules for tsc to resolve imports.
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Checkout core data
        # src/lib/data-*.ts imports data/shows.json, data/reviews.json, etc. via
        # resolveJsonModule. Without checkout-core-data tsc fails with TS2307 on
        # the JSON imports. Same composite action used by unit-tests.
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
      - name: Generate gitignored manifests
        # data/cast-manifest.json and data/actor-slugs.json are gitignored
        # (built in prebuild) but src/lib/data-actors.ts, data-cast-obc.ts,
        # and data-tony-nominees.ts import them via resolveJsonModule.
        # Without these tsc fails with TS2307. Mirror prebuild.sh.
        run: |
          node scripts/build-actor-slugs-manifest.js
          node scripts/build-cast-manifest.js
      - name: tsc — root (src/, app/, tests/)
        # Catches type errors in app code. Root tsconfig excludes scripts/.
        # Currently green on main — this gate ensures it stays that way.
        run: npx tsc --noEmit
      - name: tsc — scripts/llm-scoring/
        # if: always() so this runs even if root tsc fails (root tsc covers
        # src/app/tests/; llm-scoring is scoped separately and must not be
        # masked by an unrelated root failure).
        if: always()
        # Catches type errors in the llm-scoring pipeline. Scoped via
        # scripts/llm-scoring/tsconfig.json because the parent
        # scripts/tsconfig.json has pre-existing rootDir errors in
        # unrelated scripts (audit-tony-all-seasons, scrape-grosses, etc).
        # Why this gate exists: 2026-05-16 — the systematic-tier fix
        # shipped a 12-error consumer mismatch (evaluate.ts:446-448)
        # that no CI check caught because root tsc skips scripts/. Adding
        # this gate would have failed the merge and prevented the bug.
        run: npx tsc --noEmit -p scripts/llm-scoring/tsconfig.json
      - name: next lint
        # if: always() so lint runs even if tsc above fails — they're independent
        # gates and either failure should surface in this job.
        # Why this gate exists: 2026-05-23 — next.config.js sets
        # eslint.ignoreDuringBuilds:true to skip lint inside vercel build (saves
        # ~20s on hot-path deploys). This step is the replacement CI gate so
        # lint regressions are still caught before merge. Default behavior
        # (no --max-warnings) matches the prior in-build behavior: errors fail,
        # existing warnings (e.g. <img> tag advisories) don't block merges.
        if: always()
        run: npx next lint
      - name: Audit NFT-excluded runtime reads
        # if: always() so this runs even if tsc/lint fail above — independent gate.
        # Why this gate exists: 2026-05-23 — commit e2154a1b23 added data/cast/**
        # to next.config.js outputFileTracingExcludes as a belt-and-suspenders
        # guard, but src/lib/data-actors.ts + data-cast-obc.ts still read those
        # files dynamically at runtime. In production the directory was missing
        # from the bundle, so every /cast/[slug] returned 404 silently (locally
        # everything worked because data/cast/ exists on disk). This audit
        # detects the same conflict statically before it ships.
        if: always()
        run: node scripts/audit-nft-excluded-runtime-reads.js

  unit-tests:
    name: Unit Tests
    # Skip on Dependabot PRs — they don't have access to REVIEW_TEXTS_TOKEN
    # (separate secret namespace) so checkout-core-data fails. Dependabot updates
    # touch lockfiles + workflow YAML, not test logic; lint-workflows + dependency-audit +
    # design-tokens-lint cover the relevant bumps.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Install dependencies
        # Needed by review-guards regression tests, which transitively import
        # gather-reviews.js → scraper.js → playwright. The other unit tests
        # don't need it but the install is fast (cached).
        run: npm ci --prefer-offline --no-audit
      - name: Checkout core data
        # review-guards regression tests exercise detectCrossShowUrlMismatch,
        # which reads data/shows.json to validate that Monte Cristo URLs are
        # rejected for Becky Shaw etc. Without the slug index the guard is a no-op.
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
      - name: Refresh gold lists from current reviews
        # compute-critic-score.test checks parity between the committed gold list
        # and the live computeCriticScore(). Reviews change daily via the private
        # data repo; the committed gold list lags. Regenerating here ensures the
        # test always sees a gold list consistent with the current reviews.json.
        run: node scripts/compute-gold-lists.js
      - name: Run unit tests (no-data-dependency)
