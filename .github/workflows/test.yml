      # (venue-classification.js) reuses isPlaceholderVenue (the census script)
      # to fail closed on ShowScore neighbourhood-blob venues at write time.
      # Colocated test lives in tests/unit/ (globbed already); the two .js
      # source files need explicit listing (no scripts/lib/** broad glob) —
      # path-listed so a solo edit triggers CI.
      - 'scripts/lib/venue-classification.js'
      - 'scripts/audit-placeholder-venues.js'
      - 'scripts/lib/show-score-status.js'
