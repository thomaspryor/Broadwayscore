name: Test Suite

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/validate-data.js'
      - 'scripts/validate-aggregator-truth.js'
      - 'scripts/validate-market-expansion.js'
      - 'scripts/validate-mobile-shows.js'
      - 'scripts/audit-review-contamination.js'
      - 'scripts/audit-regex-patterns.js'
      - 'scripts/lib/content-quality.js'
      - 'public/data/mobile-shows.json'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.*'
      - 'tsconfig.*'
      - 'tailwind.config.*'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
  schedule:
    # Run daily at 6 AM UTC (1 AM EST) to catch issues
    # TODO: Change to weekly (0 6 * * 1) once review inventory is stable
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Which tests to run'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - data-only
          - e2e-only
          - visual-only
      update_snapshots:
        description: 'Update visual regression baselines'
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  lint-workflows:
    name: Lint Workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install actionlint
        run: |
          ACTIONLINT_VERSION=1.7.7
          curl -sL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" | tar xz
          sudo mv actionlint /usr/local/bin/
      - name: Lint workflow files
        run: |
          # Emergency escape hatch (opening-night hotfixes only): if the
          # commit message contains "[skip-actionlint]", this gate exits 0.
          # Symmetric with [skip-demo-flag-check] above. Use sparingly; the
          # most likely cause of needing it is a transient actionlint bump
          # that adds a new rule mid-incident. Follow up with a real fix.
          if git log -1 --format=%B | grep -Fq "[skip-actionlint]"; then
            echo "::warning::actionlint check skipped via [skip-actionlint] commit-message tag"
            exit 0
          fi
          actionlint -color -shellcheck="" \
            -ignore 'maximum number of inputs' \
            .github/workflows/*.yml
      - name: Check checkout-core-data has matching push-core-data
        run: |
          # Workflows that checkout core data AND have write permissions
          # must also push-core-data, or changes get lost on next deploy.
          MISSING=""
          for f in .github/workflows/*.yml; do
            HAS_CHECKOUT=$(grep -c 'checkout-core-data' "$f" 2>/dev/null || echo 0)
            HAS_WRITE=$(grep -c 'contents: write' "$f" 2>/dev/null || echo 0)
            HAS_PUSH=$(grep -c 'push-core-data' "$f" 2>/dev/null || echo 0)
            if [ "$HAS_CHECKOUT" -gt 0 ] && [ "$HAS_WRITE" -gt 0 ] && [ "$HAS_PUSH" -eq 0 ]; then
              MISSING="$MISSING $(basename $f)"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "::error::Workflows using checkout-core-data with write permissions but missing push-core-data:$MISSING"
            echo "Add push-core-data action to sync changes back to the private repo."
            exit 1
          fi
          echo "All writable workflows with checkout-core-data have matching push-core-data"

      - name: Check workflows don't git-add private core data files
        run: |
          # Core data files live in the private broadway-scorecard-data repo
          # and are gitignored here. They sync via push-core-data after each
          # workflow. Any `git add data/<core-file>` in this repo is either a
          # silent no-op (diff on an ignored file is always clean) or a hard
          # failure (fatal: ignored by one of your .gitignore files).
          # 2026-04-14: update-lottery-rush.yml hit the hard failure; 5 other
          # workflows silently failed the same way for weeks.
          #
          # The authoritative core-data list is in push-core-data/action.yml
          # (the loop over files to copy to /tmp/core-data-checkout). Keep
          # these in sync. Force-adds (`git add -f`) are allowed — they are
          # explicit overrides, used legitimately for opening-night-sent.json.
          CORE_FILES="shows.json reviews.json grosses.json grosses-history.json commercial.json audience-buzz.json critic-consensus.json critic-registry.json outlet-registry.json diary-shows.json audience-reviews-lbo.json followers.json subscribers.json subscribers-westend.json"
          VIOLATIONS=""
          for f in .github/workflows/*.yml; do
            for core in $CORE_FILES; do
              # Match `git add` (no -f/--force) then data/<core>. Reject both
              # `git add data/shows.json` and `git add a b data/shows.json c`.
              if grep -E "^[[:space:]]*git add([[:space:]]+[^-][^[:space:]]*)*[[:space:]]+data/$core([[:space:]]|$)" "$f" >/dev/null 2>&1; then
                VIOLATIONS="$VIOLATIONS $(basename "$f"):$core"
              fi
            done
          done
          if [ -n "$VIOLATIONS" ]; then
            echo "::error::Workflows git-add private core data files:$VIOLATIONS"
            echo "These files are gitignored and synced via push-core-data."
            echo "Remove them from git-add lines. See .github/workflows/CLAUDE.md §Data Sync Architecture."
            exit 1
          fi
          echo "No workflows git-add private core data files"

      - name: Check for tracked symlinks or gitlinks
        run: |
          # Symlinks (120000) and gitlinks (160000) to local paths dangle in CI.
          # This has caused cascading workflow failures 3 times (reviews.json,
          # .core-data-checkout, .claude/worktrees/fix-ci-noise).
          BAD=$(git ls-files --stage | grep -E "^(120000|160000)" || true)
          if [ -n "$BAD" ]; then
            echo "::error::Tracked symlinks or gitlinks found — these break CI:"
            echo "$BAD"
            echo "Fix: git rm --cached <path> and add to .gitignore"
            exit 1
          fi
          echo "No tracked symlinks or gitlinks"

      - name: Check scraping workflows have multi-service fallback
        run: |
          # Any workflow that uses SCRAPINGBEE_API_KEY for actual scraping
          # must also have BRIGHTDATA_TOKEN so there's always a fallback.
          # Workflows exempt from this rule. Two categories:
          # (A) Health checks / credential validators — SB key checked for validity, not scraping
          # (B) Scripts require JS rendering — BD (raw HTML) can't replace SB here; correct
          #     fallback is SB → Playwright (already implemented in the scripts themselves)
          EXEMPT="
            check-secrets-health.yml
            opening-night-orchestrator.yml
            check-cookie-health.yml
            data-health-check.yml
            backfill-historical-metadata.yml
            check-show-freshness.yml
            scrape-alltime-grosses.yml
            weekly-grosses.yml
            reddit-engagement-digest.yml
            scrape-dtli-show-score.yml
          "
          VIOLATIONS=""
          for f in .github/workflows/*.yml; do
            name=$(basename "$f")
            # Skip exempt workflows
            if echo "$EXEMPT" | grep -qw "$name"; then continue; fi
            if grep -q "SCRAPINGBEE_API_KEY" "$f" && ! grep -q "BRIGHTDATA_TOKEN" "$f"; then
              VIOLATIONS="$VIOLATIONS $name"
            fi
          done
          if [ -n "$VIOLATIONS" ]; then
            echo "::error::Scraping workflows must use scraper.js with BD+SB fallback, not a single service."
            echo "::error::Missing BRIGHTDATA_TOKEN in:$VIOLATIONS"
            echo "Fix: add BRIGHTDATA_TOKEN: \${{ secrets.BRIGHTDATA_TOKEN }} to the scraping step's env block."
            echo "If this workflow legitimately uses only SB (health check, etc), add it to the EXEMPT list in test.yml."
            exit 1
          fi
          echo "All scraping workflows have multi-service fallback"

      - name: Check Theatr token is not passed to unauthorized workflows
        run: |
          # THEATR_REFRESH_TOKEN burns on use (Theatr rotates refresh tokens).
          # Only two workflows may use it:
          #   - update-theatr.yml (the single authorized caller)
          #   - rotate-theatr-token.yml (one-click manual rotation)
          # Any other workflow that passes this secret will silently burn the
          # token chain — fetch-all-image-formats.yml did this for 2 weeks
          # before it was caught (April 2026).
          ALLOWED="update-theatr.yml rotate-theatr-token.yml"
          VIOLATIONS=""
          for f in .github/workflows/*.yml; do
            name=$(basename "$f")
            if echo "$ALLOWED" | grep -qw "$name"; then continue; fi
            # Match actual secret usage, not comments
            if grep -E '^\s+THEATR_REFRESH_TOKEN:\s+\$\{\{' "$f" >/dev/null 2>&1; then
              VIOLATIONS="$VIOLATIONS $name"
            fi
          done
          if [ -n "$VIOLATIONS" ]; then
            echo "::error::THEATR_REFRESH_TOKEN must only be used by update-theatr.yml and rotate-theatr-token.yml"
            echo "::error::Unauthorized usage in:$VIOLATIONS"
            echo "Theatr rotates refresh tokens on every use. Multiple callers race and burn the token chain."
            echo "Use data/theatr-image-cache.json (populated by update-theatr.yml) instead of calling the API directly."
            exit 1
          fi
          echo "Theatr token restricted to authorized workflows only"

      - name: Check demo feature flags not used in server components
        run: |
          # Demo feature flags require window (runtime) and MUST be checked
          # inside 'use client' components. In server components / SSR pages,
          # isDemo() returns false and the feature silently disappears.
          # See: fix 7770e1b567 (theater scorecard invisible on demo).
          #
          # Emergency escape hatch (opening-night hotfixes only): if the
          # commit message contains the literal "[skip-demo-flag-check]",
          # this gate exits 0. Use sparingly and follow up with a real fix.
          if git log -1 --format=%B | grep -Fq "[skip-demo-flag-check]"; then
            echo "::warning::demo-flag check skipped via [skip-demo-flag-check] commit-message tag"
            exit 0
          fi
          DEMO_FLAGS="theaterScorecard|showPageRedesign|userAccounts|showtimes"
          VIOLATIONS=""
          for f in $(grep -rlE "featureFlags\.(${DEMO_FLAGS})" src/ 2>/dev/null || true); do
            # Check if file has 'use client' directive
            if ! head -3 "$f" | grep -q "'use client'"; then
              VIOLATIONS="$VIOLATIONS $f"
            fi
          done
          if [ -n "$VIOLATIONS" ]; then
            echo "::error::Demo feature flags used in server components (will always be false during SSR):"
            echo "::error::$VIOLATIONS"
            echo "Move the featureFlags check inside a 'use client' component."
            echo "Emergency bypass (opening-night hotfix only): include [skip-demo-flag-check] in the commit message."
            exit 1
          fi
          echo "All demo feature flag checks are in client components"

      - name: Check scripts route review-texts writes through safeWriteReview
        run: |
          # Joe Turner postmortem P0 #2 (2026-04-26): every write to data/review-texts/
          # MUST go through safeWriteReview unless the script is on the explicit
          # allowlist (.review-write-guard-exempt.txt), which is reserved for the
          # topology-mover scripts (move/delete/rename paths that the per-field
          # guard cannot protect). See memory/feedback_locked_files_enrichment_chain.md.
          #
          # Detection: scripts that have fs.writeFileSync with a review-texts-
          # derived first argument (filePath/fullPath/path.join(showDir/...))
          # but neither (a) import safeWriteReview from review-write-guard, nor
          # (b) appear on the allowlist.
          ALLOWLIST=".review-write-guard-exempt.txt"
          if [ ! -f "$ALLOWLIST" ]; then
            echo "::error::missing allowlist file: $ALLOWLIST"
            exit 1
          fi
          # Extract just the filenames from the allowlist (strip comments + reason)
          EXEMPT=$(grep -v '^[[:space:]]*#' "$ALLOWLIST" | grep -v '^[[:space:]]*$' | awk -F' --' '{print $1}' | tr -d ' ')

          VIOLATIONS=""
          for f in scripts/*.js; do
            name=$(basename "$f")
            # Guard itself is exempt
            if [ "$name" = "review-write-guard.js" ]; then continue; fi
            # Allowlist exemption (file granularity for now; tighten to call-site
            # later when the topology card lands)
            if echo "$EXEMPT" | grep -Fxq "$name"; then continue; fi
            # Match writeFileSync calls where the first argument resolves to a
            # review-texts path. Broadened 2026-04-26 (ship-check P1) to cover:
            #   - common variable names (filePath, fullPath, filepath, fp, fullpath, newPath, targetPath, outPath)
            #   - path.join(...) starting with show-related dir vars (showDir, dirPath, REVIEW_TEXTS_DIR, REVIEW_TEXTS_BASE, reviewsDir, rtDir)
            #   - path.join('data', 'review-texts', ...) string-prefix patterns
            # Additional heuristic: file must reference review-texts somewhere AND
            # NOT import safeWriteReview to count as a violator.
            if grep -qE "fs\.writeFileSync\((\bfilePath\b|\bfullPath\b|\bfilepath\b|\bfp\b|\bfullpath\b|\bnewPath\b|\btargetPath\b|\boutPath\b|path\.join\((showDir|dirPath|REVIEW_TEXTS_DIR|REVIEW_TEXTS_BASE|reviewsDir|rtDir|REVIEW_TEXTS_ROOT)|path\.join\(['\"]data['\"], ['\"]review-texts['\"])" "$f" \
              && grep -qE "(review-texts|REVIEW_TEXTS_DIR|REVIEW_TEXTS_BASE|rtDir|reviewsDir|REVIEW_TEXTS_ROOT)" "$f" \
              && ! grep -q "safeWriteReview" "$f"; then
              VIOLATIONS="$VIOLATIONS $name"
            fi
          done
          if [ -n "$VIOLATIONS" ]; then
            echo "::error::Scripts write directly to review-texts/ without safeWriteReview:"
            for v in $VIOLATIONS; do echo "  $v"; done
            echo "Either:"
            echo "  (a) Import { safeWriteReview } from './lib/review-write-guard' and route the write through it."
            echo "  (b) For topology operations (move/delete/rename), add the file to .review-write-guard-exempt.txt with a one-line reason."
            exit 1
          fi
          echo "All detected review-texts writes route through safeWriteReview"

      - name: Check scripts route reviews.json writes through rebuild-all-reviews
        run: |
          # data/reviews.json is a derived aggregate produced by
          # scripts/rebuild-all-reviews.js. New scripts MUST NOT write to it
          # directly — they should modify the source-of-truth files in
          # data/review-texts/<showId>/ and let the rebuild produce the
          # aggregate. Direct writes bypass the rebuild's audit trail
          # (rebuild-score-drift, rebuild-regression, opening-night-completeness).
          #
          # See Notion card 351637c5-416f-81f8-a8fd-c3e0570f1454 for the
          # broader plan to extend this to shows.json + audience-buzz.json
          # once those acquire canonical writer helpers.
          ALLOWLIST=".reviews-json-write-exempt.txt"
          if [ ! -f "$ALLOWLIST" ]; then
            echo "::error::missing allowlist file: $ALLOWLIST"
            exit 1
          fi
          EXEMPT=$(grep -v '^[[:space:]]*#' "$ALLOWLIST" | grep -v '^[[:space:]]*$' | awk -F' --' '{print $1}' | tr -d ' ')
          VIOLATIONS=""
          for f in scripts/*.js; do
            name=$(basename "$f")
            if echo "$EXEMPT" | grep -Fxq "$name"; then continue; fi
            # Two-condition check:
            # (1) File references data/reviews.json (literal or path.join
            #     multi-arg shape).
            # (2) File has fs.writeFileSync to a target that's a known
            #     reviews-path constant OR a literal data/reviews.json string.
            #     Includes targetPath as a common indirection (realpathSync).
            #     Excludes outPath (too generic — audit scripts use it for
            #     report files).
            if grep -qE "['\"][^'\"]*data/reviews\.json['\"]|path\.join\([^)]*['\"]data['\"][^)]*['\"]reviews\.json['\"]" "$f" \
              && grep -qE "fs\.writeFileSync\([^)]*(REVIEWS_PATH|reviewsTmpPath|reviewsJsonPath|reviewsPath|targetPath|['\"][^'\"]*data/reviews\.json['\"])" "$f"; then
              VIOLATIONS="$VIOLATIONS $name"
            fi
          done
          if [ -n "$VIOLATIONS" ]; then
            echo "::error::Scripts write data/reviews.json directly (bypasses rebuild audit trail):"
            for v in $VIOLATIONS; do echo "  $v"; done
            echo "Fix: modify the source files in data/review-texts/<showId>/ instead, then trigger 'Rebuild Reviews Data'."
            echo "If this script genuinely must write reviews.json (e.g., it IS the rebuild), add it to .reviews-json-write-exempt.txt with a one-line reason."
            exit 1
          fi
          echo "All detected reviews.json writes route through rebuild-all-reviews"

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Only run on schedule (daily) — not every push, to avoid noise
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: npm audit (critical only)
        run: npm audit --audit-level=critical

  design-tokens-lint:
    name: Design Token Drift Guard
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Lint design tokens
        # Forbids border-gray/slate/zinc-*, bg-gray-700/800/900/950, bg-slate/zinc-*,
        # text-slate/zinc-* in src/. Prior sessions spent hours cleaning up drift
        # (2026-04-12: 129 zinc refs, 2026-04-13: 44 gray/slate refs). Without a
        # gate, drift reappears in ~2 weeks. Exemption: `// design-lint-ok: <reason>`.
        # See memory/design-system.md for the canonical token list.
        run: node scripts/lint-design-tokens.js

  unit-tests:
    name: Unit Tests
    # Skip on Dependabot PRs — they don't have access to REVIEW_TEXTS_TOKEN
    # (separate secret namespace) so checkout-core-data fails. Dependabot updates
    # touch lockfiles + workflow YAML, not test logic; lint-workflows + dependency-audit +
    # design-tokens-lint cover the relevant bumps.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Install dependencies
        # Needed by review-guards regression tests, which transitively import
        # gather-reviews.js → scraper.js → playwright. The other unit tests
        # don't need it but the install is fast (cached).
        run: npm ci --prefer-offline --no-audit
      - name: Checkout core data
        # review-guards regression tests exercise detectCrossShowUrlMismatch,
        # which reads data/shows.json to validate that Monte Cristo URLs are
        # rejected for Becky Shaw etc. Without the slug index the guard is a no-op.
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
      - name: Run unit tests (no-data-dependency)
        run: |
          node --test tests/unit/regression-guards.test.mjs tests/unit/sample.test.mjs tests/unit/sanity.test.mjs tests/unit/score-conversion-rules.test.mjs tests/unit/score-routing.test.mjs tests/unit/email-capture-integrity.test.mjs tests/unit/placeholder-images.test.mjs tests/unit/compute-critic-score.test.mjs tests/unit/wrong-production-autoclear.test.mjs tests/unit/clear-failure-flags.test.mjs tests/unit/is-includable-for-rebuild.test.mjs tests/unit/verify-fetched-url.test.mjs tests/unit/review-write-guard.test.mjs tests/unit/review-file-writer-roundup-autoflag.test.mjs tests/unit/theater-scorecard-validators.test.mjs tests/unit/theater-scorecard-regression.test.mjs tests/unit/bww-roundup-extractor.test.mjs tests/unit/bww-rr-discover.test.mjs tests/unit/protected-fields-sync.test.mjs tests/unit/protected-fields-three-way-sync.test.mjs tests/unit/human-review-score-provisional.test.mjs tests/unit/ingest-manual-review-fields.test.mjs tests/unit/ingest-manual-review-collision.test.mjs tests/unit/recover-manual-review-score.test.mjs tests/unit/poller-blocklist.test.mjs tests/unit/block-review-cli.test.mjs tests/unit/no-reset-rsync-push-pattern.test.mjs tests/unit/opening-night-poll-cadence.test.mjs tests/unit/opening-night-bd-gate.test.mjs tests/unit/opening-night-serp-backup-integration.test.mjs tests/unit/opening-night-checks-juan-a-ramirez-bypass.test.mjs tests/unit/opening-night-bypass-corpus.test.mjs tests/unit/orchestrator-guardian-dispatch.test.mjs tests/unit/pending-strand-routing.test.mjs tests/unit/review-text-scoreable.test.mjs tests/unit/paywall-detector.test.mjs tests/unit/content-quality-paywall-subscriber.test.mjs tests/unit/content-quality-wrong-production-autocleared.test.mjs tests/unit/pending-gap-classification.test.mjs tests/unit/broadcast-state.test.mjs tests/unit/reconcile-broadcast-state.test.mjs tests/unit/orphan-pending-decision.test.mjs tests/unit/input-builder-market-label.test.mjs tests/unit/multi-critic-serp.test.mjs tests/unit/llm-fallback-partial.test.mjs tests/unit/nypost-inline-star-recovery.test.mjs tests/unit/tour-forward-tense.test.mjs tests/unit/gather-reviews-collision.test.mjs tests/unit/venue-aliases.test.mjs tests/unit/long-runner-registry.test.mjs tests/unit/url-year-conflict-hint.test.mjs tests/unit/market-routing.test.mjs tests/unit/playbill-verdict-discover.test.mjs tests/unit/lbo-roundup-page-validation.test.mjs tests/unit/lbo-individual-star-extraction.test.mjs tests/unit/is-likely-stale-roundup-flag.test.mjs tests/unit/is-likely-stale-suspected-misattribution.test.mjs tests/unit/is-likely-stale-wrong-show.test.mjs tests/unit/is-likely-stale-wrong-production.test.mjs tests/unit/wrong-production-setters-honor-manual-clear.test.mjs tests/unit/is-scoreable-suspected-misattribution.test.mjs tests/unit/seo-anomaly-detection.test.mjs tests/unit/poller-idempotency.test.mjs tests/unit/article-extractor-multi-article.test.mjs tests/unit/byline-normalization.test.mjs tests/unit/dom-article-extractor.test.mjs tests/unit/score-extractor-prepass.test.mjs tests/unit/verify-all-scored.test.mjs tests/unit/review-write-guard-topology.test.mjs tests/unit/collect-review-texts-rename-helper.test.mjs tests/unit/backfill-html-override-rename.test.mjs

          npx tsx --test tests/unit/engine.test.ts tests/unit/scoring-parity.test.ts tests/unit/llm-scoring-stale-roundup-flag.test.mjs tests/unit/multi-show-detector-punct-boundary.test.mjs

      - name: Run scraper-cookie-wiring tests (direct exec, no --test wrapper)
        # This file globally monkey-patches `https.get` and `https.request`
        # to capture outbound calls without making real requests. When run
        # via `node --test`, the deferred `setImmediate` callbacks have
        # intermittently tripped a worker-IPC `Unable to deserialize cloned
        # data` error in CI on Node 20 — even when the file is the sole
        # invocation (Item 5 of the systematic CI plan, 2026-04-28).
        #
        # Running the file DIRECTLY (no --test wrapper) bypasses Node's
        # subprocess test runner entirely. The `node:test` module's
        # describe/test calls auto-register and auto-execute when the file
        # is loaded; assertion failures throw and set process.exitCode.
        # No V8 IPC serialization → no deserialize bug. 8/8 subtests still
        # run, just reported in-process via TAP to stdout.
        # Regression: 2026-04-30 — `node --test` started emitting the
        # deserialize error every run (previous isolation insufficient).
        run: node tests/unit/scraper-cookie-wiring.test.mjs

      - name: Run review-guards regression tests
        # Tests opening-night fix #12-#14 + Times UK heuristic guard + rebuild auto-clear keyword check.
        # All tests require() the real functions from scripts/lib/review-guards.js per CLAUDE.md §15.
        # If this fails, a guard regression slipped through — fix the underlying logic, not the test.
        run: node scripts/test-opening-night-fixes.js

      - name: Run email broadcast rendering tests
        # Tests buildBroadcastOpeningNightHtml output: zero-bucket filtering, color swatches,
        # Critics' Take rendering, multi-show coalescing. Catches Apr 2026 regression class
        # where label rows diverged between the two email template functions.
        run: node scripts/test-email-broadcast.js

      - name: Check image aspect ratios for changed posters/thumbnails/heroes
        # Catches the evita-west-end-2025 class (commit a71c3defe4) where a
        # parallel session committed a wide 2.87:1 production still as
        # poster.webp — it then rendered as a vertical sliver inside the
        # show page's aspect-[2/3] object-cover container.
        # Only checks files changed in this push/PR — pre-existing legacy
        # violations (~1,179 historical thumbnails) are tracked separately
        # via the audit-images-llm.js wrong_aspect remediation pipeline.
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="origin/${{ github.base_ref }}...HEAD"
          else
            BEFORE="${{ github.event.before }}"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              RANGE="HEAD~1..HEAD"
            else
              RANGE="${BEFORE}..${{ github.sha }}"
            fi
          fi
          node scripts/check-image-aspect.js --changed "$RANGE"

  data-validation:
    name: Data Validation
    # See unit-tests above — Dependabot can't auth to private data repo.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5


      - name: Checkout core data
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
      - name: Checkout aggregator-archive (private repo)
        uses: ./.github/actions/checkout-aggregator-archive
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
      - name: Verify core data freshness
        run: |
          # Canary: shows.json must exist and be valid after checkout-core-data
          node -e "const d=JSON.parse(require('fs').readFileSync('data/shows.json','utf8'));
                   const shows=d.shows||d; if(!shows.length) throw new Error('shows.json is empty');
                   console.log('shows.json: '+shows.length+' shows');"
          node -e "const d=JSON.parse(require('fs').readFileSync('data/reviews.json','utf8'));
                   const reviews=d.reviews||d; if(!reviews.length) throw new Error('reviews.json is empty');
                   console.log('reviews.json: '+reviews.length+' reviews');"

      - name: Guard — no copyrighted content in public repo
        run: |
          # Fail immediately if ANY review-text files are tracked in the public repo
          COUNT=$(git ls-tree -r HEAD --name-only -- 'data/review-texts/' 2>/dev/null | wc -l | tr -d ' ')
          if [ "$COUNT" -gt "0" ]; then
            echo "::error::CRITICAL: $COUNT review-text files found in public repo! These contain copyrighted content and MUST be removed."
            git ls-tree -r HEAD --name-only -- 'data/review-texts/' | head -20
            exit 1
          fi
          echo "✓ Zero review-text files in public repo"

          # Fail immediately if ANY aggregator-archive files are tracked in the public repo
          AA_COUNT=$(git ls-tree -r HEAD --name-only -- 'data/aggregator-archive/' 2>/dev/null | wc -l | tr -d ' ')
          if [ "$AA_COUNT" -gt "0" ]; then
            echo "::error::CRITICAL: $AA_COUNT aggregator-archive files found in public repo! These contain copyrighted content and MUST be removed."
            git ls-tree -r HEAD --name-only -- 'data/aggregator-archive/' | head -20
            exit 1
          fi
          echo "✓ Zero aggregator-archive files in public repo"

      - name: Guard — public show JSONs not stripped of reviews
        run: |
          # Detect when a commit strips reviews from public show JSONs.
          # This catches the class of bug where a script regenerates public JSONs
          # from stale core-data, wiping reviews added by concurrent sessions.
          node -e "
            const fs = require('fs');
            const path = require('path');
            const dir = 'public/data/shows';
            const files = fs.readdirSync(dir).filter(f => f.endsWith('.json'));
            let totalReviews = 0;
            let showsWithReviews = 0;
            for (const f of files) {
              try {
                const d = JSON.parse(fs.readFileSync(path.join(dir, f), 'utf8'));
                const rv = d.rv || [];
                if (rv.length > 0) { showsWithReviews++; totalReviews += rv.length; }
              } catch {}
            }
            console.log('Public show JSONs: ' + files.length + ' files, ' + showsWithReviews + ' with reviews, ' + totalReviews + ' total reviews');
            // Absolute floor: if we have <500 shows with reviews, something is very wrong
            if (showsWithReviews < 500) {
              console.error('::error::REGRESSION: Only ' + showsWithReviews + ' shows have reviews in public JSONs (expected 500+). A script may have regenerated public JSONs from stale data.');
              process.exit(1);
            }
            // Absolute floor: total reviews should never drop below 15,000
            if (totalReviews < 15000) {
              console.error('::error::REGRESSION: Only ' + totalReviews + ' total reviews in public JSONs (expected 15,000+). A script may have regenerated public JSONs from stale data.');
              process.exit(1);
            }
            console.log('✓ Review counts above safety floor');
          "

      - name: Guard — aggregator archives present
        run: |
          TOTAL=0
          FAIL=0
          for dir in data/aggregator-archive/*/; do
            NAME=$(basename "$dir")
            COUNT=$(ls "$dir" 2>/dev/null | wc -l | tr -d ' ')
            echo "$NAME: $COUNT files"
            TOTAL=$((TOTAL + COUNT))
            if [ "$COUNT" -lt 5 ]; then
              echo "::warning::$NAME has only $COUNT files (expected 5+)"
              FAIL=$((FAIL + 1))
            fi
          done
          if [ "$TOTAL" -lt 2500 ]; then
            echo "::error::CRITICAL: Only $TOTAL aggregator archive files found (expected 2500+). Archives may have been accidentally deleted."
            exit 1
          fi
          if [ "$FAIL" -gt 2 ]; then
            echo "::error::$FAIL aggregator directories below minimum file count."
            exit 1
          fi
          echo "✓ $TOTAL aggregator archive files present"

      - name: Checkout review-texts (private repo)
        uses: ./.github/actions/checkout-review-texts
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Auto-close expired shows
        run: node scripts/auto-close-expired-shows.js

      - name: Run data validation
        run: node scripts/validate-data.js

      - name: Audit review contamination
        run: node scripts/audit-review-contamination.js --strict
        # Catches cross-market contamination (WE/OB reviews in BW folders),
        # domain/outlet mismatches, unflagged roundup pages, and junk --unknown files.
        # Added 2026-04-11 after Oh Mary! BW audit found 18 issues in one folder,
        # systematic scan found 291 across all shows.

      - name: Audit aggregator-archive integrity
        run: node scripts/audit-aggregator-archive-integrity.js --strict
        continue-on-error: true
        # Catches the Stuart King contamination class — cached aggregator HTML
        # whose <title> doesn't match the showId in the filename. The bug
        # silently mis-attributed reviews across ~14 LBO archives + 256 across
        # other sources before being caught by a critic email (2026-04-25).
        # Baseline: data/audit/aggregator-archive-integrity-baseline.json
        # (currently empty; CI sees ~283 historical bad archives in the private-repo
        # data set that need triaging before --strict can be enforced).
        # Currently NON-BLOCKING (continue-on-error) until baseline reflects the
        # private-repo state. Tracked in Notion 34e637c5-416f-812c follow-up.

      - name: Validate market expansion
        run: node scripts/validate-market-expansion.js
        # Catches slug, threshold, display, and copy issues for WE/OB markets

      - name: Validate archive productions
        run: node scripts/validate-archive-productions.js
        continue-on-error: true  # Don't fail build, just warn - archives need manual refetch

      - name: Test star rating extractors
        run: node tests/star-rating-extractors.test.js
        # Verifies all outlet-specific star extractors against saved HTML fixtures

      - name: Validate aggregator truth
        run: node scripts/validate-aggregator-truth.js
        # Compares local review counts to aggregator data
        # High-coverage shows (Tony winners, etc.) are exempt from strict ratio limits

      - name: Audit text quality
        run: node scripts/audit-text-quality.js
        # Ensures review text quality meets thresholds:
        # - At least 35% "full" quality
        # - No more than 40% truncated
        # - No more than 5% unknown quality

      - name: Audit critic-outlet affinities
        run: node scripts/audit-critic-outlets.js --report-only
        continue-on-error: true  # Informational only

      - name: Audit outlet-registry gaps
        run: node scripts/audit-outlet-registry.js --report-only
        continue-on-error: true  # Informational only — exit 0 even with missing outlets.
        # Surfaces unregistered outletIds + display-name + normalization mismatches.
        # Wired as warning so the 53+ pre-existing missing outlets don't block merges
        # while we work through the backlog. Promote to failure once count is <5.

      - name: Validate mobile-shows.json integrity
        run: node scripts/validate-mobile-shows.js
        # Catches stale build artifacts from worktree merges:
        # closed shows without scores should be filtered out by generate-mobile-data.js

      - name: Audit content-quality regex FP rate
        run: node scripts/audit-regex-patterns.js --full
        # FP gate for content-quality.js pattern families. Scans every review text
        # against each exported RegExp[] and exits 1 if any pattern fires more often
        # than its allowlist baseline. Catches bare-keyword class FPs that synthetic
        # unit tests miss — e.g., /cook/ matching inside "cookie", /horror film/ in
        # theater metaphors. See memory/feedback_content_quality_regex_fps.md.
        # Added 2026-04-24 after 8-pattern tightening session.

      - name: Validate review-text files
        run: |
          echo "Validating individual review-text files..."
          node scripts/validate-review-texts.js
        # Validates review-text file structure:
        # - Required fields (showId, outletId or outlet) — ERROR
        # - Duplicate reviews (same outlet+critic in same show) — ERROR
        # - Unknown outlets (not in outlet-registry.json) — WARNING
        # - Garbage critic names (photo credit, staff, unknown) — WARNING

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: 'Test Suite Failed'
          discord_webhook: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}

      - name: Create issue on failure
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const title = '🚨 Daily Data Validation Failed';
            const body = `## Data Validation Failed

            The daily data validation check found issues that need attention.

            **Run:** [${context.runId}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})
            **Time:** ${new Date().toISOString()}

            Please check the workflow logs for details.

            ---
            *This issue was automatically created by the test workflow.*`;

            // Check if similar issue already exists
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'automated,bug'
            });

            const existingIssue = issues.data.find(i => i.title === title);
            if (!existingIssue) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['automated', 'bug', 'data']
              });
            }

      - name: Record pipeline success
        if: success()
        run: |
          mkdir -p data/audit/pipeline-health
          date -u > data/audit/pipeline-health/test.last-success
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/audit/pipeline-health/
          git diff --staged --quiet || git commit -m "health: Record test success" && git push || echo "::warning::Health recording push failed"

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    # Skip on Dependabot PRs — see unit-tests above.
    if: github.actor != 'dependabot[bot]' && github.event.inputs.test_type != 'data-only' && github.event.inputs.test_type != 'visual-only'
    steps:
      - name: Checkout
        uses: actions/checkout@v5



      - name: Checkout core data
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
      - name: Checkout review-texts (private repo)
        uses: ./.github/actions/checkout-review-texts
        with:
