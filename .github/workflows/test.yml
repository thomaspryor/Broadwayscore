      - 'scripts/check-seo-health.test.mjs'
      - 'scripts/lib/seo-cwv-field-scope.js'
      - 'scripts/lib/seo-cwv-ack.js'
      # Bot-shaped GSC query detection (task #530). A third-party scraper's
