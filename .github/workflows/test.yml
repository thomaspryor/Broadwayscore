      # bound in a script reachable from a shallow (fetch-depth != 0) workflow.
      # Detection is pure + colocated-tested (lib-test glob); path-listed so a
      # solo edit triggers CI (feedback_test_yml_push_path_allowlist).
      - 'scripts/lib/unbounded-fetch-guard.js'
