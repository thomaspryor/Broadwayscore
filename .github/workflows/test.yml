      # DTLI excerpts re-entered reviews.json on every review-refresh and were
      # re-excluded by the next rebuild — the +/-150/day exact-revert flap. Tests
      # live in tests/unit-test-manifest.txt; these are path-listed so a solo edit
      # to the writer, the detector, or the watermark gate triggers CI.
