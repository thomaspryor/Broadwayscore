name: Opening Night Checklist

on:
  schedule:
    # Fires hourly at :17 — evaluates checklist + SLA for shows opening within ±2 days
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      show_id:
        description: 'Specific show ID to check (optional — defaults to all shows near opening)'
        required: false
        type: string
      dry_run:
        description: 'Dry run — evaluate SLA but skip Discord/email dispatch'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  # actions: write — the checklist now dispatches the workflows that fix what
  # it finds (task #389: update-critic-consensus.yml for a missing Critics
  # Take, recover-explicit-ratings.yml for unparsed star ratings) instead of
  # printing the command for the owner to run by hand. Same mechanism
  # recover-explicit-ratings.yml already uses to dispatch rebuild-reviews.yml.
  actions: write

jobs:
  checklist:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      # per-run group intended: adjacent hourly cron invocations don't cancel
      # each other at GitHub's queue-depth-1 limit. This does NOT serialize —
      # duplicate-alert protection lives at the application layer instead
      # (opening-night-sla-state.json + owner-alert-router cooldown/dedup in
      # scripts/lib/opening-night-sla.js), so an overlapping run can't double-page
      # (task #922 audit, 2026-08-03).
      #
      # SCOPE CORRECTION (task #389): that application-layer protection covers
      # the ALERT path, not the new workflow-dispatch remediation path. Its
      # cooldown state is data/audit/remediation-log.jsonl, which is committed
      # in the LAST step of the job — so a cron run overlapping a manual
      # workflow_dispatch reads the same pre-commit ledger and can dispatch the
      # same remediation twice. Consequences are bounded and were accepted
      # rather than serialized: the target workflows
      # (update-critic-consensus.yml, recover-explicit-ratings.yml) each have
      # their own named concurrency group with cancel-in-progress: false, so a
      # duplicate queues instead of racing; the real cost is that it burns one
      # of the 2-attempts-per-24h budget and can escalate to the owner's digest
      # a cycle early. Serializing this job instead would reintroduce the
      # queue-depth-1 cancellation this per-run group exists to avoid.
      group: opening-night-checklist-${{ github.run_id }}
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Checkout core data
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}

      # BRO-234: 8 checks in scripts/lib/opening-night-checks/ read
      # context.reviewTextsRoot (data/review-texts/), and without this step
      # the directory never existed in this job's checkout. Most of them
      # (fs.existsSync guard) treat a missing directory as a silent PASS —
      # blind in CI, always green regardless of actual review-text state.
      # Two (bww-rr-count-mismatch, dtli-count-mismatch) go the other way:
      # dirExists gates findExistingReviewFile(), so with no directory every
      # aggregator-listed review reads as "missing" and gets queued for stub
      # remediation — a false-positive flood, not a silent pass.
      - name: Checkout review-texts
        uses: ./.github/actions/checkout-review-texts
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}

      # W2.1 (task #1073): this used to be raw actions/setup-node@v5 with no
      # install step at all — node_modules never existed on this job's runner,
      # so any script this workflow runs that transitively requires a
      # third-party package (e.g. opening-night-checklist.js's check plugins
      # requiring 'cheerio' via gather-reviews.js/page-validator.js) crashed
      # with MODULE_NOT_FOUND on every single run. That crash is the actual
      # root cause of opening-night-history.json going silent from 2026-04-26
      # onward — see the diagnosis comment above appendToHistory() in
      # scripts/opening-night-checklist.js. Switching to the shared composite
      # (used by every other workflow in this repo) runs `npm ci` so the
      # require chain actually resolves.
      - uses: ./.github/actions/setup-node
        with:
          configure-git: 'true'

      - name: Run opening night checklist
        id: checklist
        # W2.1: continue-on-error + `|| true` used to swallow EVERY exit code
        # this script could produce — including genuine crashes — as "expected,
        # a show has errors". Explicit rc handling below distinguishes the two
        # DESIGNED exit codes (0 = clean, 1 = shows have gaps — both fine, both
        # produce a real JSON payload downstream steps consume) from anything
        # else (crash, or exit 3 = the history-ledger append itself failed —
        # see opening-night-checklist.js), which now fails this step loudly.
        env:
          # Arms the self-declared remediation layer (task #389). Without a
          # token, dispatchWorkflow() returns {ok:false,error:'no-token'} and
          # every remediation lands in the ledger as 'failed' — detection still
          # runs, nothing crashes, but nothing self-heals either.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Kill switch. Set to 'true' (repo variable or here) to make the
          # checklist detect-and-log only, dispatching nothing.
          OPENING_NIGHT_REMEDIATION_DISABLED: ${{ vars.OPENING_NIGHT_REMEDIATION_DISABLED || 'false' }}
          DISCORD_WEBHOOK_ALERTS: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
          # BRO-67: bww-rr-count-mismatch / dtli-count-mismatch checks now run
          # the same LLM partial-extraction fallback as gather-reviews.js
          # (llmFallbackExtractIfNeeded). Without this, callClaude rejects
          # immediately with "ANTHROPIC_API_KEY not set" and the fallback is a
          # silent no-op — the parity checks stay blind to the exact
          # format-change misses they exist to catch.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          SHOW_ARG=""
          if [ -n "${{ inputs.show_id }}" ]; then
            SHOW_ARG="--show=${{ inputs.show_id }}"
          fi
          # --out writes the JSON to its own file: BOTH stdout (scraper '[SB
          # Call]' telemetry from the remediation step) and stderr used to
          # merge into checklist.json, making it unparseable — which silently
          # un-scoped the SLA dispatcher on every real run since it shipped.
          rc=0
          node scripts/opening-night-checklist.js --json --out=/tmp/checklist.json $SHOW_ARG || rc=$?
          if [ -s /tmp/checklist.json ]; then
            echo "Checklist output written ($(wc -c < /tmp/checklist.json) bytes)"
          else
            echo '{"generatedAt":"'"$(date -u +%Y-%m-%dT%H:%M:%SZ)"'","shows":[]}' > /tmp/checklist.json
            echo "Warning: checklist produced no output — wrote empty JSON"
          fi
          echo "opening-night-checklist.js exit code: $rc"
          if [ "$rc" -eq 0 ] || [ "$rc" -eq 1 ]; then
            echo "Exit $rc is within the designed range (0=clean, 1=shows have gaps) — continuing."
          else
            echo "::error::opening-night-checklist.js exited $rc — NOT the designed 0/1 path (likely a crash, or exit 3 = history-ledger append failure). See the log above for the real error. Failing this step instead of silently continuing."
            exit 1
          fi

      - name: Run latency report
        # lint-allow-swallow: out of scope for task #1073's W2.1 fix — this
        # step is secondary/best-effort (per-stage SLA latency reporting, not
        # the checklist result or the history ledger appendToHistory() writes
        # W2.1 was scoped to). "Dispatch SLA alerts" already tolerates a
        # missing $LATENCY_OUT (empty string interpolates fine into the CLI
        # arg), and "Commit audit data" runs unconditionally either way. A
        # dedicated fix for THIS step's swallowed failures is real follow-up
        # work, not bundled into this incident's fix.
        continue-on-error: true
        run: |
          LATENCY_OUT="data/audit/opening-night-latency-$(date -u +%F).json"
          node scripts/opening-night-latency-report.js \
            --log data/audit/stage-latency.jsonl \
            --output "$LATENCY_OUT" 2>&1 || true
          echo "LATENCY_OUT=$LATENCY_OUT" >> $GITHUB_ENV

      - name: Dispatch SLA alerts
        # W2.1 (task #1073): this owner-paging step was fully swallowed by
        # continue-on-error: true — a real failure here (Discord/email dispatch
        # broken) produced a green workflow with no alert ever sent. Letting it
        # fail the job now means "Notify on failure" below actually fires, and
        # "Commit audit data" (if: always()) still persists whatever ledger
        # state exists so a crash here doesn't also strand the audit trail.
        env:
          DISCORD_WEBHOOK_ALERTS: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
          STAGE_LATENCY_LOG: data/audit/stage-latency.jsonl
          SLA_DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          node scripts/opening-night-sla-dispatch.js /tmp/checklist.json "$LATENCY_OUT"

      - name: Commit audit data
        # W2.1 (task #1073): must run even when an earlier step now fails hard
        # (checklist crash, or SLA dispatch no longer has continue-on-error) —
        # otherwise a mid-run failure strands whatever ledger/history state was
        # already written on the ephemeral runner instead of persisting it
        # (this repo's §8 batch-script checkpoint rule: if: always() on
        # commit/push). git identity is already configured by the
        # ./.github/actions/setup-node step above (configure-git: true).
        if: always()
        run: |
          # alert-ledger + sla-state + digest-queue MUST be committed here or the
          # SLA alert router incident state never persists across the hourly runs
          # — routeAlert would re-open + re-email every run, reintroducing the
          # storm this migration fixes (#406).
          # remediation-log.jsonl is the cooldown store for self-declared
          # remediations (task #389) — decideRequeueAction reads prior attempts
          # out of it. If it is not committed, every hourly run starts with an
          # empty attempt history and re-dispatches the same workflow forever.
          git add data/audit/opening-night-history.json \
                  data/audit/opening-night-latency-*.json \
                  data/audit/stage-latency.jsonl \
                  data/audit/alert-ledger.json \
                  data/audit/alert-digest-queue.json \
                  data/audit/remediation-log.jsonl \
                  data/audit/opening-night-sla-state.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No audit data changes to commit"
          else
            git commit -m "audit: opening-night checklist + latency [skip ci]"
            bash scripts/lib/push-with-retry.sh 5 main
          fi

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: 'Opening Night Checklist Failed'
          severity: 'warning'
          discord_webhook: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
