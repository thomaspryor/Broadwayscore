name: Collect Outlet Reviews (SERP)

on:
  schedule:
    - cron: '0 14 * * 1'  # Weekly Monday 2 PM UTC (9 AM EST)
  workflow_dispatch:
    inputs:
      market:
        description: 'Market to collect for (ignored if shows is set)'
        required: false
        default: 'broadway'
        type: choice
        options:
          - broadway
          - west-end
          - off-broadway
      max_tier:
        description: 'Maximum outlet tier to search'
        required: false
        default: '2'
        type: choice
        options:
          - '1'
          - '2'
          - '3'
      shows:
        description: 'Comma-separated show IDs (auto-detects market, overrides market input)'
        required: false
        default: ''
        type: string
      show_filter:
        description: 'Single show ID (legacy, prefer shows)'
        required: false
        default: ''
        type: string
      max_searches:
        description: 'Maximum SERP searches (cost control)'
        required: false
        default: '200'
        type: string
      dry_run:
        description: 'Dry run (no files written)'
        required: false
        default: false
        type: boolean

concurrency:
  group: collect-outlet-reviews-${{ github.event.inputs.shows || github.event.inputs.market || 'weekly-cron' }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/checkout-review-texts
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}

      - uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run outlet-based SERP collector
        env:
          SCRAPINGBEE_API_KEY: ${{ secrets.SCRAPINGBEE_API_KEY }}
          BRIGHTDATA_TOKEN: ${{ secrets.BRIGHTDATA_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # Weekly cron: search open shows across all markets
            echo "=== Weekly cron: searching open shows across all markets ==="
            for MARKET in broadway west-end off-broadway; do
              echo "--- Market: $MARKET ---"
              node scripts/collect-outlet-reviews.js --market "$MARKET" --open-only --max-tier 2 --max-searches 150
            done
          else
            # Manual dispatch: use provided inputs
            if [ -n "${{ github.event.inputs.shows }}" ]; then
              ARGS="--shows ${{ github.event.inputs.shows }}"
            elif [ -n "${{ github.event.inputs.show_filter }}" ]; then
              ARGS="--shows ${{ github.event.inputs.show_filter }}"
            else
              ARGS="--market ${{ github.event.inputs.market }}"
            fi
            ARGS="$ARGS --max-tier ${{ github.event.inputs.max_tier }} --max-searches ${{ github.event.inputs.max_searches }}"
            if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
              ARGS="$ARGS --dry-run"
            fi
            echo "Running: node scripts/collect-outlet-reviews.js $ARGS"
            node scripts/collect-outlet-reviews.js $ARGS
          fi

      - name: Push review texts
        if: always()
        uses: ./.github/actions/push-review-texts
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
          message: "feat: Collect outlet reviews via SERP (${{ github.event_name }})"
      - name: Trigger rebuild
        if: success() && github.event.inputs.dry_run != 'true'
        run: |
          gh workflow run "Rebuild Reviews Data" -f reason="Post outlet SERP collection (${{ github.event_name }})"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: 'Collect Outlet Reviews Failed'
          discord_webhook: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
