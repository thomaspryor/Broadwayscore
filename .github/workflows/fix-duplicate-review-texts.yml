name: Fix Duplicate Review Texts

on:
  workflow_dispatch:

jobs:
  fix-duplicates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Checkout review-texts
        uses: ./.github/actions/checkout-review-texts
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}

      - name: Delete duplicate review-text files
        run: |
          cd data/review-texts

          # These are duplicate files where two filenames map to the same outlet+critic.
          # The validator flags: "Duplicate review (same outlet+critic): also in X"
          # We keep the more specific/named file and delete the duplicate.

          # timeout-london vs timeout (same critic Andrzej Lukowski, same outlet)
          rm -f all-my-sons-west-end-2025/timeout-london--andrzej-lukowski.json
          rm -f hadestown-west-end-2024/timeout-london--andrzej-lukowski.json
          rm -f my-neighbour-totoro-west-end-2025/timeout-london--andrzej-lukowski.json
          rm -f paddington-the-musical-west-end-2025/timeout-london--andrzej-lukowski.json
          rm -f summerfolk-west-end-2026/timeout-london--andrzej-lukowski.json
          rm -f titanique-west-end-2024/timeout-london--andrzej-lukowski.json

          # mail vs daily-mail (same critic Patrick Marmion)
          rm -f cabaret-at-the-kit-kat-club-west-end-2021/mail--patrick-marmion.json

          # timeout--unknown vs timeout--adam-feldman (giant-2026: unknown resolved to adam-feldman)
          rm -f giant-2026/timeout--unknown.json

          # broadwaynews--unknown vs broadwaynews--brittani-samuel (great-gatsby-2024)
          rm -f the-great-gatsby-2024/broadwaynews--unknown.json

          echo "Deleted duplicate files. Checking git diff..."
          git diff --stat

      - name: Commit and push
        run: |
          cd data/review-texts
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -A
          git commit -m "fix: Remove 9 duplicate review files (timeout-london/mail outlet aliases, unknown critics)"
          git push
