# Automated review refresh - checks for new reviews and triggers collection
# Replaces the previous scheduled-review-refresh workflow
name: Refresh Review Data

on:
  schedule:
    # Daily at 9 AM UTC (4 AM EST)
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      show_filter:
        description: 'Specific show ID to refresh (leave empty for all open shows)'
        required: false
        default: ''
        type: string
      include_closed:
        description: 'Also check closed shows for review gaps'
        required: false
        default: 'false'
        type: boolean
      force_collection:
        description: 'Force review collection even if no new reviews detected'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write

jobs:
  check-for-new-reviews:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      has_new_reviews: ${{ steps.check.outputs.has_new_reviews }}
      shows_with_updates: ${{ steps.check.outputs.shows_with_updates }}
      priority_shows: ${{ steps.check.outputs.priority_shows }}
      routine_shows: ${{ steps.check.outputs.routine_shows }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}



      - name: Checkout core data
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
      - name: Checkout review-texts (private repo)
        uses: ./.github/actions/checkout-review-texts
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
      - name: Checkout aggregator-archive (private repo)
        uses: ./.github/actions/checkout-aggregator-archive
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Playwright
        uses: ./.github/actions/setup-playwright

      - name: Install PDF tools
        run: sudo apt-get install -y poppler-utils

      - name: Determine if awards season
        id: season
        run: |
          MONTH=$(date +%m)
          if [ "$MONTH" -ge 4 ] && [ "$MONTH" -le 6 ]; then
            echo "is_awards_season=true" >> $GITHUB_OUTPUT
            echo "Awards season detected (April-June) - enhanced monitoring active"
          else
            echo "is_awards_season=false" >> $GITHUB_OUTPUT
            echo "Regular season - standard monitoring"
          fi

      - name: Check aggregators for new reviews
        id: check
        env:
          SCRAPINGBEE_API_KEY: ${{ secrets.SCRAPINGBEE_API_KEY }}
          SCRAPINGDOG_API_KEY: ${{ secrets.SCRAPINGDOG_API_KEY }}
          SCRAPER_USE_SCRAPINGDOG: '1'
          BRIGHTDATA_TOKEN: ${{ secrets.BRIGHTDATA_TOKEN }}
          BRIGHTDATA_ZONE: ${{ secrets.BRIGHTDATA_ZONE }}
          SHOW_FILTER: ${{ inputs.show_filter }}
          INCLUDE_CLOSED: ${{ inputs.include_closed }}
          IS_AWARDS_SEASON: ${{ steps.season.outputs.is_awards_season }}
          FORCE_COLLECTION: ${{ inputs.force_collection }}
        run: |
          node << 'SCRIPT'
          const fs = require('fs');
          const path = require('path');

          // Load current show and review data
          const showsData = JSON.parse(fs.readFileSync('data/shows.json', 'utf8'));
          const reviewsData = JSON.parse(fs.readFileSync('data/reviews.json', 'utf8'));

          // Get shows to check
          const showFilter = process.env.SHOW_FILTER;
          const includeClosed = process.env.INCLUDE_CLOSED === 'true';

          // During first week of each month, automatically include closed shows
          const today = new Date();
          const isFirstWeek = today.getDate() <= 7;
          const checkAllShows = includeClosed || isFirstWeek;

          let showsToCheck;
          if (checkAllShows) {
            showsToCheck = showsData.shows;
            console.log('Including ALL shows (open + closed) in gap check');
          } else {
            showsToCheck = showsData.shows.filter(s => s.status === 'open' || s.status === 'previews');
          }

          if (showFilter) {
            showsToCheck = showsToCheck.filter(s => s.id === showFilter || s.slug === showFilter);
          }

          console.log(`Checking ${showsToCheck.length} shows for new reviews...`);

          // Count current reviews per show
          const currentReviewCounts = {};
          for (const show of showsToCheck) {
            const showReviews = reviewsData.reviews?.filter(r => r.showId === show.id) || [];
            currentReviewCounts[show.id] = showReviews.length;
            console.log(`  ${show.title}: ${showReviews.length} reviews currently`);
          }

          // Check review-texts directory for actual file counts
          const reviewTextsDir = 'data/review-texts';
          const fileReviewCounts = {};
          for (const show of showsToCheck) {
            const showDir = path.join(reviewTextsDir, show.id);
            try {
              const files = fs.readdirSync(showDir).filter(f => f.endsWith('.json'));
              fileReviewCounts[show.id] = files.length;
            } catch {
              fileReviewCounts[show.id] = 0;
            }
          }

          // Load show-score data to check for discrepancies
          let showScoreData = {};
          try {
            showScoreData = JSON.parse(fs.readFileSync('data/show-score.json', 'utf8'));
          } catch {}

          // Load aggregator summary (DTLI + BWW counts) for multi-source detection
          let aggSummary = { dtli: {}, bww: {} };
          try {
            aggSummary = JSON.parse(fs.readFileSync('data/aggregator-summary.json', 'utf8'));
            // Warn if aggregator data is stale (>10 days old)
            const lastUpdated = aggSummary._meta?.lastUpdated;
            if (lastUpdated) {
              const ageDays = (today - new Date(lastUpdated)) / (1000 * 60 * 60 * 24);
              if (ageDays > 10) {
                console.log(`  ⚠ aggregator-summary.json is ${Math.floor(ageDays)} days old — DTLI/BWW gap detection may be stale`);
              }
            }
          } catch {
            console.log('  Note: aggregator-summary.json not found — using ShowScore only');
          }

          // Categorize shows into priority (genuine new reviews) vs routine (sync/low-count/recently-opened)
          const priorityShows = []; // Aggregator(s) report more reviews than we have
          const recentShows = []; // Recently opened — proactive check (always included, bypasses cap)
          const routineShows = []; // Sync mismatches, awards season low-count
          const isAwardsSeason = process.env.IS_AWARDS_SEASON === 'true';

          for (const show of showsToCheck) {
            const showId = show.id;
            const currentCount = currentReviewCounts[showId] || 0;
            const fileCount = fileReviewCounts[showId] || 0;

            // Multi-source gap detection: max across ShowScore, DTLI, BWW
            // DTLI counts thumbs (may include excluded reviews), BWW includes roundup articles
            // Use +1 tolerance to absorb structural counting differences
            const ssCount = showScoreData.shows?.[showId]?.criticReviewCount || 0;
            const dtliCount = aggSummary.dtli?.[showId]?.totalReviews || 0;
            const bwwCount = aggSummary.bww?.[showId]?.totalReviews || 0;
            const maxAggCount = Math.max(ssCount, dtliCount, bwwCount);

            // Track which source(s) flagged the gap for logging
            const sources = [];
            if (ssCount > fileCount) sources.push(`SS:${ssCount}`);
            if (dtliCount > fileCount) sources.push(`DTLI:${dtliCount}`);
            if (bwwCount > fileCount) sources.push(`BWW:${bwwCount}`);

            // PRIORITY: Aggregator(s) report more reviews than we have (genuine new reviews)
            // +1 tolerance: DTLI counts thumbs, BWW includes roundups — not exact matches
            if (maxAggCount > fileCount + 1) {
              const gap = maxAggCount - fileCount;
              console.log(`  [NEW] ${show.title}: aggregators say ${maxAggCount} (${sources.join(', ')}), we have ${fileCount} files (gap: ${gap})`);
              priorityShows.push({ id: showId, gap, sources });
              continue;
            }

            // RECENT: Recently opened shows — reviews trickle in for ~3 weeks
            // Aggregators lag 1-3 days; proactively check even without signals
            // Separate list: always included (not subject to routine cap)
            // OB/OWE shows open "cold" and often have a null openingDate, so anchor
            // on previewsStartDate for those markets — otherwise null-openingDate
            // previews shows are invisible to every discovery path (Are You Now Or
            // Have You Ever Been: 0 reviews despite 3+ published, 2026-06-15).
            const category = show.category || '';
            const isColdOpenMarket = category === 'off-broadway' || category === 'off-west-end';
            const effectiveOpening = show.openingDate || (isColdOpenMarket ? show.previewsStartDate : null);
            const daysSinceOpening = effectiveOpening
              ? Math.floor((today - new Date(effectiveOpening)) / (1000 * 60 * 60 * 24))
              : null;
            const daysSinceClosing = show.closingDate
              ? Math.floor((today - new Date(show.closingDate)) / (1000 * 60 * 60 * 24))
              : null;

            // Market-specific thresholds: OB/WE have fewer aggregator signals and fewer reviews total
            const recentThreshold = (category === 'off-broadway' || category === 'west-end' || category === 'off-west-end') ? 3 : 10;

            // RECENT (open): reviews trickle in for ~3 weeks after opening. For
            // cold-open OB/OWE markets, a 'previews' status still counts — they often
            // never flip to 'open' when openingDate is null.
            const recentlyOpened = daysSinceOpening !== null && daysSinceOpening >= 0
              && daysSinceOpening <= 21
              && (show.status === 'open' || (isColdOpenMarket && show.status === 'previews'));
            // RECENT (closed short-run): short-run shows (e.g. 3-day Open Air runs)
            // flip to 'closed' before slow-indexing T3 outlets appear on Google, and
            // the opening-night orchestrator stops polling once closed. Keep sweeping
            // for 14 days after closing — bounded to short runs (<=45d since opening)
            // so we don't re-sweep long-runners that already have full coverage.
            // Closes the closure-window half of the WE discovery gap (2026-06-15).
            const recentlyClosedShortRun = daysSinceClosing !== null && daysSinceClosing >= 0
              && daysSinceClosing <= 14 && daysSinceOpening !== null && daysSinceOpening <= 45;

            if ((recentlyOpened || recentlyClosedShortRun) && fileCount < recentThreshold) {
              const phase = recentlyOpened ? `opened ${daysSinceOpening}d ago` : `closed ${daysSinceClosing}d ago`;
              console.log(`  [RECENT] ${show.title}: ${phase}, ${fileCount}/${recentThreshold} files (${category || 'broadway'})`);
              recentShows.push(showId);
            }
            // ROUTINE: Awards season low-count
            else if (isAwardsSeason && currentCount < 5) {
              console.log(`  [LOW] ${show.title}: Only ${currentCount} reviews during awards season`);
              routineShows.push(showId);
            }
            // ROUTINE: File vs database mismatch
            else if (fileCount > currentCount) {
              console.log(`  [SYNC] ${show.title}: ${fileCount} files but only ${currentCount} in reviews.json`);
              routineShows.push(showId);
            }
          }

          // Sort priority shows by gap size (biggest gaps first)
          priorityShows.sort((a, b) => b.gap - a.gap);
          const priorityIds = priorityShows.map(s => s.id);

          // Cap routine shows at 20 per run to avoid overwhelming the pipeline
          // Recently-opened shows bypass the cap (they're time-sensitive)
          const ROUTINE_CAP = 20;
          const cappedRoutine = routineShows.slice(0, ROUTINE_CAP);
          if (routineShows.length > ROUTINE_CAP) {
            console.log(`\nCapped routine shows from ${routineShows.length} to ${ROUTINE_CAP}`);
          }

          const allShows = [...new Set([...priorityIds, ...recentShows, ...cappedRoutine])];

          console.log(`\nFound ${priorityIds.length} priority + ${recentShows.length} recently-opened + ${cappedRoutine.length} routine = ${allShows.length} shows to process`);

          // Write outputs
          const hasNew = allShows.length > 0 || process.env.FORCE_COLLECTION === 'true';

          const outputFile = process.env.GITHUB_OUTPUT;
          if (outputFile) {
            fs.appendFileSync(outputFile, `has_new_reviews=${hasNew}\n`);
            fs.appendFileSync(outputFile, `shows_with_updates=${allShows.join(',')}\n`);
            fs.appendFileSync(outputFile, `priority_shows=${priorityIds.join(',')}\n`);
            fs.appendFileSync(outputFile, `routine_shows=${[...recentShows, ...cappedRoutine].join(',')}\n`);
          }

          // Save detailed report for debugging
          const report = {
            timestamp: new Date().toISOString(),
            isAwardsSeason,
            showsChecked: showsToCheck.length,
            priorityShows: priorityShows,
            recentShows: recentShows,
            routineShows: cappedRoutine,
            routineTotal: routineShows.length,
            routineCapped: routineShows.length > ROUTINE_CAP,
            reviewCounts: currentReviewCounts,
            aggregatorCounts: Object.fromEntries(
              showsToCheck.map(s => [s.id, {
                showScore: showScoreData.shows?.[s.id]?.criticReviewCount || 0,
                dtli: aggSummary.dtli?.[s.id]?.totalReviews || 0,
                bww: aggSummary.bww?.[s.id]?.totalReviews || 0,
                files: fileReviewCounts[s.id] || 0,
              }])
            )
          };

          fs.writeFileSync('data/review-refresh-report.json', JSON.stringify(report, null, 2));
          console.log('\nReport saved to data/review-refresh-report.json');
          SCRIPT

      - name: Fetch updated aggregator pages
        if: steps.check.outputs.has_new_reviews == 'true' || inputs.force_collection == 'true'
        env:
          SCRAPINGBEE_API_KEY: ${{ secrets.SCRAPINGBEE_API_KEY }}
          SCRAPINGDOG_API_KEY: ${{ secrets.SCRAPINGDOG_API_KEY }}
          SCRAPER_USE_SCRAPINGDOG: '1'
          BRIGHTDATA_TOKEN: ${{ secrets.BRIGHTDATA_TOKEN }}
          BRIGHTDATA_ZONE: ${{ secrets.BRIGHTDATA_ZONE }}
        run: |
          SHOWS="${{ steps.check.outputs.shows_with_updates }}"
          if [ -n "$SHOWS" ]; then
            echo "Fetching aggregator pages for: $SHOWS"
            for SHOW_ID in $(echo $SHOWS | tr ',' ' '); do
              echo "Processing $SHOW_ID..."
              node scripts/fetch-aggregator-pages.ts --aggregator show-score --shows "$SHOW_ID" 2>/dev/null || true
            done
          fi

      - name: Extract reviews from aggregator pages
        if: steps.check.outputs.has_new_reviews == 'true' || inputs.force_collection == 'true'
        run: |
          echo "Extracting reviews from archived aggregator pages..."
          node scripts/extract-show-score-reviews.js 2>/dev/null || true
          node scripts/extract-dtli-reviews.js 2>/dev/null || true

      - name: Convert Show Score data to review-text stubs
        if: steps.check.outputs.has_new_reviews == 'true' || inputs.force_collection == 'true'
        run: node scripts/convert-show-score-to-review-texts.js

      - name: Extract Theatre Record reviews (WE shows)
        if: steps.check.outputs.has_new_reviews == 'true' || inputs.force_collection == 'true'
        continue-on-error: true
        env:
          TR_EMAIL: ${{ secrets.TR_EMAIL }}
          TR_PASSWORD: ${{ secrets.TR_PASSWORD }}
        run: |
          if [ -z "$TR_EMAIL" ] || [ -z "$TR_PASSWORD" ]; then
            echo "TR credentials not configured — skipping Theatre Record extraction"
            exit 0
          fi
          echo "Extracting reviews from Theatre Record (browse WE listing)..."
          node scripts/extract-theatre-record.js --browse-we --no-skip-existing

      - name: Discover URLs for Theatre Record reviews (Phase 0)
        if: steps.check.outputs.has_new_reviews == 'true' || inputs.force_collection == 'true'
        continue-on-error: true
        timeout-minutes: 20
        env:
          SCRAPINGBEE_API_KEY: ${{ secrets.SCRAPINGBEE_API_KEY }}
          SCRAPINGDOG_API_KEY: ${{ secrets.SCRAPINGDOG_API_KEY }}
          SCRAPER_USE_SCRAPINGDOG: '1'
          BRIGHTDATA_TOKEN: ${{ secrets.BRIGHTDATA_TOKEN }}
          BRIGHTDATA_ZONE: ${{ secrets.BRIGHTDATA_ZONE }}
        run: |
          echo "Running Phase 0 URL discovery for WE reviews without URLs..."
          node scripts/recover-explicit-ratings.js --phase=0 --market=west-end --limit=50

      - name: Cleanup phantom outlet duplicates
        run: node scripts/cleanup-phantom-outlets.js --apply

      - name: Rebuild reviews.json from review-texts
        if: steps.check.outputs.has_new_reviews == 'true' || inputs.force_collection == 'true'
        run: |
          echo "Rebuilding reviews.json from review-texts data..."
          node scripts/rebuild-all-reviews.js
          echo "Reviews rebuilt successfully"

      - name: Check for changes
        if: always()
        id: changes
        run: |
          if git diff --quiet data/; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Changes detected:"
            git diff --stat data/
          fi

      - name: Push review-texts to private repo
        if: always()
        uses: ./.github/actions/push-review-texts
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
          message: "data: Weekly review refresh"
      - name: Push aggregator-archive to private repo
        if: always()
        uses: ./.github/actions/push-aggregator-archive
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
          message: "data: Weekly review refresh (aggregator archive)"

      - name: Commit and push changes
        if: always() && steps.changes.outputs.has_changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          bash scripts/lib/stage-data-changes.sh

          SEASON_NOTE=""
          if [ "${{ steps.season.outputs.is_awards_season }}" == "true" ]; then
            SEASON_NOTE=" (awards season)"
          fi

          SHOWS_UPDATED="${{ steps.check.outputs.shows_with_updates }}"
          if [ -n "$SHOWS_UPDATED" ]; then
            COUNT=$(echo "$SHOWS_UPDATED" | tr ',' '\n' | wc -l | tr -d ' ')
            git commit -m "data: Refresh review data for $COUNT shows$SEASON_NOTE

          Updated shows: $SHOWS_UPDATED

          Co-Authored-By: github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
          else
            git commit -m "data: Scheduled review refresh check$SEASON_NOTE

          Co-Authored-By: github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
          fi

          bash scripts/lib/push-with-retry.sh

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: 'Review Refresh Failed'
          discord_webhook: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
          resend_api_key: ${{ secrets.RESEND_API_KEY }}
          owner_email: ${{ secrets.OWNER_EMAIL }}

      - name: Summary
        if: always()
        run: |
          echo "## Review Refresh Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ steps.season.outputs.is_awards_season }}" == "true" ]; then
            echo "**Season:** Awards Season (enhanced monitoring)" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Season:** Regular" >> $GITHUB_STEP_SUMMARY
          fi

          echo "**New reviews detected:** ${{ steps.check.outputs.has_new_reviews }}" >> $GITHUB_STEP_SUMMARY

          if [ -n "${{ steps.check.outputs.shows_with_updates }}" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Shows with potential updates:" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            echo "${{ steps.check.outputs.shows_with_updates }}" | tr ',' '\n' >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          fi

  # Trigger review collection — priority shows first (batched), then routine
  trigger-collection:
    needs: check-for-new-reviews
    if: needs.check-for-new-reviews.outputs.has_new_reviews == 'true' && needs.check-for-new-reviews.outputs.shows_with_updates != ''
    runs-on: ubuntu-latest
    steps:
      - name: Trigger batched review collection
        uses: actions/github-script@v7
        with:
          script: |
            const priority = '${{ needs.check-for-new-reviews.outputs.priority_shows }}'.split(',').filter(Boolean);
            const routine = '${{ needs.check-for-new-reviews.outputs.routine_shows }}'.split(',').filter(Boolean);

            console.log(`Priority shows (genuine new reviews): ${priority.length}`);
            console.log(`Routine shows (sync/low-count): ${routine.length}`);

            let triggered = 0;
            let failed = 0;

            // Batch priority shows into groups of 10 for parallel gather
            const BATCH_SIZE = 10;
            const priorityBatches = [];
            for (let i = 0; i < priority.length; i += BATCH_SIZE) {
              priorityBatches.push(priority.slice(i, i + BATCH_SIZE));
            }

            // Dispatch priority batches first
            for (const batch of priorityBatches) {
              try {
                await github.rest.actions.createWorkflowDispatch({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id: 'gather-reviews.yml',
                  ref: 'main',
                  inputs: {
                    shows: batch.join(',')
                  }
                });
                console.log(`  [PRIORITY] Triggered gather for ${batch.length} shows: ${batch.join(', ')}`);
                triggered += batch.length;
                await new Promise(r => setTimeout(r, 3000));
              } catch (e) {
                console.log(`  [PRIORITY] Failed to trigger batch: ${e.message}`);
                failed += batch.length;
              }
            }

            // Dispatch routine shows as a single batch (capped at 20)
            if (routine.length > 0) {
              try {
                await github.rest.actions.createWorkflowDispatch({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id: 'gather-reviews.yml',
                  ref: 'main',
                  inputs: {
                    shows: routine.join(',')
                  }
                });
                console.log(`  [ROUTINE] Triggered gather for ${routine.length} shows`);
                triggered += routine.length;
              } catch (e) {
                console.log(`  [ROUTINE] Failed to trigger: ${e.message}`);
                failed += routine.length;
              }
            }

            console.log(`\nDone: ${triggered} shows across ${priorityBatches.length + (routine.length > 0 ? 1 : 0)} dispatches (${failed} failed)`);
