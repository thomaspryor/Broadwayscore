name: Opening Night Broadcast

# Thin "check & send" workflow — reads existing scored data, generates consensus, sends email.
# Heavy lifting (gather, rebuild, score) is handled by the data pipeline:
#   update-show-status → gather-reviews → rebuild → llm-ensemble-score

on:
  # Triggers:
  #   1. Daily cron at 12:30 UTC (8:30 AM EDT / 7:30 AM EST) — self-dispatched with
  #      send_to_all=true. Creates the Resend draft AND emails the owner a preview so
  #      they can review and hit Send from Resend. All existing gates still apply
  #      (time ≥ 7 AM ET, readiness ≥ 15 reviews + aggregator, checklist clean).
  #   2. update-show-status.yml dispatches when a show transitions to open (preview only)
  #   3. Auto-retries after scoring completes (pipeline: gather → rebuild → score → broadcast)
  #   4. Manual dispatch for testing or re-sends
  schedule:
    - cron: '30 12 * * *'
  workflow_run:
    workflows: ["LLM Ensemble Score Reviews"]
    types: [completed]
  workflow_dispatch:
    inputs:
      lookback_days:
        description: 'How many days back to check for openings (default 2)'
        required: false
        type: number
        default: 2
      send_to:
        description: 'Preview mode: send a test email to this address only (does not create a Resend draft)'
        required: false
        type: string
        default: ''
      send_to_all:
        description: 'Approval dispatch: send to all subscribers (skips preview dedup check)'
        required: false
        type: boolean
        default: false
      force_broadcast:
        description: 'Override checklist gate — send even if QA errors found (emergency use only)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: broadcast-send
  cancel-in-progress: false

jobs:
  broadcast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Skip if triggered by a failed scoring run
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main



      - name: Checkout core data
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
      - name: Checkout review-texts (private repo)
        uses: ./.github/actions/checkout-review-texts
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}

      - name: Check recovery hold marker
        run: |
          if [ -f data/audit/recovery-active.marker ]; then
            ACTIVE_UNTIL=$(jq -r '.activeUntil' data/audit/recovery-active.marker)
            NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            if [ "$ACTIVE_UNTIL" \> "$NOW" ]; then
              REASON=$(jq -r '.reason' data/audit/recovery-active.marker)
              echo "::warning::Broadcast skipped: recovery-active marker present (reason: $REASON, expires: $ACTIVE_UNTIL)"
              echo "BROADCAST_HOLD_ACTIVE=true" >> $GITHUB_ENV
              exit 0
            fi
          fi
          echo "BROADCAST_HOLD_ACTIVE=false" >> $GITHUB_ENV

      - name: Find recently opened shows
        id: find
        run: |
          LOOKBACK=${{ inputs.lookback_days || 2 }}

          SHOWS=$(node -e "
            const shows = require('./data/shows.json').shows;
            const now = new Date();
            const cutoff = new Date(now);
            cutoff.setDate(cutoff.getDate() - $LOOKBACK);
            cutoff.setHours(0,0,0,0);

            const opened = shows.filter(s => {
              if (!s.openingDate) return false;
              // Accept 'open' OR 'upcoming' with today's opening date
              // (status flip can be lost to concurrent pushes)
              if (s.status !== 'open' && s.status !== 'upcoming') return false;
              // Only broadcast for Broadway and West End — skip OB/OWE
              const cat = s.category || 'broadway';
              if (cat !== 'broadway' && cat !== 'west-end') return false;
              const d = new Date(s.openingDate);
              d.setHours(0,0,0,0);
              return d >= cutoff && d <= now;
            });

            if (opened.length > 0) {
              console.log(opened.map(s => s.id).join(','));
            }
          ")

          if [ -z "$SHOWS" ]; then
            echo "No recently opened shows found"
            echo "has_shows=false" >> $GITHUB_OUTPUT
          else
            echo "Recently opened shows: $SHOWS"
            echo "has_shows=true" >> $GITHUB_OUTPUT
            echo "shows=$SHOWS" >> $GITHUB_OUTPUT

            # Split shows by market for broadcast step
            node -e "
              const shows = require('./data/shows.json').shows;
              const ids = '$SHOWS'.split(',');
              const broadway = [], westend = [];
              for (const id of ids) {
                const s = shows.find(x => x.id === id);
                if (s && s.category === 'west-end') westend.push(id);
                else if (!s || !s.category || s.category === 'broadway') broadway.push(id);
              }
              if (broadway.length) console.log('broadway=' + broadway.join(','));
              if (westend.length) console.log('westend=' + westend.join(','));
            " | while IFS= read -r line; do
              echo "$line" >> $GITHUB_OUTPUT
            done
          fi

      - name: Time gate — no broadcast before 7 AM ET
        if: steps.find.outputs.has_shows == 'true' && inputs.send_to_all != 'true'
        id: time_gate
        run: |
          # Automated runs must wait until 7 AM ET (12:00 UTC in EDT, 11:00 UTC in EST)
          # Manual dispatch with send_to_all bypasses this gate
          HOUR_UTC=$(date -u +%H)
          # 7 AM ET = 11 AM UTC (EDT) or 12 PM UTC (EST). Use 11 as the threshold.
          if [ "$HOUR_UTC" -lt 11 ]; then
            echo "::notice::Time gate: $HOUR_UTC UTC is before 7 AM ET (11 UTC). Skipping broadcast — will retry on next scoring cycle."
            echo "blocked=true" >> $GITHUB_OUTPUT
          else
            echo "Time gate passed: $HOUR_UTC UTC (after 7 AM ET)"
            echo "blocked=false" >> $GITHUB_OUTPUT
          fi

      - name: Readiness gate — market-aware (Broadway 15+agg, West End 12)
        if: steps.find.outputs.has_shows == 'true' && steps.time_gate.outputs.blocked != 'true' && inputs.send_to_all != 'true'
        id: readiness_gate
        run: |
          # Market-aware readiness gate (scripts/lib/broadcast-readiness.js):
          #   - Broadway: 15+ scored reviews AND >=1 aggregator (DTLI or BWW).
          #   - West End: 12+ scored reviews, NO aggregator requirement (WE reviews
          #     are LLM-scored and never carry DTLI/BWW thumbs; the old Broadway-only
          #     aggregator gate silently excluded every WE show — 2026-06-29).
          # PER-SHOW filter — shows that aren't ready are excluded, but ready shows
          # continue. Previously a single not-ready show blocked the entire batch
          # (e.g. a WE show with 0 reviews held Broadway hostage on Cats opening day
          # 2026-04-08: cats-the-jellicle-ball-2026 was ready but midnight-in-the-
          # toyshop-west-end-2026 had 0 reviews and failed the gate for both).
          SHOWS="${{ steps.find.outputs.shows }}"
          node -e "
            try {
              const { evaluateBroadcastReadiness } = require('./scripts/lib/broadcast-readiness');
              const raw = require('./data/reviews.json');
              const reviews = raw.reviews || raw;
              const allReviews = Array.isArray(reviews) ? reviews : [];
              const showsData = require('./data/shows.json').shows || require('./data/shows.json');
              const showsList = Array.isArray(showsData) ? showsData : Object.values(showsData);
              const catById = new Map(showsList.map(s => [s.id || s.slug, s.category || 'broadway']));
              const shows = '$SHOWS'.split(',');
              const ready = [];
              for (const id of shows) {
                const showReviews = allReviews.filter(r => r.showId === id);
                const category = catById.get(id) || 'broadway';
                const verdict = evaluateBroadcastReadiness(showReviews, category);
                if (!verdict.ready) {
                  process.stderr.write(id + ' (' + category + '): ' + verdict.reason + ' — not ready (excluded)\n');
                  continue;
                }
                process.stderr.write(id + ' (' + category + '): ' + verdict.reason + ' — ready\n');
                ready.push(id);
              }
              if (ready.length > 0) process.stdout.write(ready.join(','));
            } catch (err) {
              process.stderr.write('Readiness gate error: ' + err.message + '\n');
              process.exit(2);
            }
          " 2>/tmp/readiness_log 1>/tmp/ready_shows || {
            echo '::error::Readiness gate crashed — see log below'
            cat /tmp/readiness_log
            echo 'blocked=true' >> $GITHUB_OUTPUT
            echo 'ready_shows=' >> $GITHUB_OUTPUT
            # Exit 1 (not 0) so the job fails and notify-failure fires.
            # Otherwise blocked=true silently short-circuits everything downstream
            # and a persistently broken gate would prevent broadcasts forever
            # without alerting. The legitimate "no shows ready" case (line ~190)
            # uses exit 0 and is unaffected.
            exit 1
          }
          cat /tmp/readiness_log
          READY_SHOWS=$(cat /tmp/ready_shows)
          if [ -z "$READY_SHOWS" ]; then
            echo "::notice::Readiness gate: no shows ready for broadcast. Will retry on next scoring cycle."
            echo "blocked=true" >> $GITHUB_OUTPUT
            echo "ready_shows=" >> $GITHUB_OUTPUT
          else
            echo "Ready shows: $READY_SHOWS"
            echo "blocked=false" >> $GITHUB_OUTPUT
            echo "ready_shows=$READY_SHOWS" >> $GITHUB_OUTPUT
          fi

      - name: Check already broadcast
        if: steps.find.outputs.has_shows == 'true' && steps.time_gate.outputs.blocked != 'true' && steps.readiness_gate.outputs.blocked != 'true'
        id: check
        run: |
          # Read opening-night-sent.json if it exists, filter out completed shows.
          # SHOWS = only shows that passed the readiness gate (per-show filter) —
          # NOT steps.find.outputs.shows (which would include not-ready shows that
          # would poison the broadcast run).
          SHOWS="${{ steps.readiness_gate.outputs.ready_shows }}"
          PENDING=$(node -e "
            const fs = require('fs');
            const { hasRecentPreviewForShow } = require('./scripts/lib/preview-dedup');
            const sentPath = 'data/opening-night-sent.json';
            let sent = {};
            try { sent = JSON.parse(fs.readFileSync(sentPath, 'utf8')).shows || {}; } catch {}

            const shows = '$SHOWS'.split(',');
            // When send_to_all=true (approval dispatch) OR this is the scheduled
            // 12:30 UTC daily run, skip the preview dedup check. In both cases an
            // earlier preview may have already gone out (5 AM auto-dispatch after
            // scoring), and we still want to create the owner-review draft.
            const sendToAll = '${{ inputs.send_to_all }}' === 'true'
              || '${{ github.event_name }}' === 'schedule';

            // Load reviews once for readiness pre-check
            let allReviews = [];
            try {
              const rv = JSON.parse(fs.readFileSync('data/reviews.json', 'utf8'));
              allReviews = Array.isArray(rv) ? rv : (rv.reviews || []);
            } catch {}

            const pending = shows.filter(id => {
              // Always skip if full broadcast already completed
              if (sent[id] && sent[id].completed) return false;
              // Skip shows with 0 scored reviews — the broadcast script will exit early anyway,
              // and without this guard the failed attempt triggers gather → rebuild → score →
              // broadcast again (infinite feedback loop). Re-evaluated each scoring run.
              // Exception: approval dispatch always proceeds regardless of review count.
              if (!sendToAll) {
                const scoredCount = allReviews.filter(r => r.showId === id && r.assignedScore != null).length;
                if (scoredCount === 0) {
                  process.stderr.write('Skipping ' + id + ' — 0 scored reviews, not ready\n');
                  return false;
                }
              }
              // Skip if a preview for this show went out within the rolling 24h window —
              // but NOT in approval/send_to_all mode. Previously used sentAt.startsWith(today),
              // which silently double-sent at UTC rollover (2026-04-11 incident had a 14h gap
              // between duplicate sends — UTC-day check and short windows both missed it).
              // Rolling window + prefix scan lives in scripts/lib/preview-dedup.js.
              if (!sendToAll && hasRecentPreviewForShow(sent, id)) {
                process.stderr.write('Skipping ' + id + ' — preview sent within the last 24h\n');
                return false;
              }
              return true;
            });

            if (pending.length > 0) console.log(pending.join(','));
          ")

          if [ -z "$PENDING" ]; then
            echo "All shows already broadcast"
            echo "pending_shows=" >> $GITHUB_OUTPUT
            echo "broadway=" >> $GITHUB_OUTPUT
            echo "westend=" >> $GITHUB_OUTPUT
          else
            echo "Pending shows: $PENDING"
            echo "pending_shows=$PENDING" >> $GITHUB_OUTPUT

            # Split PENDING (post-readiness-gate) by market for the broadcast/push steps.
            # CRITICAL: must derive from PENDING — not from steps.find.outputs.{broadway,westend} —
            # otherwise shows that failed the workflow's stricter 15-review readiness gate
            # would still get broadcast via the script's looser internal MIN_REVIEWS=8 (WE).
            node -e "
              const shows = require('./data/shows.json').shows;
              const ids = '$PENDING'.split(',');
              const broadway = [], westend = [];
              for (const id of ids) {
                const s = shows.find(x => x.id === id);
                if (s && s.category === 'west-end') westend.push(id);
                else if (!s || !s.category || s.category === 'broadway') broadway.push(id);
              }
              if (broadway.length) console.log('broadway=' + broadway.join(','));
              else console.log('broadway=');
              if (westend.length) console.log('westend=' + westend.join(','));
              else console.log('westend=');
            " | while IFS= read -r line; do
              echo "$line" >> $GITHUB_OUTPUT
            done
          fi

      - name: Checklist gate — block send if QA errors (unless FORCE_BROADCAST=true)
        id: checklist_gate
        if: steps.check.outputs.pending_shows != ''
        env:
          DISCORD_WEBHOOK_ALERTS: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
        run: |
          FORCE="${{ inputs.force_broadcast }}"
          BLOCKED=false
          BREACHED_SHOWS=()
          IFS=',' read -ra SHOWS <<< "${{ steps.check.outputs.pending_shows }}"
          for SHOW in "${SHOWS[@]}"; do
            node scripts/opening-night-checklist.js --show="$SHOW" --json > /tmp/checklist-"$SHOW".json 2>&1 || true
            ERRORS=$(node -e "
              try {
                const d = JSON.parse(require('fs').readFileSync('/tmp/checklist-${SHOW}.json','utf8'));
                const total = (d.shows||[]).reduce((s,x)=>s+(x.summary&&x.summary.errors||0),0);
                console.log(total);
              } catch { console.log(0); }
            " 2>/dev/null || echo 0)
            echo "Show $SHOW: $ERRORS checklist error(s)"
            if [ "$ERRORS" -gt 0 ]; then
              BLOCKED=true
              BREACHED_SHOWS+=("$SHOW")
            fi
          done

          if [ "$BLOCKED" = "true" ] && [ "$FORCE" != "true" ]; then
            # Sorted (not iteration-order) so the same breached set always
            # produces the same conditionKey — codex adversarial review
            # 2026-07-23 flagged unsorted joins as a silent dedup-bypass if
            # array order ever shifted between retries.
            BREACHED_LIST=$(printf '%s\n' "${BREACHED_SHOWS[@]}" | sort | paste -sd, -)
            echo "::error::Checklist gate blocked broadcast — QA errors found. Set force_broadcast=true to override."
            # Routed through the alert router (email-noise Sprint 2, 2026-07-23):
            # a stuck orphan-unscored/checklist condition used to re-email this
            # SAME "Blocked" alert on every retry (9 emails for one root cause on
            # 2026-07-22) — the per-show conditionKey now collapses repeats
            # within 24h to a single email.
            #
            # blocked=true is written from INSIDE the node call, only once we
            # know the owner was actually informed (delivered or already-silent
            # per the ledger) — codex adversarial review 2026-07-23 flagged the
            # previous write-before-call ordering as a fail-CLOSED regression:
            # if routeAlert() threw or Resend delivery failed, blocked=true
            # would already be set, suppressing the generic notify-failure
            # fallback below and leaving the owner with ZERO email for a real
            # blocked broadcast (worse than the pre-migration behavior).
            BREACHED_LIST="$BREACHED_LIST" node -e "
              const { routeAlert } = require('./scripts/lib/owner-alert-router');
              routeAlert({
                conditionKey: 'broadcast-gate:checklist:' + (process.env.BREACHED_LIST || 'unknown'),
                title: 'Opening Night Broadcast Blocked — Checklist Errors',
                description: 'Automated broadcast halted: opening night checklist found errors for pending shows.\nCheck /tmp/checklist-*.json or re-run with force_broadcast=true to override.',
                severity: 'error',
                disposition: 'human',
                cooldownHours: 24,
                fields: [{ name: 'Shows', value: process.env.BREACHED_LIST || '(unknown)' }],
              }).then((result) => {
                // action==='digest' means the page-worthy gate (card #611) downgraded this
                // from 'human' — the owner WILL see it in the morning digest, so that
                // counts as informed too (otherwise this falls through to the generic
                // direct-email notify-failure step below, defeating the gate).
                const informed = result.action === 'silent' || result.action === 'digest' || (result.action === 'human' && result.delivered);
                if (informed) require('fs').appendFileSync(process.env.GITHUB_OUTPUT, 'blocked=true\n');
                else console.error('::warning::Alert delivery unconfirmed — leaving generic fallback notifier enabled');
                process.exit(1);
              }).catch(e => { process.stderr.write(e.message+'\n'); process.exit(1); });
            "
          else
            echo "Checklist gate passed (blocked=$BLOCKED, force=$FORCE)"
          fi

      - name: Drift gate — block send if reviews.json out of sync with review-texts (per-show)
        id: drift_gate
        if: steps.check.outputs.pending_shows != ''
        env:
          DISCORD_WEBHOOK_ALERTS: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
        run: |
          # Per-show drift gate. Same predicate as the daily Check Review-Count Drift
          # workflow, but with a tighter single-show threshold (>2 absolute, vs >3 daily).
          # At broadcast time the source-of-truth (data/review-texts/) and the derived
          # file (data/reviews.json) should agree near-exactly for the show we're about
          # to email — a missing review here is the most user-visible failure mode.
          # Audit output is show-scoped (data/audit/review-count-drift-{show}.json) so
          # this never overwrites the daily run's audit file.
          FORCE="${{ inputs.force_broadcast }}"
          BLOCKED=false
          BREACHED_SHOWS=()
          IFS=',' read -ra SHOWS <<< "${{ steps.check.outputs.pending_shows }}"
          for SHOW in "${SHOWS[@]}"; do
            # Capture exit code WITHOUT a pipe (memory: pipe-masks-exit-code).
            # --strict exits 2 on breach; everything else is exit 0/1.
            set +e
            node scripts/check-review-count-drift.js \
              --show="$SHOW" \
              --single-show-delta=2 \
              --strict \
              > /tmp/drift-"$SHOW".log 2>&1
            STATUS=$?
            set -e
            cat /tmp/drift-"$SHOW".log
            echo "Show $SHOW: drift check exit=$STATUS"
            if [ "$STATUS" -eq 2 ]; then
              BLOCKED=true
              BREACHED_SHOWS+=("$SHOW")
            elif [ "$STATUS" -ne 0 ]; then
              # Non-2 non-zero = script crash. Don't block broadcast on infrastructure
              # failure (review-texts dir missing, JSON parse error, etc.) — surface
              # as a warning so the run still notifies, but proceed to the send path.
              echo "::warning::Drift check for $SHOW crashed (exit $STATUS). Not blocking broadcast."
            fi
          done

          if [ "$BLOCKED" = "true" ] && [ "$FORCE" != "true" ]; then
            BREACHED_LIST=$(printf '%s\n' "${BREACHED_SHOWS[@]}" | sort | paste -sd, -)
            echo "::error::Drift gate blocked broadcast — review-count drift exceeds ±2 for: $BREACHED_LIST. Set force_broadcast=true to override."
            # blocked=true only written after confirmed delivery/silence — see
            # the checklist gate above for the fail-closed-to-silence bug this
            # avoids (codex adversarial review 2026-07-23).
            BREACHED_LIST="$BREACHED_LIST" node -e "
              const { routeAlert } = require('./scripts/lib/owner-alert-router');
              routeAlert({
                conditionKey: 'broadcast-gate:drift:' + (process.env.BREACHED_LIST || 'unknown'),
                title: 'Opening Night Broadcast Blocked — Review-Count Drift',
                description: 'Automated broadcast halted: scored in-window reviews are missing from data/reviews.json for one or more pending shows (or reviews.json is stale).\nCheck data/audit/review-count-drift-{show}.json or re-run with force_broadcast=true to override.',
                severity: 'error',
                disposition: 'human',
                cooldownHours: 24,
                fields: [{ name: 'Shows', value: process.env.BREACHED_LIST || '(unknown)' }],
              }).then((result) => {
                // action==='digest' means the page-worthy gate (card #611) downgraded this
                // from 'human' — the owner WILL see it in the morning digest, so that
                // counts as informed too (otherwise this falls through to the generic
                // direct-email notify-failure step below, defeating the gate).
                const informed = result.action === 'silent' || result.action === 'digest' || (result.action === 'human' && result.delivered);
                if (informed) require('fs').appendFileSync(process.env.GITHUB_OUTPUT, 'blocked=true\n');
                else console.error('::warning::Alert delivery unconfirmed — leaving generic fallback notifier enabled');
                process.exit(1);
              }).catch(e => { process.stderr.write(e.message+'\n'); process.exit(1); });
            "
          else
            echo "Drift gate passed (blocked=$BLOCKED, force=$FORCE)"
          fi

      - name: Orphan-unscored gate — self-heal requeue, alert only after exhausted attempts
        id: orphan_gate
        if: steps.check.outputs.pending_shows != ''
        env:
          DISCORD_WEBHOOK_ALERTS: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Lost Boys 2026-04-26 #8 defense (Gap 1). scripts/verify-all-scored.js
          # writes data/audit/orphan-unscored-{showId}.json when reviews with
          # includable text+excerpt land on disk without an assignedScore, and
          # dispatches a rescore unless its own 60-min per-show cooldown
          # suppresses it (lastDispatch = 'suppressed-cooldown').
          #
          # #356 self-heal: this used to email the operator on EVERY blocked
          # run — broadcast retries every ~2.8h via workflow_run, so a
          # cooldown-suppressed dispatch meant repeated emails until an
          # operator manually ran the rescore command (2026-07-23,
          # trainspotting-the-musical-west-end-2026, run 30054954304 —
          # nothing had auto-retried). scripts/dispatch-orphan-rescore-requeue.js
          # now self-dispatches once the cooldown clears, capped at 2
          # auto-attempts per show per rolling 24h, and only escalates through
          # owner-alert-router (never a raw email) past that cap — so this
          # step no longer fails the job / pages the operator on every retry;
          # it just blocks the send via the `blocked` output below.
          FORCE="${{ inputs.force_broadcast }}"
          BLOCKED=false
          IFS=',' read -ra SHOWS <<< "${{ steps.check.outputs.pending_shows }}"
          for SHOW in "${SHOWS[@]}"; do
            RESULT=$(node scripts/dispatch-orphan-rescore-requeue.js --show="$SHOW")
            echo "Show $SHOW: $RESULT"
            ACTION=$(echo "$RESULT" | node -e "try{process.stdout.write(JSON.parse(require('fs').readFileSync(0,'utf8')).action||'error')}catch{process.stdout.write('error')}")
            case "$ACTION" in
              clear) ;;
              in-flight|wait|dispatch) BLOCKED=true ;;
              alert) BLOCKED=true; echo "::error::Show $SHOW: orphan-unscored self-heal exhausted its 2-attempt/24h budget — owner-alert-router notified once." ;;
              error) BLOCKED=true; echo "::warning::Show $SHOW: dispatch-orphan-rescore-requeue.js hit an internal error (see log above) — failing closed, broadcast stays blocked." ;;
              *) BLOCKED=true; echo "::warning::Show $SHOW: dispatch-orphan-rescore-requeue.js returned unexpected action '$ACTION'" ;;
            esac
          done

          if [ "$BLOCKED" = "true" ] && [ "$FORCE" != "true" ]; then
            echo "::notice::Orphan-unscored gate blocking broadcast — self-heal requeue in progress (see per-show output above). No operator email unless the auto-dispatch budget is exhausted."
            echo "blocked=true" >> $GITHUB_OUTPUT
          else
            echo "Orphan-unscored gate passed (blocked=$BLOCKED, force=$FORCE)"
            echo "blocked=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit orphan-rescore-requeue state (early — before the job's 15-min budget can time out)
        # Writes Before Pushes (.github/workflows/CLAUDE.md): the "Commit data"
        # step near the end of this job only runs on success/always(), which
        # does NOT fire on cancellation — and this job runs consensus
        # generation (Claude calls) + broadcast send after this point, well
        # within reach of the 15-min job timeout on a multi-show day. A
        # cancellation between here and the late commit would silently lose
        # the attempt/alert-ledger state this self-heal depends on, resetting
        # the 2-attempt/24h budget and re-arming an alert that already fired
        # — the exact "repeated forever" failure mode this fix closes.
        # Committing right after the state is written removes that window;
        # the late "Commit data" step re-stages the same paths as a no-op
        # defense-in-depth if nothing changed since.
        if: steps.check.outputs.pending_shows != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          bash scripts/lib/git-add-existing.sh data/audit/orphan-rescore-requeue-state.json data/audit/alert-ledger.json
          if git diff --cached --quiet; then
            echo "No orphan-rescore-requeue state changes to commit"
            exit 0
          fi
          git commit -m "chore: Update orphan-rescore-requeue state [skip ci]"
          bash scripts/lib/push-with-retry.sh

      - uses: actions/setup-node@v5
        if: steps.check.outputs.pending_shows != ''
        with:
          node-version: 20

      - name: Install dependencies
        if: steps.check.outputs.pending_shows != ''
        run: npm ci

      - name: Sync subscribers (Formspree → local)
        if: steps.check.outputs.pending_shows != ''
        env:
          FORMSPREE_FOLLOW_API_KEY: ${{ secrets.FORMSPREE_FOLLOW_API_KEY }}
          FORMSPREE_SUBSCRIBER_API_KEY: ${{ secrets.FORMSPREE_SUBSCRIBER_API_KEY }}
          FORMSPREE_FOLLOW_FORM_ID: ${{ secrets.FORMSPREE_FOLLOW_FORM_ID }}
          FORMSPREE_SUBSCRIBER_FORM_ID: ${{ secrets.FORMSPREE_SUBSCRIBER_FORM_ID }}
          FORMSPREE_WESTEND_SUBSCRIBER_FORM_ID: ${{ secrets.FORMSPREE_WESTEND_SUBSCRIBER_FORM_ID }}
          FORMSPREE_WESTEND_SUBSCRIBER_API_KEY: ${{ secrets.FORMSPREE_WESTEND_SUBSCRIBER_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          # BUTTONDOWN_API_KEY intentionally omitted — Buttondown sync is manual only.
          # Automated sync hammers the 100/day API limit. Run sync-followers.js locally when needed.
        run: node scripts/sync-followers.js

      - name: Generate consensus
        if: steps.check.outputs.pending_shows != ''
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          IFS=',' read -ra SHOWS <<< "${{ steps.check.outputs.pending_shows }}"
          for SHOW in "${SHOWS[@]}"; do
            node scripts/generate-critic-consensus.js --show="$SHOW" || true
          done

      - name: Generate mobile data (pre-computed scores for email)
        if: steps.check.outputs.pending_shows != ''
        run: bash scripts/generate-mobile-artifacts.sh

      - name: Create broadcast draft (owner sends manually from Resend)
        if: steps.check.outputs.pending_shows != '' && env.BROADCAST_HOLD_ACTIVE != 'true' && steps.orphan_gate.outputs.blocked != 'true'
        id: broadcast
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_WE_AUDIENCE_ID: ${{ secrets.RESEND_WE_AUDIENCE_ID }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
          # Required by scripts/lib/send-lock.js — it acquires a cross-session
          # advisory lock via the GitHub Contents API before any Resend
          # call, to prevent double-sends when a CLI session and this workflow run
          # in parallel. Without GH_TOKEN, `gh api` in CI would fail auth and the
          # lock helper would exit(1), blocking the send rather than risking a race.
          GH_TOKEN: ${{ github.token }}
        run: |
          # Modes:
          #   - send_to=<email>: transactional preview to that address only (no draft)
          #   - send_to_all=true OR scheduled run: send preview to owner AND create Resend draft
          #   - default (workflow_run auto-retry / update-show-status dispatch): preview to owner only
          LOOKBACK=${{ inputs.lookback_days || 2 }}
          SEND_TO_FLAG=""
          CREATE_DRAFT="false"

          if [ -n "${{ inputs.send_to }}" ]; then
            SEND_TO_FLAG="--send-to=${{ inputs.send_to }}"
            echo "** PREVIEW MODE — sending test email to ${{ inputs.send_to }} only **"
          elif [ "${{ inputs.send_to_all }}" = "true" ] || [ "${{ github.event_name }}" = "schedule" ]; then
            # Approval dispatch or scheduled 12:30 UTC run: preview to owner + Resend draft
            SEND_TO_FLAG="--send-to=${{ secrets.OWNER_EMAIL }}"
            CREATE_DRAFT="true"
            echo "** APPROVAL MODE — sending preview to owner AND creating Resend draft **"
          else
            SEND_TO_FLAG="--send-to=${{ secrets.OWNER_EMAIL }}"
            echo "** PREVIEW MODE — sending preview to owner for approval **"
          fi

          SENT="false"

          run_market() {
            local market="$1"
            local shows="$2"
            echo "--- $market preview ---"
            OUTPUT=$(node scripts/send-opening-night-broadcast.js --market="$market" --lookback="$LOOKBACK" --shows="$shows" $SEND_TO_FLAG 2>&1) || true
            echo "$OUTPUT"
            if echo "$OUTPUT" | grep -q "Draft ready\|Draft created\|Preview sent to"; then
              SENT="true"
            fi
            if [ "$CREATE_DRAFT" = "true" ]; then
              echo "--- $market draft ---"
              OUTPUT=$(node scripts/send-opening-night-broadcast.js --market="$market" --lookback="$LOOKBACK" --shows="$shows" 2>&1) || true
              echo "$OUTPUT"
              if echo "$OUTPUT" | grep -q "Draft ready\|Draft created"; then
                SENT="true"
              fi
            fi
          }

          # Broadway (skip if no Broadway shows passed the readiness gate).
          # Uses steps.check.outputs.broadway (post-gate filtered), NOT steps.find.outputs.broadway.
          # Passing --shows=ID,ID restricts the script to the exact ready set so its looser
          # internal MIN_REVIEWS threshold can't bypass the workflow's stricter gate.
          if [ -n "${{ steps.check.outputs.broadway }}" ]; then
            run_market broadway "${{ steps.check.outputs.broadway }}"
          else
            echo "No Broadway shows to send"
          fi

          # West End (skip if no WE shows passed the readiness gate)
          if [ -n "${{ steps.check.outputs.westend }}" ]; then
            run_market west-end "${{ steps.check.outputs.westend }}"
          else
            echo "No West End shows to send"
          fi

          echo "broadcast_sent=$SENT" >> $GITHUB_OUTPUT

      - name: Gather more reviews if not ready
        if: steps.check.outputs.pending_shows != '' && steps.broadcast.outputs.broadcast_sent != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PENDING="${{ steps.check.outputs.pending_shows }}"

          # Guard 1: Only dispatch gather after embargo lifts (~1 AM UTC / 8 PM ET).
          # Before that, reviews don't exist yet — dispatching just creates a feedback loop
          # (broadcast → gather → rebuild → score → broadcast).
          HOUR_UTC=$(date -u +%H)
          if [ "$HOUR_UTC" -lt 1 ] || [ "$HOUR_UTC" -ge 8 ]; then
            # Between 8 AM and 1 AM UTC (3 AM-8 PM ET) — too early for opening-night reviews
            # Skip the check between 1-8 AM UTC when reviews are expected
            # Also skip shows opening today (no reviews can exist yet)
            SAME_DAY_ONLY=$(node -e "
              const shows = require('./data/shows.json').shows;
              const today = new Date().toISOString().slice(0,10);
              const ids = '$PENDING'.split(',');
              const allToday = ids.every(id => {
                const s = shows.find(x => x.id === id);
                return s && s.openingDate === today;
              });
              console.log(allToday ? 'true' : 'false');
            ")
            if [ "$SAME_DAY_ONLY" = "true" ]; then
              echo "All pending shows opened today — reviews won't exist until this evening. Skipping gather."
              exit 0
            fi
          fi

          # Guard 2: Don't dispatch if gather already running or dispatched recently
          RUNNING=$(gh run list --workflow=gather-reviews.yml --status=in_progress --status=queued --json databaseId --jq 'length' 2>/dev/null || echo "0")
          if [ "$RUNNING" -gt 0 ]; then
            echo "Gather already running/queued — skipping dispatch"
          else
            # Guard 3: Don't dispatch if gather ran in the last 2 hours (prevents loop)
            RECENT=$(gh run list --workflow=gather-reviews.yml --limit=1 --json createdAt -q '.[0].createdAt' 2>/dev/null || echo "")
            SKIP_GATHER=false
            if [ -n "$RECENT" ]; then
              RECENT_TS=$(date -d "$RECENT" +%s 2>/dev/null || date -j -f "%Y-%m-%dT%H:%M:%SZ" "$RECENT" +%s 2>/dev/null || echo "0")
              NOW_TS=$(date +%s)
              AGE=$(( NOW_TS - RECENT_TS ))
              if [ "$AGE" -lt 7200 ]; then
                echo "Gather ran ${AGE}s ago (<2h) — skipping to prevent loop"
                SKIP_GATHER=true
              fi
            fi

            if [ "$SKIP_GATHER" = "false" ]; then
              echo "Shows not ready for broadcast — triggering gather-reviews for: $PENDING"
              gh workflow run gather-reviews.yml -f shows="$PENDING" -f validate_urls=true || echo "Gather dispatch failed"
            fi
          fi

      - name: Alert if broadcast overdue (max once per show per day)
        if: steps.check.outputs.pending_shows != '' && steps.broadcast.outputs.broadcast_sent != 'true'
        env:
          DISCORD_WEBHOOK_ALERTS: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
        run: |
          # Alert if a show's opening-night reviews should exist by now but broadcast hasn't sent.
          # Reference: 4 AM UTC day after opening (~11 PM ET + 5h for gather/score pipeline).
          # Dedup: only alert once per show per day via opening-night-sent.json.
          OVERDUE=$(node -e "
            const fs = require('fs');
            const { hasRecentOverdueAlert } = require('./scripts/lib/preview-dedup');
            const shows = require('./data/shows.json').shows;
            const ids = '${{ steps.check.outputs.pending_shows }}'.split(',');
            const now = Date.now();

            // Dedup: read sent tracking to skip shows already alerted within 24h
            let sent = {};
            try { sent = JSON.parse(fs.readFileSync('data/opening-night-sent.json', 'utf8')).shows || {}; } catch {}

            // Load reviews to check whether a show has enough scored reviews to actually send.
            // A show with <8 scored reviews cannot broadcast yet — this is not a pipeline failure,
            // just a show with sparse critical coverage. Don't alert until reviews exist.
            let allReviews = [];
            try {
              const rv = JSON.parse(fs.readFileSync('data/reviews.json', 'utf8'));
              allReviews = Array.isArray(rv) ? rv : (rv.reviews || []);
            } catch {}
            const MIN_REVIEWS_TO_ALERT = 8;

            const overdue = ids.filter(id => {
              const s = shows.find(x => x.id === id);
              if (!s || !s.openingDate) return false;
              // Skip if show doesn't have enough scored reviews to send a broadcast.
              // Alerting here would be noise — the pipeline isn't stuck, reviews just haven't
              // accumulated yet. The broadcast will auto-send once MIN_REVIEWS_TO_ALERT is reached.
              const scoredCount = allReviews.filter(r => r.showId === id && r.assignedScore != null).length;
              if (scoredCount < MIN_REVIEWS_TO_ALERT) return false;
              // Reviews should be gathered/scored by 4 AM UTC the day after opening
              // (curtain ~8 PM ET, reviews ~10-11 PM ET, gather/score pipeline ~2-3h)
              const overdueAfter = new Date(s.openingDate + 'T04:00:00Z');
              overdueAfter.setDate(overdueAfter.getDate() + 1); // day AFTER opening
              if (now <= overdueAfter.getTime()) return false;
              // Skip if overdue alert already sent within the rolling 24h window for this show.
              // Previously startsWith(today) against UTC date — silently re-alerted across UTC
              // midnight (2026-04-11 bug class). Helper lives in scripts/lib/preview-dedup.js.
              if (hasRecentOverdueAlert(sent, id, 24 * 3600 * 1000, now)) return false;
              return true;
            }).map(id => {
              const s = shows.find(x => x.id === id);
              return s ? s.title : id;
            });

            // Mark alerted shows so we don't spam
            if (overdue.length > 0) {
              const sentData = { shows: sent };
              try { Object.assign(sentData, JSON.parse(fs.readFileSync('data/opening-night-sent.json', 'utf8'))); } catch {}
              if (!sentData.shows) sentData.shows = {};
              for (const id of ids) {
                const alertKey = 'overdue-alert:' + id;
                sentData.shows[alertKey] = { sentAt: new Date().toISOString() };
              }
              fs.writeFileSync('data/opening-night-sent.json', JSON.stringify(sentData, null, 2));
            }

            if (overdue.length) console.log(overdue.join(', '));
          ")

          if [ -n "$OVERDUE" ]; then
            echo "::warning::Broadcast overdue for: $OVERDUE"
            # Record alert timestamp to enforce cooldown on next runs
            node -e "
              const fs = require('fs');
              const sentPath = 'data/opening-night-sent.json';
              let data = {};
              try { data = JSON.parse(fs.readFileSync(sentPath, 'utf8')); } catch {}
              if (!data.shows) data.shows = {};
              const ids = '${{ steps.check.outputs.pending_shows }}'.split(',');
              for (const id of ids) {
                if (!data.shows[id]) data.shows[id] = {};
                data.shows[id].lastOverdueAlertAt = new Date().toISOString();
              }
              fs.writeFileSync(sentPath, JSON.stringify(data, null, 2));
            "
            git add -f data/opening-night-sent.json 2>/dev/null || true
            node -e "
              const { sendAlert } = require('./scripts/lib/discord-notify.js');
              sendAlert({
                title: 'Opening Night Broadcast Overdue',
                description: 'These shows opened 6+ hours ago but the broadcast has not sent. The data pipeline may be stuck (gather/rebuild/score).',
                severity: 'error',
                email: true,
                fields: [{ name: 'Shows', value: '$OVERDUE' }],
              });
            "
          fi

      - name: Append broadcast handoff to Express completion audit
        if: steps.broadcast.outputs.broadcast_sent == 'true' && steps.check.outputs.pending_shows != ''
        continue-on-error: true
        run: |
          # Updates data/audit/opening-night-express-completed.json with broadcastDraftedAt/DraftId
          # for any show that has an Express completion record AND just got a Resend draft created.
          # This makes the audit file a single end-to-end view (Express → rebuild → score → broadcast draft).
          # Non-fatal: if the audit file doesn't exist (broadcast ran without Express), we just skip.
          node -e "
            const fs = require('fs');
            const auditPath = 'data/audit/opening-night-express-completed.json';
            const sentPath = 'data/opening-night-sent.json';
            if (!fs.existsSync(auditPath)) {
              console.log('No Express completion audit — skipping handoff append');
              process.exit(0);
            }
            const audit = JSON.parse(fs.readFileSync(auditPath, 'utf8'));
            const sent = fs.existsSync(sentPath)
              ? JSON.parse(fs.readFileSync(sentPath, 'utf8'))
              : { shows: {} };
            let updated = 0;
            for (const [showId, record] of Object.entries(audit.shows || {})) {
              const sentRec = sent.shows && sent.shows[showId];
              if (sentRec && sentRec.draftId && record.broadcastDraftId !== sentRec.draftId) {
                record.broadcastDraftedAt = sentRec.draftCreatedAt || new Date().toISOString();
                record.broadcastDraftId = sentRec.draftId;
                updated++;
              }
            }
            if (updated > 0) {
              fs.writeFileSync(auditPath, JSON.stringify(audit, null, 2) + '\n');
              console.log('Appended broadcast handoff for ' + updated + ' Express shows');
            } else {
              console.log('No Express shows to update (either no drafts this run or already recorded)');
            }
          "

      - name: Send push notifications (mobile app)
        if: steps.check.outputs.broadway != '' && env.BROADCAST_HOLD_ACTIVE != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.REVIEW_TEXTS_TOKEN }}
        run: |
          # Dispatch push notification to mobile app for each Broadway show that
          # actually broadcast (post-readiness-gate set, NOT steps.find.outputs.broadway).
          IFS=',' read -ra SHOW_IDS <<< "${{ steps.check.outputs.broadway }}"
          for SHOW_ID in "${SHOW_IDS[@]}"; do
            # Look up slug and title from shows.json
            SHOW_INFO=$(node -e "
              const shows = require('./data/shows.json').shows;
              const s = shows.find(x => x.id === '$SHOW_ID');
              if (s) console.log(JSON.stringify({ slug: s.slug || s.id, title: s.title }));
            ")
            if [ -z "$SHOW_INFO" ]; then
              echo "Show $SHOW_ID not found in shows.json, skipping push"
              continue
            fi
            SLUG=$(echo "$SHOW_INFO" | jq -r '.slug')
            TITLE=$(echo "$SHOW_INFO" | jq -r '.title')
            echo "Dispatching push notification for: $TITLE ($SLUG)"
            gh workflow run send-notifications.yml \
              --repo thomaspryor/BroadwayScorecard-app \
              -f type=reviews-in \
              -f "show=$SLUG" \
              -f "title=$TITLE" || echo "Push dispatch failed for $SLUG — non-critical"
          done

      - name: Commit data
        if: always() && steps.find.outputs.has_shows == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Core data files pushed to private repo by push-core-data action
          # Subscriber files are ephemeral (recreated from Formspree each run)
          # opening-night-sent.json is gitignored but must persist — force-add with explicit error check
          if [ -f data/opening-night-sent.json ]; then
            git add --force data/opening-night-sent.json
            echo "Staged opening-night-sent.json for commit"
          else
            echo "WARNING: opening-night-sent.json not found — sent tracking will be lost"
          fi
          if [ -f data/audit/opening-night-express-completed.json ]; then
            git add data/audit/opening-night-express-completed.json
            echo "Staged opening-night-express-completed.json (broadcast handoff)"
          fi
          # #356: orphan-unscored self-heal attempt tracking + the
          # owner-alert-router ledger it writes through on escalation. Must
          # be committed here (this workflow is the caller) or the next run's
          # checkout starts fresh and re-notifies/re-attempts from zero.
          if [ -f data/audit/orphan-rescore-requeue-state.json ]; then
            git add data/audit/orphan-rescore-requeue-state.json
            echo "Staged orphan-rescore-requeue-state.json"
          fi
          if [ -f data/audit/alert-ledger.json ]; then
            git add data/audit/alert-ledger.json
            echo "Staged alert-ledger.json"
          fi
          # Skip push if nothing to commit (avoids push race failures)
          if git diff --cached --quiet; then
            echo "No changes to commit — skipping push"
            exit 0
          fi
          git commit -m "data: Update opening-night-sent tracking"
          bash scripts/lib/push-with-retry.sh


      - name: Push core data to private repo
        if: always() && steps.find.outputs.has_shows == 'true'
        uses: ./.github/actions/push-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
          message: 'data: Update from opening-night-broadcast'

      - name: Trigger deploy (core data changed)
        if: always() && steps.find.outputs.has_shows == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Deploy dedup: skip if a deploy was ALREADY triggered after our rebuild started
          OUR_RUN_START=$(gh run view ${{ github.run_id }} --json createdAt -q '.createdAt' 2>/dev/null || echo "")
          RECENT=$(gh run list --workflow=vercel-deploy.yml --limit=1 --json createdAt -q '.[0].createdAt' 2>/dev/null || echo "")

          if [ -n "$RECENT" ] && [ -n "$OUR_RUN_START" ]; then
            RECENT_TS=$(date -d "$RECENT" +%s 2>/dev/null || date -j -f "%Y-%m-%dT%H:%M:%SZ" "$RECENT" +%s 2>/dev/null || echo "0")
            OUR_TS=$(date -d "$OUR_RUN_START" +%s 2>/dev/null || date -j -f "%Y-%m-%dT%H:%M:%SZ" "$OUR_RUN_START" +%s 2>/dev/null || echo "0")
            NOW_TS=$(date +%s)
            DIFF=$((NOW_TS - RECENT_TS))

            if [ "$RECENT_TS" -gt "$OUR_TS" ] && [ "$DIFF" -lt 900 ]; then
              echo "Skipping deploy — already triggered after this run started (${DIFF}s ago)"
              exit 0
            fi
          fi

          echo "Triggering deploy..."
          gh workflow run vercel-deploy.yml || echo "Deploy dispatch failed — will deploy on next schedule"

      - name: Submit show pages to Google Indexing API
        if: steps.find.outputs.has_shows == 'true' && env.GOOGLE_INDEXING_KEY != ''
        continue-on-error: true
        env:
          GOOGLE_INDEXING_KEY: ${{ secrets.GOOGLE_INDEXING_KEY }}
        run: |
          # Convert show IDs to slugs for URL submission
          SLUGS=$(node -e "
            const shows = require('./data/shows.json').shows;
            const ids = '${{ steps.find.outputs.shows }}'.split(',');
            const slugs = ids.map(id => {
              const s = shows.find(x => x.id === id);
              return s ? s.slug : id;
            });
            console.log(slugs.join(','));
          ")
          node scripts/submit-google-indexing.js --shows "$SLUGS"

      - name: Submit show pages to IndexNow
        if: steps.find.outputs.has_shows == 'true'
        continue-on-error: true
        run: |
          SLUGS=$(node -e "
            const shows = require('./data/shows.json').shows;
            const ids = '${{ steps.find.outputs.shows }}'.split(',');
            const slugs = ids.map(id => {
              const s = shows.find(x => x.id === id);
              return s ? s.slug : id;
            });
            console.log(slugs.join(','));
          ")
          node scripts/submit-indexnow.js --shows "$SLUGS"

      # submit-google-indexing.js records usage in the shared daily quota
      # ledger (data/audit/indexing-api-usage.json, 200/day). The submit steps
      # run AFTER "Commit data", so without this commit the run's usage is
      # silently discarded and other same-day callers (check-seo-health,
      # update-show-status) undercount the quota.
      - name: Record indexing quota usage
        if: steps.find.outputs.has_shows == 'true' && env.GOOGLE_INDEXING_KEY != ''
        continue-on-error: true
        env:
          GOOGLE_INDEXING_KEY: ${{ secrets.GOOGLE_INDEXING_KEY }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          bash scripts/lib/git-add-existing.sh data/audit/indexing-api-usage.json
          if git diff --staged --quiet; then
            echo "No quota usage to record"
            exit 0
          fi
          git commit -m "chore: Record indexing API quota usage [skip ci]"
          bash scripts/lib/push-with-retry.sh || echo "::warning::Quota ledger push failed"

      # Skipped when a broadcast gate (checklist/drift/orphan-unscored) already
      # blocked and alerted above — that alert is specific (which gate, which
      # show, the fix command) and already routed through owner-alert-router's
      # dedup ledger. Without this guard, ONE gate-blocked failure produced a
      # triplet of emails ([CRITICAL] Blocked + [CRITICAL] Failed + [Investigation]
      # Failed) — 9 emails for one stuck condition across 3 retries on
      # 2026-07-22 (email-noise Sprint 2, 2026-07-23). A genuine crash with no
      # gate flag set still pages normally.
      - name: Notify on failure
        id: notify
        if: failure() && steps.checklist_gate.outputs.blocked != 'true' && steps.drift_gate.outputs.blocked != 'true' && steps.orphan_gate.outputs.blocked != 'true'
        uses: ./.github/actions/notify-failure
        with:
          title: 'Opening Night Broadcast Failed'
          severity: 'critical'
          email: 'true'
          discord_webhook: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
          resend_api_key: ${{ secrets.RESEND_API_KEY }}
          owner_email: ${{ secrets.OWNER_EMAIL }}

      - name: Trigger investigation
        # Only when the failure actually paged (2h cooldown) — a repeat failure
        # inside the cooldown shouldn't send a second investigation email. Same
        # known-gate skip as "Notify on failure" above.
        if: failure() && steps.notify.outputs.suppressed != 'true' && steps.checklist_gate.outputs.blocked != 'true' && steps.drift_gate.outputs.blocked != 'true' && steps.orphan_gate.outputs.blocked != 'true'
        env:
          GH_TOKEN: ${{ secrets.REVIEW_TEXTS_TOKEN }}
        run: |
          gh workflow run investigate-alert.yml \
            -f alert_type=opening_night_broadcast_fail \
            -f alert_title="Opening Night Broadcast Failed" \
            -f alert_context='{"note":"Broadcast auto-retry is prohibited — investigation only, no auto-fix."}' \
            -f run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"