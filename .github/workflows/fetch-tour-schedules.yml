name: Fetch Tour Schedules

on:
  schedule:
    # Daily at 07:47 UTC (jittered off the hour).
    - cron: '47 7 * * *'
  workflow_dispatch: {}

# National-tour engagement lists from Tours To You (BRO-4601), for the
# "Now in / Next" card line and the Tour Schedule card. Plain GETs to a public
# HTML site with a pause between tours: no scraping secrets, no fetchPage().
# The data file is committed only when a tour's stops changed. The site picks
# it up on the next deploy (the deploy gate does not watch data/*.json, so up
# to its 6h backstop on a quiet day).

concurrency:
  group: fetch-tour-schedules
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    # ~2 min of fetching (6s pause x ~20 tours) plus push-with-retry headroom,
    # same reasoning as fetch-todaytix-showtimes.yml.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout core data
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Fetch tour schedules
        run: node scripts/fetch-tour-schedules.js

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet data/tour-schedules.json; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/tour-schedules.json
          git commit -m "data: Update tour schedules [skip ci]"
          bash scripts/lib/push-with-retry.sh

      - name: Dispatch deploy
        if: steps.changes.outputs.has_changes == 'true'
        uses: ./.github/actions/dispatch-deploy

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: 'Fetch Tour Schedules Failed'
          severity: 'warning'
          discord_webhook: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
