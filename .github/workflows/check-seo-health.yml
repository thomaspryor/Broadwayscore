name: Check SEO Health

on:
  schedule:
    - cron: '0 8 * * 0'  # Sunday 8 AM UTC
  workflow_dispatch: {}

concurrency:
  group: seo-health
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Checkout core data
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Run SEO health check
        env:
          GOOGLE_INDEXING_KEY: ${{ secrets.GOOGLE_INDEXING_KEY }}
          PAGESPEED_API_KEY: ${{ secrets.PAGESPEED_API_KEY }}
          DISCORD_WEBHOOK_ALERTS: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
        run: node scripts/check-seo-health.js

      - name: Commit audit data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Only add specific SEO audit files — never git add -A
          bash scripts/lib/git-add-existing.sh --force data/audit/seo-health.json data/audit/seo-performance-history.json data/audit/indexing-api-usage.json
          if git diff --cached --quiet; then
            echo "No audit data changes to commit"
          else
            git commit -m "chore: Update SEO health audit data [skip ci]"
          fi

      - name: Push audit data
        if: always()
        run: |
          bash scripts/lib/push-with-retry.sh

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: 'SEO Health Check Failed'
          email: 'true'
          discord_webhook: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
          resend_api_key: ${{ secrets.RESEND_API_KEY }}
          owner_email: ${{ secrets.OWNER_EMAIL }}
