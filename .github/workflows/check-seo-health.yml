name: Check SEO Health

on:
  schedule:
    - cron: '0 8 * * 0'  # Sunday 8 AM UTC
  workflow_dispatch: {}

concurrency:
  group: seo-health
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    # Backstop: the script wraps every external call in a 30-60s timeout, but cap the
    # whole job too so a pathological stall can never burn the 360-min default ceiling.
    # 45 (not 25): the health check itself runs ~13min (GSC/PageSpeed calls across 50
    # sample URLs), and the "Push audit data" step now carries a 900s push-with-retry.sh
    # budget (task #353) to survive main's commit churn — 25min left only ~12min for
    # that budget and the OUTER job timeout cancelled the push mid-retry before it could
    # exhaust its own deadline (run 30056319394, 2026-07-24, confirmed live).
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Checkout core data
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Run SEO health check
        env:
          GOOGLE_INDEXING_KEY: ${{ secrets.GOOGLE_INDEXING_KEY }}
          PAGESPEED_API_KEY: ${{ secrets.PAGESPEED_API_KEY }}
          DISCORD_WEBHOOK_ALERTS: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
        run: node scripts/check-seo-health.js

      - name: Commit audit data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Only add specific SEO audit files — never git add -A
          bash scripts/lib/git-add-existing.sh --force data/audit/seo-health.json data/audit/seo-performance-history.json data/audit/indexing-api-usage.json
          if git diff --cached --quiet; then
            echo "No audit data changes to commit"
          else
            git commit -m "chore: Update SEO health audit data [skip ci]"
          fi

      - name: Push audit data
        if: always()
        run: |
          # Non-blocking + wider budget: this push races main's commit churn
          # (task #353 — live-reproduced on run 30055222564, 2026-07-24: 3
          # attempts, each rejected as the remote tip kept advancing during
          # the retry cycle, deadline exceeded). The audit snapshot isn't
          # time-sensitive — next week's cron re-derives it — so a lost race
          # must not redden this run.
          bash scripts/lib/push-with-retry.sh 20 || echo "::warning::SEO audit data push failed — next scheduled run will recommit"
        env:
          PUSH_DEADLINE_SEC: 900

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: 'SEO Health Check Failed'
          email: 'true'
          discord_webhook: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
          resend_api_key: ${{ secrets.RESEND_API_KEY }}
          owner_email: ${{ secrets.OWNER_EMAIL }}
