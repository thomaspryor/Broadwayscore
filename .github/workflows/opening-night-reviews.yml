name: Opening Night Reviews

on:
  schedule:
    # 5 AM UTC = midnight EST — reviews published ~10-11 PM, aggregators indexed by midnight
    - cron: '0 5 * * *'
    # 15 UTC = 11 AM ET / 4 PM BST — same-day late-population sweep.
    # DTLI/BWW RR frequently add reviews 6-12h after opening as outlets trickle in.
    # The orchestrator's 6h window ends too early for these; this cron catches them
    # on the same day before the next evening cron.
    - cron: '0 15 * * *'
  workflow_dispatch:
    inputs:
      lookback_days:
        description: 'How many days back to check for openings (default 14)'
        required: false
        type: number
        default: 14

permissions:
  contents: read
  actions: write

jobs:
  check-and-trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main


      - name: Checkout core data
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
      - name: Find recently opened shows (scheduled search days)
        id: find
        run: |
          LOOKBACK=${{ inputs.lookback_days || 14 }}
          # Find shows opened in lookback window, but only SERP-search on scheduled days:
          # Days 0-1: full search (all outlets)
          # Day 3: search outlets with <2 reviews
          # Day 7: search outlets with <2 reviews
          # Day 14: final sweep
          # Other days: skip SERP (saves ~75% of daily SERP calls)
          RESULT=$(node -e "
            const shows = require('./data/shows.json').shows;
            const now = new Date();
            const cutoff = new Date(now);
            cutoff.setDate(cutoff.getDate() - $LOOKBACK);
            cutoff.setHours(0,0,0,0);

            const SEARCH_DAYS = [0, 1, 3, 7, 14];
            const GATHER_MAX_DAYS = 3; // Only dispatch gather-reviews for shows ≤3 days old

            const opened = shows.filter(s => {
              if (s.status !== 'open' || !s.openingDate) return false;
              const d = new Date(s.openingDate);
              d.setHours(0,0,0,0);
              return d >= cutoff && d <= now;
            });

            // Partition into SERP-eligible and gather-eligible
            const serpShows = [];
            const gatherShows = [];

            for (const s of opened) {
              const daysSinceOpening = Math.floor((now - new Date(s.openingDate)) / (1000 * 60 * 60 * 24));
              const isSearchDay = SEARCH_DAYS.includes(daysSinceOpening);
              if (isSearchDay) serpShows.push(s.id);
              if (daysSinceOpening <= GATHER_MAX_DAYS) gatherShows.push(s.id);
            }

            // Output as JSON for structured parsing
            console.log(JSON.stringify({
              serp: serpShows,
              gather: gatherShows,
              all: opened.map(s => s.id)
            }));
          ")

          if [ -z "$RESULT" ] || [ "$RESULT" = '{"serp":[],"gather":[],"all":[]}' ]; then
            echo "No recently opened shows found"
            echo "has_shows=false" >> $GITHUB_OUTPUT
          else
            SERP_SHOWS=$(echo "$RESULT" | node -e "const d=require('fs').readFileSync('/dev/stdin','utf8');const j=JSON.parse(d);console.log(j.serp.join(','))")
            GATHER_SHOWS=$(echo "$RESULT" | node -e "const d=require('fs').readFileSync('/dev/stdin','utf8');const j=JSON.parse(d);console.log(j.gather.join(','))")
            ALL_SHOWS=$(echo "$RESULT" | node -e "const d=require('fs').readFileSync('/dev/stdin','utf8');const j=JSON.parse(d);console.log(j.all.join(','))")

            echo "All recently opened shows: $ALL_SHOWS"
            echo "SERP-eligible (scheduled day): $SERP_SHOWS"
            echo "Gather-eligible (≤3 days): $GATHER_SHOWS"

            echo "has_shows=true" >> $GITHUB_OUTPUT
            echo "shows=$ALL_SHOWS" >> $GITHUB_OUTPUT
            echo "serp_shows=$SERP_SHOWS" >> $GITHUB_OUTPUT
            echo "gather_shows=$GATHER_SHOWS" >> $GITHUB_OUTPUT
          fi

      - name: Check if gather-reviews already running
        if: steps.find.outputs.has_shows == 'true'
        id: guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUNNING=$(gh run list --workflow=gather-reviews.yml --status=in_progress --json databaseId --jq 'length' 2>/dev/null || echo "0")
          if [ "$RUNNING" -gt 0 ]; then
            echo "Gather reviews already running ($RUNNING active). Skipping."
            echo "should_trigger=false" >> $GITHUB_OUTPUT
          else
            echo "should_trigger=true" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        if: steps.find.outputs.has_shows == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        if: steps.find.outputs.has_shows == 'true'
        run: npm ci --ignore-scripts

      - name: Checkout review-texts
        if: steps.find.outputs.has_shows == 'true'
        uses: ./.github/actions/checkout-review-texts
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}

      - name: Discover reviews via SERP (scheduled days only)
        if: steps.find.outputs.has_shows == 'true' && steps.find.outputs.serp_shows != ''
        continue-on-error: true
        env:
          SCRAPINGBEE_API_KEY: ${{ secrets.SCRAPINGBEE_API_KEY }}
          SCRAPINGDOG_API_KEY: ${{ secrets.SCRAPINGDOG_API_KEY }}
          SCRAPER_USE_SCRAPINGDOG: '1'
          BRIGHTDATA_TOKEN: ${{ secrets.BRIGHTDATA_TOKEN }}
          BRIGHTDATA_ZONE: ${{ secrets.BRIGHTDATA_ZONE }}
        run: |
          SERP_SHOWS="${{ steps.find.outputs.serp_shows }}"
          if [ -z "$SERP_SHOWS" ]; then
            echo "No shows eligible for SERP today (not a scheduled search day)"
            exit 0
          fi
          IFS=',' read -ra SHOWS <<< "$SERP_SHOWS"
          echo "SERP searching ${#SHOWS[@]} shows (scheduled search day)"
          for SHOW in "${SHOWS[@]}"; do
            echo "=== Discovering reviews for $SHOW ==="
            node scripts/discover-opening-night-reviews.js --show="$SHOW" --tiers=1,2 || true
            sleep 2
          done

      - name: Push review-texts (SERP discoveries)
        if: steps.find.outputs.has_shows == 'true'
        continue-on-error: true
        uses: ./.github/actions/push-review-texts
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
          message: 'data: Opening night SERP discoveries'

      - name: Trigger gather-reviews (≤3 days only)
        if: steps.find.outputs.has_shows == 'true' && steps.guard.outputs.should_trigger == 'true' && steps.find.outputs.gather_shows != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          GATHER_SHOWS="${{ steps.find.outputs.gather_shows }}"
          if [ -z "$GATHER_SHOWS" ]; then
            echo "No shows ≤3 days old — skipping gather-reviews dispatch"
            exit 0
          fi
          echo "Triggering gather-reviews for shows ≤3 days old: $GATHER_SHOWS"
          # Use aggregators-only mode at midnight (5 AM UTC) — SERP hasn't indexed
          # opening night reviews yet. The orchestrator's poller handles SERP with
          # its own per-iteration deferral logic.
          gh workflow run gather-reviews.yml \
            -f shows="$GATHER_SHOWS" \
            -f parallel_jobs=1 \
            -f max_tier=3 \
            -f aggregators_only=true \
            -f validate_urls=true
          echo "Gather reviews triggered for: $GATHER_SHOWS"

      - name: Trigger Reddit sentiment for recently opened shows
        if: steps.find.outputs.has_shows == 'true'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            // Reddit discussion exists by opening night — trigger sentiment scrape
            try {
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'update-reddit-sentiment.yml',
                ref: 'main',
                inputs: {
                  shows: '${{ steps.find.outputs.shows }}'
                }
              });
              console.log('Triggered Reddit sentiment for: ${{ steps.find.outputs.shows }}');
            } catch (e) {
              console.log('Reddit sentiment trigger failed:', e.message);
            }

      - name: Audit T1/T2 coverage gaps
        if: steps.find.outputs.has_shows == 'true'
        id: coverage
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_ALERTS: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
        run: |
          # --alert sends Discord on floor breaches (tier-1 silent extractor failure)
          # and on outlet gaps. Floor breach severity=error; outlet gap severity=warning.
          # No `|| true` — exit 1 on breach is the signal. continue-on-error keeps the
          # workflow green; the step shows yellow in GH summary so breaches are visible.
          LOOKBACK=${{ inputs.lookback_days || 14 }}
          node scripts/audit-opening-night-coverage.js --days=$LOOKBACK --alert

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: 'Opening Night Reviews Failed'
          discord_webhook: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
          resend_api_key: ${{ secrets.RESEND_API_KEY }}
          owner_email: ${{ secrets.OWNER_EMAIL }}
