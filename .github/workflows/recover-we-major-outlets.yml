name: Recover WE Major Outlet Reviews

# BRO-6155: recover missing major-outlet reviews for West End historical shows
# (seasons 2016-17..2020-21). Manual dispatch only. Spend is capped by max_usd
# (scraper dollars from the spend ledger + projected scoring dollars); the run
# stops before the cap and prints a COST TALLY line. Scoring is a separate
# dispatch of llm-ensemble-score.yml.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'wos = free WhatsOnStage API match then ingest, run = wos + SERP for the rest, report = counts only'
        required: true
        type: choice
        options: [report, wos, run]
        default: report
      seasons:
        description: 'Season start years, e.g. 2016..2020'
        required: false
        type: string
        default: '2016..2020'
      slots:
        description: 'Comma list of outlet slots (guardian,telegraph,standard,times,ft,stage,whatsonstage,timeout,independent,observer,artsdesk,daily-mail). Empty = all'
        required: false
        type: string
        default: ''
      shows:
        description: 'Comma list of show ids. Empty = all'
        required: false
        type: string
        default: ''
      max_usd:
        description: 'Hard cap, scraper + projected scoring dollars'
        required: false
        type: string
        default: '45'
      reserve_usd:
        description: 'Dollars held back for scoring of files written by earlier runs'
        required: false
        type: string
        default: '0'
      max_calls:
        description: 'At most this many SERP searches. The $45 cap is campaign-wide: earlier runs count via data/audit/we-major-recovery-state.json'
        required: false
        type: string
        default: '200'
      debug:
        description: 'Print every SERP query and verdict, and skip the Google date filter'
        required: false
        default: false
        type: boolean
      dry_run:
        description: 'List the queue only, spend nothing, push nothing'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: recover-we-major-outlets
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 300

      - name: Checkout core data
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}

      - name: Checkout review texts
        uses: ./.github/actions/checkout-review-texts
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}

      - name: Opening-night lease sync (BRO-6648)
        uses: ./.github/actions/opening-night-lease-sync

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - uses: ./.github/actions/setup-playwright

      - name: Report
        if: inputs.mode == 'report'
        env:
          INPUT_SEASONS: ${{ inputs.seasons }}
          GUARDIAN_API_KEY: ${{ secrets.GUARDIAN_API_KEY }}
        run: node scripts/we-major-recovery.js report --seasons="$INPUT_SEASONS"

      - name: Recover
        if: inputs.mode != 'report'
        env:
          BRIGHTDATA_TOKEN: ${{ secrets.BRIGHTDATA_TOKEN }}
          BRIGHTDATA_ZONE: ${{ secrets.BRIGHTDATA_ZONE }}
          SCRAPINGBEE_API_KEY: ${{ secrets.SCRAPINGBEE_API_KEY }}
          SCRAPINGDOG_API_KEY: ${{ secrets.SCRAPINGDOG_API_KEY }}
          SCRAPER_USE_SCRAPINGDOG: '1'
          GUARDIAN_API_KEY: ${{ secrets.GUARDIAN_API_KEY }}
          INPUT_SHOWS: ${{ inputs.shows }}
          INPUT_SLOTS: ${{ inputs.slots }}
          INPUT_SEASONS: ${{ inputs.seasons }}
          INPUT_MAX_USD: ${{ inputs.max_usd }}
          INPUT_RESERVE_USD: ${{ inputs.reserve_usd }}
          INPUT_MAX_CALLS: ${{ inputs.max_calls }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_DEBUG: ${{ inputs.debug }}
        run: |
          set -o pipefail
          FLAGS="--seasons=$INPUT_SEASONS --max-usd=$INPUT_MAX_USD --reserve-usd=$INPUT_RESERVE_USD --max-calls=$INPUT_MAX_CALLS --out=$RUNNER_TEMP/recovery.json"
          [ -n "$INPUT_SHOWS" ] && FLAGS="$FLAGS --shows=$INPUT_SHOWS"
          [ -n "$INPUT_SLOTS" ] && FLAGS="$FLAGS --slots=$INPUT_SLOTS"
          [ "$INPUT_DRY_RUN" = "true" ] && FLAGS="$FLAGS --dry-run"
          [ "$INPUT_DEBUG" = "true" ] && FLAGS="$FLAGS --debug"
          node scripts/we-major-recovery.js wos --seasons="$INPUT_SEASONS" --out=$RUNNER_TEMP/wos.json
          # Guardian Content API: production-specific by construction (date window around opening). Free.
          if [ -n "$GUARDIAN_API_KEY" ] && { [ -z "$INPUT_SLOTS" ] || echo ",$INPUT_SLOTS," | grep -q ',guardian,'; }; then
            node scripts/we-major-recovery.js guardian --seasons="$INPUT_SEASONS" ${INPUT_SHOWS:+--shows="$INPUT_SHOWS"} --out=$RUNNER_TEMP/guardian.json | tee -a $RUNNER_TEMP/recovery.log || echo '[]' > $RUNNER_TEMP/guardian.json
            node -e "const f=require('fs'),d=process.env.RUNNER_TEMP;f.writeFileSync(d+'/wos.json',JSON.stringify([...JSON.parse(f.readFileSync(d+'/wos.json')),...JSON.parse(f.readFileSync(d+'/guardian.json'))],null,1))"
          fi
          # BRO-6487: Evening Standard monthly sitemaps. Free (plain fetch), production-specific by slug title + venue.
          if [ -z "$INPUT_SLOTS" ] || echo ",$INPUT_SLOTS," | grep -q ',standard,'; then
            node scripts/we-major-recovery.js sitemap --seasons="$INPUT_SEASONS" ${INPUT_SHOWS:+--shows="$INPUT_SHOWS"} --out=$RUNNER_TEMP/standard.json | tee -a $RUNNER_TEMP/recovery.log || echo '[]' > $RUNNER_TEMP/standard.json
            node -e "const f=require('fs'),d=process.env.RUNNER_TEMP;f.writeFileSync(d+'/wos.json',JSON.stringify([...JSON.parse(f.readFileSync(d+'/wos.json')),...JSON.parse(f.readFileSync(d+'/standard.json'))],null,1))"
          fi
          [ "$INPUT_MODE" = "run" ] && FLAGS="$FLAGS --serp"
          node scripts/we-major-recovery.js run --candidates=$RUNNER_TEMP/wos.json $FLAGS 2>&1 | tee -a $RUNNER_TEMP/recovery.log
          { echo '### Recovery'; grep -E 'COST TALLY|OUTCOMES|STOPPED' $RUNNER_TEMP/recovery.log | tail -4; } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload run output
        if: always() && inputs.mode != 'report'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: recovery-output
          path: |
            ${{ runner.temp }}/recovery.json
            ${{ runner.temp }}/recovery.log
            ${{ runner.temp }}/wos.json
            ${{ runner.temp }}/guardian.json
            ${{ runner.temp }}/standard.json
          if-no-files-found: ignore

      - name: Commit new review files
        if: always() && inputs.mode != 'report' && inputs.dry_run != true
        run: |
          cd data/review-texts
          if git diff --quiet && git diff --cached --quiet && [ -z "$(git ls-files --others --exclude-standard | head -1)" ]; then
            echo "No changes to commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            # BRO-6648: this step pushes review-texts itself (not via push-review-texts), so it enforces the lease too
            node "$GITHUB_WORKSPACE/scripts/opening-night-lease.js" sync || true
            node "$GITHUB_WORKSPACE/scripts/opening-night-lease.js" enforce --dir="$GITHUB_WORKSPACE/data/review-texts" || \
              echo "::warning::opening-night lease enforce failed to run"
            git add -A
            git diff --cached --quiet || git commit -m "data: BRO-6155 recover WE major-outlet reviews"
            bash ../../scripts/lib/push-with-retry.sh 5 main
          fi

      - name: Commit campaign spend state
        if: always() && inputs.mode != 'report' && inputs.dry_run != true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -f data/audit/we-major-recovery-state.json ] || { echo 'no state file'; exit 0; }
          git add data/audit/we-major-recovery-state.json
          git diff --cached --quiet || git commit -m "data: BRO-6155 recovery campaign spend state [skip ci]"
          bash scripts/lib/push-with-retry.sh 5 main

      - name: Commit scraper-spend ledger
        if: always() && inputs.mode != 'report'
        continue-on-error: true
        uses: ./.github/actions/commit-scraper-spend-ledger
        with:
          workflow-name: recover-we-major-outlets

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: 'WE Major Outlet Recovery Failed'
          severity: 'warning'
