name: NYT Critics Picks Refresh

on:
  schedule:
    # Mon/Wed/Fri at 5 AM UTC (midnight ET). 3x/week reduces the window for
    # new picks to miss the badge from up to 7 days to ~48h.
    - cron: '0 5 * * 1,3,5'
    # Light daily pass on the other days: page 1 only (the newest ~10
    # picks, one proxied fetch), so a pick for a review ingested outside the
    # opening-night poller waits a day at most, not up to 48h (BRO-4275).
    - cron: '0 5 * * 0,2,4,6'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no writes)'
        required: false
        type: boolean
        default: false

concurrency:
  group: weekly-nyt-critics-picks
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      # NYT 403s the runner's plain fetch (since 2026-09-16); the script
      # falls back to fetchPage() (Bright Data → ScrapingBee → Playwright),
      # which needs deps + proxy secrets.
      - name: Install dependencies
        run: npm ci || npm install

      - name: Setup Playwright
        uses: ./.github/actions/setup-playwright

      - name: Refresh NYT Critics Picks
        env:
          SCRAPINGBEE_API_KEY: ${{ secrets.SCRAPINGBEE_API_KEY }}
          SCRAPINGDOG_API_KEY: ${{ secrets.SCRAPINGDOG_API_KEY }}
          SCRAPER_USE_SCRAPINGDOG: '1'
          BRIGHTDATA_TOKEN: ${{ secrets.BRIGHTDATA_TOKEN }}
          BRIGHTDATA_ZONE: ${{ secrets.BRIGHTDATA_ZONE }}
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="--dry-run"
          fi
          if [ "${{ github.event.schedule }}" = "0 5 * * 0,2,4,6" ]; then
            ARGS="$ARGS --max-pages=1"
          fi
          node scripts/refresh-nyt-critics-picks.js --time-budget-min=10 $ARGS

      - name: Commit and push changes
        if: always() && inputs.dry_run != true
        env:
          PUSH_RECONCILE_MERGED_JSON: '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/nyt-critics-picks.json
          git add data/audit/scraper-spend-ledger.jsonl 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "data: Update NYT Critics Picks"
          bash scripts/lib/push-with-retry.sh

      - name: Commit scraper-spend ledger
        if: always()
        continue-on-error: true
        uses: ./.github/actions/commit-scraper-spend-ledger
        with:
          workflow-name: weekly-nyt-critics-picks

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: 'Weekly NYT Critics Picks Failed'
          severity: 'warning'
          discord_webhook: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
          resend_api_key: ${{ secrets.RESEND_API_KEY }}
          owner_email: ${{ secrets.OWNER_EMAIL }}
