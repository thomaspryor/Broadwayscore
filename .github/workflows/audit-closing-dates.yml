name: Audit Closing Dates

# Replaces the legacy `Check Closing Dates` Monday cron (Broadway.org "Through:"
# scraper) with a daily bidirectional audit driven by broadway.com per-show
# schedule pages. See memory/feedback_closing_date_audit_gaps.md for why the
# old script silently missed 12 wrong dates discovered manually on 2026-05-14.

on:
  schedule:
    - cron: '0 14 * * *'  # Daily 14:00 UTC — after update-show-status (8am) and one full enrich cycle (10:30)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no changes)'
        required: false
        default: 'false'
      time_budget_min:
        description: 'Wall-clock budget in minutes (0 = unlimited)'
        required: false
        default: '14'

# Share the `shows-json-writer` concurrency group with update-show-status.yml
# and enrich-off-broadway-dates.yml. Without this, overlapping runs race on
# shows.json and `push-core-data` rebases with `-X ours`, which can silently
# overwrite an audit-applied closingDate correction. Caught in /ship-check
# 2026-05-14 (Codex adversarial reviewer).
concurrency:
  group: shows-json-writer
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout core data
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Playwright
        uses: ./.github/actions/setup-playwright

      - name: Snapshot pre-audit closingDates (rollback baseline)
        run: |
          node -e "
            const fs = require('fs');
            const path = require('path');
            const shows = JSON.parse(fs.readFileSync('data/shows.json','utf8')).shows;
            const snap = Object.fromEntries(shows.map(s => [s.id, s.closingDate || null]));
            fs.mkdirSync('data/audit', { recursive: true });
            fs.writeFileSync('data/audit/closing-date-pre-audit.json', JSON.stringify({ takenAt: new Date().toISOString(), closingDates: snap }, null, 2));
            console.log('Snapshot: ' + Object.keys(snap).length + ' shows');
          "

      - name: Run closing-date audit
        env:
          BRIGHTDATA_TOKEN: ${{ secrets.BRIGHTDATA_TOKEN }}
          BRIGHTDATA_ZONE: ${{ secrets.BRIGHTDATA_ZONE }}
          SCRAPINGBEE_API_KEY: ${{ secrets.SCRAPINGBEE_API_KEY }}
          SCRAPINGDOG_API_KEY: ${{ secrets.SCRAPINGDOG_API_KEY }}
          SCRAPER_USE_SCRAPINGDOG: '1'
          DISCORD_WEBHOOK_ALERTS: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # Exit cleanly before the 20-min job timeout; deferred shows are
          # picked up next run. Default in bash, not a GHA || expression —
          # the expression coerces a literal 0 (= unlimited) to falsy.
          TB="${{ github.event.inputs.time_budget_min }}"
          [ -z "$TB" ] && TB=14
          TB_FLAG="--time-budget-min=$TB"

          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            node scripts/audit-closing-dates.js --dry-run $TB_FLAG
          else
            node scripts/audit-closing-dates.js $TB_FLAG
          fi

      - name: Validate shows.json before push (rollback on failure)
        id: validate
        run: |
          # If the audit corrupted shows.json (bad JSON, missing required
          # fields, duplicates), restore the unmodified core-data copy from
          # /tmp/core-data-checkout/ and exit non-zero. push step is gated
          # on this step succeeding (see `if: success()` below), so a failed
          # validation skips the push entirely — the next run starts from a
          # clean baseline.
          if ! node scripts/validate-data.js 2>&1 | tail -30; then
            echo "::error::validate-data.js failed after audit — reverting shows.json"
            if [ -f /tmp/core-data-checkout/shows.json ]; then
              cp -f /tmp/core-data-checkout/shows.json data/shows.json
              echo "Restored data/shows.json from /tmp/core-data-checkout/"
            fi
            exit 1
          fi

      # Push runs only when validation passed. Was `if: always()` previously,
      # which would have pushed bad data on validation failure.
      - name: Push core data to private repo
        if: success()
        uses: ./.github/actions/push-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
          message: 'data: Update from audit-closing-dates'

      - name: Dispatch deploy
        if: success()
        uses: ./.github/actions/dispatch-deploy

      # closing-date-discovery.js's discoverAnnouncedDate calls
      # url-discovery.js's serpQuery, which writes attribution rows to
      # data/audit/scraper-spend-ledger.jsonl on the runner's local disk (task
      # #752/#784) — a root-repo file, unaffected by push-core-data's separate
      # /tmp checkout above and safe to commit on always() regardless of the
      # validation gate. Never staged before this daily cron (Sprint 3, card
      # 3b1637c5).
      - name: Commit scraper-spend ledger
        if: always()
        continue-on-error: true  # telemetry-only commit (Sprint 3, card 3b1637c5) — push contention under concurrent scheduled runs must never fail an otherwise-successful job
        env:
          PUSH_RECONCILE_MERGED_JSON: '1'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/audit/scraper-spend-ledger.jsonl 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No ledger changes to commit"
          else
            git commit -m "chore: Record scraper-spend ledger (audit-closing-dates)"
            bash scripts/lib/push-with-retry.sh
          fi

      - name: Create summary
        if: always()
        run: |
          if [ -f data/audit/closing-date-discrepancies.json ]; then
            echo "## Closing Date Audit" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            node -e "
              const r = require('./data/audit/closing-date-discrepancies.json');
              const s = r.summary;
              const lines = [
                '**Mode:** ' + r.mode,
                '**Audited:** ' + s.audited,
                '**Extensions auto-applied:** ' + s.extensions,
                '**Matches:** ' + s.matches,
                '**Ambiguous (need review):** ' + s.ambiguous,
                '**New-closing candidates:** ' + s.newClosings,
                '**Errors:** ' + s.errors,
              ];
              if (s.budgetExit) lines.push('**⏱ Time budget hit — deferred:** ' + s.deferred);
              console.log(lines.join('\\n'));
              if (r.extensions.length) {
                console.log('\\n### Extensions applied');
                r.extensions.forEach(e => console.log('- ' + e.id + ': ' + e.stored + ' → ' + e.latestScheduled));
              }
              if (r.ambiguous.length) {
                console.log('\\n### Needs human review');
                r.ambiguous.forEach(a => {
                  if (a.action === 'POSSIBLY_CLOSED_NEEDS_REVIEW') {
                    const evidence = a.missingScheduleKind === 'title_mismatch' ? 'page removed/mismatched' : 'schedule empty';
                    const storedDesc = a.stored ? ('stored ' + a.stored) : 'no stored closingDate';
                    console.log('- ' + a.id + ': ' + storedDesc + ' but broadway.com ' + evidence + ' — possibly closed');
                  } else {
                    console.log('- ' + a.id + ': stored ' + a.stored + ', schedule cuts at ' + a.latestScheduled + ' (' + a.delta + 'd)');
                  }
                });
              }
            " >> $GITHUB_STEP_SUMMARY
          fi

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: 'Audit Closing Dates Failed'
          severity: 'warning'
          discord_webhook: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
