name: Update Critics' Take

on:
  # Run weekly on Sundays at 2 AM UTC (9 PM ET Saturday)
  schedule:
    - cron: '0 2 * * 0'
  # Allow manual trigger
  workflow_dispatch:
    inputs:
      force:
        description: 'Force regenerate all shows (ignore 3+ review threshold)'
        required: false
        type: boolean
        default: false

jobs:
  update-consensus:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main


      - name: Checkout core data
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Generate Critics' Take
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            node scripts/generate-critic-consensus.js --force
          else
            node scripts/generate-critic-consensus.js
          fi

      - name: Commit and push if changed
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Core data files pushed to private repo by push-core-data action
          if git diff --staged --quiet; then
            echo "No changes to Critics' Take"
          else
            git commit -m "chore: Update Critics' Take summaries (automated)"
            # Retry push with rebase in case remote has new commits
            pushed=false
            for i in 1 2 3 4 5; do
              if git push origin main; then
                echo "Push succeeded on attempt $i"
                break
              fi
              echo "Push failed (attempt $i), pulling and rebasing..."
              echo "--- Unstaged files before cleanup ---"
              git status --porcelain 2>/dev/null || true
              git checkout -- . 2>/dev/null || true
              git clean -fd 2>/dev/null || true
              if git pull --rebase -X theirs origin main; then
                echo "Rebase succeeded, retrying push..."
              else
                echo "Rebase failed, aborting..."
                git rebase --abort 2>/dev/null || true
              fi
              sleep $((10 + RANDOM % 20))
            done
            if [ "$pushed" != "true" ]; then
              echo "::warning::All push attempts failed"
            fi
          fi


      - name: Push core data to private repo
        if: always()
        uses: ./.github/actions/push-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
          message: 'data: Update from update-critic-consensus'