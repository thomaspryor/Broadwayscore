name: Deploy Preview to Vercel

on:
  push:
    branches: [staging]
    paths:
      - 'src/**'
      - 'public/**'
      - 'data/shows.json'
      - 'data/reviews.json'
      - 'data/grosses.json'
      - 'data/commercial.json'
      - 'data/audience-buzz.json'
      - 'data/critic-consensus.json'
      - 'data/lottery-rush.json'
      - 'data/awards.json'
      - 'data/gold-lists-computed.json'
      - 'next.config.*'
      - 'tailwind.config.*'
      - 'package.json'
  workflow_dispatch:

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Get repo info
        id: repo
        run: |
          REPO_ID=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/thomaspryor/Broadwayscore" | jq '.id')
          echo "repo_id=$REPO_ID" >> $GITHUB_OUTPUT
          echo "sha=${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Create Vercel deployment from Git
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          RESPONSE=$(curl -s -X POST "https://api.vercel.com/v13/deployments" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{
              "name": "broadwayscore",
              "gitSource": {
                "type": "github",
                "repoId": ${{ steps.repo.outputs.repo_id }},
                "ref": "staging",
                "sha": "${{ steps.repo.outputs.sha }}"
              },
              "target": "preview"
            }')
          echo "Response: $RESPONSE"
          URL=$(echo "$RESPONSE" | jq -r '.url // empty')
          if [ -n "$URL" ]; then
            echo "Preview URL: https://$URL"
            echo "url=https://$URL" >> $GITHUB_OUTPUT
          else
            ERROR=$(echo "$RESPONSE" | jq -r '.error.message // .message // "Unknown error"')
            echo "Error: $ERROR"
            exit 1
          fi

      - name: Write deploy summary
        if: always()
        run: |
          echo "## Preview Deployment" >> $GITHUB_STEP_SUMMARY
          echo "Preview URL: ${{ steps.deploy.outputs.url }}" >> $GITHUB_STEP_SUMMARY
