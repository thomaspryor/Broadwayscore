name: Collect Hard-Paywall Reviews (Archive.org)

on:
  workflow_dispatch:
    inputs:
      domain:
        description: 'Target domain (or "all" for all hard-paywall outlets)'
        required: true
        type: choice
        options:
          - all
          - nytimes.com
          - vulture.com
          - wsj.com
          - washingtonpost.com
          - newyorker.com
          - ft.com
          - telegraph.co.uk
          - thetimes.co.uk
          - timeout.com
          - nypost.com
          - nydailynews.com
          - deadline.com
          - observer.com
          - hollywoodreporter.com
          - ew.com
      max_reviews:
        description: 'Maximum reviews to process per domain (0 = all)'
        required: false
        default: '100'
      dry_run:
        description: 'Dry run — count eligible reviews without collecting'
        required: false
        type: boolean
        default: false
      retry_failed:
        description: 'Retry previously failed reviews'
        required: false
        type: boolean
        default: true
      max_rounds:
        description: 'Max self-chaining rounds (0 = no chaining)'
        required: false
        default: '50'
      current_round:
        description: 'Current round (auto-set by chaining)'
        required: false
        default: '1'

# Hard-paywall outlets where Archive.org is the primary success channel.
# Success rates when attempted: NYT 97%, Vulture 81%, WaPo 87%, WSJ 25%.
# Most reviews have NEVER been attempted — Archive.org often has pre-paywall snapshots.
#
# Domain breakdown (~1,521 never-attempted):
#   nytimes.com (~705)  - Archive.org: 97% success when attempted
#   vulture.com (~516)  - Archive.org: 81% success
#   washingtonpost.com (~366) - Archive.org: 87% success
#   wsj.com (~555)      - Hardest paywall, 25% success
#   newyorker.com (~202) - Archive.org works for older articles
#   ft.com (~104)       - Low success rate expected
#   telegraph.co.uk (~102) - Low success rate expected

jobs:
  collect-single:
    if: ${{ inputs.domain != 'all' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0



      - name: Checkout core data
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
      - name: Checkout review-texts (private repo)
        uses: ./.github/actions/checkout-review-texts
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Setup Playwright
        uses: ./.github/actions/setup-playwright

      - name: Create directories
        run: |
          mkdir -p data/archives/reviews
          mkdir -p data/audit/validation
          mkdir -p data/collection-state

      - name: Clear progress state
        run: rm -f data/collection-state/progress.json

      - name: Configure git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Count eligible reviews
        id: count
        env:
          DOMAIN_FILTER: ${{ inputs.domain }}
        run: |
          COUNT=$(node -e "
            const fs = require('fs'), path = require('path');
            const base = 'data/review-texts';
            const domains = (process.env.DOMAIN_FILTER || '').split(',').map(s => s.trim().toLowerCase()).filter(Boolean);
                        // Load global failed-fetches to exclude permanently failed URLs
            let failedUrls = new Set();
            const globalFF = path.join(base, 'failed-fetches.json');
            if (fs.existsSync(globalFF)) {
              try {
                const ff = JSON.parse(fs.readFileSync(globalFF, 'utf8'));
                (Array.isArray(ff) ? ff : Object.values(ff)).forEach(e => {
                  if (!e.url || e.failureReason === 'garbage_content') return;
                  const isDead = e.failureReason === 'url_dead_404' || e.failureReason === 'url_dead_410';
                  if (e.failureCount >= (isDead ? 3 : 5)) failedUrls.add(e.url);
                });
              } catch {}
            }
            let n = 0;
            const dirs = fs.readdirSync(base).filter(d => {
              try { return fs.statSync(path.join(base, d)).isDirectory(); } catch { return false; }
            });
            dirs.forEach(d => {
              fs.readdirSync(path.join(base, d)).filter(f => f.endsWith('.json') && f !== 'failed-fetches.json').forEach(f => {
                try {
                  const r = JSON.parse(fs.readFileSync(path.join(base, d, f), 'utf8'));
                  if (r.wrongProduction || r.wrongShow || r.wrongAttribution) return;
                  if (!r.url) return;
                  if (failedUrls.has(r.url)) return;
                  const textLen = r.fullText ? r.fullText.length : 0;
                  const isTruncated = r.textQuality === 'truncated' || r.textStatus === 'truncated'
                    || r.contentTier === 'truncated' || r.contentTier === 'needs-rescrape';
                  if (!isTruncated && (r.isFullReview === true || r.textQuality === 'full' || textLen > 1500)) return;
                  try {
                    const urlDomain = new URL(r.url).hostname.replace(/^www\\./, '');
                    if (domains.some(dd => urlDomain === dd || urlDomain.endsWith('.' + dd))) n++;
                  } catch(e) {}
                } catch(e) {}
              });
            });
            console.log(n);
          ")
          echo "eligible=$COUNT" >> $GITHUB_OUTPUT
          echo "Eligible reviews for ${{ inputs.domain }}: $COUNT"

      - name: Collect review texts
        if: ${{ inputs.dry_run != true && steps.count.outputs.eligible > 0 }}
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SCRAPINGBEE_API_KEY: ${{ secrets.SCRAPINGBEE_API_KEY }}
          BRIGHTDATA_TOKEN: ${{ secrets.BRIGHTDATA_TOKEN }}
          BRIGHTDATA_ZONE: ${{ secrets.BRIGHTDATA_ZONE }}
          BROWSERBASE_API_KEY: ${{ secrets.BROWSERBASE_API_KEY }}
          BROWSERBASE_PROJECT_ID: ${{ secrets.BROWSERBASE_PROJECT_ID }}
          BROWSERBASE_ENABLED: 'true'
          NYT_EMAIL: ${{ secrets.NYT_EMAIL }}
          NYT_PASSWORD: ${{ secrets.NYTIMES_PASSWORD }}
          VULTURE_EMAIL: ${{ secrets.VULTURE_EMAIL }}
          VULTURE_PASSWORD: ${{ secrets.VULTURE_PASSWORD }}
          WSJ_EMAIL: ${{ secrets.WSJ_EMAIL }}
          WSJ_PASSWORD: ${{ secrets.WSJ_PASSWORD }}
          BLOOMBERG_EMAIL: ${{ secrets.BLOOMBERG_EMAIL }}
          BLOOMBERG_PASSWORD: ${{ secrets.BLOOMBERG_PASSWORD }}
          NORTHJERSEY_EMAIL: ${{ secrets.NORTHJERSEY_EMAIL }}
          NORTHJERSEY_PASSWORD: ${{ secrets.NORTHJERSEY_PASSWORD }}
          FT_EMAIL: ${{ secrets.FT_EMAIL }}
          FT_PASSWORD: ${{ secrets.FT_PASSWORD }}
          NEW_YORKER_EMAIL: ${{ secrets.NEW_YORKER_EMAIL }}
          NEW_YORKER_PASSWORD: ${{ secrets.NEW_YORKER_PASSWORD }}
          WAPO_EMAIL: ${{ secrets.WAPO_EMAIL }}
          WAPO_PASSWORD: ${{ secrets.WASHPOST_PASSWORD }}
          COOKIES_BUNDLE_1: ${{ secrets.COOKIES_BUNDLE_1 }}
          COOKIES_BUNDLE_2: ${{ secrets.COOKIES_BUNDLE_2 }}
          COOKIES_BUNDLE_3: ${{ secrets.COOKIES_BUNDLE_3 }}
          COOKIES_BUNDLE_4: ${{ secrets.COOKIES_BUNDLE_4 }}
          COOKIES_BUNDLE_5: ${{ secrets.COOKIES_BUNDLE_5 }}
          COOKIES_BUNDLE_6: ${{ secrets.COOKIES_BUNDLE_6 }}
          COOKIES_BUNDLE_7: ${{ secrets.COOKIES_BUNDLE_7 }}
          COOKIES_BUNDLE_8: ${{ secrets.COOKIES_BUNDLE_8 }}
          COOKIES_BUNDLE_9: ${{ secrets.COOKIES_BUNDLE_9 }}
          COOKIES_BUNDLE_10: ${{ secrets.COOKIES_BUNDLE_10 }}
          COOKIES_BUNDLE_11: ${{ secrets.COOKIES_BUNDLE_11 }}
          NYDAILYNEWS_EMAIL: ${{ secrets.NYDAILYNEWS_EMAIL }}
          NYDAILYNEWS_PASSWORD: ${{ secrets.NYDAILYNEWS_PASSWORD }}
          DOMAIN_FILTER: ${{ inputs.domain }}
          BATCH_SIZE: '10'
          MAX_REVIEWS: ${{ inputs.max_reviews }}
          RETRY_FAILED: ${{ inputs.retry_failed && 'true' || 'false' }}
          ARCHIVE_FIRST: 'true'
          COMMIT_EVERY: '25'
        run: node scripts/collect-review-texts.js --aggressive

      - name: Validate data
        if: always()
        run: node scripts/validate-data.js

      - name: Check for large files
        if: always()
        uses: ./.github/actions/check-file-sizes


      - name: Push review-texts to private repo
        if: always()
        uses: ./.github/actions/push-review-texts
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
          message: "data: Collect Hard-Paywall Reviews (Archive.org) — Final commit and push"
      - name: Final commit and push
        if: ${{ inputs.dry_run != true && always() }}
        id: push
        run: |
          git add data/archives/reviews/ data/audit/ data/collection-state/ || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            git commit -m "feat: Collect hard-paywall review texts via Archive.org (${{ inputs.domain }})

          Co-Authored-By: GitHub Action <action@github.com>"
            bash scripts/lib/push-with-retry.sh
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Rebuild reviews.json
        id: rebuild
        if: always() && steps.push.outputs.has_changes == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/rebuild-all-reviews.js
        continue-on-error: true


      - name: Push review-texts to private repo
        if: always()
        uses: ./.github/actions/push-review-texts
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
          message: "data: Collect Hard-Paywall Reviews (Archive.org) — Commit rebuilt reviews.json"
      - name: Commit rebuilt reviews.json
        if: always() && steps.push.outputs.has_changes == 'true' && steps.rebuild.outcome != 'failure'
        run: |
          git add data/audit/
          if git diff --staged --quiet; then
            echo "No changes to reviews.json"
          else
            git commit -m "data: Auto-rebuild reviews.json (hard-paywall collection)"
            git pull --rebase origin main || {
              git rebase --abort 2>/dev/null || true
              git pull --no-rebase -X ours origin main
            }
            bash scripts/lib/push-with-retry.sh || echo "::warning::Push failed — collected data may not have synced"
          fi


      - name: Push core data to private repo
        if: always() && steps.rebuild.outcome != 'failure'
        uses: ./.github/actions/push-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
          message: 'data: Update from collect-hard-paywall'
      - name: Count remaining and chain
        if: always()
        id: chain
        env:
          DOMAIN_FILTER: ${{ inputs.domain }}
          GH_TOKEN: ${{ github.token }}
        run: |
          REMAINING=$(node -e "
            const fs = require('fs'), path = require('path');
            const base = 'data/review-texts';
            const domains = (process.env.DOMAIN_FILTER || '').split(',').map(s => s.trim().toLowerCase()).filter(Boolean);
                        // Load global failed-fetches to exclude permanently failed URLs
            let failedUrls = new Set();
            const globalFF = path.join(base, 'failed-fetches.json');
            if (fs.existsSync(globalFF)) {
              try {
                const ff = JSON.parse(fs.readFileSync(globalFF, 'utf8'));
                (Array.isArray(ff) ? ff : Object.values(ff)).forEach(e => {
                  if (!e.url || e.failureReason === 'garbage_content') return;
                  const isDead = e.failureReason === 'url_dead_404' || e.failureReason === 'url_dead_410';
                  if (e.failureCount >= (isDead ? 3 : 5)) failedUrls.add(e.url);
                });
              } catch {}
            }
            let n = 0;
            const dirs = fs.readdirSync(base).filter(d => {
              try { return fs.statSync(path.join(base, d)).isDirectory(); } catch { return false; }
            });
            dirs.forEach(d => {
              fs.readdirSync(path.join(base, d)).filter(f => f.endsWith('.json') && f !== 'failed-fetches.json').forEach(f => {
                try {
                  const r = JSON.parse(fs.readFileSync(path.join(base, d, f), 'utf8'));
                  if (r.wrongProduction || r.wrongShow || r.wrongAttribution) return;
                  if (!r.url) return;
                  if (failedUrls.has(r.url)) return;
                  const textLen = r.fullText ? r.fullText.length : 0;
                  const isTruncated = r.textQuality === 'truncated' || r.textStatus === 'truncated'
                    || r.contentTier === 'truncated' || r.contentTier === 'needs-rescrape';
                  if (!isTruncated && (r.isFullReview === true || r.textQuality === 'full' || textLen > 1500)) return;
                  try {
                    const urlDomain = new URL(r.url).hostname.replace(/^www\\./, '');
                    if (domains.some(dd => urlDomain === dd || urlDomain.endsWith('.' + dd))) n++;
                  } catch(e) {}
                } catch(e) {}
              });
            });
            console.log(n);
          ")
          echo "remaining=$REMAINING" >> $GITHUB_OUTPUT
          CURRENT=${{ inputs.current_round }}
          MAX=${{ inputs.max_rounds }}
          echo "Remaining: $REMAINING reviews for ${{ inputs.domain }}, round $CURRENT of $MAX"
          if [ "$REMAINING" -gt 50 ] && [ "$CURRENT" -lt "$MAX" ]; then
            NEXT=$((CURRENT + 1))
            echo "Chaining round $NEXT..."
            gh workflow run collect-hard-paywall.yml \
              -f domain=${{ inputs.domain }} \
              -f max_reviews=${{ inputs.max_reviews }} \
              -f retry_failed=${{ inputs.retry_failed }} \
              -f max_rounds=$MAX \
              -f current_round=$NEXT
            echo "chained=true" >> $GITHUB_OUTPUT
          else
            echo "No chaining needed (remaining=$REMAINING, round=$CURRENT/$MAX)"
            echo "chained=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload collection report
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: hard-paywall-report-${{ inputs.domain }}
          path: |
            data/audit/validation/collection-report-*.json
            data/collection-state/progress.json
          retention-days: 30

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: 'Collect Hard-Paywall Reviews Failed'
          discord_webhook: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
          resend_api_key: ${{ secrets.RESEND_API_KEY }}
          owner_email: ${{ secrets.OWNER_EMAIL }}

      - name: Summary
        if: always()
        run: |
          echo "## Hard-Paywall Collection Round ${{ inputs.current_round }}: ${{ inputs.domain }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Eligible reviews:** ${{ steps.count.outputs.eligible }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Max reviews:** ${{ inputs.max_reviews }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Dry run:** ${{ inputs.dry_run }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Strategy:** Archive.org first (pre-paywall snapshots)" >> $GITHUB_STEP_SUMMARY
          echo "- **Remaining:** ${{ steps.chain.outputs.remaining || 'N/A' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Chained next round:** ${{ steps.chain.outputs.chained || 'false' }}" >> $GITHUB_STEP_SUMMARY

  # Parallel mode: run top domains simultaneously when "all" is selected
  prepare-all:
    if: ${{ inputs.domain == 'all' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.domains }}
    steps:
      - name: Build domain matrix
        id: matrix
        run: |
          echo 'domains=["nytimes.com","vulture.com","washingtonpost.com","wsj.com","newyorker.com","ft.com","telegraph.co.uk","thetimes.co.uk"]' >> $GITHUB_OUTPUT

  collect-all:
    if: ${{ inputs.domain == 'all' }}
    needs: prepare-all
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        domain: ${{ fromJson(needs.prepare-all.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0



      - name: Checkout core data
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
      - name: Checkout review-texts (private repo)
        uses: ./.github/actions/checkout-review-texts
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Setup Playwright
        uses: ./.github/actions/setup-playwright

      - name: Create directories
        run: |
          mkdir -p data/archives/reviews
          mkdir -p data/audit/validation
          mkdir -p data/collection-state

      - name: Clear progress state
        run: rm -f data/collection-state/progress.json

      - name: Configure git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Count eligible reviews
        id: count
        env:
          DOMAIN_FILTER: ${{ matrix.domain }}
        run: |
          COUNT=$(node -e "
            const fs = require('fs'), path = require('path');
            const base = 'data/review-texts';
            const domains = (process.env.DOMAIN_FILTER || '').split(',').map(s => s.trim().toLowerCase()).filter(Boolean);
            let n = 0;
            const dirs = fs.readdirSync(base).filter(d => {
              try { return fs.statSync(path.join(base, d)).isDirectory(); } catch { return false; }
            });
            dirs.forEach(d => {
              fs.readdirSync(path.join(base, d)).filter(f => f.endsWith('.json') && f !== 'failed-fetches.json').forEach(f => {
                try {
                  const r = JSON.parse(fs.readFileSync(path.join(base, d, f), 'utf8'));
                  if (r.wrongProduction || r.wrongShow || r.wrongAttribution) return;
                  if (!r.url) return;
                  const textLen = r.fullText ? r.fullText.length : 0;
                  const isTruncated = r.textQuality === 'truncated' || r.textStatus === 'truncated'
                    || r.contentTier === 'truncated' || r.contentTier === 'needs-rescrape';
                  if (!isTruncated && (r.isFullReview === true || r.textQuality === 'full' || textLen > 1500)) return;
                  try {
                    const urlDomain = new URL(r.url).hostname.replace(/^www\\./, '');
                    if (domains.some(dd => urlDomain === dd || urlDomain.endsWith('.' + dd))) n++;
                  } catch(e) {}
                } catch(e) {}
              });
            });
            console.log(n);
          ")
          echo "eligible=$COUNT" >> $GITHUB_OUTPUT
          echo "Eligible reviews for ${{ matrix.domain }}: $COUNT"

      - name: Stagger start
        run: |
          DOMAINS=("nytimes.com" "vulture.com" "washingtonpost.com" "wsj.com" "newyorker.com" "ft.com" "telegraph.co.uk" "thetimes.co.uk")
          for i in "${!DOMAINS[@]}"; do
            if [ "${DOMAINS[$i]}" = "${{ matrix.domain }}" ]; then
              DELAY=$((i * 5))
              echo "Staggering start by ${DELAY}s for ${{ matrix.domain }}"
              sleep $DELAY
              break
            fi
          done

      - name: Collect review texts for ${{ matrix.domain }}
        if: ${{ inputs.dry_run != true }}
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SCRAPINGBEE_API_KEY: ${{ secrets.SCRAPINGBEE_API_KEY }}
          BRIGHTDATA_TOKEN: ${{ secrets.BRIGHTDATA_TOKEN }}
          BRIGHTDATA_ZONE: ${{ secrets.BRIGHTDATA_ZONE }}
          BROWSERBASE_API_KEY: ${{ secrets.BROWSERBASE_API_KEY }}
          BROWSERBASE_PROJECT_ID: ${{ secrets.BROWSERBASE_PROJECT_ID }}
          BROWSERBASE_ENABLED: 'true'
          NYT_EMAIL: ${{ secrets.NYT_EMAIL }}
          NYT_PASSWORD: ${{ secrets.NYTIMES_PASSWORD }}
          VULTURE_EMAIL: ${{ secrets.VULTURE_EMAIL }}
          VULTURE_PASSWORD: ${{ secrets.VULTURE_PASSWORD }}
          WSJ_EMAIL: ${{ secrets.WSJ_EMAIL }}
          WSJ_PASSWORD: ${{ secrets.WSJ_PASSWORD }}
          BLOOMBERG_EMAIL: ${{ secrets.BLOOMBERG_EMAIL }}
          BLOOMBERG_PASSWORD: ${{ secrets.BLOOMBERG_PASSWORD }}
          NORTHJERSEY_EMAIL: ${{ secrets.NORTHJERSEY_EMAIL }}
          NORTHJERSEY_PASSWORD: ${{ secrets.NORTHJERSEY_PASSWORD }}
          FT_EMAIL: ${{ secrets.FT_EMAIL }}
          FT_PASSWORD: ${{ secrets.FT_PASSWORD }}
          NEW_YORKER_EMAIL: ${{ secrets.NEW_YORKER_EMAIL }}
          NEW_YORKER_PASSWORD: ${{ secrets.NEW_YORKER_PASSWORD }}
          WAPO_EMAIL: ${{ secrets.WAPO_EMAIL }}
          WAPO_PASSWORD: ${{ secrets.WASHPOST_PASSWORD }}
          NYDAILYNEWS_EMAIL: ${{ secrets.NYDAILYNEWS_EMAIL }}
          NYDAILYNEWS_PASSWORD: ${{ secrets.NYDAILYNEWS_PASSWORD }}
          COOKIES_BUNDLE_1: ${{ secrets.COOKIES_BUNDLE_1 }}
          COOKIES_BUNDLE_2: ${{ secrets.COOKIES_BUNDLE_2 }}
          COOKIES_BUNDLE_3: ${{ secrets.COOKIES_BUNDLE_3 }}
          COOKIES_BUNDLE_4: ${{ secrets.COOKIES_BUNDLE_4 }}
          COOKIES_BUNDLE_5: ${{ secrets.COOKIES_BUNDLE_5 }}
          COOKIES_BUNDLE_6: ${{ secrets.COOKIES_BUNDLE_6 }}
          COOKIES_BUNDLE_7: ${{ secrets.COOKIES_BUNDLE_7 }}
          COOKIES_BUNDLE_8: ${{ secrets.COOKIES_BUNDLE_8 }}
          COOKIES_BUNDLE_9: ${{ secrets.COOKIES_BUNDLE_9 }}
          COOKIES_BUNDLE_10: ${{ secrets.COOKIES_BUNDLE_10 }}
          COOKIES_BUNDLE_11: ${{ secrets.COOKIES_BUNDLE_11 }}
          DOMAIN_FILTER: ${{ matrix.domain }}
          BATCH_SIZE: '10'
          MAX_REVIEWS: ${{ inputs.max_reviews }}
          RETRY_FAILED: ${{ inputs.retry_failed && 'true' || 'false' }}
          ARCHIVE_FIRST: 'true'
          COMMIT_EVERY: '25'
        run: node scripts/collect-review-texts.js --aggressive

      - name: Validate data
        if: always()
        run: node scripts/validate-data.js

      - name: Check for large files
        if: always()
        uses: ./.github/actions/check-file-sizes


      - name: Push review-texts to private repo
        if: always()
        uses: ./.github/actions/push-review-texts
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
          message: "data: Collect Hard-Paywall Reviews (Archive.org) — Commit and push changes for ${{ matrix.domain }}"
      - name: Commit and push changes for ${{ matrix.domain }}
        if: always()
        run: |
          git add data/archives/reviews/ data/audit/ data/collection-state/ || true
          if git diff --staged --quiet; then
            echo "No changes to commit for ${{ matrix.domain }}"
          else
            git commit -m "feat: Collect hard-paywall review texts via Archive.org (${{ matrix.domain }})

          Co-Authored-By: GitHub Action <action@github.com>"
            bash scripts/lib/push-with-retry.sh
          fi

      - name: Upload collection report
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: hard-paywall-report-${{ matrix.domain }}
          path: |
            data/audit/validation/collection-report-*.json
            data/collection-state/progress.json
          retention-days: 30

  rebuild-all:
    if: ${{ inputs.domain == 'all' && inputs.dry_run != true && always() }}
    needs: collect-all
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write

    env:
      HARD_PAYWALL_DOMAINS: 'nytimes.com,vulture.com,wsj.com,washingtonpost.com,newyorker.com,ft.com,telegraph.co.uk,thetimes.co.uk'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0



      - name: Checkout core data
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
      - name: Checkout review-texts (private repo)
        uses: ./.github/actions/checkout-review-texts
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Configure git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Rebuild reviews.json
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/rebuild-all-reviews.js


      - name: Push review-texts to private repo
        if: always()
        uses: ./.github/actions/push-review-texts
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
          message: "data: Collect Hard-Paywall Reviews (Archive.org) — Commit rebuilt reviews.json"
      - name: Commit rebuilt reviews.json
        run: |
          git add data/audit/
          if git diff --staged --quiet; then
            echo "No changes to reviews.json"
          else
            git commit -m "data: Auto-rebuild reviews.json (hard-paywall collection — all domains)"
            git pull --rebase origin main || {
              git rebase --abort 2>/dev/null || true
              git pull --no-rebase -X ours origin main
            }
            bash scripts/lib/push-with-retry.sh || echo "::warning::Push failed — collected data may not have synced"
          fi


      - name: Push core data to private repo
        if: always()
        uses: ./.github/actions/push-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
          message: 'data: Update from collect-hard-paywall'
      - name: Count remaining and chain
        if: always()
        id: chain
        env:
          DOMAIN_LIST: ${{ env.HARD_PAYWALL_DOMAINS }}
          GH_TOKEN: ${{ github.token }}
        run: |
          REMAINING=$(node -e "
            const fs = require('fs'), path = require('path');
            const base = 'data/review-texts';
            const domains = (process.env.DOMAIN_LIST || '').split(',').map(s => s.trim().toLowerCase()).filter(Boolean);
            let n = 0;
            const dirs = fs.readdirSync(base).filter(d => {
              try { return fs.statSync(path.join(base, d)).isDirectory(); } catch { return false; }
            });
            dirs.forEach(d => {
              fs.readdirSync(path.join(base, d)).filter(f => f.endsWith('.json') && f !== 'failed-fetches.json').forEach(f => {
                try {
                  const r = JSON.parse(fs.readFileSync(path.join(base, d, f), 'utf8'));
                  if (r.wrongProduction || r.wrongShow || r.wrongAttribution) return;
                  if (!r.url) return;
                  const textLen = r.fullText ? r.fullText.length : 0;
                  const isTruncated = r.textQuality === 'truncated' || r.textStatus === 'truncated'
                    || r.contentTier === 'truncated' || r.contentTier === 'needs-rescrape';
                  if (!isTruncated && (r.isFullReview === true || r.textQuality === 'full' || textLen > 1500)) return;
                  try {
                    const urlDomain = new URL(r.url).hostname.replace(/^www\\./, '');
                    if (domains.some(dd => urlDomain === dd || urlDomain.endsWith('.' + dd))) n++;
                  } catch(e) {}
                } catch(e) {}
              });
            });
            console.log(n);
          ")
          echo "remaining=$REMAINING" >> $GITHUB_OUTPUT
          CURRENT=${{ inputs.current_round }}
          MAX=${{ inputs.max_rounds }}
          echo "Remaining: $REMAINING hard-paywall reviews, round $CURRENT of $MAX"
          if [ "$REMAINING" -gt 50 ] && [ "$CURRENT" -lt "$MAX" ]; then
            NEXT=$((CURRENT + 1))
            echo "Chaining round $NEXT..."
            gh workflow run collect-hard-paywall.yml \
              -f domain=all \
              -f max_reviews=${{ inputs.max_reviews }} \
              -f retry_failed=${{ inputs.retry_failed }} \
              -f max_rounds=$MAX \
              -f current_round=$NEXT
            echo "chained=true" >> $GITHUB_OUTPUT
          else
            echo "No chaining needed (remaining=$REMAINING, round=$CURRENT/$MAX)"
            echo "chained=false" >> $GITHUB_OUTPUT
          fi

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: 'Collect Hard-Paywall Reviews (All) Failed'
          discord_webhook: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
          resend_api_key: ${{ secrets.RESEND_API_KEY }}
          owner_email: ${{ secrets.OWNER_EMAIL }}

      - name: Summary
        run: |
          echo "## Hard-Paywall Collection Round ${{ inputs.current_round }}: All Domains" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Collected hard-paywall review texts via Archive.org from 7 domains." >> $GITHUB_STEP_SUMMARY
          echo "- **Remaining:** ${{ steps.chain.outputs.remaining }} reviews" >> $GITHUB_STEP_SUMMARY
          echo "- **Chained next round:** ${{ steps.chain.outputs.chained }}" >> $GITHUB_STEP_SUMMARY
