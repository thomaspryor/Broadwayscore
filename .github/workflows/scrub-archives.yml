name: "Scrub archives from git history"
on:
  workflow_dispatch:

concurrency:
  group: scrub-archives
  cancel-in-progress: false

jobs:
  scrub:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - name: Full clone
        run: |
          git clone --single-branch --branch main https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git repo
          cd repo
          git log --oneline -5
          echo "Total commits: $(git rev-list --count HEAD)"

      - name: Install git-filter-repo
        run: pip install git-filter-repo

      - name: Remove data/archives/ from all history
        working-directory: repo
        run: |
          echo "=== Before ==="
          git rev-list --all --objects -- data/archives/ | wc -l
          echo "Running filter-repo..."
          git filter-repo --path data/archives/ --invert-paths --force
          echo "=== After ==="
          git rev-list --all --objects -- data/archives/ | wc -l
          echo "New commit count: $(git rev-list --count HEAD)"

      - name: Add data/archives/ to .gitignore
        working-directory: repo
        run: |
          if ! grep -q '^data/archives/' .gitignore; then
            echo "" >> .gitignore
            echo "# Raw scraped HTML archives (contain embedded API keys, tracking pixels)" >> .gitignore
            echo "data/archives/" >> .gitignore
            git add .gitignore
            git -c user.name="GitHub Action" -c user.email="action@github.com" commit -m "chore: Add data/archives/ to .gitignore

            Prevents raw scraped HTML from being committed. These files
            contain embedded API keys, tracking pixels, and other content
            that shouldn't be in version control.

            Co-Authored-By: Claude Opus 4.6 <noreply@anthropic.com>"
          fi

      - name: Force push with retry
        working-directory: repo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          git remote add origin https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git
          
          for attempt in $(seq 1 10); do
            echo "=== Force push attempt $attempt ==="
            
            # Fetch latest remote state
            git fetch origin main 2>/dev/null || true
            
            if git push --force origin main 2>&1; then
              echo "Force push succeeded on attempt $attempt!"
              exit 0
            fi
            
            echo "Push failed, waiting 30s before retry..."
            sleep 30
          done
          
          echo "ERROR: Force push failed after 10 attempts"
          exit 1

      - name: Verify
        if: always()
        run: |
          rm -rf verify
          git clone --depth 1 --branch main https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git verify 2>/dev/null || echo "Clone for verify failed"
          if [ -d "verify" ]; then
            cd verify
            if [ -d "data/archives" ]; then
              echo "WARNING: data/archives still exists in latest commit"
              ls data/archives/ | head -5
            else
              echo "SUCCESS: data/archives/ removed from latest commit"
            fi
            grep -q "data/archives/" .gitignore && echo "SUCCESS: .gitignore updated" || echo "WARNING: .gitignore not updated"
          fi
