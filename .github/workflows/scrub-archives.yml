name: "Scrub archives from git history"
on:
  workflow_dispatch:

concurrency:
  group: scrub-archives
  cancel-in-progress: false

jobs:
  remove-archives:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove data/archives from current tree
        run: |
          if [ -d "data/archives" ]; then
            echo "Removing data/archives/ ($(du -sh data/archives/ | cut -f1))"
            git rm -r data/archives/
            echo "Removed."
          else
            echo "data/archives/ not found in current tree"
          fi

      - name: Add data/archives/ to .gitignore
        run: |
          if ! grep -q '^data/archives/' .gitignore; then
            echo "" >> .gitignore
            echo "# Raw scraped HTML archives (contain embedded API keys, tracking pixels)" >> .gitignore
            echo "data/archives/" >> .gitignore
            git add .gitignore
            echo "Added data/archives/ to .gitignore"
          else
            echo "data/archives/ already in .gitignore"
          fi

      - name: Commit and push
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git commit -m "security: Remove data/archives/ and add to .gitignore

          Removes raw scraped HTML archives that contained embedded API keys
          and tracking pixels from third-party websites. Added to .gitignore
          to prevent future commits.

          Resolves GitHub Trust & Safety report.

          Co-Authored-By: Claude Opus 4.6 <noreply@anthropic.com>"
          
          for attempt in $(seq 1 5); do
            echo "Push attempt $attempt..."
            if git push origin main 2>&1; then
              echo "Push succeeded!"
              exit 0
            fi
            echo "Push failed, pulling and retrying..."
            git pull --rebase origin main
            sleep 5
          done
          echo "ERROR: Push failed after 5 attempts"
          exit 1

      - name: Verify
        run: |
          if [ -d "data/archives" ]; then
            echo "ERROR: data/archives still in tree"
            exit 1
          fi
          grep -q "data/archives/" .gitignore && echo "SUCCESS: .gitignore has archives entry"
          echo "data/archives/ removed from current commit."
          echo ""
          echo "NOTE: Old commits still contain archives. Contact GitHub Support"
          echo "to purge commit af48e0b3450a9deb36439406912df372ac0002a4 from cache."
