name: Sweep WE Aggregators

on:
  schedule:
    # Weekly on Tuesdays at 8 AM UTC (3 AM EST), after individual scrapers
    - cron: '0 8 * * 2'
  workflow_dispatch:
    inputs:
      shows:
        description: 'Comma-separated show IDs (default: all open WE/OWE)'
        required: false
        type: string
      dry_run:
        description: 'Dry run (no writes)'
        required: false
        type: boolean
        default: false
      force:
        description: 'Re-fetch shows with existing data'
        required: false
        type: boolean
        default: false
      aggregator:
        description: 'Aggregators to sweep (comma-separated: wet,tr,sd,ts)'
        required: false
        type: string
        default: 'wet,tr,sd,ts'

concurrency:
  group: sweep-we-aggregators
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout core data
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}

      - name: Checkout review-texts (private repo)
        uses: ./.github/actions/checkout-review-texts
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Restore aggregator archives from git
        run: |
          # Archives are gitignored but force-added by individual scraper workflows.
          # Restore them from the latest commit so the sweep can read them.
          for dir in stagedoor theatre-reviews thestage-roundups westendtheatre; do
            git show HEAD:data/aggregator-archive/$dir/ >/dev/null 2>&1 && \
              git checkout HEAD -- data/aggregator-archive/$dir/ 2>/dev/null || \
              echo "No $dir archives in HEAD"
          done
          echo "Restored archives:"
          for dir in stagedoor theatre-reviews thestage-roundups westendtheatre; do
            count=$(ls data/aggregator-archive/$dir/ 2>/dev/null | wc -l)
            echo "  $dir: $count files"
          done

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Run WE aggregator sweep
        env:
          SCRAPINGBEE_API_KEY: ${{ secrets.SCRAPINGBEE_API_KEY }}
          BRIGHTDATA_TOKEN: ${{ secrets.BRIGHTDATA_TOKEN }}
          BROWSERBASE_API_KEY: ${{ secrets.BROWSERBASE_API_KEY }}
          BROWSERBASE_PROJECT_ID: ${{ secrets.BROWSERBASE_PROJECT_ID }}
          THESTAGE_EMAIL: ${{ secrets.THESTAGE_EMAIL }}
          THESTAGE_PASSWORD: ${{ secrets.THESTAGE_PASSWORD }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.shows }}" ]; then
            ARGS="$ARGS --shows=${{ inputs.shows }}"
          fi
          if [ "${{ inputs.force }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ -n "${{ inputs.aggregator }}" ]; then
            ARGS="$ARGS --aggregator=${{ inputs.aggregator }}"
          fi
          # shellcheck disable=SC2086
          node scripts/sweep-we-aggregators.js $ARGS

      - name: Commit archives
        if: always() && inputs.dry_run != true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/aggregator-archive/westendtheatre/ data/aggregator-archive/theatre-reviews/
          git diff --staged --quiet && echo "No archive changes" && exit 0
          git commit -m "data: Update WE aggregator archives from sweep"
          bash scripts/lib/push-with-retry.sh 5 main

      - name: Push review-texts to private repo
        if: always() && inputs.dry_run != true
        uses: ./.github/actions/push-review-texts
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
          message: 'data: Update from sweep-we-aggregators'

      - name: Trigger rebuild
        if: always() && inputs.dry_run != true
        run: |
          gh workflow run rebuild-reviews.yml -f reason="Post WE aggregator sweep" || echo "Rebuild dispatch failed"
        env:
          GH_TOKEN: ${{ secrets.REVIEW_TEXTS_TOKEN }}

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: 'Sweep WE Aggregators Failed'
          discord_webhook: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
          resend_api_key: ${{ secrets.RESEND_API_KEY }}
          owner_email: ${{ secrets.OWNER_EMAIL }}
