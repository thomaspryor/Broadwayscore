name: Deep Research Commercial

on:
  workflow_dispatch:
    inputs:
      shows:
        description: 'Comma-separated show slugs, or "all-tbd" (default)'
        required: false
        type: string
        default: 'all-tbd'
      model:
        description: 'Model (default gpt-5.4-mini; retired models are refused by the script)'
        required: false
        type: choice
        options:
          - 'gpt-5.4-mini'
          - 'o3'
        default: 'gpt-5.4-mini'
      budget:
        description: 'Max spend in dollars'
        required: false
        type: number
        default: 50
      max_shows:
        description: 'Max shows per run'
        required: false
        type: number
        default: 10
      dry_run:
        description: 'Dry run (no files written)'
        required: false
        type: boolean
        default: false
      hold_for_review:
        description: 'Hold every result for human review; never touch commercial.json'
        required: false
        type: boolean
        default: false
      time_budget_min:
        description: 'Research wall-clock budget in minutes (0 = unlimited). Under the 90-min job timeout so the push steps still run.'
        required: false
        type: number
        default: 70
  workflow_call:
    inputs:
      time_budget_min:
        description: 'Research wall-clock budget in minutes (0 = unlimited). Under the 90-min job timeout so the push steps still run.'
        required: false
        type: number
        default: 70
      shows:
        required: false
        type: string
        default: 'all-tbd'
      model:
        description: 'Empty = the script default (DEFAULT_MODEL)'
        required: false
        type: string
        default: ''
      budget:
        required: false
        type: number
        default: 20
      max_shows:
        required: false
        type: number
        default: 3

concurrency:
  # concurrency-queue-ok: the group is shared by every commercial-data writer and must stay
  # static. An evicted opened-show dispatch from update-show-status.yml is covered by
  # commercial-weekly.yml's Saturday --all-tbd deep-research pass, which sorts recent openings first (BRO-4870).
  group: commercial-data-write
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout core data
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run Deep Research
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          INPUT_SHOWS: ${{ inputs.shows }}
          INPUT_MODEL: ${{ inputs.model }}
        run: |
          ARGS=""
          INPUT_SHOWS="${INPUT_SHOWS}"
          if [ "$INPUT_SHOWS" = "all-tbd" ]; then
            ARGS="$ARGS --all-tbd"
          else
            ARGS="$ARGS --shows=$INPUT_SHOWS"
          fi

          # Empty model = the script's DEFAULT_MODEL (single source, BRO-4990)
          INPUT_MODEL="${INPUT_MODEL}"
          if [ -n "$INPUT_MODEL" ]; then
            ARGS="$ARGS --model=$INPUT_MODEL"
          fi
          ARGS="$ARGS --budget=${{ inputs.budget || '50' }}"
          ARGS="$ARGS --max-shows=${{ inputs.max_shows || '10' }}"
          # Stop researching before the 90-min job timeout so the core-data push
          # step still runs (run 39717682536 timed out at 32/76 shows and pushed
          # nothing). Default in bash, not a GHA ||, so a literal 0 (= unlimited)
          # is not coerced to the default (same pattern as commercial-weekly.yml).
          TB="${{ inputs.time_budget_min }}"
          [ -z "$TB" ] && TB=70
          ARGS="$ARGS --time-budget-min=$TB"

          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ "${{ inputs.hold_for_review }}" = "true" ]; then
            ARGS="$ARGS --hold-for-review"
          fi

          echo "Running: node scripts/deep-research-commercial.js $ARGS"
          node scripts/deep-research-commercial.js $ARGS

      - name: Commit pending results
        if: always() && inputs.dry_run != true
        # Task #574: this step (the workflow's own end-of-job commit) was NOT
        # covered by #420 — that card opted in scripts/deep-research-
        # commercial.js's mid-run checkpoint push (the Node pushWithRetry()
        # wrapper, reconcileMergedJson: true), a DIFFERENT push call site from
        # this bash step. Commits commercial-pending-review.json +
        # commercial-research-queue.json (union-merged managed files).
        env:
          PUSH_RECONCILE_MERGED_JSON: '1'
          INPUT_MODEL: ${{ inputs.model || 'script default' }}
          INPUT_SHOWS: ${{ inputs.shows }}
        run: |
          # commercial.json is gitignored (core data); push-core-data syncs it to the private repo.
          bash scripts/lib/git-add-existing.sh data/commercial-pending-review.json data/deep-research-cost-log.json data/deep-research-progress.json data/commercial-research-spend.json data/commercial-research-queue.json

          if git diff --staged --quiet; then
            echo "No pending results to commit"
          else
            git commit -m "data: Deep Research commercial results (pending review)

          Model: ${INPUT_MODEL}
          Shows: ${INPUT_SHOWS}

          Co-Authored-By: github-actions[bot] <github-actions[bot]@users.noreply.github.com>"

            bash scripts/lib/push-with-retry.sh
          fi

      - name: Validate before core-data push
        id: validate_core
        # BRO-4995: deep-research-commercial.js stamps researchAttempts /
        # lastResearchedAt into data/commercial.json (core data). Without a
        # core-data push those marks were lost every run, so the stale-closure
        # classifier kept reporting "deep-research never ran" for researched
        # shows. Same guard + push as commercial-stale-closures.yml.
        if: always() && inputs.dry_run != true
        run: node scripts/validate-data.js

      - name: Deletion guard for commercial.json
        id: guard_core
        if: always() && inputs.dry_run != true
        run: |
          node -e "
            const fs = require('fs');
            if (!fs.existsSync('./data/commercial.json')) process.exit(0);
            const c = JSON.parse(fs.readFileSync('./data/commercial.json','utf8'));
            const count = Object.keys(c.shows || {}).length;
            console.log('commercial show count: ' + count);
            if (count < 120) {
              console.error('::error::commercial show count dropped below 120 (' + count + ')');
              process.exit(1);
            }
          "

      - name: Push core data to private repo
        # Runs even when the research step failed part-way (its marks for the
        # shows it did finish are still worth keeping), but never past a
        # failed validation or deletion guard.
        if: ${{ !cancelled() && inputs.dry_run != true && steps.validate_core.outcome == 'success' && steps.guard_core.outcome == 'success' }}
        uses: ./.github/actions/push-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
          message: 'data: Deep research tracking marks'

      - name: Summary
        if: always()
        env:
          INPUT_MODEL: ${{ inputs.model || 'script default' }}
        run: |
          echo "## Deep Research Commercial Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Model:** ${INPUT_MODEL}" >> $GITHUB_STEP_SUMMARY
          echo "**Budget:** \$${{ inputs.budget || '50' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f data/commercial-pending-review.json ]; then
            node -e "
              const pending = require('./data/commercial-pending-review.json');
              const shows = Object.entries(pending.shows || {});
              console.log('- **Shows researched:** ' + shows.length);
              const high = shows.filter(([,s]) => s.confidence === 'high').length;
              const med = shows.filter(([,s]) => s.confidence === 'medium').length;
              const low = shows.filter(([,s]) => s.confidence === 'low').length;
              console.log('- **Confidence:** ' + high + ' high, ' + med + ' medium, ' + low + ' low');
              console.log('');
              console.log('### Results');
              console.log('| Show | Designation | Cap | Recouped | Confidence |');
              console.log('|------|------------|-----|----------|-----------|');
              for (const [id, s] of shows) {
                const cap = s.capitalization ? '\$' + (s.capitalization/1e6).toFixed(1) + 'M' : '?';
                const rec = s.recouped != null ? (s.recouped ? 'Yes' : 'No') : '?';
                console.log('| ' + (s.title || id) + ' | ' + (s.designation || 'TBD') + ' | ' + cap + ' | ' + rec + ' | ' + (s.confidence || '?') + ' |');
              }
              console.log('');
              console.log('> Review pending file, then apply one show at a time: node scripts/apply-commercial-pending.js --show=SLUG');
            " >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "Could not generate summary" >> $GITHUB_STEP_SUMMARY
          else
            echo "No pending results file generated." >> $GITHUB_STEP_SUMMARY
          fi

          # Cost log
          if [ -f data/deep-research-cost-log.json ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            node -e "
              const log = require('./data/deep-research-cost-log.json');
              const total = log.reduce((sum, e) => sum + e.cost, 0);
              console.log('### Cost');
              console.log('- **Total:** \$' + total.toFixed(4));
              console.log('- **Queries:** ' + log.length);
            " >> $GITHUB_STEP_SUMMARY 2>/dev/null || true
          fi

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: 'Deep Research Commercial Failed'
          severity: 'warning'
          discord_webhook: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
