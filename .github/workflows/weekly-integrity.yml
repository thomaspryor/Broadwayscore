name: Weekly Data Integrity Check

on:
  schedule:
    - cron: '0 3 * * 0'  # Sundays 3 AM UTC
  workflow_dispatch:
    inputs:
      force_issue:
        description: 'Create issue even if no problems found'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write
  issues: write

jobs:
  integrity-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}



      - name: Checkout core data
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
      - name: Checkout review-texts (private repo)
        uses: ./.github/actions/checkout-review-texts
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Detect and auto-fix critic typos
        id: typos
        run: |
          node scripts/detect-critic-typos.js
          # Commit auto-aliases if changed
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/auto-critic-aliases.json
          if git diff --staged --quiet; then
            echo "No new critic typos detected"
            echo "new_typos=0" >> $GITHUB_OUTPUT
          else
            NEW=$(git diff --staged --stat | grep -oE '[0-9]+ insertion' | grep -oE '[0-9]+' || echo "0")
            echo "new_typos=$NEW" >> $GITHUB_OUTPUT
            git commit -m "data: Auto-detect critic name typos"
            bash scripts/lib/push-with-retry.sh
          fi

      - name: Run dedup cleanup
        id: dedup
        run: |
          OUTPUT=$(node scripts/cleanup-dedup-comprehensive.js 2>&1)
          echo "$OUTPUT"
          OUTLET=$(echo "$OUTPUT" | grep "Outlet alias duplicates merged:" | grep -oE '[0-9]+' || echo "0")
          CRITIC=$(echo "$OUTPUT" | grep "Critic typo duplicates fixed:" | grep -oE '[0-9]+' || echo "0")
          CROSS=$(echo "$OUTPUT" | grep "Cross-show files flagged:" | grep -oE '[0-9]+' || echo "0")
          URL=$(echo "$OUTPUT" | grep "Same-show URL dupes flagged:" | grep -oE '[0-9]+' || echo "0")
          TOTAL=$((OUTLET + CRITIC + CROSS + URL))
          echo "dedup_total=$TOTAL" >> $GITHUB_OUTPUT
          echo "dedup_summary=Outlet:$OUTLET Critic:$CRITIC CrossShow:$CROSS URL:$URL" >> $GITHUB_OUTPUT


      - name: Backfill review quality flags (incremental)
        run: |
          echo "Running incremental backfill of showNotMentioned, misattributed, duplicateTextOf flags..."
          node scripts/backfill-review-flags.js 2>&1 | tail -15

      - name: Push review-texts to private repo
        if: always()
        uses: ./.github/actions/push-review-texts
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
          message: "data: Weekly Data Integrity Check — Commit dedup cleanup + flag backfill"
      - name: Commit dedup cleanup
        if: always()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          # review-texts now pushed via push-review-texts composite action
          if git diff --staged --quiet; then
            echo "No dedup fixes needed"
          else
            git commit -m "chore: Auto-cleanup duplicate review files"
            bash scripts/lib/push-with-retry.sh
          fi

      - name: Clean up junk outlet files
        run: |
          node -e "
            const fs = require('fs');
            const path = require('path');
            const reviewTextsDir = 'data/review-texts';
            const registry = JSON.parse(fs.readFileSync('data/outlet-registry.json', 'utf8'));

            // Build set of valid outlets
            const validOutlets = new Set(Object.keys(registry.outlets));
            if (registry._aliasIndex) {
              for (const alias of Object.keys(registry._aliasIndex)) {
                if (alias !== '_note') validOutlets.add(alias);
              }
            }
            for (const outlet of Object.values(registry.outlets)) {
              if (outlet.aliases) outlet.aliases.forEach(a => validOutlets.add(a));
            }

            // Known junk patterns: scraping artifacts, person names used as outlets
            const JUNK_PATTERNS = [/^advertisement$/, /^sponsored$/, /^promoted$/, /^ad$/, /^promo$/];

            let deleted = 0;
            const showDirs = fs.readdirSync(reviewTextsDir).filter(f =>
              fs.statSync(path.join(reviewTextsDir, f)).isDirectory()
            );

            for (const showDir of showDirs) {
              const files = fs.readdirSync(path.join(reviewTextsDir, showDir))
                .filter(f => f.endsWith('.json') && f !== 'failed-fetches.json');
              for (const file of files) {
                try {
                  const filePath = path.join(reviewTextsDir, showDir, file);
                  const data = JSON.parse(fs.readFileSync(filePath, 'utf8'));
                  const outletId = (data.outletId || '').toLowerCase();
                  if (!outletId || outletId === 'unknown') continue;

                  // Delete files with blocklisted outlet IDs
                  if (JUNK_PATTERNS.some(p => p.test(outletId))) {
                    fs.unlinkSync(filePath);
                    console.log('Deleted junk: ' + showDir + '/' + file);
                    deleted++;
                    continue;
                  }

                  // Delete files where outletId has no URL and critic is 'unknown' and outlet not in registry
                  // (these are scraper garbage: actor names, movie titles, etc.)
                  const hyphenCount = (outletId.match(/-/g) || []).length;
                  if (!data.url && (data.criticName || '').toLowerCase() === 'unknown' &&
                      !validOutlets.has(outletId) && hyphenCount <= 5) {
                    fs.unlinkSync(filePath);
                    console.log('Deleted orphan: ' + showDir + '/' + file + ' (outletId=' + outletId + ', no URL, unknown critic)');
                    deleted++;
                  }
                } catch (e) {}
              }
            }

            if (deleted > 0) {
              console.log('Cleaned up ' + deleted + ' junk review file(s)');
            } else {
              console.log('No junk review files found');
            }
          "


      - name: Push review-texts to private repo
        if: always()
        uses: ./.github/actions/push-review-texts
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
          message: "data: Weekly Data Integrity Check — Commit cleanup"
      - name: Commit cleanup
        if: always()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          # review-texts now pushed via push-review-texts composite action
          if git diff --staged --quiet; then
            echo "No junk files to clean"
          else
            git commit -m "chore: Auto-cleanup junk outlet review files"
            bash scripts/lib/push-with-retry.sh || echo "::warning::Push failed — cleanup data may not have synced"
          fi

      - name: P0 score integrity check
        id: score_integrity
        run: |
          node scripts/check-score-integrity.js
          echo "score_issues=$(cat data/audit/score-integrity.json | jq '.totalIssues')" >> $GITHUB_OUTPUT

      - name: Run integrity check
        id: check
        run: |
          node scripts/generate-integrity-report.js
          echo "has_issues=$(cat data/integrity-report.json | jq '.hasIssues')" >> $GITHUB_OUTPUT
          echo "total_reviews=$(cat data/integrity-report.json | jq '.summary.totalReviews')" >> $GITHUB_OUTPUT
          echo "unknown_outlets=$(cat data/integrity-report.json | jq '.summary.unknownOutlets')" >> $GITHUB_OUTPUT
          echo "duplicates=$(cat data/integrity-report.json | jq '.summary.duplicates')" >> $GITHUB_OUTPUT
          echo "sync_delta=$(cat data/integrity-report.json | jq '.summary.syncDelta')" >> $GITHUB_OUTPUT

      - name: Commit history update
        if: always()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/integrity-history.json data/integrity-report.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "data: Update integrity history"
            bash scripts/lib/push-with-retry.sh
          fi

      - name: Create issue if problems found
        if: steps.check.outputs.has_issues == 'true' || inputs.force_issue == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('data/integrity-report.md', 'utf8');
            // Issue creation disabled — daily digest email covers data integrity
            console.log('Data integrity issues found — see daily digest email for details');
            console.log(report.substring(0, 500));

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: 'Weekly Data Integrity Check Failed'
          discord_webhook: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
          resend_api_key: ${{ secrets.RESEND_API_KEY }}
          owner_email: ${{ secrets.OWNER_EMAIL }}

      - name: Record pipeline success
        if: success()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          mkdir -p data/audit/pipeline-health
          date -u > data/audit/pipeline-health/weekly-integrity.last-success
          git add data/audit/pipeline-health/
          git diff --staged --quiet || git commit -m "health: Record weekly-integrity success" && bash scripts/lib/push-with-retry.sh || echo "::warning::Health recording push failed"
