name: Scrape Theatre.Reviews

on:
  schedule:
    # Weekly on Mondays at 7 AM UTC (2 AM EST), after Stagedoor at 6 AM
    - cron: '0 7 * * 1'
  workflow_dispatch:
    inputs:
      shows:
        description: 'Comma-separated show IDs (e.g., broken-glass-west-end-2026)'
        required: false
        type: string
      dry_run:
        description: 'Dry run (no writes)'
        required: false
        type: boolean
        default: false
      force:
        description: 'Re-fetch shows with existing archives'
        required: false
        type: boolean
        default: false

concurrency:
  group: theatre-reviews-scrape
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  scrape-theatre-reviews:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # BRO-2388 (task #466 class): depth 300 keeps push-with-retry.sh's shallow boundary an ancestor
          # of main for this 90-min job's final ledger commit; depth-1 aborted when churn outran it.
          fetch-depth: 300

      - name: Checkout core data
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}

      - name: Checkout review-texts (private repo)
        uses: ./.github/actions/checkout-review-texts
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run theatre.reviews scraper
        env:
          BRIGHTDATA_TOKEN: ${{ secrets.BRIGHTDATA_TOKEN }}
          BRIGHTDATA_ZONE: ${{ secrets.BRIGHTDATA_ZONE }}
          SCRAPINGDOG_API_KEY: ${{ secrets.SCRAPINGDOG_API_KEY }}
        run: |
          ARGS=""

          if [ -n "${{ inputs.shows }}" ]; then
            ARGS="$ARGS --shows=${{ inputs.shows }}"
          fi

          if [ "${{ inputs.force }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi

          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi

          # shellcheck disable=SC2086
          node scripts/scrape-theatre-reviews.js $ARGS

      - name: Commit archives and review files
        if: always() && inputs.dry_run != true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Aggregator archives are pushed to private repo via push-review-texts (below).
          # Do NOT commit them to the public repo — they contain copyrighted content.
          echo "Aggregator archives will be pushed to private repo only"

      - name: Push review-texts to private repo
        if: always() && inputs.dry_run != true
        uses: ./.github/actions/push-review-texts
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
          message: 'data: Update from scrape-theatre-reviews'

      - name: Commit scraper-spend ledger
        if: always() && inputs.dry_run != true
        continue-on-error: true
        uses: ./.github/actions/commit-scraper-spend-ledger
        with:
          workflow-name: scrape-theatre-reviews

      - name: Trigger rebuild
        if: always() && inputs.dry_run != true
        run: |
          gh workflow run rebuild-reviews.yml -f reason="Post theatre.reviews scrape" || echo "Rebuild dispatch failed"
        env:
          GH_TOKEN: ${{ secrets.REVIEW_TEXTS_TOKEN }}

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: 'Scrape Theatre.Reviews Failed'
          discord_webhook: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
          resend_api_key: ${{ secrets.RESEND_API_KEY }}
          owner_email: ${{ secrets.OWNER_EMAIL }}
