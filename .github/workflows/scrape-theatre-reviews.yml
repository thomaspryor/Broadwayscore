name: Scrape Theatre.Reviews

on:
  schedule:
    # Weekly on Mondays at 7 AM UTC (2 AM EST), after Stagedoor at 6 AM
    - cron: '0 7 * * 1'
  workflow_dispatch:
    inputs:
      shows:
        description: 'Comma-separated show IDs (e.g., broken-glass-west-end-2026)'
        required: false
        type: string
      dry_run:
        description: 'Dry run (no writes)'
        required: false
        type: boolean
        default: false
      force:
        description: 'Re-fetch shows with existing archives'
        required: false
        type: boolean
        default: false

concurrency:
  group: theatre-reviews-scrape
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  scrape-theatre-reviews:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # BRO-2388 (task #466 class): depth 300 keeps push-with-retry.sh's shallow boundary an ancestor
          # of main for this 90-min job's final ledger commit; depth-1 aborted when churn outran it.
          fetch-depth: 300

      - name: Checkout core data
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}

      - name: Checkout review-texts (private repo)
        uses: ./.github/actions/checkout-review-texts
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
      - name: Opening-night lease sync (BRO-6648)
        uses: ./.github/actions/opening-night-lease-sync
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }} # BRO-6672: lets a failed sync read LANE_ONLY_MARKETS

      - name: Checkout aggregator-archive (private repo)
        uses: ./.github/actions/checkout-aggregator-archive
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Playwright
        uses: ./.github/actions/setup-playwright

      - name: Run theatre.reviews scraper
        env:
          BRIGHTDATA_TOKEN: ${{ secrets.BRIGHTDATA_TOKEN }}
          BRIGHTDATA_ZONE: ${{ secrets.BRIGHTDATA_ZONE }}
          SCRAPINGDOG_API_KEY: ${{ secrets.SCRAPINGDOG_API_KEY }}
          INPUT_SHOWS: ${{ inputs.shows }}
        run: |
          ARGS=""

          if [ -n "${INPUT_SHOWS}" ]; then
            ARGS="$ARGS --shows=${INPUT_SHOWS}"
          fi

          if [ "${{ inputs.force }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi

          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi

          # shellcheck disable=SC2086
          node scripts/scrape-theatre-reviews.js $ARGS

      # BRO-6084: the round-up HTML and _roundup-index.json live in the private aggregator-archive
      # repo (copyrighted content, never the public repo). Persisting them is what lets every
      # weekly run skip unchanged archived pages instead of refetching ~250 round-ups.
      - name: Push aggregator-archive to private repo
        if: always() && inputs.dry_run != true
        uses: ./.github/actions/push-aggregator-archive
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
          message: 'data: theatre.reviews round-up archive'

      - name: Push review-texts to private repo
        if: always() && inputs.dry_run != true
        uses: ./.github/actions/push-review-texts
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
          message: 'data: Update from scrape-theatre-reviews'

      # BRO-6084: per-show coverage report (listed / held / excluded / missing + unmatched round-ups).
      # Counts and outlet names only, no review text. Advisory: a push failure warns, never fails the job.
      - name: Commit theatre.reviews coverage report
        if: always() && inputs.dry_run != true
        continue-on-error: true
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/audit/theatre-reviews-coverage.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No coverage report changes to commit"
            exit 0
          fi
          bash scripts/lib/check-file-sizes.sh --advisory
          COUNTS=$(node -e "const m=require('./data/audit/theatre-reviews-coverage.json')._meta; console.log(m.showsMatched+' shows, '+m.missing+' missing, '+m.excluded+' excluded, '+m.unmatched+' unmatched')")
          git commit -m "audit: theatre.reviews coverage ($COUNTS)

          Co-Authored-By: github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
          bash scripts/lib/push-with-retry.sh

      - name: Commit scraper-spend ledger
        if: always() && inputs.dry_run != true
        continue-on-error: true
        uses: ./.github/actions/commit-scraper-spend-ledger
        with:
          workflow-name: scrape-theatre-reviews

      - name: Trigger rebuild
        if: always() && inputs.dry_run != true
        run: |
          gh workflow run rebuild-reviews.yml -f reason="Post theatre.reviews scrape" || echo "Rebuild dispatch failed"
        env:
          GH_TOKEN: ${{ secrets.REVIEW_TEXTS_TOKEN }}

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: 'Scrape Theatre.Reviews Failed'
          discord_webhook: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
          resend_api_key: ${{ secrets.RESEND_API_KEY }}
          owner_email: ${{ secrets.OWNER_EMAIL }}
