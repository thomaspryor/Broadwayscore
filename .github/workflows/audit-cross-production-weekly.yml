# Weekly cross-production misattribution audit.
#
# Runs audit-cross-production.js --dry-run, commits same-title-confusion.json
# if findings changed, and emits a ::warning:: annotation when delta > 3.
#
# Schedule: Sundays 14:00 UTC — after BWW scrape (13:00) before DTLI (15:00).
# READ-ONLY: never modifies review-texts files.
name: Audit Cross-Production (Weekly)

on:
  schedule:
    - cron: '0 14 * * 0'
  workflow_dispatch:

permissions:
  contents: write

# Share `shows-json-writer` with update-show-status + enrich-off-broadway-dates:
# the aggregator-candidate extract step below does a read-mutate-write on
# data/audit/ob-venue-candidates.json via writeStagingCandidates(), same as
# discover-new-shows.js. Serializing prevents a lost-update race on that file.
concurrency:
  group: shows-json-writer
  cancel-in-progress: false

jobs:
  audit:
    name: Run cross-production audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout core data
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}

      - name: Checkout review-texts
        uses: ./.github/actions/checkout-review-texts
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}

      - uses: ./.github/actions/setup-node

      - name: Capture previous finding counts
        id: prev
        run: |
          if [ -f data/audit/same-title-confusion.json ]; then
            CP=$(node -e "const d=require('./data/audit/same-title-confusion.json'); console.log(d.findings ? d.findings.length : 0)")
            echo "cp_count=$CP" >> $GITHUB_OUTPUT
          else
            echo "cp_count=0" >> $GITHUB_OUTPUT
          fi
          if [ -f data/audit/slug-misroute-audit.json ]; then
            SM=$(node -e "const d=require('./data/audit/slug-misroute-audit.json'); console.log(d.findings ? d.findings.length : 0)")
            echo "sm_count=$SM" >> $GITHUB_OUTPUT
          else
            echo "sm_count=0" >> $GITHUB_OUTPUT
          fi

      - name: Run cross-production audit
        run: node scripts/audit-cross-production.js --dry-run

      - name: Run slug-routing audit
        # Catches Class-A slug misroutes (e.g. FUN-HOME article routed to
        # closed home-1970). Initial audit found 228 historical cases
        # 2026-05-27. This step warns if >5 new ones appear week-over-week,
        # signaling matcher/data drift. Read-only — never moves files.
        run: node scripts/audit-slug-match-routing.js
        env:
          REVIEW_TEXTS_DIR: ${{ github.workspace }}/data/review-texts

      - name: Report new slug misroutes
        # Subtracts the committed disposition list (data/audit/slug-misroute-
        # dispositioned.json — leave-as-is findings already triaged) from the
        # fresh audit. APPLIED/DELETED misroutes self-drop from the audit, so
        # what's left after subtraction is genuinely NEW + un-triaged. Emails the
        # operator (only if >0) with the LOCAL verify+apply commands. READ-ONLY:
        # writes nothing, moves nothing, no LLM calls in CI (operator verifies
        # locally where keys live in .env). continue-on-error so a transient
        # email failure never skips the non-if:always() commit step below.
        continue-on-error: true
        run: node scripts/disposition-misroute.js report --email
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}

      - name: Extract aggregator candidates
        # Turns the unmatched-article audit (written by the PV + BWW scrapers
        # earlier on Sunday) into OB-discovery candidates staged in
        # ob-venue-candidates.json. Human-gated promotion stays in
        # promote-ob-venue-candidates.js (CLAUDE.md §3 — no auto-add).
        # --limit caps fetches; abort gate inside the script stops runaway
        # parser regressions from mass-staging.
        #
        # continue-on-error: the MAX_ACCEPT abort (exit 1) must NOT fail the
        # whole job — that would skip the non-if:always() "Check for changes"
        # step and suppress the UNRELATED cross-production + slug-routing audit
        # commits. The ::error:: annotation still surfaces the abort. (ship-check)
        continue-on-error: true
        run: |
          if [ -z "$BRIGHTDATA_TOKEN" ] && [ -z "$SCRAPINGBEE_API_KEY" ]; then
            echo "::warning::No scraper credentials present — aggregator candidate extraction will fetch nothing."
          fi
          node scripts/extract-aggregator-candidates.js --limit=20
        env:
          BRIGHTDATA_TOKEN: ${{ secrets.BRIGHTDATA_TOKEN }}
          BRIGHTDATA_ZONE: ${{ secrets.BRIGHTDATA_ZONE }}
          SCRAPINGBEE_API_KEY: ${{ secrets.SCRAPINGBEE_API_KEY }}

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet data/audit/same-title-confusion.json data/audit/slug-misroute-audit.json data/audit/ob-venue-candidates.json data/audit/ob-aggregator-rejections.json 2>/dev/null; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Check for large files
        if: steps.changes.outputs.has_changes == 'true'
        uses: ./.github/actions/check-file-sizes

      - name: Commit and push
        if: always() && steps.changes.outputs.has_changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/audit/same-title-confusion.json data/audit/slug-misroute-audit.json
          git add data/audit/ob-venue-candidates.json data/audit/ob-aggregator-rejections.json 2>/dev/null || true
          CP=$(node -e "const d=require('./data/audit/same-title-confusion.json'); console.log(d.findings ? d.findings.length : 0)" 2>/dev/null || echo "?")
          SM=$(node -e "const d=require('./data/audit/slug-misroute-audit.json'); console.log(d.findings ? d.findings.length : 0)" 2>/dev/null || echo "?")
          AGG=$(node -e "const d=require('./data/audit/ob-aggregator-rejections.json'); console.log((d.counts&&d.counts.accepted||0)+' new, '+(d.counts&&d.counts.rejected||0)+' rejected')" 2>/dev/null || echo "0 new")
          git commit -m "audit: Weekly cross-production ($CP) + slug-routing ($SM) + aggregator ($AGG) [skip ci]

          Co-Authored-By: github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
          bash scripts/lib/push-with-retry.sh

      - name: Annotate finding deltas
        if: always()
        run: |
          CP_PREV=${{ steps.prev.outputs.cp_count }}
          CP_CURR=$(node -e "const d=require('./data/audit/same-title-confusion.json'); console.log(d.findings ? d.findings.length : 0)" 2>/dev/null || echo "0")
          CP_DELTA=$((CP_CURR - CP_PREV))
          if [ "$CP_DELTA" -gt 3 ]; then
            echo "::warning::cross-production audit: +${CP_DELTA} new findings (${CP_PREV} → ${CP_CURR}). Check data/audit/same-title-confusion.json."
          fi
          SM_PREV=${{ steps.prev.outputs.sm_count }}
          SM_CURR=$(node -e "const d=require('./data/audit/slug-misroute-audit.json'); console.log(d.findings ? d.findings.length : 0)" 2>/dev/null || echo "0")
          SM_DELTA=$((SM_CURR - SM_PREV))
          if [ "$SM_DELTA" -gt 5 ]; then
            echo "::warning::slug-routing audit: +${SM_DELTA} new misroutes (${SM_PREV} → ${SM_CURR}). Check data/audit/slug-misroute-audit.json."
          fi

      - name: Summary
        run: |
          echo "## Cross-Production Audit" >> $GITHUB_STEP_SUMMARY
          node -e "
            const d = require('./data/audit/same-title-confusion.json');
            const findings = d.findings || [];
            console.log('**Total findings:** ' + findings.length);
            if (findings.length > 0) {
              console.log('');
              console.log('| Review File | Filed Under | Closer To | Days Delta |');
              console.log('|-------------|-------------|-----------|------------|');
              for (const f of findings.slice(0, 10)) {
                const delta = Math.round(f.signals?.find(s => s.startsWith('days-from-own:'))?.split(':')[1] || 0) - Math.round(f.signals?.find(s => s.startsWith('days-from-closer:'))?.split(':')[1] || 0);
                console.log('| ' + (f.reviewFile || '?') + ' | ' + (f.currentShowId || '?') + ' | ' + (f.suggestedShowId || '?') + ' | ' + delta + ' |');
              }
              if (findings.length > 10) console.log('_…and ' + (findings.length - 10) + ' more_');
            }
          " >> $GITHUB_STEP_SUMMARY

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: 'Audit Cross-Production Weekly Failed'
          severity: 'warning'
