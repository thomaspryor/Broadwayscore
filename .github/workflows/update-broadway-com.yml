name: Update Broadway.com Data

on:
  schedule:
    # Weekly on Sundays at 3 PM UTC (10 AM EST), after Theatr at 2 PM
    - cron: '0 15 * * 0'
  workflow_dispatch:
    inputs:
      show:
        description: 'Single show ID to update (e.g., hamilton-2015)'
        required: false
        type: string
      limit:
        description: 'Max number of shows to process'
        required: false
        type: number
        default: 0
      dry_run:
        description: 'Dry run (no writes)'
        required: false
        type: boolean
        default: false

concurrency:
  group: audience-buzz
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape-broadway-com:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout core data
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Broadway.com scraper
        run: |
          ARGS="--verbose"

          if [ -n "${{ inputs.show }}" ]; then
            ARGS="$ARGS --show=${{ inputs.show }}"
          fi

          if [ "${{ inputs.limit }}" != "0" ] && [ -n "${{ inputs.limit }}" ]; then
            ARGS="$ARGS --limit=${{ inputs.limit }}"
          fi

          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi

          node scripts/scrape-broadway-com-audience.js $ARGS

      - name: Push core data to private repo
        if: always() && inputs.dry_run != true
        uses: ./.github/actions/push-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
          message: 'data: Update from update-broadway-com'

      - name: Dispatch deploy
        if: always() && inputs.dry_run != true
        uses: ./.github/actions/dispatch-deploy

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: 'Update Broadway.com Data Failed'
          discord_webhook: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
          resend_api_key: ${{ secrets.RESEND_API_KEY }}
          owner_email: ${{ secrets.OWNER_EMAIL }}
