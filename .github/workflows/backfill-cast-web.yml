name: Backfill Cast Data (Web Search)

on:
  workflow_dispatch:
    inputs:
      category:
        description: 'Category to process'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - off-broadway
          - west-end
      show_filter:
        description: 'Optional: specific show ID to process'
        required: false
        type: string
      limit:
        description: 'Max shows to process (0 = all)'
        required: false
        default: '0'
        type: string
      force:
        description: 'Re-process shows with existing cast files'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: backfill-cast-web
  cancel-in-progress: false

jobs:
  backfill-cast-web:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Checkout core data
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run web cast backfill
        env:
          BRIGHTDATA_TOKEN: ${{ secrets.BRIGHTDATA_TOKEN }}
          BRIGHTDATA_ZONE: ${{ secrets.BRIGHTDATA_ZONE }}
          SCRAPINGBEE_API_KEY: ${{ secrets.SCRAPINGBEE_API_KEY }}
          SCRAPINGDOG_API_KEY: ${{ secrets.SCRAPINGDOG_API_KEY }}
          SCRAPER_USE_SCRAPINGDOG: '1'
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          FLAGS=""
          if [ -n "${{ inputs.category }}" ] && [ "${{ inputs.category }}" != "all" ]; then
            FLAGS="$FLAGS --category=${{ inputs.category }}"
          fi
          if [ -n "${{ inputs.show_filter }}" ]; then
            FLAGS="$FLAGS --show-filter=${{ inputs.show_filter }}"
          fi
          if [ "${{ inputs.limit }}" != "0" ] && [ -n "${{ inputs.limit }}" ]; then
            FLAGS="$FLAGS --limit=${{ inputs.limit }}"
          fi
          if [ "${{ inputs.force }}" = "true" ]; then
            FLAGS="$FLAGS --force"
          fi
          echo "Running: node scripts/backfill-cast-web.js $FLAGS"
          node scripts/backfill-cast-web.js $FLAGS

      - name: Check for changes
        if: always()
        id: git-check
        run: |
          CAST_FILES=$(git status --porcelain data/cast/ | wc -l | tr -d ' ')
          echo "Changed cast files: $CAST_FILES"
          if [ "$CAST_FILES" -gt "0" ]; then
            echo "changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Enrich shows.json cast from cast files
        if: always() && steps.git-check.outputs.changes == 'true'
        run: |
          node scripts/enrich-cast-from-files.js --force
          # Shared wrapper regenerates detail + index together (single source of
          # truth). Commit step below stages only detail JSONs; the regenerated
          # index is an unstaged no-op here (cast doesn't change the index).
          bash scripts/generate-mobile-artifacts.sh

      - name: Commit and push
        if: always() && steps.git-check.outputs.changes == 'true'
        # BRO-427: this step was the confirmed failure point on 5 straight
        # runs in 24h (all "Commit and push", all a git-push transport HANG
        # at push-with-retry.sh's 90s GIT_NET_TIMEOUT_SEC cap — not a
        # rejection). It ran on the shared MAX_RETRIES=5/PUSH_DEADLINE_SEC=240
        # defaults, which `node scripts/audit-push-retry-budgets.js` flags as
        # retries-undersized-vs-deadline + deadline-cannot-fund-retries +
        # fallback-early-trigger-unreachable (fundableAttempts=2 vs the
        # Git Data API fallback's own default trigger of 3). Same defect
        # class as BRO-2811 (weekly-integrity.yml, 2026-09-08): raising
        # MAX_RETRIES alone pushes the fallback's default trigger threshold
        # (floor((retries+1)/2)) further out of reach, so
        # PUSH_API_FALLBACK_AFTER_ATTEMPTS must be pinned low too. 25/900/3
        # matches that exact precedent and clears all three flags (verified
        # via the audit tool). Job's 60-min timeout has ample headroom — the
        # actual backfill work completes in under 2 minutes. Note (Codex
        # adversarial review, BRO-427): the Git Data API fallback runs ON TOP
        # of PUSH_DEADLINE_SEC, not inside it, so this step's true worst case
        # is ~900s local (3 attempts, early-fallback trigger) + up to ~400s
        # fallback ≈ 16-18min, not a flat 15min ceiling — still leaves ~40min
        # of the 60-min job timeout for the always() steps below (push-core-
        # data, ledger commit, notify-failure), each of which normally
        # completes in well under a minute.
        env:
          PUSH_DEADLINE_SEC: '900'
          PUSH_API_FALLBACK_AFTER_ATTEMPTS: '3'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/cast/ public/data/shows/

          CAT_MSG=""
          if [ -n "${{ inputs.category }}" ] && [ "${{ inputs.category }}" != "all" ]; then
            CAT_MSG=" (${{ inputs.category }})"
          fi

          CAST_COUNT=$(git status --porcelain data/cast/ | wc -l | tr -d ' ')
          git commit -m "data: Backfill cast via web search${CAT_MSG} [${CAST_COUNT} files]"
          bash scripts/lib/push-with-retry.sh 25 main

      - name: Push core data to private repo
        if: always()
        uses: ./.github/actions/push-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
          message: 'data: Update from backfill-cast-web'

      - name: Commit scraper-spend ledger
        if: always()
        continue-on-error: true
        uses: ./.github/actions/commit-scraper-spend-ledger
        with:
          workflow-name: backfill-cast-web

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: 'Backfill Cast Web Failed'
          discord_webhook: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
