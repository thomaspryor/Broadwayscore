name: Enrich IBDB Dates

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode: enrich (fill missing), verify (compare only), force (overwrite all)'
        required: true
        default: 'enrich'
        type: choice
        options:
          - enrich
          - verify
          - force
      show:
        description: 'Optional: specific show slug to process'
        required: false
        type: string
      status:
        description: 'Optional: filter by show status'
        required: false
        type: choice
        options:
          - all
          - open
          - previews
          - closed

permissions:
  contents: write

jobs:
  enrich-dates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main


      - name: Checkout core data
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci || npm install

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Run IBDB date enrichment
        id: enrich
        env:
          SCRAPINGBEE_API_KEY: ${{ secrets.SCRAPINGBEE_API_KEY }}
          BRIGHTDATA_TOKEN: ${{ secrets.BRIGHTDATA_TOKEN }}
        run: |
          FLAGS=""

          # Mode flags
          if [ "${{ inputs.mode }}" = "verify" ]; then
            FLAGS="$FLAGS --verify --dry-run"
          elif [ "${{ inputs.mode }}" = "force" ]; then
            FLAGS="$FLAGS --force"
          else
            FLAGS="$FLAGS --missing-only"
          fi

          # Show filter
          if [ -n "${{ inputs.show }}" ]; then
            FLAGS="$FLAGS --show=${{ inputs.show }}"
          fi

          # Status filter
          if [ -n "${{ inputs.status }}" ] && [ "${{ inputs.status }}" != "all" ]; then
            FLAGS="$FLAGS --status=${{ inputs.status }}"
          fi

          echo "Running: node scripts/enrich-ibdb-dates.js $FLAGS"
          node scripts/enrich-ibdb-dates.js $FLAGS

      - name: Check for changes
        if: inputs.mode != 'verify'
        id: git-check
        run: |
          git diff --exit-code data/shows.json || echo "changes=true" >> $GITHUB_OUTPUT

      - name: Commit and push changes
        if: always() && steps.git-check.outputs.changes == 'true' && inputs.mode != 'verify'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          # Core data files pushed to private repo by push-core-data action

          SHOW_MSG=""
          if [ -n "${{ inputs.show }}" ]; then
            SHOW_MSG=" for ${{ inputs.show }}"
          fi

          git commit -m "data: Enrich IBDB dates${SHOW_MSG}"

          bash scripts/lib/push-with-retry.sh


      - name: Push core data to private repo
        if: always()
        uses: ./.github/actions/push-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
          message: 'data: Update from enrich-ibdb-dates'

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: 'IBDB Date Enrichment Failed'
          discord_webhook: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
          resend_api_key: ${{ secrets.RESEND_API_KEY }}
          owner_email: ${{ secrets.OWNER_EMAIL }}