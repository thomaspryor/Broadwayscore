name: Generate Theater Tips

on:
  schedule:
    # Quarterly: 1st of Jan, Apr, Jul, Oct at 6 AM UTC (1 AM EST)
    - cron: '0 6 1 1,4,7,10 *'
  workflow_dispatch:
    inputs:
      theater:
        description: 'Single theater name filter (optional)'
        required: false
        type: string
      limit:
        description: 'Limit number of theaters to process (0=all)'
        required: false
        type: number
        default: 0
      skip_scrape:
        description: 'Skip scraping, use existing scraped data'
        required: false
        type: boolean
        default: false
      dry_run:
        description: 'Generate but do not merge into metadata'
        required: false
        type: boolean
        default: false

jobs:
  generate-tips:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main


      - name: Checkout core data
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Setup Playwright
        if: ${{ github.event_name == 'schedule' || inputs.skip_scrape != true }}
        uses: ./.github/actions/setup-playwright

      - name: Scrape theater dining & parking data
        if: ${{ github.event_name == 'schedule' || inputs.skip_scrape != true }}
        env:
          BRIGHTDATA_TOKEN: ${{ secrets.BRIGHTDATA_TOKEN }}
          SCRAPINGBEE_API_KEY: ${{ secrets.SCRAPINGBEE_API_KEY }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.theater }}" ]; then
            ARGS="$ARGS --theater \"${{ inputs.theater }}\""
          fi
          if [ "${{ inputs.limit }}" != "0" ]; then
            ARGS="$ARGS --limit ${{ inputs.limit }}"
          fi
          echo "Running: node scripts/scrape-theater-tips.js $ARGS"
          eval node scripts/scrape-theater-tips.js $ARGS

      - name: Generate structured tips via Gemini Flash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.theater }}" ]; then
            ARGS="$ARGS --theater \"${{ inputs.theater }}\""
          fi
          if [ "${{ inputs.limit }}" != "0" ]; then
            ARGS="$ARGS --limit ${{ inputs.limit }}"
          fi
          echo "Running: node scripts/generate-theater-tips.js $ARGS"
          eval node scripts/generate-theater-tips.js $ARGS

      - name: Validate restaurant names (optional)
        if: ${{ secrets.GOOGLE_PLACES_API_KEY != '' }}
        continue-on-error: true
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: node scripts/validate-restaurant-names.js --sample 10

      - name: Merge tips into theater metadata
        if: ${{ github.event_name == 'schedule' || inputs.dry_run != true }}
        run: node scripts/merge-theater-tips.js

      - name: Validate data
        if: ${{ github.event_name == 'schedule' || inputs.dry_run != true }}
        run: node scripts/validate-data.js

      - name: Commit and push if changed
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/theater-tips-scraped.json data/theater-tips-draft.json data/theater-metadata.json
          if git diff --staged --quiet; then
            echo "No changes to theater tips"
          else
            git commit -m "chore: Update theater tips data (automated)"
            bash scripts/lib/push-with-retry.sh
          fi
      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: 'Generate Theater Tips Failed'
          severity: 'warning'
          discord_webhook: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
