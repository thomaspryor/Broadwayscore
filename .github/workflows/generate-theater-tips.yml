name: Generate Theater Tips

on:
  schedule:
    # Quarterly: 1st of Jan, Apr, Jul, Oct at 6 AM UTC (1 AM EST)
    - cron: '0 6 1 1,4,7,10 *'
  workflow_dispatch:
    inputs:
      theater:
        description: 'Single theater name filter (optional)'
        required: false
        type: string
      limit:
        description: 'Limit number of theaters to process (0=all)'
        required: false
        type: number
        default: 0
      skip_scrape:
        description: 'Skip scraping, use existing scraped data'
        required: false
        type: boolean
        default: false
      dry_run:
        description: 'Generate but do not merge into metadata'
        required: false
        type: boolean
        default: false

# BRO-3511: one run at a time. A quarterly cron overlapping a manual dispatch
# would both rewrite data/theater-metadata.json, and push-with-retry.sh resolves
# data-file conflicts by keeping the running job's version.
concurrency:
  group: generate-theater-tips
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  generate-tips:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          # BRO-2388 (task #466 class): depth 300 keeps push-with-retry.sh's shallow boundary an ancestor
          # of main for this 60-min job's final ledger commit; depth-1 aborted when churn outran it.
          fetch-depth: 300


      - name: Checkout core data
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Setup Playwright
        if: ${{ github.event_name == 'schedule' || inputs.skip_scrape != true }}
        uses: ./.github/actions/setup-playwright

      - name: Scrape theater dining & parking data
        if: ${{ github.event_name == 'schedule' || inputs.skip_scrape != true }}
        env:
          BRIGHTDATA_TOKEN: ${{ secrets.BRIGHTDATA_TOKEN }}
          BRIGHTDATA_ZONE: ${{ secrets.BRIGHTDATA_ZONE }}
          SCRAPINGBEE_API_KEY: ${{ secrets.SCRAPINGBEE_API_KEY }}
          SCRAPINGDOG_API_KEY: ${{ secrets.SCRAPINGDOG_API_KEY }}
          SCRAPER_USE_SCRAPINGDOG: '1'
          INPUT_THEATER: ${{ inputs.theater }}
        run: |
          ARGS=""
          if [ -n "${INPUT_THEATER}" ]; then
            ARGS="$ARGS --theater \"${INPUT_THEATER}\""
          fi
          if [ "${{ inputs.limit }}" != "0" ]; then
            ARGS="$ARGS --limit ${{ inputs.limit }}"
          fi
          echo "Running: node scripts/scrape-theater-tips.js $ARGS"
          eval node scripts/scrape-theater-tips.js $ARGS

      - name: Generate structured tips via Gemini Flash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          INPUT_THEATER: ${{ inputs.theater }}
        run: |
          ARGS=""
          if [ -n "${INPUT_THEATER}" ]; then
            ARGS="$ARGS --theater \"${INPUT_THEATER}\""
          fi
          if [ "${{ inputs.limit }}" != "0" ]; then
            ARGS="$ARGS --limit ${{ inputs.limit }}"
          fi
          echo "Running: node scripts/generate-theater-tips.js $ARGS"
          eval node scripts/generate-theater-tips.js $ARGS

      - name: Validate restaurant names (optional, needs GOOGLE_PLACES_API_KEY)
        continue-on-error: true
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: node scripts/validate-restaurant-names.js --sample 10

      - name: Merge tips into theater metadata
        id: merge
        if: ${{ github.event_name == 'schedule' || inputs.dry_run != true }}
        run: node scripts/merge-theater-tips.js

      - name: Validate data
        id: validate
        if: ${{ github.event_name == 'schedule' || inputs.dry_run != true }}
        run: node scripts/validate-data.js

      - name: Commit and push if changed
        if: always()
        env:
          MERGE_OUTCOME: ${{ steps.merge.outcome }}
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/theater-tips-scraped.json data/theater-tips-draft.json
          # BRO-3511: publish the merged metadata only when merge AND validation
          # both succeeded (or were skipped for a dry run, which leaves it
          # untouched). A failed/cancelled step keeps the scraped+draft research
          # artifacts but never ships unvalidated metadata.
          for o in "$MERGE_OUTCOME" "$VALIDATE_OUTCOME"; do
            if [ "$o" != "success" ] && [ "$o" != "skipped" ]; then
              echo "::warning::Theater metadata NOT committed (merge=$MERGE_OUTCOME validate=$VALIDATE_OUTCOME)"
              git checkout -- data/theater-metadata.json || true
              PUBLISH_METADATA=false
            fi
          done
          if [ "${PUBLISH_METADATA:-true}" = "true" ]; then git add data/theater-metadata.json; fi
          if git diff --staged --quiet; then
            echo "No changes to theater tips"
          else
            git commit -m "chore: Update theater tips data (automated)"
            bash scripts/lib/push-with-retry.sh
          fi

      - name: Commit scraper-spend ledger
        if: always()
        continue-on-error: true
        uses: ./.github/actions/commit-scraper-spend-ledger
        with:
          workflow-name: generate-theater-tips

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: 'Generate Theater Tips Failed'
          severity: 'warning'
          discord_webhook: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
