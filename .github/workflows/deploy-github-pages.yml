# ============================================================
# SECONDARY DEPLOYMENT - GitHub Pages (legacy backup)
# PRIMARY DEPLOYMENT is Vercel (auto-deploys on push, no action needed)
# ============================================================
name: Deploy to GitHub Pages (Secondary)

on:
  push:
    branches: [main, claude/broadway-metascore-site-8jjx7]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6


      - name: Checkout core data
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Add .nojekyll
        run: touch out/.nojekyll

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: out
          branch: gh-pages
      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: 'Deploy Github Pages Failed'
          discord_webhook: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
