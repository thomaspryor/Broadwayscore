name: Dump Formspree Submissions (one-off)

on:
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch all Broadway subscriber submissions
        env:
          FORMSPREE_SUBSCRIBER_API_KEY: ${{ secrets.FORMSPREE_SUBSCRIBER_API_KEY }}
          FORMSPREE_SUBSCRIBER_FORM_ID: ${{ secrets.FORMSPREE_SUBSCRIBER_FORM_ID }}
        run: |
          node -e "
          const https = require('https');
          function fetch(url) {
            return new Promise((resolve, reject) => {
              https.get(url, {
                headers: {
                  'Authorization': 'Bearer ' + process.env.FORMSPREE_SUBSCRIBER_API_KEY,
                  'Accept': 'application/json'
                }
              }, res => {
                let body = '';
                res.on('data', c => body += c);
                res.on('end', () => resolve(JSON.parse(body)));
              }).on('error', reject);
            });
          }
          (async () => {
            let all = [], offset = 0;
            while (true) {
              const r = await fetch('https://formspree.io/api/0/forms/' + process.env.FORMSPREE_SUBSCRIBER_FORM_ID + '/submissions?limit=100&offset=' + offset);
              const subs = r.submissions || r || [];
              if (!subs.length) break;
              all = all.concat(subs);
              offset += subs.length;
              if (subs.length < 100) break;
            }
            console.log('Total submissions:', all.length);
            // Show all fields from each submission
            all.forEach(s => {
              console.log(JSON.stringify({
                date: s.date,
                email: s.data?.email || s.email,
                source: s.data?.source,
                market: s.data?.market,
                _url: s._url || s.data?._url,
                referrer: s.referrer || s.data?.referrer,
                raw_keys: Object.keys(s)
              }));
            });
          })();
          "
