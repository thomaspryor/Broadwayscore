name: Check Performance Budget

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.*'
      - 'tailwind.config.*'
  workflow_dispatch:
    inputs:
      update_baseline:
        description: 'Update the bundle size baseline'
        required: false
        default: false
        type: boolean

concurrency:
  group: check-performance-${{ github.ref }}
  # On main: never cancel — every commit must be size-checked (a cancelled run leaves
  # the bundle-size gate unevaluated for that commit). On PRs: cancel superseded runs.
  # See memory/feedback_test_yml_cancel_in_progress.md.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  bundle-size:
    name: Bundle Size Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Checkout core data
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build and check bundle sizes
        id: check
        run: |
          if [ "${{ inputs.update_baseline }}" = "true" ]; then
            node scripts/check-bundle-size.js --update-baseline 2>&1 | tee /tmp/bundle-report.txt
          else
            node scripts/check-bundle-size.js --ci 2>&1 | tee /tmp/bundle-report.txt
          fi

      - name: Commit updated baseline
        if: inputs.update_baseline == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/audit/bundle-size-baseline.json data/audit/bundle-size-history.json
          git diff --cached --quiet || git commit -m "perf: Update bundle size baseline [skip ci]"
          bash scripts/lib/push-with-retry.sh

      - name: Commit size history
        if: always() && inputs.update_baseline != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/audit/bundle-size-history.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "perf: Record bundle size snapshot [skip ci]"
          bash scripts/lib/push-with-retry.sh || true

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: 'Performance Budget Exceeded'
          severity: 'warning'
          discord_webhook: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}

  lighthouse-tbt:
    name: Lighthouse TBT Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Run after deploy completes so we test the live site
    # Falls back to testing production URL (catches regressions from prior deploy)
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install Lighthouse
        run: npm install -g lighthouse

      - name: Run mobile Lighthouse audit
        id: lighthouse
        env:
          DISCORD_WEBHOOK_ALERTS: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
        run: |
          node -e '
          const { execSync } = require("child_process");
          const SITE_URL = "https://broadwayscorecard.com";
          // CI runners are ~30-50% slower than real devices; first run has cold-start overhead
          const TBT_THRESHOLD = 750;

          const results = [];
          for (let i = 1; i <= 3; i++) {
            console.log("Mobile pass " + i + "/3...");
            const outFile = "/tmp/lh-mobile-" + i + ".json";
            try {
              execSync(
                "lighthouse " + SITE_URL + " --output=json --output-path=" + outFile +
                " --chrome-flags=\"--headless --no-sandbox --disable-gpu\" " +
                "--only-categories=performance --quiet",
                { stdio: "pipe", timeout: 90000 }
              );
              const report = JSON.parse(require("fs").readFileSync(outFile, "utf8"));
              results.push(report.audits["total-blocking-time"].numericValue || 0);
            } catch (e) {
              console.log("Warning: pass " + i + " failed: " + e.message.substring(0, 100));
            }
          }

          if (results.length === 0) {
            console.log("All Lighthouse passes failed — skipping TBT check");
            process.exit(0);
          }

          // Use best-of-3 (lowest TBT) to avoid CI cold-start outliers
          const sorted = [...results].sort((a, b) => a - b);
          const bestTBT = sorted[0];
          console.log("Best mobile TBT: " + bestTBT.toFixed(0) + "ms (threshold: " + TBT_THRESHOLD + "ms)");
          console.log("All runs: " + results.map(r => r.toFixed(0) + "ms").join(", "));

          if (bestTBT > TBT_THRESHOLD) {
            console.log("::error::Mobile TBT " + bestTBT.toFixed(0) + "ms exceeds threshold of " + TBT_THRESHOLD + "ms");

            // Send Discord alert
            const webhook = process.env.DISCORD_WEBHOOK_ALERTS;
            if (webhook) {
              const payload = JSON.stringify({
                content: "⚠️ **TBT Regression Detected** (post-deploy check)\n" +
                  "Best-of-3 TBT: " + bestTBT.toFixed(0) + "ms (threshold: " + TBT_THRESHOLD + "ms)\n" +
                  "Runs: " + results.map(r => r.toFixed(0) + "ms").join(", ") +
                  "\nCommit: " + (process.env.GITHUB_SHA || "unknown").substring(0, 8),
              });
              try {
                require("fs").writeFileSync("/tmp/discord-tbt.json", payload);
                execSync("curl -s -X POST -H \"Content-Type: application/json\" -d @/tmp/discord-tbt.json \"" + webhook + "\"", { stdio: "pipe" });
              } catch {}
            }
            process.exit(1);
          }
          console.log("✅ TBT within budget");
          '

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: 'Mobile TBT Regression Detected'
          severity: 'warning'
          discord_webhook: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
