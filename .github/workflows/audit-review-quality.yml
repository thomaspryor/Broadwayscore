# Audit review quality — detect non-reviews and cross-outlet duplicates
# Runs weekly after rebuild-reviews (which runs daily at 4 AM UTC)
name: Audit Review Quality

on:
  schedule:
    # Weekly on Tuesdays at 5 AM UTC (midnight EST) — after Monday rebuild
    - cron: '0 5 * * 2'
  workflow_dispatch:
    inputs:
      audit:
        description: 'Which audit to run'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - non-reviews
          - duplicates
      skip_llm:
        description: 'Skip LLM classification (heuristics only)'
        required: false
        default: false
        type: boolean
      dry_run:
        description: 'Report only, do not flag files'
        required: false
        default: false
        type: boolean
      force:
        description: 'Re-check already-flagged files'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  audit:
    name: Audit review quality
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout core data
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}

      - name: Checkout review-texts (private repo)
        uses: ./.github/actions/checkout-review-texts
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run non-review audit
        if: inputs.audit == 'all' || inputs.audit == 'non-reviews' || github.event_name == 'schedule'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          ARGS=""
          if [ "${{ inputs.skip_llm }}" == "true" ]; then
            ARGS="$ARGS --skip-llm"
          fi
          if [ "${{ inputs.dry_run }}" == "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ "${{ inputs.force }}" == "true" ]; then
            ARGS="$ARGS --force"
          fi
          node scripts/audit-non-reviews.js $ARGS

      - name: Run cross-outlet duplicate detection
        if: inputs.audit == 'all' || inputs.audit == 'duplicates' || github.event_name == 'schedule'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          ARGS=""
          if [ "${{ inputs.skip_llm }}" == "true" ]; then
            ARGS="$ARGS --skip-llm"
          fi
          if [ "${{ inputs.dry_run }}" == "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          node scripts/detect-cross-outlet-duplicates.js $ARGS

      - name: Push review-texts to private repo
        if: always()
        uses: ./.github/actions/push-review-texts
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
          message: "audit: Review quality — flag non-reviews and duplicates"

      - name: Commit audit reports
        if: always()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          bash scripts/lib/git-add-existing.sh data/audit/non-review-audit.json data/audit/cross-outlet-duplicates.json

          if git diff --staged --quiet; then
            echo "No audit report changes"
            exit 0
          fi

          # Build summary from audit files
          NR_COUNT=$(node -e "try{const d=require('./data/audit/non-review-audit.json');console.log(d._meta.flagged)}catch{console.log(0)}" 2>/dev/null || echo "?")
          DUP_COUNT=$(node -e "try{const d=require('./data/audit/cross-outlet-duplicates.json');console.log(d._meta?.duplicatesFound||0)}catch{console.log(0)}" 2>/dev/null || echo "?")

          if [ "${{ github.event_name }}" == "schedule" ]; then
            MSG="audit: Weekly review quality audit (${NR_COUNT} non-reviews, ${DUP_COUNT} duplicates)"
          else
            MSG="audit: Review quality audit (${NR_COUNT} non-reviews, ${DUP_COUNT} duplicates)"
          fi

          git commit -m "$MSG

          Co-Authored-By: github-actions[bot] <github-actions[bot]@users.noreply.github.com>"

          bash scripts/lib/push-with-retry.sh

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: 'Review Quality Audit Failed'
          discord_webhook: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}

      - name: Summary
        if: always()
        run: |
          echo "## Review Quality Audit" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f data/audit/non-review-audit.json ]; then
            echo "### Non-Review Detection" >> $GITHUB_STEP_SUMMARY
            node -e "
              const d = require('./data/audit/non-review-audit.json');
              console.log('- **Scanned:** ' + d._meta.totalScanned + ' scored reviews');
              console.log('- **Flagged:** ' + d._meta.flagged);
              if (d._meta.byType) {
                const types = Object.entries(d._meta.byType).map(([t,c]) => t + ': ' + c).join(', ');
                console.log('- **Types:** ' + types);
              }
            " >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "- Non-review audit data unavailable" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi

          if [ -f data/audit/cross-outlet-duplicates.json ]; then
            echo "### Cross-Outlet Duplicate Detection" >> $GITHUB_STEP_SUMMARY
            node -e "
              const d = require('./data/audit/cross-outlet-duplicates.json');
              const m = d._meta || {};
              console.log('- **Reviews scanned:** ' + (m.reviewsScanned || '?'));
              console.log('- **Duplicate pairs:** ' + (m.duplicatesFound || '?'));
              console.log('- **Shows scanned:** ' + (m.showsScanned || '?'));
            " >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "- Duplicate detection data unavailable" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ github.event_name }}" == "schedule" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Trigger:** Scheduled (weekly)" >> $GITHUB_STEP_SUMMARY
          else
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Trigger:** Manual (audit=${{ inputs.audit }})" >> $GITHUB_STEP_SUMMARY
          fi
