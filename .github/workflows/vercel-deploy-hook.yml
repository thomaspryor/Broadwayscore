name: Deploy via Hook

# Simple deploy hook trigger - bypasses CLI upload rate limits
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deploy hook
        run: |
          RESPONSE=$(curl -s -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}")
          echo "Response: $RESPONSE"
          JOB_ID=$(echo "$RESPONSE" | jq -r '.job.id // empty')
          if [ -n "$JOB_ID" ]; then
            echo "Deploy hook triggered successfully. Job ID: $JOB_ID"
          else
            echo "Response did not contain a job ID"
            echo "$RESPONSE" | jq . 2>/dev/null || echo "$RESPONSE"
          fi
