name: Linear Unpark Drain

# BRO-5626: moves technically parked Linear cards (a safe VERIFY, a park reason
# that names no owner hold, key, date, spend or Mac) to Todo so the cloud
# workers pick them up. The Mac drain that used to promote parked cards
# (scripts/linear-drain-parked.js via launchd) stopped on 2026-09-19.
# Selection and limits live in scripts/linear-unpark-drain.js; this only runs
# it. Kill switch: repo variable LINEAR_UNPARK_DRAIN_DISABLED=1.
#
# BRO-6852: the second step sweeps cards that say they need the owner but carry
# no real question (scripts/owner-hold-sweep.js): worker-doable ones are released
# to Todo, owner-only ones are listed. Dry run via the workflow_dispatch input.
# Kill switch: repo variable OWNER_HOLD_SWEEP_DISABLED=1.

on:
  schedule:
    - cron: '23 14 * * *'  # Daily 14:23 UTC, off the round minute
  workflow_dispatch:
    inputs:
      cap:
        description: 'Most cards to move this run'
        required: false
        default: '25'
      sweep_apply:
        description: 'Owner-hold sweep writes (false = dry run only)'
        required: false
        default: 'true'

permissions:
  contents: read

concurrency:
  group: linear-unpark-drain
  cancel-in-progress: false

jobs:
  drain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Move takeable parked cards to Todo
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          LINEAR_UNPARK_DRAIN_DISABLED: ${{ vars.LINEAR_UNPARK_DRAIN_DISABLED }}
          CAP: ${{ inputs.cap || '25' }}
        run: node scripts/linear-unpark-drain.js --apply --cap "$CAP"

      - name: Release owner-worded holds that have no question
        # Runs even when the drain step failed, so one failure does not hide the other.
        if: always()
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          OWNER_HOLD_SWEEP_DISABLED: ${{ vars.OWNER_HOLD_SWEEP_DISABLED }}
          APPLY: ${{ inputs.sweep_apply || 'true' }}
        run: |
          if [ "$APPLY" = "true" ]; then node scripts/owner-hold-sweep.js --apply; else node scripts/owner-hold-sweep.js; fi

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: 'Linear Unpark Drain Failed'
          severity: 'warning'
