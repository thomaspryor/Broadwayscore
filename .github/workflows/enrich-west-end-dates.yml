name: Enrich West End Dates

on:
  schedule:
    # Weekly Monday 7 AM UTC — fix shows with unconfirmed press night sources
    # (todaytix, showscore, unknown). Cut from daily 2026-05-08 to reduce
    # Bright Data SERP spend; manually trigger via workflow_dispatch if a
    # specific WE show needs fast date correction ahead of opening night.
    - cron: '0 7 * * 1'
    # Weekly on Thursdays at 8 AM UTC — full enrichment for newly announced WE shows
    - cron: '0 8 * * 4'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode: enrich (fill missing), verify (compare only), force (overwrite all), fix-unconfirmed (correct todaytix/showscore dates)'
        required: true
        default: 'enrich'
        type: choice
        options:
          - enrich
          - verify
          - force
          - fix-unconfirmed
      show:
        description: 'Optional: specific show slug to process'
        required: false
        type: string

permissions:
  contents: write

jobs:
  enrich-dates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Checkout core data
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run West End date enrichment
        id: enrich
        run: |
          FLAGS=""
          MODE="${{ inputs.mode || '' }}"

          # Auto-detect mode from cron schedule if not manually specified
          if [ -z "$MODE" ] && [ "${{ github.event_name }}" = "schedule" ]; then
            HOUR=$(date -u +%H)
            DOW=$(date -u +%u)  # 1=Mon, 4=Thu
            if [ "$DOW" = "4" ] && [ "$HOUR" = "08" ]; then
              MODE="enrich"
              echo "Thursday 8 AM UTC cron → enrich mode (full enrichment)"
            else
              MODE="fix-unconfirmed"
              echo "Daily 7 AM UTC cron → fix-unconfirmed mode (correct unconfirmed sources)"
            fi
          fi
          MODE="${MODE:-enrich}"

          if [ "$MODE" = "verify" ]; then
            FLAGS="$FLAGS --verify --dry-run"
          elif [ "$MODE" = "force" ]; then
            FLAGS="$FLAGS --force"
          elif [ "$MODE" = "fix-unconfirmed" ]; then
            FLAGS="$FLAGS --fix-unconfirmed"
          fi

          if [ -n "${{ inputs.show }}" ]; then
            FLAGS="$FLAGS --show=${{ inputs.show }}"
          fi

          echo "Running: node scripts/enrich-west-end-dates.js $FLAGS"
          node scripts/enrich-west-end-dates.js $FLAGS

      - name: Check for changes
        if: (inputs.mode || 'enrich') != 'verify'
        id: git-check
        run: |
          git diff --exit-code data/shows.json || echo "changes=true" >> $GITHUB_OUTPUT

      # shows.json is gitignored in the public repo — see note in
      # enrich-ibdb-dates.yml. push-core-data below handles the sync.

      - name: Push core data to private repo
        if: always()
        uses: ./.github/actions/push-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
          message: 'data: Update from enrich-west-end-dates'

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: 'West End Date Enrichment Failed'
          discord_webhook: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
          resend_api_key: ${{ secrets.RESEND_API_KEY }}
          owner_email: ${{ secrets.OWNER_EMAIL }}
