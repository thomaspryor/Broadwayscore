name: Enrich West End Dates

on:
  schedule:
    # Weekly Monday 2 AM UTC — fix shows with unconfirmed press night sources
    # (todaytix, showscore, unknown). Cut from daily 2026-05-08 to reduce
    # Bright Data SERP spend; manually trigger via workflow_dispatch if a
    # specific WE show needs fast date correction ahead of opening night.
    - cron: '0 2 * * 1'
    # Weekly on Thursdays at 2:30 AM UTC — full enrichment for newly announced WE shows
    # BRO-5803: both crons sit in the 01:00-05:00 UTC window, which has no other
    # shows-json-writer member, so 30min-3h cron lag cannot queue them behind
    # update-show-status (08:00) or enrich-off-broadway-dates (Mon 07:15/Thu 08:15).
    - cron: '30 2 * * 4'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode: enrich (fill missing), verify (compare only), force (overwrite all), fix-unconfirmed (correct todaytix/showscore dates)'
        required: true
        default: 'enrich'
        type: choice
        options:
          - enrich
          - verify
          - force
          - fix-unconfirmed
      show:
        description: 'Optional: specific show slug to process'
        required: false
        type: string

permissions:
  contents: write

# Shared shows.json writer group (BRO-5803): enrich-west-end-dates.js
# read-mutate-writes shows.json, same as its sibling enrich-off-broadway-dates.yml.
# GitHub keeps ONE pending run per group; the 02:xx crons keep this out of the
# busy 06:00-16:00 window so it neither evicts nor gets evicted by siblings.
concurrency:
  group: shows-json-writer
  cancel-in-progress: false

jobs:
  enrich-dates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main

      - name: Checkout core data
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run West End date enrichment
        id: enrich
        env:
          INPUT_SHOW: ${{ inputs.show }}
        run: |
          FLAGS=""
          MODE="${{ inputs.mode || '' }}"

          # Auto-detect mode from WHICH cron fired — never from the wall clock.
          # The old check was `date -u +%H` == "08" && `date -u +%u` == 4, but
          # GitHub crons fire 30 min-3 h late: 4 of 5 Thursday runs in the 30 days
          # to 2026-07-30 started 09:00-09:14 UTC and silently downgraded to
          # fix-unconfirmed (run 30529008354 logged "Daily 7 AM UTC cron" on a
          # Thursday). Thursday's `enrich` arm is the ONLY one that fills MISSING
          # West End dates -- fix-unconfirmed merely corrects dates that already
          # exist -- so lateness left 13 null-openingDate WE/OWE shows with no
          # live filler. github.event.schedule is the literal cron string that
          # triggered this run, so it is immune to delay.
          if [ -z "$MODE" ] && [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "${{ github.event.schedule }}" = "30 2 * * 4" ]; then
              MODE="enrich"
              echo "Thursday cron (30 2 * * 4) → enrich mode (full enrichment)"
            else
              MODE="fix-unconfirmed"
              echo "Monday cron (${{ github.event.schedule }}) → fix-unconfirmed mode (correct unconfirmed sources)"
            fi
          fi
          MODE="${MODE:-enrich}"

          if [ "$MODE" = "verify" ]; then
            FLAGS="$FLAGS --verify --dry-run"
          elif [ "$MODE" = "force" ]; then
            FLAGS="$FLAGS --force"
          elif [ "$MODE" = "fix-unconfirmed" ]; then
            FLAGS="$FLAGS --fix-unconfirmed"
          fi

          if [ -n "${INPUT_SHOW}" ]; then
            FLAGS="$FLAGS --show=${INPUT_SHOW}"
          fi

          echo "Running: node scripts/enrich-west-end-dates.js $FLAGS"
          node scripts/enrich-west-end-dates.js $FLAGS

      # Audit trail (BRO-3651): same file and schema as enrich-off-broadway-dates.yml.
      # push-core-data does not carry it, so it is staged and committed explicitly.
      - name: Commit audit trail
        if: always()
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add data/audit/date-enrichment-corrections.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No audit changes to commit"
            exit 0
          fi
          git commit -m "data: enrich-west-end-dates audit trail"
          bash scripts/lib/push-with-retry.sh

      # shows.json is gitignored in the public repo — see note in
      # enrich-ibdb-dates.yml. push-core-data below handles the sync.

      - name: Push core data to private repo
        if: always()
        uses: ./.github/actions/push-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
          message: 'data: Update from enrich-west-end-dates'

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: 'West End Date Enrichment Failed'
          discord_webhook: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
          resend_api_key: ${{ secrets.RESEND_API_KEY }}
          owner_email: ${{ secrets.OWNER_EMAIL }}
