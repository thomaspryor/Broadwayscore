name: Scrape Stagedoor Critics

on:
  schedule:
    # Weekly on Mondays at 6 AM UTC (1 AM EST), after WE show status updates
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      show:
        description: 'Single show ID to scrape (e.g., hadestown-west-end-2024)'
        required: false
        type: string
      dry_run:
        description: 'Dry run (no writes)'
        required: false
        type: boolean
        default: false
      limit:
        description: 'Max shows to process'
        required: false
        type: number
        default: 0

concurrency:
  group: stagedoor-scrape
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape-stagedoor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout core data
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}

      - name: Checkout review-texts (private repo)
        uses: ./.github/actions/checkout-review-texts
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Stagedoor scraper
        env:
          BROWSERBASE_API_KEY: ${{ secrets.BROWSERBASE_API_KEY }}
          BROWSERBASE_PROJECT_ID: ${{ secrets.BROWSERBASE_PROJECT_ID }}
        run: |
          ARGS=""

          if [ -n "${{ inputs.show }}" ]; then
            ARGS="$ARGS --show=${{ inputs.show }}"
          fi

          if [ "${{ inputs.limit }}" != "0" ] && [ -n "${{ inputs.limit }}" ]; then
            ARGS="$ARGS --limit=${{ inputs.limit }}"
          fi

          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi

          # shellcheck disable=SC2086
          node scripts/scrape-stagedoor-critics.js $ARGS

      - name: Run extraction
        if: always() && inputs.dry_run != true
        run: node scripts/extract-stagedoor-reviews.js

      - name: Commit archives
        if: always() && inputs.dry_run != true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/aggregator-archive/stagedoor/
          git diff --staged --quiet && echo "No archive changes" && exit 0
          git commit -m "data: Update Stagedoor critic archives"
          bash scripts/lib/push-with-retry.sh 5 main

      - name: Push review-texts to private repo
        if: always() && inputs.dry_run != true
        uses: ./.github/actions/push-review-texts
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
          message: 'data: Update from scrape-stagedoor'

      - name: Trigger rebuild
        if: always() && inputs.dry_run != true
        run: |
          gh workflow run "Rebuild Reviews Data" -f reason="Post Stagedoor scrape" || echo "Rebuild dispatch failed"
        env:
          GH_TOKEN: ${{ secrets.REVIEW_TEXTS_TOKEN }}

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: 'Scrape Stagedoor Critics Failed'
          discord_webhook: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
          resend_api_key: ${{ secrets.RESEND_API_KEY }}
          owner_email: ${{ secrets.OWNER_EMAIL }}
