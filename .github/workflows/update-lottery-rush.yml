name: Update Lottery/Rush Data

on:
  schedule:
    # Run every Monday at 10 AM UTC (5 AM EST)
    - cron: '0 10 * * 1'
  workflow_dispatch: # Allow manual trigger

jobs:
  update-lottery-rush:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}


      - name: Checkout core data
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Scrape lottery/rush data
        run: node scripts/scrape-lottery-rush.js --verbose
        env:
          SCRAPINGBEE_API_KEY: ${{ secrets.SCRAPINGBEE_API_KEY }}
          BRIGHTDATA_TOKEN: ${{ secrets.BRIGHTDATA_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Check for changes
        id: check_changes
        run: |
          if [[ -n $(git status --porcelain data/lottery-rush.json data/shows.json) ]]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Changes detected in lottery/rush data"
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No changes detected"
          fi

      - name: Commit and push changes
        if: always() && steps.check_changes.outputs.has_changes == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/lottery-rush.json
          git commit -m "chore: Update lottery/rush data from BwayRush + Playbill

          Automated weekly update of Broadway lottery and rush ticket policies.

          Co-Authored-By: GitHub Action <action@github.com>"
          # Retry push with rebase in case remote has new commits
          pushed=false
          for i in 1 2 3 4 5; do
            if git push origin main; then
              echo "Push succeeded on attempt $i"
              break
            fi
            echo "Push failed (attempt $i), pulling and rebasing..."
            echo "--- Unstaged files before cleanup ---"
            git status --porcelain 2>/dev/null || true
            git checkout -- . 2>/dev/null || true
            git clean -fd 2>/dev/null || true
            if git pull --rebase -X theirs origin main; then
              echo "Rebase succeeded, retrying push..."
            else
              echo "Rebase failed, aborting..."
              git rebase --abort 2>/dev/null || true
            fi
            sleep $((10 + RANDOM % 20))
          done
          if [ "$pushed" != "true" ]; then
            echo "::warning::All push attempts failed"
          fi


      - name: Push core data to private repo
        if: always()
        uses: ./.github/actions/push-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
          message: 'data: Update from update-lottery-rush'
      - name: Summary
        run: |
          echo "## Lottery/Rush Update Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ steps.check_changes.outputs.has_changes }}" == "true" ]]; then
            echo "Updated lottery/rush data and synced tags" >> $GITHUB_STEP_SUMMARY
          else
            echo "No changes detected - data is already up to date" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Sources: BwayRush.com + Playbill" >> $GITHUB_STEP_SUMMARY
