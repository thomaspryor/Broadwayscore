name: Update Lottery/Rush Data

on:
  schedule:
    # Run Monday + Thursday at 10 AM UTC (5 AM EST)
    # Twice-weekly catches mid-week policy changes (new shows launch Tue-Wed)
    - cron: '0 10 * * 1,4'
  workflow_dispatch: # Allow manual trigger

jobs:
  update-lottery-rush:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}


      - name: Checkout core data
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Scrape lottery/rush data
        run: node scripts/scrape-lottery-rush.js --verbose
        env:
          SCRAPINGBEE_API_KEY: ${{ secrets.SCRAPINGBEE_API_KEY }}
          BRIGHTDATA_TOKEN: ${{ secrets.BRIGHTDATA_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Check for changes
        id: check_changes
        run: |
          if [[ -n $(git status --porcelain data/lottery-rush.json data/shows.json data/show-schedules.json) ]]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Changes detected in lottery/rush data"
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No changes detected"
          fi

      - name: Commit and push changes
        if: always() && steps.check_changes.outputs.has_changes == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/lottery-rush.json data/show-schedules.json
          git commit -m "chore: Update lottery/rush + schedule data from BwayRush + Playbill

          Automated weekly update of Broadway lottery/rush policies and showtimes.

          Co-Authored-By: GitHub Action <action@github.com>"
          bash scripts/lib/push-with-retry.sh


      - name: Push core data to private repo
        if: always()
        uses: ./.github/actions/push-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
          message: 'data: Update from update-lottery-rush'

      - name: Dispatch deploy
        if: always()
        uses: ./.github/actions/dispatch-deploy

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: 'Update Lottery/Rush Failed'
          discord_webhook: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
          resend_api_key: ${{ secrets.RESEND_API_KEY }}
          owner_email: ${{ secrets.OWNER_EMAIL }}

      - name: Summary
        run: |
          echo "## Lottery/Rush Update Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ steps.check_changes.outputs.has_changes }}" == "true" ]]; then
            echo "Updated lottery/rush data and synced tags" >> $GITHUB_STEP_SUMMARY
          else
            echo "No changes detected - data is already up to date" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Sources: BwayRush.com + Playbill" >> $GITHUB_STEP_SUMMARY
