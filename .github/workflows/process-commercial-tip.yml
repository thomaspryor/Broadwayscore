name: Process Commercial Tip

on:
  issues:
    types: [opened]

# Per-issue group (BRO-3500 what-else follow-up — same "issue-triggered
# auto-processor" shape as process-review-submission.yml/
# auto-fix-feedback-bug.yml, found while fixing those). Not in BRO-3500's
# original scope (writes commercial.json, not review-texts) but had zero
# concurrency group at all — a strict improvement with no regression risk,
# since there was nothing to preserve. Different issues never collide.
concurrency:
  group: process-commercial-tip-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: read
  issues: write

jobs:
  process-tip:
    if: contains(github.event.issue.labels.*.name, 'commercial-tip')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}


      - name: Checkout core data
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Process tip
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: node scripts/process-commercial-tip.js

      - name: Commit and push (if changes made)
        if: always()
        env:
          # commercial-pending-review.json is a union-merged managed file
          # (other workflows add rows concurrently), so a rebase conflict is
          # reconciled instead of failing — see push-with-retry.sh.
          PUSH_RECONCILE_MERGED_JSON: '1'
        run: |
          # BRO-6398: tips queue in the pending-review file (human-released);
          # commercial.json is never written here.
          git add data/commercial-pending-review.json
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "data: Process commercial tip from issue #${{ github.event.issue.number }}

            Co-Authored-By: github-actions[bot] <github-actions[bot]@users.noreply.github.com>"

            bash scripts/lib/push-with-retry.sh 3
          fi


      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: 'Process Commercial Tip Failed'
          discord_webhook: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
          resend_api_key: ${{ secrets.RESEND_API_KEY }}
          owner_email: ${{ secrets.OWNER_EMAIL }}
