name: Daily Gmail Ingest

# Two independent jobs that both read the owner's Gmail with the same
# read-only OAuth credentials, on the same daily schedule:
#
#   ingest — Phase D of the finance tracker (vendor receipts -> expense ledger)
#   dmarc  — DMARC aggregate reports -> deliverability verdict (BRO-525)
#
# They share a workflow rather than getting one each because the alternative is
# a second copy of the OAuth wiring and the googleapis install, plus another
# scheduled workflow for GitHub to auto-disable after ~60 days of repo
# inactivity. They are separate JOBS, not steps, so a Gmail hiccup in one does
# not mask or block the other.
#
# ---- finance (job: ingest) ----
# Phase D of the finance tracker: pull vendor receipt emails from Gmail
# (read-only OAuth), book them into the expense ledger, and sync the ledgers
# to the PRIVATE data repo (amounts + billing PII never touch this repo —
# CLAUDE.md §3/§11). The /admin/finances dashboard reads those ledger files
# at request time via the GitHub contents API.
#
# Idempotent by Gmail message id + dedup hash, so daily re-runs and manual
# dispatches never double-book. Exclusion rules (finance-vendors.json
# externallyPaid) and same-month topup reclassification are re-applied to the
# whole ledger on every run, so config edits propagate retroactively.
#
# NOT in the scraping-token gate's scope: this workflow calls the Gmail API
# with OAuth, no page scraping, no SCRAPINGBEE/BRIGHTDATA.

on:
  schedule:
    - cron: '17 11 * * *' # daily, offset from top-of-hour cron congestion
  workflow_dispatch:
    inputs:
      backfill:
        description: 'Full 400-day historical backfill (first run / recovery)'
        type: boolean
        default: false

concurrency:
  group: finance-ingest
  cancel-in-progress: false

# Workflow default stays read-only; only the dmarc job is granted write (see
# its own permissions: block). Granting write at the workflow level would have
# handed the pre-existing finance job — which installs an ad-hoc npm dependency
# and needs no write access at all — a token it never had before.
permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      # ingest-finances.js lazy-requires googleapis only on the Gmail path, so
      # it isn't a package.json dependency (keeps the main install lean for the
      # 60+ other workflows). Installed ad hoc here.
      - name: Install googleapis
        run: npm install --no-save --no-audit --no-fund googleapis

      - name: Clone finance ledgers (private repo)
        env:
          TOKEN: ${{ secrets.REVIEW_TEXTS_TOKEN }}
        run: |
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/thomaspryor/broadway-scorecard-data.git" /tmp/finance-data
          mkdir -p /tmp/finance-data/data/finances

      - name: Ingest receipts from Gmail
        env:
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          BACKFILL: ${{ inputs.backfill }}
        run: |
          FLAGS=""
          if [ "$BACKFILL" = "true" ]; then FLAGS="--backfill"; fi
          node scripts/ingest-finances.js $FLAGS --out=/tmp/finance-data/data/finances

      # Book affiliate commission into the revenue ledger (same module as
      # /admin/affiliate). continue-on-error: an Impact/Partnerize flake must
      # not block the expense ingest; the script itself refuses to write
      # partial data, and the next daily run self-heals.
      - name: Accrue affiliate revenue
        continue-on-error: true
        env:
          IMPACT_ACCOUNT_SID: ${{ secrets.IMPACT_ACCOUNT_SID }}
          IMPACT_AUTH_TOKEN: ${{ secrets.IMPACT_AUTH_TOKEN }}
          PARTNERIZE_APP_KEY: ${{ secrets.PARTNERIZE_APP_KEY }}
          PARTNERIZE_API_KEY: ${{ secrets.PARTNERIZE_API_KEY }}
          PARTNERIZE_PUBLISHER_ID: ${{ secrets.PARTNERIZE_PUBLISHER_ID }}
          POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
          POSTHOG_PROJECT_ID: ${{ secrets.POSTHOG_PROJECT_ID }}
        run: node scripts/accrue-revenue.js --out=/tmp/finance-data/data/finances

      # hygiene-push-ok: pushes to the external private-repo checkout in /tmp —
      # push-with-retry.sh targets the main workspace checkout and can't be reused here.
      - name: Commit and push ledgers
        run: |
          cd /tmp/finance-data
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add data/finances
          if git diff --staged --quiet; then
            echo "No ledger changes."
            exit 0
          fi
          git commit -m "finance: receipt ingest ($(date -u +%Y-%m-%d))"
          for i in 1 2 3; do
            if git push; then break; fi
            if [ "$i" = "3" ]; then echo "::error::push failed after 3 attempts"; exit 1; fi
            sleep $((i * 2))
            # -X theirs favors OUR commit's ledger on conflict (same policy as
            # push-with-retry.sh); shallow clone is fine for a fast-forward pull.
            git pull --rebase -X theirs
          done

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: 'Finance Ingest Failed'
          description: 'Daily Gmail receipt ingest did not complete. Likely causes: revoked GMAIL_REFRESH_TOKEN (re-mint via OAuth Playground), REVIEW_TEXTS_TOKEN expiry, or a private-repo push conflict.'

  # ---- DMARC aggregate reports (BRO-525) ----
  # Google, Microsoft and Zoho send a report a day for broadwayscorecard.com to
  # the rua= address in the DMARC record. This job reads them and turns them
  # into a verdict, so that domain spoofing surfaces as an alert instead of as
  # an unopened attachment (233 had arrived unread before this existed).
  dmarc:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Job-scoped: this job commits data/audit/ back to this repo; the finance
    # job above stays read-only.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      # Same lazy-require pattern as the finance job above: googleapis is not a
      # package.json dependency (keeps the install lean for the 60+ other
      # workflows), so it is installed ad hoc here.
      - name: Install googleapis
        run: npm install --no-save --no-audit --no-fund googleapis

      # --days=7 is deliberately short: reporters send daily, and the lifetime
      # record lives in data/audit/dmarc-report-ledger.jsonl, so a week of
      # overlap is all the redundancy the ingest needs. --backfill (400 days)
      # is for seeding the ledger on the first run or after a gap.
      #
      # The ingest calls routeAlert(...) for action-severity findings — the
      # literal name is here so scripts/lib/alert-ledger-commit-check.js can
      # see that this job routes alerts and therefore must commit the alert
      # ledger below (that gate greps the YAML for `routeAlert(`).
      - name: Ingest DMARC reports
        env:
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
          BACKFILL: ${{ inputs.backfill }}
        run: |
          FLAGS="--days=7"
          if [ "$BACKFILL" = "true" ]; then FLAGS="--backfill"; fi
          node scripts/ingest-dmarc-reports.js $FLAGS --alert

      - name: Commit and push DMARC audit state
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # The alert ledger and digest queue are part of this job's output:
          # routeAlert writes cooldown state there, and leaving them
          # uncommitted would re-queue the same digest line every single day.
          # Guarded per-file (same shape as audit-aggregator-gap.yml): an
          # unguarded `git add` on a path that is ever absent exits 1 and
          # would drop the DMARC state this run just computed.
          for f in data/audit/dmarc-summary.json \
                   data/audit/dmarc-report-ledger.jsonl \
                   data/audit/alert-ledger.json \
                   data/audit/alert-digest-queue.json; do
            [ -e "$f" ] && git add "$f" || echo "skip (absent): $f"
          done

          if git diff --staged --quiet; then
            echo "No DMARC state changes."
            exit 0
          fi

          SUMMARY=$(node -e "
            try {
              const s = require('./data/audit/dmarc-summary.json');
              const l = s.lifetime || {};
              console.log(\`\${l.messages || 0} msgs, \${l.failures || 0} failures, \${(s.findings || []).length} finding(s)\`);
            } catch { console.log('summary unavailable'); }
          ")

          git commit -m "audit: DMARC aggregate report ingest ($SUMMARY)

          Co-Authored-By: github-actions[bot] <github-actions[bot]@users.noreply.github.com>"

          bash scripts/lib/push-with-retry.sh

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: 'DMARC Ingest Failed'
          description: 'Daily DMARC aggregate report ingest did not complete. Likely causes: revoked GMAIL_REFRESH_TOKEN (re-mint via OAuth Playground), a malformed report attachment, or a push conflict on data/audit/.'
