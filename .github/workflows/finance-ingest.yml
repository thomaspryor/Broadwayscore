name: Daily Gmail Ingest

# Two independent jobs that both read the owner's Gmail with the same
# read-only OAuth credentials, on the same daily schedule:
#
#   ingest — Phase D of the finance tracker (vendor receipts -> expense ledger)
#   dmarc  — DMARC aggregate reports -> deliverability verdict (BRO-525)
#
# They share a workflow rather than getting one each because the alternative is
# a second copy of the OAuth wiring and the googleapis install, plus another
# scheduled workflow for GitHub to auto-disable after ~60 days of repo
# inactivity. They are separate JOBS, not steps, so a Gmail hiccup in one does
# not mask or block the other.
#
# ---- finance (job: ingest) ----
# Phase D of the finance tracker: pull vendor receipt emails from Gmail
# (read-only OAuth), book them into the expense ledger, and sync the ledgers
# to the PRIVATE data repo (amounts + billing PII never touch this repo —
# CLAUDE.md §3/§11). The /admin/finances dashboard reads those ledger files
# at request time via the GitHub contents API.
#
# Idempotent by Gmail message id + dedup hash, so daily re-runs and manual
# dispatches never double-book. Exclusion rules (finance-vendors.json
# externallyPaid) and same-month topup reclassification are re-applied to the
# whole ledger on every run, so config edits propagate retroactively.
#
# NOT in the scraping-token gate's scope: this workflow calls the Gmail API
# with OAuth, no page scraping, no SCRAPINGBEE/BRIGHTDATA.

on:
  schedule:
    - cron: '17 11 * * *' # daily, offset from top-of-hour cron congestion
  workflow_dispatch:
    inputs:
      backfill:
        description: 'Full 400-day historical backfill (first run / recovery)'
        type: boolean
        default: false
      newsletters:
        description: 'Theater newsletter reader (BRO-6214): off, dry-run (list issues and facts, send nothing) or live (route a review card). Scheduled runs go live on Mondays.'
        type: choice
        options: [off, dry-run, live]
        default: off

concurrency:
  group: finance-ingest
  cancel-in-progress: false
  # concurrency-queue-ok: each run ingests everything new since the last success, so the newest pending run covers any it evicts

# Workflow default stays read-only; only the dmarc job is granted write (see
# its own permissions: block). Granting write at the workflow level would have
# handed the pre-existing finance job — which installs an ad-hoc npm dependency
# and needs no write access at all — a token it never had before.
permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'

      # ingest-finances.js lazy-requires googleapis only on the Gmail path, so
      # it isn't a package.json dependency (keeps the main install lean for the
      # 60+ other workflows). Installed ad hoc here.
      - name: Install googleapis
        run: npm install --no-save --no-audit --no-fund googleapis

      - name: Clone finance ledgers (private repo)
        env:
          TOKEN: ${{ secrets.REVIEW_TEXTS_TOKEN }}
        run: |
          # BRO-5972: git_net caps the clone (~6-24s normally, 150s like
          # checkout-core-data) so a hung transfer fails fast.
          . "${GITHUB_WORKSPACE}/scripts/lib/git-net-timeout.sh" 2>/dev/null || git_net() { shift; git "$@"; }
          git_net 150 clone --depth 1 "https://x-access-token:${TOKEN}@github.com/thomaspryor/broadway-scorecard-data.git" /tmp/finance-data
          mkdir -p /tmp/finance-data/data/finances

      - name: Ingest receipts from Gmail
        env:
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          BACKFILL: ${{ inputs.backfill }}
        run: |
          FLAGS=""
          if [ "$BACKFILL" = "true" ]; then FLAGS="--backfill"; fi
          node scripts/ingest-finances.js $FLAGS --out=/tmp/finance-data/data/finances

      # Book affiliate commission into the revenue ledger (same module as
      # /admin/affiliate). continue-on-error: an Impact/Partnerize flake must
      # not block the expense ingest; the script itself refuses to write
      # partial data, and the next daily run self-heals.
      - name: Accrue affiliate revenue
        continue-on-error: true
        env:
          IMPACT_ACCOUNT_SID: ${{ secrets.IMPACT_ACCOUNT_SID }}
          IMPACT_AUTH_TOKEN: ${{ secrets.IMPACT_AUTH_TOKEN }}
          PARTNERIZE_APP_KEY: ${{ secrets.PARTNERIZE_APP_KEY }}
          PARTNERIZE_API_KEY: ${{ secrets.PARTNERIZE_API_KEY }}
          PARTNERIZE_PUBLISHER_ID: ${{ secrets.PARTNERIZE_PUBLISHER_ID }}
          POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
          POSTHOG_PROJECT_ID: ${{ secrets.POSTHOG_PROJECT_ID }}
        run: node scripts/accrue-revenue.js --out=/tmp/finance-data/data/finances

      # hygiene-push-ok: pushes to the external private-repo checkout in /tmp —
      # push-with-retry.sh targets the main workspace checkout and can't be reused here.
      - name: Commit and push ledgers
        run: |
          # BRO-6029: git_net caps each fetch/pull/push so a hung transfer fails that attempt instead of waiting for the job timeout.
          . "${GITHUB_WORKSPACE}/scripts/lib/git-net-timeout.sh" 2>/dev/null || git_net() { shift; git "$@"; }
          cd /tmp/finance-data
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add data/finances
          if git diff --staged --quiet; then
            echo "No ledger changes."
            exit 0
          fi
          git commit -m "finance: receipt ingest ($(date -u +%Y-%m-%d))"
          for i in 1 2 3; do
            if git_net 180 push; then break; fi
            if [ "$i" = "3" ]; then echo "::error::push failed after 3 attempts"; exit 1; fi
            sleep $((i * 2))
            # -X theirs favors OUR commit's ledger on conflict (same policy as
            # push-with-retry.sh); shallow clone is fine for a fast-forward pull.
            git_net 300 -c "merge.ours.driver=bash '$GITHUB_WORKSPACE/scripts/lib/merge-keep-run.sh' B %O %A %B %P" pull --rebase -X theirs
          done

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: 'Finance Ingest Failed'
          description: 'Daily Gmail receipt ingest did not complete. Likely causes: revoked GMAIL_REFRESH_TOKEN (the renew-gmail job then mints the owner a one-tap renewal link, BRO-3712), REVIEW_TEXTS_TOKEN expiry, or a private-repo push conflict.'

  # ---- DMARC aggregate reports (BRO-525) ----
  # Google, Microsoft and Zoho send a report a day for broadwayscorecard.com to
  # the rua= address in the DMARC record. This job reads them and turns them
  # into a verdict, so that domain spoofing surfaces as an alert instead of as
  # an unopened attachment (233 had arrived unread before this existed).
  dmarc:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Job-scoped: this job commits data/audit/ back to this repo; the finance
    # job above stays read-only.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'

      # Same lazy-require pattern as the finance job above: googleapis is not a
      # package.json dependency (keeps the install lean for the 60+ other
      # workflows), so it is installed ad hoc here.
      - name: Install googleapis
        run: npm install --no-save --no-audit --no-fund googleapis

      # --days=7 is deliberately short: reporters send daily, and the lifetime
      # record lives in data/audit/dmarc-report-ledger.jsonl, so a week of
      # overlap is all the redundancy the ingest needs. --backfill (400 days)
      # is for seeding the ledger on the first run or after a gap.
      #
      # The ingest calls routeAlert(...) for action-severity findings.
      # scripts/lib/alert-ledger-commit-check.js sees this via BRO-3671's
      # require-graph resolution (ingest-dmarc-reports.js directly requires
      # owner-alert-router.js) — no literal YAML mention is needed for
      # detection anymore, but the ledger below must still be committed.
      - name: Ingest DMARC reports
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
          BACKFILL: ${{ inputs.backfill }}
        run: |
          FLAGS="--days=7"
          if [ "$BACKFILL" = "true" ]; then FLAGS="--backfill"; fi
          node scripts/ingest-dmarc-reports.js $FLAGS --alert

      - name: Commit and push DMARC audit state
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # The alert ledger and digest queue are part of this job's output:
          # routeAlert writes cooldown state there, and leaving them
          # uncommitted would re-queue the same digest line every single day.
          # git-add-existing.sh stages each path independently: a plain
          # `git add A B C` is atomic on pathspec-match failure, so one absent
          # file (a first run, a run that routed no alert) would stage NONE of
          # them and silently drop the DMARC state this run just computed.
          #
          # Kept on ONE line per invocation on purpose: the alert-ledger guard
          # (scripts/lint-workflow-guards.sh alert-ledger-commit) matches the
          # staging command and the filename on the SAME line, so splitting
          # these across backslash continuations reads to it as "never staged".
          bash scripts/lib/git-add-existing.sh data/audit/dmarc-summary.json data/audit/dmarc-report-ledger.jsonl
          bash scripts/lib/git-add-existing.sh data/audit/alert-ledger.json data/audit/alert-digest-queue.json data/audit/alert-router-attempts.jsonl

          if git diff --staged --quiet; then
            echo "No DMARC state changes."
            exit 0
          fi

          SUMMARY=$(node -e "
            try {
              const s = require('./data/audit/dmarc-summary.json');
              const l = s.lifetime || {};
              console.log(\`\${l.messages || 0} msgs, \${l.failures || 0} failures, \${(s.findings || []).length} finding(s)\`);
            } catch { console.log('summary unavailable'); }
          ")

          git commit -m "audit: DMARC aggregate report ingest ($SUMMARY)

          Co-Authored-By: github-actions[bot] <github-actions[bot]@users.noreply.github.com>"

          bash scripts/lib/push-with-retry.sh

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: 'DMARC Ingest Failed'
          severity: 'warning'
          description: 'Daily DMARC aggregate report ingest did not complete. Likely causes: revoked GMAIL_REFRESH_TOKEN (the renew-gmail job then mints the owner a one-tap renewal link, BRO-3712), a malformed report attachment, an alert-routing failure, or a push conflict on data/audit/.'

  # BRO-6214: weekly reader for three theater newsletters. Same Gmail secrets
  # and the same shared-workflow rationale as the jobs above. It reads ONLY
  # the Broadway Briefing sender in Gmail plus the public Chromolume blog and
  # Abroad/Way RSS (BRO-6265, scripts/lib/newsletter-sources.js), stores no
  # email content, and writes nothing to commercial data: new or conflicting
  # Broadway business facts go to a person as one routeAlert card. The state
  # file data/audit/newsletter-reader-state.json holds only already-read URLs
  # and skip counters. The daily
  # cron runs this job but the first step only lets it continue on Mondays
  # (or on a manual dispatch that asks for it), so GitHub's 60-day
  # auto-disable never sees a separate quiet workflow.
  #
  # The ingest calls routeAlert(...) (scripts/read-theater-newsletters.js
  # requires owner-alert-router.js), so the alert ledger is committed below.
  newsletters:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Decide whether to run
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          MODE: ${{ inputs.newsletters }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            if [ "$MODE" = "dry-run" ] || [ "$MODE" = "live" ]; then echo "mode=$MODE" >> "$GITHUB_OUTPUT"; else echo "mode=off" >> "$GITHUB_OUTPUT"; fi
          elif [ "$(date -u +%u)" = "1" ]; then
            echo "mode=live" >> "$GITHUB_OUTPUT"
          else
            echo "mode=off" >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.gate.outputs.mode != 'off'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Checkout core data
        if: steps.gate.outputs.mode != 'off'
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}

      - name: Setup Node.js
        if: steps.gate.outputs.mode != 'off'
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'

      - name: Install googleapis
        if: steps.gate.outputs.mode != 'off'
        run: npm install --no-save --no-audit --no-fund googleapis

      - name: Read theater newsletters
        if: steps.gate.outputs.mode != 'off'
        env:
          MODE: ${{ steps.gate.outputs.mode }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
        run: |
          FLAGS=""
          if [ "$MODE" = "dry-run" ]; then FLAGS="--dry-run"; fi
          node scripts/read-theater-newsletters.js $FLAGS

      - name: Commit and push alert state
        if: ${{ always() && steps.gate.outputs.mode == 'live' }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          # Kept on ONE line per invocation: the alert-ledger guard
          # (scripts/lint-workflow-guards.sh alert-ledger-commit) matches the
          # staging command and the filename on the SAME line.
          bash scripts/lib/git-add-existing.sh data/audit/alert-ledger.json data/audit/alert-digest-queue.json data/audit/alert-router-attempts.jsonl data/audit/newsletter-reader-state.json
          if git diff --staged --quiet; then
            echo "No alert state changes."
            exit 0
          fi
          git commit -m "audit: theater newsletter reader alert state

          Co-Authored-By: github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
          bash scripts/lib/push-with-retry.sh

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: 'Theater Newsletter Reader Failed'
          severity: 'warning'
          description: 'The weekly theater newsletter reader did not complete. Likely causes: revoked GMAIL_REFRESH_TOKEN (the renew-gmail job handles that), an ANTHROPIC_API_KEY problem, or a push conflict on data/audit/.'

  # BRO-3712: when either job fails, ask Google whether the saved token is
  # revoked. Only then (exit 3) start gmail-reauth.yml, which puts a one-tap
  # renewal link on the card and so in the owner's decisions email. A Gmail
  # outage or a bad attachment never asks the owner for anything.
  renew-gmail:
    needs: [ingest, dmarc, newsletters]
    if: ${{ always() && (needs.ingest.result == 'failure' || needs.dmarc.result == 'failure' || needs.newsletters.result == 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write # dispatch gmail-reauth.yml
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'

      - name: Check the Gmail token
        id: token
        env:
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        run: |
          rc=0
          node scripts/gmail-reauth.js token-status || rc=$?
          echo "revoked=$([ "$rc" -eq 3 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Send the owner a renewal link
        if: ${{ steps.token.outputs.revoked == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run gmail-reauth.yml --repo "$GITHUB_REPOSITORY" --ref main -f mode=link -f issue=BRO-3712

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: 'Gmail Renewal Trigger Failed'
          severity: 'warning'
          description: 'finance-ingest.yml could not check the Gmail token or start gmail-reauth.yml (BRO-3712).'
