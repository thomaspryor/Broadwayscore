name: Check Closing Dates

on:
  schedule:
    # Run every Monday at 10am UTC (5am ET) to catch weekend announcements
    - cron: '0 10 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no changes)'
        required: false
        default: 'false'

jobs:
  check-closing-dates:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout core data
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check for closing date changes
        env:
          BRIGHTDATA_TOKEN: ${{ secrets.BRIGHTDATA_TOKEN }}
          BRIGHTDATA_ZONE: ${{ secrets.BRIGHTDATA_ZONE }}
          SCRAPINGBEE_API_KEY: ${{ secrets.SCRAPINGBEE_API_KEY }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            node scripts/check-closing-dates.js --dry-run
          else
            node scripts/check-closing-dates.js
          fi

      # shows.json is gitignored in the public repo — see note in
      # enrich-ibdb-dates.yml. push-core-data below handles the sync.


      - name: Push core data to private repo
        if: always()
        uses: ./.github/actions/push-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
          message: 'data: Update from check-closing-dates'

      - name: Dispatch deploy
        if: always()
        uses: ./.github/actions/dispatch-deploy

      - name: Create summary
        if: always()
        run: |
          echo "## Closing Dates Check Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Date:** $(date -u +'%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
          echo "**Mode:** ${{ github.event.inputs.dry_run == 'true' && 'DRY RUN' || 'LIVE' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Changes (if any) synced to private repo via push-core-data." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Manual Check Sources" >> $GITHUB_STEP_SUMMARY
          echo "- [Broadway.org Shows](https://www.broadway.org/shows/)" >> $GITHUB_STEP_SUMMARY
          echo "- [Playbill Broadway](https://www.playbill.com/grosses)" >> $GITHUB_STEP_SUMMARY
          echo "- [BroadwayWorld News](https://www.broadwayworld.com/)" >> $GITHUB_STEP_SUMMARY

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: 'Check Closing Dates Failed'
          discord_webhook: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
