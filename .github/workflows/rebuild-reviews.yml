# Rebuild reviews.json from review-texts source files
# This is the PRIMARY sync mechanism - runs daily and can be triggered manually
name: Rebuild Reviews Data

# Only one rebuild at a time — prevents race conditions where concurrent rebuilds
# overwrite each other (e.g., scoring shards + collection triggering simultaneously).
# With cancel-in-progress: false, a second trigger queues rather than cancelling.
# GitHub keeps at most 1 pending run, so rapid-fire triggers naturally debounce.
concurrency:
  group: rebuild-reviews
  cancel-in-progress: false

on:
  schedule:
    # Daily at 4 AM UTC (11 PM EST) - safety net if workflow_run misses
    - cron: '0 4 * * *'
  workflow_run:
    workflows: ["Collect Review Texts"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual rebuild (for commit message)'
        required: false
        default: 'Manual sync'
        type: string
      force_write:
        description: 'Override regression guard (true/false)'
        required: false
        default: 'false'
        type: string
      skip_enrichment:
        description: 'Skip slow enrichment steps (backfill critics, classify wrong-production, etc.) — use for corrections'
        required: false
        default: 'false'
        type: string

permissions:
  contents: write
  actions: write

jobs:
  rebuild:
    name: Rebuild reviews.json
    # For workflow_run triggers, only run if collection succeeded
    if: >-
      github.event_name != 'workflow_run'
      || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}



      - name: Checkout core data
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
      - name: Checkout review-texts (private repo)
        uses: ./.github/actions/checkout-review-texts
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
      - uses: ./.github/actions/setup-node

      - name: Get current review count
        id: before
        run: |
          if [ -f data/reviews.json ]; then
            COUNT=$(node -e "console.log(require('./data/reviews.json').reviews.length)")
            echo "count=$COUNT" >> $GITHUB_OUTPUT
          else
            echo "count=0" >> $GITHUB_OUTPUT
          fi

      # NOTE: Pull-quote extraction (`scripts/extract-pull-quotes.js`) was previously HERE
      # (pre step-19 rebuild). It is an LLM enrichment step (~0.3 reviews/sec via Gemini)
      # whose output is display-only metadata (`llmPullQuote`), NOT a scoring input. When
      # the per-step or job-level deadline fired, the cancellation killed the rebuild
      # before step 19 could run, so reviews.json went stale for hours. Moved AFTER step 19
      # (Rebuild reviews.json) so cancellation cannot block the canonical rebuild output.
      # Notion: 351637c5-416f-8177. Stuart King email 2026-04-27 surfaced the impact.

      # ---- Pre-rebuild utility steps ----
      # The 4 LLM/scraper enrichment steps that previously lived here
      # (classify-non-reviews, classify-wrong-production, classify-wrong-show,
      # backfill-unknown-critics --critics-only) MOVED OUT to enrich-reviews.yml.
      # They were running for 20-40min combined and made the rebuild job a
      # cancellation magnet — when the job got cancelled, step 18 Rebuild
      # reviews.json was skipped and reviews.json went stale. See Notion
      # 351637c5-416f-8177 for the architectural rationale.
      #
      # The fast utility steps below STAY pre-rebuild because:
      # - flag-wrong-production-by-date: deterministic flag-setter, ~5s
      # - audit-pre2005-reviews: writes data/audit/wrong-production-flags.json
      #   which classify-wrong-production.js (now in enrich-reviews.yml) reads.
      #   Keeping it here keeps the audit fresh for the enrichment workflow.
      # - backfill-unknown-outlets: local-only, no network, ~5s
      # - cleanup-phantom-outlets, strip-stale-single-model-scores,
      #   detect-syndicated-duplicates, apply-audit-flags: utility steps,
      #   each <30s, shape data the rebuild reads.

      - name: Flag wrong-production reviews by date window
        if: inputs.skip_enrichment != 'true'
        run: node scripts/flag-wrong-production-by-date.js --apply 2>&1 | tee -a /tmp/locked-skip.log
        continue-on-error: true

      - name: Audit pre-2005 wrong-production reviews
        if: inputs.skip_enrichment != 'true'
        run: node scripts/audit-pre2005-reviews.js 2>&1 | tee -a /tmp/locked-skip.log
        continue-on-error: true

      - name: Backfill unknown outlets (local, free)
        if: inputs.skip_enrichment != 'true'
        run: node scripts/backfill-unknown-critics.js --outlets-only 2>&1 | tee -a /tmp/locked-skip.log
        continue-on-error: true

      - name: Cleanup phantom outlet duplicates
        if: inputs.skip_enrichment != 'true'
        run: node scripts/cleanup-phantom-outlets.js --apply 2>&1 | tee -a /tmp/locked-skip.log
        continue-on-error: true

      - name: Strip stale single-model scores from flagged reviews
        if: inputs.skip_enrichment != 'true'
        run: node scripts/strip-stale-single-model-scores.js --apply 2>&1 | tee -a /tmp/locked-skip.log
        continue-on-error: true

      - name: Detect syndicated duplicates and author mismatches
        if: inputs.skip_enrichment != 'true'
        run: node scripts/detect-syndicated-duplicates.js 2>&1 | tee -a /tmp/locked-skip.log
        continue-on-error: true

      - name: Apply audit flags to review-text files
        if: inputs.skip_enrichment != 'true'
        run: node scripts/apply-audit-flags.js
        continue-on-error: true

      # Sweep dormant stale duplicateOf flags. The review-write-guard self-heal
      # only fires when a file is rewritten; a file whose duplicateOf sibling was
      # swept/renamed but which is never re-gathered (closed shows, quiet WE runs)
      # keeps a stale flag that fails the Data Validation gate (test.yml) on EVERY
      # triggered run — the root cause of "main red every couple hours". Running
      # --fix here clears them on each rebuild; push-review-texts ships the result.
      - name: Sweep stale duplicateOf flags
        if: inputs.skip_enrichment != 'true'
        run: node scripts/audit-duplicate-of-url-mismatch.js --fix 2>&1 | tee -a /tmp/locked-skip.log
        continue-on-error: true

      - name: Rebuild reviews.json
        env:
          REVIEW_TEXTS_TOKEN: ${{ secrets.REVIEW_TEXTS_TOKEN }}
        run: |
          FORCE_FLAG=""
          if [ "${{ inputs.force_write || 'false' }}" = "true" ]; then
            FORCE_FLAG="--force-write"
            echo "⚠️  Force-write enabled — regression guard overridden"
          fi

          # First attempt
          if node scripts/rebuild-all-reviews.js $FORCE_FLAG; then
            echo "Rebuild succeeded on first attempt"
            exit 0
          fi

          echo ""
          echo "⚠️  Rebuild failed (likely stale checkout) — re-cloning review-texts and retrying..."
          echo ""

          # Re-clone review-texts fresh (fixes stale/partial checkout from concurrent pushes)
          rm -rf data/review-texts
          git clone --depth 1 "https://x-access-token:${REVIEW_TEXTS_TOKEN}@github.com/thomaspryor/broadway-review-texts.git" data/review-texts

          # Retry rebuild
          node scripts/rebuild-all-reviews.js $FORCE_FLAG

      - name: Snapshot rebuilt core data for private repo push
        if: always()
        run: |
          # push-core-data compares data/ against /tmp/core-data-snapshot/ to detect changes.
          # The snapshot was taken at checkout time (stale). Update it with the freshly rebuilt
          # files so push-core-data will push the new reviews.json to the private repo.
          # Without this, git checkout -- data/reviews.json (line 220) reverts reviews.json
          # and push-core-data sees "no changes" since snapshot == reverted file.
          for f in reviews.json shows.json critic-consensus.json critic-registry.json outlet-registry.json; do
            if [ -f "data/$f" ]; then
              cp -f "data/$f" /tmp/core-data-snapshot/
            fi
          done
          echo "Updated core-data snapshot with rebuilt files"

      - name: Extract pull quotes for new reviews
        # Moved AFTER Rebuild reviews.json + snapshot (Notion 351637c5-416f-8177).
        # Display-only enrichment of llmPullQuote field — no scoring impact. If this
        # step times out / cancels, reviews.json + the core-data snapshot are already
        # in place and the next push step will publish them. Pull quotes drain over
        # multiple runs at --limit=200/run; the prior 500/run was timing out at ~28min.
        if: inputs.skip_enrichment != 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/extract-pull-quotes.js --limit=200
        continue-on-error: true
        timeout-minutes: 12

      - name: Analyze review drops and send alert email
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/analyze-rebuild-drops.js
        continue-on-error: true

      - name: Opening-night drop + completeness check
        # Per-critic snapshot diff + per-show rebuild-regression alert path
        # for shows in the ±7d opening-night window. Stricter threshold than
        # analyze-rebuild-drops.js: any per-show drop fires here for opening
        # shows. See scripts/check-opening-night-completeness.js + memory/feedback_admin_ingest_opening_night_2026-04-26.md (#A19/#A20).
        env:
          DISCORD_WEBHOOK_ALERTS: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/check-opening-night-completeness.js
        continue-on-error: true

      - name: Verify all eligible reviews scored (orphan-unscored guard)
        # Lost Boys 2026-04-26 #8 defense: walks data/review-texts/ for every
        # show in the ±7d opening-night window and asserts every includable
        # review with substantial text/excerpt has assignedScore. Writes
        # data/audit/orphan-unscored-{showId}.json marker files that
        # opening-night-broadcast.yml reads as an early-exit gate. Dispatches
        # llm-ensemble-score.yml (per-show) so the next rebuild has scores.
        # Discord warning, 60-min cooldown per show. continue-on-error so a
        # failure here never blocks the rebuild itself.
        env:
          DISCORD_WEBHOOK_ALERTS: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/verify-all-scored.js
        continue-on-error: true

      - name: Audit wrong-production reviews
        run: node scripts/audit-wrong-production.js
        continue-on-error: true

      - name: Update critic registry
        run: node scripts/audit-critic-outlets.js
        continue-on-error: true

      - name: Enrich cast from cast files
        run: node scripts/enrich-cast-from-files.js
        continue-on-error: true

      - name: Regenerate mobile detail JSONs
        run: node scripts/generate-mobile-show-details.js
        continue-on-error: true

      - name: Generate opening night status page
        run: node scripts/generate-status-page.js
        continue-on-error: true

      - name: Aggregate locked-skip counts (S2-T4)
        if: always()
        run: |
          # Joe Turner postmortem P0 #2 (2026-04-26): each enrichment script logs
          # `[LOCKED-SKIP-COUNT] {script}: N` at exit. The pre-rebuild utility
          # steps above tee their stdout to /tmp/locked-skip.log so we can
          # aggregate here. The 4 LLM enrichment scripts moved to enrich-reviews.yml
          # in 2026-04-30 (Notion 351637c5-416f-8177); their counts now aggregate
          # in that workflow's separate run.
          #
          # Synthetic-test override: set LOCKED_SKIP_TEST_LOG_OVERRIDE in the env
          # to a path with hand-crafted [LOCKED-SKIP-COUNT] lines for dry-run
          # validation of the warning threshold.
          LOG="${LOCKED_SKIP_TEST_LOG_OVERRIDE:-/tmp/locked-skip.log}"
          if [ ! -f "$LOG" ]; then
            echo "::notice::No locked-skip log produced — enrichment steps may have been skipped"
            exit 0
          fi
          echo "## Locked-skip aggregation"
          # Collapse to one entry per script (last value wins if a script logged twice).
          declare -A counts
          while IFS= read -r line; do
            script=$(echo "$line" | sed -nE 's/.*\[LOCKED-SKIP-COUNT\] ([^:]+):.*/\1/p')
            count=$(echo "$line" | sed -nE 's/.*: ([0-9]+)$/\1/p')
            [ -z "$script" ] || [ -z "$count" ] && continue
            counts["$script"]=$count
          done < <(grep '\[LOCKED-SKIP-COUNT\]' "$LOG")
          # Total files modified during enrichment (proxy: review-texts diff line count).
          MODIFIED=$(git -C data/review-texts diff --name-only 2>/dev/null | wc -l | tr -d ' ' || echo 0)
          [ "$MODIFIED" -lt 1 ] && MODIFIED=1  # avoid divide-by-zero
          for script in "${!counts[@]}"; do
            count=${counts[$script]}
            echo "  $script: $count"
            # Threshold: warn when this script's lockedSkip count exceeds 50% of
            # files modified during enrichment. Tunable via LOCKED_SKIP_THRESHOLD_PCT.
            PCT_THRESHOLD=${LOCKED_SKIP_THRESHOLD_PCT:-50}
            ratio=$(( count * 100 / MODIFIED ))
            if [ "$ratio" -gt "$PCT_THRESHOLD" ]; then
              echo "::warning::High locked-skip ratio in $script: $count skipped vs $MODIFIED files modified ($ratio%) — likely something is wrong (stuck files? false positive in lock detection? aggressive --before-opening?)"
            fi
          done

      - name: Get new review count
        id: after
        run: |
          COUNT=$(node -e "console.log(require('./data/reviews.json').reviews.length)")
          echo "count=$COUNT" >> $GITHUB_OUTPUT

      - name: Check for changes
        if: always()
        id: changes
        run: |
          # Check both reviews.json AND public show JSONs (Fix E: rebuild "no changes" loop)
          REVIEWS_CHANGED=false
          PUBLIC_CHANGED=false
          if ! git diff --quiet data/reviews.json 2>/dev/null; then
            REVIEWS_CHANGED=true
            echo "Changes detected in reviews.json"
            git diff --stat data/reviews.json
          fi
          if ! git diff --quiet public/data/shows/ 2>/dev/null; then
            PUBLIC_CHANGED=true
            echo "Changes detected in public show JSONs"
            git diff --stat public/data/shows/ | tail -5
          fi
          if [ "$REVIEWS_CHANGED" = "true" ] || [ "$PUBLIC_CHANGED" = "true" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No changes to reviews.json or public show JSONs"
          fi

      - name: Check for large files
        if: steps.changes.outputs.has_changes == 'true'
        uses: ./.github/actions/check-file-sizes


      - name: Push review-texts to private repo
        if: always()
        uses: ./.github/actions/push-review-texts
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
          message: "data: Rebuild Reviews Data — Commit and push changes"
      - name: Commit and push changes
        if: always() && steps.changes.outputs.has_changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # Core data files pushed to private repo by push-core-data action
          # Stage all audit files modified by rebuild (not just critic-outlet-affinity)
          git add data/audit/*.json 2>/dev/null || true
          # Stage deletions of orphan-unscored marker files. verify-all-scored.js
          # deletes them when scores have filled in; without -u those deletions
          # never make it back to main and the broadcast gate stays permanently
          # blocked even after the LLM ensemble resolves the orphan(s).
          git add -u data/audit/ 2>/dev/null || true
          git add public/opening-night-status.json public/status.html 2>/dev/null || true
          git add public/data/shows/ 2>/dev/null || true
          # Lock audit-trail snapshot (Lost Boys 2026-04-27 Gap #6).
          git add public/data/admin/locks.json 2>/dev/null || true
          # Critic-coverage admin digest (S4 — drives /admin/critic-coverage page).
          git add public/data/admin/critic-coverage.json 2>/dev/null || true
          git add data/opening-night-timeline/*.jsonl 2>/dev/null || true
          # Reset any unstaged tracked files (e.g. core data overwritten by checkout-core-data)
          git checkout -- data/reviews.json data/audience-buzz.json 2>/dev/null || true

          BEFORE=${{ steps.before.outputs.count }}
          AFTER=${{ steps.after.outputs.count }}
          DIFF=$((AFTER - BEFORE))

          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            REASON="${{ inputs.reason }}"
            MSG="data: Rebuild reviews.json - $REASON"
          else
            MSG="data: Scheduled rebuild of reviews.json"
          fi

          if [ $DIFF -ne 0 ]; then
            if [ $DIFF -gt 0 ]; then
              MSG="$MSG (+$DIFF reviews)"
            else
              MSG="$MSG ($DIFF reviews)"
            fi
          fi

          git commit -m "$MSG

          Reviews: $BEFORE → $AFTER

          Co-Authored-By: github-actions[bot] <github-actions[bot]@users.noreply.github.com>"

          bash scripts/lib/push-with-retry.sh


      - name: Push core data to private repo
        id: push-core-data
        if: always()
        uses: ./.github/actions/push-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
          message: 'data: Update from rebuild-reviews'

      # A #21 (2026-04-26): Dispatch deploy directly after push-core-data, instead
      # of relying solely on vercel-deploy.yml's workflow_run listener. The listener
      # gates on `conclusion == 'success'`, but post-push steps (Auto-trigger LLM
      # scoring, Auto-trigger consensus, Record pipeline success) can fail and tip
      # the overall job conclusion to 'failure' AFTER the data was already pushed
      # to the private repo — leaving production stale. Pattern matches
      # gather-reviews.yml:472, update-show-status.yml, weekly-grosses.yml,
      # opening-night-poller.yml. Dedup window matches gather-reviews (15 min).
      - name: Trigger deploy (core data changed)
        if: always() && steps.push-core-data.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OUR_RUN_START=$(gh run view ${{ github.run_id }} --json createdAt -q '.createdAt' 2>/dev/null || echo "")
          RECENT=$(gh run list --workflow=vercel-deploy.yml --limit=1 --json createdAt -q '.[0].createdAt' 2>/dev/null || echo "")
          if [ -n "$RECENT" ] && [ -n "$OUR_RUN_START" ]; then
            RECENT_TS=$(date -d "$RECENT" +%s 2>/dev/null || date -j -f "%Y-%m-%dT%H:%M:%SZ" "$RECENT" +%s 2>/dev/null || echo "0")
            OUR_TS=$(date -d "$OUR_RUN_START" +%s 2>/dev/null || date -j -f "%Y-%m-%dT%H:%M:%SZ" "$OUR_RUN_START" +%s 2>/dev/null || echo "0")
            NOW_TS=$(date +%s)
            DIFF=$((NOW_TS - RECENT_TS))
            if [ "$RECENT_TS" -gt "$OUR_TS" ] && [ "$DIFF" -lt 900 ]; then
              echo "Skipping deploy — already triggered after this run started (${DIFF}s ago)"
              exit 0
            fi
          fi
          echo "Triggering deploy..."
          gh workflow run vercel-deploy.yml || echo "Deploy dispatch failed — workflow_run will catch successful conclusions"

      - name: Auto-trigger LLM scoring if needed
        id: scoring-trigger
        env:
          GH_TOKEN: ${{ secrets.REVIEW_TEXTS_TOKEN }}
        run: |
          # Count reviews needing LLM scoring (have scorable text, no score)
          # Excludes reviews the scorer will skip: roundups, garbage, no text, duplicates
          # Returns "<total> <openingNightUnscored>" — opening-night count is the subset
          # of unscored reviews that belong to shows in the ±7d opening window. The
          # 5-review default threshold sat unscored excerpts for opening-night shows
          # (Animal Wisdom 2026-05-19 ran 6 unscored excerpts in dir for 8d before
          # the next batch tipped it over the threshold). Per-opening-night-show
          # threshold of 1 fires scoring immediately for in-window shows.
          read UNSCORED OPENING_NIGHT_UNSCORED <<< "$(node -e '
            const fs = require("fs");
            const path = require("path");
            const base = "data/review-texts";
            let garbageSuffix = new Set();
            try {
              const g = JSON.parse(fs.readFileSync("data/llm-scoring-garbage-skips.json","utf8"));
              if (Array.isArray(g)) g.forEach(e => {
                if (e.filePath) { const m = e.filePath.match(/data\/review-texts\/(.+)/); if (m) garbageSuffix.add(m[1]); }
              });
            } catch {}
            // Build opening-night-window show set (±7d)
            let openingNightShows = new Set();
            try {
              const showsData = JSON.parse(fs.readFileSync("data/shows.json", "utf8"));
              const shows = Array.isArray(showsData) ? showsData : (showsData.shows || []);
              const now = Date.now();
              const sevenDays = 7 * 86400000;
              for (const s of shows) {
                if (!s.openingDate) continue;
                const od = new Date(s.openingDate).getTime();
                if (isNaN(od)) continue;
                if (Math.abs(od - now) <= sevenDays) openingNightShows.add(s.id);
              }
            } catch {}
            let n = 0, nOpening = 0;
            const dirs = fs.readdirSync(base).filter(d => {
              try { return fs.statSync(path.join(base, d)).isDirectory(); } catch { return false; }
            });
            dirs.forEach(d => {
              const showDir = path.join(base, d);
              fs.readdirSync(showDir).filter(f => f.endsWith(".json") && f !== "failed-fetches.json").forEach(f => {
                try {
                  const fp = path.join(showDir, f);
                  const r = JSON.parse(fs.readFileSync(fp, "utf8"));
                  if (r.wrongProduction || r.wrongShow || r.wrongAttribution) return;
                  if (r.duplicateOf || r.isSyndicatedDuplicate || r.rejectionReason || r.isRoundupArticle) return;
                  if (r.contentTier === "invalid") return;
                  if (garbageSuffix.has(d + "/" + f)) return;
                  const hasText = r.fullText && r.fullText.length > 100;
                  const hasExcerpt = r.bwwExcerpt || r.dtliExcerpt || r.showScoreExcerpt || r.pvExcerpt || r.nycExcerpt || (r.excerpt && r.excerpt.length > 50);
                  if (!hasText && !hasExcerpt) return;
                  const needsScore = !r.assignedScore && !r.llmScore && !r.humanReviewScore;
                  const needsRescore = !!r.rescoreReason;
                  if (needsScore || needsRescore) {
                    n++;
                    if (openingNightShows.has(d)) nOpening++;
                  }
                } catch {}
              });
            });
            console.log(n + " " + nOpening);
          ')"

          echo "Reviews needing LLM scoring: $UNSCORED (opening-night window: $OPENING_NIGHT_UNSCORED)"
          echo "unscored=$UNSCORED" >> $GITHUB_OUTPUT
          echo "opening_night_unscored=$OPENING_NIGHT_UNSCORED" >> $GITHUB_OUTPUT

          # Two-tier trigger: standard 5+ total OR any opening-night-window show
          # with 1+ unscored. Catches the Animal Wisdom 2026-05-19 case where
          # 6 valid excerpts sat unscored for 8+ days under the 5-review threshold.
          THRESHOLD=5
          OPENING_THRESHOLD=1
          if [ "$UNSCORED" -lt "$THRESHOLD" ] && [ "$OPENING_NIGHT_UNSCORED" -lt "$OPENING_THRESHOLD" ]; then
            echo "Below both thresholds (total<$THRESHOLD AND opening-night<$OPENING_THRESHOLD). Skipping auto-trigger."
            echo "scoring_triggered=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          if [ "$UNSCORED" -lt "$THRESHOLD" ] && [ "$OPENING_NIGHT_UNSCORED" -ge "$OPENING_THRESHOLD" ]; then
            echo "Triggering on opening-night window threshold ($OPENING_NIGHT_UNSCORED unscored in ±7d window)"
          fi

          # Check if LLM scoring is already running or queued
          RUNNING=$(gh run list --workflow=llm-ensemble-score.yml --status=in_progress --json databaseId --jq 'length' 2>/dev/null || echo "0")
          QUEUED=$(gh run list --workflow=llm-ensemble-score.yml --status=queued --json databaseId --jq 'length' 2>/dev/null || echo "0")
          WAITING=$(gh run list --workflow=llm-ensemble-score.yml --status=waiting --json databaseId --jq 'length' 2>/dev/null || echo "0")
          ACTIVE=$((RUNNING + QUEUED + WAITING))
          if [ "$ACTIVE" -gt 0 ]; then
            echo "LLM scoring already active ($RUNNING running, $QUEUED queued). Skipping."
            exit 0
          fi

          # Cap batch at 400 (safe under 6-hour timeout)
          LIMIT=400
          if [ "$UNSCORED" -lt "$LIMIT" ]; then
            LIMIT=$UNSCORED
          fi

          echo "Triggering LLM scoring for $UNSCORED reviews (limit=$LIMIT)..."
          gh workflow run llm-ensemble-score.yml \
            -f limit=$LIMIT \
            -f run_calibration=false \
            -f chain=true \
            -f remaining_batches=5

          echo "LLM scoring auto-triggered successfully."
          echo "scoring_triggered=true" >> $GITHUB_OUTPUT

      - name: Auto-trigger consensus update if needed
        if: always() && steps.changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Skip if scoring was triggered — scoring chain dispatches consensus when done
          if [ "${{ steps.scoring-trigger.outputs.scoring_triggered }}" = "true" ]; then
            echo "Scoring was triggered — consensus will fire from scoring chain. Skipping."
            exit 0
          fi

          # Dedup: skip if consensus ran within the last hour
          RECENT=$(gh run list --workflow=update-critic-consensus.yml --limit=1 --json createdAt -q '.[0].createdAt' 2>/dev/null || echo "")
          if [ -n "$RECENT" ]; then
            RECENT_TS=$(date -d "$RECENT" +%s 2>/dev/null || date -jf "%Y-%m-%dT%H:%M:%SZ" "$RECENT" +%s 2>/dev/null || echo "0")
            NOW_TS=$(date +%s)
            DIFF=$((NOW_TS - RECENT_TS))
            if [ "$DIFF" -lt 3600 ]; then
              echo "Consensus ran ${DIFF}s ago (< 1 hour). Skipping."
              exit 0
            fi
          fi

          # Check if consensus is already running or queued
          RUNNING=$(gh run list --workflow=update-critic-consensus.yml --status=in_progress --json databaseId --jq 'length' 2>/dev/null || echo "0")
          QUEUED=$(gh run list --workflow=update-critic-consensus.yml --status=queued --json databaseId --jq 'length' 2>/dev/null || echo "0")
          if [ "$((RUNNING + QUEUED))" -gt 0 ]; then
            echo "Consensus already active. Skipping."
            exit 0
          fi

          echo "Dispatching consensus update (reviews changed, no scoring needed)..."
          gh workflow run update-critic-consensus.yml

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: 'Reviews Rebuild Failed'
          description: 'Check run logs. If reviews dropped significantly, analyze-rebuild-drops.js will send a qualitative email analysis. To re-run manually: gh workflow run "Rebuild Reviews Data" -f reason="Manual recovery"'
          discord_webhook: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}

      - name: Summary
        if: always()
        run: |
          echo "## Reviews Rebuild Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Before:** ${{ steps.before.outputs.count }} reviews" >> $GITHUB_STEP_SUMMARY
          echo "**After:** ${{ steps.after.outputs.count }} reviews" >> $GITHUB_STEP_SUMMARY
          echo "**Changes:** ${{ steps.changes.outputs.has_changes }}" >> $GITHUB_STEP_SUMMARY
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "**Trigger:** Manual (${{ inputs.reason }})" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Trigger:** Scheduled (daily 4 AM UTC)" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Record pipeline success
        if: success()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          mkdir -p data/audit/pipeline-health
          date -u > data/audit/pipeline-health/rebuild-reviews.last-success
          git add data/audit/pipeline-health/
          git diff --staged --quiet || git commit -m "health: Record rebuild-reviews success" && git push || echo "::warning::Health recording push failed"
