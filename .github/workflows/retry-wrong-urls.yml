name: Retry Wrong URLs

on:
  workflow_dispatch:
    inputs:
      max_tier:
        description: 'Max outlet tier (1=T1 only, 2=T1+T2, 3=include T3)'
        required: false
        default: '2'
      dry_run:
        description: 'Dry run (no file changes)'
        required: false
        default: 'false'
      time_budget_min:
        description: 'Wall-clock budget in minutes (0 = unlimited)'
        required: false
        default: '22'

permissions:
  contents: write
  actions: write

jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}

      - uses: ./.github/actions/checkout-review-texts
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}

      - uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Retry wrongUrl reviews via SERP
        env:
          SCRAPINGBEE_API_KEY: ${{ secrets.SCRAPINGBEE_API_KEY }}
          SCRAPINGDOG_API_KEY: ${{ secrets.SCRAPINGDOG_API_KEY }}
          SCRAPER_USE_SCRAPINGDOG: '1'
          BRIGHTDATA_TOKEN: ${{ secrets.BRIGHTDATA_TOKEN }}
          BRIGHTDATA_ZONE: ${{ secrets.BRIGHTDATA_ZONE }}
        run: |
          DRY_RUN_FLAG=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
          fi

          # Exit cleanly before the 30-min job timeout; deferred candidates
          # are picked up next run. Default in bash, not a GHA || expression —
          # the expression coerces a literal 0 (= unlimited) to falsy.
          TB="${{ inputs.time_budget_min }}"
          [ -z "$TB" ] && TB=22

          node scripts/retry-wrong-urls.js \
            --max-tier ${{ inputs.max_tier }} \
            --time-budget-min="$TB" \
            $DRY_RUN_FLAG

      - name: Push review texts
        if: inputs.dry_run != 'true'
        uses: ./.github/actions/push-review-texts
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
          message: "data: Retry wrongUrl SERP discovery (T1-T${{ inputs.max_tier }})"

      - name: Trigger rebuild
        if: inputs.dry_run != 'true'
        run: gh workflow run "Rebuild Reviews Data" -f reason="Post wrongUrl retry"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit scraper-spend ledger
        if: always()
        continue-on-error: true
        uses: ./.github/actions/commit-scraper-spend-ledger
        with:
          workflow-name: retry-wrong-urls

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: 'Retry Wrong URLs Failed'
          severity: 'low'
          discord_webhook: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
