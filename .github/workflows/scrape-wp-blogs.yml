# Scrape WordPress theater blog reviews via REST API
name: Scrape WordPress Theater Blogs

on:
  schedule:
    - cron: '30 10 * * 0'  # Weekly on Sundays at 10:30 AM UTC (after NYSR at 10:00)
  workflow_dispatch:
    inputs:
      site:
        description: 'Single site to scrape (e.g. front-row-center, theater-life). Leave empty for all.'
        required: false
        type: string

permissions:
  contents: write

jobs:
  scrape-wp-blogs:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}



      - name: Checkout core data
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
      - name: Checkout review-texts (private repo)
        uses: ./.github/actions/checkout-review-texts
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
      - name: Checkout aggregator-archive (private repo)
        uses: ./.github/actions/checkout-aggregator-archive
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
      - uses: ./.github/actions/setup-node

      - name: Scrape WordPress theater blogs
        run: |
          SITE_ARG=""
          if [ -n "${{ inputs.site }}" ]; then
            SITE_ARG="--site=${{ inputs.site }}"
          fi
          echo "Scraping WordPress theater blog reviews..."
          node scripts/scrape-wp-theater-blogs.js $SITE_ARG


      - name: Push review-texts to private repo
        if: always()
        uses: ./.github/actions/push-review-texts
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
          message: "data: Scrape WordPress Theater Blogs — Commit and push changes"
      - name: Push aggregator-archive to private repo
        if: always()
        uses: ./.github/actions/push-aggregator-archive
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
          message: "data: WordPress theater blog scrape (aggregator archive)"

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: 'Scrape WordPress Blogs Failed'
          discord_webhook: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
          resend_api_key: ${{ secrets.RESEND_API_KEY }}
          owner_email: ${{ secrets.OWNER_EMAIL }}
