name: Collect Free-Outlet Reviews

on:
  workflow_dispatch:
    inputs:
      parallel_jobs:
        description: 'Number of parallel collection jobs (1-10)'
        required: false
        type: choice
        default: '5'
        options: ['1', '2', '3', '4', '5', '6', '7', '8', '10']
      max_per_job:
        description: 'Max reviews per job (0 = all)'
        required: false
        default: '200'
      dry_run:
        description: 'Dry run — count eligible reviews without collecting'
        required: false
        type: boolean
        default: false
      retry_failed:
        description: 'Retry previously failed reviews'
        required: false
        type: boolean
        default: false
      archive_first:
        description: 'Try Archive.org first (recommended)'
        required: false
        type: boolean
        default: true
      max_rounds:
        description: 'Max self-chaining rounds (0 = no chaining)'
        required: false
        default: '50'
      current_round:
        description: 'Current round (auto-set by chaining)'
        required: false
        default: '1'

# Collects full text from free/open-access outlets (no paywall).
# Excludes all known paywall domains (hard + soft) to focus on easy wins.
# ~10,600+ reviews across outlets like AM New York, NY Daily News,
# Talkin' Broadway, NY Post, Hollywood Reporter, The Wrap, etc.

env:
  # All known paywall domains to exclude
  PAYWALL_DOMAINS: 'nytimes.com,vulture.com,nymag.com,wsj.com,washingtonpost.com,newyorker.com,ft.com,telegraph.co.uk,thetimes.co.uk,theatermania.com,timeout.com,ew.com,deadline.com,observer.com,chicagotribune.com,nypost.com,variety.com,hollywoodreporter.com,nydailynews.com,newsday.com'

# Per-run group (not shared): the `collect` job's matrix partitions eligible
# reviews into disjoint parallel_jobs shards, and the `rebuild` job
# self-chains the next round with a NEW run_id after this run's rebuild
# completes. A shared group would only ever queue a second concurrent
# manual dispatch, not affect the chain. See docs/workflow-concurrency-audit.md.
concurrency:
  group: collect-free-reviews-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.partition.outputs.matrix }}
      total_eligible: ${{ steps.count.outputs.total }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5



      - name: Checkout core data
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
      - name: Checkout review-texts (private repo)
        uses: ./.github/actions/checkout-review-texts
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Count eligible reviews and partition
        id: count
        env:
          EXCLUDE_DOMAINS: ${{ env.PAYWALL_DOMAINS }}
        run: |
          node -e "
            const fs = require('fs'), path = require('path');
            const base = 'data/review-texts';
            const excludeDomains = (process.env.EXCLUDE_DOMAINS || '').split(',').map(s => s.trim().toLowerCase()).filter(Boolean);
            const showCounts = {};
            let total = 0;
            const dirs = fs.readdirSync(base).filter(d => {
              try { return fs.statSync(path.join(base, d)).isDirectory(); } catch { return false; }
            });
            dirs.forEach(d => {
              let count = 0;
              fs.readdirSync(path.join(base, d)).filter(f => f.endsWith('.json') && f !== 'failed-fetches.json').forEach(f => {
                try {
                  const r = JSON.parse(fs.readFileSync(path.join(base, d, f), 'utf8'));
                  if (r.wrongProduction || r.wrongShow || r.wrongAttribution) return;
                  if (!r.url) return;
                  const textLen = r.fullText ? r.fullText.length : 0;
                  const isTruncated = r.textQuality === 'truncated' || r.textStatus === 'truncated'
                    || r.contentTier === 'truncated' || r.contentTier === 'needs-rescrape';
                  if (!isTruncated && (r.isFullReview === true || r.textQuality === 'full' || textLen > 1500)) return;
                  try {
                    const urlDomain = new URL(r.url).hostname.replace(/^www\\./, '');
                    if (excludeDomains.some(dd => urlDomain === dd || urlDomain.endsWith('.' + dd))) return;
                    count++;
                  } catch(e) {}
                } catch(e) {}
              });
              if (count > 0) { showCounts[d] = count; total += count; }
            });
            console.log(JSON.stringify({ total, showCount: Object.keys(showCounts).length }));
            fs.writeFileSync('/tmp/show-counts.json', JSON.stringify(showCounts));
          "
          TOTAL=$(node -e "const c=JSON.parse(require('fs').readFileSync('/tmp/show-counts.json','utf8'));console.log(Object.values(c).reduce((a,b)=>a+b,0))")
          echo "total=$TOTAL" >> $GITHUB_OUTPUT
          echo "Eligible free-outlet reviews: $TOTAL"

      - name: Build partition matrix
        id: partition
        env:
          JOBS: ${{ inputs.parallel_jobs }}
        run: |
          node -e "
            const fs = require('fs');
            const counts = JSON.parse(fs.readFileSync('/tmp/show-counts.json', 'utf8'));
            // Load show statuses to prioritize open/preview shows
            const showsData = JSON.parse(fs.readFileSync('data/shows.json', 'utf8'));
            const openIds = new Set();
            (showsData.shows || showsData).forEach(s => {
              if (s.status === 'open' || s.status === 'previews') openIds.add(s.id);
            });
            // Sort: open/preview shows first, then by descending count
            const shows = Object.entries(counts).sort((a,b) => {
              const aOpen = openIds.has(a[0]) ? 0 : 1;
              const bOpen = openIds.has(b[0]) ? 0 : 1;
              if (aOpen !== bOpen) return aOpen - bOpen;
              return b[1] - a[1];
            });
            const openCount = shows.filter(([id]) => openIds.has(id)).length;
            console.log('Open/preview shows with eligible reviews: ' + openCount + '/' + shows.length);
            const jobs = parseInt(process.env.JOBS);
            const partitions = Array.from({length: jobs}, () => ({shows: [], count: 0}));
            // Round-robin — open shows distributed first across all partitions
            shows.forEach(([show, count]) => {
              const lightest = partitions.reduce((min, p, i) => p.count < partitions[min].count ? i : min, 0);
              partitions[lightest].shows.push(show);
              partitions[lightest].count += count;
            });
            const matrix = partitions
              .filter(p => p.shows.length > 0)
              .map((p, i) => ({ partition: i + 1, shows: p.shows.join(','), review_count: p.count }));
            console.log(JSON.stringify(matrix));
            fs.writeFileSync('/tmp/matrix.json', JSON.stringify(matrix));
          "
          MATRIX=$(cat /tmp/matrix.json)
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
          echo "Partitions: $MATRIX"

      - name: Summary
        env:
          INPUT_MAX_PER_JOB: ${{ inputs.max_per_job }}
        run: |
          echo "## Free-Outlet Collection: Preparation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Total eligible reviews:** ${{ steps.count.outputs.total }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Parallel jobs:** ${{ inputs.parallel_jobs }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Max per job:** ${INPUT_MAX_PER_JOB}" >> $GITHUB_STEP_SUMMARY
          echo "- **Dry run:** ${{ inputs.dry_run }}" >> $GITHUB_STEP_SUMMARY

  collect:
    if: ${{ inputs.dry_run != true }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJson(inputs.parallel_jobs) }}
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.matrix) }}

    steps:
      # BRO-4231: this job checks out a blobless partial clone (filter: blob:none
      # on the checkout below), so rebase/diff/show fetch missing blobs over the
      # network outside push-with-retry.sh's per-op timeout wrappers. Set git's
      # low-speed abort (1 KB/s for 45 s, the bound the helper applies to its own
      # fetch/push) for EVERY git transfer in this job: --global, and before the
      # checkout, so actions/checkout's own first lazy blob batch and the depth-1
      # private-repo clones (checkout-core-data / checkout-review-texts, no
      # timeout of their own; their retry loop catches the abort) are bounded
      # too. A stalled transfer fails fast instead of hanging to the job timeout.
      # lowSpeed cannot catch a pre-transfer stall. Runner $HOME is ephemeral.
      - name: Set git low-speed abort for this job
        run: |
          git config --global http.lowSpeedLimit 1000
          git config --global http.lowSpeedTime 45

      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          # BRO-4231: filter: blob:none keeps the full commit graph fetch-depth: 0 is
          # here for (a resolvable merge-base for push-with-retry.sh; #209 parentless
          # root) but stops downloading every historical blob of this repo's data/*.json
          # rewrites: ~24 min -> ~30 s per checkout (llm-ensemble-score runs 36523767401
          # -> 36672742657). Full rationale: opening-night-poller.yml's Checkout step.
          filter: blob:none



      - name: Checkout core data
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
      - name: Checkout review-texts (private repo)
        uses: ./.github/actions/checkout-review-texts
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Setup Playwright
        uses: ./.github/actions/setup-playwright

      - name: Create directories
        run: |
          mkdir -p data/archives/reviews
          mkdir -p data/audit/validation
          mkdir -p data/collection-state

      - name: Clear progress state
        run: rm -f data/collection-state/progress.json

      - name: Configure git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Stagger start
        run: |
          DELAY=$(( (${{ matrix.partition }} - 1) * 8 ))
          echo "Staggering partition ${{ matrix.partition }} by ${DELAY}s"
          sleep $DELAY

      - name: Collect review texts (partition ${{ matrix.partition }})
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SCRAPINGBEE_API_KEY: ${{ secrets.SCRAPINGBEE_API_KEY }}
          SCRAPINGDOG_API_KEY: ${{ secrets.SCRAPINGDOG_API_KEY }}
          SCRAPER_USE_SCRAPINGDOG: '1'
          BRIGHTDATA_TOKEN: ${{ secrets.BRIGHTDATA_TOKEN }}
          BRIGHTDATA_ZONE: ${{ secrets.BRIGHTDATA_ZONE }}
          BROWSERBASE_API_KEY: ${{ secrets.BROWSERBASE_API_KEY }}
          BROWSERBASE_PROJECT_ID: ${{ secrets.BROWSERBASE_PROJECT_ID }}
          BROWSERBASE_KILL_SWITCH: ${{ vars.BROWSERBASE_KILL_SWITCH }}
          BROWSERBASE_ENABLED: 'false'
          COOKIES_BUNDLE_1: ${{ secrets.COOKIES_BUNDLE_1 }}
          COOKIES_BUNDLE_2: ${{ secrets.COOKIES_BUNDLE_2 }}
          COOKIES_BUNDLE_3: ${{ secrets.COOKIES_BUNDLE_3 }}
          COOKIES_BUNDLE_4: ${{ secrets.COOKIES_BUNDLE_4 }}
          COOKIES_BUNDLE_5: ${{ secrets.COOKIES_BUNDLE_5 }}
          COOKIES_BUNDLE_6: ${{ secrets.COOKIES_BUNDLE_6 }}
          COOKIES_BUNDLE_7: ${{ secrets.COOKIES_BUNDLE_7 }}
          COOKIES_BUNDLE_8: ${{ secrets.COOKIES_BUNDLE_8 }}
          COOKIES_BUNDLE_9: ${{ secrets.COOKIES_BUNDLE_9 }}
          COOKIES_BUNDLE_10: ${{ secrets.COOKIES_BUNDLE_10 }}
          COOKIES_BUNDLE_11: ${{ secrets.COOKIES_BUNDLE_11 }}
          WSJ_COOKIES: ${{ secrets.WSJ_COOKIES }}
          WSJ_COOKIES_META: ${{ secrets.WSJ_COOKIES_META }}
          SHOW_FILTER: ${{ matrix.shows }}
          EXCLUDE_DOMAINS: ${{ env.PAYWALL_DOMAINS }}
          BATCH_SIZE: '10'
          MAX_REVIEWS: ${{ inputs.max_per_job }}
          RETRY_FAILED: ${{ inputs.retry_failed && 'true' || 'false' }}
          ARCHIVE_FIRST: ${{ inputs.archive_first && 'true' || 'false' }}
          COMMIT_EVERY: '25'
          # BRO-2381: without this, pushReviewTextsCheckpoint()'s mid-run
          # checkpoint to the private review-texts repo silently no-ops for
          # the whole run — a timeout/cancellation mid-run loses everything
          # collected since the last checkpoint.
          REVIEW_TEXTS_TOKEN: ${{ secrets.REVIEW_TEXTS_TOKEN }}
          GUARDIAN_API_KEY: ${{ secrets.GUARDIAN_API_KEY }}
        run: node scripts/collect-review-texts.js --aggressive

      - name: Validate data
        if: always()
        run: node scripts/validate-data.js
        continue-on-error: true


      # always-commit-ok: private-repo checkpoint push; partial scrape/collection progress must be kept even when the soft validate step fails. validate-data.js is not a publication gate for review-texts today (the deploy gate is pre-deploy-check.js count floors) (BRO-5591)
      - name: Push review-texts to private repo
        if: always()
        uses: ./.github/actions/push-review-texts
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
          message: "data: Collect Free-Outlet Reviews — Commit and push (partition ${{ matrix.partition }})"
      - name: Commit and push (partition ${{ matrix.partition }})
        if: always()
        run: |
          git add data/archives/reviews/ data/audit/ data/collection-state/ || true
          if git diff --staged --quiet; then
            echo "No changes to commit for partition ${{ matrix.partition }}"
          else
            bash scripts/lib/check-file-sizes.sh --advisory  # BRO-5335: post-stage large-file check (advisory until armed)
            git commit -m "feat: Collect free-outlet review texts (partition ${{ matrix.partition }}/${{ inputs.parallel_jobs }})

          Co-Authored-By: GitHub Action <action@github.com>"
            bash scripts/lib/push-with-retry.sh
          fi

      - name: Upload collection report
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with:
          name: free-outlet-report-partition-${{ matrix.partition }}
          path: |
            data/audit/validation/collection-report-*.json
            data/collection-state/progress.json
          retention-days: 30

  rebuild:
    if: ${{ inputs.dry_run != true && always() }}
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write

    steps:
      # BRO-4231: this job checks out a blobless partial clone (filter: blob:none
      # on the checkout below), so rebase/diff/show fetch missing blobs over the
      # network outside push-with-retry.sh's per-op timeout wrappers. Set git's
      # low-speed abort (1 KB/s for 45 s, the bound the helper applies to its own
      # fetch/push) for EVERY git transfer in this job: --global, and before the
      # checkout, so actions/checkout's own first lazy blob batch and the depth-1
      # private-repo clones (checkout-core-data / checkout-review-texts, no
      # timeout of their own; their retry loop catches the abort) are bounded
      # too. A stalled transfer fails fast instead of hanging to the job timeout.
      # lowSpeed cannot catch a pre-transfer stall. Runner $HOME is ephemeral.
      - name: Set git low-speed abort for this job
        run: |
          git config --global http.lowSpeedLimit 1000
          git config --global http.lowSpeedTime 45

      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          # BRO-4231: filter: blob:none keeps the full commit graph fetch-depth: 0 is
          # here for (a resolvable merge-base for push-with-retry.sh; #209 parentless
          # root) but stops downloading every historical blob of this repo's data/*.json
          # rewrites: ~24 min -> ~30 s per checkout (llm-ensemble-score runs 36523767401
          # -> 36672742657). Full rationale: opening-night-poller.yml's Checkout step.
          filter: blob:none



      - name: Checkout core data
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
      - name: Checkout review-texts (private repo)
        uses: ./.github/actions/checkout-review-texts
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Configure git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      # Stale-checkout race guard, pre-rebuild (BRO-3162): sync review-texts
      # files pushed by other jobs since this job's checkout (never files
      # this job wrote), and record which shows drifted.
      - name: Sync review-texts drift before rebuild
        uses: ./.github/actions/sync-review-texts-drift

      - name: Rebuild reviews.json
        id: rebuild_reviews
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/rebuild-all-reviews.js

      # Stale-checkout race guard, post-rebuild (BRO-3162): advisory first
      # (CLAUDE.md rule 19), so it flags a dropped show without blocking.
      - name: Verify no scoreable review vanished during checkout drift
        if: ${{ !cancelled() && steps.rebuild_reviews.outcome == 'success' }}
        continue-on-error: true
        # lint-allow-swallow: report-only by design (rule 19); writes nothing tracked, failure = ::error annotation
        run: >-
          node scripts/check-rebuild-staleness-advisory.js
          --shows-file=/tmp/stale-checkout-shows.txt

      # Stale-checkout race guard, cleanup (BRO-3162): return the synced
      # upstream files to the checkout state so push-review-texts' pull
      # --rebase --autostash never replays them over newer upstream edits.
      - name: Restore review-texts drift sync
        if: always()
        continue-on-error: true
        uses: ./.github/actions/sync-review-texts-drift
        with:
          mode: restore


      - name: Push review-texts to private repo
        if: always()
        uses: ./.github/actions/push-review-texts
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
          message: "data: Collect Free-Outlet Reviews — Commit rebuilt reviews.json"
      - name: Commit rebuilt reviews.json
        continue-on-error: true # a failed push shows red but does not fail the job; was `|| echo` (BRO-4730)
        if: always()
        run: |
          # BRO-6029: git_net caps each fetch/pull/push so a hung transfer fails that attempt instead of waiting for the job timeout.
          . "${GITHUB_WORKSPACE}/scripts/lib/git-net-timeout.sh" 2>/dev/null || git_net() { shift; git "$@"; }
          git add data/audit/
          if git diff --staged --quiet; then
            echo "No changes to reviews.json"
          else
            git commit -m "data: Auto-rebuild reviews.json (free-outlet collection)"
            git_net 300 -c "merge.ours.driver=bash '$GITHUB_WORKSPACE/scripts/lib/merge-keep-run.sh' B %O %A %B %P" pull --rebase origin main || {
              git rebase --abort 2>/dev/null || true
              git_net 300 -c "merge.ours.driver=bash '$GITHUB_WORKSPACE/scripts/lib/merge-keep-run.sh' A %O %A %B %P" pull --no-rebase -X ours origin main
            }
            bash scripts/lib/push-with-retry.sh
          fi


      - name: Push core data to private repo
        if: always()
        uses: ./.github/actions/push-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
          message: 'data: Update from collect-free-reviews'
      - name: Count remaining and chain
        if: always()
        id: chain
        env:
          EXCLUDE_DOMAINS: ${{ env.PAYWALL_DOMAINS }}
          GH_TOKEN: ${{ github.token }}
          INPUT_CURRENT_ROUND: ${{ inputs.current_round }}
          INPUT_MAX_ROUNDS: ${{ inputs.max_rounds }}
          INPUT_MAX_PER_JOB: ${{ inputs.max_per_job }}
        run: |
          REMAINING=$(node -e "
            const fs = require('fs'), path = require('path');
            const base = 'data/review-texts';
            const excludeDomains = (process.env.EXCLUDE_DOMAINS || '').split(',').map(s => s.trim().toLowerCase()).filter(Boolean);
            // Load global failed-fetches to exclude permanently failed URLs.
            // THIRD copy of the retirement rule — now shares the same decision
            // function as collect-review-texts.js's write and read paths
            // (scripts/lib/failed-fetch-policy.js). It previously inlined the
            // thresholds, which meant a budget_capped miss (Bright Data daily
            // cap, not a dead URL) would drop the URL out of this workflow's
            // candidate set at 5 attempts even though the collector itself
            // never retires it. Silent coverage loss, no crash.
            const { isPermanentlyFailed } = require('./scripts/lib/failed-fetch-policy');
            let failedUrls = new Set();
            const globalFF = path.join(base, 'failed-fetches.json');
            if (fs.existsSync(globalFF)) {
              try {
                const ff = JSON.parse(fs.readFileSync(globalFF, 'utf8'));
                (Array.isArray(ff) ? ff : Object.values(ff)).forEach(e => {
                  if (!e.url) return;
                  if (isPermanentlyFailed(e)) failedUrls.add(e.url);
                });
              } catch {}
            }
            let n = 0;
            const dirs = fs.readdirSync(base).filter(d => {
              try { return fs.statSync(path.join(base, d)).isDirectory(); } catch { return false; }
            });
            dirs.forEach(d => {
              fs.readdirSync(path.join(base, d)).filter(f => f.endsWith('.json') && f !== 'failed-fetches.json').forEach(f => {
                try {
                  const r = JSON.parse(fs.readFileSync(path.join(base, d, f), 'utf8'));
                  if (r.wrongProduction || r.wrongShow || r.wrongAttribution) return;
                  if (!r.url) return;
                  if (failedUrls.has(r.url)) return;
                  const textLen = r.fullText ? r.fullText.length : 0;
                  const isTruncated = r.textQuality === 'truncated' || r.textStatus === 'truncated'
                    || r.contentTier === 'truncated' || r.contentTier === 'needs-rescrape';
                  if (!isTruncated && (r.isFullReview === true || r.textQuality === 'full' || textLen > 1500)) return;
                  try {
                    const urlDomain = new URL(r.url).hostname.replace(/^www\\./, '');
                    if (!excludeDomains.some(dd => urlDomain === dd || urlDomain.endsWith('.' + dd))) n++;
                  } catch(e) {}
                } catch(e) {}
              });
            });
            console.log(n);
          ")
          echo "remaining=$REMAINING" >> $GITHUB_OUTPUT
          CURRENT=${INPUT_CURRENT_ROUND}
          MAX=${INPUT_MAX_ROUNDS}
          echo "Remaining: $REMAINING reviews, round $CURRENT of $MAX"
          if [ "$REMAINING" -gt 50 ] && [ "$CURRENT" -lt "$MAX" ]; then
            NEXT=$((CURRENT + 1))
            echo "Chaining round $NEXT..."
            gh workflow run collect-free-reviews.yml \
              -f parallel_jobs=${{ inputs.parallel_jobs }} \
              -f max_per_job=${INPUT_MAX_PER_JOB} \
              -f retry_failed=${{ inputs.retry_failed }} \
              -f archive_first=${{ inputs.archive_first }} \
              -f max_rounds=$MAX \
              -f current_round=$NEXT
            echo "chained=true" >> $GITHUB_OUTPUT
          else
            echo "No chaining needed (remaining=$REMAINING, round=$CURRENT/$MAX)"
            echo "chained=false" >> $GITHUB_OUTPUT
          fi

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: 'Collect Free-Outlet Reviews Failed'
          discord_webhook: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
          resend_api_key: ${{ secrets.RESEND_API_KEY }}
          owner_email: ${{ secrets.OWNER_EMAIL }}

      - name: Summary
        env:
          INPUT_CURRENT_ROUND: ${{ inputs.current_round }}
        run: |
          echo "## Free-Outlet Collection Round ${INPUT_CURRENT_ROUND}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Collected free-outlet review texts across ${{ inputs.parallel_jobs }} parallel jobs." >> $GITHUB_STEP_SUMMARY
          echo "- **Remaining:** ${{ steps.chain.outputs.remaining }} reviews" >> $GITHUB_STEP_SUMMARY
          echo "- **Chained next round:** ${{ steps.chain.outputs.chained }}" >> $GITHUB_STEP_SUMMARY
