name: Discover Regional SERP Reviews

on:
  schedule:
    - cron: '0 15 * * 1'  # Weekly Monday 3 PM UTC (after collect-outlet-reviews at 2 PM)
  workflow_dispatch:
    inputs:
      show:
        description: 'Single regional show ID (default: all shows in the pool)'
        required: false
        default: ''
        type: string
      dry_run:
        description: 'Dry run (no files written, no fetches for candidates)'
        required: false
        default: false
        type: boolean

concurrency:
  group: discover-regional-serp-reviews
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/checkout-review-texts
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}

      - uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run regional SERP discovery
        env:
          SCRAPINGBEE_API_KEY: ${{ secrets.SCRAPINGBEE_API_KEY }}
          BRIGHTDATA_TOKEN: ${{ secrets.BRIGHTDATA_TOKEN }}
          BRIGHTDATA_ZONE: ${{ secrets.BRIGHTDATA_ZONE }}
          SCRAPINGDOG_API_KEY: ${{ secrets.SCRAPINGDOG_API_KEY }}
          # Real batch-wide SERP cost cap: 1 query/show, pool is ~7 shows, so 7
          # calls x 25cr/call = 175cr worst case if every query fell through to
          # SB (Bright Data is the default primary provider, so real usage
          # should be near 0). SB_CREDIT_BUDGET below only bounds the page-fetch
          # step inside each spawned ingest-review-from-url.js subprocess (reset
          # per-process, so it does NOT accumulate across shows/candidates) —
          # SERP_SB_MAX_CALLS_PER_RUN is what actually caps the batch-wide SERP cost.
          SERP_SB_MAX_CALLS_PER_RUN: '7'
          SB_CREDIT_BUDGET: '50'
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.show }}" ]; then
            ARGS="--show=${{ github.event.inputs.show }}"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          echo "Running: node scripts/discover-regional-serp-reviews.js $ARGS"
          node scripts/discover-regional-serp-reviews.js $ARGS

      - name: Push review texts
        if: always()
        uses: ./.github/actions/push-review-texts
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
          message: "feat: Discover regional show reviews via SERP"

      - name: Commit audit log
        if: always() && github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/audit/regional-serp-discovery.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No audit log changes"
          else
            git commit -m "chore: Update regional SERP discovery audit log

          Co-Authored-By: github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
            bash scripts/lib/push-with-retry.sh
          fi

      - name: Trigger rebuild
        if: success() && github.event.inputs.dry_run != 'true'
        run: |
          gh workflow run rebuild-reviews.yml -f reason="Post regional SERP discovery"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: 'Discover Regional SERP Reviews Failed'
          severity: 'warning'
