name: Re-scrape Truncated Reviews

on:
  workflow_dispatch:
    inputs:
      parallel_jobs:
        description: 'Number of parallel collection jobs (1-10)'
        required: false
        type: choice
        default: '5'
        options: ['1', '2', '3', '4', '5', '6', '7', '8', '10']
      max_per_job:
        description: 'Max reviews per job (0 = all)'
        required: false
        default: '200'
      dry_run:
        description: 'Dry run — count eligible reviews without collecting'
        required: false
        type: boolean
        default: false
      retry_failed:
        description: 'Retry previously failed reviews'
        required: false
        type: boolean
        default: true
      exclude_domains:
        description: 'Comma-separated domains to exclude (paywall domains handled by dedicated streams)'
        required: false
        default: 'nytimes.com,vulture.com,nymag.com,wsj.com,washingtonpost.com,newyorker.com,ft.com,telegraph.co.uk,thetimes.co.uk,theatermania.com,timeout.com,ew.com,deadline.com,observer.com,chicagotribune.com,nypost.com,variety.com,hollywoodreporter.com,nydailynews.com,newsday.com'
        type: string
      max_rounds:
        description: 'Max self-chaining rounds (0 = no chaining)'
        required: false
        default: '50'
      current_round:
        description: 'Current round (auto-set by chaining)'
        required: false
        default: '1'

# Re-scrapes reviews where we got partial text (paywall cutoff, read-more, mid-sentence).
# Uses Archive.org first (often has full pre-paywall snapshots).
# ~2,479 truncated reviews across all domains.

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.partition.outputs.matrix }}
      total_eligible: ${{ steps.count.outputs.total }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4



      - name: Checkout core data
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
      - name: Checkout review-texts (private repo)
        uses: ./.github/actions/checkout-review-texts
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Count truncated reviews and partition
        id: count
        run: |
          node -e "
            const fs = require('fs'), path = require('path');
            const base = 'data/review-texts';
            const showCounts = {};
            let total = 0;
            const dirs = fs.readdirSync(base).filter(d => {
              try { return fs.statSync(path.join(base, d)).isDirectory(); } catch { return false; }
            });
            dirs.forEach(d => {
              let count = 0;
              fs.readdirSync(path.join(base, d)).filter(f => f.endsWith('.json') && f !== 'failed-fetches.json').forEach(f => {
                try {
                  const r = JSON.parse(fs.readFileSync(path.join(base, d, f), 'utf8'));
                  if (r.wrongProduction || r.wrongShow || r.wrongAttribution) return;
                  if (!r.url) return;
                  const isTruncated = r.textQuality === 'truncated' || r.textStatus === 'truncated'
                    || r.contentTier === 'truncated' || r.contentTier === 'needs-rescrape';
                  if (isTruncated) count++;
                } catch(e) {}
              });
              if (count > 0) { showCounts[d] = count; total += count; }
            });
            fs.writeFileSync('/tmp/show-counts.json', JSON.stringify(showCounts));
            console.log(total);
          "
          TOTAL=$(cat /tmp/show-counts.json | node -e "const c=JSON.parse(require('fs').readFileSync('/dev/stdin','utf8'));console.log(Object.values(c).reduce((a,b)=>a+b,0))")
          echo "total=$TOTAL" >> $GITHUB_OUTPUT
          echo "Truncated reviews eligible for re-scrape: $TOTAL"

      - name: Build partition matrix
        id: partition
        env:
          JOBS: ${{ inputs.parallel_jobs }}
        run: |
          node -e "
            const fs = require('fs');
            const counts = JSON.parse(fs.readFileSync('/tmp/show-counts.json', 'utf8'));
            // Load show statuses to prioritize open/preview shows
            const showsData = JSON.parse(fs.readFileSync('data/shows.json', 'utf8'));
            const openIds = new Set();
            (showsData.shows || showsData).forEach(s => {
              if (s.status === 'open' || s.status === 'previews') openIds.add(s.id);
            });
            // Sort: open/preview shows first, then by descending count
            const shows = Object.entries(counts).sort((a,b) => {
              const aOpen = openIds.has(a[0]) ? 0 : 1;
              const bOpen = openIds.has(b[0]) ? 0 : 1;
              if (aOpen !== bOpen) return aOpen - bOpen;
              return b[1] - a[1];
            });
            const openCount = shows.filter(([id]) => openIds.has(id)).length;
            console.log('Open/preview shows with truncated reviews: ' + openCount + '/' + shows.length);
            const jobs = parseInt(process.env.JOBS);
            const partitions = Array.from({length: jobs}, () => ({shows: [], count: 0}));
            // Round-robin — open shows distributed first across all partitions
            shows.forEach(([show, count]) => {
              const lightest = partitions.reduce((min, p, i) => p.count < partitions[min].count ? i : min, 0);
              partitions[lightest].shows.push(show);
              partitions[lightest].count += count;
            });
            const matrix = partitions
              .filter(p => p.shows.length > 0)
              .map((p, i) => ({ partition: i + 1, shows: p.shows.join(','), review_count: p.count }));
            console.log(JSON.stringify(matrix));
            fs.writeFileSync('/tmp/matrix.json', JSON.stringify(matrix));
          "
          MATRIX=$(cat /tmp/matrix.json)
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT

      - name: Summary
        run: |
          echo "## Truncated Re-scrape: Preparation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Total truncated reviews:** ${{ steps.count.outputs.total }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Parallel jobs:** ${{ inputs.parallel_jobs }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Max per job:** ${{ inputs.max_per_job }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Dry run:** ${{ inputs.dry_run }}" >> $GITHUB_STEP_SUMMARY

  collect:
    if: ${{ inputs.dry_run != true }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJson(inputs.parallel_jobs) }}
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0



      - name: Checkout core data
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
      - name: Checkout review-texts (private repo)
        uses: ./.github/actions/checkout-review-texts
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Setup Playwright
        uses: ./.github/actions/setup-playwright

      - name: Create directories
        run: |
          mkdir -p data/archives/reviews
          mkdir -p data/audit/validation
          mkdir -p data/collection-state

      - name: Clear progress state
        run: rm -f data/collection-state/progress.json

      - name: Configure git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Stagger start
        run: |
          DELAY=$(( (${{ matrix.partition }} - 1) * 8 ))
          echo "Staggering partition ${{ matrix.partition }} by ${DELAY}s"
          sleep $DELAY

      - name: Re-scrape truncated reviews (partition ${{ matrix.partition }})
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SCRAPINGBEE_API_KEY: ${{ secrets.SCRAPINGBEE_API_KEY }}
          BRIGHTDATA_TOKEN: ${{ secrets.BRIGHTDATA_TOKEN }}
          BRIGHTDATA_ZONE: mcp_unlocker
          BROWSERBASE_API_KEY: ${{ secrets.BROWSERBASE_API_KEY }}
          BROWSERBASE_PROJECT_ID: ${{ secrets.BROWSERBASE_PROJECT_ID }}
          BROWSERBASE_ENABLED: 'false'
          COOKIES_BUNDLE_1: ${{ secrets.COOKIES_BUNDLE_1 }}
          COOKIES_BUNDLE_2: ${{ secrets.COOKIES_BUNDLE_2 }}
          COOKIES_BUNDLE_3: ${{ secrets.COOKIES_BUNDLE_3 }}
          COOKIES_BUNDLE_4: ${{ secrets.COOKIES_BUNDLE_4 }}
          COOKIES_BUNDLE_5: ${{ secrets.COOKIES_BUNDLE_5 }}
          COOKIES_BUNDLE_6: ${{ secrets.COOKIES_BUNDLE_6 }}
          COOKIES_BUNDLE_7: ${{ secrets.COOKIES_BUNDLE_7 }}
          COOKIES_BUNDLE_8: ${{ secrets.COOKIES_BUNDLE_8 }}
          COOKIES_BUNDLE_9: ${{ secrets.COOKIES_BUNDLE_9 }}
          COOKIES_BUNDLE_10: ${{ secrets.COOKIES_BUNDLE_10 }}
          COOKIES_BUNDLE_11: ${{ secrets.COOKIES_BUNDLE_11 }}
          SHOW_FILTER: ${{ matrix.shows }}
          CONTENT_TIER_FILTER: truncated
          EXCLUDE_DOMAINS: ${{ inputs.exclude_domains }}
          BATCH_SIZE: '10'
          MAX_REVIEWS: ${{ inputs.max_per_job }}
          RETRY_FAILED: ${{ inputs.retry_failed && 'true' || 'false' }}
          ARCHIVE_FIRST: 'true'
          COMMIT_EVERY: '25'
        run: node scripts/collect-review-texts.js --aggressive

      - name: Validate data
        if: always()
        run: node scripts/validate-data.js
        continue-on-error: true

      - name: Check for large files
        if: always()
        uses: ./.github/actions/check-file-sizes


      - name: Push review-texts to private repo
        if: always()
        uses: ./.github/actions/push-review-texts
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
          message: "data: Re-scrape Truncated Reviews — Commit and push (partition ${{ matrix.partition }})"
      - name: Commit and push (partition ${{ matrix.partition }})
        if: always()
        run: |
          git add data/archives/reviews/ data/audit/ data/collection-state/ || true
          if git diff --staged --quiet; then
            echo "No changes to commit for partition ${{ matrix.partition }}"
          else
            git commit -m "feat: Re-scrape truncated review texts (partition ${{ matrix.partition }}/${{ inputs.parallel_jobs }})

          Co-Authored-By: GitHub Action <action@github.com>"
            bash scripts/lib/push-with-retry.sh
          fi

      - name: Upload collection report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: truncated-report-partition-${{ matrix.partition }}
          path: |
            data/audit/validation/collection-report-*.json
            data/collection-state/progress.json
          retention-days: 30

  rebuild:
    if: ${{ inputs.dry_run != true && always() }}
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0



      - name: Checkout core data
        uses: ./.github/actions/checkout-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
      - name: Checkout review-texts (private repo)
        uses: ./.github/actions/checkout-review-texts
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Configure git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Rebuild reviews.json
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/rebuild-all-reviews.js


      - name: Push review-texts to private repo
        if: always()
        uses: ./.github/actions/push-review-texts
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
          message: "data: Re-scrape Truncated Reviews — Commit rebuilt reviews.json"
      - name: Commit rebuilt reviews.json
        if: always()
        run: |
          git add data/audit/
          if git diff --staged --quiet; then
            echo "No changes to reviews.json"
          else
            git commit -m "data: Auto-rebuild reviews.json (truncated re-scrape)"
            git pull --rebase origin main || {
              git rebase --abort 2>/dev/null || true
              git pull --no-rebase -X ours origin main
            }
            git push || echo "::warning::Push failed — collected data may not have synced"
          fi


      - name: Push core data to private repo
        if: always()
        uses: ./.github/actions/push-core-data
        with:
          token: ${{ secrets.REVIEW_TEXTS_TOKEN }}
          message: 'data: Update from rescrape-truncated'
      - name: Count remaining and chain
        if: always()
        id: chain
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REMAINING=$(node -e "
            const fs = require('fs'), path = require('path');
            const base = 'data/review-texts';
                        // Load global failed-fetches to exclude permanently failed URLs
            let failedUrls = new Set();
            const globalFF = path.join(base, 'failed-fetches.json');
            if (fs.existsSync(globalFF)) {
              try {
                const ff = JSON.parse(fs.readFileSync(globalFF, 'utf8'));
                (Array.isArray(ff) ? ff : Object.values(ff)).forEach(e => {
                  if (!e.url || e.failureReason === 'garbage_content') return;
                  const isDead = e.failureReason === 'url_dead_404' || e.failureReason === 'url_dead_410';
                  if (e.failureCount >= (isDead ? 3 : 5)) failedUrls.add(e.url);
                });
              } catch {}
            }
            let n = 0;
            const dirs = fs.readdirSync(base).filter(d => {
              try { return fs.statSync(path.join(base, d)).isDirectory(); } catch { return false; }
            });
            dirs.forEach(d => {
              fs.readdirSync(path.join(base, d)).filter(f => f.endsWith('.json') && f !== 'failed-fetches.json').forEach(f => {
                try {
                  const r = JSON.parse(fs.readFileSync(path.join(base, d, f), 'utf8'));
                  if (r.wrongProduction || r.wrongShow || r.wrongAttribution) return;
                  if (!r.url) return;
                  if (failedUrls.has(r.url)) return;
                  const isTruncated = r.textQuality === 'truncated' || r.textStatus === 'truncated'
                    || r.contentTier === 'truncated' || r.contentTier === 'needs-rescrape';
                  if (isTruncated) n++;
                } catch(e) {}
              });
            });
            console.log(n);
          ")
          echo "remaining=$REMAINING" >> $GITHUB_OUTPUT
          CURRENT=${{ inputs.current_round }}
          MAX=${{ inputs.max_rounds }}
          echo "Remaining: $REMAINING truncated reviews, round $CURRENT of $MAX"
          if [ "$REMAINING" -gt 50 ] && [ "$CURRENT" -lt "$MAX" ]; then
            NEXT=$((CURRENT + 1))
            echo "Chaining round $NEXT..."
            gh workflow run rescrape-truncated.yml \
              -f parallel_jobs=${{ inputs.parallel_jobs }} \
              -f max_per_job=${{ inputs.max_per_job }} \
              -f retry_failed=${{ inputs.retry_failed }} \
              -f exclude_domains="${{ inputs.exclude_domains }}" \
              -f max_rounds=$MAX \
              -f current_round=$NEXT
            echo "chained=true" >> $GITHUB_OUTPUT
          else
            echo "No chaining needed (remaining=$REMAINING, round=$CURRENT/$MAX)"
            echo "chained=false" >> $GITHUB_OUTPUT
          fi

      - name: Summary
        run: |
          echo "## Truncated Re-scrape Round ${{ inputs.current_round }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Re-scraped truncated review texts across ${{ inputs.parallel_jobs }} parallel jobs." >> $GITHUB_STEP_SUMMARY
          echo "- **Remaining:** ${{ steps.chain.outputs.remaining }} truncated reviews" >> $GITHUB_STEP_SUMMARY
          echo "- **Chained next round:** ${{ steps.chain.outputs.chained }}" >> $GITHUB_STEP_SUMMARY
      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: 'Rescrape Truncated Failed'
          severity: 'warning'
          discord_webhook: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
