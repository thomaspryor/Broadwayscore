name: PostHog Weekly Insights
on:
  # Schedule disabled — replaced by posthog-monday.yml (Mon 08:00 UTC)
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  insights:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
      - name: Query PostHog and create issue
        env:
          POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/posthog-weekly-insights.js
      - name: Notify on failure
        if: failure()
        uses: ./.github/actions/notify-failure
        with:
          title: 'PostHog Weekly Insights Failed'
          discord_webhook: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
