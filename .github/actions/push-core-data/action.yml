name: Push core data
description: Commits and pushes core data changes to the private repo

inputs:
  token:
    description: PAT for private repo access
    required: true
  message:
    description: Commit message
    required: false
    default: 'data: Update core data'

runs:
  using: composite
  steps:
    - name: Sync only modified core data files to checkout
      shell: bash
      run: |
        # SAFETY: Only copy files that the workflow actually modified.
        # Compares data/ (post-script) against the original checkout (cloned at
        # workflow start). Prevents stale copies of unmodified files from
        # overwriting concurrent updates by other workflows.
        MODIFIED=""
        for f in shows.json reviews.json grosses.json grosses-history.json commercial.json audience-buzz.json critic-consensus.json critic-registry.json outlet-registry.json; do
          if [ -f "data/$f" ]; then
            if [ ! -f "/tmp/core-data-checkout/$f" ]; then
              # New file — always copy
              cp -f "data/$f" /tmp/core-data-checkout/
              MODIFIED="$MODIFIED $f"
              echo "  New file: $f"
            elif ! diff -q "data/$f" "/tmp/core-data-checkout/$f" > /dev/null 2>&1; then
              # File was modified by this workflow
              cp -f "data/$f" /tmp/core-data-checkout/
              MODIFIED="$MODIFIED $f"
              echo "  Modified: $f"
            fi
          fi
        done
        if [ -z "$MODIFIED" ]; then
          echo "No core data files were modified by this workflow — skipping push"
        else
          echo "Files to push:$MODIFIED"
        fi

    - name: Commit and push core data
      shell: bash
      working-directory: /tmp/core-data-checkout
      env:
        CORE_DATA_TOKEN: ${{ inputs.token }}
        COMMIT_MSG: ${{ inputs.message }}
      run: |
        if [ ! -d ".git" ]; then
          echo "::warning::Core data checkout not found — skipping push (checkout may have failed)"
          exit 0
        fi

        git config user.name "GitHub Action"
        git config user.email "action@github.com"
        git remote set-url origin "https://x-access-token:${CORE_DATA_TOKEN}@github.com/thomaspryor/broadway-scorecard-data.git"

        git add -A

        if git diff --staged --quiet; then
          echo "No core data changes to push"
          exit 0
        fi

        CHANGED=$(git diff --staged --stat | tail -1)
        git commit -m "${COMMIT_MSG}" -m "Changed: ${CHANGED}"

        for i in 1 2 3 4 5; do
          # Use -X ours: locally-rebuilt derived data (reviews.json etc.) should
          # take precedence over remote state, since rebuilds are serialized via
          # concurrency group and always produce the most up-to-date version.
          if git pull --rebase -X ours origin main && git push origin main; then
            echo "Core data pushed successfully (attempt $i)"
            exit 0
          fi
          git rebase --abort 2>/dev/null || true
          sleep $((RANDOM % 10 + 5))
        done

        echo "WARNING: Failed to push core data after 5 attempts"
        exit 1
