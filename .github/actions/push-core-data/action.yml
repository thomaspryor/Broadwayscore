name: Push core data
description: Commits and pushes core data changes to the private repo

inputs:
  token:
    description: PAT for private repo access
    required: true
  message:
    description: Commit message
    required: false
    default: 'data: Update core data'

runs:
  using: composite
  steps:
    # Notion 362637c5-416f-8174 — refuse to push if a prior step in this job
    # signalled "data is bad." validate-data.js writes ${RUNNER_TEMP}/.skip-push-core-data
    # when it exits 1. Without this gate, 64 workflows using push-core-data with
    # `if: always()` would push corrupt rows even after validate failed (because
    # the gate was on the public-repo commit step only). One-line cost; no
    # per-workflow edits required.
    #
    # IMPORTANT: in GitHub Actions composite actions, `exit 0` in one step does NOT
    # skip subsequent steps — only `exit 1` halts execution. So this step sets a
    # step output, and the two real steps below gate on it via `if:`.
    - name: Refuse if prior validation failed
      id: refusal-check
      shell: bash
      run: |
        SENTINEL="${RUNNER_TEMP:-/tmp}/.skip-push-core-data"
        if [ -f "$SENTINEL" ]; then
          echo "::warning::push-core-data refused — prior step (likely validate-data.js) signalled bad data. See $SENTINEL for details."
          # Bound the cat: sentinel files should be tiny (~200 bytes), but defend against runaway error blobs.
          head -c 4096 "$SENTINEL" 2>/dev/null || true
          echo "skip=true" >> "$GITHUB_OUTPUT"
        else
          echo "skip=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Sync core data files to checkout
      if: steps.refusal-check.outputs.skip != 'true'
      shell: bash
      run: |
        # Copy ONLY files this workflow actually modified during the run.
        # Baseline: /tmp/core-data-snapshot/ — written by checkout-core-data at
        # checkout time (checkout-core-data/action.yml, "Copy core data to data/").
        # A file identical to its snapshot was NOT touched by this workflow;
        # copying it back would push content that is stale by the workflow's
        # entire runtime, silently reverting any concurrent push that landed
        # mid-run. Incident 2026-07-13: fetch-guardian-reviews reverted a
        # just-pushed commercial.json fix ~25 min after it landed — a file that
        # workflow never writes. (An earlier diff-based version was removed for
        # "silently missing changes" — it diffed against the wrong baseline.
        # The snapshot IS the correct baseline.)
        #
        # Decision table is mirrored + pinned in
        # scripts/lib/core-data-sync-decision.js and
        # tests/unit/core-data-sync-decision.test.mjs — change both together.
        CORE_FILES="shows.json reviews.json grosses.json grosses-history.json commercial.json audience-buzz.json critic-consensus.json critic-registry.json outlet-registry.json diary-shows.json audience-reviews-lbo.json opening-night-sent.json followers.json subscribers.json subscribers-westend.json awards.json"
        # Manifest of files this workflow actually modified — consumed by the
        # "Commit and push core data" step below to decide whether the
        # per-slug reconciliation merge (commercial.json, diary-shows.json) is
        # safe to run. Same staleness class as the sync logic itself (see
        # comment below): a workflow that never touched a file has nothing
        # meaningful to contribute to a merge, and capturing its stale on-disk
        # copy as "ours" can out-vote a concurrent fix that landed on remote
        # mid-run (ties in mergeCommercialJson's pickNewer default to "ours").
        : > /tmp/.core-data-changed-files
        if [ ! -d "/tmp/core-data-snapshot" ]; then
          # Failsafe: no snapshot dir means we can't tell which files this
          # workflow modified (checkout-core-data predates snapshotting, or was
          # bypassed). Fall back to legacy copy-all rather than silently
          # pushing nothing — but warn, because copy-all can revert concurrent
          # pushes of files this workflow didn't touch.
          echo "::warning::/tmp/core-data-snapshot missing — cannot detect workflow-modified files; falling back to copy-all (may revert concurrent data pushes). Ensure checkout-core-data ran in this job."
          COPIED=""
          for f in $CORE_FILES; do
            if [ -f "data/$f" ]; then
              cp -f "data/$f" /tmp/core-data-checkout/
              COPIED="$COPIED $f"
              echo "$f" >> /tmp/.core-data-changed-files
            fi
          done
          echo "Synced core data files (copy-all fallback):$COPIED"
        else
          for f in $CORE_FILES; do
            if [ ! -f "data/$f" ]; then
              # Missing from data/ (e.g. reverted by `git checkout -- .`).
              # Hard skip — never restore from snapshot: a point-in-time
              # snapshot copied over the fresh checkout can also revert
              # concurrent pushes, and is a content no-op at best.
              echo "skipped (missing): $f"
            elif [ ! -f "/tmp/core-data-snapshot/$f" ]; then
              cp -f "data/$f" /tmp/core-data-checkout/
              echo "copied (new): $f"
              echo "$f" >> /tmp/.core-data-changed-files
            elif cmp -s "data/$f" "/tmp/core-data-snapshot/$f"; then
              echo "skipped (unchanged): $f"
            else
              cp -f "data/$f" /tmp/core-data-checkout/
              echo "copied (changed): $f"
              echo "$f" >> /tmp/.core-data-changed-files
            fi
          done
        fi

    - name: Commit and push core data
      if: steps.refusal-check.outputs.skip != 'true'
      shell: bash
      working-directory: /tmp/core-data-checkout
      env:
        CORE_DATA_TOKEN: ${{ inputs.token }}
        COMMIT_MSG: ${{ inputs.message }}
      run: |
        if [ ! -d ".git" ]; then
          echo "::warning::Core data checkout not found — skipping push (checkout may have failed)"
          exit 0
        fi

        git config user.name "GitHub Action"
        git config user.email "action@github.com"
        git remote set-url origin "https://x-access-token:${CORE_DATA_TOKEN}@github.com/thomaspryor/broadway-scorecard-data.git"

        # Validate JSON files before committing (catches conflict markers from stash/rebase)
        INVALID=0
        for f in *.json; do
          if [ -f "$f" ]; then
            if grep -q '<<<<<<' "$f" 2>/dev/null; then
              echo "::error::$f contains merge conflict markers — aborting commit"
              INVALID=1
            elif ! node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" 2>/dev/null; then
              echo "::error::$f is not valid JSON — aborting commit"
              INVALID=1
            fi
          fi
        done
        if [ "$INVALID" -ne 0 ]; then
          echo "::error::One or more core data files are invalid. Fix before retrying."
          exit 1
        fi

        # Recalculate audience-buzz combinedScores BEFORE committing. Any caller
        # that writes audience-buzz.json may have stored an uncalibrated
        # combinedScore (e.g., a scraper that bypassed audience-weighting.js).
        # This guarantees combinedScore + designation are always derived from
        # the current calibration logic before data leaves CI.
        if [ -f "audience-buzz.json" ] && [ -n "${GITHUB_WORKSPACE}" ]; then
          node -e '
            const path = require("path");
            const ws = process.env.GITHUB_WORKSPACE;
            const { calculateCombinedScore, getDesignation } = require(path.join(ws, "scripts/lib/audience-weighting"));
            const fs = require("fs");
            try {
              const audienceBuzz = JSON.parse(fs.readFileSync("audience-buzz.json", "utf8"));
              const showsData = fs.existsSync("shows.json") ? JSON.parse(fs.readFileSync("shows.json", "utf8")) : null;
              const showMap = {};
              if (showsData) for (const s of (showsData.shows || [])) showMap[s.id] = s;
              let updated = 0;
              for (const [showId, show] of Object.entries(audienceBuzz.shows || {})) {
                const showData = showMap[showId];
                const showInfo = showData ? { closingDate: showData.closingDate, status: showData.status, category: showData.category } : undefined;
                const { score } = calculateCombinedScore(show.sources, showInfo);
                if (score !== null && score !== show.combinedScore) {
                  show.combinedScore = score;
                  show.designation = getDesignation(score);
                  updated++;
                }
              }
              if (updated > 0) {
                fs.writeFileSync("audience-buzz.json", JSON.stringify(audienceBuzz, null, 2) + "\n");
                console.log("Pre-commit: recalculated combinedScore for " + updated + " shows");
              }
            } catch (e) {
              console.error("Pre-commit recalc failed (non-fatal):", e.message);
            }
          ' 2>&1 || true
        fi

        git add -A

        if git diff --staged --quiet; then
          echo "No core data changes to push"
          exit 0
        fi

        CHANGED=$(git diff --staged --stat | tail -1)
        git commit -m "${COMMIT_MSG}" -m "Changed: ${CHANGED}"

        # Save our audience-buzz.json before push attempts (for reconciliation)
        if [ -f "audience-buzz.json" ]; then
          cp audience-buzz.json /tmp/our-audience-buzz.json
        fi

        for i in 1 2 3 4 5; do
          if git push origin main; then
            echo "Core data pushed successfully (attempt $i)"
            exit 0
          fi

          # Push failed — another workflow pushed first. Fetch their version
          # before rebasing so we can reconcile JSON data.
          git fetch origin main 2>/dev/null || true

          # Save remote's audience-buzz.json before rebase overwrites it
          git show origin/main:audience-buzz.json > /tmp/remote-audience-buzz.json 2>/dev/null || true

          # Save remote's shows.json before rebase overwrites it
          git show origin/main:shows.json > /tmp/remote-shows.json 2>/dev/null || true

          # Save remote's commercial.json + commercial-pending-review.json
          # before rebase overwrites them. With RSS poller + scraper + sweep
          # all writing to these, multi-writer concurrency demands a real merge.
          # Ship-check CDX-P0-2.
          #
          # Guard: only capture "ours" (and therefore only run the merge) for
          # commercial.json if this workflow's Sync step actually copied it
          # into the checkout (see /tmp/.core-data-changed-files, written
          # above). If this job never touched commercial.json, "ours" is
          # whatever was on disk at checkout time — possibly tens of minutes
          # stale — and merging it against remote can out-vote a fix that
          # landed on remote mid-run (mergeCommercialJson's pickNewer defaults
          # to "ours" on a tie, e.g. a manual field-only edit that didn't bump
          # lastUpdated). Without this guard, the rebase above already
          # resolves correctly on its own — our commit has no diff for an
          # untouched file, so there's no conflict and remote's content
          # simply carries through. Card #268, 2026-07-21:
          # opening-night-poller's fast_path job never writes commercial.json,
          # yet its stale "ours" snapshot reverted a concurrent one-line fix
          # via this exact merge.
          #
          # commercial-pending-review.json is intentionally NOT gated the same
          # way: it isn't in CORE_FILES (see Sync step above), so the Sync
          # step never syncs it from data/ and the manifest never carries an
          # entry for it — there is no reliable "did this job touch it"
          # signal to gate on. Capturing it unconditionally here matches its
          # pre-existing (already-imprecise, separately tracked) behavior;
          # tying its capture to commercial.json's manifest flag would be an
          # arbitrary coupling between two unrelated files (ship-check
          # finding, 2026-07-21).
          if grep -qxF "commercial.json" /tmp/.core-data-changed-files 2>/dev/null; then
            git show origin/main:commercial.json > /tmp/remote-commercial.json 2>/dev/null || true
            [ -f "commercial.json" ] && cp commercial.json /tmp/our-commercial.json
          fi
          git show origin/main:commercial-pending-review.json > /tmp/remote-commercial-pending.json 2>/dev/null || true
          [ -f "commercial-pending-review.json" ] && cp commercial-pending-review.json /tmp/our-commercial-pending.json

          # Save remote's diary-shows.json + our pre-rebase copy. diary-shows.json
          # is an array-of-shows with THREE independent writers (import-mezzanine-
          # historical, resolve-unmatched-imports nightly, refresh-mezzanine-catalog
          # weekly). -X ours alone silently drops the side that lost the race's
          # newly-added shows — same data-loss class as commercial.json (card #176).
          # Same staleness guard as commercial.json above (card #268).
          if grep -qxF "diary-shows.json" /tmp/.core-data-changed-files 2>/dev/null; then
            git show origin/main:diary-shows.json > /tmp/remote-diary-shows.json 2>/dev/null || true
            [ -f "diary-shows.json" ] && cp diary-shows.json /tmp/our-diary-shows.json
          fi

          # Rebase with -X ours: our version wins on conflicts.
          # Post-rebase reconciliation below restores any remote-only changes
          # that -X ours silently dropped (manual corrections to shows.json, audience-buzz).
          if ! git pull --rebase -X ours origin main; then
            git rebase --abort 2>/dev/null || true
            sleep $((RANDOM % 10 + 5))
            continue
          fi

          # Reconcile shows.json: restore manually-correctable fields from remote
          # that -X ours may have dropped. Only restores a safelist of fields that
          # are typically set by manual corrections (venue, synopsis, dates, runtime).
          # Excludes derived/internal fields (_meta, lastUpdated, tags, images) and
          # fields that may be intentionally nulled (closingDate clearing, etc.).
          # Date fields (openingDate, previewsStartDate, openingDateSource) are on
          # the safelist as of 2026-04-28 — without them, parallel crons writing
          # date corrections (e.g. enrich-west-end-dates, the new OB equivalent)
          # silently lost their work on rebase races. See KENREX 2026-04-28 root
          # cause and memory/feedback_off_broadway_opening_date_gap.md.
          # humanCorrectedClosingDate added 2026-05-24 — when a human manually
          # fixes a closingDate via the private repo, the flag tells all auto-
          # writers to skip. Reconciling it here means a concurrent push by an
          # auto-writer can't drop the flag on rebase. See
          # scripts/lib/closing-date-guard.js.
          if [ -f "/tmp/remote-shows.json" ] && [ -f "shows.json" ]; then
            node -e '
              const fs = require("fs");
              // Only reconcile fields that are manually corrected, never auto-generated
              const RECONCILABLE = new Set([
                "venue", "synopsis", "runtime", "intermissions", "ageRecommendation",
                "officialUrl", "wikipediaUrl", "ibdbUrl",
                "openingDate", "previewsStartDate", "openingDateSource",
                "humanCorrectedClosingDate",
              ]);
              try {
                const local = JSON.parse(fs.readFileSync("shows.json", "utf8"));
                const remote = JSON.parse(fs.readFileSync("/tmp/remote-shows.json", "utf8"));
                const localMap = {};
                for (const s of (local.shows || [])) localMap[s.id] = s;
                let recovered = 0;
                for (const rs of (remote.shows || [])) {
                  const ls = localMap[rs.id];
                  if (!ls) continue;
                  for (const key of RECONCILABLE) {
                    const val = rs[key];
                    if (val !== null && val !== undefined && (ls[key] === null || ls[key] === undefined)) {
                      ls[key] = val;
                      recovered++;
                    }
                  }
                }
                if (recovered > 0) {
                  fs.writeFileSync("shows.json", JSON.stringify(local, null, 2) + "\n");
                  console.log("Reconciled " + recovered + " fields from remote shows.json");
                }
              } catch (e) {
                console.error("Shows reconciliation failed (non-fatal):", e.message);
              }
            ' 2>&1 || true
          fi

          # Reconcile audience-buzz.json: merge show-level entries from remote
          # that our -X ours rebase may have dropped. This prevents concurrent
          # audience-buzz writers from clobbering each other's work.
          if [ -f "/tmp/our-audience-buzz.json" ] && [ -f "/tmp/remote-audience-buzz.json" ]; then
            node -e '
              const fs = require("fs");
              try {
                const ours = JSON.parse(fs.readFileSync("/tmp/our-audience-buzz.json", "utf8"));
                const remote = JSON.parse(fs.readFileSync("/tmp/remote-audience-buzz.json", "utf8"));
                const current = JSON.parse(fs.readFileSync("audience-buzz.json", "utf8"));
                const shows = current.shows || {};
                const remoteShows = remote.shows || {};
                let recovered = 0;
                for (const [id, entry] of Object.entries(remoteShows)) {
                  if (!shows[id]) {
                    // Remote has a show we dont — keep it
                    shows[id] = entry;
                    recovered++;
                  } else {
                    // Both have this show — merge sources we are missing
                    const ourSrc = shows[id].sources || {};
                    const remoteSrc = entry.sources || {};
                    for (const [src, data] of Object.entries(remoteSrc)) {
                      if (data && data.score != null && (!ourSrc[src] || ourSrc[src].score == null)) {
                        ourSrc[src] = data;
                        recovered++;
                      }
                    }
                    shows[id].sources = ourSrc;
                  }
                }
                if (recovered > 0) {
                  current.shows = shows;
                  fs.writeFileSync("audience-buzz.json", JSON.stringify(current, null, 2) + "\n");
                  console.log("Reconciled " + recovered + " entries from remote audience-buzz.json");
                }
              } catch (e) {
                console.error("Reconciliation failed (non-fatal):", e.message);
              }
            ' 2>&1 || true

            # Recalculate combinedScores after source merging so calibration
            # and weighting are always correctly applied (not just copied from source).
            if [ -f "audience-buzz.json" ] && [ -n "${GITHUB_WORKSPACE}" ]; then
              node -e '
                const path = require("path");
                const ws = process.env.GITHUB_WORKSPACE;
                const { calculateCombinedScore, getDesignation } = require(path.join(ws, "scripts/lib/audience-weighting"));
                const fs = require("fs");
                try {
                  const audienceBuzz = JSON.parse(fs.readFileSync("audience-buzz.json", "utf8"));
                  const showsData = fs.existsSync("shows.json") ? JSON.parse(fs.readFileSync("shows.json", "utf8")) : null;
                  const showMap = {};
                  if (showsData) for (const s of (showsData.shows || [])) showMap[s.id] = s;
                  let updated = 0;
                  for (const [showId, show] of Object.entries(audienceBuzz.shows || {})) {
                    const showData = showMap[showId];
                    const showInfo = showData ? { closingDate: showData.closingDate, status: showData.status, category: showData.category } : undefined;
                    const { score } = calculateCombinedScore(show.sources, showInfo);
                    if (score !== null && score !== show.combinedScore) {
                      show.combinedScore = score;
                      show.designation = getDesignation(score);
                      updated++;
                    }
                  }
                  if (updated > 0) {
                    fs.writeFileSync("audience-buzz.json", JSON.stringify(audienceBuzz, null, 2) + "\n");
                    console.log("Recalculated combinedScore for " + updated + " shows");
                  }
                } catch (e) {
                  console.error("Recalculate failed (non-fatal):", e.message);
                }
              ' 2>&1 || true
            fi

            # Re-stage and amend if audience-buzz reconciliation changed the file
            if ! git diff --quiet audience-buzz.json 2>/dev/null; then
              git add audience-buzz.json
              git commit --amend --no-edit
              echo "Amended commit with reconciled audience-buzz.json"
            fi
          fi

          # Re-stage shows.json if reconciliation changed it (outside audience-buzz guard)
          if ! git diff --quiet shows.json 2>/dev/null; then
            git add shows.json
            git commit --amend --no-edit
            echo "Amended commit with reconciled shows.json"
          fi

          # Reconcile commercial.json + commercial-pending-review.json. Both
          # are per-slug dictionaries written by multiple workflows (Friday
          # scraper, Saturday orchestrator, RSS poller, closing-stale
          # classifier). -X ours alone would silently lose slugs added on the
          # other side. mergeCommercialJson preserves humanReviewed* flags
          # from the loser side so manual corrections always survive.
          if [ -f "/tmp/our-commercial.json" ] && [ -f "/tmp/remote-commercial.json" ] && [ -f "commercial.json" ]; then
            node -e '
              const path = require("path");
              const ws = process.env.GITHUB_WORKSPACE;
              const fs = require("fs");
              try {
                const { mergeCommercialJson } = require(path.join(ws, "scripts/lib/merge-commercial-data"));
                const ours = JSON.parse(fs.readFileSync("/tmp/our-commercial.json", "utf8"));
                const remote = JSON.parse(fs.readFileSync("/tmp/remote-commercial.json", "utf8"));
                const { merged, stats } = mergeCommercialJson(ours, remote);
                fs.writeFileSync("commercial.json", JSON.stringify(merged, null, 2) + "\n");
                console.log("Reconciled commercial.json: " + JSON.stringify(stats));
              } catch (e) {
                console.error("commercial.json reconciliation failed (non-fatal):", e.message);
              }
            ' 2>&1 || true
            if ! git diff --quiet commercial.json 2>/dev/null; then
              git add commercial.json
              git commit --amend --no-edit
              echo "Amended commit with reconciled commercial.json"
            fi
          fi
          if [ -f "/tmp/our-commercial-pending.json" ] && [ -f "/tmp/remote-commercial-pending.json" ] && [ -f "commercial-pending-review.json" ]; then
            node -e '
              const path = require("path");
              const ws = process.env.GITHUB_WORKSPACE;
              const fs = require("fs");
              try {
                const { mergePendingReview } = require(path.join(ws, "scripts/lib/merge-commercial-data"));
                const ours = JSON.parse(fs.readFileSync("/tmp/our-commercial-pending.json", "utf8"));
                const remote = JSON.parse(fs.readFileSync("/tmp/remote-commercial-pending.json", "utf8"));
                const { merged, stats } = mergePendingReview(ours, remote);
                fs.writeFileSync("commercial-pending-review.json", JSON.stringify(merged, null, 2) + "\n");
                console.log("Reconciled commercial-pending-review.json: " + JSON.stringify(stats));
              } catch (e) {
                console.error("commercial-pending-review.json reconciliation failed (non-fatal):", e.message);
              }
            ' 2>&1 || true
            if ! git diff --quiet commercial-pending-review.json 2>/dev/null; then
              git add commercial-pending-review.json
              git commit --amend --no-edit
              echo "Amended commit with reconciled commercial-pending-review.json"
            fi
          fi

          # Reconcile diary-shows.json. Array-of-shows keyed by mezzanineId, with
          # three independent append/update-only writers (import-mezzanine-
          # historical, resolve-unmatched-imports, refresh-mezzanine-catalog).
          # -X ours would keep only our side wholesale, silently dropping any
          # shows the other side added. mergeDiaryShows unions both sides by
          # mezzanineId (fallback id); ours wins on shared keys (matches -X ours),
          # remote-only shows are re-added. Card #176 (same class as CDX-P0-2).
          if [ -f "/tmp/our-diary-shows.json" ] && [ -f "/tmp/remote-diary-shows.json" ] && [ -f "diary-shows.json" ]; then
            node -e '
              const path = require("path");
              const ws = process.env.GITHUB_WORKSPACE;
              const fs = require("fs");
              try {
                const { mergeDiaryShows } = require(path.join(ws, "scripts/lib/merge-diary-shows"));
                const ours = JSON.parse(fs.readFileSync("/tmp/our-diary-shows.json", "utf8"));
                const remote = JSON.parse(fs.readFileSync("/tmp/remote-diary-shows.json", "utf8"));
                const { merged, stats } = mergeDiaryShows(ours, remote);
                // Match the three writers on-disk format (no trailing newline)
                // so a no-op merge produces a byte-identical file and skips the amend.
                fs.writeFileSync("diary-shows.json", JSON.stringify(merged, null, 2));
                console.log("Reconciled diary-shows.json: " + JSON.stringify(stats));
              } catch (e) {
                console.error("diary-shows.json reconciliation failed (non-fatal):", e.message);
              }
            ' 2>&1 || true
            if ! git diff --quiet diary-shows.json 2>/dev/null; then
              git add diary-shows.json
              git commit --amend --no-edit
              echo "Amended commit with reconciled diary-shows.json"
            fi
          fi

          sleep $((RANDOM % 10 + 5))
        done

        echo "WARNING: Failed to push core data after 5 attempts"
        exit 1
