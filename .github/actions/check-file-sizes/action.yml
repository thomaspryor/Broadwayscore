name: 'Check File Sizes'
description: 'Block commits containing unexpectedly large files (e.g., SQLite DB, binaries)'
runs:
  using: 'composite'
  steps:
    - name: Block large files before commit
      shell: bash
      run: |
        # Check ONLY staged files >5MB in data/.
        # IMPORTANT: Previous version used `find data/` which scanned ALL files on disk
        # including gitignored ones. This caused 5 consecutive scoring failures (March 2026)
        # when gitignored diary-shows.json (13MB) and mezzanine-productions-raw.json
        # blocked every workflow that used this check.
        LARGE=""
        while IFS= read -r file; do
          [ -z "$file" ] && continue
          if [ -f "$file" ]; then
            SIZE=$(stat --format=%s "$file" 2>/dev/null || stat -f%z "$file" 2>/dev/null || echo 0)
            if [ "$SIZE" -gt 5242880 ]; then
              LARGE="${LARGE}${file} (${SIZE} bytes)
        "
            fi
          fi
        done <<< "$(git diff --cached --name-only --diff-filter=ACM 2>/dev/null | grep '^data/' || true)"

        if [ -n "$LARGE" ]; then
          echo "::error::Large staged files detected that should not be committed:"
          echo "$LARGE"
          echo ""
          echo "If this is a legitimate data file, add it to the private core-data repo instead."
          exit 1
        fi
        echo "File size check passed (staged files only)"
