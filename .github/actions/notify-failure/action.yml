name: Notify on failure
description: Send email alert when a workflow fails (with 2-hour cooldown per workflow)

inputs:
  title:
    description: Alert title (e.g., "Weekly Grosses Failed")
    required: true
  description:
    description: Optional extra context (action required, likely cause)
    required: false
    default: ''
  severity:
    description: >-
      '"critical" sends a real-time email (if configured) ONLY for workflows listed in
      scripts/lib/page-worthy-alerts.js PAGE_WORTHY_WORKFLOWS (BRO-4603); any other
      value, or an unlisted workflow, never emails. Failures still reach the morning
      digest via check-cron-health.yml / health-check.js.'
    required: false
    default: 'low'
  email:
    description: Also send email alert (for critical pipelines)
    required: false
    default: 'false'
  discord_webhook:
    description: 'Unused — kept for backwards compatibility with existing callers.'
    required: false
    default: ''
  resend_api_key:
    description: Resend API key (required if email=true)
    required: false
    default: ''
  owner_email:
    description: Owner email (required if email=true)
    required: false
    default: ''
  cooldown_minutes:
    description: 'Minutes to suppress duplicate alerts for the same workflow (default: 120)'
    required: false
    default: '120'
  min_consecutive_failures:
    description: >-
      Only alert once this many CONSECUTIVE completed runs have failed (default 1 =
      alert on every failure). Set '2' for high-frequency crons (30-45 min cadence)
      whose one-off failures self-resolve on the next run — a single push-contention
      or scraper blip never pages; persistent breakage still does (the next failed
      run alerts). Cancelled/skipped runs don't reset the streak.
    required: false
    default: '1'

outputs:
  suppressed:
    description: >-
      'true' whenever this call did not page: non-critical severity, a workflow
      not on the page-worthy list, cooldown, or consecutive-failure grace.
      Gate follow-up steps (e.g. investigation dispatch) on this != 'true' so they
      only fire when the failure actually paged. (Before BRO-4603 a non-critical
      call left this EMPTY, so `!= 'true'` let investigate-alert.yml email anyway.)
    value: ${{ steps.policy.outputs.page != 'true' && 'true' || steps.cooldown.outputs.suppressed }}

runs:
  using: composite
  steps:
    # BRO-4603: the owner's page-worthy policy runs FIRST, before the streak and
    # cooldown branches below (streak mode returns early, so a check placed
    # after it would never run for min_consecutive_failures callers). Only
    # workflows in scripts/lib/page-worthy-alerts.js PAGE_WORTHY_WORKFLOWS may
    # email; tests/unit/page-worthy-workflows.test.mjs keeps the YAML severities
    # equal to that list. Fails OPEN (pages) if the policy file can't be read.
    - name: Page-worthiness policy
      id: policy
      uses: actions/github-script@v7
      # Via env, not ${{ }} inside the script: this step runs for EVERY caller,
      # and a title carrying a workflow input (e.g. a show id) with a backtick
      # would otherwise break the script and leave `page` empty.
      env:
        NOTIFY_SEVERITY: ${{ inputs.severity }}
        NOTIFY_TITLE: ${{ inputs.title }}
      with:
        script: |
          const severity = process.env.NOTIFY_SEVERITY || '';
          const title = process.env.NOTIFY_TITLE || '';
          if (severity !== 'critical') {
            core.setOutput('page', 'false');
            return;
          }
          const ref = process.env.GITHUB_WORKFLOW_REF || '';
          const fileMatch = ref.match(/\.github\/workflows\/([^@]+)/);
          if (!fileMatch) {
            console.log(`[Alert policy] could not read the workflow file from GITHUB_WORKFLOW_REF ('${ref}') — failing open (may page).`);
            core.setOutput('page', 'true');
            return;
          }
          const workflowFile = fileMatch[1];
          let pageWorthy = true;
          try {
            pageWorthy = require('./scripts/lib/page-worthy-alerts.js').isPageWorthyWorkflow(workflowFile);
          } catch (e) {
            console.log(`[Alert policy] page-worthy-alerts.js unavailable (${e.message}) — failing open (may page).`);
          }
          if (!pageWorthy) {
            const msg = `${workflowFile} is not on the owner's page-worthy list (scripts/lib/page-worthy-alerts.js PAGE_WORTHY_WORKFLOWS) — no email. The morning digest reports this failure.`;
            console.log(`[Alert policy] ${msg}`);
            if (process.env.GITHUB_STEP_SUMMARY) {
              require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY, `\n> 🔕 **${title}** — ${msg}\n`);
            }
          }
          core.setOutput('page', pageWorthy ? 'true' : 'false');

    - name: Check cooldown
      id: cooldown
      if: steps.policy.outputs.page == 'true'
      uses: actions/github-script@v7
      with:
        script: |
          const workflowName = context.workflow;
          const cooldownMinutes = parseInt('${{ inputs.cooldown_minutes }}') || 120;
          const minConsecutive = parseInt('${{ inputs.min_consecutive_failures }}') || 1;

          try {
            // context.workflow is the display name (e.g., "Test Suite"), but
            // listWorkflowRuns needs the filename or numeric ID. Extract the
            // filename from the workflow_ref which looks like:
            //   owner/repo/.github/workflows/test.yml@refs/heads/main
            const ref = process.env.GITHUB_WORKFLOW_REF || '';
            const fileMatch = ref.match(/\.github\/workflows\/([^@]+)/);
            const workflowFile = fileMatch ? fileMatch[1] : workflowName;

            if (minConsecutive > 1) {
              // Streak mode (high-frequency crons): a one-off failure that
              // self-resolves on the next run never pages. Page when the streak of
              // consecutive failed runs reaches minConsecutive, then re-page every
              // 4th failure past it (reminder for long outages; also self-corrects
              // if the threshold-hitting run's notify was cancelled or raced —
              // "page exactly at ==threshold" can go permanently dark in those
              // cases, so periodic re-arm is deliberate).
              // The time cooldown below is NOT also applied: it counts failures
              // that never alerted (the graced first one), so combining the two
              // would suppress every page of a real streak.
              // NO inner .catch here: an API error must fall through to the outer
              // catch and alert (fail open) — swallowing it would suppress pages
              // for entire outages whenever the API is rate-limited.
              const recent = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: workflowFile,
                status: 'completed',
                per_page: 30,
              });
              // Cancelled/skipped runs say nothing about health — they neither
              // extend nor reset the streak.
              // Sort by COMPLETION time (updated_at), not created_at: runs of
              // high-frequency crons overlap, and in creation order an
              // interleaved success keeps resetting the streak to exactly the
              // threshold, re-paging on every failure pair (2026-08-03 storm:
              // two "streak 2" pages in 28 min). In completion order a recent
              // success correctly suppresses transient races, while a real
              // outage — nothing but failures completing — still pages.
              const prior = (recent.data.workflow_runs || [])
                .filter(r => r.id !== context.runId)
                .filter(r => !['cancelled', 'skipped'].includes(r.conclusion))
                .sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at));
              let streak = 1; // this run
              for (const r of prior) {
                if (r.conclusion === 'failure') streak++;
                else break;
              }
              const pastThreshold = streak - minConsecutive;
              if (pastThreshold >= 0 && pastThreshold % 4 === 0) {
                console.log(`[Streak] ${streak} consecutive failure(s) — threshold ${minConsecutive} reached, alerting.`);
                core.setOutput('suppressed', 'false');
              } else {
                const why = streak < minConsecutive
                  ? `first failure in streak — pages if the next run also fails`
                  : `streak paged at ${minConsecutive} — next reminder at ${streak + (4 - pastThreshold % 4)} consecutive failures`;
                console.log(`[Streak] ${streak} consecutive failure(s) (threshold ${minConsecutive}) — suppressing: ${why}.`);
                if (process.env.GITHUB_STEP_SUMMARY) {
                  require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY,
                    `\n> ⏳ **Alert suppressed** (${why}).\n`);
                }
                core.setOutput('suppressed', 'true');
              }
              return;
            }

            // Default mode: 2h time cooldown per workflow.
            const cutoff = new Date(Date.now() - cooldownMinutes * 60 * 1000);
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: workflowFile,
              status: 'failure',
              per_page: 5,
              created: `>=${cutoff.toISOString().split('T')[0]}`
            }).catch(() => ({ data: { workflow_runs: [] } }));

            // Count how many failed runs happened in the cooldown window
            const recentFailures = (runs.data.workflow_runs || []).filter(r => {
              const created = new Date(r.created_at);
              return created >= cutoff && r.id !== context.runId;
            });

            if (recentFailures.length > 0) {
              // Another failure already happened in the cooldown window — it would have alerted
              console.log(`[Cooldown] ${recentFailures.length} other failure(s) for "${workflowName}" in last ${cooldownMinutes}min. Suppressing duplicate alert.`);
              core.setOutput('suppressed', 'true');
            } else {
              core.setOutput('suppressed', 'false');
            }
          } catch (e) {
            // On any error, don't suppress — better to alert than miss
            console.log(`[Cooldown] Check failed (${e.message}), sending alert anyway`);
            core.setOutput('suppressed', 'false');
          }

    - name: Send failure alert
      if: steps.policy.outputs.page == 'true' && steps.cooldown.outputs.suppressed != 'true'
      uses: actions/github-script@v7
      env:
        RESEND_API_KEY: ${{ inputs.resend_api_key }}
        OWNER_EMAIL: ${{ inputs.owner_email }}
      with:
        script: |
          const { sendAlert } = require('./scripts/lib/discord-notify.js');
          const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
          const desc = `${{ inputs.description }}` || 'Check the run logs for details.';
          await sendAlert({
            title: `${{ inputs.title }}`,
            description: desc,
            severity: 'error',
            email: ${{ inputs.email }},
            fields: [
              { name: 'Run', value: `[View logs](${runUrl})` }
            ],
            url: runUrl
          }).catch(e => console.error('Alert notification failed:', e.message));
