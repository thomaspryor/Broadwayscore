name: Notify on failure
description: Send email alert when a workflow fails (with 2-hour cooldown per workflow)

inputs:
  title:
    description: Alert title (e.g., "Weekly Grosses Failed")
    required: true
  description:
    description: Optional extra context (action required, likely cause)
    required: false
    default: ''
  severity:
    description: '"critical" sends real-time email (if configured) + logs. Non-critical failures are aggregated in the BSC Daily email digest.'
    required: false
    default: 'low'
  email:
    description: Also send email alert (for critical pipelines)
    required: false
    default: 'false'
  discord_webhook:
    description: 'Unused — kept for backwards compatibility with existing callers.'
    required: false
    default: ''
  resend_api_key:
    description: Resend API key (required if email=true)
    required: false
    default: ''
  owner_email:
    description: Owner email (required if email=true)
    required: false
    default: ''
  cooldown_minutes:
    description: 'Minutes to suppress duplicate alerts for the same workflow (default: 120)'
    required: false
    default: '120'
  min_consecutive_failures:
    description: >-
      Only alert once this many CONSECUTIVE completed runs have failed (default 1 =
      alert on every failure). Set '2' for high-frequency crons (30-45 min cadence)
      whose one-off failures self-resolve on the next run — a single push-contention
      or scraper blip never pages; persistent breakage still does (the next failed
      run alerts). Cancelled/skipped runs don't reset the streak.
    required: false
    default: '1'

outputs:
  suppressed:
    description: >-
      'true' when the alert was suppressed (cooldown or consecutive-failure grace).
      Gate follow-up steps (e.g. investigation dispatch) on this != 'true' so they
      only fire when the failure actually paged.
    value: ${{ steps.cooldown.outputs.suppressed }}

runs:
  using: composite
  steps:
    - name: Check cooldown
      id: cooldown
      if: inputs.severity == 'critical'
      uses: actions/github-script@v7
      with:
        script: |
          const workflowName = context.workflow;
          const cooldownMinutes = parseInt('${{ inputs.cooldown_minutes }}') || 120;
          const minConsecutive = parseInt('${{ inputs.min_consecutive_failures }}') || 1;

          try {
            // context.workflow is the display name (e.g., "Test Suite"), but
            // listWorkflowRuns needs the filename or numeric ID. Extract the
            // filename from the workflow_ref which looks like:
            //   owner/repo/.github/workflows/test.yml@refs/heads/main
            const ref = process.env.GITHUB_WORKFLOW_REF || '';
            const fileMatch = ref.match(/\.github\/workflows\/([^@]+)/);
            const workflowFile = fileMatch ? fileMatch[1] : workflowName;

            if (minConsecutive > 1) {
              // Streak mode (high-frequency crons): page exactly when the streak of
              // consecutive failed runs reaches minConsecutive — one page per streak.
              // A one-off failure that self-resolves on the next run never pages;
              // shorter streak = grace, longer streak = already paged earlier.
              // The time cooldown below is NOT also applied: it counts failures that
              // may never have alerted (the graced first one), so combining the two
              // would suppress every page of a real streak.
              const recent = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: workflowFile,
                status: 'completed',
                per_page: 30,
              }).catch(() => ({ data: { workflow_runs: [] } }));
              // Cancelled/skipped runs say nothing about health — they neither
              // extend nor reset the streak.
              const prior = (recent.data.workflow_runs || [])
                .filter(r => r.id !== context.runId)
                .filter(r => !['cancelled', 'skipped'].includes(r.conclusion))
                .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
              let streak = 1; // this run
              for (const r of prior) {
                if (r.conclusion === 'failure') streak++;
                else break;
              }
              if (streak === minConsecutive) {
                console.log(`[Streak] ${streak} consecutive failure(s) — threshold ${minConsecutive} reached, alerting.`);
                core.setOutput('suppressed', 'false');
              } else {
                const why = streak < minConsecutive
                  ? `first failure in streak — pages if the next run also fails`
                  : `streak already paged when it reached ${minConsecutive}`;
                console.log(`[Streak] ${streak} consecutive failure(s) (threshold ${minConsecutive}) — suppressing: ${why}.`);
                if (process.env.GITHUB_STEP_SUMMARY) {
                  require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY,
                    `\n> ⏳ **Alert suppressed** (${why}).\n`);
                }
                core.setOutput('suppressed', 'true');
              }
              return;
            }

            // Default mode: 2h time cooldown per workflow.
            const cutoff = new Date(Date.now() - cooldownMinutes * 60 * 1000);
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: workflowFile,
              status: 'failure',
              per_page: 5,
              created: `>=${cutoff.toISOString().split('T')[0]}`
            }).catch(() => ({ data: { workflow_runs: [] } }));

            // Count how many failed runs happened in the cooldown window
            const recentFailures = (runs.data.workflow_runs || []).filter(r => {
              const created = new Date(r.created_at);
              return created >= cutoff && r.id !== context.runId;
            });

            if (recentFailures.length > 0) {
              // Another failure already happened in the cooldown window — it would have alerted
              console.log(`[Cooldown] ${recentFailures.length} other failure(s) for "${workflowName}" in last ${cooldownMinutes}min. Suppressing duplicate alert.`);
              core.setOutput('suppressed', 'true');
            } else {
              core.setOutput('suppressed', 'false');
            }
          } catch (e) {
            // On any error, don't suppress — better to alert than miss
            console.log(`[Cooldown] Check failed (${e.message}), sending alert anyway`);
            core.setOutput('suppressed', 'false');
          }

    - name: Send failure alert
      if: inputs.severity == 'critical' && steps.cooldown.outputs.suppressed != 'true'
      uses: actions/github-script@v7
      env:
        RESEND_API_KEY: ${{ inputs.resend_api_key }}
        OWNER_EMAIL: ${{ inputs.owner_email }}
      with:
        script: |
          const { sendAlert } = require('./scripts/lib/discord-notify.js');
          const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
          const desc = `${{ inputs.description }}` || 'Check the run logs for details.';
          await sendAlert({
            title: `${{ inputs.title }}`,
            description: desc,
            severity: 'error',
            email: ${{ inputs.email }},
            fields: [
              { name: 'Run', value: `[View logs](${runUrl})` }
            ],
            url: runUrl
          }).catch(e => console.error('Alert notification failed:', e.message));
