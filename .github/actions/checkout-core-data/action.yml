name: Checkout core data
description: Checks out core data files from private repo into data/

inputs:
  token:
    description: PAT for private repo access
    required: true

runs:
  using: composite
  steps:
    - name: Restore core data cache
      uses: actions/cache/restore@v5
      with:
        path: /tmp/core-data-checkout
        key: core-data-${{ runner.os }}-${{ github.run_id }}
        restore-keys: |
          core-data-${{ runner.os }}-

    - name: Clone or update core data repo
      shell: bash
      env:
        CORE_DATA_TOKEN: ${{ inputs.token }}
      run: |
        MAX_RETRIES=2
        for ATTEMPT in $(seq 1 $MAX_RETRIES); do
          START=$(date +%s)
          SUCCESS=false

          if [ -d "/tmp/core-data-checkout/.git" ]; then
            # Cache restored — fast update via fetch
            cd /tmp/core-data-checkout
            git remote set-url origin "https://x-access-token:${CORE_DATA_TOKEN}@github.com/thomaspryor/broadway-scorecard-data.git"
            if git fetch origin main --depth 1 2>/dev/null && git reset --hard origin/main 2>/dev/null; then
              ELAPSED=$(($(date +%s) - START))
              echo "Core data updated from cache in ${ELAPSED}s (git fetch)"
              SUCCESS=true
            else
              # Fetch failed — fall back to full clone
              echo "::warning::Cache update failed — falling back to full clone"
              cd /tmp
              rm -rf /tmp/core-data-checkout
              if git clone --depth 1 "https://x-access-token:${CORE_DATA_TOKEN}@github.com/thomaspryor/broadway-scorecard-data.git" /tmp/core-data-checkout; then
                ELAPSED=$(($(date +%s) - START))
                echo "Core data cloned fresh in ${ELAPSED}s (fallback)"
                SUCCESS=true
              fi
            fi
          else
            # No cache — full clone
            rm -rf /tmp/core-data-checkout
            if git clone --depth 1 "https://x-access-token:${CORE_DATA_TOKEN}@github.com/thomaspryor/broadway-scorecard-data.git" /tmp/core-data-checkout; then
              ELAPSED=$(($(date +%s) - START))
              echo "Core data cloned fresh in ${ELAPSED}s"
              SUCCESS=true
            fi
          fi

          if [ "$SUCCESS" = "true" ]; then
            break
          elif [ "$ATTEMPT" -lt "$MAX_RETRIES" ]; then
            echo "::warning::Core data checkout failed (attempt $ATTEMPT/$MAX_RETRIES) — retrying in 10s"
            sleep 10
            rm -rf /tmp/core-data-checkout
          else
            echo "::error::Core data checkout failed after $MAX_RETRIES attempts"
            exit 1
          fi
        done

    - name: Copy core data to data/
      shell: bash
      run: |
        # Remove any dangling symlinks in data/ before copying (e.g. reviews.json
        # was previously tracked as a symlink to a local Mac path, which dangles in CI)
        for f in /tmp/core-data-checkout/*.json; do
          basename=$(basename "$f")
          [ -L "data/$basename" ] && rm -f "data/$basename"
        done
        for f in /tmp/core-data-checkout/*.json; do
          [ -f "$f" ] && cp -f "$f" data/
        done
        # Canary check — fail fast if key files missing
        if [ ! -f "data/shows.json" ] || [ ! -f "data/reviews.json" ]; then
          echo "::error::Core data checkout FAILED — shows.json or reviews.json missing"
          exit 1
        fi
        echo "Core data restored from private repo ($(ls /tmp/core-data-checkout/*.json | wc -l) files)"

        # Save a snapshot that survives git checkout -- . in push-with-retry.sh.
        # Some core data files (audience-buzz.json, shows.json, outlet-registry.json)
        # may be tracked in the public repo, and git checkout reverts them to stale
        # versions. This snapshot preserves the private repo's authoritative state.
        rm -rf /tmp/core-data-snapshot
        mkdir -p /tmp/core-data-snapshot
        for f in /tmp/core-data-checkout/*.json; do
          [ -f "$f" ] && cp -f "$f" /tmp/core-data-snapshot/
        done

    - name: Save core data cache
      uses: actions/cache/save@v5
      if: always()
      with:
        path: /tmp/core-data-checkout
        key: core-data-${{ runner.os }}-${{ github.run_id }}
