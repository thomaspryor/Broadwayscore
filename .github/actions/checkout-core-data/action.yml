name: Checkout core data
description: Checks out core data files from private repo into data/

inputs:
  token:
    description: PAT for private repo access
    required: true

runs:
  using: composite
  steps:
    - uses: actions/checkout@v4
      with:
        repository: thomaspryor/broadway-scorecard-data
        token: ${{ inputs.token }}
        path: .core-data-checkout
        fetch-depth: 1

    - name: Copy core data to data/
      shell: bash
      run: |
        for f in .core-data-checkout/*.json; do
          [ -f "$f" ] && cp -f "$f" data/
        done
        # Canary check — fail fast if key files missing
        if [ ! -f "data/shows.json" ] || [ ! -f "data/reviews.json" ]; then
          echo "::error::Core data checkout FAILED — shows.json or reviews.json missing"
          exit 1
        fi
        echo "Core data restored from private repo ($(ls .core-data-checkout/*.json | wc -l) files)"
