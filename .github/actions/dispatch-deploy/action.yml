name: Dispatch deploy
description: Triggers a Vercel production deploy with 15-min dedup to prevent spam

runs:
  using: composite
  steps:
    - name: Dispatch deploy to Vercel
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        # Skip deploy dispatch if one was triggered in the last 15 min (avoids spam)
        # Use the file path — display name resolution returns the workflow
        # twice across paginated workflow listings (2026-05-27 outage).
        # BRO-7766: a pre-warm run (rebuild-fast) may cancel itself without deploying, so it does not count.
        RECENT=$(gh run list --workflow=vercel-deploy.yml --limit=5 --json createdAt,displayTitle -q '[.[] | select(.displayTitle | contains("pre-warm") | not)][0].createdAt // ""' 2>/dev/null || echo "")
        if [ -n "$RECENT" ]; then
          RECENT_TS=$(date -d "$RECENT" +%s 2>/dev/null || date -j -f "%Y-%m-%dT%H:%M:%SZ" "$RECENT" +%s 2>/dev/null || echo "0")
          NOW_TS=$(date +%s)
          DIFF=$((NOW_TS - RECENT_TS))
          if [ "$DIFF" -lt 900 ]; then
            echo "Skipping deploy dispatch — last deploy was ${DIFF}s ago (< 15 min)"
            exit 0
          fi
        fi
        gh workflow run "Deploy to Vercel" || echo "Deploy dispatch failed — will deploy on next schedule"
