name: Setup Playwright
description: Install Playwright browsers with caching. Saves ~15s per workflow run.

inputs:
  browsers:
    description: 'Browsers to install (space-separated, e.g., "chromium" or "chromium webkit")'
    required: false
    default: 'chromium'

runs:
  using: composite
  steps:
    - name: Cache Playwright browsers
      id: playwright-cache
      uses: actions/cache@v5
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ inputs.browsers }}-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

    - name: Install Playwright browsers
      shell: bash
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        log=$(mktemp)
        if [ "${{ steps.playwright-cache.outputs.cache-hit }}" != "true" ]; then
          cmd=(npx playwright install ${{ inputs.browsers }} --with-deps)
        else
          cmd=(npx playwright install-deps ${{ inputs.browsers }})
        fi
        # timeout-minutes isn't supported on composite-action steps, so the
        # `timeout` command is what stops this from silently eating the
        # parent job's entire budget on a hung apt-get/dpkg lock (task #1815).
        # BRO-4480: two attempts, because a stalled download/apt mirror is
        # transient (main run 36892886642 hung 8m once; the next runs were
        # fine). A normal install takes 15-46s. Worst case = 2 x (220s + 15s
        # kill grace) + 30s dpkg recovery = 500s, modelled in
        # tests/unit/data-validation-job-budget.test.mjs.
        # `|| status=$?` is load-bearing: this step runs under `bash -e`, so a
        # bare `status=$?` after a failing command is never reached and the
        # diagnostics below would never print (.github/workflows/CLAUDE.md).
        for attempt in 1 2; do
          status=0
          timeout -k 15 220 "${cmd[@]}" > "$log" 2>&1 || status=$?
          [ "$status" -eq 0 ] && break
          if [ "$status" -eq 124 ] || [ "$status" -eq 137 ]; then
            what="timed out after 220s"
          else
            what="failed (exit $status)"
          fi
          if [ "$attempt" -eq 1 ]; then
            echo "::warning::${cmd[*]} ${what} on attempt 1 — retrying. Output so far:"
            tail -n 40 "$log"
            # A killed install can leave apt/dpkg children holding the dpkg
            # lock; clear them so attempt 2 does not hang on the same lock.
            # `[a]`/`[d]` keep the pattern from matching this command's own
            # `sudo pkill ...` command line (pkill only excludes itself).
            sudo pkill -f '[a]pt-get|[d]pkg' || true
            timeout 30 sudo dpkg --configure -a || true
          else
            echo "::error::${cmd[*]} ${what} on both attempts — full output of attempt 2:"
            cat "$log"
            exit 1
          fi
        done
        tail -n 20 "$log"
