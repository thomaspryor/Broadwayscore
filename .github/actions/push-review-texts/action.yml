name: Push review-texts
description: Commits and pushes review-texts changes to the private repo

inputs:
  token:
    description: PAT for private repo access
    required: true
  message:
    description: Commit message
    required: false
    default: 'data: Update review texts'

runs:
  using: composite
  steps:
    - name: Push review-texts to private repo
      shell: bash
      working-directory: data/review-texts
      env:
        REVIEW_TEXTS_TOKEN: ${{ inputs.token }}
        COMMIT_MSG: ${{ inputs.message }}
      run: |
        # Configure git for this nested repo
        git config user.name "GitHub Action"
        git config user.email "action@github.com"

        # Ensure remote uses the token (actions/checkout may have set it, but be safe)
        git remote set-url origin "https://x-access-token:${REVIEW_TEXTS_TOKEN}@github.com/thomaspryor/broadway-review-texts.git" 2>/dev/null || \
          git remote add origin "https://x-access-token:${REVIEW_TEXTS_TOKEN}@github.com/thomaspryor/broadway-review-texts.git"

        # Stage all changes
        git add -A

        # Check if there are changes to commit
        if git diff --staged --quiet; then
          echo "No review-texts changes to push"
          exit 0
        fi

        # Commit
        CHANGED=$(git diff --staged --stat | tail -1)
        git commit -m "${COMMIT_MSG}" -m "Changed: ${CHANGED}"

        # Push with retry and content-aware conflict resolution
        # Instead of -X theirs (which silently drops local changes), we rebase
        # without auto-resolution, then resolve conflicts by keeping the version
        # with richer content (longer fullText). This prevents a truncated archive
        # snapshot from overwriting a complete review pushed by another workflow.
        for i in 1 2 3 4 5; do
          # Try fast path first: if no conflicts, rebase + push succeeds immediately
          if git pull --rebase origin main 2>&1 && git push origin main 2>&1; then
            echo "Review-texts pushed successfully (attempt $i)"
            exit 0
          fi

          # Rebase hit conflicts — resolve them content-aware
          UNMERGED=$(git diff --name-only --diff-filter=U 2>/dev/null || true)
          if [ -n "$UNMERGED" ]; then
            echo "Resolving conflicts with content-aware merge (attempt $i)..."
            KEPT_OURS=0
            KEPT_THEIRS=0

            while IFS= read -r f; do
              # Handle delete/modify conflicts
              if [ ! -f "$f" ]; then
                git rm "$f" 2>/dev/null || true
                continue
              fi

              # For JSON review files: compare fullText length, keep the richer version
              if [[ "$f" == *.json ]] && [[ "$f" != "failed-fetches.json" ]]; then
                OUR_LEN=0
                THEIR_LEN=0

                # REBASE_HEAD = our commit being replayed, HEAD = remote base
                OUR_CONTENT=$(git show REBASE_HEAD:"$f" 2>/dev/null || echo "")
                THEIR_CONTENT=$(git show HEAD:"$f" 2>/dev/null || echo "")

                if [ -n "$OUR_CONTENT" ]; then
                  OUR_LEN=$(echo "$OUR_CONTENT" | python3 -c "import sys,json;print(len(json.load(sys.stdin).get('fullText','') or ''))" 2>/dev/null || echo "0")
                fi

                if [ -n "$THEIR_CONTENT" ]; then
                  THEIR_LEN=$(echo "$THEIR_CONTENT" | python3 -c "import sys,json;print(len(json.load(sys.stdin).get('fullText','') or ''))" 2>/dev/null || echo "0")
                fi

                if [ "$OUR_LEN" -gt "$THEIR_LEN" ] 2>/dev/null; then
                  git show REBASE_HEAD:"$f" > "$f" 2>/dev/null
                  git add "$f"
                  KEPT_OURS=$((KEPT_OURS + 1))
                  echo "  $f: kept ours (${OUR_LEN} chars > ${THEIR_LEN} chars)"
                else
                  git checkout --theirs "$f" 2>/dev/null || true
                  git add "$f"
                  KEPT_THEIRS=$((KEPT_THEIRS + 1))
                  echo "  $f: kept theirs (${THEIR_LEN} chars >= ${OUR_LEN} chars)"
                fi
              elif [[ "$f" == "failed-fetches.json" ]]; then
                # Merge failed-fetches arrays: union by reviewId, keep newer entries
                # Use temp files to avoid shell quoting issues with JSON content
                git show REBASE_HEAD:"$f" > /tmp/ff_ours.json 2>/dev/null || echo "[]" > /tmp/ff_ours.json
                git show HEAD:"$f" > /tmp/ff_theirs.json 2>/dev/null || echo "[]" > /tmp/ff_theirs.json

                python3 -c "
import json, sys
try:
    with open('/tmp/ff_ours.json') as f: ours = json.load(f)
except: ours = []
try:
    with open('/tmp/ff_theirs.json') as f: theirs = json.load(f)
except: theirs = []
if not isinstance(ours, list): ours = []
if not isinstance(theirs, list): theirs = []
# Index by reviewId — theirs first, then ours overwrites (ours = more recent local state)
merged = {}
for entry in theirs:
    rid = entry.get('reviewId', '')
    if rid: merged[rid] = entry
for entry in ours:
    rid = entry.get('reviewId', '')
    if rid: merged[rid] = entry
result = list(merged.values())
with open('/tmp/ff_merged.json', 'w') as f: json.dump(result, f, indent=2)
print(f'  failed-fetches.json: merged arrays (ours={len(ours)} + theirs={len(theirs)} -> {len(result)} unique)')
" 2>/dev/null

                if [ -f /tmp/ff_merged.json ] && python3 -c "import json; json.load(open('/tmp/ff_merged.json'))" 2>/dev/null; then
                  cp /tmp/ff_merged.json "$f"
                else
                  # Fallback: if merge fails, keep ours (existing behavior)
                  echo "  $f: merge script failed, keeping ours"
                  git show REBASE_HEAD:"$f" > "$f" 2>/dev/null || git checkout --ours "$f" 2>/dev/null
                fi
                rm -f /tmp/ff_ours.json /tmp/ff_theirs.json /tmp/ff_merged.json
                git add "$f"
              else
                # Other non-review files: keep ours
                git checkout --ours "$f" 2>/dev/null || git add "$f"
              fi
            done <<< "$UNMERGED"

            echo "Conflict resolution: kept $KEPT_OURS ours, $KEPT_THEIRS theirs"

            # If all conflicts were resolved by keeping theirs, our commit is empty — skip it
            if git diff --staged --quiet 2>/dev/null && [ "$KEPT_OURS" -eq 0 ]; then
              echo "All conflicts resolved by keeping theirs — skipping our empty commit"
              GIT_EDITOR=true git rebase --skip 2>/dev/null || true
            else
              GIT_EDITOR=true git rebase --continue 2>/dev/null || true
            fi

            if git push origin main 2>&1; then
              echo "Review-texts pushed successfully after content-aware merge (attempt $i)"
              exit 0
            fi
          fi

          echo "Push attempt $i failed, retrying in $((RANDOM % 10 + 5))s..."
          git rebase --abort 2>/dev/null || true
          sleep $((RANDOM % 10 + 5))
        done

        echo "WARNING: Failed to push review-texts after 5 attempts"
        exit 1
