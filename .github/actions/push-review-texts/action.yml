name: Push review-texts
description: Commits and pushes review-texts changes to the private repo

inputs:
  token:
    description: PAT for private repo access
    required: true
  message:
    description: Commit message
    required: false
    default: 'data: Update review texts'

runs:
  using: composite
  steps:
    - name: Push review-texts to private repo
      shell: bash
      working-directory: data/review-texts
      env:
        REVIEW_TEXTS_TOKEN: ${{ inputs.token }}
        COMMIT_MSG: ${{ inputs.message }}
      run: |
        # Configure git for this nested repo
        git config user.name "GitHub Action"
        git config user.email "action@github.com"

        # Ensure remote uses the token (actions/checkout may have set it, but be safe)
        git remote set-url origin "https://x-access-token:${REVIEW_TEXTS_TOKEN}@github.com/thomaspryor/broadway-review-texts.git" 2>/dev/null || \
          git remote add origin "https://x-access-token:${REVIEW_TEXTS_TOKEN}@github.com/thomaspryor/broadway-review-texts.git"

        # SAFETY: Pull remote changes FIRST so we don't overwrite data (e.g., fullText)
        # that was fetched/committed by other processes while local changes were pending.
        git pull --rebase origin main -q 2>/dev/null || true

        # Stage all changes
        git add -A

        # Check if there are changes to commit
        if git diff --staged --quiet; then
          echo "No review-texts changes to push"
          exit 0
        fi

        # Protect scored/collected review data: for any staged review-text JSON where
        # local is missing fields that the committed version has, restore them.
        # This prevents any workflow from accidentally wiping scores, fullText, or metadata.
        node -e "
          const fs = require('fs');
          const { execSync } = require('child_process');
          // KEEP IN SYNC with scripts/lib/review-write-guard.js PROTECTED_FIELDS
          // and scripts/lib/restore-protected-fields.js MANUAL_FIELDS
          const PROTECTED = [
            'assignedScore', 'llmScore', 'llmMetadata', 'fullText', 'contentTier',
            'contentTierReason', 'contentVerification', 'ensembleData', 'tierReason',
            'showTitle', 'textFetchedAt', 'textWordCount', 'textStatus', 'sourceMethod',
            'isFullReview', 'wrongFullText', 'wrongShow', 'wrongShowReason', 'wrongProduction',
            'wrongProductionNote', 'incompleteReason', 'incompleteDetail',
            'originalScoreCleared', 'originalScoreClearedReason', 'previousOriginalScore',
            'humanReviewScore', 'humanReviewNote', 'humanReviewedWrongProduction',
            'humanReviewedWrongArticle',
            'wrongProductionManualClear', 'wrongArticleManualClear', 'wrongShowManualClear',
            'wrongProductionOverride', 'wrongShowOverride', 'wrongShowNote',
            'wrongShowAutoCleared', 'wrongProductionAutoCleared',
            'wrongProductionAutoClearedAt', 'wrongProductionReason', 'wrongAttribution',
            'manualContentTier',
            'designation', 'isCriticsPick', 'originalScore', 'duplicateOf', 'duplicateReason',
            'publishDateVerified', 'publishDateSource',
            // Opening-night manual-ingest overrides (Beaches 2026-04-22 postmortem #6)
            'allowEarlyDate', 'allowLateDate', 'allowCrossMarket',
            'allowTourSignal', 'allowFilmSignal', 'routedFromShowId',
            // Per-file protection array — keeps ingest-manual-review's fields locked
            'protectedFields',
            // SERP retry state — losing these on rebase resets the cooldown backoff
            'serpRetryAfter', 'serpRetryCount', 'serpDiscoveryAbandoned', 'wrongShowRetryAt'
          ];
          const staged = execSync('git diff --cached --name-only', { encoding: 'utf8' }).trim().split('\n').filter(Boolean);
          let restored = 0;
          let scoreSaves = 0;
          for (const f of staged) {
            if (!f.endsWith('.json') || f.includes('failed-fetches')) continue;
            try {
              const local = JSON.parse(fs.readFileSync(f, 'utf8'));
              const committed = JSON.parse(execSync('git show HEAD:' + f, { encoding: 'utf8', stdio: ['pipe','pipe','pipe'] }));
              const restoredFields = [];
              for (const field of PROTECTED) {
                if (committed[field] !== undefined && committed[field] !== null && (local[field] === undefined || local[field] === null)) {
                  local[field] = committed[field];
                  restoredFields.push(field);
                  if (field === 'assignedScore') scoreSaves++;
                }
              }
              if (restoredFields.length > 0) {
                fs.writeFileSync(f, JSON.stringify(local, null, 2) + '\n');
                restored++;
                console.log('  Protected: ' + f + ' (' + restoredFields.join(', ') + ')');
              }
            } catch (e) { /* new file or parse error — skip */ }
          }
          if (restored > 0) console.log('Protected ' + restored + ' review(s) from data loss (' + scoreSaves + ' scores saved)');
        " || true

        # Re-stage after protection pass
        git add -A
        if git diff --staged --quiet; then
          echo "No review-texts changes to push (all changes were stale)"
          exit 0
        fi

        # Commit
        CHANGED=$(git diff --staged --stat | tail -1)
        git commit -m "${COMMIT_MSG}" -m "Changed: ${CHANGED}"

        # Push with retry and content-aware conflict resolution
        # Instead of -X theirs (which silently drops local changes), we rebase
        # without auto-resolution, then resolve conflicts by keeping the version
        # with richer content (longer fullText). This prevents a truncated archive
        # snapshot from overwriting a complete review pushed by another workflow.
        for i in 1 2 3 4 5; do
          # Try fast path first: if no conflicts, rebase + push succeeds immediately
          if git pull --rebase origin main 2>&1 && git push origin main 2>&1; then
            echo "Review-texts pushed successfully (attempt $i)"
            exit 0
          fi

          # Rebase hit conflicts — resolve them content-aware
          UNMERGED=$(git diff --name-only --diff-filter=U 2>/dev/null || true)
          if [ -n "$UNMERGED" ]; then
            echo "Resolving conflicts with content-aware merge (attempt $i)..."
            KEPT_OURS=0
            KEPT_THEIRS=0

            while IFS= read -r f; do
              # Handle delete/modify conflicts
              if [ ! -f "$f" ]; then
                git rm "$f" 2>/dev/null || true
                continue
              fi

              # For JSON review files: compare fullText length, keep the richer version
              if [[ "$f" == *.json ]] && [[ "$f" != "failed-fetches.json" ]]; then
                OUR_LEN=0
                THEIR_LEN=0

                # REBASE_HEAD = our commit being replayed, HEAD = remote base
                OUR_CONTENT=$(git show REBASE_HEAD:"$f" 2>/dev/null || echo "")
                THEIR_CONTENT=$(git show HEAD:"$f" 2>/dev/null || echo "")

                if [ -n "$OUR_CONTENT" ]; then
                  OUR_LEN=$(echo "$OUR_CONTENT" | python3 -c "import sys,json;print(len(json.load(sys.stdin).get('fullText','') or ''))" 2>/dev/null || echo "0")
                fi

                if [ -n "$THEIR_CONTENT" ]; then
                  THEIR_LEN=$(echo "$THEIR_CONTENT" | python3 -c "import sys,json;print(len(json.load(sys.stdin).get('fullText','') or ''))" 2>/dev/null || echo "0")
                fi

                if [ "$OUR_LEN" -gt "$THEIR_LEN" ] 2>/dev/null; then
                  git show REBASE_HEAD:"$f" > "$f" 2>/dev/null
                  git add "$f"
                  KEPT_OURS=$((KEPT_OURS + 1))
                  echo "  $f: kept ours (${OUR_LEN} chars > ${THEIR_LEN} chars)"
                else
                  git checkout --theirs "$f" 2>/dev/null || true
                  git add "$f"
                  KEPT_THEIRS=$((KEPT_THEIRS + 1))
                  echo "  $f: kept theirs (${THEIR_LEN} chars >= ${OUR_LEN} chars)"
                fi
              elif [[ "$f" == "failed-fetches.json" ]]; then
                # Merge failed-fetches arrays: union by reviewId, keep newer (ours) entries
                git show REBASE_HEAD:"$f" > /tmp/ff_ours.json 2>/dev/null || echo "[]" > /tmp/ff_ours.json
                git show HEAD:"$f" > /tmp/ff_theirs.json 2>/dev/null || echo "[]" > /tmp/ff_theirs.json
                OURS_CT=$(jq 'if type == "array" then length else 0 end' /tmp/ff_ours.json 2>/dev/null || echo 0)
                THEIRS_CT=$(jq 'if type == "array" then length else 0 end' /tmp/ff_theirs.json 2>/dev/null || echo 0)
                # Concat theirs+ours (ours last = wins on duplicate), group by reviewId, keep last
                if jq -n --slurpfile ours /tmp/ff_ours.json --slurpfile theirs /tmp/ff_theirs.json '(($theirs[0] // []) + ($ours[0] // [])) | group_by(.reviewId) | map(last)' > /tmp/ff_merged.json 2>/dev/null; then
                  cp /tmp/ff_merged.json "$f"
                  MERGED_CT=$(jq 'length' /tmp/ff_merged.json 2>/dev/null || echo "?")
                  echo "  $f: merged arrays (ours=$OURS_CT + theirs=$THEIRS_CT -> $MERGED_CT unique)"
                else
                  echo "  $f: jq merge failed, keeping ours"
                  git show REBASE_HEAD:"$f" > "$f" 2>/dev/null || git checkout --ours "$f" 2>/dev/null
                fi
                rm -f /tmp/ff_ours.json /tmp/ff_theirs.json /tmp/ff_merged.json
                git add "$f"
              else
                # Other non-review files: keep ours
                git checkout --ours "$f" 2>/dev/null || git add "$f"
              fi
            done <<< "$UNMERGED"

            echo "Conflict resolution: kept $KEPT_OURS ours, $KEPT_THEIRS theirs"

            # If all conflicts were resolved by keeping theirs, our commit is empty — skip it
            if git diff --staged --quiet 2>/dev/null && [ "$KEPT_OURS" -eq 0 ]; then
              echo "All conflicts resolved by keeping theirs — skipping our empty commit"
              GIT_EDITOR=true git rebase --skip 2>/dev/null || true
            else
              GIT_EDITOR=true git rebase --continue 2>/dev/null || true
            fi

            # After rebase, restore any manually-set correction fields (humanReviewScore,
            # manualContentTier, etc.) that content-length resolution may have dropped.
            # These fields are ONLY set by humans — always safe to merge from either side.
            if command -v node &>/dev/null; then
              RESTORED=$(node ../../scripts/lib/restore-protected-fields.js "origin/main" 2>&1 | tail -1)
              if [ "$RESTORED" -gt 0 ] 2>/dev/null; then
                echo "  Restored protected fields in $RESTORED file(s) after conflict resolution"
                git add -A
                git commit --amend --no-edit 2>/dev/null || true
              fi
            fi

            if git push origin main 2>&1; then
              echo "Review-texts pushed successfully after content-aware merge (attempt $i)"
              exit 0
            fi
          fi

          echo "Push attempt $i failed, retrying in $((RANDOM % 10 + 5))s..."
          git rebase --abort 2>/dev/null || true
          sleep $((RANDOM % 10 + 5))
        done

        echo "WARNING: Failed to push review-texts after 5 attempts"
        exit 1
