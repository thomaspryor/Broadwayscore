<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <!-- Profitability Scorecard link-preview template (BRO-6149). Rendered at 1200x630 by
       scripts/generate-biz-og-images.js, which passes ?kicker=&title=&sub=. -->
  <style>
    @font-face {
      font-family: 'InterVar';
      src: url('../fonts/Inter-latin-var.3100e775.woff2') format('woff2');
      font-weight: 100 900;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1200px; height: 630px; overflow: hidden;
      background:
        radial-gradient(900px 520px at 100% 0%, rgba(212,165,116,0.20), transparent 70%),
        radial-gradient(700px 420px at 0% 100%, rgba(212,165,116,0.08), transparent 70%),
        #0f0f14;
      font-family: 'InterVar', Inter, system-ui, sans-serif;
      color: #fff;
      position: relative;
    }
    .frame { position: absolute; inset: 0; padding: 64px 72px 56px; display: flex; flex-direction: column; }
    .top { display: flex; align-items: center; justify-content: space-between; }
    .brand { font-size: 28px; font-weight: 800; letter-spacing: -0.01em; }
    .brand .b { color: #d4a574; }
    .kicker {
      font-size: 22px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: #d4a574;
      border: 2px solid rgba(212,165,116,0.45); border-radius: 999px; padding: 8px 20px;
    }
    .main { flex: 1; display: flex; flex-direction: column; justify-content: center; }
    h1 { text-wrap: balance; font-weight: 800; letter-spacing: -0.03em; line-height: 1.04; max-width: 1040px; }
    .sub { margin-top: 26px; font-size: 32px; line-height: 1.3; color: #9ca3af; max-width: 1000px; font-weight: 500; }
    .ladder { display: flex; gap: 10px; }
    .tier {
      flex: 1 1 auto; border-radius: 14px; padding: 16px 8px 14px; text-align: center;
      font-size: 21px; font-weight: 700; background: #1a1a24; border: 2px solid; white-space: nowrap;
    }
    .tier i { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 8px; background: currentColor; vertical-align: 1px; }
    .t1 { color: #facc15; border-color: rgba(250,204,21,0.45); }
    .t2 { color: #34d399; border-color: rgba(52,211,153,0.45); }
    .t3 { color: #a3e635; border-color: rgba(163,230,53,0.45); }
    .t4 { color: #22d3ee; border-color: rgba(34,211,238,0.45); }
    .t5 { color: #fb923c; border-color: rgba(251,146,60,0.45); }
    .t6 { color: #f87171; border-color: rgba(248,113,113,0.45); }
    .foot { margin-top: 26px; display: flex; justify-content: space-between; font-size: 24px; color: #6b7280; font-weight: 600; }
  </style>
</head>
<body>
  <div class="frame">
    <div class="top">
      <div class="brand"><span class="b">Broadway</span> Scorecard</div>
      <div class="kicker" id="kicker">Profitability Scorecard</div>
    </div>
    <div class="main">
      <h1 id="title"></h1>
      <p class="sub" id="sub"></p>
    </div>
    <div class="ladder">
      <div class="tier t1"><i></i>Miracle</div>
      <div class="tier t2"><i></i>Windfall</div>
      <div class="tier t3"><i></i>Easy Winner</div>
      <div class="tier t4"><i></i>Trickle</div>
      <div class="tier t5"><i></i>Fizzle</div>
      <div class="tier t6"><i></i>Flop</div>
    </div>
    <div class="foot"><span>broadwayscorecard.com/biz</span><span>Recoupment, show by show</span></div>
  </div>
  <script>
    var q = new URLSearchParams(location.search);
    var title = q.get('title') || 'Broadway Profitability Scorecard';
    document.getElementById('kicker').textContent = q.get('kicker') || 'Profitability Scorecard';
    var h = document.getElementById('title');
    h.textContent = title;
    h.style.fontSize = (title.length > 38 ? 68 : 84) + 'px';
    document.getElementById('sub').textContent = q.get('sub') || '';
  </script>
</body>
</html>
