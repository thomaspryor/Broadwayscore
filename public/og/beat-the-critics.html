<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1200px;
      height: 630px;
      background: linear-gradient(135deg, #1a0a12 0%, #0f0f1a 60%, #0a0a18 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, sans-serif;
      position: relative;
      overflow: hidden;
    }
    body::before {
      content: '';
      position: absolute;
      top: -200px;
      left: 50%;
      transform: translateX(-50%);
      width: 800px;
      height: 800px;
      background: radial-gradient(ellipse, rgba(255,19,104,0.12) 0%, transparent 65%);
      pointer-events: none;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: rgba(255,19,104,0.12);
      border: 1px solid rgba(255,19,104,0.3);
      border-radius: 100px;
      padding: 10px 28px;
      margin-bottom: 32px;
    }
    .badge-star { font-size: 22px; }
    .badge-text {
      font-size: 22px;
      font-weight: 700;
      color: #ff1368;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .title {
      font-size: 96px;
      font-weight: 900;
      color: #ffffff;
      text-align: center;
      line-height: 1.0;
      letter-spacing: -2px;
    }
    .title .highlight {
      color: #ff1368;
    }
    .title .tm {
      font-size: 28px;
      vertical-align: super;
      color: #ff1368;
      font-weight: 700;
    }
    .subtitle {
      font-size: 32px;
      color: #9ca3af;
      margin-top: 24px;
      text-align: center;
      max-width: 800px;
      line-height: 1.4;
    }
    .meta {
      display: flex;
      align-items: center;
      gap: 32px;
      margin-top: 48px;
    }
    .pill {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 100px;
      padding: 10px 24px;
      font-size: 22px;
      color: #d1d5db;
      font-weight: 600;
    }
    .brand {
      font-size: 26px;
      color: #6b7280;
      margin-top: 40px;
    }
    .brand .highlight { color: #d4a84b; }
  </style>
</head>
<body>
  <div class="badge">
    <span class="badge-star">⭐</span>
    <span class="badge-text">Tony Awards 2026</span>
  </div>
  <div class="title">
    Beat the <span class="highlight">Critics</span><span class="tm">™</span>
  </div>
  <div class="subtitle">Pick the Tony winners and see how you stack up against top critics</div>
  <div class="meta">
    <div class="pill">🎟️ Win $100 TodayTix</div>
    <div class="pill">June 7 Ceremony</div>
    <div class="pill">4 Rounds · 18 Categories</div>
  </div>
  <div class="brand">
    <span class="highlight">Broadway</span>Scorecard
  </div>
</body>
</html>
