<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1200px;
      height: 630px;
      background: linear-gradient(135deg, #1a1a2e 0%, #0f0f1a 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .trophy {
      font-size: 80px;
      margin-bottom: 16px;
    }
    .title {
      font-size: 72px;
      font-weight: bold;
      color: #ffffff;
      text-align: center;
    }
    .gold { color: #d4a84b; }
    .subtitle {
      font-size: 36px;
      color: #9ca3af;
      margin-top: 20px;
      text-align: center;
    }
    .brand {
      font-size: 30px;
      color: #6b7280;
      margin-top: 40px;
    }
    .brand .highlight { color: #d4a84b; }
  </style>
</head>
<body>
  <div class="trophy">🏆</div>
  <div class="title">
    <span class="gold">Tony Awards</span> Leaderboard
  </div>
  <div class="subtitle">All-time winners &amp; nominees ranked by data</div>
  <div class="brand">
    <span class="highlight">Broadway</span>Scorecard
  </div>
</body>
</html>
