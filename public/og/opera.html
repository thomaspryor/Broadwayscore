<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1200px;
      height: 630px;
      background: linear-gradient(135deg, #1a1a2e 0%, #0f0f1a 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .title {
      font-size: 108px;
      font-weight: bold;
    }
    .opera { color: #ffffff; }
    .scorecard {
      background: linear-gradient(135deg, #d4a574 0%, #b8956a 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .tagline {
      font-size: 42px;
      color: #9ca3af;
      margin-top: 24px;
    }
    .url {
      font-size: 36px;
      color: #6b7280;
      margin-top: 50px;
    }
  </style>
</head>
<body>
  <div class="title">
    <span class="opera">Opera</span><span class="scorecard">Scorecard</span>
  </div>
  <div class="tagline">Every Met production. Every critic. One score.</div>
  <div class="url">operascorecard.com</div>
</body>
</html>
